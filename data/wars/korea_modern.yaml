    - {label: 북한, polities: ["Democratic People's Republic of Korea"]}
  cause: 북한이 소련과 중국의 지원을 약속받고 38도선 전역에서 기습 남침했어요. 미국은 그해 1월 한반도를 태평양 방위선에서 제외한다고 발표했었어요(애치슨 선언).
  result: 북한군이 3일 만에 서울을 점령하고 낙동강까지 내려왔지만, 유엔군의 참전으로 국군과 유엔군이 낙동강 방어선을 지켜 냈어요.
  x: "춘천에서는 국군 제6사단이 사흘 동안 북한군을 붙잡아 두었지만, 서울에서는 한강 다리가 일찍 폭파되는 바람에 많은 시민이 피란길에 오르지 못했어요. 유엔 안전 보장 이사회가 북한의 공격을 침략으로 보고 유엔군을 보내기로 하자, 맨 먼저 들어온 미군 스미스 부대가 오산 죽미령에서 북한군과 처음 맞붙었어요. 정부는 대전과 대구를 거쳐 부산으로 옮겨 갔고, 국군과 유엔군은 칠곡 다부동 등에서 버티며 반격의 발판을 마련했어요."
  battles:
