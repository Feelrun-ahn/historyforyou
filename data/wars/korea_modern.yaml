  result: 여러 전투에서 이겼지만 일본군의 대규모 토벌과 중국군의 갈등으로 1930년대 중반 이후 많은 독립군이 중국 관내로 옮겼어요.
  x: "남만주에서는 양세봉의 조선 혁명군이 중국 의용군과 함께 영릉가와 흥경성에서, 북만주에서는 지청천의 한국 독립군이 중국 호로군과 함께 쌍성보와 대전자령에서 일본군과 싸웠어요. 특히 대전자령에서는 골짜기에 매복해 지나가던 일본군을 크게 무찌르고 많은 군수품을 얻었어요. 중일 전쟁 뒤 중국 관내에서는 김원봉 중심의 조선 의용대(1938)가 만들어졌고, 한국 독립군을 이끌던 지청천은 1940년 창설된 한국광복군의 총사령관이 되었어요."
  battles:
    - {name: 영릉가 전투, date: 1932년, year: 1932, at: [125.0, 41.76], winner: 0, imp: 2, approx: true,
       note: '양세봉의 조선 혁명군이 중국 의용군과 함께 남만주의 영릉가에서 일본군·만주국군을 물리쳤어요.'}
    - {name: 쌍성보 전투, date: 1932년 9월, year: 1932, at: [126.3, 45.35], winner: 0, imp: 2, approx: true,
       note: '지청천의 한국 독립군이 중국 호로군과 함께 북만주의 쌍성보를 공격해 승리했어요.'}
    - {name: 흥경성 전투, date: 1933년 6월, year: 1933, at: [125.04, 41.73], winner: null, imp: 1, approx: true,
       note: '일본군이 흥경으로 쳐들어오자 조선 혁명군이 중국군과 함께 맞섰어요. 조선 혁명군은 기습으로 일본군을 막았지만 흥경성을 지키던 중국군은 패해 물러났어요(흔히 승리로 소개되지만 기록이 엇갈려요).'}
    - {name: 대전자령 전투, date: 1933년 6월 ~ 7월, year: 1933, at: [129.75, 43.25], winner: 0, imp: 3, approx: true,
