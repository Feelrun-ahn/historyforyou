# ───────────── 조선 후기 ─────────────
- id: hong-gyeongnae
  group: 조선 후기 농민 봉기
  name: 홍경래의 난 (1811~1812)
  en: Hong Gyeong-nae's Rebellion
  years: [1811, 1812]
  period: 1811년 음력 12월 ~ 1812년 음력 4월
  sides:
    - {label: 봉기군 (홍경래 등), polities: []}
    - {label: 관군 (조선 정부), polities: []}
  cause: 서북 지방(평안도) 사람에 대한 뿌리 깊은 차별과 세도 정권의 수탈에 맞서, 몰락 양반 홍경래와 신흥 상공업자들이 농민·광산 노동자와 함께 봉기했어요.
  result: 한때 청천강 이북의 대부분을 차지했지만 관군에 밀려 정주성에서 넉 달 가까이 버티다 진압됐어요. 19세기에 처음 일어난 대규모 농민 봉기예요.
  x: "평안도는 청과의 무역로에 있어 상공업이 발달했지만 수탈이 심했고, 이곳 출신은 과거에 붙어도 좋은 관직에 오르기 어려웠어요. 가산에서 일어난 봉기군은 열흘 남짓 만에 청천강 이북의 여러 고을을 차지했지만, 남쪽으로 나아가다 송림에서 관군에게 지고 정주성으로 들어가 버텼어요. 관군이 성 밑에 굴을 파고 화약을 터뜨려 성을 무너뜨리면서 진압되었지만, 이 봉기는 1862년 임술 농민 봉기 등 이후의 농민 봉기에 큰 영향을 주었어요."
  battles:
    - {name: 가산 봉기, date: 1811년 음력 12월 18일, year: 1811, at: [125.62, 39.73], winner: null, imp: 2, approx: true, event: true,
       note: '홍경래가 평서 대원수를 자처하며 평안도 가산에서 봉기했어요. 열흘 남짓 만에 청천강 이북의 여러 고을을 차지했어요.'}
    - {name: 송림 전투, date: 1811년 음력 12월 29일, year: 1811, at: [125.58, 39.66], winner: 1, imp: 1, approx: true,
       note: '남쪽으로 나아가던 봉기군이 박천 송림에서 관군에게 크게 지고 정주성으로 물러났어요.'}
    - {name: 정주성 함락, date: 1812년 음력 4월 19일, year: 1812, at: [125.32, 39.69], winner: 1, imp: 2, approx: true,
       note: '관군이 성 밑에 굴을 파고 화약을 터뜨려 정주성을 함락했어요. 홍경래는 전사했어요.'}

# ───────────── 개항기 ─────────────
- id: byeongin-yangyo
  group: 서양 열강의 침략
  name: 병인양요 (1866)
  en: French campaign against Korea (1866)
  years: [1866, 1866]
  period: 1866년 음력 9월 ~ 10월
  sides:
    - {label: 조선, polities: [Joseon]}
    - {label: 프랑스, polities: ['(Second French Empire)']}
  cause: 흥선 대원군이 프랑스 선교사 9명을 처형한 병인박해를 구실로, 프랑스 함대가 통상을 요구하며 강화도를 침략했어요. 이에 앞서 음력 8월에는 군함 3척이 한강 양화진까지 올라와 물길을 살폈어요.
  result: 한성근(문수산성)과 양헌수(정족산성)의 조선군이 맞서자 프랑스군은 한 달여 만에 물러났어요. 물러나면서 외규장각 도서를 약탈해 갔어요.
  x: "프랑스 함대는 갑곶에 상륙해 강화부를 점령했고, 한성근은 김포 문수산성에서 맞섰어요. 양헌수는 밤에 몰래 강화해협을 건너 정족산성에 들어가 프랑스군을 물리쳤고, 프랑스군은 물러나면서 외규장각을 불태우고 의궤 등 도서와 은괴를 빼앗아 갔어요. 약탈당한 외규장각 의궤는 2011년 영구 임대 방식으로 돌아왔어요. 이 전쟁을 겪은 흥선 대원군은 통상 수교 거부 정책을 더욱 굳혔어요."
  battles:
    - {name: 강화부 점령, date: 1866년 음력 9월 8일, year: 1866, at: [126.49, 37.75], winner: 1, imp: 2,
       note: '갑곶에 상륙한 프랑스군이 강화부를 점령했어요.'}
    - {name: 문수산성 전투, date: 1866년 음력 9월 18일, year: 1866, at: [126.56, 37.73], winner: 1, imp: 1, approx: true,
       note: '한성근이 이끈 조선군이 김포 문수산성에서 프랑스군과 싸웠어요.'}
    - {name: 정족산성 전투, date: 1866년 음력 10월 3일, year: 1866, at: [126.47, 37.62], winner: 0, imp: 3, approx: true,
       note: '양헌수가 이끈 조선군이 밤에 강화해협을 건너 정족산성에 들어가 프랑스군을 물리쳤어요.'}
    - {name: 프랑스군 철수 (외규장각 도서 약탈), date: 1866년 음력 10월 초, year: 1866, at: [126.48, 37.75], winner: 0, imp: 2, event: true,
       note: '프랑스군이 물러나면서(음력 10월 4~5일 무렵) 강화도 외규장각을 불태우고 의궤 등 도서와 은괴를 약탈했어요. 의궤는 2011년 영구 임대 방식으로 돌아왔어요.'}

- id: sinmi-yangyo
  group: 서양 열강의 침략
  name: 신미양요 (1871)
  en: United States expedition to Korea (1871)
  years: [1871, 1871]
  period: 1871년 음력 4월 ~ 5월
  sides:
    - {label: 조선, polities: [Joseon]}
    - {label: 미국, polities: [United States of America]}
  cause: 제너럴셔먼호 사건을 구실로 미국 아시아 함대가 통상을 요구하며 강화도를 침략했어요.
  result: 미군이 초지진·덕진진·광성보를 차지했지만 조선이 통상 요구에 응하지 않자 물러났어요. 흥선 대원군은 전국에 척화비를 세웠어요.
  x: "허락 없이 강화해협 손돌목으로 들어오는 미국 함대에 조선 포대가 포격하자, 미군은 초지진에 상륙하고 덕진진까지 차지한 뒤 광성보를 공격했어요. 어재연이 이끈 조선군은 성안으로 들어온 미군과 맞붙어 끝까지 싸웠고, 어재연을 비롯한 많은 군사가 전사했으며 미군은 어재연의 '수(帥)' 자 깃발을 빼앗아 갔어요. 전사자 수는 미군 기록과 조선 기록이 크게 다르지만, 조선은 미군이 물러가자 이를 물리친 것으로 받아들여 서양을 배척하는 분위기가 더욱 높아졌어요."
  battles:
    - {name: 손돌목 포격전, date: 1871년 음력 4월 14일, year: 1871, at: [126.52, 37.67], winner: null, imp: 1, approx: true,
       note: '허락 없이 강화해협(손돌목)으로 들어오는 미국 함대에 조선 포대가 포격을 했어요.'}
    - {name: 초지진 상륙, date: 1871년 음력 4월 23일, year: 1871, at: [126.52, 37.64], winner: 1, imp: 1,
       note: '미군이 초지진에 상륙해 점령했어요.'}
    - {name: 광성보 전투, date: 1871년 음력 4월 24일, year: 1871, at: [126.51, 37.69], winner: 1, imp: 3,
       note: '덕진진에 이어 광성보를 공격한 미군에 맞서 어재연이 이끈 조선군이 끝까지 싸우다 많은 군사가 전사했어요.'}
    - {name: 미국 함대 철수, date: 1871년 음력 5월 16일, year: 1871, at: [126.55, 37.5], winner: 0, imp: 2, approx: true, event: true,
       note: '조선이 끝내 협상에 응하지 않자 미국 함대가 물러났어요.'}

- id: donghak-1
  group: 동학 농민 운동
  name: 동학 농민 운동 1차 봉기 (1894)
  en: Donghak Peasant Revolution — first uprising
  years: [1894, 1894]
  period: 1894년 음력 1월 ~ 5월
  sides:
    - {label: 동학 농민군, polities: []}
    - {label: 관군 (조선 정부), polities: []}
  cause: 고부 군수 조병갑의 횡포에 맞선 고부 농민 봉기를 수습하러 온 관리가 오히려 농민을 탄압하자, 전봉준 등이 '보국안민'과 '제폭구민'을 내걸고 다시 일어났어요.
  result: 농민군은 황토현과 황룡촌에서 관군을 물리치고 전주성을 차지했어요. 청과 일본이 군대를 보내자 정부와 전주 화약을 맺고 전라도 각지에 집강소를 두어 폐정 개혁을 실천했어요.
  x: "개항 뒤 세금 부담과 관리들의 수탈에 외국 상인들의 침탈까지 겹쳐 살기 힘들어진 농민들 사이에서, 사람은 모두 평등하다고 가르치고 외세를 물리치자고 한 동학이 빠르게 퍼졌어요. 고부 관아를 습격하고 만석보를 허문 농민들은 무장에서 다시 일어나 백산에 모여 4대 강령과 격문을 발표했어요. 1차 봉기가 탐관오리와 지배층의 수탈에 맞선 성격이 강했다면, 일본군이 경복궁을 점령한 뒤 일어난 2차 봉기는 일본을 몰아내려는 성격이 두드러져요."
  battles:
