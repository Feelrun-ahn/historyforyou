  result: 서울을 되찾고 38도선을 넘어 평양을 차지한 뒤 압록강과 두만강 가까이까지 올라갔어요.
  x: "9월 15일 맥아더가 지휘한 유엔군이 인천에 상륙해 북한군의 보급로를 끊으면서 전세가 뒤집혔어요. 국군과 유엔군은 9월 28일 서울을 되찾았고, 10월 1일 국군이 동해안에서 처음 38도선을 넘었는데 이날을 국군의 날로 정했어요. 10월 26일 국군의 한 부대가 압록강 가의 초산에 이르러 통일이 눈앞에 온 듯했지만, 이미 중국군이 몰래 압록강을 건너오고 있었어요."
  battles:
