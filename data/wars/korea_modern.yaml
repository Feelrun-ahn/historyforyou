- id: donghak-2
  group: 동학 농민 운동
  name: 동학 농민 운동 2차 봉기 (1894)
  en: Donghak Peasant Revolution — second uprising
  years: [1894, 1894]
  period: 1894년 음력 9월 ~ 12월
  sides:
    - {label: 동학 농민군, polities: []}
    - {label: 일본군·관군, polities: [Empire of Japan]}
  cause: 일본군이 경복궁을 점령하고 청일 전쟁을 일으켜 내정에 간섭하자, 농민군이 일본군을 몰아내려고 다시 일어났어요.
  result: 남접(전봉준)과 북접(손병희)이 논산에 모여 서울로 올라가려 했지만, 신식 무기를 가진 일본군과 관군에게 공주 우금치에서 크게 졌어요. 전봉준 등 지도자가 체포되며 동학 농민 운동이 끝났어요.
  x: "삼례에서 다시 일어난 전봉준의 남접에, 처음엔 무장 봉기를 꺼리던 북접도 손병희의 지휘로 힘을 보탰어요. 우금치 고개에서 농민군은 수십 차례나 돌격했지만 기관총과 대포 앞에 많은 사람이 쓰러졌어요. 순창 피노리에 숨어 있던 전봉준은 붙잡혀 이듬해 서울에서 처형되었지만, 농민군이 요구한 개혁 가운데 일부는 갑오개혁에 반영되었어요."
  battles:
