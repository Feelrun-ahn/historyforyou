       note: '전봉준이 농민들과 함께 고부 관아를 습격하고 조병갑이 억지로 만든 만석보를 허물었어요.'}
    - {name: 무장 봉기, date: 1894년 음력 3월 20일, year: 1894, at: [126.57, 35.43], winner: null, imp: 2, approx: true, event: true,
