  result: 국군과 유엔군은 평양을 내주고 흥남에서 바다로 철수했으며, 1951년 1월 4일 서울을 다시 빼앗기고 평택~삼척 선까지 물러났어요.
  x: "중국군은 운산에서 처음으로 국군과 미군을 공격해 크게 이겼고, 동부 전선의 장진호에서는 중국군에 포위된 미 해병대 등이 영하 30도의 추위 속에 포위를 뚫고 흥남으로 물러났어요. 흥남 부두에서는 군인 약 10만 5천 명과 함께 피란민 약 9만 1천 명이 배를 타고 남쪽으로 떠났어요. 1·4 후퇴 때도 수많은 피란민이 남쪽으로 내려갔고, 피란길에서 헤어진 가족들의 아픔은 오늘날까지 이어지고 있어요."
