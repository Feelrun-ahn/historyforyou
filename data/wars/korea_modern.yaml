       note: '중국군에게 포위된 미 해병대 등이 영하 30도의 추위 속에서 포위를 뚫고 흥남으로 철수했어요.'}
    - {name: 흥남 철수, date: 1950년 12월 15일 ~ 24일, year: 1950, at: [127.62, 39.83], winner: null, imp: 2, event: true,
