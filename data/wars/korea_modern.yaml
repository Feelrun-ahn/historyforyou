    - {name: 우금치 전투, date: 1894년 음력 11월 9일, year: 1894, at: [127.13, 36.43], winner: 1, imp: 3, approx: true,
       note: '공주 우금치 고개를 넘으려던 농민군이 일본군과 관군의 기관총·대포에 맞서 수십 차례 돌격했지만 크게 졌어요.'}
    - {name: 전봉준 체포, date: 1894년 음력 12월 2일, year: 1894, at: [127.13, 35.4], winner: 1, imp: 2, approx: true, event: true,
       note: '순창 피노리에 숨어 있던 전봉준이 붙잡혔어요. 이듬해 서울에서 처형됐어요.'}

- id: sino-japanese
  group: 청일 전쟁
  name: 청일 전쟁 (1894~1895)
  en: First Sino-Japanese War
  years: [1894, 1895]
  period: 1894년 음력 6월 ~ 1895년 음력 3월
  sides:
    - {label: 청, polities: [Qing Dynasty]}
    - {label: 일본, polities: [Empire of Japan]}
  cause: 동학 농민 운동을 계기로 조선에 들어온 청과 일본 가운데, 일본이 경복궁을 점령하고 아산만의 청 함대를 기습하면서 전쟁이 시작됐어요.
  result: 일본이 이겨 시모노세키 조약으로 청에게 조선이 청의 속국이 아님을 인정하게 하고 랴오둥반도·타이완을 얻었어요. 조선에 대한 일본의 간섭이 심해졌어요.
