- id: korea-china-joint
  group: 무장 독립 투쟁
  name: 한중 연합 작전 (1932~1933)
  en: Korean–Chinese joint operations in Manchuria
  cal: solar
  years: [1932, 1933]
  period: 1932년 ~ 1933년
  sides:
    - {label: 조선 혁명군·한국 독립군·중국군, polities: []}
