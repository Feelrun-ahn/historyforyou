- id: kw-1
  aka: [korean-war]
  group: 6·25 전쟁
  name: 6·25 전쟁 ① 북한의 남침과 낙동강 방어선 (1950.6~9)
  en: Korean War — North Korean invasion
  cal: solar
  years: [1950, 1950]
  period: 1950년 6월 25일 ~ 9월 14일
  sides:
