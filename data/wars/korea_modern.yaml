    - {name: 청군의 아산 상륙, date: 1894년 음력 5월 5일, year: 1894, at: [126.85, 36.95], winner: null, imp: 1, event: true,
       note: '정부의 요청으로 청군이 아산만에 상륙했어요. 일본은 톈진 조약을 내세워 이튿날 인천에 군대를 상륙시켰어요.'}
