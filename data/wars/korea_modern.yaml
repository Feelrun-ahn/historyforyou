  result: 독립군은 봉오동과 청산리에서 크게 이겼지만, 일본군은 간도의 한인을 학살했고(간도 참변) 독립군은 러시아로 옮겼다가 자유시에서 큰 희생을 치렀어요.
  x: "봉오동에서는 홍범도가 이끈 연합 부대가 골짜기로 일본군을 끌어들여 무찔렀고, 넉 달 뒤 청산리 일대에서는 김좌진의 북로 군정서와 홍범도 부대 등이 백운평·완루구·어랑촌 등에서 엿새 동안 싸워 이겼어요. 두 전투는 1920년대 무장 독립 투쟁을 대표하는 승리예요. 자유시 참변을 겪고 만주로 돌아온 독립군은 참의부·정의부·신민부라는 세 조직으로 다시 힘을 모았고, 이 흐름은 뒤에 남만주의 조선 혁명군과 북만주의 한국 독립군으로 이어졌어요."
  battles:
