  en: Korean War — stalemate and armistice
  cal: solar
  years: [1951, 1953]
  period: 1951년 1월 25일 ~ 1953년 7월 27일
  sides:
    - {label: 대한민국·유엔군, polities: [Republic of Korea, United States of America]}
    - {label: 북한·중국, polities: ["Democratic People's Republic of Korea", "People's Republic of China"]}
  cause: 전열을 정비한 국군과 유엔군이 다시 반격에 나섰어요.
  result: 서울을 다시 되찾은 뒤 38도선 부근에서 밀고 밀리는 싸움이 2년 동안 이어졌고, 1953년 7월 27일 정전 협정을 맺었어요. 군사 분계선(휴전선)이 그어지고 분단이 굳어졌어요.
  x: "휴전 회담은 포로를 어떻게 돌려보낼지와 군사 분계선을 어디에 그을지를 두고 2년 넘게 이어졌고, 그동안에도 백마고지 전투처럼 고지 하나를 두고 치열한 싸움이 계속되었어요. 이승만 정부는 북진 통일을 주장하며 정전에 반대했어요. 3년 동안 남북한을 합쳐 당시 인구의 6분의 1쯤인 약 500만 명이 죽거나 다쳤고, 부모를 잃은 아이가 약 10만 명, 헤어진 가족이 1천만 명에 이르렀어요. 전쟁으로 깊어진 미움과 불신은 남과 북 모두에서 지도자들이 독재 권력을 굳히는 데 쓰이기도 했어요."
