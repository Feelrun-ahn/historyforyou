    - {label: 동맹국, polities: [German Empire, Austria-Hungary, Ottoman Empire, Kingdom of Bulgaria]}
  cause: 1914년 6월 사라예보에서 오스트리아-헝가리의 황태자 부부가 암살된 사건을 계기로, 3국 동맹과 3국 협상으로 얽혀 있던 유럽 강대국들이 잇따라 전쟁에 뛰어들었어요. 그 밑바탕에는 제국주의 경쟁이 있었어요.
  result: 1918년 11월 11일 휴전으로 연합국이 이겼어요. 독일·오스트리아-헝가리·오스만·러시아 제국이 무너졌고, 베르사유 조약과 국제 연맹이 만들어졌어요. 이탈리아는 1915년, 미국은 1917년에 연합국으로 참전했고, 러시아는 혁명 뒤 1918년 전쟁에서 빠졌어요.
  battles:
    - {name: 사라예보 사건, date: 1914년 6월 28일, year: 1914, at: [18.41, 43.86], winner: null, imp: 2, event: true,
       note: '오스트리아-헝가리의 황태자 부부가 세르비아계 청년에게 암살됐어요.'}
    - {name: 탄넨베르크 전투, date: 1914년 8월, year: 1914, at: [20.1, 53.5], winner: 1, imp: 2, approx: true,
       note: '독일군이 동부 전선에서 러시아군을 크게 무찔렀어요.'}
    - {name: 마른 전투, date: 1914년 9월, year: 1914, at: [3.5, 48.95], winner: 0, imp: 3, approx: true,
       note: '프랑스·영국군이 파리 가까이까지 온 독일군을 막아 냈어요. 이후 서부 전선은 참호전으로 굳어졌어요.'}
