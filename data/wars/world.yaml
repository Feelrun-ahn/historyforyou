  cause: 독일(나치)·이탈리아·일본이 침략 전쟁으로 세력을 넓혔어요. 1939년 9월 1일 독일이 폴란드를 침공하자 영국과 프랑스가 독일에 선전 포고했어요. 일본은 이미 1937년 중일 전쟁을 일으켰고, 1941년 진주만을 공격해 태평양 전쟁을 일으켰어요.
  result: 이탈리아는 1943년, 독일은 1945년 5월, 일본은 1945년 8월에 항복해 연합국이 이겼어요. 한국은 광복을 맞았지만 남북으로 나뉘었어요. 국제 연합(UN)이 만들어지고, 미국과 소련을 중심으로 한 냉전이 시작됐어요.
