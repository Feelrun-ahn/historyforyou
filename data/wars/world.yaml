    - {name: 진주만 공습, date: 1941년 12월 7일 (하와이 시각), year: 1941, at: [-157.95, 21.36], winner: 1, imp: 3,
       note: '일본이 하와이의 미국 해군 기지를 기습해 태평양 전쟁이 시작됐어요.'}
