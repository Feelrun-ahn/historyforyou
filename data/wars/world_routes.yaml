# 세계사 전쟁 진격로 (korea_routes.yaml 과 같은 형식, 양력)
# 기원전 날짜는 '-334-05' 처럼 앞에 - 를 붙여요. 날짜 뒤 ? 는 애니메이션용 대략 날짜(지도에 표시 안 함)

alexander:
  cal: solar
  routes:
    - name: 알렉산드로스의 원정로
      short: 알렉산드로스
      side: 0
      note: 마케도니아를 떠나 소아시아·이집트·메소포타미아·페르시아를 지나 인더스강까지 갔다가 바빌론으로 돌아왔어요. 큰 줄기만 이은 대략적인 길이에요.
      path:
        - [22.53, 40.76, '-334-03?', 펠라]
        - [26.4, 40.2, '-334-04?', 헬레스폰토스 해협]
        - [27.3, 40.25, '-334-05', 그라니코스 강, 기원전 334년]
        - [31.98, 39.65, '-333-04?', 고르디온]
        - [36.2, 36.84, '-333-11', 이소스, 기원전 333년]
        - [35.2, 33.27, '-332-07?', 티레]
        - [29.92, 31.2, '-331-01?', 알렉산드리아 건설, 기원전 331년 무렵]
        - [43.45, 36.57, '-331-10', 가우가멜라, 기원전 331년]
        - [44.42, 32.54, '-331-11?', 바빌론]
        - [52.89, 29.93, '-330-01', 페르세폴리스, 기원전 330년]
        - [66.9, 36.75, '-329-04?', 박트리아]
        - [66.97, 39.65, '-329-06?', 마라칸다(사마르칸트)]
        - [73.5, 32.95, '-326-05', 히다스페스 강, 기원전 326년]
        - [67.9, 24.8, '-325-08?', 인더스강 하구]
        - [60.6, 26.0, '-325-10?', 게드로시아 사막]
        - [44.42, 32.54, '-323-04?', 바빌론, 기원전 323년 봄 도착 (6월 사망)]

punic-2:
  cal: solar
  routes:
    - name: 한니발의 알프스 횡단과 이탈리아 침공
      short: 한니발
      side: 1
      note: 히스파니아의 카르타고 노바를 떠나 피레네산맥과 알프스산맥을 넘어 이탈리아로 들어갔어요. 알프스를 넘은 길은 학설이 여러 가지라 대략적으로 그렸어요.
      path:
        - [-0.98, 37.6, '-218-04?', 카르타고 노바]
        - [0.8, 40.8, '-218-06?', 에브로강]
        - [2.6, 42.45, '-218-08?', 피레네산맥]
        - [4.8, 43.95, '-218-09?', 론강]
        - [6.9, 45.1, '-218-10?', 알프스산맥]
        - [9.6, 45.0, '-218-12', 트레비아 강, 기원전 218년 12월]
        - [12.1, 43.18, '-217-06', 트라시메노 호수, 기원전 217년 6월]
        - [16.13, 41.31, '-216-08', 칸나에, 기원전 216년 8월]

napoleonic:
  cal: solar
  routes:
    - name: 나폴레옹의 러시아 원정 (진격)
      short: 그랑드 아르메 진격
      side: 0
      note: 1812년 6월 약 45만 명의 대군을 이끌고 네만강을 건너 모스크바까지 갔어요. 뒤따른 증원군까지 합치면 60만 명이 넘었어요.
      path:
        - [23.9, 54.9, '1812-06-24', 네만강 도하]
        - [25.28, 54.69, '1812-06-28', 빌뉴스]
        - [30.2, 55.19, '1812-07-28?', 비텝스크]
        - [32.05, 54.78, '1812-08-17', 스몰렌스크, 1812년 8월 16~18일]
        - [35.82, 55.52, '1812-09-07', 보로디노]
        - [37.62, 55.75, '1812-09-14', 모스크바]
    - name: 나폴레옹의 러시아 원정 (퇴각)
      short: 그랑드 아르메 퇴각
      side: 0
      note: 모스크바에서 버티지 못하고 겨울 추위와 러시아군의 공격 속에 물러났어요. 살아서 돌아간 병사는 아주 적었어요.
      path:
        - [37.62, 55.75, '1812-10-19', 모스크바 철수]
        - [36.47, 55.01, '1812-10-24', 말로야로슬라베츠]
        - [32.05, 54.78, '1812-11-09?', 스몰렌스크]
        - [28.6, 54.3, '1812-11-27', 베레지나강, 1812년 11월 26~29일]
        - [25.28, 54.69, '1812-12-08?', 빌뉴스]
        - [23.9, 54.9, '1812-12-14', 네만강]
