      short: 북진군
      side: 0
      note: 가산에서 봉기한 뒤 곽산·정주·선천·철산·용천 등 청천강 북쪽 고을을 빠르게 차지했어요. 날짜는 대략적이에요.
      path:
        - [125.62, 39.73, '1811-12-18', 가산]
        - [125.32, 39.69, '1811-12-20?', 정주]
        - [125.08, 39.68, ~, 곽산]
        - [124.92, 39.8, ~, 선천]
        - [124.65, 39.75, ~, 철산]
        - [124.4, 39.97, '1811-12-25?', 용천]
    - name: 봉기군 남진군과 정주성 농성
      short: 남진군
      side: 0
      note: 남쪽으로 내려가던 봉기군은 12월 29일 박천 송림에서 관군에게 지고 정주성으로 들어가 넉 달 가까이 버텼어요.
      path:
        - [125.62, 39.73, '1811-12-18', 가산]
        - [125.58, 39.66, '1811-12-29', 송림]
        - [125.32, 39.69, '1812-01-03?', 정주성]
        - [125.32, 39.69, '1812-04-19', 정주성 함락]

