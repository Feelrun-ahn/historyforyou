      side: 0
      note: 사비성이 위태로워지자 의자왕은 7월 13일 웅진성으로 피했다가 7월 18일 항복했어요.
      path:
        - [126.91, 36.28, '0660-07-13', 사비]
        - [127.12, 36.46, '0660-07-13', 웅진성]
        - [127.12, 36.46, '0660-07-18', 항복]

