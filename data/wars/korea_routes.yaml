      short: 수 수군
      side: 1
      note: 수의 수군이 바다를 건너 요동반도 끝의 비사성을 공격했어요. 고구려가 화의를 청하자 수 양제가 군대를 돌렸어요.
      path:
        - [120.75, 37.8, '0614-06?', 동래 (산둥반도)]
        - [121.8, 39.1, '0614-07', 비사성]
tang-645:
  cal: lunar
  routes:
    - name: 이세적의 선봉군
      short: 이세적 선봉
      side: 1
      note: 4월 요하 상류의 통정진을 건너 현도성 쪽으로 들어온 뒤 개모성을 함락하고 요동성으로 향했어요.
