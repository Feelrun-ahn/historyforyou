        - [123.17, 41.27, '0645-05', 요동성]
        - [123.37, 41.43, '0645-06', 백암성]
        - [122.75, 40.9, '0645-06', 안시성]
        - [122.75, 40.9, '0645-09-18', 안시성에서 철수]
        - [122.4, 41.3, '0645-10?', 요하 건너 돌아감]
    - name: 장량의 수군
      short: 당 수군
      side: 1
      note: 산둥반도에서 바다를 건너 요동반도 끝의 비사성을 함락하고 건안성으로 나아갔어요.
      path:
        - [119.9, 37.18, '0645-04?', 래주(산둥)]
        - [121.8, 39.1, '0645-05', 비사성]
        - [122.4, 40.4, '0645-06?', 건안성]

