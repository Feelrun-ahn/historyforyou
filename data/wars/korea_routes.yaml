# 전쟁별 진격로 (지도에서 화살표 선 + '진격로 재생' 애니메이션)
# - 키는 korea.yaml 의 전쟁 id. 차수가 다르면 전쟁 id 도 달라서 진격로가 섞이지 않아요.
# - cal: lunar(음력) / solar(양력)
# - side: 0 = sides[0] 쪽(빨강) / 1 = sides[1] 쪽(파랑)
# - path: [경도, 위도, 날짜, 지명, (선택) 날짜 표시 문구]
#     날짜: 'YYYY-MM-DD' 또는 'YYYY-MM' 또는 'YYYY' (모르면 ~ 로 비움 → 앞뒤 날짜 사이를 거리 비례로 채움)
#     날짜 뒤에 '?' 를 붙이면 애니메이션용 대략 날짜 (지도에 날짜를 표시하지 않음)
# - 진격로는 교과서 지도 수준의 대략적인 길이에요. 실제 행군로는 더 복잡했어요.

sui-598:
  cal: lunar
  routes:
    - name: 고구려의 요서 공격
      short: 고구려군
      side: 0
      note: 영양왕이 말갈군 1만여 명을 이끌고 요하를 건너 수의 요서 지방을 공격했어요.
      path:
        - [123.17, 41.27, '0598-01?', 요동]
        - [122.35, 41.2, ~, 요하]
        - [120.45, 41.57, '0598-02?', 영주(요서)]
    - name: 수의 육군 (한왕 양량)
      short: 수 육군
      side: 1
      note: 30만 대군이 임유관을 지나 유성(영주) 부근까지 왔지만 장마와 전염병으로 큰 피해를 입고 돌아갔어요.
      path:
        - [115.97, 39.49, '0598-06?', 탁군]
        - [119.75, 40.0, ~, 임유관]
        - [120.45, 41.57, '0598-09', 유성(영주) 부근에서 철수]
    - name: 수의 수군 (주라후)
      short: 수 수군
      side: 1
      note: 산둥반도에서 평양으로 향하던 수군은 풍랑을 만나 많은 배를 잃었어요.
      path:
        - [120.75, 37.8, '0598-06?', 동래(산둥)]
        - [122.6, 38.7, '0598-09?', 풍랑으로 침몰]

sui-612:
  cal: lunar
  routes:
    - name: 수 양제의 본군
      short: 양제 본군
      side: 1
      note: 1월 탁군을 떠난 113만 대군이 3월 요하를 건너 요동성을 에워쌌지만 끝내 함락하지 못했어요.
      path:
        - [115.97, 39.49, '0612-01', 탁군]
        - [119.75, 40.0, ~, 임유관]
        - [122.35, 41.2, '0612-03', 요하 도하]
        - [123.17, 41.27, '0612-04?', 요동성 포위]
    - name: 우중문의 별동대
      short: 수 별동대
      side: 1
      note: 30만 별동대가 압록강을 건너 평양성 30리 밖까지 왔다가, 굶주리고 지쳐 돌아가던 중 살수에서 크게 졌어요. 살아 돌아간 자가 2,700명뿐이었다고 해요.
      path:
        - [124.07, 40.45, '0612-06?', 압록강 서쪽]
        - [124.5, 40.12, ~, 압록강 도하]
        - [125.68, 39.62, ~, 살수]
        - [125.75, 39.27, '0612-07?', 평양성 30리 밖]
        - [125.68, 39.62, '0612-07', 살수 대첩]
        - [124.5, 40.12, '0612-07?', 압록강]
    - name: 수의 수군 (내호아)
      short: 수 수군
      side: 1
      note: 바다를 건너 대동강으로 들어와 평양성을 공격했다가 고구려군의 매복에 걸려 크게 졌어요.
      path:
        - [120.75, 37.8, '0612-05?', 동래(산둥)]
        - [125.2, 38.72, ~, 대동강 하구]
        - [125.75, 39.02, '0612-06', 평양성]


sui-613:
  cal: lunar
  routes:
    - name: 수 양제의 2차 침입 (613)
      short: 2차 침입
      side: 1
      note: 수 양제가 다시 요하를 건너 요동성을 공격했지만, 본국에서 양현감이 반란을 일으키자 급히 물러났어요.
      path:
        - [115.97, 39.49, '0613-03?', 탁군]
