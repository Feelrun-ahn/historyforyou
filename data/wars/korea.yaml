- id: sui-612
  group: 고구려-수 전쟁
  name: 수 양제의 1차 침입과 살수 대첩 (612)
  en: Goguryeo–Sui War (612)
  years: [612, 612]
  period: 612년
  sides:
    - {label: 고구려, polities: [Goguryeo]}
    - {label: 수, polities: [Sui Dynasty]}
  cause: 수 양제가 고구려를 굴복시키려고 113만 대군을 직접 이끌고 쳐들어왔어요.
  result: 요동성을 끝내 함락하지 못하자 별동대를 평양으로 보냈지만, 을지문덕이 살수에서 크게 무찔렀어요. 수의 국력이 크게 약해졌어요.
  x: "요동성이 몇 달 동안 버티는 사이 바다로 온 수의 수군은 평양성 밖에서 고구려군의 매복에 걸려 크게 졌어요. 을지문덕은 오랜 행군과 굶주림에 지친 별동대를 일부러 쫓기는 척하며 평양성 가까이까지 끌어들인 뒤, 우중문에게 '만족함을 알고 그만두라'는 시를 보내 철수하게 만들었어요. 물러가던 수의 군대가 살수를 절반쯤 건넜을 때 고구려군이 한꺼번에 들이쳐 대부분을 쓰러뜨렸어요."
  battles:
    - {name: 요동성 전투, date: 612년 음력 3월 ~ 7월, year: 612, at: [123.17, 41.27], winner: 0, imp: 2, approx: true,
       note: '요하를 건넌 수의 대군이 요동성을 몇 달 동안 에워쌌지만 함락하지 못했어요.'}
    - {name: 평양성 전투 (수 수군), date: 612년 음력 6월, year: 612, at: [125.75, 39.02], winner: 0, imp: 1, approx: true,
       note: '바다로 온 수의 수군(내호아)이 평양성 밖까지 들어왔다가 고구려군의 매복에 크게 패했어요.'}
    - {name: 살수 대첩, date: 612년 음력 7월, year: 612, at: [125.68, 39.62], winner: 0, imp: 3, approx: true,
       note: '우중문의 30만 별동대가 평양성 가까이 왔다가 지쳐 돌아가자, 을지문덕이 살수(청천강으로 추정)를 건너던 수나라 군대를 크게 무찔렀어요. 우리 역사의 3대 대첩 가운데 하나예요.'}

- id: sui-613
  group: 고구려-수 전쟁
  name: 수 양제의 2·3차 침입 (613·614)
  en: Goguryeo–Sui War (613–614)
  years: [613, 614]
  period: 613년, 614년
  sides:
    - {label: 고구려, polities: [Goguryeo]}
    - {label: 수, polities: [Sui Dynasty]}
  cause: 살수 대첩의 패배를 갚으려고 수 양제가 두 해 연속 다시 쳐들어왔어요.
  result: 613년에는 수 내부에서 양현감의 반란이 일어나 물러났고, 614년에는 고구려가 화의를 청하자 돌아갔어요. 무리한 원정으로 수는 618년 멸망했어요.
  x: "613년에도 수 양제는 직접 군대를 이끌고 와 요동성을 에워쌌고, 614년에는 수군이 요동반도 끝의 비사성까지 쳤지만 끝내 고구려를 굴복시키지 못했어요. 이로써 고구려는 598년부터 이어진 수의 침입을 모두 막아 내고, 중국 중심의 질서에 들어가지 않은 채 스스로의 세력권을 지켰어요. 수의 뒤를 이은 당과는 처음에 사이좋게 지냈지만, 고구려는 당이 쳐들어올 것에 대비해 631년부터 16년에 걸쳐 천리장성을 쌓았어요."
  battles:
    - {name: 요동성 전투 (613), date: 613년 음력 4월 ~ 6월, year: 613, at: [123.17, 41.27], winner: 0, imp: 1, approx: true,
       note: '수나라 군대가 다시 요동성을 공격하던 중 본국에서 양현감이 반란을 일으켜 급히 물러났어요.'}
    - {name: 비사성 전투, date: 614년 음력 7월, year: 614, at: [121.8, 39.1], winner: 1, imp: 1, approx: true,
       note: '수의 수군이 요동반도 끝의 비사성을 공격했어요. 고구려가 화의를 청하자 수 양제가 군대를 돌렸어요.'}

