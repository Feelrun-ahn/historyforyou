  result: 서희가 소손녕과 담판을 벌여 거란과 교류하는 대신 압록강 동쪽 강동 6주를 고려 땅으로 인정받았어요.
  x: "거란군은 청천강 가의 안융진을 공격했지만 대도수 등에게 막혔어요. 고려 조정에서는 북쪽 땅을 떼어 주고 화의하자는 주장도 나왔지만, 서희는 소손녕을 만나 고려가 고구려를 이은 나라이며 여진이 가로막고 있어 거란과 교류하지 못한다고 설득했어요. 이 담판으로 고려의 영토는 압록강까지 넓어졌어요. 그러나 고려가 그 뒤에도 송과 계속 교류하자 거란은 다시 쳐들어왔어요."
  battles:
