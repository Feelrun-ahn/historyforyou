  result: 1차(1274) 때는 폭풍을, 2차(1281) 때는 태풍을 만나 크게 실패했어요. 고려는 원정 준비로 큰 고통을 겪었고, 원은 원정을 위해 둔 정동행성을 그 뒤에도 남겨 고려에 간섭했어요.
  x: "1274년 1차 원정군은 쓰시마와 이키섬을 거쳐 하카타만에 올라 싸웠어요. 1281년 2차 원정 때는 고려에서 떠난 동로군과 중국 남쪽에서 떠난 강남군이 다카시마 부근에 모였는데, 이때 몰아친 태풍으로 배 대부분이 가라앉았어요. 원 간섭기 고려는 이 밖에도 원의 요구에 따라 금·은·인삼 같은 특산물과 젊은 여성(공녀)까지 바쳐야 하는 어려움을 겪었어요."
  battles:
