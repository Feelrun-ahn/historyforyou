  result: 고려가 고창 전투로 주도권을 잡았어요. 후백제의 내분으로 견훤이 고려에 투항하고 신라가 항복한 뒤, 936년 일리천 전투로 후삼국을 통일했어요.
  x: "927년 견훤이 신라의 금성을 습격하자 왕건이 신라를 도우러 내려왔다가 공산에서 크게 졌고, 신숭겸 등이 왕건 대신 목숨을 잃었어요. 왕건은 930년 교통의 요충지 고창에서 그 지역 호족들의 도움으로 견훤을 무찔러 전세를 뒤집었어요. 고려는 신라·후백제 사람들은 물론 거란에 나라를 잃은 발해 유민까지 품어 민족을 다시 하나로 묶었고, 지방 호족들도 나랏일에 참여하게 되어 진골 귀족 중심이던 신라 때보다 정치에 참여하는 세력이 넓어졌어요."
  battles:
