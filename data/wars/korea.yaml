  result: 윤관이 여진을 몰아내고 동북 9성을 쌓았지만, 여진이 계속 공격하며 돌려 달라고 애원하자 1년여 만에 돌려주었어요. 여진은 1115년 금을 세웠어요.
  x: "고려는 숙종 때 기병이 강한 여진에 여러 차례 지자, 윤관의 건의로 신기군(기병)·신보군(보병)·항마군(승병)으로 이루어진 별무반을 만들었어요. 조선 후기에 그려진 「척경입비도」에는 윤관의 군대가 9성을 개척하고 '고려지경'이라 새긴 비석을 세우는 모습이 담겨 있어요. 9성을 돌려받은 여진은 금을 세운 뒤 거란(요)을 무너뜨리고 고려에 사대를 요구했고, 1126년 이자겸 등이 반대 여론에도 이를 받아들였어요."
  battles:
