  cause: 백제가 멸망한 뒤 복신·도침은 왜에 있던 왕자 부여풍을 왕으로 세워 주류성에서, 흑치상지는 임존성에서 군사를 일으켜 나라를 되살리려 했어요.
  result: 지도층의 내분과 백강 전투의 패배로 부흥 운동이 실패하고 많은 유민이 일본으로 건너갔어요.
  x: "부흥군은 한때 200여 개의 성을 되찾을 만큼 기세를 올렸고, 왜는 부여풍을 백제로 보내면서 약 5천 명의 군사를 딸려 보낸 데 이어 여러 번에 걸쳐 모두 4만 명 가까운 군사를 보냈어요. 그러나 복신이 도침을 죽이고 부여풍이 다시 복신을 죽이는 등 지도자들끼리 싸웠고, 663년 백강에서 네 차례 벌어진 싸움에서는 왜의 배 대부분이 불타 버렸어요. 싸움에 진 왜는 당과 신라가 쳐들어올 것에 대비해 곳곳에 성을 쌓고, 국왕에게 힘을 모으는 체제를 갖추어 나갔어요."
  battles:
    - {name: 임존성 항전, date: 660년 음력 8월 ~ 663년, year: 660, at: [126.81, 36.62], winner: null, imp: 2, approx: true, event: true,
       note: '흑치상지가 임존성(충남 예산)을 근거로 한때 200여 성을 되찾았어요.'}
    - {name: 주류성 부흥 운동, date: 661년 ~ 663년, year: 661, at: [126.8, 36.08], winner: null, imp: 2, approx: true, event: true,
       note: '복신·도침이 부여풍을 왕으로 세우고 주류성을 근거로 싸웠어요. 주류성의 위치는 학설이 갈려요.'}
    - {name: 백강 전투, date: 663년 음력 8월, year: 663, at: [126.72, 36.02], winner: 1, imp: 3, approx: true,
