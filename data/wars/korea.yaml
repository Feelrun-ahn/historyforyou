    - {name: 견훤의 고려 투항, date: 935년 음력 6월, year: 935, at: [126.55, 37.97], winner: 0, imp: 2, event: true,
       note: '맏아들 신검에게 왕위를 빼앗기고 금산사에 갇혔던 견훤이 탈출해 고려에 투항했어요.'}
