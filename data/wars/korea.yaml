    - {label: 당, polities: [Tang Dynasty, Protectorate General to Pacify the East]}
  cause: 백제와 고구려가 멸망한 뒤 당이 웅진도독부·안동도호부·계림도독부를 두고 한반도 전체를 지배하려 하자 신라가 맞섰어요.
  result: 신라가 매소성과 기벌포에서 당군을 물리치고 대동강에서 원산만에 이르는 이남 지역을 차지해 삼국 통일을 이뤘어요.
  x: "신라는 안승을 보덕국 왕으로 삼아 고구려 유민을 끌어안았고, 671년에는 사비에 소부리주를 두어 옛 백제 땅을 차지했어요. 마침 당은 서쪽에서 토번과 맞서느라 한반도에 힘을 다 쏟지 못했고, 신라는 이 틈을 타 백제·고구려 유민과 함께 당군과 싸웠어요. 외세를 끌어들였고 고구려의 옛 땅 대부분을 잃었다는 한계가 있지만, 신라의 통일은 우리 민족 최초의 통일로 삼국의 문화가 하나로 어우러지는 바탕이 되었어요. 미래엔 교과서는 나당 전쟁으로 당의 지배력이 흔들린 것이 발해 건국에도 영향을 주었다고 설명해요."
  battles:
    - {name: 고구려 부흥 운동, date: 670년 ~ 673년경, year: 670, at: [125.6, 38.5], winner: null, imp: 2, approx: true, event: true,
       note: '검모잠이 안승을 왕으로 세우고 한성(황해도 재령)에서 당에 맞섰어요. 안승은 검모잠을 죽이고 신라로 왔고, 신라는 안승을 보덕국 왕으로 삼았어요.'}
    - {name: 석성 전투, date: 671년 음력 6월, year: 671, at: [126.98, 36.22], winner: 0, imp: 1, approx: true,
       note: '신라군이 사비 근처 석성에서 당군을 무찌르고, 같은 해(671) 사비에 소부리주를 두어 옛 백제 땅을 다스렸어요.'}
    - {name: 매소성 전투, date: 675년 음력 9월 29일, year: 675, at: [127.07, 38.08], winner: 0, imp: 3, approx: true,
       note: '신라군이 매소성에 머물던 당의 이근행 군대를 물리치고 전쟁의 흐름을 바꿨어요. 위치는 경기 연천 대전리산성으로 보는 설과 양주 대모산성으로 보는 설이 있어요. 비상 교과서는 "매소성 싸움"이라고 써요.'}
    - {name: 기벌포 전투, date: 676년 음력 11월, year: 676, at: [126.68, 36.0], winner: 0, imp: 3, approx: true,
