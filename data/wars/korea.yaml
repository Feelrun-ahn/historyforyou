  result: 강감찬이 귀주에서 거란군을 거의 전멸시켰어요. 이후 고려는 개경에 나성, 국경에 천리장성을 쌓았고 고려·송·거란 사이에 세력 균형이 이루어졌어요.
  x: "강감찬을 상원수, 강민첨을 부원수로 한 고려군 약 20만 명은 압록강 쪽에서 거란군을 기다렸고, 거란군은 첫 싸움인 흥화진에서부터 꺾였어요. 소배압은 그래도 개경 근처까지 밀고 내려왔지만 개경을 함락하지 못한 채 군사만 잃고 돌아서야 했고, 고려군은 이들이 귀주를 지날 때 한꺼번에 들이쳤어요. 서울 관악구의 '낙성대'라는 이름은 강감찬이 태어날 때 큰 별이 떨어졌다는 이야기에서 나왔어요."
  battles:
    - {name: 흥화진 전투 (3차), date: 1018년 음력 12월, year: 1018, at: [124.6, 40.1], winner: 0, imp: 2, approx: true,
       note: '강감찬이 흥화진 동쪽 삼교천을 소가죽으로 막았다가 터뜨리고 매복한 기병으로 거란군을 무찔렀다고 전해져요.'}
    - {name: 개경 부근 진출과 퇴각, date: 1019년 음력 1월, year: 1019, at: [126.53, 38.48], winner: 0, imp: 1, approx: true, event: true,
       note: '소배압은 개경에서 100리 떨어진 신은현(신계)까지 내려왔지만, 고려가 들판의 곡식을 거두고 성을 굳게 지키자 지쳐서 물러났어요.'}
    - {name: 귀주 대첩, date: 1019년 음력 2월 1일, year: 1019, at: [125.25, 39.98], winner: 0, imp: 3, approx: true,
       note: '강감찬이 물러나던 거란군을 귀주에서 크게 무찔러, 살아 돌아간 거란군이 수천 명뿐이었어요. 우리 역사의 3대 대첩 가운데 하나예요.'}

# ───────────── 여진 정벌 ─────────────
- id: jurchen-1107
  group: 고려의 여진 정벌
  name: 윤관의 여진 정벌과 동북 9성 (1107~1109)
  en: Goryeo campaign against the Jurchens (1107–1109)
