       note: '이순신이 이끈 조선 수군의 첫 승리예요. 이어 합포·적진포에서도 이겼어요.'}
    - {name: 사천 해전, date: 1592년 음력 5월 29일, year: 1592, at: [128.06, 34.99], winner: 0, winlabel: 조선, imp: 1,
