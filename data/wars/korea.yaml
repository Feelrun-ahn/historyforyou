  result: 압록강의 위화도에서 군대를 돌린 이성계가 개경을 장악하고 우왕과 최영을 몰아냈어요. 이성계와 신진 사대부가 실권을 잡아 조선 건국의 길이 열렸어요.
  x: "요동으로 향하던 이성계의 군대는 장맛비로 압록강 물이 불어 위화도에서 발이 묶였고, 이성계는 우왕에게 돌아가게 해 달라고 했으나 허락을 받지 못하자 군사를 돌렸어요. 권력을 잡은 뒤 신진 사대부는 고려 안에서 개혁하자는 이색·정몽주 등 온건파와 새 나라를 세우자는 정도전·조준 등 급진파로 나뉘었어요. 이성계는 급진파와 함께 과전법을 만들어 토지와 조세 제도를 고침으로써 권문세족의 경제적 힘을 꺾고 정몽주 등 반대 세력을 없앤 뒤, 1392년 공양왕의 자리를 이어받아 조선을 세웠어요."
