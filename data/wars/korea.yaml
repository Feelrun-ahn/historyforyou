  result: 나당 연합군이 평양성을 함락해 고구려가 멸망했어요. 당은 평양에 안동도호부를 두었어요.
  x: "국내성 일대를 잃은 고구려는 667년 요동의 요충지 신성, 이듬해 북쪽의 부여성을 차례로 빼앗겼고, 부여성이 함락되자 주변 40여 성이 당에 항복했어요. 수·당과의 긴 전쟁으로 국력이 약해진 데다 지배층까지 분열해 있어, 고구려는 나당 연합군의 공격을 더는 막아 내지 못했어요. 멸망 뒤에도 고연무는 요동에서, 검모잠은 보장왕의 아들 안승을 받들고 한성에서 부흥 운동을 벌였고, 뒤에 고구려 유민들은 대조영을 중심으로 발해를 세웠어요."
  battles:
