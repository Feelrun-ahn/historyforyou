    - {label: 신라·당, polities: [Silla, Tang Dynasty]}
  cause: 나당 동맹을 맺은 신라와 당이, 귀족들의 분열로 혼란해진 백제를 함께 공격했어요.
  result: 사비성이 함락되고 웅진성으로 피했던 의자왕이 항복해 백제가 멸망했어요.
  x: "신라는 의자왕에게 대야성 등 40여 성을 빼앗긴 뒤 김춘추를 당에 보내 648년 나당 동맹을 맺었어요. 660년 7월 소정방의 당군이 금강 하구 기벌포에 상륙한 날, 김유신의 신라군 5만은 황산벌에서 계백의 결사대 5천여 명과 맞붙었어요. 계백은 네 번 싸워 모두 이겼지만 화랑 반굴·관창의 희생으로 사기가 오른 신라군에 끝내 졌고, 나당 연합군은 곧 사비성으로 밀고 들어갔어요. 백제가 무너진 뒤 당은 옛 백제 땅에 웅진도독부를 두었고, 곳곳에서 부흥 운동이 일어났어요."
  battles:
