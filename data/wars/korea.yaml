       note: '1차 진주성 전투의 패배를 갚으려는 일본군의 대규모 공격으로 진주성이 함락되고 많은 군민이 희생됐어요.'}

- id: jeongyu
  group: 임진왜란·정유재란
  name: 정유재란 (1597~1598)
  en: Imjin War — second invasion (1597–1598)
  years: [1597, 1598]
  period: 1597년 음력 1월 ~ 1598년 음력 11월
  sides:
    - {label: 조선·명, polities: [Joseon, Ming Dynasty]}
    - {label: 일본(도요토미 정권), polities: [Warring States Japan]}
  cause: 명과 일본의 휴전 협상이 깨지자 도요토미 히데요시가 다시 조선을 침략했어요.
  result: 조선과 명은 직산에서 일본군의 북진을 막고, 이순신이 명량에서 일본 수군을 물리쳤어요. 히데요시가 죽자 일본군이 물러나면서 7년 전쟁이 끝났어요.
  x: "원균이 이끈 조선 수군이 칠천량에서 크게 져 거북선을 비롯한 배 대부분을 잃었고, 일본군은 남원성을 함락하며 전라도로 밀고 들어왔어요. 다시 수군을 맡은 이순신은 남은 13척의 배로 물살이 빠른 울돌목을 이용해 승리했고, 노량에서 물러나는 일본군과 싸우다 전사했어요. 7년 전쟁으로 조선은 인구가 줄고 국토가 황폐해졌으며, 일본은 끌고 간 도공과 학자를 통해 문화가 발전했고, 명은 국력이 약해져 그 틈에 만주의 여진이 성장했어요."
  battles:
    - {name: 칠천량 해전, date: 1597년 음력 7월 16일, year: 1597, at: [128.61, 34.95], winner: 1, imp: 2,
       note: '원균이 이끈 조선 수군이 크게 패해 거북선을 비롯한 대부분의 배를 잃었어요.'}
    - {name: 남원성 전투, date: 1597년 음력 8월 16일, year: 1597, at: [127.39, 35.41], winner: 1, imp: 2,
       note: '전라도로 들어온 일본군이 남원성을 함락했어요. 조선군과 명군, 백성이 함께 싸우다 많이 희생됐어요.'}
    - {name: 직산 전투, date: 1597년 음력 9월 7일, year: 1597, at: [127.15, 36.88], winner: 0, imp: 2,
       note: '조명 연합군이 직산(천안)에서 북쪽으로 올라오던 일본군을 막았어요. 일본군은 남해안으로 물러났어요.'}
    - {name: 명량 해전, date: 1597년 음력 9월 16일, year: 1597, at: [126.31, 34.57], winner: 0, winlabel: 조선, imp: 3,
       note: '다시 수군을 맡은 이순신이 13척의 배로 물살이 빠른 울돌목에서 일본 수군을 물리쳤어요.'}
    - {name: 울산성 전투, date: 1597년 음력 12월 ~ 1598년 음력 1월, year: 1597, at: [129.33, 35.55], winner: 1, imp: 1, approx: true,
       note: '조명 연합군이 가토가 지키던 울산 왜성을 에워쌌지만 함락하지 못했어요.'}
    - {name: 노량 해전, date: 1598년 음력 11월 19일, year: 1598, at: [127.87, 34.94], winner: 0, imp: 3,
       note: '조명 연합 수군이 물러나는 일본 수군을 노량에서 무찔렀지만 이순신이 전사했어요. 7년 전쟁이 끝났어요.'}

- id: jeongmyo
  group: 호란
  name: 정묘호란 (1627)
  en: Later Jin invasion of Joseon (1627)
  years: [1627, 1627]
  period: 1627년 음력 1월 ~ 3월
  sides:
    - {label: 조선, polities: [Joseon]}
    - {label: 후금, polities: [Later Jin Dynasty]}
  cause: 인조와 서인 정권이 명과 가까이하고 후금을 멀리하자(친명배금), 물자가 부족하고 명을 치기 전에 뒤를 안정시키려던 후금이 쳐들어왔어요. 조선이 명을 돕지 못하게 하려는 목적도 있었어요(미래엔 교과서).
  result: 인조가 강화도로 피란하고 정봉수·이립 등 의병이 맞서는 가운데, 조선과 후금은 형제 관계를 맺고 전쟁을 끝냈어요.
  x: "광해군은 명과 후금 사이에서 중립 외교를 펼쳐 전쟁을 피했지만, 1623년 인조반정으로 광해군이 쫓겨나면서 외교의 방향이 바뀌었어요. 압록강을 건넌 후금군은 의주와 안주성을 무너뜨리고 황해도 평산까지 내려왔고, 정봉수는 용골산성에서 의병을 이끌고 후금군을 괴롭혔어요. 명과의 전쟁을 앞둔 후금은 일단 형제 관계로 만족하고 물러났지만, 몇 해 뒤 군신 관계를 요구하면서 병자호란으로 이어졌어요."
  battles:
    - {name: 의주 함락, date: 1627년 음력 1월, year: 1627, at: [124.53, 40.2], winner: 1, imp: 1, approx: true,
       note: '압록강을 건넌 후금군이 의주를 함락하고 남쪽으로 내려왔어요.'}
    - {name: 안주성 전투, date: 1627년 음력 1월, year: 1627, at: [125.67, 39.62], winner: 1, imp: 1, approx: true,
       note: '남이흥 등이 안주성에서 싸웠지만 성이 함락됐어요.'}
    - {name: 용골산성 항전, date: 1627년, year: 1627, at: [124.75, 40.05], winner: 0, imp: 1, approx: true,
       note: '정봉수가 의병을 이끌고 용골산성(평북 용천)을 지키며 후금군을 괴롭혔어요.'}
    - {name: 정묘 화의 (형제 관계), date: 1627년 음력 3월 3일, year: 1627, at: [126.49, 37.75], winner: 1, imp: 2, event: true,
       note: '1월 후금군이 황해도 평산까지 내려오자 인조는 강화도로 피란했고, 3월 3일 형제 관계를 맺는 화의를 했어요.'}

- id: manchu
  group: 호란
  name: 병자호란 (1636~1637)
  en: Qing invasion of Joseon (1636–1637)
  years: [1636, 1637]
  period: 1636년 음력 12월 ~ 1637년 음력 1월
  sides:
    - {label: 조선, polities: [Joseon]}
    - {label: 청, polities: [Qing Dynasty]}
  cause: 나라 이름을 청으로 바꾼 후금이 군신 관계를 요구했어요. 조선에서는 화의를 하자는 주화론과 싸우자는 척화론(미래엔 교과서는 주전론)이 맞섰는데 척화론이 우세했고, 청 태종이 직접 쳐들어왔어요.
  result: 강화도로 가는 길이 막힌 인조가 남한산성에서 버티다 삼전도에서 항복해 청과 군신 관계를 맺었어요. 소현 세자와 봉림 대군, 많은 백성이 청으로 끌려갔어요.
  x: "청군은 임경업이 지키던 백마산성을 피해 곧장 한성으로 달려와 인조가 들어간 남한산성을 에워쌌어요. 성안에서는 끝까지 싸우자는 척화론과 화의하자는 주화론이 맞섰지만, 구원병이 쌍령 등에서 지고 강화도마저 함락되자 주화론이 힘을 얻었어요. 이후 청에 당한 치욕을 갚자는 북벌론이 일어나 청에서 돌아온 효종이 군대를 길렀지만 효종이 죽으며 중단되었고, 점차 청의 앞선 문물을 받아들이자는 움직임이 나타났어요."
  battles:
    - {name: 임경업의 백마산성 항쟁과 청군의 우회, date: 1636년 음력 12월, sort: '1636-12-10', year: 1636, at: [124.68, 40.07], winner: null, imp: 1, approx: true, event: true,
       note: '청군은 임경업이 지키던 백마산성을 피해 곧장 한성으로 달려갔어요.'}
    - {name: 남한산성 항전, date: 1636년 음력 12월 14일 ~ 1637년 음력 1월 30일, year: 1636, at: [127.18, 37.48], winner: 1, imp: 3,
       note: '인조와 신하들이 12월 14일부터 1월 30일까지 남한산성에서 버텼어요(셈법에 따라 45~47일).'}
    - {name: 쌍령 전투, date: 1637년 음력 1월 3일, year: 1637, at: [127.27, 37.38], winner: 1, imp: 1,
       note: '남한산성을 구하러 가던 조선군이 경기 광주 쌍령에서 청군에게 크게 패했어요.'}
    - {name: 강화도 함락, date: 1637년 음력 1월 22일, year: 1637, at: [126.52, 37.73], winner: 1, imp: 2,
       note: '청군이 강화도를 함락하고 피란해 있던 왕실 사람들을 사로잡았어요. 이 소식에 남한산성의 항전도 끝이 났어요.'}
    - {name: 삼전도 항복, date: 1637년 음력 1월 30일, year: 1637, at: [127.1, 37.51], winner: 1, imp: 3, event: true,
       note: '인조가 삼전도에서 청 태종에게 항복했어요. 청은 이곳에 자신들의 공을 새긴 비(삼전도비)를 세우게 했어요.'}
