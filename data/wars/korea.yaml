  result: 특히 차라대의 침입 때 큰 피해를 입었어요. 최씨 정권이 무너진 뒤 고려 태자(원종)가 몽골의 쿠빌라이를 만나 강화를 맺었어요.
  x: "1253년 충주성에서는 김윤후가 노비 문서를 불태워 노비들의 사기를 높이고 70여 일 동안 몽골군을 막아 냈어요. 그러나 전쟁이 길어지며 수많은 백성이 죽거나 끌려가고 강화 여론이 높아졌는데도 최씨 정권은 정권을 지키려고 항전을 고집했고, 결국 무신들이 최씨 정권을 무너뜨렸어요. 태자는 몽골 칸의 자리를 두고 다투던 쿠빌라이를 찾아가 고려의 풍속을 유지한다는 약속을 받아 냈고, 고려는 왕조와 고유한 제도를 지켰지만 이후 원의 내정 간섭을 받게 되었어요."
  battles:
