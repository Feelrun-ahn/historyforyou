  x: "양규가 흥화진을 굳게 지키자 거란군은 이 성을 남겨 둔 채 남쪽으로 내려갔고, 통주에서 강조가 이끈 고려 주력군을 무너뜨린 뒤 1011년 1월 1일 개경에 들어와 궁궐과 민가를 불태웠어요. 물러가는 거란군을 양규와 김숙흥이 여러 차례 공격해 끌려가던 백성을 구했지만, 두 사람은 이 싸움에서 전사했어요. 미래엔 교과서는 고려가 거란과의 외교 관계 회복을 약속해 위기에서 벗어났다고 쓰는데, 이 약속을 지키지 않은 것이 3차 침입의 구실이 되었어요."
