    - {name: 한산도 대첩, date: 1592년 음력 7월 8일, year: 1592, at: [128.48, 34.79], winner: 0, winlabel: 조선, imp: 3,
       note: '이순신이 견내량의 일본 수군을 넓은 바다로 끌어내 학익진으로 크게 무찔렀어요. 남해의 바닷길을 지켜 일본군의 보급로를 끊었어요.'}
    - {name: 금산 전투, date: 1592년 음력 8월 18일, year: 1592, at: [127.49, 36.1], winner: 1, imp: 1, approx: true,
       note: '조헌의 의병과 영규의 승병이 금산의 일본군과 싸우다 모두 전사했지만, 일본군의 전라도 진출을 늦췄어요.'}
    - {name: 부산포 해전, date: 1592년 음력 9월 1일, year: 1592, at: [129.05, 35.1], winner: 0, winlabel: 조선, imp: 1,
       note: '이순신이 일본군의 근거지인 부산포를 공격해 많은 배를 부쉈어요.'}
    - {name: 진주 대첩, date: 1592년 음력 10월 5일 ~ 10일, year: 1592, at: [128.08, 35.19], winner: 0, winlabel: 조선, imp: 3,
       note: '김시민이 이끈 진주성 군민이 일본군을 물리쳤어요(1차 진주성 전투). 임진왜란 3대 대첩 가운데 하나예요.'}
    - {name: 평양성 탈환, date: 1593년 음력 1월 8일, year: 1593, at: [125.75, 39.02], winner: 0, imp: 3,
       note: '이여송이 이끈 명군과 조선군이 연합해 평양성을 되찾았어요.'}
    - {name: 벽제관 전투, date: 1593년 음력 1월 27일, year: 1593, at: [126.87, 37.7], winner: 1, imp: 1, approx: true,
       note: '한성으로 내려가던 명군이 벽제관(고양)에서 일본군에게 패해 평양으로 물러났어요.'}
    - {name: 행주 대첩, date: 1593년 음력 2월 12일, year: 1593, at: [126.82, 37.6], winner: 0, winlabel: 조선, imp: 3,
       note: '권율이 행주산성에서 일본군을 크게 무찔렀어요. 임진왜란 3대 대첩 가운데 하나예요.'}
