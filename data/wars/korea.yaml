  x: "홍건적은 원이 쇠약해진 틈에 한족 농민들이 일으킨 반란군으로, 공민왕이 반원 개혁을 펼치던 무렵 고려에 밀려 들어왔어요. 1차 때는 4만 명, 2차 때는 10만여 명이 쳐들어올 만큼 규모가 커서 고려가 입은 피해도 컸어요. 홍건적 무리 속에서 세력을 키운 주원장은 1368년 명을 세우고 원을 만리장성 북쪽으로 몰아냈고, 고려에서는 명과의 외교를 두고 정치 세력이 맞서게 되었어요."
