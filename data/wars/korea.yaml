    - {name: 차라대의 침입, date: 1254년 ~ 1259년, year: 1254, at: [127.4, 36.4], winner: 1, imp: 2, approx: true, event: true,
       note: '차라대가 이끈 몽골군이 전국을 휩쓸었어요. 『고려사』에는 1254년 한 해에만 20만 명 넘게 포로로 끌려갔다고 적혀 있어요.'}
    - {name: 고려와 몽골의 강화, date: 1259년, year: 1259, at: [126.49, 37.75], winner: null, imp: 3, event: true,
