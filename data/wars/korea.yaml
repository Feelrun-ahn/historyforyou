    - {label: 수, polities: [Sui Dynasty]}
  cause: 중국을 통일한 수가 고구려에 복속을 요구하자 고구려 영양왕이 먼저 요서 지방을 공격했어요.
  result: 수 문제가 30만 대군을 보냈지만 장마와 전염병, 풍랑으로 큰 피해를 입고 물러났어요.
  x: "미래엔 교과서는 거란과 말갈의 일부가 고구려를 떠나 수에 붙자, 고구려가 이를 견제하려고 먼저 요서를 쳤다고 설명해요. 이 무렵 고구려는 돌궐·왜와 손잡고 수에 맞서려 했고 신라는 수에 도움을 청해, 동아시아의 나라들이 편을 나누어 맞서는 모습이 나타났어요. 이 첫 충돌은 수 양제의 대규모 침입으로 이어졌어요."
  battles:
    - {name: 고구려의 요서 공격, date: 598년, year: 598, at: [120.45, 41.57], winner: null, imp: 2, approx: true, event: true,
       note: '영양왕이 말갈군을 이끌고 수의 요서 지방(영주)을 공격했어요.'}
    - {name: 수나라 군대의 철수, date: 598년 음력 9월, year: 598, at: [122.35, 41.2], winner: 0, imp: 2, approx: true, event: true,
