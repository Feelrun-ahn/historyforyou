  result: 귀주성 등이 끝까지 버텼지만 몽골군이 개경을 에워싸자 고려는 강화를 맺었어요. 몽골은 다루가치를 두고 돌아갔어요.
  x: "두 나라는 몽골군에 쫓겨 고려로 넘어온 거란 무리를 강동성에서 함께 물리치면서 처음 관계를 맺었지만, 몽골이 해마다 무거운 공물을 바치라고 하면서 사이가 나빠졌어요. 귀주성에서는 박서가 군사와 백성을 이끌고, 땅굴을 파고 불을 지르며 덤벼드는 몽골군을 끝까지 막아 냈어요. 1232년 최우 정권은 몽골이 다시 쳐들어올 것에 대비해 도읍을 강화도로 옮겼어요."
  battles:
