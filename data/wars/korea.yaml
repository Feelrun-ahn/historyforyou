- id: mongol-3
  group: 고려-몽골 전쟁
  name: 몽골의 3차 침입 (1235~1239)
  en: Third Mongol invasion of Goryeo (1235–1239)
  years: [1235, 1239]
  period: 1235년 ~ 1239년
