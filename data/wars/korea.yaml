    - {label: 몽골, polities: [Mongol Empire]}
  cause: 금을 무너뜨린 몽골이 다시 고려를 공격해 국왕이 강화도에서 나와 직접 항복할 것을 요구했어요.
  result: 몽골군이 4년 넘게 전국을 휩쓸었어요. 고려는 부처의 힘으로 나라를 지키려고 팔만대장경을 새기기 시작했어요(1236).
  x: "몽골군이 남쪽 깊숙이 내려오자 죽주성(경기 안성)에서는 송문주가 피란해 있던 백성과 힘을 합쳐 몽골군을 물리쳤어요. 그러나 1238년에는 경주까지 내려온 몽골군이 황룡사와 9층 목탑을 불태워 큰 문화유산이 사라졌어요. 고려 정부가 민심을 모으고 부처의 힘으로 몽골을 물리치려고 새긴 팔만대장경판은 지금 경남 합천에 전해지고 있어요."
  battles:
    - {name: 죽주성 전투, date: 1236년, year: 1236, at: [127.43, 37.08], winner: 0, imp: 1, approx: true,
