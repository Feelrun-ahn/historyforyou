# 나라 정보 창에 보여 줄 짧은 설명 (교과서·한국민족문화대백과사전 기준)
Gojoseon: 『삼국유사』에는 기원전 2333년에 세워졌다고 나와요. 지도에는 영역을 추정할 수 있는 시기부터 보여 주고, 기원전 108년 한의 공격으로 멸망해요.
Baekje: 『삼국사기』에는 기원전 18년에 세워졌다고 나와요. 지도에는 고대 국가 체제를 갖춘 4세기부터 백제로 보여 주고, 그 전은 마한으로 표시돼요.
Silla: 『삼국사기』에는 기원전 57년에 세워졌다고 나와요. 지도에는 4세기부터 신라로 보여 주고, 그 전은 진한으로 표시돼요. 512년 우산국(울릉도)을 복속했어요.
Goguryeo: 『삼국사기』에는 기원전 37년에 세워졌다고 나와요. 668년 나당 연합군에게 멸망했어요.
Gaya: 변한 지역에서 자란 여러 나라의 연맹이에요. 금관가야는 532년, 대가야는 562년 신라에 병합됐어요.
Unified Silla: 676년 나당 전쟁에서 이겨 삼국 통일을 마무리했어요.
Balhae: 698년 대조영이 세웠고, 926년 거란(요)에게 멸망했어요.
Taebong: 901년 궁예가 세운 후고구려는 904년 마진, 911년 태봉으로 이름을 바꿨어요. 901~910년 영역은 911년 모습을 기준으로 그렸어요.
Hubaekje: 900년 견훤이 완산주(전주)에 도읍을 정했고, 936년 고려에 멸망했어요.
Goryeo: 918년 왕건이 세우고 936년 후삼국을 통일했어요. 994년 강동 6주를 얻은 뒤의 북쪽 경계는 천리장성(압록강 하구~도련포)을 기준으로 대략 그렸어요. 원 간섭기(1270~1356)에도 왕조를 유지했고, 원이 직접 다스린 곳은 쌍성총관부·동녕부·탐라총관부로 따로 표시했어요.
Protectorate General to Pacify the East: 668년 고구려를 멸망시킨 당이 평양에 둔 통치 기구예요. 676년 요동으로 옮겨 갔어요.
Ssangseong Prefecture: 원이 1258년 화주(지금의 영흥)에 설치해 철령 이북을 직접 다스렸어요. 1356년 공민왕이 되찾았어요. 지도의 경계는 대략적이에요.
Dongnyeong Prefecture: 원이 1270년 서경(평양)에 설치해 자비령 이북을 직접 다스렸고, 1290년 고려에 돌려줬어요. 지도의 경계는 대략적이에요.
Tamna Prefectures: 1273년 삼별초를 진압한 원이 제주를 직접 다스렸어요. 1294년 고려에 돌려줬어요.
Tamna: 1105년 고려가 탐라군을 설치하면서 고려의 지방이 됐어요.
Joseon: 1392년 이성계가 세웠어요. 1897년 대한제국으로 나라 이름을 바꿨어요.
Korean Empire: 1897년 고종이 대한제국을 선포했어요. 1910년 일제에 국권을 빼앗겼어요.
Korea under Japanese rule: 1910년 국권 피탈부터 1945년 광복까지 일제가 조선총독부를 두고 식민 지배한 시기예요. 독도는 대한민국의 영토예요.
US Army Military Government in Korea: 1945년 광복 뒤 38도선 남쪽을 미군이 통치한 시기예요. 1948년 8월 15일 대한민국 정부가 수립됐어요.
Soviet Civil Administration in Korea: 1945년 광복 뒤 38도선 북쪽을 소련군이 통치한 시기예요. 1948년 9월 9일 북한 정권이 수립됐어요.
Republic of Korea: 1948년 8월 15일 정부가 수립됐어요. 독도와 울릉도를 포함해요.
Qing Dynasty: 1616년 누르하치가 세운 후금이 1636년 나라 이름을 청으로 바꿨어요.
Later Jin Dynasty: 1616년 누르하치가 세웠어요. 1636년 나라 이름을 청으로 바꿨어요.
