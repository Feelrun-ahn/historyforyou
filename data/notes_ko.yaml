# 나라 정보 창에 보여 줄 짧은 설명 (교과서·한국민족문화대백과사전 기준)
Gojoseon: 『삼국유사』에 단군왕검이 고조선을 세운 이야기가 실려 있고, 『동국통감』의 기록에 따라 기원전 2333년을 건국 연도로 봐요. 이른 시기의 영역은 정확히 알 수 없어서 기원전 3세기 말 영역을 점선(추정 영역)으로 보여 줘요. 교과서는 비파형 동검과 탁자식 고인돌이 나오는 지역을 고조선의 문화 범위로 봐요. 기원전 194년 위만이 준왕을 몰아내고 왕이 됐고(위만 조선), 기원전 108년 한의 공격으로 멸망했어요.
Baekje: 『삼국사기』에 따르면 기원전 18년 온조가 한성(위례성)에 세웠어요. 초기에는 마한의 한 나라로 시작해 고이왕(3세기) 때 한강 유역을 차지하고, 4세기 중반 근초고왕 때 마한을 아울렀어요. 346년까지의 영역은 추정이라 점선으로 보여 줘요. 660년 7월 사비성이 함락되고 18일 의자왕이 항복해 멸망했어요.
Silla: 『삼국사기』에 따르면 기원전 57년 박혁거세가 사로국(경주)으로 세웠어요. 2~4세기에 주변 진한 소국들을 병합했고, 377년까지의 영역은 추정이라 점선으로 보여 줘요. 512년 우산국(울릉도)을 복속했어요.
Goguryeo: 『삼국사기』에 따르면 기원전 37년 주몽이 졸본에서 세웠어요. 668년 나당 연합군에게 멸망했어요.
Gaya: 변한 지역에서 자란 여러 나라의 연맹이에요. 금관가야는 532년, 대가야는 562년 신라에 병합됐어요.
Unified Silla: 676년 나당 전쟁에서 이겨 삼국 통일을 마무리했어요.
Balhae: 698년 대조영이 세웠고, 926년 거란(요)에게 멸망했어요.
Taebong: 901년 궁예가 세운 후고구려는 904년 마진, 911년 태봉으로 이름을 바꿨어요. 901~910년 영역은 911년 모습을 기준으로 그렸어요.
Hubaekje: 892년 견훤이 무진주(광주)에서 일어나 900년 완산주(전주)에 도읍을 정했고, 936년 고려에 멸망했어요.
Goryeo: 918년 왕건이 세우고 936년 후삼국을 통일했어요. 993년 서희의 담판으로 강동 6주를 얻고(994년부터 성을 쌓음), 1033~1044년 압록강 하구에서 도련포까지 천리장성을 쌓았고, 1117년 거란이 차지하던 보주(의주)를 얻었어요. 지도에는 1043년까지는 강동 6주까지, 1044년부터는 천리장성 선까지를 대략 그렸어요. 원 간섭기(1270~1356)에도 왕조를 유지했고, 원이 직접 다스린 곳은 쌍성총관부·동녕부·탐라총관부로 따로 표시했어요.
Protectorate General to Pacify the East: 668년 고구려를 멸망시킨 당이 평양에 둔 통치 기구예요. 이 시기 옛 고구려 땅에서는 검모잠·안승 등의 고구려 부흥 운동(670~673년경)이 벌어졌고, 안동도호부는 676년 요동으로 옮겨 갔어요. 지도의 영역은 당이 지배하려 한 범위예요.
Ssangseong Prefecture: 몽골(원)이 1258년 12월 화주(지금의 영흥)에 설치해 철령 이북을 직접 다스렸어요. 1356년 7월 공민왕이 되찾았어요. 지도의 경계는 대략적이에요.
Dongnyeong Prefecture: 몽골(원)이 1270년 서경(평양)에 설치해 자비령 이북을 직접 다스렸고, 1290년 3월 고려에 돌려줬어요. 지도의 경계는 대략적이에요.
Tamna Prefectures: 1273년 삼별초를 진압한 원이 제주를 직접 다스렸어요(이름은 초토사·총관부 등으로 바뀜). 1294년 고려에 돌려줬지만, 1300년 다시 총관부를 두었다가 이듬해 만호부로 바꿨어요.
Tamna: 1105년 고려가 탐라군을 설치하면서 고려의 지방이 됐어요.
Joseon: 1392년 이성계가 세웠어요. 1897년 대한제국으로 나라 이름을 바꿨어요.
Korean Empire: 1897년 고종이 대한제국을 선포했어요. 1900년 칙령 제41호로 울릉도를 울도군으로 승격하고, 울도군이 울릉 전도와 죽도, 석도(독도)를 관할하게 했어요. 1910년 일제에 국권을 빼앗겼어요.
Korea under Japanese rule: 1910년 국권 피탈부터 1945년 광복까지 일제가 조선총독부를 두고 식민 지배한 시기예요. 독도는 대한민국의 영토예요.
US Army Military Government in Korea: 1945년 광복 뒤 38도선 남쪽을 미군이 통치한 시기예요. 1948년 8월 15일 대한민국 정부가 수립됐어요.
Soviet Civil Administration in Korea: 1945년 광복 뒤 38도선 북쪽을 소련군이 통치한 시기예요. 1948년 9월 9일 북한 정권이 수립됐어요.
Republic of Korea: 1948년 8월 15일 정부가 수립됐어요. 독도와 울릉도를 포함해요.
Qing Dynasty: 1616년 누르하치가 세운 후금이 1636년 나라 이름을 청으로 바꿨어요.
Later Jin Dynasty: 1616년 누르하치가 세웠어요. 1636년 나라 이름을 청으로 바꿨어요.
Buyeo: 기원전 2세기경부터 494년까지 쑹화강 중류(지금의 중국 지린시 일대)를 중심으로 있던 예맥족의 나라예요. 494년 고구려에 복속됐어요. 영역은 교과서·백과사전 지도를 바탕으로 한 추정이라 점선으로 보여 줘요.
