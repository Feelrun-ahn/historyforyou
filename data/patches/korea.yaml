  severity: low
  target: Balhae
  problem: 발해 건국이 705년으로 되어 있음
  fix: 698년(대조영 건국)
  status: 검수대기

- id: K04
  years: [901, 921]
  severity: low
  target: Taebong
  problem: 태봉(후고구려)이 911~921년으로 되어 있음
  fix: 901년 후고구려 건국 ~ 918년 멸망. 이름은 시기별로 후고구려(901) → 마진(904) → 태봉(911)
  status: 검수대기

- id: K05
  years: [936, 936]
  severity: low
  target: Hubaekje
  problem: 후백제가 935년에 끝나는 것으로 되어 있음
  fix: 936년 멸망(고려의 후삼국 통일)
  status: 검수대기

- id: K06
  years: [918, 921]
  severity: low
  target: Goryeo
  problem: 고려가 922년에 시작해서 1394년에 끝나는 것으로 되어 있음
  fix: 918~1392년
  status: 검수대기

- id: K07
  years: [1260, 1362]
  severity: high
  target: Goryeo (1260~1362)
  problem: 고려 전체가 몽골 제국·원 영토로 흡수되어 고려가 지도에서 사라짐
  fix: >
    고려 영역 복원 (원 간섭기에도 고려는 왕조를 유지했고 영토가 합쳐진 게 아님).
    원이 직접 다스린 지역만 별도 표시: 쌍성총관부(1258~1356), 동녕부(1270~1290), 탐라총관부(1273~).
    원과의 관계는 따로 관계선으로 표시
  status: 검수대기

- id: K08
  years: [1105, 1278]
  severity: low
  target: Tamna
  problem: 탐라가 1278년까지 독립국으로 되어 있음
  fix: 1105년 고려 탐라군 편입 반영 (이후는 고려 영역, 원 간섭기 탐라총관부는 원 간섭기 항목과 같이 처리)
  status: 검수대기

- id: K09
  years: [1392, 1394]
  severity: low
  target: Joseon
  problem: 조선 건국이 1395년으로 되어 있음
  fix: 1392년 건국
  status: 검수대기

- id: K10
  years: [1595, 1599]
  severity: high
  target: Joseon (1595~1599)
  problem: 서울·부산을 포함한 한반도 동남부가 일본(Warring States Japan) 영토로 그려짐
  fix: >
    조선 영역으로 복원. 서울은 1592년 5월 함락 → 1593년 4월 탈환이고,
    1597년 정유재란 때도 서울은 함락되지 않음. 일본군 점령지는 4단계 전쟁 레이어에서 '전쟁 중 점령지'로 따로 표시
  status: 검수대기

- id: K11
  years: [1636, 1639]
  severity: high
  target: Joseon (1636~1639)
  problem: 서울 일대가 후금(Later Jin) 영토로 그려짐, 그리고 1636년 국호가 '청'으로 바뀐 게 반영 안 됨
  fix: >
    조선 영역 복원 (병자호란 패배 후 군신 관계였지 영토가 합쳐진 게 아님 → 관계는 따로 관계선으로 표시).
    Later Jin Dynasty 를 1636년부터 Qing 으로 이름 변경
  status: 검수대기

- id: K12
  years: [1897, 1897]
  severity: low
  target: Korean Empire
  problem: 대한제국 시작이 1898년으로 되어 있음
  fix: 1897년(대한제국 선포)
  status: 검수대기

- id: K13
  years: [1945, 1966]
  severity: high
  target: Republic of Korea / United States of America (1947~1966)
  problem: 남한 지역에 미국 폴리곤이 1966년까지 대한민국과 겹쳐 있음
  fix: >
    1945~1948 은 '미군정(남)/소련군정(북)' 으로 표시, 1948년 8월 15일 대한민국 정부 수립부터 대한민국만 표시.
    미국 폴리곤에서 한반도 부분 제거
  status: 검수대기

- id: K14
