# 한반도 관련 Cliopatria v0.2.1 수정 목록
# - 1단계에서 발견만 하고, 실제 적용은 3단계(국경 보강)에서 함
# - 기준: 한국 고등학교 한국사 교과서 + 우리역사넷(국사편찬위원회)
# - years: 지도에 '알려진 오류' 안내를 띄울 연도 범위
# - severity: high(나라가 사라지거나 다른 나라로 칠해짐) / mid / low
# - status: 검수대기(태현 확인 필요) / 결정필요(학설 선택) / 확정 / 적용완료

- id: K01
  years: [669, 681]
  severity: mid
  target: Goguryeo
  problem: 668년 멸망인데 669~673년에도 전체 영역이 그대로 남아 있고, 674~681년에 작은 조각이 있음
  fix: ToYear 668 로 수정, 669~681 조각 삭제 (부흥운동은 4단계 사건으로 표시)
  status: 검수대기

- id: K02
  years: [676, 681]
  severity: low
  target: Silla / Unified Silla
  problem: 통일신라 시작이 682년으로 되어 있음
  fix: 676년(나당전쟁 승리, 삼국통일 완성)부터 통일신라
  status: 검수대기

- id: K03
