# 국제 관계 (지도에서 도읍끼리 곡선으로 이어 보여 줘요)
# 기준: 중학교 역사② (비상교육 2020) 의 대외 관계 본문·지도
# 필드
#   id, name: 이름 (교과서 용어)
#   type: alliance(동맹·연합) | tribute(사대·책봉·종속) | trade(교류·교역) | route(사절·이동 길) | rivalry(대립) | treaty(조약·수교)
#   from, to: 이 관계를 보여 줄 기간 (연도)
#   a, b: capitals.yaml 의 나라 이름 (a → b 방향. tribute 는 a 가 사신을 보낸 쪽)
#   via: 사절·이동 길처럼 중간 지점이 있을 때 [경도, 위도, 지명]
#   bloc: 같은 세력 구도로 묶을 때 이름 (국제 정세 패널에서 함께 보여 줘요)
#   imp: 3 교과서 핵심 / 2 본문 / 1 보조
#   pg: 교과서 쪽수
#   desc: 설명 (해요체)

# ───── 삼국 ─────
- {id: goguryeo-northern, name: 고구려와 북조의 교류, type: tribute, from: 386, to: 581, a: 고구려, b: 북조, imp: 1, pg: 42,
   desc: '고구려는 북위 등 중국 북조와 사신을 주고받으며 교류했어요. 장수왕은 북조와 남조 모두와 교류하는 외교를 펼쳤어요.'}
- {id: goguryeo-southern, name: 고구려와 남조의 교류, type: tribute, from: 420, to: 589, a: 고구려, b: 남조, imp: 1, pg: 27,
   desc: '장수왕은 남조와도 사신을 주고받아 북조를 견제했어요.'}
- {id: baekje-dongjin, name: 백제와 동진의 국교, type: tribute, from: 372, to: 419, a: 백제, b: 동진, imp: 2, pg: 29,
   desc: '근초고왕이 동진에 사신을 보내 국교를 맺었어요. 침류왕 때 동진에서 불교를 받아들였어요(384).'}
- {id: baekje-liang, name: 백제와 남조(양)의 교류, type: trade, from: 420, to: 589, a: 백제, b: 남조, imp: 2, pg: 30,
   desc: '백제는 남조와 활발히 교류했어요. 무령왕릉은 남조 양의 영향을 받은 벽돌무덤이에요.'}
- {id: baekje-wa, name: 백제와 왜의 교류, type: trade, from: 369, to: 660, a: 백제, b: 왜, imp: 3, pg: 43,
   desc: '백제는 왜와 가장 가까웠어요. 칠지도를 보내고, 아직기·왕인이 한문과 『논어』·『천자문』을, 성왕 때는 불교를 전했어요.'}
- {id: goguryeo-wa, name: 고구려 문화의 일본 전파, type: trade, from: 595, to: 668, a: 고구려, b: 왜, imp: 2, pg: 43,
   desc: '승려 혜자는 쇼토쿠 태자의 스승이 되었고, 담징은 종이와 먹 만드는 법을 전했어요. 삼국 문화는 일본 아스카 문화의 바탕이 됐어요.'}
- {id: silla-goguryeo-400, name: 고구려의 신라 간섭, type: tribute, from: 400, to: 433, a: 신라, b: 고구려, imp: 2, pg: 31,
   desc: '광개토 대왕이 군대를 보내 신라에 쳐들어온 왜를 물리친 뒤, 한동안 고구려군이 신라에 머물며 간섭했어요. 경주 호우총에서 나온 그릇에 광개토 대왕의 이름이 새겨져 있어요.'}
- {id: naje, name: 나제 동맹, type: alliance, from: 433, to: 553, a: 신라, b: 백제, imp: 3, pg: 32,
   desc: '고구려의 남진에 맞서 신라 눌지왕과 백제 비유왕이 맺은 동맹이에요. 493년 혼인 동맹으로 굳어졌지만, 553년 신라가 한강 하류를 차지하면서 깨졌어요.'}
- {id: silla-china-direct, name: 신라와 중국의 직접 교류, type: tribute, from: 564, to: 588, a: 신라, b: 북조, imp: 1, pg: 42,
   desc: '한강 유역을 차지한 신라는 당항성을 통해 중국과 직접 교류할 수 있게 됐어요.'}
# 6세기 후반~7세기: 남북 세력과 동서 세력 (교과서 49쪽 지도)
- {id: bloc-goguryeo-turk, name: 고구려와 돌궐의 연결, type: alliance, from: 589, to: 630, a: 고구려, b: 돌궐, bloc: 남북 세력, imp: 2, pg: 49,
   desc: '수가 중국을 통일하자 고구려는 북쪽의 돌궐과 손잡고 수에 맞섰어요.'}
- {id: bloc-goguryeo-baekje, name: 고구려와 백제의 연합, type: alliance, from: 642, to: 660, a: 고구려, b: 백제, bloc: 남북 세력, imp: 2, pg: 30,
   desc: '7세기 들어 고구려와 백제가 함께 신라를 압박했어요(643년 당항성 공격 등). 위기를 느낀 신라는 당과 손잡았어요.'}
- {id: bloc-baekje-wa, name: 백제와 왜의 연결, type: alliance, from: 589, to: 663, a: 백제, b: 왜, bloc: 남북 세력, imp: 2, pg: 49,
   desc: '백제는 왜와 손잡았어요. 백제가 멸망한 뒤 왜는 부흥군을 도우러 군대를 보냈다가 백강에서 졌어요.'}
- {id: bloc-silla-sui, name: 신라와 수의 연결, type: alliance, from: 589, to: 618, a: 신라, b: 수, bloc: 동서 세력, imp: 2, pg: 49,
   desc: '고구려·백제의 압박을 받던 신라는 수에 도움을 요청했어요. 고구려·백제·왜·돌궐을 잇는 남북 세력에 맞서 신라와 수(당)가 손잡은 동서 세력이 만들어졌어요.'}
- {id: najang, name: 나당 동맹, type: alliance, from: 648, to: 669, a: 신라, b: 당, bloc: 동서 세력, imp: 3, pg: 51,
   desc: '김춘추가 당 태종을 만나 맺은 동맹이에요. 백제와 고구려를 멸망시킨 뒤 대동강 이남은 신라가 갖기로 했지만, 당이 약속을 어겨 나당 전쟁(670~676)이 일어났어요.'}
# ───── 남북국 ─────
- {id: silla-tang-exchange, name: 통일 신라와 당의 교류, type: trade, from: 700, to: 907, a: 신라, b: 당, imp: 3, pg: 70,
   desc: '나당 전쟁 뒤 관계를 회복하고 사신·유학생·승려가 오갔어요. 산둥반도와 창장강 하류 일대에는 신라인 마을(신라방)과 사찰(신라원)이 생겼어요. 당항성(미래엔 교과서: 당은포)과 울산항이 중요한 무역항이었어요.'}
- {id: silla-japan, name: 통일 신라와 일본의 교류, type: trade, from: 700, to: 900, a: 신라, b: 일본, imp: 2, pg: 70,
   desc: '신라는 일본에 금속 제품과 모직물 등을 팔고 견직물의 원료를 사 왔어요. 당과 일본 사이의 중계 무역도 했어요.'}
- {id: jangbogo-network, name: 장보고의 해상 무역로, type: route, from: 828, to: 846, a: 신라, b: 일본, imp: 3, pg: 71,
   via: [[122.42, 36.89, 산둥 적산 (법화원)], [126.76, 34.35, 청해진 (완도)], [130.40, 33.60, 하카타]],
   desc: '장보고가 청해진을 근거로 해적을 소탕하고 당·신라·일본을 잇는 바닷길 무역을 장악했어요.'}
- {id: hyecho, name: 혜초의 인도 여행 (『왕오천축국전』), type: route, from: 723, to: 727, a: 당, b: 당, imp: 2, pg: 70,
   via: [[113.26, 23.13, 광저우], [88.4, 22.6, 동천축], [83.0, 25.3, 바라나시], [73.0, 33.7, 서북 인도], [71.5, 37.0, 파미르], [82.96, 41.72, 쿠차], [108.94, 34.26, 장안]],
   desc: '신라 승려 혜초가 바닷길로 인도에 가서 불교 성지를 순례하고 중앙아시아를 거쳐 당으로 돌아온 뒤 『왕오천축국전』을 썼어요. 길은 대략적이에요.'}
- {id: balhae-tang-rivalry, name: 발해와 당의 대립, type: rivalry, from: 726, to: 736, a: 발해, b: 당, imp: 2, pg: 59,
   desc: '당이 흑수 말갈을 이용해 발해를 견제하자 무왕이 장문휴를 보내 산둥반도 등주를 공격했어요(732).'}
- {id: balhae-turk, name: 발해와 돌궐의 친선, type: alliance, from: 719, to: 744, a: 발해, b: 돌궐, imp: 1, pg: 59,
   desc: '무왕은 당과 신라를 견제하려고 돌궐·일본과 친하게 지냈어요.'}
- {id: balhae-tang, name: 발해와 당의 교류, type: trade, from: 737, to: 926, a: 발해, b: 당, imp: 2, pg: 71,
   desc: '문왕 이후 당과 친선 관계를 맺고 유학생과 승려를 보냈어요. 말·모피·인삼을 팔고 비단·서적을 사 왔고, 산둥반도에 발해관이 있었어요.'}
- {id: balhae-japan, name: 발해와 일본의 교류 (일본도), type: route, from: 727, to: 919, a: 발해, b: 일본, imp: 3, pg: 71,
   via: [[130.27, 42.90, 동경 용원부], [130.70, 42.60, 염주 (크라스키노)], [136.20, 36.90, 노토·쓰루가]],
   desc: '발해는 당과 신라를 견제하려고 일본과 가까이 지냈어요. 동해를 건너는 ''일본도''로 30여 차례 사신을 보냈고, 일본에 보낸 국서에서 스스로 고려 국왕이라 했어요.'}
- {id: silla-road, name: 신라도 (발해와 신라를 잇는 길), type: route, from: 737, to: 926, a: 발해, b: 신라, imp: 3, pg: 71,
   via: [[130.27, 42.90, 동경 용원부], [128.30, 40.10, 남경 남해부], [127.40, 39.20, 천정군 (덕원)], [128.90, 37.75, 명주 (강릉)], [129.22, 35.83, 금성 (경주)]],
   desc: '문왕 때 발해 동경에서 동해안을 따라 신라로 가는 교통로를 열었어요. 두 나라는 한때 대립했지만 이 길로 사신이 오갔어요. 길은 대략적이에요.'}
# ───── 고려 ─────
- {id: goryeo-song, name: 고려와 송의 친선, type: trade, from: 962, to: 1126, a: 고려, b: 송, imp: 3, pg: 89,
   desc: '고려와 송은 거란을 견제하려고 가까이 지냈어요. 송 상인은 비단·서적·약재를, 고려는 나전 칠기·화문석·인삼·종이를 팔았고 벽란도가 국제 무역항으로 번성했어요. 거란과의 전쟁 뒤 공식 외교는 한동안 끊겼다가 1071년 다시 열렸지만, 상인들의 왕래는 계속됐어요.'}
- {id: goryeo-song-south, name: 고려와 남송의 교류, type: trade, from: 1127, to: 1270, a: 고려, b: 송, imp: 1, pg: 89,
   desc: '송이 남쪽으로 옮긴 뒤에도 바닷길로 상인들이 오갔어요.'}
- {id: goryeo-khitan-rivalry, name: 고려와 거란의 대립, type: rivalry, from: 942, to: 1019, a: 고려, b: 거란, imp: 3, pg: 87,
   desc: '태조는 발해를 멸망시킨 거란을 배척했어요(942 만부교 사건). 거란은 송과 가까운 고려를 세 차례 침입했어요.'}
- {id: goryeo-khitan-tribute, name: 고려와 거란(요)의 사대 관계, type: tribute, from: 1020, to: 1125, a: 고려, b: 거란, imp: 2, pg: 90,
   desc: '전쟁 뒤 고려는 거란에 정기적으로 사신을 보냈어요. 농기구·곡식을 주고 은·모피를 받았고 거란 대장경도 들어왔어요.'}
- {id: goryeo-jurchen, name: 고려와 여진의 교류, type: trade, from: 1000, to: 1106, a: 고려, b: 여진, imp: 1, pg: 90,
   desc: '여진은 말·화살을 가져와 식량·농기구로 바꿔 갔어요. 12세기 초 여진이 강해지면서 충돌했어요.'}
- {id: goryeo-jin, name: 고려와 금의 사대 관계, type: tribute, from: 1126, to: 1233, a: 고려, b: 금, imp: 2, pg: 88,
   desc: '금이 요를 멸망시키고 신하의 예를 요구하자 이자겸 등이 이를 받아들였어요. 묘청 등 서경 세력은 금을 정벌하자고 주장했어요.'}
- {id: goryeo-japan, name: 고려와 일본의 교역, type: trade, from: 1000, to: 1270, a: 고려, b: 일본, imp: 1, pg: 90,
   desc: '일본 상인은 수은·향료를 가져와 식량·인삼·서적을 사 갔어요.'}
- {id: goryeo-mongol-1219, name: 고려와 몽골의 첫 국교, type: alliance, from: 1219, to: 1225, a: 고려, b: 몽골, imp: 2, pg: 93,
   desc: '강동성의 거란인을 함께 물리친 것을 계기로 국교를 맺었지만, 몽골이 지나친 공물을 요구하며 관계가 나빠졌어요.'}
- {id: yuan-interference, name: 원 간섭기 (부마국 관계), type: tribute, from: 1270, to: 1356, a: 고려, b: 원, imp: 3, pg: 95,
   desc: '고려 국왕은 원의 공주와 혼인하고 왕자는 원에서 자랐어요. 원은 정동행성을 통해 내정에 간섭하고 공녀와 특산물을 요구했어요. 몽골풍과 고려양이 서로 퍼졌어요.'}
- {id: east-asia-1300, name: 14세기 동아시아 바닷길 교역, type: route, from: 1300, to: 1350, a: 원, b: 일본, imp: 1, pg: 91,
   via: [[121.55, 29.87, 경원 (닝보)], [126.08, 35.03, 신안 앞바다], [130.40, 33.60, 하카타]],
   desc: '원의 경원에서 일본 하카타로 가던 무역선(신안선)이 신안 앞바다에 가라앉아 1975년 발견됐어요.'}
- {id: goryeo-ming, name: 고려와 명의 관계, type: tribute, from: 1369, to: 1392, a: 고려, b: 명, imp: 2, pg: 99,
   desc: '공민왕은 명이 세워지자 원과 거리를 두고 명과 가까워졌어요. 명이 철령 이북 땅을 요구하자 우왕과 최영이 요동 정벌을 시도했어요(1388).'}
# ───── 조선 ─────
- {id: sadae-ming, name: 조선과 명의 사대 관계, type: tribute, from: 1401, to: 1636, a: 조선, b: 명, imp: 3, pg: 120,
   desc: '조선은 큰 나라를 섬기는 사대 외교로 명과 해마다 사신을 주고받았어요. 말·인삼을 보내고 약재·서적을 받으며 선진 문물을 받아들이고 왕권의 안정과 국제적 지위를 얻었어요.'}
- {id: gyorin-jurchen, name: 조선과 여진의 교린, type: trade, from: 1392, to: 1615, a: 조선, b: 여진, imp: 2, pg: 120,
   desc: '국경에 무역소를 두고 귀화한 여진인에게 관직과 땅을 주어 달래면서(회유), 약탈이 계속되면 4군 6진처럼 군대로 몰아냈어요(강경).'}
- {id: gyorin-japan, name: 조선과 일본의 교린, type: trade, from: 1404, to: 1591, a: 조선, b: 일본, imp: 2, pg: 120,
   desc: '조선은 일본 막부와 이웃끼리 대등하게 사귀는 교린 관계를 맺었어요. 대마도 토벌 뒤 3포를 열어 제한된 무역을 허락했어요.'}
- {id: sampo-trade, name: 3포 무역 (대마도), type: trade, from: 1426, to: 1510, a: 조선, b: 대마도, imp: 2, pg: 120,
   fan: [[128.70, 35.15, 제포], [129.04, 35.10, 부산포], [129.37, 35.50, 염포]],
   desc: '대마도주의 요청으로 제포·부산포·염포를 열었어요. 일본인 거류민이 늘고 통제가 심해지자 삼포 왜란(1510)이 일어났어요.'}
- {id: ryukyu, name: 조선과 류큐의 교류, type: trade, from: 1392, to: 1600, a: 류큐, b: 조선, imp: 1, pg: 120,
   desc: '류큐(오키나와)는 사신을 보내 토산품을 바치고 문방구·불경·유교 경전을 받아 갔어요.'}
- {id: siam-java, name: 조선과 시암·자와의 교류, type: trade, from: 1393, to: 1410, a: 시암, b: 조선, imp: 1, pg: 120,
   desc: '조선 초 시암(태국)과 자와(인도네시아)에서 사신이 와서 토산품을 바쳤어요.'}
- {id: tongsinsa-1590, name: 통신사 파견 (1590), type: route, from: 1590, to: 1591, a: 조선, b: 일본, imp: 1,
   via: [[129.04, 35.10, 부산], [129.29, 34.20, 대마도], [135.50, 34.69, 오사카], [135.76, 35.01, 교토]],
   desc: '황윤길과 김성일이 일본에 가서 도요토미 히데요시를 만났어요. 돌아와서 일본의 침략 가능성을 두고 서로 다르게 보고했어요.'}
- {id: hugeum-brothers, name: 후금과의 형제 관계, type: tribute, from: 1627, to: 1636, a: 조선, b: 후금, imp: 2, pg: 138,
   desc: '정묘호란 뒤 후금과 형제 관계를 맺었어요.'}
- {id: neutral-diplomacy, name: 광해군의 중립 외교, type: rivalry, from: 1616, to: 1623, a: 명, b: 후금, imp: 2, pg: 138,
   desc: '명과 후금이 맞서는 가운데 광해군은 명의 요청으로 강홍립을 보내면서 상황에 따라 대처하게 했어요. 조선과 명의 연합군이 후금에 지자 강홍립은 후금에 항복했고, 이후 광해군은 중립 외교로 후금과의 전쟁을 피했어요.'}
- {id: sadae-qing, name: 조선과 청의 사대 관계, type: tribute, from: 1637, to: 1894, a: 조선, b: 청, imp: 3, pg: 139,
   desc: '병자호란 뒤 청과 군신 관계를 맺었어요. 겉으로는 사대했지만 효종 때는 북벌을 준비했고, 18세기 이후에는 청의 문물을 배우자는 북학론이 나왔어요.'}
- {id: yeonhaengsa, name: 연행사 (청에 간 사신의 길), type: route, from: 1645, to: 1894, a: 조선, b: 청, imp: 3, pg: 158,
   via: [[126.98, 37.58, 한양], [126.55, 37.97, 개성], [125.75, 39.02, 평양], [124.53, 40.20, 의주], [123.45, 41.80, 선양], [119.75, 40.00, 산해관], [116.39, 39.91, 연경 (베이징)]],
   desc: '조선은 해마다 청의 수도 연경에 사절을 보냈어요. 사절들은 청과 서양의 발달한 문물을 보고 서적을 들여왔고, 함께 간 상인들은 사무역을 했어요. 박지원의 『열하일기』도 이 길에서 나왔어요.'}
- {id: tongsinsa, name: 통신사의 길, type: route, from: 1607, to: 1811, a: 조선, b: 일본, imp: 3, pg: 157,
   via: [[126.98, 37.58, 한양], [127.93, 36.97, 충주], [128.19, 36.59, 문경 새재], [129.04, 35.10, 부산], [129.29, 34.20, 대마도], [130.94, 33.96, 시모노세키], [133.92, 34.66, 오카야마 (세토 내해)], [135.50, 34.69, 오사카], [135.76, 35.01, 교토], [136.91, 35.18, 나고야], [137.73, 34.71, 하마마쓰], [139.76, 35.68, 에도]],
   desc: '국교를 회복한 뒤 조선은 200여 년 동안 12차례 300~500명의 통신사를 보냈고 대부분 에도까지 갔어요(1617년은 교토 부근 후시미까지, 마지막 1811년은 대마도까지만 갔어요). 쇼군에게 국서를 전하고 성리학·의학·그림 등을 전했어요.'}
- {id: waegwan, name: 부산 왜관 무역, type: trade, from: 1609, to: 1876, a: 대마도, b: 조선, imp: 2, pg: 157,
   desc: '기유약조(1609) 뒤 일본 사신과 상인은 한양에 오지 못하고 부산 왜관에서만 일을 보고 장사했어요.'}
# ───── 근대 ─────
- {id: ganghwa-treaty, name: 강화도 조약 (조일 수호 조규), type: treaty, from: 1876, to: 1905, a: 조선, b: 일본, imp: 3, pg: 175,
   desc: '운요호 사건을 구실로 일본이 강요한 조선 최초의 근대적 조약이에요. 부산·원산·인천을 열고 해안 측량권과 치외 법권(영사 재판권)을 인정한 불평등 조약이었어요.'}
- {id: susinsa, name: 수신사·조사 시찰단의 일본 방문, type: route, from: 1876, to: 1881, a: 조선, b: 일본, imp: 2, pg: 175,
   via: [[129.04, 35.10, 부산], [129.87, 32.75, 나가사키], [135.20, 34.69, 고베·오사카], [139.76, 35.68, 도쿄]],
   desc: '1876년과 1880년 수신사, 1881년 조사 시찰단이 일본에 가서 근대 문물과 제도를 살펴봤어요.'}
- {id: yeongseonsa, name: 영선사의 톈진 파견, type: route, from: 1881, to: 1882, a: 조선, b: 청, imp: 2, pg: 175,
   via: [[126.98, 37.57, 한양], [124.53, 40.20, 의주], [123.45, 41.80, 선양], [117.20, 39.13, 톈진]],
   desc: '김윤식이 학생·기술자를 이끌고 톈진에 가서 무기 만드는 법을 배웠어요. 돌아와 기기창을 세웠어요.'}
- {id: us-treaty, name: 조미 수호 통상 조약, type: treaty, from: 1882, to: 1905, a: 조선, b: 미국, imp: 3, pg: 175,
   desc: '청의 알선으로 서양 나라와 처음 맺은 조약이에요. 치외 법권(영사 재판권)과 최혜국 대우를 인정했어요.'}
- {id: bobingsa, name: 보빙사의 미국 방문, type: route, from: 1883, to: 1884, a: 조선, b: 미국, imp: 2, pg: 174,
   via: [[126.62, 37.47, 제물포], [139.64, 35.44, 요코하마], [-122.42, 37.77, 샌프란시스코], [-87.63, 41.88, 시카고], [-77.04, 38.90, 워싱턴]],
   desc: '민영익·홍영식·서광범 등이 미국에 가서 대통령을 만나고 근대 시설을 둘러봤어요. 서양에 간 첫 사절단이에요.'}
- {id: qing-interference, name: 청의 내정 간섭, type: tribute, from: 1882, to: 1894, a: 조선, b: 청, imp: 3, pg: 175,
   desc: '임오군란을 진압한 청이 군대를 머물게 하고 고문을 보내 내정과 외교에 간섭했어요. 조청 상민 수륙 무역 장정으로 청 상인의 내륙 진출도 허용됐어요.'}
- {id: other-treaties, name: 영국·독일·러시아·프랑스와 수교, type: treaty, from: 1883, to: 1905, a: 조선, b: 영국, imp: 1, pg: 187,
   desc: '조선은 1883년 영국·독일, 1884년 러시아, 1886년 프랑스와 차례로 조약을 맺어 문호를 넓혔어요.'}
- {id: geomundo-rivalry, name: 영국과 러시아의 대립 (거문도 사건), type: rivalry, from: 1885, to: 1887, a: 영국, b: 러시아, imp: 2, pg: 216,
   desc: '러시아의 남하를 막으려던 영국이 거문도를 불법 점령했어요. 조선을 둘러싼 열강의 대립이 심해졌어요.'}
- {id: triple-intervention-rel, name: 삼국 간섭, type: rivalry, from: 1895, to: 1896, a: 러시아, b: 일본, imp: 2,
   desc: '러시아가 프랑스·독일과 함께 일본을 압박해 랴오둥반도를 청에 돌려주게 했어요. 이후 조선 조정은 러시아와 가까워졌어요.'}
- {id: russia-agwan, name: 아관 파천과 러시아의 영향력, type: occupy, from: 1896, to: 1898, a: 조선, b: 러시아, imp: 2, pg: 176,
   desc: '고종이 러시아 공사관에 머무는 동안 러시아의 영향력이 커지고 열강의 이권 침탈이 심해졌어요.'}
- {id: anglo-japanese, name: 영일 동맹, type: alliance, from: 1902, to: 1910, a: 영국, b: 일본, imp: 2, pg: 216,
   desc: '러시아를 견제하려고 영국과 일본이 동맹을 맺었어요. 1905년 다시 맺은 동맹에서 영국은 일본의 한국 지배를 인정했어요.'}
- {id: katsura-taft-rel, name: 가쓰라·태프트 밀약, type: alliance, from: 1905, to: 1910, a: 미국, b: 일본, imp: 2,
   desc: '미국은 일본의 한국 지배를, 일본은 미국의 필리핀 지배를 서로 인정했어요.'}
- {id: eulsa-protectorate, name: 을사늑약과 통감 정치, type: tribute, from: 1905, to: 1910, a: 대한 제국, b: 일본, imp: 3, pg: 179,
   desc: '일본이 대한 제국의 외교권을 빼앗고 통감부를 두어 내정까지 간섭했어요.'}
# ───── 일제 강점기 ─────
- {id: provisional-route, name: 대한민국 임시 정부의 이동, type: route, from: 1932, to: 1940, a: 임시 정부, b: 임시 정부, imp: 3, pg: 183,
   via: [[121.47, 31.22, 상하이 (1919)], [120.16, 30.27, 항저우 (1932)], [119.45, 32.20, 전장 (1935)], [112.94, 28.23, 창사 (1937)], [113.26, 23.13, 광저우 (1938)], [109.41, 24.33, 류저우 (1938)], [106.67, 29.03, 치장 (1939)], [106.55, 29.56, 충칭 (1940)]],
   desc: '윤봉길 의거 뒤 일제의 추격과 중일 전쟁을 피해 임시 정부가 8년 동안 여러 도시로 옮겨 다니다 충칭에 자리 잡았어요.'}
- {id: colonial-rule, name: 일제의 식민 지배, type: tribute, from: 1910, to: 1945, a: 식민지 조선, b: 일본, imp: 3, pg: 181,
   desc: '일제는 조선 총독부를 두고 1910년대에는 헌병 경찰제(무단 통치), 1920년대에는 이른바 문화 통치, 1930년대 이후에는 민족 말살 정책으로 우리 민족을 지배했어요.'}
- {id: kpg-us-commission, name: 임시 정부의 구미 위원부, type: trade, from: 1919, to: 1925, a: 임시 정부, b: 미국, imp: 1, pg: 182,
   desc: '임시 정부는 미국 워싱턴에 구미 위원부를 두고 외교 활동을 펼쳐 한국의 독립을 국제 사회에 알렸어요.'}
- {id: japan-china-war, name: 일본의 중국 침략 (만주 사변·중일 전쟁), type: rivalry, from: 1931, to: 1945, a: 일본, b: 중화민국, imp: 2, pg: 183,
   desc: '일제는 만주 사변(1931)으로 만주를 차지하고 중일 전쟁(1937)을 일으켰어요. 한국 독립군과 조선 혁명군은 중국군과 손잡고 일본군에 맞섰어요.'}
- {id: pacific-war, name: 태평양 전쟁, type: rivalry, from: 1941, to: 1945, a: 일본, b: 미국, imp: 2, pg: 183,
   desc: '일제가 하와이 진주만을 기습하면서 태평양 전쟁이 일어났어요. 임시 정부는 일본에 선전 포고를 하고 연합국의 일원으로 싸웠어요.'}
- {id: cairo-potsdam, name: 카이로 선언·포츠담 선언 (미국·영국·중국), type: treaty, from: 1943, to: 1945, a: 미국, b: 카이로, imp: 2, pg: 185,
   fan: [[-77.04, 38.90, 미국 (워싱턴)], [-0.13, 51.51, 영국 (런던)], [106.55, 29.56, 중국 (충칭)]],
   desc: '미국·영국·중국 대표가 카이로 회담(1943)에서 적당한 시기에 한국을 독립시키기로 약속했고, 포츠담 선언(1945)에서 이를 다시 확인했어요.'}
- {id: kpg-china, name: 임시 정부와 중국 국민당 정부의 협력, type: alliance, from: 1932, to: 1945, a: 임시 정부, b: 중화민국, imp: 2, pg: 184,
   desc: '윤봉길 의거를 계기로 중국 국민당 정부가 임시 정부를 지원했어요. 한국 광복군도 중국 정부의 도움으로 만들어졌어요.'}
- {id: koryoin-deportation, name: 연해주 한인의 강제 이주, type: route, from: 1937, to: 1938, a: 소련, b: 소련, imp: 2,
   via: [[131.89, 43.12, 블라디보스토크], [104.30, 52.29, 이르쿠츠크 (시베리아 횡단 철도)], [77.98, 45.25, 우슈토베 (카자흐스탄)], [69.24, 41.30, 타슈켄트 (우즈베키스탄)]],
   desc: '소련이 연해주 한인 17만여 명을 화물 열차에 태워 수천 km 떨어진 중앙아시아로 강제로 옮겼어요. 길은 대략적이에요.'}
- {id: gwangbokgun-uk, name: 한국 광복군과 영국군의 협력, type: alliance, from: 1943, to: 1945, a: 임시 정부, b: 영국, imp: 1,
   desc: '광복군 공작대가 인도·미얀마 전선에서 영국군을 도왔어요.'}
- {id: gwangbokgun-oss, name: 한국 광복군과 미국 OSS의 협력, type: alliance, from: 1945, to: 1945, a: 임시 정부, b: 미국, imp: 2, pg: 183,
   desc: '국내 진공 작전을 위해 미국 전략 정보국(OSS)과 함께 대원들을 훈련했어요.'}
# ───── 현대 ─────
- {id: us-occupation, name: 38도선 이남 미군정, type: occupy, from: 1945, to: 1948, a: 남한, b: 미국, bloc: 냉전 자유 진영, imp: 3, pg: 185,
   desc: '광복 직후 미국과 소련이 북위 38도선을 경계로 한반도를 나누어 주둔했어요. 38도선 이남에서는 미군정이 실시됐어요.'}
- {id: soviet-occupation, name: 38도선 이북 소련군 주둔, type: occupy, from: 1945, to: 1948, a: 북한, b: 소련, bloc: 냉전 공산 진영, imp: 3, pg: 185,
   desc: '38도선 이북에는 소련군이 들어와 북한 지역의 정치를 이끌었어요.'}
- {id: moscow-conference, name: 모스크바 3국 외무 장관 회의와 미소 공동 위원회, type: treaty, from: 1945, to: 1947, a: 미국, b: 소련, imp: 2, pg: 205,
   desc: '미국·영국·소련 외무 장관이 모스크바에서 한반도에 임시 민주 정부를 세우고 최대 5년 동안의 신탁 통치를 협의하기로 했어요(1945.12). 이를 둘러싸고 좌우 대립이 심해졌고, 미소 공동 위원회도 결렬됐어요.'}
- {id: cold-war, name: 냉전 (미국과 소련의 대립), type: rivalry, from: 1947, to: 1991, a: 미국, b: 소련, imp: 2, pg: 207,
   desc: '제2차 세계 대전 뒤 미국 중심의 자본주의 진영과 소련 중심의 공산주의 진영이 맞섰어요. 한반도의 분단과 6·25 전쟁도 이 냉전 속에서 일어났어요.'}
- {id: un-election, name: 유엔 감시 총선거와 정부 승인, type: treaty, from: 1948, to: 1949, a: 대한민국, b: 유엔, bloc: 냉전 자유 진영, imp: 2, pg: 185,
   desc: '유엔 감시 아래 5·10 총선거가 치러졌고, 유엔 총회는 대한민국 정부를 선거가 가능했던 한반도 내에서 유일한 합법 정부로 승인했어요(1948.12).'}
- {id: un-forces, name: 유엔군 참전, type: alliance, from: 1950, to: 1953, a: 대한민국, b: 유엔, bloc: 냉전 자유 진영, imp: 3, pg: 206,
   desc: '유엔 안전 보장 이사회의 결의에 따라 미국을 비롯한 16개국이 전투 부대를, 여러 나라가 의료 부대를 보냈어요.'}
- {id: us-rok-alliance, name: 한미 상호 방위 조약, type: alliance, from: 1953, to: 2024, a: 대한민국, b: 미국, bloc: 냉전 자유 진영, imp: 3,
   desc: '정전 뒤 맺은 군사 동맹 조약이에요. 미군이 한국에 머무는 근거가 됐어요.'}
- {id: dprk-ussr, name: 북한과 소련의 동맹, type: alliance, from: 1948, to: 1991, a: 북한, b: 소련, bloc: 냉전 공산 진영, imp: 2, pg: 206,
   desc: '북한은 소련의 지원으로 정부를 세웠고 6·25 전쟁 때도 지원을 받았어요. 1961년 우호 조약을 맺었어요.'}
- {id: dprk-prc, name: 북한과 중국의 동맹, type: alliance, from: 1950, to: 2024, a: 북한, b: 중국, bloc: 냉전 공산 진영, imp: 2, pg: 206,
   desc: '중국은 6·25 전쟁에 대규모 군대를 보냈고, 1961년 북한과 우호 조약을 맺었어요.'}
- {id: rok-japan, name: 한일 국교 정상화, type: treaty, from: 1965, to: 2024, a: 대한민국, b: 일본, bloc: 냉전 자유 진영, imp: 3, pg: 198,
   desc: '한일 기본 조약으로 국교를 맺었어요. 식민 지배에 대한 사과와 배상이 미흡하다는 반대 시위(6·3 시위)가 거셌어요.'}
- {id: vietnam, name: 베트남 파병, type: alliance, from: 1964, to: 1973, a: 대한민국, b: 남베트남, bloc: 냉전 자유 진영, imp: 2, pg: 198,
   desc: '미국의 요청으로 국군을 베트남에 보냈어요. 경제적 이익을 얻었지만 많은 장병이 희생됐어요.'}
- {id: rok-ussr, name: 한소 수교 (북방 외교), type: treaty, from: 1990, to: 2024, a: 대한민국, b: 러시아, imp: 2, pg: 202,
   desc: '노태우 정부의 북방 외교로 소련과 국교를 맺었어요(1991년 소련 해체 뒤 러시아가 이어받음).'}
- {id: rok-prc, name: 한중 수교, type: treaty, from: 1992, to: 2024, a: 대한민국, b: 중국, imp: 2, pg: 202,
   desc: '6·25 전쟁에서 맞서 싸웠던 중국과 국교를 맺었어요.'}
- {id: un-membership-rel, name: 남북한 유엔 동시 가입, type: treaty, from: 1991, to: 2024, a: 대한민국, b: 유엔, imp: 2, pg: 207,
   desc: '남북한이 함께 유엔 회원국이 됐어요. 북한도 같은 날 가입했어요.'}
- {id: inter-korean, name: 남북 대화와 교류, type: trade, from: 1971, to: 2024, a: 대한민국, b: 북한, imp: 3, pg: 207,
   desc: '남북 적십자 회담(1971), 7·4 남북 공동 성명(1972), 남북 기본 합의서(1991), 6·15 남북 공동 선언(2000), 10·4 남북 공동 선언(2007), 판문점 선언(2018)으로 이어졌어요. 북한의 핵 실험과 도발로 위기를 겪기도 했어요.'}

# ───── 두 교과서 대조 검수에서 더한 관계 ─────
- {id: goguryeo-rouran, name: 고구려와 유연의 친선, type: trade, from: 413, to: 552, a: 고구려, b: 유연, imp: 1,
   desc: '장수왕은 북쪽 초원의 유연과 친선을 맺어, 남조와의 교류와 함께 북위를 견제했어요(미래엔 교과서 지도).'}
- {id: tang-tibet, name: 당과 토번의 대립, type: rivalry, from: 670, to: 676, a: 당, b: 토번, imp: 1,
   desc: '670년 당이 서쪽의 토번(티베트)에 크게 져 군대를 그쪽으로 돌려야 했어요. 이 틈에 신라가 나당 전쟁에서 당군을 몰아낼 수 있었어요(미래엔 교과서).'}
- {id: silla-arab, name: 통일 신라와 아라비아 상인, type: trade, from: 750, to: 900, a: 신라, b: 아라비아, imp: 1, pg: 70,
   desc: '아라비아 상인들이 울산항까지 와서 장사했어요. 이들을 통해 신라의 이름이 이슬람 세계에 알려졌어요.'}
- {id: goryeo-arab, name: 고려와 아라비아 상인, type: trade, from: 1024, to: 1100, a: 고려, b: 아라비아, imp: 1, pg: 90,
   desc: '아라비아(대식국) 상인들이 벽란도에 와서 수은·향료 등을 팔았어요. 이들을 통해 고려(Korea)라는 이름이 서양에 알려졌어요.'}
- {id: yuan-japan, name: 원의 일본 원정 (고려 동원), type: rivalry, from: 1274, to: 1281, a: 원, b: 일본, imp: 2, pg: 95,
   desc: '원은 고려를 동원해 두 차례 일본 원정에 나섰지만 실패했어요. 고려는 배와 군사, 식량을 대느라 큰 고통을 겪었고, 원정을 위해 둔 정동행성은 이후 고려의 내정 간섭 기구가 됐어요.'}
- {id: joseon-ming-early, name: 조선 건국 초 명과의 갈등, type: rivalry, from: 1392, to: 1400, a: 조선, b: 명, imp: 1, pg: 120,
   desc: '건국 초에는 외교 문서(표전) 문제 등으로 명과 갈등을 빚었고, 정도전이 요동 정벌을 추진하기도 했어요. 태종 때 관계가 안정됐어요.'}
- {id: ming-aid-imjin, name: 임진왜란 때 명의 지원군, type: alliance, from: 1592, to: 1598, a: 조선, b: 명, imp: 3, pg: 135,
   desc: '조선의 요청으로 명이 지원군을 보내 조선군과 함께 평양성을 되찾았어요. 임진왜란은 조선·명·일본이 얽힌 동아시아 국제 전쟁이었어요.'}
- {id: baekdusan-stele-rel, name: 백두산정계비 (조선과 청의 국경 확인), type: treaty, from: 1712, to: 1712, a: 조선, b: 청, imp: 2, pg: 215,
   desc: '조선과 청이 백두산에 비석을 세워 서쪽은 압록강, 동쪽은 토문강을 경계로 정했어요. 뒤에 토문강의 해석을 두고 간도 문제가 생겼어요.'}
- {id: tianjin-1885, name: 톈진 조약 (청과 일본), type: treaty, from: 1885, to: 1894, a: 청, b: 일본, imp: 2, pg: 176,
   desc: '갑신정변 뒤 청과 일본이 조선에서 함께 군대를 물리고, 앞으로 군대를 보낼 때는 서로 알리기로 약속했어요. 이 조약이 1894년 일본군 출병의 구실이 됐어요.'}
- {id: sino-japanese-war-rel, name: 청일 전쟁, type: rivalry, from: 1894, to: 1895, a: 청, b: 일본, imp: 3, pg: 176,
   desc: '동학 농민 운동을 계기로 조선에 들어온 청과 일본이 싸웠어요. 일본이 이겨 조선에 대한 청의 영향력이 사라졌어요.'}
- {id: russo-japanese-war-rel, name: 러일 전쟁, type: rivalry, from: 1904, to: 1905, a: 러시아, b: 일본, imp: 3, pg: 179,
   desc: '한반도와 만주를 두고 러시아와 일본이 싸웠어요. 일본은 전쟁 중 독도를 불법으로 편입했고, 이긴 뒤 을사늑약을 강요했어요.'}
- {id: gando-convention-rel, name: 간도 협약 (청과 일본), type: treaty, from: 1909, to: 1909, a: 청, b: 일본, imp: 2, pg: 216,
   desc: '외교권을 빼앗은 일본이 남만주 철도 부설권 등을 얻는 대가로 간도를 청의 영토로 마음대로 인정했어요.'}
- {id: paris-1919, name: 파리 강화 회의에 간 김규식, type: route, from: 1919, to: 1919, a: 임시 정부, b: 프랑스, imp: 1, pg: 182,
   via: [[121.47, 31.22, 상하이], [2.35, 48.86, 파리]],
   desc: '김규식이 파리 강화 회의에 가서 한국의 독립을 청원했어요. 임시 정부 초기의 대표적인 외교 활동이에요.'}

