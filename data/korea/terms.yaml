  y: 993
  d: 압록강 동쪽에 있던 여섯 고을이에요. 거란의 1차 침입 때 서희가 거란 장수 소손녕과 담판을 벌여 이 땅을 고려 영토로 인정받았고, 고려의 영토가 압록강까지 넓어졌어요.
  x: 거란은 송을 공격하기에 앞서 고려가 송과 손잡는 것을 막으려고 쳐들어왔어요. 서희는 고려가 고구려를 이은 나라이며, 압록강 동쪽을 여진이 막고 있어 거란과 교류하지 못한다고 맞서, 여진을 몰아내면 거란과 교류하겠다는 약속으로 이 땅을 얻었어요. 흥화진·용주·철주·통주·곽주·귀주를 말하며, 뒤에 거란의 3차 침입 때 고려군이 거란군을 무찌른 흥화진과 귀주도 여기에 있어요.
  pg: [86, 87]
  mp: [82]
  at: [124.85, 39.87]
  ap: 1
  note: 6주(흥화진·용주·철주·통주·곽주·귀주)는 미래엔 82쪽 지도. at 은 6주 일대의 가운데쯤(대략). 서희의 담판은 wars khitan-1 에 있음(events 에는 없음).
- n: 논산 관촉사 석조 미륵보살 입상
  a: [관촉사 석조 미륵보살 입상, 은진 미륵]
  k: 문화유산
  era: 고려
  y: 1006
  d: 충남 논산 관촉사에 있는 고려 초의 거대한 돌 불상이에요. 높이가 약 18m로 우리나라에서 가장 큰 불상이며, 고려 초 지방에서 유행한 대규모 석조 불상을 대표해요.
  x: 흔히 '은진 미륵'이라고 불러요. 970년 무렵 만들기 시작해 1006년(목종 9)에 완성했다고 전하며, 국보로 지정되어 있어요. 고려 초에는 하남 하사창동 철조 석가여래 좌상 같은 큰 철불과 이런 거대한 석불이 만들어졌고, 한편으로는 영주 부석사 소조 아미타여래 좌상처럼 통일 신라 양식을 이은 불상도 만들었어요.
  pg: [100, 106]
  mp: [96]
  at: [127.113, 36.189]
  note: 970년에 만들기 시작해 1006년(목종 9)에 완성, 국보 — 한국민족문화대백과 '혜명'(E0063586; 968년 광종 때 조성했다는 설명도 있음). 높이 18m 는 비상 100쪽. 좌표는 dh.aks.ac.kr 문화유산 위키 지도 링크.
- n: 예천 개심사지 5층 석탑
  a: [개심사지 5층 석탑, 예천 개심사지 오층 석탑]
  k: 문화유산
  era: 고려
  y: 1010
  d: 경북 예천의 개심사 터에 남은 고려 초의 석탑이에요. 예천군과 다인현의 향도 등 1만여 명이 탑을 세우는 데 참여했다는 기록이 새겨져 있어 향도의 활동을 잘 보여 줘요.
  x: 1010년(현종 1)에 세운 탑으로, 탑을 세운 목적을 '부처의 은혜에 보답하고 나라를 위하며 공덕을 바르게 하기 위해서'라고 새겨 두었어요. 향도는 불교 신앙으로 뭉친 큰 노동 조직으로, 향리를 중심으로 운영되며 절·불상·석탑을 만드는 일에 앞장섰어요. 고려 후기에는 이웃의 장례를 함께 치르고 잔치를 여는 작은 농민 모임으로 바뀌었어요.
  pg: [102]
  at: [128.45, 36.65]
  ap: 1
  note: 1010년(현종 1) 건립, 소재지 예천읍 남본리 200-3, 2025년 국보 지정 — 한국민족문화대백과 '예천 개심사지 오층석탑'(E0001683). 정확한 좌표를 못 찾아 예천읍 남쪽 대략 위치(ap).
- n: 강감찬
  k: 인물
  era: 고려
  y: 1019
  d: 거란의 3차 침입 때 고려군을 이끈 장수예요. 개경을 함락하지 못하고 물러가던 거란군을 귀주에서 크게 무찔러 귀주 대첩을 이끌었어요. 서울 관악구의 낙성대는 그가 태어난 곳으로 전해져요.
  x: 거란의 소배압이 10만 대군으로 쳐들어오자 상원수가 되어 부원수 강민첨과 함께 약 20만 명의 고려군을 이끌었어요. 먼저 흥화진에서 거란군을 꺾었고, 귀주에서는 살아 돌아간 적이 수천 명뿐일 만큼 크게 이겼어요. 이 승리 뒤 고려는 개경에 나성을, 국경에 천리장성을 쌓아 북방 민족의 침입에 대비했어요.
  pg: [87]
  mp: [82]
  note: 'events 에 강감찬 사건이 없어 ev 없음. 관련 전쟁: data/wars/korea.yaml khitan-3(귀주 대첩). 낙성대 이야기는 비상 87쪽 사진 설명(큰 별이 떨어졌다는 데서 지명 유래).'
- n: 7대 실록
  a: [칠대실록]
  k: 책·기록
  era: 고려
  y: 1034
  d: 거란의 침입으로 궁궐이 불타 이전 왕들의 기록이 사라지자 현종 때 다시 엮기 시작한 역사서예요. 태조부터 목종까지 일곱 왕의 역사를 담았지만 지금은 전하지 않아요.
  x: 1013년(현종 4)에 편찬을 시작해 덕종 때인 1034년 무렵 36권으로 마무리했다고 봐요. 고려는 그 뒤에도 실록을 계속 펴냈고, 이 실록들은 조선 시대에 『고려사』를 편찬할 때 쓰였지만 지금은 모두 전하지 않아요. 고려 초의 『삼국사』도 사라져서, 지금 전하는 가장 오래된 역사서는 김부식의 『삼국사기』예요.
  pg: [105]
  note: 1013년(현종 4) 편찬 시작, 덕종 3년(1034) 무렵 마무리, 36권, 전하지 않음 — 한국민족문화대백과 '칠대실록'(E0058461). y 는 마무리된 해. 비상 각주는 '현종이 편찬한 역사서'.
- n: 순청자
  k: 예술
  era: 고려
  y: 1050
  d: 무늬를 넣지 않고 맑은 푸른빛(비색)을 살린 청자예요. 고려는 11세기까지 주로 순청자를 만들었고, 12세기 이후에는 상감 청자를 많이 만들었어요.
  x: 고려는 처음에 당·송의 기술을 받아들여 청자를 만들었는데, 10세기 무렵 유약을 바른 자기를 거쳐 11세기에는 맑은 푸른빛을 내게 되었어요. 12세기 초 고려에 온 송의 사신 서긍은 『선화봉사고려도경』에 고려 사람들이 이 빛깔을 '비색'이라 부르며, 근래 솜씨와 빛깔이 더욱 좋아졌다고 적었어요. 무늬 대신 그릇의 모양과 빛깔로 아름다움을 냈어요.
  pg: [107]
  mp: [97]
  note: '비상 107쪽 연표: 10세기 유약을 바른 자기, 11세기 비색 청자. y 는 대략 연도(11세기). 비상은 청자 참외 모양 병(1146)을 순청자의 대표작으로 듦.'
- n: 청자 참외 모양 병
  a: [청자 참외모양 병]
  k: 문화유산
  era: 고려
  y: 1146
  d: 참외 모양의 몸체에 긴 목을 단 고려의 순청자예요. 고려 인종의 무덤에서 나와 만든 때를 알 수 있는 작품으로, 국립 중앙 박물관에 있어요.
  x: '''황통 6년(1146)''이라고 적힌 인종의 시책(왕의 시호를 올리며 지은 글)과 함께 인종의 무덤인 장릉에서 나와 1146년(인종 24)에 만든 것으로 봐요. 긴 목 위의 입은 참외 꽃처럼 벌어졌고, 아래는 치마 주름 같은 높은 굽이 몸통을 받치고 있어요. 만든 해가 분명해 12세기 전반 순청자의 수준을 알려 주는 기준 작품이며, 국보예요.'
  pg: [107]
  note: '1146년(인종 24) 무렵 제작, 국보, 국립중앙박물관 — 한국민족문화대백과 ''청자 참외모양 병''(E0056660), ''장릉''(E0048425: 함께 나온 인종 시책으로 연대 확인).'
- n: 상감 청자
  a: [상감청자]
  k: 예술
  era: 고려
  y: 1150
  d: 그릇 겉면에 무늬를 새기고 그 자리를 흰 흙이나 검은 흙으로 메워 무늬를 나타낸 청자예요. 고려가 독자적으로 발전시킨 기법으로, 12세기부터 남부 해안 지역에서 많이 만들었어요.
  x: 청자에 상감으로 무늬를 넣기 시작한 것은 12세기 전반이고, 13세기에 전성기를 맞아 청자 상감 운학문 매병 같은 걸작이 나왔어요. 고려 후기에는 청자를 워낙 많이 구워 내 품질이 낮은 것은 평민도 쓸 정도였어요. 하지만 고려 말 왜구의 노략질로 바닷가 지역이 피폐해지자 좋은 청자를 만들기 어려워졌고, 청자 기법을 바탕으로 한 분청사기가 그 뒤를 이었어요. 미래엔 교과서는 12세기 중엽부터 주로 만들었다고 써요.
  pg: [107]
  mp: [97]
  note: '비상: 12세기 이후 주로 만듦, 13세기 전성기(107쪽 연표). 미래엔: 12세기 중엽부터 주로 만듦. y 는 대략 연도. 상감 = 겉면에 다른 재료를 넣어 무늬를 나타내는 기법, 청자에 쓰기 시작한 것은 12세기 전반 — 한국민족문화대백과 ''상감''(E0026995).'
- n: 이의방
  k: 인물
  era: 고려
  y: 1170
  d: 정중부와 함께 무신 정변을 일으킨 무신이에요. 정변 뒤 무신 정권의 첫 집권자가 되었지만, 무신들끼리의 권력 다툼 속에 정중부에게 권력을 빼앗겼어요.
  x: 1170년 보현원에서 정중부·이고 등과 정변을 일으켜 의종을 몰아내고, 의종의 동생인 명종을 왕으로 세웠어요. 이듬해 함께 정변을 일으킨 이고를 죽이고 딸을 태자비로 들일 만큼 권세를 누렸지만, 1174년 정중부의 아들 정균에게 죽임을 당했어요. 이처럼 정변 초기의 무신들은 중방에 모여 나랏일을 처리하면서도 서로 죽고 죽이는 권력 다툼을 벌였어요.
  pg: [83]
  mp: [80]
  ev: [musin-coup]
  inst: goryeo-musin
  note: 집권 순서는 두 교과서 그림(이의방 1170 → 정중부 1174 정권 탈취). 이의방이 피살된 일은 교과서에 없어 쓰지 않음.
- n: 정중부
  k: 인물
  era: 고려
  y: 1170
  d: 문신에게 차별받던 무신으로, 이의방 등과 함께 1170년 무신 정변을 일으켰어요. 김부식의 아들 김돈중이 그의 수염을 태운 일화가 전해지며, 1174년부터 정권을 잡았어요.
  x: 당시 무신은 정3품 상장군까지만 오를 수 있었고 군대의 최고 지휘관도 문신이 맡는 등 차별을 받았어요. 문신 한뢰가 대장군 이소응의 뺨을 때리는 일까지 벌어지자, 의종이 보현원에 머문 틈에 정변을 일으켜 많은 문신을 죽였어요. 집권 뒤 문하시중에 올라 넓은 농장을 차지했지만, 1179년 젊은 장군 경대승에게 아들 정균과 함께 죽임을 당했어요.
  pg: [83]
  mp: [80]
  ev: [musin-coup]
  inst: goryeo-musin
  note: 수염 일화는 비상 83쪽 '현장 속으로'. 1174년 집권은 두 교과서 그림.
- n: 송광사
  a: [순천 송광사, 수선사]
  k: 문화유산
  era: 고려
  y: 1200
  d: 전남 순천에 있는 절로, 고려 후기에는 수선사라고 불렸어요. 무신 집권기에 지눌이 이곳을 중심으로 불교의 세속화를 비판하며 불교 개혁 운동을 펼쳤어요.
  x: 지눌은 승려들의 타락을 비판하며 불경 공부와 수행, 노동에 고루 힘쓰자는 결사 운동을 펼쳤어요. 1200년 이 결사를 지금의 송광사 자리(당시 길상사)로 옮겼고, 1205년 수선사라는 이름을 얻었어요. 지눌은 깨달음을 닦는 선종과 지혜를 닦는 교종이 결국 같다고 보아 선종을 중심으로 교종을 아우르려 했어요. 노비를 절에 기증한 고려 때 문서도 이 절에 전해 와요.
  pg: [84, 103]
  mp: [94]
  at: [127.276, 35.002]
  ev: [jinul]
  note: 1200년(신종 3) 지눌이 결사를 길상사(지금의 송광사)로 옮기고 1205년 수선사로 이름을 바꿈 — 한국민족문화대백과 '수선사'(E0031457). 비상 84쪽 송광사 노비 문서, 미래엔 94쪽 지눌 초상(순천 송광사). 좌표는 en.wikipedia 'Songgwangsa'.
- n: 안동 봉정사 극락전
  a: [봉정사 극락전]
  k: 문화유산
  era: 고려
  y: 1200
  d: 경북 안동 봉정사에 있는 고려 시대의 불교 건축물이에요. 배흘림기둥과 기둥 위에만 공포를 둔 주심포 양식을 갖추었고, 우리나라에서 가장 오래된 목조 건물로 꼽혀요.
  x: 1972년 해체·수리할 때 나온 조선 시대 상량문에 1363년(공민왕 12)에 지붕을 고쳤다는 기록이 있어, 처음 지은 것은 그보다 앞선 12~13세기로 봐요. 기둥 위에만 공포를 짜 올린 주심포 양식에 맞배지붕을 얹었고, 부석사 무량수전보다 더 옛 방식이 남아 있어요. 고려 후기에는 원의 영향으로 기둥 사이에도 공포를 둔 다포 양식(황주 성불사 응진전)도 나타났어요.
  pg: [106]
  mp: [96]
  at: [128.663, 36.653]
  note: 1363년(공민왕 12) 지붕을 고친 기록이 있어 적어도 12~13세기에 지은 것으로 봄 — 한국민족문화대백과 '안동 봉정사 극락전'(E0024004). y 는 대략 연도. 좌표는 dh.aks.ac.kr 문화유산 위키 지도 링크.
- n: 교정도감
  k: 제도
  era: 고려
  y: 1209
  d: 최충헌이 세운 무신 정권의 최고 권력 기구예요. 나라의 중요한 정책을 정하고 집행했으며, 그 뒤 무신 집권자들이 대를 이어 이곳의 우두머리 자리를 차지했어요.
  x: 1209년(희종 5) 최충헌 부자를 죽이려는 음모를 조사하려고 세운 임시 기구였는데, 없어지지 않고 세금·인사·감찰까지 맡는 국정의 중심이 되었어요. 우두머리인 교정별감은 왕이 임명하는 형식이었지만 실제로는 최우·최항, 뒤의 김준·임연·임유무 등 무신 집권자가 이어받았고, 1270년 임유무가 죽으며 함께 사라졌어요. 여러 무신이 모여 의논하던 중방과 달리 집권자 한 사람의 권력을 뒷받침한 기구였어요.
  pg: [83]
  mp: [80, 81]
  ev: [choe-chungheon]
  inst: goryeo-musin
  note: 1209년(희종 5) 설치, 1270년 임유무가 죽으며 없어짐, 장관은 교정별감 — 한국민족문화대백과 '교정도감'(E0005565). 교과서 그림은 최충헌 집권(1196)부터 교정도감 시기로 그림.
- n: 서방
  k: 제도
  era: 고려
  y: 1227
  d: 최우가 만든 기구로, 학식과 능력을 갖춘 문인들을 모아 정책에 대한 조언을 들었어요. 이 과정에서 이규보 같은 문신이 등용되었어요.
  x: 1227년(고종 14)에 두었고, 최우의 문객 가운데 학문이 뛰어난 문사들을 세 번(番)으로 나누어 번갈아 최우의 곁을 지키게 했어요. 이들은 글을 짓는 일과 정책 자문을 맡았는데, 몽골과 전쟁하던 시기에는 몽골에 보내는 외교 문서 작성이 특히 중요했어요. 무신이 지키는 도방과 함께 최씨 정권을 받쳤고, 정변 뒤 밀려나 있던 문인들이 정치에 참여하는 통로가 되었어요.
  pg: [83]
  ev: [jeongbang]
  inst: goryeo-musin
  note: 1227년(고종 14) 최우가 설치 — 한국민족문화대백과 '서방'(E0027750, 숙위와 문한을 맡은 기관으로 설명). 미래엔에는 없음.
- n: 박서
  k: 인물
  era: 고려
  y: 1231
  d: 몽골의 1차 침입 때 귀주성을 지킨 장수예요. 몽골군이 굴을 파고 불을 지르는 등 온갖 방법으로 공격했지만 끝까지 막아 내 물러가게 했어요.
  x: 1231년 몽골은 고려에 왔던 사신이 돌아가는 길에 죽은 일을 구실로 쳐들어왔어요. 귀주성은 거란의 3차 침입 때 강감찬이 귀주 대첩을 거둔 북쪽 국경의 요충지였고, 박서는 이곳에서 고려군을 지휘해 끝까지 성을 지켰어요. 그러나 다른 여러 성이 함락되자 고려 정부는 피해를 줄이려고 몽골과 강화를 맺었어요. 미래엔 교과서는 박서를 김윤후와 함께 대몽 항쟁의 영웅으로 소개해요.
  mp: [84, 85]
  note: 비상은 '귀주성' 항전만 쓰고 박서 이름은 없음. events 에 사건 없음 → wars mongol-1 귀주성 전투.
- n: 강화 천도
  a: [강화도 천도]
  k: 사건
  era: 고려
  y: 1232
  d: 몽골의 침입에 맞서 최씨 정권이 도읍을 개경에서 강화도로 옮긴 일이에요. 강화도는 농사지을 땅이 많아 식량이 넉넉했고, 물살이 거세 바다 싸움에 약한 몽골군이 쉽게 건너오지 못했어요.
  x: 1231년 강화를 맺은 뒤에도 몽골이 다루가치를 두고 간섭하자, 최우는 반대하는 신하들을 누르고 1232년 천도를 강행했어요. 백성은 산성과 섬으로 들어가 싸우게 했고, 강화도에는 1234년 궁궐과 관청을 지었어요. 1270년 개경으로 돌아갈 때까지 38년 동안 이어졌는데, 최씨 정권은 전쟁 중에도 사치를 일삼고 세금을 무겁게 거두어 육지 백성의 원성을 샀어요.
  pg: [93]
  mp: [84]
  ev: [gaegyeong-return]
  note: '미래엔: 최우가 강화도로 수도를 옮김. 1270년 개경 환도(사건 gaegyeong-return)까지 도읍. wars mongol-2 의 ''강화도 천도'' 항목과 같은 일.'
- n: 강화산성
  k: 유적·유물
  era: 고려
  y: 1232
  d: 인천 강화도에 있는 성으로, 몽골의 침입을 피해 고려가 도읍을 강화도로 옮긴 역사를 보여 줘요. 강화도는 식량이 넉넉하고 바다로 둘러싸여 몽골군을 막기에 유리했어요.
  x: 도읍을 옮긴 고려는 1234년 강화도에 궁궐과 관청을 짓고, 내성·외성·중성을 차례로 쌓아 도읍을 지켰어요. 이 시기 고려 정부는 불교의 힘으로 몽골을 물리치려고 팔만대장경을 새기기도 했어요. 몽골은 강화 조건으로 개경으로 돌아갈 것을 요구했고, 1270년 정부가 개경으로 돌아가자 이에 반대한 삼별초는 진도와 제주도로 옮겨 가며 싸웠어요.
  pg: [93]
  mp: [84]
  at: [126.48, 37.75]
  note: 두 교과서 모두 강화 천도 설명에 사진(남문 안파루)으로 실음. 고려 때 도성으로 쌓은 뒤 몽골과 강화하며 헐렸고, 지금 성벽과 문은 대부분 조선 때 다시 쌓은 것 — dh.aks.ac.kr 문화유산 위키 '강화산성'(백과사전 확인 필요). y 는 강화 천도 해(쌓기 시작한 정확한 해는 확인 필요). at 은 강화읍 일대.
- n: 김윤후
  k: 인물
  era: 고려
  y: 1232
  d: 몽골의 침입에 맞서 싸운 승려예요. 처인성에서 처인 부곡 사람들과 함께 몽골군 총사령관 살리타를 죽였고, 뒤에 충주성에서도 노비를 해방해 사기를 높여 몽골군을 막아 냈어요.
  x: 처인성(지금의 경기 용인) 전투에는 차별받던 특수 행정 구역인 처인 부곡의 백성이 함께했어요. 총사령관 살리타를 잃은 몽골군은 물러갔고(1232), 뒤에 충주성 전투(1253)에서는 노비의 신분을 해방해 사기를 높여 성을 지켜 냈어요. 이처럼 몽골에 맞선 싸움에는 관군뿐 아니라 부곡민과 노비 같은 차별받던 사람들도 함께했어요.
  pg: [93]
  mp: [85, 86]
  note: '비상 93쪽 ''처인성 전투'' 상자(OCR 에서 빠짐, 그림으로 확인). events 에 사건 없음 → 관련 전투: wars mongol-2 처인성 전투(1232), mongol-later 충주성 전투(1253).'
- n: 다루가치
  k: 제도
  era: 고려
  y: 1232
  d: 몽골이 정복한 지역에 두어 내정을 감시하고 감독하게 한 관리예요. 몽골의 1차 침입 뒤 강화가 맺어지자 몽골군은 개경과 북쪽 점령지에 다루가치를 두고 돌아갔어요.
  x: 몽골어로 '속박하는 사람'이라는 뜻으로, 점령지를 다스리는 최고 책임자를 가리켰어요. 1232년 정월 몽골군은 다루가치 72명을 남기고 물러갔는데, 몽골의 간섭이 계속되자 최씨 정권은 도읍을 강화도로 옮겨 맞섰어요. 뒤에 원종이 쿠빌라이와 강화를 맺을 때 '고려에 둔 다루가치 일행은 모두 돌려보낸다'는 조건이 들어갔어요.
  pg: [93, 94]
  mp: [85]
  note: 1232년(고종 19) 정월 72명을 두고 철수 — 한국민족문화대백과 '다루가치'(E0013435). 1차 침입은 1231년(wars mongol-1). 비상 94·미래엔 85쪽의 강화 조건 5조에 '다루가치 일행은 모두 귀환'.
- n: 청자 상감 운학문 매병
  a: [청자 상감운학문 매병]
  k: 문화유산
  era: 고려
  y: 1250
  d: 구름과 학 무늬를 흰색과 검은색 상감으로 새겨 넣은 매병이에요. 고려 상감 청자를 대표하는 작품으로, 간송 미술관에 있어요.
  x: 높이 42.1cm의 큰 매병으로, 몸통의 둥근 무늬 안에는 하늘로 날아오르는 학을, 무늬 밖에는 땅으로 내려오는 학을 상감으로 새겼어요. 구름과 학이 흰색·검은색 상감으로 가득 어우러진 당당한 모습이 돋보이는 국보예요. 미래엔 교과서는 이 매병을 개성 경천사지 10층 석탑과 함께 고려 문화를 대표하는 문화유산으로 다뤄요.
  pg: [107]
  mp: [97]
  note: '비상 107쪽: 13세기, 간송 미술관. y 는 13세기 대략 연도. 소장처는 한국민족문화대백과 ''상감''(E0026995)에서도 확인.'
- n: 예산 수덕사 대웅전
  a: [수덕사 대웅전]
  k: 문화유산
  era: 고려
  y: 1308
  d: 충남 예산 수덕사의 중심 건물로, 고려 후기에 지은 목조 건축물이에요. 배흘림기둥과 주심포 양식을 갖추었고, 지은 해를 알 수 있어 고려 건축을 연구하는 데 중요해요.
  x: 건물을 수리할 때 나온 먹 글씨에 1308년(충렬왕 34) 4월에 기둥을 세웠다고 적혀 있어 지은 해를 알 수 있어요. 안동 봉정사 극락전·영주 부석사 무량수전과 함께 고려 때 지어 지금까지 남은 대표 목조 건물이에요. 세 건물 모두 기둥 위에만 공포를 둔 주심포 양식이라, 기둥 사이에도 공포를 둔 다포 양식과 구별해 알아 두면 좋아요.
  pg: [106]
  mp: [96]
  at: [126.622, 36.663]
  note: 수리 때 나온 묵서에 1308년(충렬왕 34) 4월 기둥을 세웠다고 적혀 있음 — 한국민족문화대백과 '수덕사 벽화'(E0031278). 좌표는 en.wikipedia 'Sudeoksa'.
- n: 수월관음도
  k: 문화유산
  era: 고려
  y: 1320
  d: 관음보살을 그린 고려 후기의 대표적인 불화예요. 왕실이나 문벌 가문의 후원을 받아 평안과 극락왕생을 빌며 크고 화려하게 그렸어요. 일본 다이토쿠지에 있는 작품이 잘 알려져 있어요.
  x: 다이토쿠지의 수월관음도는 세로 약 2.3m의 큰 그림으로, 바위에 앉은 관음보살 앞에 정병이, 뒤에 대나무가 있고 선재동자와 공양하러 오는 사람들도 그려져 있어요. 비단에 채색하고 관음이 쓴 얇은 베일과 금가루로 그린 무늬를 섬세하게 표현해 고려 불화의 기법을 잘 보여 줘요. 비슷한 다른 작품과 견주어 14세기 전반에 그린 것으로 봐요.
  mp: [96]
  note: 미래엔 96쪽 「수월관음도」(일본 다이토쿠지). 다이토쿠지 소장본은 14세기 전반 작품으로 추정 — 한국민족문화대백과 '양류관음도'(E0035498). y 는 대략 연도. 비상 107쪽 혜허의 「양류관음도」(일본 센소사)는 다른 작품.
- n: 개성 경천사지 10층 석탑
  a: [개성 경천사지 십층 석탑, 경천사지 10층 석탑]
  k: 문화유산
  era: 고려
  y: 1348
  d: 원의 영향을 받아 회색 대리석으로 만든 고려 후기의 석탑이에요. 원래 개성 근처 경천사 터에 있었는데, 일본으로 몰래 실려 갔다가 돌아와 지금은 국립 중앙 박물관 안에 서 있어요.
  x: 1348년(충목왕 4)에 세운 높이 13.5m의 탑으로, 기단과 아래쪽 탑신의 평면이 네 면이 튀어나온 '亞' 자 모양이에요. 지붕돌에는 목조 건물처럼 공포와 기와를 새겼고, 온 표면에 부처·보살과 불교 이야기를 빈틈없이 조각했어요. 대한제국 때 일본 관리가 몰래 일본으로 가져갔다가 돌아왔고, 1960년 경복궁에 다시 세운 뒤 2005년 국립 중앙 박물관으로 옮겼어요. 원각사지 10층 석탑의 본보기가 되었어요.
  pg: [106]
  mp: [96, 103]
  at: [126.6, 37.9]
  ap: 1
  ev: [gyeongcheonsa]
  note: at 은 지금 있는 곳(서울 용산 국립중앙박물관, 좌표 en.wikipedia). 원래 자리는 경기 개풍군 광덕면 부소산 경천사 터(사건 gyeongcheonsa 의 at). 1348년(충목왕 4) 건립, 회색 대리석 — 한국민족문화대백과 '개성 경천사지 십층석탑'(E0002965). 반출 연도는 자료마다 1907·1909년으로 달라 d 에 쓰지 않음. 지도에는 원래 자리(개풍 경천사 터, 대략)에 찍었어요.
- n: 사략
  k: 책·기록
  era: 고려
  y: 1357
  d: 고려 후기에 이제현이 지은 역사서예요. 성리학을 받아들이며 강조된 정통 의식과 대의명분에 따라 역사를 서술했어요. 책은 지금 전하지 않아요.
  x: 1357년(공민왕 6)에 엮었고, 태조부터 숙종까지의 역사를 간추려 나라가 잘 다스려지거나 어지러워진 까닭을 거울로 삼으려 했어요. 『고려사』 등에 실린 이제현의 역대 왕 평가 글이 이 책에서 나온 것으로 봐요. 이제현은 원의 만권당에서 원의 학자들과 사귀며 성리학을 깊이 연구했고, 과거 시험관으로 이색 등을 뽑아 신진 사대부의 학통을 이었어요.
  pg: [105]
  mp: [95, 101]
  ev: [mangwondang]
  note: 1357년 편찬, 현재 전하지 않음 — 한국민족문화대백과 '사략'(E0025499).
- n: 천산대렵도
  k: 문화유산
  era: 고려
  y: 1360
  d: 공민왕이 그렸다고 전하는 그림으로, 몽골식 옷을 입고 말을 타며 사냥하는 무사를 그렸어요. 고려 후기 원 화풍의 영향을 보여 주며 국립 중앙 박물관에 있어요.
  x: 본래 옆으로 긴 두루마리 그림이었는데 여러 조각으로 나뉘어, 국립 중앙 박물관에는 3쪽이 남아 있어요. 비단에 채색했고, 말을 달리는 사냥꾼을 가늘고 섬세하면서도 활기찬 선으로 그렸어요. 공민왕은 그림과 글씨에 뛰어났다고 전하지만, 이 그림이 공민왕의 작품이라는 것은 전해 오는 이야기예요. 미래엔 교과서는 몽골식 머리 모양인 변발을 보여 주는 자료로 이 그림을 실었어요.
  pg: [107]
  mp: [99]
  note: 제작 연대는 알 수 없음(고려 후기), 공민왕 작품이라는 것은 전해 오는 말 — 한국민족문화대백과 '천산대렵도'(E0055905). y 는 공민왕 재위(1351~1374) 무렵의 대략 연도. 미래엔 99쪽은 변발 자료로 실음.
- n: 신돈
  k: 인물
  era: 고려
  y: 1366
  d: 공민왕이 개혁을 맡긴 승려예요. 전민변정도감을 이끌며 권문세족이 빼앗은 토지를 원래 주인에게 돌려주고 억울하게 노비가 된 사람을 풀어 주었지만, 권문세족의 반발 속에 제거되었어요.
  x: 공민왕은 기존 세력이 무리를 지어 개혁을 막는 것을 경계해, 욕심이 없고 따르는 무리도 없어 보이는 승려 신돈을 1365년 스승으로 삼고 정치를 맡겼어요. 1366년 전민변정도감을 이끌자 백성이 크게 환영했고, 노비들은 그를 '성인'이라 부를 정도였어요. 그러나 1371년 반역을 꾀했다는 혐의로 처형되었고, 1374년 공민왕도 시해되면서 개혁은 끝나 버렸어요.
  pg: [97]
  mp: [90, 93]
  ev: [jeonmin, gongmin-death]
- n: 영주 부석사 무량수전
  a: [부석사 무량수전]
  k: 문화유산
  era: 고려
  y: 1376
  d: 경북 영주 부석사의 중심 건물이에요. 신라 때 처음 세운 절의 건물을 고려 때 고쳐 지었고, 뚜렷한 배흘림기둥과 기둥 위에만 공포를 둔 주심포 양식을 잘 보여 줘요.
  x: 부석사는 통일 신라 때 의상이 세운 화엄종의 중심 절이에요. 무량수전은 1358년 왜구의 침입으로 불탄 뒤 1376년(우왕 2)에 다시 지었어요. '끝없는 수명을 지닌 부처'인 무량수불, 곧 아미타불을 모신 건물로, 안에는 통일 신라 양식을 이은 소조 여래 좌상이 동쪽을 바라보도록 놓여 있어요. 배흘림은 기둥의 가운데를 볼록하게 만든 방식이에요.
  pg: [106]
  mp: [96]
  at: [128.687, 36.999]
  ev: [uisang-buseoksa]
  note: 1358년 왜구의 침입 때 불탄 뒤 1376년(우왕 2) 고쳐 지음 — 한국민족문화대백과 '영주 부석사 무량수전'(E0024299). 좌표는 dh.aks.ac.kr 문화유산 위키 지도 링크.
- n: 최무선
  k: 인물
  era: 고려
  y: 1380
  d: 고려 말에 화약과 화포를 개발한 무신이에요. 1380년 진포에서 자신이 만든 화포로 왜구의 배를 크게 물리쳤어요.
  x: 미래엔 교과서는 최무선이 몽골인에게 화약 만드는 기술을 배웠다고 소개해요. 그의 건의로 1377년 화약과 화포를 만드는 화통도감이 세워졌고, 진포에서는 나세 등과 함께 화포로 왜선을 불태워 큰 승리를 거두었어요. 고려 말에 만든 화약 무기는 조선으로 이어져, 세종 때 신기전도 최무선이 만든 화살 무기를 고쳐 만든 것이에요.
  pg: [98]
  mp: [91, 93, 99]
  ev: [hwatong]
  note: '비상 98쪽 지도 ''나세·최무선, 진포 대첩(1380)'', 미래엔 91쪽 지도 ''최무선의 진포 대첩(1380)''. 화통도감은 교과서 본문에는 없음(사건 hwatong). 미래엔 99쪽: 몽골인에게 배운 화약 제조 기술.'
- n: 사천 흥사리 매향비
  k: 문화유산
  era: 고려
  y: 1387
  d: 향도의 매향 활동을 새긴 고려 말의 비석이에요. 약 4,100명이 함께 모여 내세의 행운과 나라의 부강, 백성의 평안을 빌며 향나무를 묻었다는 내용이 담겨 있어요.
  x: 비문에는 '천인결계매향원왕문'이라는 제목이 붙어 있어요. 바닷가에 묻은 향나무가 오랜 세월 뒤 침향이 된다고 믿고, 먼 훗날 미륵불이 내려와 설법하는 날을 기다리며 왕의 만수무강도 함께 빌었어요. 다듬지 않은 자연석에 칸도 없이 글자를 새겨 고려 말 지방 사람들의 소박한 신앙과 글씨를 잘 보여 주며, 1978년 보물로 지정되었어요.
  pg: [102]
  mp: [100]
  at: [128.014, 35.095]
  note: 1387년(우왕 13), 경남 사천시 곤양면 흥사리 — 한국민족문화대백과 '사천 흥사리 매향비'(E0026006). 좌표는 dh.aks.ac.kr 문화유산 위키 지도 링크.
- n: 박위
  k: 인물
  era: 고려
  y: 1389
  d: 고려 말 왜구를 물리친 장수예요. 왜구가 해안을 자주 약탈하자 1389년 전함을 이끌고 왜구의 근거지인 쓰시마섬을 공격했어요.
  x: 1389년(창왕 1) 2월 경상도 원수 박위 등이 쓰시마섬을 공격해 왜선 300여 척을 불태우고, 잡혀갔던 고려 사람 100여 명을 데려왔어요. 이 무렵 고려는 최영의 홍산 대첩, 최무선의 진포 대첩, 이성계의 황산 대첩 등으로 왜구를 물리쳤어요. 쓰시마섬 정벌은 조선 세종 때 이종무의 쓰시마섬(대마도) 토벌로 이어졌어요.
  pg: [98]
  mp: [91, 93]
  note: 비상 98쪽·미래엔 91쪽 지도 '박위, 쓰시마섬 토벌(1389)'. 1389년(창왕 1) 2월 — 한국민족문화대백과 '박자안'(E0021096). events 에 사건 없음 → wars waegu 쓰시마섬 토벌.
- n: 3경
  a: [삼경]
  k: 제도
  era: 고려
  d: 고려가 특별히 중요하게 여긴 세 도시예요. 수도 개경과 서경(평양), 동경(경주)을 3경이라 했고, 뒤에는 동경 대신 남경(서울)을 넣기도 했어요.
  x: 개경은 수도, 서경(평양)은 고구려의 옛 수도로 북진 정책의 전진 기지였고, 동경(경주)은 신라의 옛 수도였어요. 태조는 훈요 10조에서 서경을 중시하라고 당부하고 왕이 정기적으로 서경에 머물게 해 고구려를 잇는다는 뜻을 드러냈어요. 풍수지리설에서는 개경과 서경을 가장 좋은 명당으로 여겼고, 이자겸의 난 뒤 묘청 등은 서경으로 도읍을 옮기자고 주장하기도 했어요.
  pg: [80]
  mp: [77]
  inst: goryeo-local
  note: '교과서끼리 다름 → 비상을 따름. 비상 80쪽: 개경·서경·동경(뒤에 남경). 미래엔 77쪽 지도 설명: 개경·서경·동경을 3경이라 했고, 남경 설치 뒤에는 남경·서경·동경을 3경으로 부르기도 함.'
- n: 5도
  k: 제도
  era: 고려
  d: 고려가 전국을 나눈 일반 행정 구역으로, 양광도·경상도·전라도·교주도·서해도를 말해요. 각 도에 안찰사를 보냈고, 그 아래에 주·군·현을 두었어요.
  x: 고려의 지방은 일반 행정 구역인 5도, 북쪽 국경의 군사 구역인 양계, 수도 개경 주변의 경기로 나뉘었어요. 성종 때 처음 주요 지역에 12목을 두고 지방관을 보냈지만, 5도 아래 군현에는 지방관이 없는 속현이 더 많아 실제 행정은 향리가 맡는 곳이 많았어요. 조선이 8도에 관찰사를, 모든 군현에 수령을 보낸 것과 견주면 고려는 아직 중앙의 힘이 지방 구석구석까지 미치지 못했어요.
  pg: [80]
  mp: [77]
  ev: [twelve-mok]
  inst: goryeo-local
  note: 도 이름은 두 교과서 지도(비상 80쪽 ❸, 미래엔 77쪽) 기준.
- n: 경원 이씨
  k: 사회
  era: 고려
  d: 고려 전기의 대표적인 문벌 가문이에요. 여러 대에 걸쳐 딸들을 왕비로 들여보내 왕실의 외척으로서 권력을 키웠어요. 이자겸이 이 가문 출신이에요.
  x: 문종 때 이자연이 세 딸을 문종의 왕비로 들인 뒤로, 문종부터 인종까지 여러 왕과 거듭 혼인했어요. 이자겸은 둘째 딸을 예종에게, 셋째·넷째 딸을 인종에게 시집보내 최고 권력을 누렸고, 금의 사대 요구도 받아들였어요. 이자겸이 척준경과 함께 일으킨 난(1126)으로 궁궐이 불타고 왕실의 권위가 떨어지면서 문벌 중심의 사회가 흔들리기 시작했어요.
  pg: [82]
  mp: [80]
  ev: [lee-jagyeom]
  note: 비상 82쪽 그림 '왕실과 경원 이씨의 혼인 관계'(문종~인종).
- n: 고려양
  k: 사회
  era: 고려
  d: 원 간섭기에 원에 전해져 유행한 고려의 풍습이에요. 원의 황실과 상류층 사이에서 고려식 옷과 모시, 쌈 같은 고려 음식이 인기를 끌었어요.
  x: 원 간섭기에 고려 왕은 원의 공주와 혼인하고 왕자들은 원에서 자랐으며, 공녀와 환관 등 많은 고려 사람이 원으로 건너갔어요. 이렇게 사람이 오가면서 원의 황실과 상류층 사이에 상의가 짧은 고려 옷이 유행하고, 고려병(약과의 한 종류) 같은 음식도 인기를 끌었어요. 같은 시기 고려에서는 반대로 몽골풍이 유행해 두 나라 문화가 서로 섞였어요.
  pg: [95]
  mp: [99]
  note: '비상 95쪽 ''생활 속으로'': 고려의 모시, 상의가 짧은 고려 의복, 쌈 음식·고려병(약과의 일종).'
- n: 공녀
  k: 사회
  era: 고려
  d: 원 간섭기에 원의 요구로 원에 보내진 고려의 여성들이에요. 딸을 낳으면 숨기는 집이 있을 만큼 고통이 컸고, 딸을 공녀로 보낸 슬픔에 병들어 세상을 떠난 수령 옹주의 이야기도 전해져요.
  x: 원은 조공이라는 이름으로 금·인삼·사냥용 매 같은 특산물과 함께 환관과 젊은 여성을 요구했어요. 이곡은 『가정집』에서 원의 사신이 오면 관리가 집집마다 뒤지고, 딸을 숨기면 이웃을 붙잡아 두고 친척을 매질해서라도 찾아낸다고 고발했어요. 왕의 호칭이 낮아지고 영토 일부를 빼앗긴 것과 함께 원 간섭기 고려가 겪은 고통을 잘 보여 줘요.
  pg: [95]
  mp: [88, 99]
  note: 비상 95쪽 수령 옹주 묘지석, 미래엔 88쪽 이곡 『가정집』 자료.
- n: 공음전
  k: 경제
  era: 고려
  d: 고려에서 5품 이상의 관리에게 준 토지예요. 관리가 죽으면 나라에 돌려줘야 했던 보통의 전시과 토지와 달리 자손에게 물려줄 수 있었어요.
  x: 고려는 전시과에 따라 관리를 18등급으로 나누어 곡식을 거둘 땅(전지)과 땔감을 얻을 땅(시지)의 수조권을 주었고, 관리가 죽으면 나라에 돌려주는 것이 원칙이었어요. 공음전은 그 예외라서, 음서와 함께 고위 관리 집안이 대대로 지위와 재산을 이어 가게 해 주었어요. 이를 바탕으로 여러 대에 걸쳐 높은 관직을 차지한 문벌이 생겨났어요.
  pg: [81]
  ev: [jeonsigwa]
- n: 기인 제도
  a: [기인]
  k: 제도
  era: 고려
  d: 태조가 지방 호족의 자제를 수도에 머물게 한 제도예요. 출신 지역의 일에 대해 의견을 묻는 한편, 이들을 볼모로 삼아 호족 세력을 견제했어요.
  x: 신라의 상수리 제도에서 비롯된 것으로 봐요. 호족도 자제를 보내 중앙과 연결되고 그 권위로 지방에서 세력을 굳힐 수 있어, 태조에게만 유리한 제도는 아니었어요. 중앙 집권이 자리 잡은 뒤 기인은 중앙 관청의 잡일을 맡게 되었고, 고려 후기에는 노비보다 고되다는 말을 들을 만큼 힘든 일로 변했어요.
  pg: [78]
