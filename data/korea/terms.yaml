  x: 조선의 지방군은 병영에서 근무하는 육군과 수영에서 근무하는 수군으로 나뉘었어요. 임진왜란 때 조선 수군은 튼튼한 판옥선에 천자총통 같은 화포를 싣고 싸워 옥포·한산도 등에서 이기며 서남해의 제해권을 지켰어요. 수군은 곡창 지대인 전라도를 지키고 바닷길로 오는 일본군의 보급로를 끊었어요.
