  note: 중국 지린성 장백 조선족 자치현 장백진. 좌표는 위키백과 'List of Major National Historical and Cultural Sites in Jilin'. 만든 해는 알 수 없고 발해 시대로만 알려져 있어(한국민족문화대백과사전 '영광탑') y 는 대략 연도예요.
- n: 법화원
