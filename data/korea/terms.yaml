  era: 조선 전기
  d: 조선 전기에 나라에서 만든 전국 지도예요. 지방을 효과적으로 다스리고 국방을 튼튼히 하려고 세계 지도인 「혼일강리역대국도지도」, 지리서인 『동국여지승람』 등과 함께 편찬했어요.
  x: 함께 만든 「혼일강리역대국도지도」는 태종 때 만든 세계 지도로, 지금 남아 있는 동양에서 가장 오래된 세계 지도이며 아프리카·아라비아·유럽까지 그려져 있어요. 『동국여지승람』은 성종 때 지방의 연혁·인물·풍속 등을 정리한 지리서예요. 조선 후기에는 정상기의 「동국지도」, 김정호의 「대동여지도」로 지도 제작이 더욱 발전했어요.
  pg: [130]
  note: 교과서에 언제 누가 만든 「팔도도」인지 나오지 않아 y 를 넣지 않았어요(확인 필요).
- n: 한성부
  k: 제도
  era: 조선 전기
  d: 수도 한성(한양)의 행정과 치안을 맡은 관청이에요. 의정부·3사 등과 함께 조선의 중앙 정치 기구를 이루었어요.
  x: 태조는 한반도 가운데에 있고 한강이 흘러 교통이 편리하며 산으로 둘러싸여 외적을 막기 좋은 한양으로 도읍을 옮겼어요(1394). 경복궁 동쪽에 종묘, 서쪽에 사직단을 두고, 도성 문의 이름에 인·의·예·지 같은 유교 덕목을 넣어 유교 이념을 드러냈어요.
  pg: [118]
  mp: [109]
  ev: [hanyang]
  inst: joseon-central
- n: 향약
  a: [향촌 자치 규약]
  k: 사회
  era: 조선 전기
  d: 이웃끼리 서로 돕던 마을의 풍속에 유교 윤리를 더해 사림이 만든 향촌 자치 규약이에요. 규약을 잘 지키면 상을, 어기면 벌을 주어 농민들을 성리학 윤리에 맞게 이끌었고, 이를 통해 사림은 향촌에서 영향력을 넓혔어요.
  x: 이황의 예안 향약(1556), 이이의 해주 향약처럼 지역 실정에 맞게 만들어졌어요. 이웃의 초상에 쌀과 물품을 내고 불이 나면 집 짓는 일을 돕는 규정과 함께, 형제끼리 싸우거나 회의에 늦는 사람을 벌하는 규정도 있었어요. 조선 후기에는 수령이 주도하는 향약이 늘었는데, 향약은 양반이 향촌을 다스리고 농민을 통제하는 수단이라는 한계도 있었어요.
  pg: [125]
  mp: [122, 123]
  ev: [yean-hyangyak, haeju-hyangyak]
  fac: [sarim]
  note: 할 일 목록의 '향촌 자치 규약'(비상 찾아보기 125)은 향약을 풀이한 말이라 n 을 '향약'으로 하고 a 에 넣었어요. 중종 때 『여씨 향약』 번역으로 시작해 이황(예안 향약)·이이(해주 향약)가 우리 실정에 맞게 만들었어요.
- n: 붕당 정치
  k: 개념
  era: 조선 후기
  f: 1575
  d: 학문과 정치적 입장을 같이하는 사림들이 붕당을 이루어 서로 비판하고 견제하며 나라를 이끈 정치 방식이에요. 선조 때 동인과 서인이 갈라지며 시작됐고, 인조반정 뒤 서인과 남인은 상대 붕당을 인정하면서 3사와 서원을 통해 공론을 모았어요. 그러나 현종 때 예송, 숙종 때 환국을 거치며 상대를 몰아내고 보복하는 다툼으로 변질됐어요.
  x: 동인은 주로 이황·조식의 학문을 따르는 영남 사림, 서인은 이이·성혼의 학문을 따르는 경기·충청 사림이 중심이었고, 동인은 다시 남인(이황)과 북인(조식)으로 나뉘었어요. 북인은 광해군 때 정권을 잡았다가 인조반정으로 몰락했어요. 숙종 때 서인은 남인 처리 문제를 두고 강경한 노론과 온건한 소론으로 갈라졌고, 영조와 정조는 탕평책으로 붕당 사이의 다툼을 누르려 했어요.
  pg: [126, 146]
  mp: [142, 143]
  ev: [bungdang, yesong-1, yesong-2, gyeongsin]
  fac: [dongin, seoin, namin, bugin, noron, soron]
  note: f 1575는 동인·서인으로 나뉜 해(붕당 형성). 이후 영조·정조의 탕평 정치(탕평책 항목)로 이어져요.
- n: 주화파
  a: [주화론]
  k: 개념
  era: 조선 후기
  y: 1636
  d: 병자호란 무렵 청과 맞서 싸우기보다 외교로 화의를 맺어 나라를 지키자고 한 사람들이에요. 최명길이 대표적이며, 남한산성에서 구원병이 지고 강화도가 함락되자 이들의 주장이 힘을 얻어 인조가 삼전도에서 항복했어요.
  x: 최명길은 인조반정에 가담한 1등 공신으로, 척화론이 대부분이던 조정에서 화의를 주장해 큰 비난을 받았어요. 척화파 김상헌이 화의 문서를 찢고 통곡하자, 최명길은 이를 주워 모으며 '문서를 찢는 사람도 있어야 하고 나 같은 사람도 있어야 한다'고 했다고 전해요. 정묘호란(1627) 때에도 후금과 형제 관계를 맺어 전쟁을 끝냈는데, 최명길은 이때도 화의를 주장했어요.
  pg: [138, 139]
  mp: [131]
  fac: [seoin]
  note: 비상 139는 '주화파', 미래엔 131은 '주화론'(최명길 『지천집』 자료). 교과서에는 붕당이 나오지 않지만, 인조 때는 서인이 정권을 독점했고 최명길은 인조반정 정사공신 1등이라 척화론과 함께 집권 서인 안에서 의견이 갈린 거예요(한국민족문화대백과사전 '서인' E0028128·'최명길' E0057284). 병자호란은 전쟁 데이터 manchu. 비상은 호란을 Ⅳ단원에서 다뤄요.
- n: 척화파
  a: [척화론, 주전론]
  k: 개념
  era: 조선 후기
  y: 1636
  d: 병자호란 무렵 청이 요구한 군신 관계를 거부하고 끝까지 싸우자고 한 사람들이에요. 명에 대한 의리와 명분을 앞세웠고, 이들의 주장이 힘을 얻어 조선이 청의 요구를 거절하자 청 태종이 직접 쳐들어왔어요.
  x: 대표 인물인 김상헌은 남한산성에서 화의 문서를 찢고 통곡했고, 뒤에 청에 끌려가 갇히기도 했어요. 척화론은 임진왜란 때 군사를 보내 준 명을 '부모와 같은 나라'로 여기고 청을 오랑캐로 본 의리론에 바탕을 두었어요. 전쟁 뒤에도 이런 생각은 청에 당한 치욕을 갚자는 북벌론으로 이어졌어요.
  pg: [138, 139]
  mp: [131]
  fac: [seoin]
  note: 비상 138은 '척화론', 찾아보기는 '척화파', 미래엔 131은 '주전론'이라고 써요. 대표 인물 김상헌은 교과서에 없고 한국민족문화대백과사전 '최명길'(E0057284)에 척화 쪽으로 나와요. 김상헌은 서인(청서)의 우두머리였어요(같은 사전 '서인' E0028128). 병자호란은 전쟁 데이터 manchu.
- n: 삼전도비
  a: [삼전도 청태종 공덕비]
  k: 문화유산
  era: 조선 후기
  y: 1639
  d: 병자호란 때 인조가 삼전도에서 항복한 뒤, 청의 요구로 청 태종의 공덕을 새겨 세운 비석이에요(서울 송파). 한자·만주 문자·몽골 문자로 새겼고, 여러 번 땅에 묻혔다가 다시 세워지는 등 보존을 두고 논쟁이 이어졌어요.
  x: 1639년에 세웠어요. 1895년 청일 전쟁 뒤 고종의 명으로 땅에 묻었는데 1917년 일제가 다시 세웠고, 1956년에는 문교부가 국가의 치욕이라며 다시 묻었다가 1963년 홍수로 모습이 드러났어요. 2007년에는 페인트로 훼손되기도 했고, 2010년 고증을 거쳐 석촌 호수 부근으로 옮겨졌어요. 미래엔 교과서는 부끄러운 역사라도 보존해 교훈으로 삼아야 하는지를 토론 주제로 다뤄요.
  pg: [139]
  mp: [132]
  at: [127.102, 37.511]
  note: y 1639는 미래엔 132. 삼전도 항복(1637년 음력 1월)은 전쟁 데이터 manchu 의 battle. 좌표는 지금 석촌 호수 옆 자리예요. 비상은 호란을 Ⅳ단원에서 다뤄요.
- n: 북벌론
  k: 개념
  era: 조선 후기
  f: 1649
  t: 1659
  d: 병자호란의 치욕을 씻으려고 청을 정벌하자는 주장이에요. 청에 인질로 갔다 돌아와 왕이 된 효종이 서인을 등용하고 성곽과 무기를 손보며 어영청을 키웠지만, 청이 점점 강해지고 백성의 부담이 커진 데다 효종이 죽으면서 실행되지 못했어요.
  x: 효종은 송시열 등 서인과 함께 북벌을 계획했고, 정예 포병 10만을 길러 청에 틈이 생기면 쳐들어가겠다는 뜻을 송시열에게 밝혔다고 해요. 귀화한 네덜란드인 벨테브레이(박연)는 훈련도감에서 홍이포 만드는 법을 가르치고, 표류해 온 하멜 일행과 함께 북벌 준비를 도왔어요. 한편 청과의 교류가 늘면서 청의 앞선 문물을 배우자는 움직임이 나타나 북학으로 이어졌어요.
  pg: [139]
  mp: [139]
  ev: [bukbeol]
  fac: [seoin]
  note: 비상은 효종이 서인을 등용해 북벌을 준비했다고, 미래엔은 정권을 잡고 있던 서인도 북벌을 지지했다고 해요. f·t 는 효종 재위 기간. 비상은 이 내용을 Ⅳ단원(139)에서, 미래엔은 Ⅴ단원(139)에서 다뤄요.
- n: 농가집성
  k: 책·기록
  era: 조선 후기
  y: 1655
  d: 효종 때 신속이 펴낸 농업 책이에요. 모내기법 같은 농사 방법을 정리해 알려 조선 후기 농업의 변화를 보여 줘요.
  x: 1655년(효종 6)에 펴낸 책으로, 세종 때의 『농사직설』과 『금양잡록』, 『사시찬요초』 세 농서를 합치고 굶주림을 이기는 법을 담은 『구황촬요』를 덧붙였어요. 조선 후기에는 모내기법이 전국에 퍼져 김매기 일손이 줄고 벼와 보리의 이모작이 가능해지면서 농업 생산량이 크게 늘었어요. 19세기에는 서유구가 농촌 생활 백과사전인 『임원경제지』를 썼어요.
  pg: [159]
  note: y 1655(효종 6)는 한국민족문화대백과사전 '농가집성'(E0013074)으로 확인.
- n: 탕평책
  a: [탕평 정치, 탕평론]
  k: 제도
  era: 조선 후기
  f: 1724
  t: 1800
  d: 어느 붕당에도 치우치지 않게 인재를 고루 써서 붕당의 다툼을 누르고 왕권을 세우려 한 정책이에요. 숙종이 처음 내세웠고, 영조는 탕평파를 키우며 서원을 정리하고 이조 전랑의 권한을 줄였으며 탕평비를 세웠어요. 정조는 남인까지 등용해 더 적극적으로 폈지만 강한 왕권으로 다툼을 눌렀을 뿐 붕당의 폐단을 뿌리 뽑지는 못했어요.
  x: '''탕평''은 『서경』에서 따온 말로, 임금의 정치가 한쪽에 치우치지 않고 공평한 상태를 뜻해요. 영조는 1742년 성균관 앞에 ''두루 사랑하고 편을 가르지 않는 것이 군자의 마음''이라는 글을 새긴 탕평비를 세웠고, 정조는 노론·소론·남인을 고루 쓰며 규장각과 장용영으로 왕권을 뒷받침했어요. 그러나 권력이 왕과 소수의 측근에게 몰린 탓에 정조가 죽은 뒤 몇몇 가문이 권력을 쥔 세도 정치로 이어졌어요.'
  pg: [146, 147, 148]
  mp: [143, 144, 145]
  ev: [tangpyeong-stele, kyujanggak, sedo]
  fac: [tangpyeong, noron, soron, namin]
  note: 낱말 '탕평'은 『서경』에서 따온 말로 임금의 정치가 한쪽으로 치우치지 않는 공평한 상태를 뜻해요(비상 147). f·t 는 영조 즉위(1724)부터 정조가 죽은 해(1800)까지예요. 비상은 탕평 정치가 소수에게 권력이 몰리는 결과를 낳아 세도 정치로 이어졌다고 해요(149).
- n: 금강전도
  k: 예술
  era: 조선 후기
  y: 1734
  d: 정선이 겨울 금강산 전체를 하늘에서 내려다보듯 한 화면에 담은 진경 산수화예요. 뾰족한 바위 봉우리와 검은 흙산을 대비시켜 실감 나게 그렸어요.
  x: 1734년(영조 10)에 그렸어요. 정선은 금강산 등 강원도와 서울 근교의 명승지를 직접 돌아다니며 본 기억과 인상을 화폭에 담았어요. 비 갠 뒤의 인왕산을 그린 「인왕제색도」와 함께 진경 산수화를 대표하는 작품이며, 삼성 미술관 리움에 있어요.
  pg: [161]
  mp: [155]
  note: y 1734(영조 10)는 한국민족문화대백과사전 '정선 필 금강전도'(E0007558)로 확인. 삼성 미술관 리움 소장(비상).
- n: 청화 백자
  k: 예술
  era: 조선 후기
  y: 1750
  d: 흰 백자 바탕에 푸른색 안료로 꽃·새·산수 등의 무늬를 그려 넣은 도자기예요. 조선 후기에 크게 유행해 문방구와 제사 그릇 같은 생활용품으로 많이 만들어졌어요.
  x: 조선 후기에는 분청사기가 사라지고 백자가 민간에까지 널리 쓰였어요. 청화 백자와 함께 둥근 달 모양의 백자 달 항아리도 이 시기 백자의 아름다움을 보여 줘요. 고려의 상감 청자, 조선 전기의 분청사기, 16세기 이후의 백자, 조선 후기의 청화 백자로 이어지는 도자기의 흐름을 정리해 두면 좋아요.
  pg: [162]
  mp: [155]
  note: 도자기 종류라 y 는 유행한 조선 후기(18세기 무렵)로 대략 잡았어요.
- n: 홍대용
  k: 인물
  era: 조선 후기
  y: 1765
  d: 연행사를 따라 청에 다녀온 북학파 실학자예요. 지구가 스스로 돈다는 지전설을 논리적으로 설명하고 혼천의를 만들었으며, 기술 혁신과 문벌 제도 폐지를 주장했어요.
  x: 1765년 연경(베이징)에 가서 독일 출신 선교사 할러슈타인을 만나 천문 관측 기구를 보고, 자명종·망원경·파이프 오르간 같은 서양 문물을 소개받았어요. 그는 천체의 운행을 관측하는 혼천의를 만들어 관측소인 농수각에 두었어요. 그의 천문학 지식은 서양 세계 지도의 보급과 함께, 당시 지식인들이 성리학적 세계관에서 벗어나는 데 크게 기여했어요.
  pg: [159, 160, 163]
  mp: [148, 150]
  note: y 1765는 연경(베이징)에 간 해(한국민족문화대백과사전 '홍대용' E0064019). 비상 163은 그가 연경에서 선교사 할러슈타인의 천문 기구를 보고 돌아와 혼천의를 만들었다고 해요.
- n: 김조순
  k: 인물
  era: 조선 후기
  y: 1802
  d: 순조의 장인으로, 안동 김씨 세도 정치의 바탕을 마련한 인물이에요. 정조가 죽고 어린 순조가 즉위한 뒤 그를 중심으로 안동 김씨가 권력을 잡았고, 훈련대장·금위대장 같은 군영 대장 자리에도 올랐어요.
  x: 1802년 딸이 순조의 왕비(순원 왕후)가 되었어요. 세도 정치는 순조·헌종·철종 3대 60여 년 동안 이어졌고, 안동 김씨와 풍양 조씨 같은 가문이 비변사의 주요 관직과 군영의 지휘권을 차지했어요. 관직을 사고파는 일이 공공연해지고 과거제가 문란해졌으며, 미래엔 교과서에는 그의 화려한 별장을 그린 「옥호정도」가 실려 있어요.
  pg: [149]
  mp: [158]
  ev: [sedo]
  inst: joseon-late-politics
  fac: [sedo]
  note: y 1802는 딸이 순조의 왕비(순원 왕후)가 된 해(한국민족문화대백과사전 '김조순' E0010476). 미래엔 158에 그의 별장을 그린 「옥호정도」가 나와요.
- n: 동경대전
  k: 책·기록
  era: 조선 후기
  y: 1880
  d: 동학의 가르침을 정리한 경전으로, 최제우의 글을 2대 교주 최시형이 모아 펴냈어요. 동학이 서학과 다른, 이 땅에서 받은 동쪽의 학문이라는 뜻을 밝히고 있어요.
  x: 1880년 최시형이 강원도 인제에 경전 간행소를 두어 펴냈고, 한문으로 쓴 경전이에요. 최제우가 지은 「포덕문」·「논학문」·「수덕문」·「불연기연」이 실려 있으며, 「논학문」에서는 동학의 가르침을 묻고 답하는 형식으로 풀었어요. 최시형은 이와 함께 『용담유사』도 펴냈어요.
  pg: [153]
  mp: [160]
  ev: [donghak]
  note: y 1880은 처음 펴낸 해(강원도 인제, 한국민족문화대백과사전 '동경대전' E0016191).
- n: 최시형
  k: 인물
  era: 조선 후기
  y: 1880
  d: 최제우의 뒤를 이은 동학의 2대 교주예요. 『동경대전』과 『용담유사』를 펴내 교리를 정리하고 교단 조직을 다져, 정부의 탄압 속에서도 동학을 널리 퍼뜨렸어요.
  x: 동학을 세운 최제우는 1864년 세상을 어지럽히고 백성을 속인다는 죄로 처형되었어요. 최시형은 정부의 탄압 속에서도 경전을 펴내고 교단 조직을 정비했고, 동학은 짧은 기간에 널리 퍼졌어요. 1893년에는 동학 교도들이 교조 최제우의 억울함을 풀어 달라는 교조 신원 운동을 벌이며 보은 집회를 열었어요.
  pg: [153]
  mp: [160]
  ev: [donghak, choe-jeu-death, boeun]
  note: y 1880은 『동경대전』을 펴낸 해(한국민족문화대백과사전 '동경대전' E0016191).
- n: 고증학
  k: 사상·종교
  era: 조선 후기
  d: 옛 문헌과 자료를 꼼꼼히 따져 객관적이고 실증적으로 연구하는 학문 방법으로, 청에서 유행했어요. 조선 후기 실학자들이 이를 받아들여 학문 연구에 활용했어요.
  x: 청에서는 '사실에 근거해 진리를 찾는다'는 실사구시를 내세워 문헌을 꼼꼼히 따지는 연구가 유행했어요. 김정희는 연경에 가서 청의 학자들과 사귀며 옛 비문과 글씨를 연구하는 금석학에 빠졌고, 정약용도 경전을 고증하는 학문에 힘썼어요. 조선의 실학자들도 이런 연구 방법을 받아들여 우리 역사·지리·언어를 연구했고, 안정복의 『동사강목』, 유득공의 『발해고』 같은 국학 연구가 나왔어요.
  mp: [148]
- n: 공명첩
  k: 제도
  era: 조선 후기
  d: 받는 사람의 이름 칸을 비워 둔 관직 임명장이에요. 나라가 모자란 재정을 채우려고 돈이나 곡식을 받고 내주었고, 재산을 모은 농민·상인이 이를 사서 양반 신분을 얻었어요.
  x: 임진왜란 이후 부족한 나라 재정을 메우려고 발급하기 시작했어요. 공명첩을 사거나 호적을 고치고 족보를 위조해 양반 행세를 하는 사람이 늘면서 상민 수는 줄고 양반 수는 크게 늘어 양반의 권위가 떨어졌어요. 박지원의 「양반전」은 가난한 양반이 환곡 빚 때문에 부자에게 양반 신분을 팔게 되는 이야기로 이런 세태를 풍자했어요.
  pg: [152, 155]
  mp: [153]
  note: 미래엔 153은 임진왜란 이후 재정 부족을 해결하려고 발급했다고 설명해요.
- n: 납속
  k: 제도
  era: 조선 후기
  d: 나라가 재정을 채우려고 돈이나 곡식을 받고, 그 대가로 신분을 올려 주거나 관직을 주던 정책이에요. 조선 후기에는 노비도 납속이나 전쟁에서 세운 공으로 신분을 높였어요.
  x: 노비는 도망쳐서 신분에서 벗어나기도 했고, 상민이 줄어 군역을 질 사람이 모자라자 정부도 노비를 양인으로 풀어 주는 정책을 폈어요. 1801년(순조 1)에는 왕실과 중앙 관청에 속한 공노비 6만여 명을 해방했어요. 이렇게 조선 후기에는 양반이 늘고 상민과 노비가 줄어 신분 질서가 크게 흔들렸어요.
  pg: [152]
  mp: [153]
  note: 미래엔 153에는 '납속'이라는 낱말 없이 '노비도 곡식을 바치거나 전쟁에서 공을 세워 신분을 상승'으로 나와요.
- n: 동국지도
  k: 책·기록
  era: 조선 후기
  d: 정상기가 만든 우리나라 지도로, 실제 100리를 나타내는 눈금인 백리척을 처음 사용했어요. 덕분에 지도에서 두 곳 사이의 실제 거리를 쉽게 잴 수 있었어요.
  x: 18세기 중엽 영조 때 만든 것으로 봐요. 김정호는 이런 성과를 바탕으로 1861년 「대동여지도」를 만들어 산맥·하천·포구·도로망을 자세히 나타내고 10리마다 점을 찍어 거리를 알 수 있게 했어요. 「대동여지도」는 22개의 첩으로 나누어 접었다 펼 수 있게 만들었어요. 이중환이 『택리지』에 각 지방의 자연과 풍속을 기록한 것처럼, 국토에 대한 관심이 높아진 것이 배경이에요.
  pg: [160]
  note: 18세기 중엽(영조 때) 만든 것으로 보지만 정확한 해는 알 수 없어 y 를 넣지 않았어요(한국민족문화대백과사전 '동국지도' E0016300).
- n: 두레
  k: 사회
  era: 조선 후기
  d: 마을 농민들이 모여 함께 농사를 짓던 공동 노동 조직이에요. 한꺼번에 일손이 많이 드는 모내기법이 퍼지면서 활발해졌고, 양반이나 지주는 끼지 못해 농민들끼리의 유대감과 자율성이 커졌어요.
  x: 모내기는 한꺼번에 많은 일손이 필요한 농사법이었어요. 같은 시기 신분제가 흔들리면서 양반의 권위는 약해졌고, 양반들은 같은 성씨끼리 동족 마을을 이루고 문중의 결속을 다져 세력을 지키려 했어요. 두레는 이런 변화 속에서 농민들이 스스로 꾸린 공동체로, 함께 일하며 서로를 도왔어요.
  pg: [166]
- n: 모내기법
  a: [이앙법]
  k: 경제
  era: 조선 후기
  d: 볍씨를 모판에서 키운 뒤 자란 모를 논에 옮겨 심는 농사 방법이에요. 김매기 일손이 줄고 벼와 보리를 번갈아 짓는 이모작이 가능해져 수확이 크게 늘었고, 넓은 땅을 경작해 부농이 되는 농민도 나타났어요.
  x: 쌀과 함께 인삼·담배·목화·채소 같은 상품 작물을 재배해 높은 소득을 올리는 농민이 나타난 반면, 농지를 얻지 못한 농민은 머슴이 되거나 도시·광산으로 떠났어요. 효종 때 신속이 펴낸 『농가집성』 같은 농서가 새 농법을 소개했어요. 한꺼번에 많은 일손이 필요해 마을의 공동 노동 조직인 두레도 활발해졌어요.
  pg: [151, 159, 166]
  mp: [152]
  ev: [late-commerce]
  note: 교과서 본문은 두 책 모두 '모내기법'이에요. 이앙법은 같은 뜻의 다른 이름이에요.
- n: 민화
  k: 예술
  era: 조선 후기
  d: 이름이 알려지지 않은 화가들이 그린 서민의 그림으로, 호랑이와 까치 같은 동식물이나 글자를 소재로 했어요. 복을 받고 오래 살기를 바라는 소망을 담아 집 안을 꾸미는 데 많이 쓰였어요.
  x: 까치호랑이 그림은 재앙을 막아 준다고 여긴 호랑이와 좋은 소식을 전한다는 까치를 함께 그린 것이에요. 비상 교과서는 민화가 왕실에서 민간에 이르기까지 생활 공간을 꾸미는 데 쓰였다고 설명해요. 같은 시기 김홍도·신윤복의 풍속화도 유행해 사람들의 생활과 감정을 그림에 담았어요.
  pg: [168]
  mp: [154]
  note: 비상은 왕실에서 민간까지 생활 공간을 꾸미는 데 쓰였다고 해요.
- n: 북학파
  k: 사상·종교
  era: 조선 후기
  d: 청의 앞선 문물과 기술을 배워 상공업을 키우자고 주장한 실학자들이에요. 유수원·홍대용·박지원·박제가 등이 수레와 배, 화폐의 사용과 청과의 교역 확대를 내세웠고, 이들의 생각은 뒷날 개화사상에 영향을 주었어요.
  x: 박지원은 정조 때 연행사를 따라 청에 다녀와 『열하일기』를 썼고, 깨진 기와 조각이나 똥거름 같은 데서도 배울 점을 찾을 만큼 청의 실용적인 문물에 관심을 기울였어요. 박제가는 『북학의』에서 재물을 우물에 빗대어, 소비를 해야 생산이 늘어난다고 주장했어요. 정조는 박제가·유득공 같은 서얼 출신 학자를 규장각 검서관으로 뽑았어요.
  pg: [160]
  mp: [148]
  ev: [bukhagui, yeolha]
  note: 미래엔은 북학파로 박지원·박제가·홍대용을 들어요(유수원은 비상에만 나와요).
- n: 사설시조
  k: 예술
  era: 조선 후기
  d: 정해진 형식에 얽매이지 않고 길게 늘여 쓴 시조예요. 서민들이 현실에서 느끼는 감정을 솔직하게 드러내거나 익살스럽게 풍자한 작품이 많아요.
  x: 평시조가 초장·중장·종장 세 줄을 정해진 틀에 맞춰 짧게 지었다면, 사설시조는 주로 중장을 마음껏 늘려 하고 싶은 이야기를 수다스럽게 풀어놓았어요. 지은이를 알 수 없는 작품이 많고, 김천택이 엮은 『청구영언』(1728) 같은 시조집에 실려 전해요. 글을 아는 서민이 늘어난 조선 후기에는 이와 함께 한글 소설·판소리·탈춤·풍속화·민화도 유행했어요.
  pg: [167]
  mp: [154]
- n: 서민 문화
  k: 사회
  era: 조선 후기
  d: 조선 후기에 경제력이 커지고 서당 교육으로 글을 아는 사람이 늘어난 서민들이 주인공이 된 문화예요. 한글 소설·사설시조·판소리·탈춤·풍속화·민화처럼 서민의 생각과 감정을 솔직하게 드러내고 양반 사회를 풍자하는 작품이 많았어요.
  x: 17세기 이후 중국과 일본에서도 서민의 경제력이 커지며 서민 문화가 발달해, 조선의 판소리처럼 중국의 경극, 일본의 가부키가 인기를 끌었어요. 한글 소설이 인기를 얻자 도시에는 돈을 받고 책을 빌려주는 책방과 책을 읽어 주는 직업까지 생겼어요. 경제적으로 성장한 역관·서리 같은 중인들도 시사를 만들어 시를 짓고 시집을 펴냈어요.
  pg: [167, 168]
  mp: [154]
  ev: [genre-painting]
- n: 서얼
  k: 사회
  era: 조선 후기
  d: 양반의 자손 가운데 첩에게서 태어난 사람을 말해요. 문과 응시와 높은 관직 진출에 제한을 받아 조선 후기에 차별을 없애 달라고 요구했고, 정조는 박제가·유득공 같은 서얼을 규장각 검서관으로 뽑았어요.
  x: 허균의 「홍길동전」에서 홍길동이 '아버지를 아버지라 부르지 못하고 형을 형이라 부르지 못한다'고 한탄하는 대목이 서얼의 처지를 잘 보여 줘요. 조선 후기에는 기술직 중인도 전문 능력과 경제력을 바탕으로 신분 상승을 꾀했어요. 정조가 뽑은 검서관에는 박제가·유득공·이덕무 같은 서얼 출신 학자들이 있었어요.
  pg: [147, 148, 152, 167]
  mp: [145, 153, 154]
  ev: [kyujanggak]
  note: 허균의 「홍길동전」은 서얼 차별을 비판한 소설이에요(비상 167·미래엔 154).
- n: 서학
  k: 사상·종교
  era: 조선 후기
  d: 17세기부터 중국을 오가던 사신을 통해 들어온 서양의 학문·문물과 천주교를 함께 이르는 말이에요. 「곤여만국전도」·시헌력·천리경 같은 것이 전해져 지식인들이 성리학적 세계관에서 벗어나고 과학 기술이 발달하는 데 영향을 주었어요.
  x: 병자호란 뒤 청에 볼모로 갔던 소현 세자는 독일 출신 선교사 아담 샬과 가깝게 지내며 서양 학문과 천문 기구, 서양 책을 받아 돌아왔어요. 표류해 온 벨테브레이(박연)와 하멜도 서양 문물을 전했어요. 정약용은 서양 기술 책 『기기도설』을 참고해 거중기를 만들었고, 이 거중기는 수원 화성을 쌓는 데 쓰였어요.
  pg: [159]
  mp: [150]
  ev: [gonyeo, sihyeon]
  note: 미래엔은 좁은 뜻으로는 천주교를 가리킨다고 덧붙여요. 소현 세자와 벨테브레이·하멜 같은 표류인도 서양 문물을 전했어요(비상 159).
- n: 속오군
  k: 제도
  era: 조선 후기
  d: 임진왜란 중에 무너진 지방군을 다시 세우려고 만든 군대로, 양반부터 노비까지 여러 신분을 함께 편성했어요. 평소에는 생업에 종사하며 훈련을 받다가 적이 쳐들어오면 싸움에 나섰는데, 양반들이 빠지면서 점차 상민과 노비만 남았어요.
  x: 같은 무렵 중앙에서는 조총을 다루는 포수, 활의 사수, 창과 칼의 살수로 이루어진 훈련도감을 두었고(1593), 이어 어영청·총융청·수어청·금위영을 더해 5군영 체제를 갖추었어요. 조선 전기의 중앙군 5위와 지방의 병영·수영 체제가 왜란과 호란을 거치며 이렇게 바뀌었어요.
  pg: [145]
  mp: [138]
  ev: [five-camps]
  inst: joseon-military-late
- n: 실학
  k: 사상·종교
  era: 조선 후기
  d: 두 차례 전란 뒤 드러난 사회 문제를 풀려고 실증적으로 연구해 현실에 쓸모 있는 답을 찾으려 한 학문이에요. 유형원·이익·정약용은 토지 제도를 고치자는 농업 중심 개혁론을, 유수원·홍대용·박지원·박제가는 상공업 중심 개혁론을 폈어요. 국가 정책에 바로 반영되지는 못했지만 국학 발달과 뒷날 개화사상에 영향을 주었어요.
  x: 유형원은 신분에 따라 차등을 두되 농민에게 일정한 토지를 나눠 주자고 했고, 이익은 생계에 필요한 최소한의 토지(영업전)는 사고팔지 못하게 하자고 했어요. 정약용은 마을 단위로 함께 농사를 지어 일한 날짜에 따라 나누자고 했고, 유배 중에도 많은 책을 써 실학을 집대성했어요. 실학자 대부분은 중앙 정치에서 밀려나 있거나 관직에 나가지 않아 그 주장이 정책에 직접 반영되지는 못했어요.
  pg: [159, 160]
  mp: [148, 149]
  ev: [mokmin, bukhagui, yeolha]
  note: 미래엔은 당시 집권 세력이 이론과 형식을 중시하는 성리학에 얽매여 현실 문제에 대처하지 못한 것을 배경으로 들어요. 상공업 중심 개혁론은 북학파 항목.
- n: 암행어사
  k: 제도
  era: 조선 후기
  d: 왕의 특명을 받고 신분을 숨긴 채 지방에 내려가 수령의 비리와 백성의 어려움을 살펴 그대로 보고하던 관리예요. 세도 정치 시기에 부정부패를 바로잡으려고 보냈지만 큰 효과를 거두지 못했어요.
  x: 마패는 원래 역에서 말을 빌릴 때 쓰던 증표로, 최대 다섯 마리까지 말이 새겨졌는데 암행어사에게는 대개 말 두 마리가 새겨진 마패를 주었어요. 삼정이 문란해졌는데도 대책이 효과를 거두지 못하자, 굶주린 백성은 고향을 떠나 떠돌거나 화전민이 되고 도적이 되기도 했어요.
  pg: [149]
  mp: [159]
  note: 역에서 말을 빌릴 때 쓰는 마패가 암행어사의 신분 증명에도 쓰였어요(비상 149·미래엔 159 사진).
- n: 이양선
  k: 사회
  era: 조선 후기
  d: 모양이 다른 배라는 뜻으로, 19세기 조선 바다에 자주 나타난 서양의 배를 말해요. 통상을 요구하는 이양선이 잇따르면서 사람들의 불안과 외세에 대한 위기감이 커졌어요.
  x: 세도 정치로 사회가 불안한 가운데 자연재해가 잦고 이양선까지 나타나자 위기감이 커져, 『정감록』 같은 예언 사상이 유행했어요. 1866년에는 미국 상선 제너럴셔먼호가 대동강을 거슬러 올라와 통상을 요구하며 행패를 부리다가 평양 관민에게 불태워졌어요.
  mp: [160, 170]
  ev: [general-sherman]
  note: 비상 본문에는 이 낱말이 없어요.
- n: 인내천
  k: 사상·종교
  era: 조선 후기
  d: '''사람이 곧 하늘''이라는 뜻으로, 동학이 중심으로 삼은 가르침이에요. 모든 사람을 하늘처럼 귀하게 여겨 신분 차별 없는 평등을 강조했어요.'
  x: 경주의 몰락 양반 최제우는 1860년 유교·불교·도교에 민간 신앙을 더해 동학을 만들었어요. 정부는 동학이 신분 질서를 위협한다며 금지하고 최제우를 처형했지만, 평등을 내세운 가르침이 많은 백성의 공감을 얻어 동학은 빠르게 퍼졌어요. 미래엔 교과서는 동학이 '모든 사람이 평등하게 살아가는 세상'을 만들고자 했다고 설명해요.
  pg: [153]
  ev: [donghak]
  note: 미래엔 160에는 낱말 없이 '모든 사람이 평등하게 살아가는 세상'으로 나와요.
- n: 일당 전제화
  k: 개념
  era: 조선 후기
  d: 한 붕당이 권력을 혼자 차지하고 상대 붕당의 존재조차 인정하지 않게 된 상태를 말해요. 숙종 때 환국이 되풀이되면서 정권을 잡은 쪽이 상대를 몰아내 보복하고 중요한 관직을 독점해, 서로 견제하던 붕당 정치가 무너졌어요.
  x: 숙종은 1680년 경신환국으로 남인을 몰아내고 서인에게 정권을 맡기는 등 여러 차례 집권 붕당을 갑자기 바꾸며 왕권을 강화하려 했어요. 이 과정에서 서인은 남인 처리 문제를 두고 노론과 소론으로 갈라졌고, 숙종 말에는 왕위 계승 문제로까지 다툼이 번졌어요. 이를 해결하려고 영조와 정조는 탕평책을 폈어요.
  pg: [146, 170]
  mp: [143]
  ev: [gyeongsin, gisa, gapsul]
  fac: [seoin, namin, noron, soron]
  note: 비상 찾아보기(222쪽)에는 '일당 전제화 146'으로 나오지만 146쪽 본문에는 이 낱말이 없고, 환국으로 붕당 정치가 변질된 설명(146)과 170쪽 정리의 '특정 붕당의 권력 독점'이 이 내용이에요. 미래엔 143도 낱말 없이 같은 내용을 설명해요.
- n: 임원경제지
  k: 책·기록
  era: 조선 후기
  d: 서유구가 농사와 농촌 생활에 필요한 지식을 16개 분야로 나누어 모은 백과사전 같은 책이에요. 조선 후기 농업과 생활 기술을 폭넓게 정리했어요.
  x: 113권 52책에 이르는 필사본이에요. 조선 후기에는 신속의 『농가집성』 같은 농서가 활발히 나왔고, 의학에서는 허준이 『동의보감』으로 전통 한의학을 체계화하고 이제마가 체질에 따라 병을 치료하는 사상 의학을 세웠어요. 실생활에 쓸모 있는 지식을 정리하려는 당시 학문의 흐름을 보여 줘요.
  pg: [159]
  note: 113권 52책의 필사본(한국민족문화대백과사전 '임원경제지' E0047578). 완성한 해가 분명하지 않아(19세기) y 를 넣지 않았어요.
- n: 정감록
  k: 책·기록
  era: 조선 후기
  d: 조선 왕조가 망하고 정씨 성을 가진 사람이 새 왕조를 세운다는 내용을 담은 예언서예요. 세도 정치로 살기 힘들어진 백성들 사이에 널리 퍼졌고, 홍경래도 이 책을 익혔다고 전해져요.
  x: 미륵이 나타나 민중을 구원한다는 미륵 신앙과 무당의 굿으로 복을 비는 무속 신앙도 함께 번성했어요. 미래엔 교과서는 고창 선운사 동불암지 마애여래 좌상의 명치에 숨겨진 비기가 나오면 조선이 망한다는 예언이 백성 사이에 퍼졌다고 소개해요. 잦은 자연재해와 이양선의 출몰로 위기감이 커진 것도 예언 사상이 퍼진 까닭이었어요.
  pg: [153, 155]
  mp: [160]
  note: 홍경래의 난은 전쟁 데이터 hong-gyeongnae. 미래엔은 자연재해와 이양선 출몰로 위기감이 커진 것도 예언 사상이 유행한 까닭으로 들어요.
- n: 진경 산수화
  k: 예술
  era: 조선 후기
  d: 중국 산수화를 본떠 그리던 데서 벗어나 우리나라의 산천을 직접 보고 사실적으로 그린 산수화예요. 정선이 「인왕제색도」·「금강전도」 같은 작품으로 크게 발전시켰어요.
  x: 청에 간 사신들이 서양화를 소개하면서 명암법과 원근법이 들어왔고, 강세황은 이를 동양화에 접목해 사물을 입체감 있게 그렸어요. 또 김홍도와 신윤복은 사람들의 일상을 그린 풍속화로 이름을 떨쳤어요. 이렇게 조선 후기의 그림은 우리의 자연과 우리의 생활을 직접 보고 그리는 쪽으로 바뀌었어요.
  pg: [161]
  mp: [155]
  ev: [inwang]
  note: 우리 문화에 대한 자부심이 높아진 것이 배경이에요(두 교과서).
- n: 천리경
  k: 유적·유물
  era: 조선 후기
  d: 멀리 있는 것을 가까이 볼 수 있게 해 주는 망원경이에요. 조선 후기 중국에 다녀온 사신들이 자명종 등과 함께 들여온 서양 문물이에요.
  x: 사신들은 「곤여만국전도」와 화포, 천리경, 자명종 등을 들여왔어요. 홍대용은 연경에서 선교사 할러슈타인에게 자명종·망원경 같은 서양 문물을 소개받았고, 천체를 관측하는 혼천의도 만들었어요. 이런 서양 과학 기술은 지식인들이 성리학적 세계관에서 벗어나는 데 영향을 주었어요.
  pg: [159]
  mp: [150]
  note: 미래엔 150에 '자명종과 천리경' 사진이 있어요(숭실대학교 한국기독교박물관).
- n: 천주교
  k: 사상·종교
  era: 조선 후기
  d: 17세기 중국에 다녀온 사신들을 통해 서양 학문의 하나로 들어왔다가, 18세기 후반 남인 계열 학자들이 신앙으로 믿기 시작한 종교예요. 천주 앞에 모두 평등하다는 가르침으로 중인·상민·여성에게 퍼졌지만, 조상 제사를 거부한다는 이유로 나라가 금지하고 신유박해 등으로 탄압했어요.
