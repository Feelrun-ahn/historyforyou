- n: 한글 소설
  k: 예술
  era: 조선 후기
  d: 한글로 써서 서민도 쉽게 읽을 수 있었던 소설로, 조선 후기에 크게 유행했어요. 평범한 인물이 주인공으로 나와 사회 모순을 비판하거나 서민의 감정을 담았고, 「홍길동전」·「춘향전」이 대표적이에요.
