  ev: [cheonghaejin]
  note: 오늘날 중국 산둥성 룽청시 스다오(석도) 적산 일대, 좌표는 대략. 세운 곳(등주 문등현 적산)과 신라인의 중심지라는 설명은 한국민족문화대백과사전 '장보고'·'완도 법화사지'. 세운 해는 확인하지 못해 y 는 장보고가 당에서 활동하던 9세기 전반의 대략 연도예요. relations.yaml jangbogo-network 의 적산 좌표 [122.45, 37.15]는 룽청 시내 쪽이라 스다오보다 북쪽이에요(확인 필요).
- n: 10위
  k: 제도
  era: 남북국
  d: 발해의 중앙군이에요. 왕궁과 수도를 지키는 일을 맡았고, 지방의 요충지와 국경 지역에는 따로 지방군을 두었어요.
  x: 통일 신라의 중앙군인 9서당이 여러 민족으로 부대를 나누어 민족 융합을 꾀한 것과 비교되는 발해의 군사 제도예요. 미래엔 교과서는 '10위'라는 이름 없이 왕궁과 수도를 경비한 중앙군으로 설명하고, 지방 요충지에 둔 군대는 지방관이 지휘했다고 써요. '통일 신라 9서당·10정, 발해 10위'로 짝지어 기억해 두면 좋아요.
  pg: [60, 72]
  mp: [57]
  inst: balhae-gov
  note: 미래엔은 '10위'라는 이름 없이 '중앙군'이라고만 써요.
- n: 10정
  a: [십정]
  k: 제도
  era: 남북국
