  x: 중앙군인 9서당과 짝을 이루어 통일 신라의 군사 조직을 이루었어요. 지방 행정 구역인 9주에 맞추어 군대를 두었다는 점에서, 삼국 통일로 넓어진 영토를 고르게 지키려 했음을 알 수 있어요.
  pg: [58, 72]
  mp: [55]
  ev: [nine-ju]
  inst: silla-unified-gov
- n: 3성 6부제
  a: [3성 6부]
  k: 제도
  era: 남북국
  d: 당의 중앙 정치 조직으로, 발해가 받아들여 정당성·선조성·중대성의 3성과 6부를 두었어요. 다만 정당성을 중심으로 운영하고 6부 이름을 유교 덕목(충·인·의·지·예·신)으로 바꿔 독자성을 보였어요.
  x: 당은 정책을 만들고 검토하는 중서성·문하성에 힘이 실리고 집행 기관인 상서성은 그 통제를 받았지만, 발해는 거꾸로 집행 기관인 정당성이 나랏일을 총괄했어요. 정당성의 우두머리인 대내상 밑에는 좌사정과 우사정이 있어, 좌사정은 충·인·의부를, 우사정은 지·예·신부를 거느렸어요. 이 밖에 관리를 감찰하는 중정대, 유학을 가르치는 주자감 등도 두었어요.
  pg: [60, 72]
  mp: [57, 61]
  ev: [munwang]
  inst: balhae-gov
- n: 5경 15부 62주
