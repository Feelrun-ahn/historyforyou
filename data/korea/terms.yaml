  x: 장보고는 9세기 전반 완도에 청해진을 세워 해적을 소탕하고, 당·신라·일본을 잇는 해상 무역을 장악했어요. 법화원은 당에 사는 신라인들이 세운 절인 신라원의 대표적인 예로, 산둥반도 일대에는 신라방·신라소·신라관도 함께 있었어요. 장보고는 뒤에 중앙의 왕위 다툼에 끼어들었다가 암살되었어요.
