  x: 선종은 수행으로 깨달음을 얻는 것을, 교종은 경전 공부로 지혜를 닦는 것을 중시했어요. 고려 초에는 선종이 중심이었지만 체제가 안정되자 국가의 지원을 받은 교종도 강해졌어요. 문종의 넷째 아들 의천은 송에 유학한 뒤 경전 공부와 수행을 함께 하자고 주장하며, 화엄종 중심으로 교종을 묶고 천태종을 세워 선종까지 아우르려 했지만 그가 죽은 뒤 교단은 다시 갈라졌어요.
  pg: [103]
  mp: [62]
  ev: [cheontae, uisang-buseoksa]
  note: '의상의 화엄종 개창은 미래엔 62·71쪽(남북국 단원). 비상 103쪽: 의천은 화엄종 중심으로 교종 통합 → 천태종으로 선종 통합 시도. ''화엄 사상'' 용어는 다른 작업(G1b) 범위.'
- n: 조선왕조실록
  k: 책·기록
  era: 조선 전기
  f: 1392
  t: 1863
  d: 태조부터 철종까지 25대 472년의 역사를 날짜 순서대로 기록한 역사책이에요. 왕이 죽으면 춘추관에 실록청을 두고 사관의 기록(사초) 등을 모아 편찬했는데, 왕도 마음대로 보거나 고칠 수 없어 공정하게 기록할 수 있었어요. 유네스코 세계 기록 유산이에요.
  x: 실록청에서는 사관이 기록한 사초와 각종 행정 기록, 개인의 글 등을 모아 정리했고, 실록을 완성하면 편찬에 쓴 자료를 모두 없애는 세초를 했어요. 완성된 실록은 한성의 춘추관과 지방의 사고에 나누어 보관했는데, 임진왜란 때 사고 등이 불타는 피해를 입기도 했어요. 『세종실록』에는 '왕이 실록을 보고 고치면 후세 임금이 본받고 사관이 제대로 쓰지 못한다'며 왕을 말린 신하의 말이 실려 있어요. 1997년에 세계 기록 유산이 되었어요.
  pg: [130]
  mp: [115]
  inst: joseon-central
  note: f·t 는 실록이 다루는 기간(태조~철종 472년, 비상 130). 한 해에 만든 책이 아니라 y 는 넣지 않았어요. 완성된 실록은 한성의 춘추관과 지방의 사고에 나누어 보관했어요(비상 130).
- n: 종묘 제례
  k: 문화유산
  era: 조선 전기
  y: 1395
  d: 서울 종묘에서 조선 역대 왕과 왕후의 신주를 모시고 지내던 나라의 제사예요. 유교 예법에 따라 엄격하고 장엄하게 치렀고, 종묘 제례악과 함께 유네스코 인류 무형 문화유산이에요.
  x: 태조는 한양으로 도읍을 옮기며 1394년 종묘 터를 정해 이듬해 1차 공사를 마쳤고, 경복궁 동쪽에 종묘, 서쪽에 토지와 곡식의 신에게 제사 지내는 사직단을 두었어요. 종묘는 임진왜란 때 불탔다가 1608년 광해군 때 다시 지었어요. 정전과 영녕전에 역대 왕과 왕후의 신주를 모셨고, 종묘 건물은 1995년 유네스코 세계 유산이 되었어요.
  pg: [117]
  mp: [118]
  at: [126.994, 37.575]
  ev: [hanyang]
  note: y 1395는 종묘가 처음 완공된 해(태조 4, 한국민족문화대백과사전 '종묘' E0052928). 좌표는 서울 종로의 종묘예요.
- n: 의정부
  k: 제도
  era: 조선 전기
  y: 1400
  d: 영의정·좌의정·우의정의 3정승이 모여 나랏일을 의논하고 정책을 정한 조선의 최고 기구예요. 왕에 따라 의정부를 거쳐 6조가 일을 하기도(의정부 서사제) 하고, 6조가 왕에게 바로 보고하기도(6조 직계제) 했어요.
  x: 1400년(정종 2) 이방원이 고려의 도평의사사를 고쳐 만들었고, 3정승 아래 좌·우찬성, 좌·우참찬 등이 함께 일했어요. 임진왜란 뒤 비변사가 군사뿐 아니라 외교·재정·인사까지 다루는 최고 기구가 되면서, 의정부와 6조는 이름만 남은 기관처럼 되었어요. 흥선 대원군이 비변사의 기능을 줄여 사실상 없애면서(1865년 의정부에 합침) 의정부는 옛 기능을 되찾았어요.
  pg: [116, 118]
  mp: [107, 109]
  ev: [uijeongbu-1400]
  inst: joseon-central
  note: 11단계 추가. 갑오개혁 뒤의 의정부(근대)는 다른 성격.
- n: 간의
  k: 유적·유물
  era: 조선 전기
  y: 1432
  d: 세종 때 만든 천체 관측 기구로, 별과 행성의 위치·시간·고도·방위를 잴 수 있었어요. 경복궁에 높은 천문대(간의대)를 쌓고 그 위에 설치해 관측했고, 그 결과가 역법서 『칠정산』을 만드는 바탕이 됐어요.
  x: 세종은 1432년 나무로 간의를 처음 만들어 본 뒤, 1438년 경복궁 경회루 북쪽에 천문대인 간의대를 쌓고 그 위에 간의를 두었어요. 조선은 왕이 하늘의 명을 받아 나라를 다스린다고 여겼고, 천문 현상이 농사에도 큰 영향을 주어 천문학을 중시했어요. 이 밖에 혼천의, 해시계 앙부일구, 물시계 자격루, 강우량을 재는 측우기도 만들었어요.
  pg: [130, 131]
  mp: [116]
  ev: [chiljeong]
  note: y 1432(세종 14)는 나무로 처음 만든 해이고, 간의대는 1438년에 세웠어요(한국민족문화대백과사전 '간의' E0000566).
- n: 향약집성방
  k: 책·기록
  era: 조선 전기
  y: 1433
  d: 세종 때 우리 땅에서 나는 약재(향약)와 그 약재를 쓰는 치료법을 모아 펴낸 의학책이에요. 우리 실정에 맞게 병을 고치려는 노력이 담겨 있어요.
  x: 1433년(세종 15)에 펴냈어요. 책 이름의 '향약(鄕藥)'은 우리 땅에서 나는 약재를 뜻해서, 사림이 만든 마을 자치 규약인 향약(鄕約)과는 다른 말이니 헷갈리지 않게 조심해요. 같은 무렵 우리 실정에 맞는 농사법을 담은 『농사직설』도 펴내, 백성의 삶에 실제로 도움이 되는 책을 많이 만들었어요. 조선 후기에는 허준이 『동의보감』을 펴내 전통 한의학을 체계화했어요.
  pg: [130]
  mp: [115]
  note: y 1433(세종 15)은 한국민족문화대백과사전 '향약집성방'(E0062961)으로 확인.
- n: 갑인자
  k: 유적·유물
  era: 조선 전기
  y: 1434
  d: 세종 때 만든 금속 활자예요. 글자 모양이 가지런해 판을 짜는 시간을 줄였고 튼튼해서, 책을 많이 찍어 내던 조선의 인쇄술 발달을 잘 보여 줘요.
  x: 세종 때인 1434년에 만들었어요. 태종 때 만든 계미자를 이어, 고려에서 처음 발명한 금속 활자 기술을 더욱 다듬은 것이에요. 나라의 기틀을 다지며 여러 분야의 책을 펴내자 인쇄술이 발달했고, 유학 책이 널리 보급되면서 조선의 유학도 학문적으로 더욱 발전했어요.
  pg: [130]
  mp: [116]
  note: y 1434(세종 16)는 한국민족문화대백과사전 '이천'(E0046202)으로 확인. 태종 때 계미자에 이은 금속 활자예요.
- n: 용비어천가
  k: 책·기록
  era: 조선 전기
  y: 1447
  d: 세종 때 훈민정음으로 지은 노래로, 조선 왕실 조상들의 업적을 기려 조선 건국이 하늘의 뜻임을 내세웠어요. 왕실의 권위를 높이고 조선 왕조의 정당성을 알리려는 뜻이 담겨 있어요.
  x: 1445년(세종 27) 권제·정인지·안지 등이 125장으로 지어 올렸고, 목조·익조·도조·환조·태조·태종의 여섯 조상을 노래했어요. 각 장의 앞부분에는 중국 제왕의 일을, 뒷부분에는 조선 조상의 일을 짝지어 놓았어요. 훈민정음 반포(1446)보다 1년 앞서 지어 훈민정음으로 적은 글 가운데 가장 앞선 것으로 보며, 1447년에 완성해 펴냈어요.
  pg: [129]
  mp: [114]
  ev: [hunmin-publish]
  note: 노래 본문은 1445년에 짓고 1447년(세종 29)에 완성·간행했어요(한국민족문화대백과사전 '용비어천가' E0039509).
- n: 신기전
  k: 유적·유물
  era: 조선 전기
  y: 1448
  d: 화약을 단 화살로, 불을 뿜으며 날아가는 로켓 모양의 무기예요. 화차에 여러 발을 꽂아 한꺼번에 쏠 수 있었고, 여진과 왜구의 침입을 막는 데 쓰였어요.
  x: 고려 말 최무선이 만든 '달리는 불'이라는 뜻의 주화를 1448년(세종 30)에 고쳐 신기전이라 했어요. 크기에 따라 대신기전·중신기전·소신기전과 불꽃을 뿌리는 산화신기전이 있었고, 가장 큰 대신기전은 길이가 5m를 넘고 1,000m 이상 날아갔어요. 『국조오례서례』에 남은 신기전 기록은 15세기 이전 로켓 무기에 관한 세계에서 가장 자세한 기록으로 평가돼요.
  pg: [130]
  mp: [127]
  note: y 1448(세종 30)은 고려 말 최무선의 주화를 고쳐 '신기전'이라는 이름을 붙인 해(한국민족문화대백과사전 '신기전' E0032719).
- n: 고사관수도
  k: 예술
  era: 조선 전기
  y: 1450
  d: 강희안이 물을 바라보며 깊은 생각에 잠긴 선비를 그린 그림이에요. 양반 문인 화가가 선비의 정신 세계를 담아낸 조선 전기의 대표 작품이에요.
  x: 조선 전기의 그림은 주로 국가에 필요한 그림을 맡은 관청인 도화서의 화원과 양반 문인들이 그렸어요. 같은 시기 도화서 화원 안견은 세종의 셋째 아들 안평 대군이 꿈에 본 무릉도원을 「몽유도원도」로 그렸고, 매화·난초·국화·대나무로 선비의 지조와 절개를 나타낸 사군자 그림도 유행했어요.
  pg: [133]
  mp: [117]
  note: 국립 중앙 박물관 소장. 그린 해가 정확하지 않아 y 는 15세기 중엽으로 대략 잡았어요.
- n: 분청사기
  k: 예술
  era: 조선 전기
  y: 1450
  d: 청자를 만들던 흙으로 그릇을 빚고 그 위에 흰 흙을 발라 구운 도자기예요. 고려 말부터 만들어져 조선 전기에 유행했고, 소박하고 자연스러운 멋이 특징이에요.
  x: 고려 말 청자를 만드는 기법에 새로운 방식을 더해 나타났어요. 대표작인 분청사기 희준은 코끼리 모양의 제사용 그릇으로 몸통에 거북 무늬가 그려져 있어요. 16세기 이후 깨끗하고 고상한 백자가 유행하면서 줄어들었고, 조선 후기에는 분청사기가 사라지고 백자가 민간에까지 널리 쓰였어요.
  pg: [133, 162]
  mp: [97, 117]
  note: 도자기 종류라 y 는 유행한 15세기 중엽으로 대략 잡았어요. 비상 162는 조선 후기에 분청사기가 사라지고 백자가 널리 쓰였다고 해요. 미래엔 97은 고려 단원이에요.
- n: 화차
  k: 유적·유물
  era: 조선 전기
  y: 1451
  d: 수레 위에 신기전 같은 화약 무기를 여러 개 올려 한꺼번에 쏠 수 있게 만든 무기예요. 쉽게 옮길 수 있어 여진과 왜구를 막는 데 쓰였고, 임진왜란 때도 조선군의 무기로 쓰였어요.
  x: 1409년(태종 9) 최무선의 아들 최해산이 처음 만들었어요. 1451년(문종 1)에는 두 바퀴 수레에 중·소신기전 100발이나 총통 50개를 올려 한꺼번에 쏠 수 있는 화차를 만들어, 그해에만 700대 넘게 해안과 성문 앞에 두었어요. 임진왜란 때에는 이를 고친 화차가 만들어졌고, 권율은 행주산성 전투에서 화차를 써서 큰 전과를 올렸다고 해요.
  pg: [130]
  mp: [127]
  note: 화차는 태종 때(1409) 처음 만들었고, 신기전을 꽂아 쏘는 화차는 문종 때(1451) 만든 것이라 y 를 1451로 했어요(한국민족문화대백과사전 '화차' E0064882).
- n: 한명회
  k: 인물
  era: 조선 전기
  y: 1453
  d: 계유정난으로 수양 대군(세조)이 왕이 되도록 도운 공신으로, 훈구 세력을 대표하는 인물이에요. 영의정에 오르고 예종·성종의 장인이 되어 큰 권력을 누렸고, 서울 압구정동 이름은 그가 한강 가에 지은 정자에서 왔어요.
  x: 젊어서는 과거에 번번이 떨어져 음서로 얻은 낮은 벼슬에 머물렀는데, 친구 권람을 통해 수양 대군과 손잡으면서 처지가 바뀌었어요. 세조가 왕이 된 뒤에는 단종을 다시 왕위에 올리려던 사육신의 계획을 막고 북쪽 국경의 방비를 다지는 데에도 힘을 보탰어요. 세조 즉위를 도운 공신과 왕실 외척은 토지와 노비를 받고 대를 이어 권력을 쥐어 훈구가 되었고, 성종 때부터 3사에 들어간 사림이 이들의 권력 독점을 비판했어요.
  pg: [123]
  ev: [gyeyu, sayuksin]
  fac: [hungu]
- n: 조의제문
  k: 책·기록
  era: 조선 전기
  y: 1457
  d: 김종직이 지은 글로, 자기 신하였던 항우에게 죽임을 당한 초나라 의제를 슬퍼하는 내용이에요. 연산군 때 훈구 세력은 이 글이 단종을 몰아낸 세조를 비난한 것이라며 문제 삼아 무오사화를 일으켰어요.
  x: 1457년(세조 3)에 지은 글로, 김종직의 제자 김일손이 사관으로 있을 때 사초에 실었어요. 1498년(연산군 4) 『성종실록』을 엮던 이극돈이 이를 찾아내 유자광에게 알렸고, 연산군은 김일손 등을 처형하고 이미 세상을 떠난 김종직의 무덤을 파헤쳐 벌을 주었어요. 이 무오사화를 시작으로 갑자사화·기묘사화·을사사화가 이어졌어요.
  pg: [124]
  mp: [120]
  ev: [muo]
  fac: [sarim, hungu]
  note: y 1457(세조 3)은 지은 해이고, 제자 김일손이 사초에 실은 것이 문제가 됐어요(한국민족문화대백과사전 '조의제문' E0052503). 미래엔은 '초나라 회왕(의제)'으로 써요.
- n: 종묘 제례악
  k: 예술
  era: 조선 전기
  y: 1464
  d: 종묘 제례 때 연주하는 음악과 춤이에요. 세종 때 만든 음악을 바탕으로 세조 때부터 종묘 제사에 쓰였고, 유교 절차에 따라 엄숙하게 연주돼요.
  x: 세종이 1447년 잔치 음악으로 만든 보태평과 정대업을 세조가 간추려 제사 음악으로 삼았어요. 보태평은 조상의 문덕을, 정대업은 무덕을 기리는 곡이에요. 편종·편경 같은 악기 연주와 노래(악장)에 맞추어, 보태평에는 깃털과 피리 모양 도구를 든 문무를, 정대업에는 나무로 만든 칼과 창을 든 무무를 추어요.
  pg: [117]
  mp: [117, 118]
  note: 세종 때(1447) 만든 보태평·정대업을 1464년(세조 10)부터 종묘 제례에 썼어요(한국민족문화대백과사전 '종묘제례악' E0052934). 미래엔 117은 세종 때 아악을 정리한 종묘 제례악이 모습을 갖추었다고 써요. 지도 점은 종묘 제례 항목에만 찍었어요.
- n: 홍문관
  a: [옥당]
  k: 제도
  era: 조선 전기
  y: 1478
  d: 성종 때 집현전을 이어 둔 기관으로, 궁궐의 책을 관리하고 왕에게 학문과 정책을 자문했어요. 경연을 맡았고 사헌부·사간원과 함께 3사로 불렸어요.
  x: 세조는 집현전을 없애고 경연도 열지 않았는데, 성종은 1478년 홍문관을 두고 경연을 다시 열었어요. 홍문관은 원래 학문 기관이었지만 사헌부·사간원과 함께 언론 활동을 해 3사로 불렸어요. 성종이 중용한 김종직 등 사림은 대부분 3사에 자리 잡고 훈구 대신들의 비리와 권력 독점을 날카롭게 따졌어요.
  pg: [116, 118]
  mp: [109]
  ev: [hongmungwan]
  inst: joseon-central
  note: 11단계 추가. '옥당'은 한국민족문화대백과사전 '홍문관'의 다른 이름.
- n: 악학궤범
  k: 책·기록
  era: 조선 전기
  y: 1493
  d: 성종 때 궁중 의식에 필요한 음악과 악기, 악보를 정리해 펴낸 음악책이에요. 유교 의례에서 음악을 중요하게 여긴 조선의 모습을 보여 줘요.
  x: 1493년(성종 24) 성현 등이 왕명으로 엮은 9권 3책의 책으로, 음악을 아악·당악·향악으로 나누어 정리하고 악기를 그림과 함께 치수·재료까지 적었어요. 춤의 순서와 동작, 악사와 무용수의 옷차림도 실려 있어 끊긴 옛 음악을 되살리는 데 쓰였어요. 고려 가요 「동동」의 노랫말이 한글로 실려 있어 국문학 연구에도 귀한 자료예요.
  mp: [117]
  note: y 1493(성종 24)과 성현 등이 편찬한 사실은 한국민족문화대백과사전 '악학궤범'(E0034481)으로 확인.
- n: 소격서
  k: 제도
  era: 조선 전기
  y: 1518
  d: 왕실의 도교 행사를 맡던 예조 소속 관청이에요. 왕도 정치를 내세운 조광조가 유교 나라에 맞지 않는다며 없애자고 해 폐지됐어요.
  x: 1518년(중종 13)에 폐지되었지만, 기묘사화로 조광조가 제거된 뒤 다시 세워졌다가 임진왜란 뒤 완전히 없어졌어요. 조광조는 이 밖에도 추천으로 인재를 뽑는 현량과를 실시하고, 중종반정 때 공도 없이 공신이 된 사람들의 자격을 빼앗자는 위훈 삭제를 주장했어요. 급진적인 개혁에 부담을 느낀 중종이 훈구와 손잡으면서 개혁은 실패했어요(기묘사화, 1519).
  pg: [124]
  mp: [120]
  ev: [hyeollyang, gimyo]
  fac: [sarim]
  note: y 1518(중종 13)은 폐지된 해(한국민족문화대백과사전 '소격서' E0029912). 기묘사화 뒤 다시 세워졌다가 임진왜란 뒤 완전히 없어졌다고 해요(같은 사전).
- n: 백자
  k: 예술
  era: 조선 전기
  y: 1550
  d: 흰 바탕에 깨끗하고 고상한 느낌을 주는 도자기예요. 16세기 이후 분청사기 대신 크게 유행했고, 조선 후기에는 민간에까지 널리 쓰였어요.
  x: 조선 전기의 백자 병은 단정하고 우아한 곡선미를 보여 줘요. 조선 후기에는 백자가 더욱 널리 쓰였고, 둥근 달처럼 생긴 백자 달 항아리와 흰 바탕에 푸른 안료로 그림을 그린 청화 백자가 유행했어요. 고려를 대표하는 도자기가 청자라면, 조선은 전기에 분청사기, 16세기 이후로는 백자가 대표예요.
  pg: [133, 162]
  mp: [117, 155]
  note: 특정 유물이 아니라 도자기 종류라 y 는 유행하기 시작한 16세기 중엽으로 대략 잡았어요. 조선 후기의 청화 백자는 따로 항목이 있어요.
- n: 사액 서원
  k: 제도
  era: 조선 전기
  y: 1550
  d: 왕이 서원 이름을 쓴 현판과 함께 토지·노비·책을 내려 주고 세금을 면제해 준 서원이에요. 주세붕이 세운 백운동 서원이 명종 때 '소수 서원'이라는 현판을 받아 첫 사액 서원이 됐어요.
  x: 백운동 서원은 1542년 풍기 군수 주세붕이 고려 유학자 안향을 모시며 세웠고, 1548년 풍기 군수로 온 이황이 국가의 지원을 요청해 1550년 '소수 서원'이라는 이름을 받았어요. 서원은 사림이 성리학을 연구하고 여론을 모으는 근거지였는데, 지나치게 늘어 붕당의 근거지가 되자 흥선 대원군은 47곳만 남기고 정리했어요. 소수 서원 등 9곳은 2019년 '한국의 서원'으로 유네스코 세계 유산이 되었어요.
  pg: [125]
  mp: [122]
  ev: [baegundong]
  fac: [sarim]
  note: y 1550(명종 5)은 소수 서원이 사액된 해(한국민족문화대백과사전 '영주 소수서원' E0030146). 국가가 서원을 장려하면서 사림이 향촌에서 세력을 키웠어요.
- n: 관동별곡
  k: 예술
  era: 조선 전기
  y: 1580
  d: 정철이 강원도 관찰사로 있을 때 관동 지방을 돌아보며 그 경치와 감흥을 한글로 지은 가사예요. 조선 전기 가사 문학을 대표하는 수준 높은 작품으로 꼽혀요.
  x: 1580년(선조 13) 정월 강원도 관찰사로 원주에 부임한 정철은 그해 3월 내금강과 외금강, 총석정·삼일포·경포대·망양정 같은 동해안 명승지를 유람하며 이 가사를 지었어요. 감탄사와 대구 등으로 우리말을 시처럼 다룬 솜씨가 뛰어나, 김만중은 『서포만필』에서 중국의 명작에 견주어 '동방의 이소'라고 높이 평가했어요.
  pg: [133]
  note: y 1580(선조 13)과 강원도 관찰사로 부임한 일은 한국민족문화대백과사전 '관동별곡'(E0004779)으로 확인.
- n: 김시민
  k: 인물
  era: 조선 전기
  y: 1592
  d: 임진왜란 때 진주성에서 군사와 백성을 이끌고 일본군의 공격을 막아 낸 장수예요(진주 대첩). 수군과 의병의 활약, 평양성 탈환과 함께 전세를 바꾸는 데 힘이 됐어요.
  x: 1592년 음력 10월 일본군이 진주성을 공격하자 군사와 백성이 함께 성을 지켜 냈어요(1차 진주성 전투). 진주 대첩은 한산도 대첩·행주 대첩과 함께 임진왜란 3대 대첩으로 꼽혀요. 이듬해 6월 일본군은 이 패배를 갚으려고 대군으로 다시 공격해 진주성을 함락했고, 많은 군민이 희생되었어요(2차 진주성 전투).
  pg: [135]
  mp: [126]
  note: 진주 대첩(1592년 음력 10월)은 전쟁 데이터 imjin 의 battle 이에요.
- n: 난중일기
  k: 책·기록
  era: 조선 전기
  y: 1592
  f: 1592
  t: 1598
  d: 이순신이 임진왜란 동안 진중에서 쓴 일기예요. 전투 상황과 수군의 생활, 개인의 고민까지 자세히 담겨 전쟁을 이해하는 귀한 자료로 꼽히며, 유네스코 세계 기록 유산이에요.
  x: 2013년 유네스코 세계 기록 유산이 되었고, 충남 아산 현충사에 보관되어 있어요. 수군을 이끈 지휘관이 직접 쓴 일기라, 해전의 경과와 수군의 형편을 생생하게 알 수 있어요.
  pg: [136]
  note: 충남 아산 현충사 소장(비상 사진).
- n: 이순신
  k: 인물
  era: 조선 전기
  y: 1592
  d: 임진왜란 때 조선 수군을 이끈 장수예요. 옥포·사천·당포·한산도 등에서 잇달아 이겨 남해의 바닷길과 곡창 지대 전라도를 지켰고, 정유재란 때 명량에서 일본 수군을 무찌른 뒤 노량에서 물러나는 일본군을 쳐 7년 전쟁을 끝냈어요.
  x: 한산도 대첩에서는 일본 수군을 한산도 앞바다로 끌어낸 뒤 학이 날개를 편 모양으로 둘러싸 공격하는 학익진으로 크게 이겼어요. 바닥이 평평해 방향을 바꾸기 쉽고 튼튼해 화포의 충격을 잘 견딘 판옥선과, 판옥선에 거북 등 모양 덮개를 씌운 돌격선 거북선이 승리의 바탕이 되었어요. 노량 해전에서 물러나는 일본군과 싸우다 전사했어요.
  pg: [135, 136]
  mp: [126, 127]
  note: 해전은 전쟁 데이터 imjin·jeongyu 의 battles(한산도 대첩·명량 해전·노량 해전 등). 『난중일기』를 남겼어요.
- n: 휴정
  a: [서산 대사]
  k: 인물
  era: 조선 전기
  y: 1592
  d: 서산 대사로 불린 승려예요. 임진왜란 때 유정(사명 대사) 등과 함께 승려들로 승군을 조직해 일본군에 맞섰어요.
  x: 관군이 잇달아 지자 곽재우 같은 유생은 농민을 모아 의병을, 휴정·유정 같은 승려는 승군을 일으켰어요. 이들은 익숙한 지리를 이용해 적은 병력으로 일본군을 괴롭히고 관군이 다시 정비할 시간을 벌어 주었어요. 유정(사명 대사)은 전쟁이 끝난 뒤 일본에 건너가 조선인 포로 3,000여 명을 데리고 돌아왔어요.
  pg: [135]
  mp: [126]
  note: 미래엔 126 지도에 '휴정(서산 대사)', '유정(사명 대사)'으로 나와요. 사명 대사의 포로 송환은 사건 samyeong.
- n: 권율
  k: 인물
  era: 조선 전기
  y: 1593
  d: 임진왜란 때 행주산성에서 일본군의 대규모 공격을 물리친 장수예요(행주 대첩). 조·명 연합군의 평양성 탈환과 이 승리로 조선은 한성을 되찾을 수 있었어요.
  x: 조·명 연합군이 평양성을 되찾은 뒤인 1593년 음력 2월, 일본군이 대군으로 행주산성을 공격했지만 권율이 이끈 조선군은 화차 같은 화약 무기도 써서 크게 물리쳤어요. 행주 대첩은 한산도 대첩·진주 대첩과 함께 임진왜란 3대 대첩으로 꼽혀요. 불리해진 일본군은 한성에서 물러나 남해안으로 내려가 명과 휴전 협상을 벌였어요.
  pg: [135]
  mp: [127]
  note: 행주 대첩(1593년 음력 2월 12일)은 전쟁 데이터 imjin 의 battle 이에요.
- n: 행주산성
  k: 문화유산
  era: 조선 전기
  y: 1593
  d: 한강 가 언덕(경기 고양)에 있는 산성으로, 임진왜란 때 권율이 이끈 조선군이 일본군의 대규모 공격을 물리친 행주 대첩의 현장이에요.
  x: 평양성을 되찾은 조·명 연합군에 밀리던 일본군은 1593년 대군을 모아 이곳을 공격했다가 크게 졌고, 결국 한성에서 물러나 남해안으로 내려갔어요. 오늘날 행주산성 기념관에는 행주 대첩에서도 쓰였다는 화차를 1980년에 복원한 문종 화차가 전시되어 있어요.
  pg: [135]
  mp: [127]
  at: [126.832, 37.597]
