  x: 19세기에는 낯선 서양 배가 자주 나타나고 천주교가 퍼지면서 외세가 쳐들어올지 모른다는 걱정이 커졌어요. 흥선 대원군은 해안 방어를 강화하고 천주교를 탄압했는데, 프랑스는 이 탄압을 구실로 병인양요를 일으켰어요. 척화비에는 서양과 싸우지 않고 화친하자는 것은 나라를 파는 일이라는 뜻의 글을 새겼어요. 흥선 대원군이 물러난 뒤에는 개항하자는 통상 개화론이 힘을 얻었고, 이런 가운데 일본이 운요호 사건을 일으켜 개항을 강요하자 1876년 강화도 조약이 맺어졌어요.
