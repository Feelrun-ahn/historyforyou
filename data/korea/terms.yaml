  x: 부윤(종2품)부터 현감(종6품)까지 고을의 크기에 따라 품계가 달랐고, 임기는 『경국대전』에서 1,800일(약 5년)로 정했어요. 농사 장려·호구 늘리기·군정·교육·세금·재판·풍속 바로잡기의 '수령 7사'로 관찰사의 평가를 받았어요. 조선 후기 세도 정치 때는 뇌물로 관직을 산 수령들이 백성을 수탈해 삼정이 문란해졌어요.
