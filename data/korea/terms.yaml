  d: 신라 골품제에서 진골 다음가는 신분이에요. 학식이 뛰어나 통일 뒤 왕의 정치 조언자로 활약했지만, 높은 관직에 오를 수 없어 신라 말에는 골품제를 비판하며 개혁을 주장했어요.
  x: 비상 교과서의 골품·관등표를 보면 6두품은 17관등 가운데 6등급인 아찬까지만 오를 수 있었어요. 강수·설총·최치원처럼 이름난 유학자가 많이 나왔고, 당에 유학해 빈공과에 합격한 사람도 많았어요. 신라 말 개혁안이 받아들여지지 않자 일부는 정치를 멀리했고, 일부는 지방 호족과 손잡고 새로운 사회를 만들려 했어요.
  pg: [57, 61, 65]
  mp: [54, 59, 60, 74]
  ev: [choe-chiwon]
  note: 삼국 시대 골품제부터 있던 신분이지만 두 교과서 모두 통일 신라·신라 말에서 주로 다뤄요. 목록의 비상 쪽수는 비어 있어 본문에서 찾아 넣었어요.
- n: 강수
  k: 인물
  era: 남북국
  d: 통일 무렵 신라의 6두품 유학자예요. 당에 보내는 외교 문서를 잘 지어 신라가 삼국을 통일하는 데 힘을 보탰어요.
  x: 통일 신라는 왕권 강화와 체제 안정을 위해 유학을 정치 이념으로 삼았고, 학식을 갖춘 6두품 출신 유학자들이 활약했어요. 강수는 설총과 함께 통일 무렵을 대표하는 유학자로, 당과의 외교가 중요했던 삼국 통일 과정에서 그의 문장 실력은 큰 힘이 되었어요.
