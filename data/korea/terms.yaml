  x: 고려의 어사대가 1369년(공민왕 18) 사헌부로 이름을 바꾼 것을 이어받았어요. 부정한 관리를 탄핵해 물러나게 했고, 제도상 사간원의 몫인 왕에 대한 간쟁도 실제로는 함께 했어요. 사헌부 관원은 대관, 사간원 관원과 합쳐서는 대간이라 불렀고, 1894년 갑오개혁 때 없어졌어요.
