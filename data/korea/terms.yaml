  note: 활동 연도는 교과서·백과사전으로 딱 맞는 해를 확인하지 못해 y 를 넣지 않았어요.
- n: 고구려 계승 의식
  k: 개념
  era: 남북국
  d: 발해가 스스로 고구려를 이은 나라라고 여긴 생각이에요. 발해 왕은 일본에 보낸 외교 문서에서 자신을 '고려(고구려) 국왕'이라 했고, 일본도 발해를 '고려'라고 불렀어요.
  x: 발해는 일본에 보낸 문서에서 '고구려의 옛 땅을 되찾고 부여의 풍속을 이어받았다'고 밝혔고, 일본은 발해에 보낸 사신을 '견고려사'라고 목간에 적었어요. 문화에서도 정혜 공주 묘의 모줄임천장, 온돌 시설, 기와, 이불병좌상 등에서 고구려의 전통이 확인돼요. 발해 지배층에는 고구려 유민이 많았고, 왕족 대씨 말고도 고구려 왕족 출신인 고씨가 많았어요.
  pg: [54, 55, 72]
  mp: [52]
  ev: [balhae-founding, munwang]
- n: 관음 신앙
