  d: 문관 인사를 맡은 이조의 정랑과 좌랑을 함께 이르는 말이에요. 하급 관리와 3사 관리를 골라 추천하고 자기 후임자까지 추천할 수 있어 인사에 큰 힘을 가졌어요. 선조 때 이 자리를 두고 김효원과 심의겸이 맞서면서 사림이 동인·서인으로 갈라졌고, 영조는 탕평책을 펴며 이조 전랑의 권한을 줄였어요.
