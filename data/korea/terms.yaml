  x: 실록은 사관이 기록한 사초와 각종 행정 기록 등을 바탕으로 엮었고, 완성되면 한성의 춘추관과 지방의 사고에 나누어 보관했어요. 임진왜란 때에는 실록을 보관하던 사고 등이 불타는 피해를 입었어요. 고려도 실록을 꾸준히 펴냈지만 지금은 전하지 않아요.
