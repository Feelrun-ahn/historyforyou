  x: 발해는 건국 초기 당과 맞섰지만 문왕 때 친선 관계를 맺은 뒤 활발히 교류하며 말·모피·철·인삼 등을 수출하고 비단·서적 등을 들여왔어요. 미래엔 교과서 지도에는 산둥반도의 등주에 신라관과 발해관이 함께 표시되어 있어요.
