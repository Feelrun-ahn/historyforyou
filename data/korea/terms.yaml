  x: 강화도 조약(1876) 뒤 조선은 미국을 시작으로 영국·독일·러시아·프랑스 등과도 수교했는데, 서양 나라들과 맺은 이 조약들도 최혜국 대우와 영사 재판권을 내준 불평등 조약이었어요. 열강의 이권 침탈이 심해지자 이에 맞서는 움직임도 일어나, 독립 협회는 러시아가 부산 절영도를 빌려 쓰려는 것을 막았고 보안회는 일본이 황무지를 개간할 권리를 달라고 하자 반대 운동을 벌였어요.
