- n: 정효 공주 묘
  k: 문화유산
  era: 남북국
  y: 792
  d: 발해 문왕의 딸 정효 공주의 무덤이에요. 당의 영향을 받아 벽돌로 쌓았지만 천장은 고구려 방식을 이었고, 무덤 위에 탑을 세운 독특한 모습이에요. 안에 벽화와 묘지석이 남아 있어요.
  x: 묘지석에는 문왕의 연호 '대흥'과 함께 문왕을 황제라는 뜻의 '황상'으로 부른 글자가 새겨져 있어, 발해가 안으로 황제국을 지향하며 당과 대등하다는 의식을 가졌음을 보여 줘요. 벽화에는 당의 화풍을 반영한 인물들이 그려져 있어요. 고구려와 당의 요소를 함께 갖추면서도 무덤 위에 탑을 세운 독특한 모습이어서, 여러 문화를 융합한 발해 문화의 특징이 잘 드러나요.
