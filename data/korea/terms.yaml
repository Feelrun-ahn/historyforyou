  x: 미래엔 교과서는 영광탑을 정효 공주 묘와 함께, 여러 나라의 양식을 섞으면서도 발해만의 특색을 갖춘 문화유산으로 소개해요. 통일 신라의 탑이 주로 돌로 쌓은 석탑이었던 것과 달리 벽돌로 쌓았다는 점도 비교해 볼 만해요.
