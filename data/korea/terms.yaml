  d: 당이 외국인을 위해 따로 치른 과거 시험이에요. 최치원처럼 당에 유학한 신라의 6두품과 발해 사람들이 많이 합격해 높은 학문 수준을 보여 주었어요.
  x: 최치원은 열두 살에 당으로 유학을 떠나 빈공과에 합격하고 당의 관리로 일하며 뛰어난 문장으로 이름을 떨쳤지만, 신라로 돌아와서는 골품제의 한계로 뜻을 펼치지 못했어요. 미래엔 교과서에는 빈공과에서 발해인이 수석을 차지하고 신라인이 그다음을 했다는 장면이 실려 있어, 발해의 유학 수준도 높았음을 알 수 있어요. 당은 신라의 문화 수준을 높이 평가해 '군자의 나라'라고 불렀어요.
  pg: [63, 65, 68]
  mp: [60, 62, 64]
  ev: [choe-chiwon]
