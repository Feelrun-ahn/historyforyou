  d: 11세기 중국 송에서 향촌 사회를 교화하려고 만든 규약이에요. 덕업상권·과실상규·예속상교·환난상휼의 네 덕목을 담았고, 중종 때 사림이 번역해 퍼뜨리면서 우리 향약의 바탕이 됐어요.
