  d: 불교 경전을 공부하고 교리를 깊이 이해하는 것을 중시한 불교 종파들을 함께 이르는 말이에요. 신라 말 마음속 깨달음을 강조한 선종이 퍼지면서 서로 맞서게 되었고, 고려 때 의천과 지눌이 둘을 아우르려 했어요.
  x: 통일 신라에서는 의상이 연 화엄종처럼 경전과 교리를 깊이 연구하는 교종이 왕실과 귀족 중심으로 발달했어요. 이와 달리 선종은 경전에 기대지 않고 누구나 일상 속에서 마음의 진리를 깨달을 수 있다고 가르쳐 지방 호족과 백성의 호응을 얻었어요. 고려의 의천은 교종을 중심으로 선종을 통합하려 했고, 지눌은 선종을 중심으로 교종을 아우르려 했어요.
