  x: 5경은 상경 용천부·중경 현덕부·동경 용원부·서경 압록부·남경 남해부였고, 발해는 이를 중심으로 여러 교통망을 정비했어요. 촌락을 토착 세력인 말갈 수령에게 맡긴 것은 고구려 유민과 말갈인의 조화를 꾀한 것이에요. 통일 신라의 9주 5소경과 비교해 기억해 두면 좋아요.
