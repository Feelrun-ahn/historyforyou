  ev: [geumgwan-founding, geumgwan-fall, daegaya-fall]
  inst: yeonmaeng-central
  note: 미래엔은 '가야 연맹'이라는 말 대신 '가야의 여러 소국'으로 설명해요(22·30쪽). f 는 금관가야 건국(42), t 는 대가야 멸망(562).
- n: 좌평
  a: [6좌평]
  k: 제도
  era: 삼국
  y: 260
  d: 백제의 최고 관등이에요. 3세기 고이왕 때 마련되었고 6명의 좌평(6좌평)이 나랏일을 나누어 맡았으며, 성왕 때 6좌평제와 16관등제를 다시 정비했어요.
  x: 고이왕은 좌평을 비롯한 관리의 등급을 마련하고 등급에 따라 관복의 색을 달리해 서열을 구분했으며, 주변 마한 소국을 복속해 한반도 중부를 차지했어요. 미래엔 교과서에 따르면 백제에는 16관등이 있었고, 고구려는 10여 관등, 신라는 17관등이었어요. 『삼국유사』에는 좌평을 뽑을 때 후보의 이름을 바위 위에 올려 두었다가 표시가 남은 사람을 골랐다는 정사암 이야기가 전해요.
  pg: [28]
  mp: [21, 27]
  ev: [goi-baekje]
  inst: baekje-politics
  note: y 는 사건 goi-baekje 를 따른 대략값(교과서는 '3세기 중반'·'3세기').
- n: 칠지도
  k: 문화유산
  era: 삼국
  y: 369
  d: 칼날 양옆으로 가지가 세 개씩 뻗은 백제의 칼이에요. 백제 왕세자가 왜왕에게 전한다는 글이 새겨져 있어 근초고왕 무렵 백제와 왜의 교류를 보여 줘요.
  x: 쇠를 두드려 만든 길이 약 75cm의 칼로, 칼몸 앞뒤에 60여 자의 글자를 금으로 새겨 넣었어요. 근초고왕 때 백제는 남해안까지 진출하고 중국 동진·왜와 교류하며 해상 활동을 넓혔는데, 칠지도는 이 시기 백제와 왜의 관계를 보여 주는 대표 유물이에요. 지금은 일본 나라현의 이소노카미 신궁에 있고, 글자를 어떻게 읽느냐에 따라 백제가 왜왕에게 내려 준 것이라는 설, 대등한 관계의 선물이라는 설 등 해석이 갈려요.
  pg: [29, 38]
  mp: [26]
  at: [135.853, 34.598]
  ev: [geunchogo]
  note: 교과서는 '근초고왕 시기에 만들어진 것으로 추정'이라고만 적었어요. y 는 칼에 새긴 연도를 369년으로 읽는 견해를 따른 대략값(확인 필요). at 은 지금 소장처인 일본 나라현 덴리시 이소노카미 신궁이에요.
- n: 영락
  k: 제도
  era: 삼국
  y: 391
  f: 391
  t: 412
  d: 광개토 대왕 때 고구려가 쓴 연호로, '영원한 즐거움'이라는 뜻이에요. 지금까지 확인된 고구려 연호 가운데 가장 오래되었고, 강해진 고구려의 국력과 자신감을 보여 줘요.
  x: 연호는 원래 중국 황제가 자신의 통치 이념을 나타내려고 쓴 것으로, 왕이 즉위한 해부터 연도를 세는 기준이 되었어요. 그래서 독자적인 연호를 썼다는 것은 중국과 대등하다는 자주 의식을 드러낸 것으로 봐요. 신라는 법흥왕 때 '건원', 발해는 무왕 때 '인안'과 문왕 때 '대흥' 같은 독자적인 연호를 썼어요.
  pg: [26]
  ev: [gwanggaeto, gwanggaeto-stele]
  note: 광개토 대왕 재위 기간(391~412) 동안 썼어요. 연호는 왕이 즉위한 해부터 연도를 세는 역할을 해요(비상 26쪽).
- n: 장군총
  k: 문화유산
  era: 삼국
  y: 420
  d: 중국 지린성 지안(옛 국내성 일대)에 있는 고구려의 돌무지무덤이에요. 돌을 깎아 계단식으로 높이 쌓은 거대한 무덤으로, 무덤 둘레에 큰 돌(둘레돌)을 세웠어요.
  x: 잘 다듬은 화강암 돌을 7층 계단 모양으로 쌓았는데, 한 변이 약 30m, 높이가 13m 남짓에 이르러 돌무지무덤 가운데 가장 발달한 형식을 보여 줘요. 5세기 전반에 만든 것으로 보며, 무덤의 주인은 광개토 대왕이나 장수왕으로 보는 견해가 있지만 확실하지 않아요. 백제 초기의 석촌동 계단식 돌무지무덤과 비슷해, 백제를 세운 세력이 고구려 계통임을 보여 주는 근거로도 쓰여요.
  pg: [40]
  mp: [20]
  at: [126.24, 41.16]
  note: y 는 대략값(5세기 무렵 만든 것으로 봄, 주인과 정확한 해는 확인 필요). 무덤 구조는 비상 40쪽 그림, 계단식은 미래엔 20쪽.
- n: 남진 정책
  k: 사건
  era: 삼국
  y: 427
  d: 장수왕이 427년 평양으로 도읍을 옮긴 뒤 남쪽으로 영토를 넓히려 한 고구려의 정책이에요. 위협을 느낀 신라와 백제가 나제 동맹을 맺어 맞섰지만, 고구려는 475년 백제 한성을 함락하고 남한강 유역까지 나아갔어요.
  x: 장수왕은 북위와 남조 등 중국의 여러 왕조와 외교 관계를 맺어 나라를 안정시킨 뒤 남쪽으로 힘을 모았어요. 대동강 가의 넓은 들을 낀 평양은 먹을거리와 물자가 넉넉하고 바닷길로 나가기도 편했으며, 도읍을 옮기면 국내성에 뿌리를 둔 귀족들의 힘을 누를 수도 있었어요. 고구려가 한강 유역까지 내려왔음은 충주 고구려비와 아차산 보루 같은 유적으로 확인할 수 있어요.
  pg: [27]
  mp: [24]
  ev: [pyongyang-427, naje-alliance, hanseong-fall]
- n: 안학궁
  k: 문화유산
  era: 삼국
  y: 427
  d: 장수왕이 427년 평양으로 도읍을 옮길 때 세운 고구려의 궁궐이에요. 담장 안에 여러 건물이 늘어선 큰 궁궐이었지만 지금은 터만 남아 있어요.
  x: 평양 대성산 남쪽 기슭에 있으며, 한 변 약 622m의 성벽 안에서 51기의 건물 터와 정원·연못 등이 확인되었어요. 북쪽 가까이에 있는 대성산성과 짝을 이룬 평지의 궁성으로 봐요. 교과서는 장수왕이 평양으로 천도할 때 세운 궁궐로 설명하지만, 6세기 이후나 고려 시대에 지었다고 보는 견해도 있어요.
  pg: [27]
  at: [125.82, 39.06]
  ap: 1
  ev: [pyongyang-427]
  note: y 는 평양 천도 해(교과서 '천도할 때 세운 궁궐'). at 은 평양 대성산 남쪽 안학궁 터 일대로 대략이에요(사건 pyongyang-427 과 같은 좌표).
- n: 눌지왕
  k: 인물
  era: 삼국
  y: 433
  d: 5세기 신라의 왕이에요. 내물왕 때부터 고구려의 정치적 간섭을 받던 신라는 눌지왕 때 백제와 동맹(나제 동맹)을 맺어 여기서 벗어나려 했어요.
  x: 내물왕 때 신라는 왜의 공격을 광개토 대왕의 도움으로 물리쳤는데, 그 뒤 고구려 군대가 신라에 머물며 간섭했고 신라는 고구려를 통해 중국 문물을 받아들였어요. 경주 호우총에서 나온 '광개토 대왕'의 이름이 새겨진 청동 그릇은 이 시기 두 나라의 밀접한 관계를 보여 줘요. 433년 맺은 나제 동맹은 장수왕의 남진에 맞서는 바탕이 되었고, 6세기 중반 진흥왕이 한강 유역을 차지할 때까지 이어졌어요.
  pg: [31]
  ev: [naje-alliance]
  note: y 는 나제 동맹을 맺은 해(사건 naje-alliance). 재위 417~458년(한국민족문화대백과사전).
- n: 아차산 보루
  a: [아차산 일대 보루군]
  k: 문화유산
  era: 삼국
  y: 475
  d: 서울 아차산 일대에 고구려가 쌓은 작은 방어 시설(보루)들이에요. 5세기 남진 때는 백제를 치는 전진 기지로, 6세기 백제·신라 연합군이 공격할 때는 방어 기지로 쓰였어요.
  x: 아차산은 한강만 건너면 곧장 백제 도성인 풍납동 토성과 몽촌토성에 닿는 곳이어서, 한강 유역을 두고 삼국이 다툴 때 놓칠 수 없는 자리였어요. 이 일대에서 10여 기가 넘는 보루가 발굴되었는데, 4보루에는 100여 명이 머문 막사와 온돌, 물을 모아 두는 시설 등이 있었고 여러 무기도 나왔어요. 이곳의 온돌은 발해 성터의 온돌과 함께 고구려 문화가 발해로 이어졌음을 보여 주는 자료로도 쓰여요.
  pg: [24]
  mp: [25]
  at: [127.1, 37.57]
  ap: 1
  ev: [hanseong-fall, hangang-553]
  note: y 는 대략값(고구려가 한성을 함락한 475년 무렵부터 쓴 것으로 봄). 10여 기가 넘는 보루가 흩어져 있어 좌표는 아차산 일대로 대략이에요.
- n: 천마총
  k: 문화유산
  era: 삼국
  y: 500
  d: 경주 대릉원에 있는 신라의 돌무지덧널무덤이에요. 하늘을 나는 말을 그린 천마도 장니와 금관 등 많은 껴묻거리가 나와 신라 지배층의 문화를 보여 줘요.
  x: 1973년에 발굴되었으며, 지름 약 47m·높이 약 12.7m의 봉분 안에서 1만 1천여 점의 유물이 나왔어요. 천마도는 말 탄 사람의 옷에 흙이 튀지 않도록 말의 배 양쪽에 늘어뜨리는 장니에 그린 그림으로, 자작나무 껍질을 여러 겹 붙여 만든 판 위에 그렸어요. 그림 속 동물을 날개 달린 천마로 보는 것이 일반적이지만 상상의 동물 기린으로 보는 견해도 있고, 무덤 주인은 지증왕 등으로 추정할 뿐 확실하지 않아요.
  pg: [40, 41]
  mp: [28, 37]
  at: [129.212, 35.838]
  note: y 는 대략값(5세기 말~6세기 초 무렵으로 봄, 확인 필요). 천마는 죽은 사람을 하늘로 실어 나른다고 여겼어요(비상 41쪽).
- n: 이사부
  k: 인물
  era: 삼국
  y: 512
  d: 신라 지증왕 때의 장군으로, 우산국(울릉도)을 정벌해 신라에 공물을 바치게 했어요. 이 일은 울릉도와 독도가 우리 땅이 된 가장 이른 기록으로 남아 있어요.
  x: 우산국 사람들이 사나워 힘으로 굴복시키기 어렵자, 나무로 사자를 많이 만들어 배에 싣고 가서 항복하지 않으면 풀어 놓겠다고 위협해 항복을 받아 냈다고 전해요. 진흥왕 때에는 군사를 맡은 병부령으로서 한강 상류 진출과 대가야 정복(562)에 앞장섰고, 역사서 편찬을 건의해 거칠부 등이 『국사』를 펴냈어요. 단양 신라 적성비에도 그의 이름이 나와요.
  mp: [28]
  ev: [usanguk]
  note: 비상 31쪽은 이름 없이 지증왕의 우산국 정복만 적었어요. y 와 독도 관련 내용은 사건 usanguk 을 따랐어요.
- n: 골품제
  a: [골품 제도]
  k: 제도
  era: 삼국
  y: 520
  d: 신라에서 혈통에 따라 신분을 나눈 제도예요. 골품에 따라 오를 수 있는 관등의 한계가 정해졌고, 옷 색깔과 집 크기 같은 일상생활까지 제한했어요.
  x: 왕족은 성골과 진골로, 그 아래는 6두품부터 1두품까지 나누었어요. 비상 교과서의 표를 보면 진골은 최고 관등인 이벌찬까지 오를 수 있었지만, 6두품은 6등급 아찬, 5두품은 10등급 대나마, 4두품은 12등급 대사까지만 오를 수 있었어요. 성골이 끊어진 뒤 무열왕부터 진골이 왕위를 이었고, 신라 말 6두품은 능력보다 혈통을 중시하는 골품제를 비판하며 개혁을 주장했어요.
  pg: [40]
  mp: [28, 59, 60]
  ev: [silla-yullyeong]
  inst: silla-golpum
  note: y 는 법흥왕이 율령을 반포하며 골품제 규정을 마련한 해(미래엔 28쪽). 비상 40쪽 표는 성골·진골 아래를 6~1두품으로 나눴다고 설명해요.
- n: 무령왕릉
  k: 문화유산
  era: 삼국
  y: 525
  d: 충남 공주에 있는 백제 무령왕과 왕비의 무덤이에요. 중국 남조의 영향을 받은 벽돌무덤으로, 4,600여 점의 유물이 나와 백제의 활발한 대외 교류를 보여 줘요.
  x: 1971년에 발견되었는데, 무덤에서 나온 지석에 '사마왕'이라는 무령왕의 이름과 세상을 떠난 해(523)가 새겨져 있어 주인을 정확히 알 수 있는 백제 왕릉이에요. 일본에서 자라는 금송으로 만든 목관, 중국식 청동 거울과 오수전, 무덤을 지키는 상상의 동물 진묘수, 시리아 지역에서 유행한 금박 구슬 등이 나와 백제가 중국·일본은 물론 먼 지역과도 교류했음을 보여 줘요.
  pg: [29, 42]
  mp: [37, 40]
  at: [127.112, 36.462]
  ev: [muryeong]
  note: y 는 무덤에서 나온 지석에 따라 무령왕을 묻은 해(523년 세상을 떠나 525년 안장, 한국민족문화대백과사전). 공주 송산리 고분군 안에 있어요.
- n: 이차돈
  k: 인물
  era: 삼국
  y: 527
  d: 신라 법흥왕 때 불교를 믿은 관리예요. 귀족들의 반대 속에 불교를 위해 목숨을 바쳤고, 그의 순교를 계기로 신라가 불교를 공인했어요.
  x: 법흥왕은 불교로 백성의 사상을 하나로 모으고 왕실의 권위를 높이려 했지만 귀족들의 반대가 거셌어요. 527년 이차돈이 처형될 때 목에서 흰 젖이 솟고 하늘이 어두워지는 신비한 일이 일어났다는 이야기가 전해요. 그의 순교 장면을 새긴 돌기둥(이차돈 순교비)은 9세기 초에 세운 것으로 보며, 지금 국립 경주 박물관에 있어요.
  pg: [45]
  mp: [28, 32]
  ev: [silla-buddhism]
  note: 미래엔 32쪽에 이차돈 순교비 사진이 있어요. 비상은 45쪽 활동(드라마 기획안 예시)에만 나와요.
- n: 상대등
  k: 제도
  era: 삼국
  y: 531
  d: 신라 법흥왕 때 둔 최고 관직이에요. 귀족 회의인 화백 회의를 이끄는 귀족 대표로 수상의 역할을 했고, 법흥왕은 이와 함께 병부를 두어 군사권도 장악했어요.
  x: 법흥왕은 상대등을 두는 한편 율령을 반포하고 관리를 17등급으로 나누어 관복 색을 구분했으며, 불교를 공인하고 '건원'이라는 연호를 쓰는 등 왕 중심의 통치 체제를 다졌어요. 고구려에서 수상 역할을 한 대대로와 비교해 볼 수 있어요. 삼국 통일 뒤에는 왕명을 받드는 집사부와 그 장관인 시중의 권한이 커지면서, 상대등이 이끄는 화백 회의의 힘은 줄었어요.
  pg: [31]
  mp: [28]
  ev: [silla-yullyeong]
  inst: silla-politics
  note: y(531)는 사건 silla-yullyeong 설명을 따랐어요(교과서에는 연도 없음). 비상 찾아보기에는 58쪽도 있으나 58쪽 본문에는 화백 회의만 나와요.
- n: 건원
  k: 제도
  era: 삼국
  y: 536
  d: 신라 법흥왕이 처음 쓴 독자적인 연호예요. 율령 반포와 불교 공인으로 나라의 틀을 다진 신라가 자주성을 드러낸 것이에요.
  x: 미래엔 교과서는 법흥왕이 금관가야까지 병합해 국왕의 위상이 크게 높아지자 건원이라는 연호를 썼다고 설명해요. 연호는 원래 중국 황제가 자신의 통치 이념을 나타내며 쓰던 것이어서, 독자적인 연호를 쓴 것은 중국과 대등하다는 의식을 드러낸 것이에요. 고구려 광개토 대왕의 '영락', 발해 문왕의 '대흥'도 같은 성격의 연호예요.
  pg: [31]
  mp: [28, 31]
  ev: [silla-yullyeong]
  note: y 536 은 events 의 silla-yullyeong 설명을 따랐어요.
- n: 금동 연가 7년명 여래 입상
  k: 문화유산
  era: 삼국
  y: 539
  d: '''연가 7년''이라는 글자가 새겨진 고구려의 금동 불상이에요. 중국 북위의 불상 양식과 비슷하며, 경남 의령에서 발견되었어요.'
  x: 1963년 경남 의령에서 출토되었으며, 높이 16.2cm의 작은 불상으로 몸 뒤의 광배에 불꽃무늬가 새겨져 있어요. 광배 뒷면의 글에는 고구려 평양의 동사라는 절 승려들이 천 개의 불상을 만들어 널리 퍼뜨렸고 이것이 그 가운데 스물아홉 번째라고 적혀 있어요. 고구려에서 만든 불상이 옛 신라·가야 지역에서 나와, 고구려 불교가 주변으로 퍼져 나간 모습을 보여 줘요.
  pg: [37]
  mp: [33]
  at: [128.26, 35.32]
  ap: 1
  note: y 는 명문의 '연가 7년 기미년'을 539년으로 보는 견해(한국민족문화대백과사전). '연가'는 고구려 연호로 추측해요(비상 37쪽). at 은 1963년 출토지 의령(군청 근처로 대략), 지금은 국립 중앙 박물관에 있어요.
- n: 단양 신라 적성비
  k: 문화유산
  era: 삼국
  y: 550
  d: 신라가 고구려 땅이던 단양 적성 지역을 차지한 뒤 세운 비석이에요. 신라를 도운 지역 주민에게 상을 준 내용이 담겨 있어, 진흥왕 때 한강 상류로 나아갔음을 보여 줘요.
  x: 1978년 단양 성재산의 적성 안에서 발견되었어요. 비문에는 이사부·거칠부·무력(김유신의 할아버지) 등 진흥왕의 명을 받은 고관들의 이름이 나오고, 신라에 충성한 적성 사람 야이차의 공을 칭찬하며 앞으로 그처럼 충성하는 사람에게도 같은 상을 주겠다고 밝혔어요. 새로 차지한 땅에 세운 비석이어서, 뒤이어 세운 진흥왕 순수비들의 앞선 형태로 평가돼요.
  pg: [32]
  mp: [29]
  at: [128.321, 36.944]
  ev: [hangang-553, sunsubi]
  note: y 는 대략값(545~550년 무렵 세운 것으로 추정, 정확한 해 모름). 좌표는 한국관광공사 관광 정보(단양군 단성면 하방리).
- n: 백제 금동 대향로
  k: 문화유산
  era: 삼국
  y: 570
  d: 향을 피우던 백제의 금동 향로로, 뛰어난 금속 공예 기술을 보여 줘요. 신선이 사는 산과 상상의 동물, 연꽃 등이 새겨져 도교와 불교 사상이 함께 담겨 있어요.
  x: 1993년 부여 능산리 절터의 공방 터에서 발견되었고, 높이는 약 62cm예요. 용이 몸체를 받치고, 연꽃 봉오리 모양의 몸체 위에 신선이 사는 산을 겹겹이 표현한 뚜껑을 덮었으며, 꼭대기에는 봉황이 앉아 있어요. 뚜껑에는 악기를 연주하는 사람과 낚시하는 사람, 사람 얼굴을 한 동물 등이 새겨져 당시 사람들이 꿈꾼 이상 세계를 짐작하게 해요.
  pg: [30, 36, 38]
  mp: [32]
  at: [126.94, 36.28]
  note: y 는 대략값이에요(사비 시기 작품, 정확한 제작 해 모름 — 확인 필요). at 은 출토지인 부여 능산리 고분군(부여 왕릉원) 서쪽 절터(비상 30쪽). 지금은 국립 부여 박물관에 있어요.
- n: 혜자
  k: 인물
  era: 삼국
  y: 595
  d: 일본에 건너간 고구려의 승려로, 쇼토쿠 태자의 스승이 되었어요. 삼국의 문화가 일본 아스카 문화를 꽃피우는 데 기여했음을 보여 주는 인물이에요.
  x: 595년 일본에 건너가 호코사(법흥사)에 머물렀으며, 같은 해 건너온 백제 승려 혜총과 함께 20년 가까이 쇼토쿠 태자에게 불교 경전과 이론을 가르쳤어요. 615년 고구려로 돌아왔어요. 같은 고구려 사람인 담징은 일본에 종이와 먹 만드는 법을 전했어요.
  pg: [43]
  mp: [39]
  note: y 는 일본에 건너간 해로 알려진 595년(『일본서기』 기록, 한국민족문화대백과사전 — 확인 필요). 교과서에는 연도가 없어요.
- n: 금동 미륵보살 반가 사유상
  a: [미륵보살 반가 사유상, 반가 사유상]
  k: 문화유산
  era: 삼국
  y: 600
  d: 한쪽 다리를 다른 무릎에 얹고 손가락을 뺨에 댄 채 생각에 잠긴 미륵보살을 금동으로 만든 불상이에요. 미륵 신앙의 유행으로 삼국 시대에 많이 만들었고, 일본 고류사 반가 사유상에 영향을 주었어요.
  x: 비상 교과서에 실린 상은 봉우리가 셋인 관을 쓴 것으로, 높이가 93.5cm이며 7세기 전반에 만든 것으로 봐요. 백제에서 만들었는지 신라에서 만들었는지는 학자마다 의견이 갈려요. 일본 교토 고류사의 반가 사유상은 이 상과 생김새가 매우 닮았는데, 나무로 깎아 만들었다는 점이 달라요.
  pg: [37, 43]
  mp: [33, 39]
  note: y 는 대략값(6세기 후반~7세기 전반 작품으로 봄, 확인 필요). 출토지가 알려져 있지 않아 좌표는 넣지 않았어요(국립 중앙 박물관 소장).
- n: 부여 정림사지 5층 석탑
  a: [부여 정림사지 오층 석탑, 정림사지 5층 석탑]
  k: 문화유산
  era: 삼국
  y: 600
  d: 백제가 사비(부여)에 도읍했던 시기에 세운 석탑이에요. 나무로 지은 탑의 모양을 본떠 돌로 쌓았으며, 높이는 약 8.3m예요.
  x: 지붕돌이 얇고 넓으며 네 귀퉁이가 살짝 들려 나무 건물의 처마처럼 보이고, 모서리 기둥은 가운데가 볼록한 배흘림 기법으로 다듬어 목조 건축을 돌로 옮겨 놓은 듯해요. 익산 미륵사지 석탑과 함께 백제 석탑이 목탑을 본떠 시작되었음을 보여 줘요. 1층 몸돌에는 당이 백제를 평정한 공을 기리는 글이 새겨져, 한때 '평제탑'이라고 불리기도 했어요.
  pg: [37]
  mp: [33, 35]
  at: [126.914, 36.279]
  ev: [sabi]
  note: y 는 대략값(사비 시기 538~660 사이, 정확한 해 모름). 높이는 비상 37쪽. 목조 건축 양식을 본뜬 점은 미래엔 33쪽.
- n: 서산 용현리 마애 여래 삼존상
  a: [용현리 마애 여래 삼존상]
  k: 문화유산
  era: 삼국
  y: 600
  d: 충남 서산 가야산 골짜기의 바위 면에 새긴 백제의 불상으로, 가운데 부처와 양옆의 보살로 이루어져 있어요. 부드럽고 친근한 미소 덕분에 '백제의 미소'라고 불려요.
  x: '''마애''는 바위 벽을 깎아 새겼다는 뜻이고 ''여래''는 부처를 말해요. 가운데 서 있는 부처는 높이가 약 2.8m이며, 양옆 보살 가운데 하나를 반가 사유상의 모습으로 새겨 흔히 보는 삼존상과 다른 구성을 보여 줘요. 중국의 불교 문화가 태안반도를 거쳐 백제의 수도 부여로 들어가던 옛 교통로 어귀에 자리 잡고 있어요.'
  pg: [37]
  mp: [33]
  at: [126.605, 36.773]
  note: y 는 대략값(6세기 말~7세기 초 무렵 작품으로 봄, 확인 필요). 좌표는 한국관광공사 관광 정보(서산시 운산면).
- n: 신집
  k: 책·기록
  era: 삼국
  y: 600
  d: 고구려 영양왕 때 초기의 역사서 『유기』를 간추려 펴낸 5권짜리 역사서예요. 중앙 집권 체제를 강화하며 만든 책이지만 지금은 전하지 않아요.
  x: 600년에 태학박사 이문진이 고구려 초기의 역사서인 『유기』 100권을 간추려 편찬했어요. 삼국은 중앙 집권 체제를 강화하면서 역사서를 펴냈는데, 백제는 근초고왕 때 『서기』를, 신라는 진흥왕 때 『국사』를 편찬했어요. 하지만 이 역사서들은 모두 지금 전하지 않아요.
  pg: [38]
  note: y 는 영양왕 11년(600), 태학박사 이문진이 편찬했다는 『삼국사기』 기록(한국민족문화대백과사전). 교과서에는 '영양왕 때'로만 나와요.
- n: 우중문
  k: 인물
  era: 삼국
  y: 612
  d: 고구려를 쳐들어온 수의 장수예요. 30만 별동대를 이끌고 평양성을 노렸지만, 을지문덕의 유인에 지친 채 물러나다 살수에서 크게 졌어요. 을지문덕이 그에게 보낸 시가 유명해요.
  x: 612년 수 양제가 이끈 100만이 넘는 대군이 요동성에서 발이 묶이자, 우중문 등은 따로 뽑은 부대를 이끌고 평양성으로 곧장 내려왔어요. 을지문덕은 항복하는 척하며 수의 군대 사정을 살폈고, 싸울 때마다 일부러 져 주며 적을 깊숙이 끌어들였어요. 기록에 따르면 살수에서 크게 진 뒤 살아서 돌아간 수의 군사는 2,700명뿐이었다고 해요.
  pg: [49]
  mp: [46]
  note: 살수 대첩은 wars/korea.yaml sui-612.
- n: 을지문덕
  k: 인물
  era: 삼국
  y: 612
  d: 고구려의 장군이에요. 612년 지친 수의 별동대를 평양 가까이 끌어들인 뒤, 물러나는 적을 살수에서 크게 무찔렀어요(살수 대첩).
  x: 을지문덕은 우중문에게 '공이 이미 높으니 만족할 줄 알고 그만두라'는 뜻의 시를 보내 군대를 물리라고 했어요. 지친 수의 군대가 돌아가는 길에 살수(지금의 청천강)를 절반쯤 건넜을 때, 고구려군이 뒤에서 들이쳐 크게 이겼어요. 이처럼 무리하게 고구려를 치다 힘이 빠진 수는 곳곳에서 반란이 일어나 618년 멸망했어요.
  pg: [49, 72]
  mp: [46]
  note: 살수 대첩은 wars/korea.yaml sui-612.
- n: 임신서기석
  k: 문화유산
  era: 삼국
  y: 612
  d: 신라의 두 젊은이가 3년 동안 유교 경전을 차례로 공부하고 나라에 충성하겠다고 맹세한 내용을 새긴 돌이에요. 신라에서도 유학을 공부했음을 보여 줘요.
  x: 돌에는 임신년 6월 16일에 두 사람이 함께 맹세하며 『시경』·『상서』·『예기』·『춘추전』을 차례로 공부하겠다고 다짐한 내용이 새겨져 있어요. 고구려의 태학과 경당, 백제의 오경박사와 함께 삼국 시대의 유학 교육을 보여 주는 자료예요. 유학은 한자와 함께 전해져 지배층의 기본 소양이 되고 점차 나라를 다스리는 중요한 사상으로 자리 잡았어요.
  pg: [38]
  mp: [34]
  at: [129.2, 35.86]
  ap: 1
  note: 새긴 '임신년'을 552년 또는 612년으로 봐요(확인 필요, 대표 연도로 612). at 은 경주 현곡면 금장리 일대 출토지로 대략이에요. 국립 경주 박물관 소장.
- n: 경주 배동 석조 여래 삼존 입상
  k: 문화유산
  era: 삼국
  y: 620
  d: 경주 남산 서쪽 기슭에 서 있는 신라의 돌부처 세 분이에요. 어린아이처럼 순박하게 웃는 얼굴로 부처의 자비로움을 나타냈어요.
  x: 가운데 부처와 양옆의 보살 세 분으로 이루어진 삼존상이에요. 비상 교과서는 고구려의 금동 연가 7년명 여래 입상, 백제의 서산 용현리 마애 여래 삼존상과 나란히 '삼국의 불상'으로 소개하는데, 특히 서산 마애 삼존상과 함께 친근한 미소로 이름난 불상이에요.
  pg: [37]
  mp: [33]
  at: [129.211, 35.802]
  note: y 는 대략값이에요(7세기 무렵 신라 작품으로 봄, 정확한 해 모름). 1923년 남산 기슭에 흩어져 있던 것을 지금 자리(경주 배동)에 모아 세웠어요. 좌표는 한국관광공사 관광 정보(배동 산 65-1).
- n: 백제 산수무늬 벽돌
  a: [산수무늬 벽돌]
  k: 문화유산
  era: 삼국
  y: 620
  d: 산과 나무, 구름 같은 자연 풍경을 새긴 백제의 무늬 벽돌이에요. 자연과 어울려 살고자 한 이상이 담겨 있고, 도교 사상의 영향을 보여 줘요.
  x: 1937년 부여 규암면 외리의 옛 절터에서 연꽃·봉황·용·도깨비 등을 새긴 여러 무늬 벽돌과 함께 발견되었어요. 한 변이 약 29cm인 네모난 벽돌로, 네 모서리에 홈이 있어 여러 장을 이어 깔 수 있었어요. 겹겹이 이어진 산과 바위, 물, 구름을 부드럽게 표현해 당시 백제 그림의 모습을 짐작하게 해 주는 자료예요.
  pg: [38]
  mp: [32]
  at: [126.91, 36.28]
  ap: 1
  note: y 는 대략값(사비 시기 7세기 무렵 — 확인 필요). 부여 규암면 외리 절터에서 나왔다고 알려져 있으나 정확한 좌표를 확인하지 못해 부여(사비) 시내로 대신했어요. 국립 중앙 박물관 소장(비상 38쪽).
- n: 경주 분황사 모전 석탑
  k: 문화유산
  era: 삼국
  y: 634
  d: 돌을 벽돌 모양으로 다듬어 쌓은 신라의 석탑이에요. 원래 7층이나 9층이었다고 보지만 지금은 3층만 남아 있어요.
  x: 선덕 여왕 때인 634년 분황사를 세우면서 함께 쌓은 것으로 보며, 높이는 약 9.3m예요. 1층 몸돌 네 면에 문을 내고 문 양옆에 인왕상을 새겼으며, 기단 네 모서리에는 돌사자를 한 마리씩 두었어요. 벽돌로 쌓은 탑을 본떠 돌로 만들었다는 뜻에서 '모전' 석탑이라고 불러요.
  pg: [37]
  mp: [33]
  at: [129.234, 35.837]
  note: y 는 분황사를 세운 선덕 여왕 3년(634)으로, 탑도 이때 세운 것으로 봐요(한국민족문화대백과사전). 교과서에는 연도가 없어요.
- n: 익산 미륵사지 석탑
  a: [미륵사지 석탑]
  k: 문화유산
  era: 삼국
  y: 639
  d: 백제 무왕 때 지은 미륵사 터에 남은 석탑으로, 우리나라 석탑 가운데 가장 크고 오래되었어요. 목탑 양식을 본떠 돌로 쌓았고, 약 19년의 보수 끝에 6층까지 복원했어요.
  x: 미륵사는 가운데 목탑을 두고 동쪽과 서쪽에 석탑을 세운 큰 절이었는데, 지금 남은 이 탑은 그중 서쪽 탑이에요. 1915년 무너진 부분을 시멘트로 덧발라 보수했던 것을 2001년부터 해체해 다시 쌓았어요. 해체 중 나온 금제 사리 봉안기에는 639년 좌평 사택적덕의 딸인 왕비가 절을 세웠다고 적혀 있어, 신라 선화 공주가 세웠다는 『삼국유사』의 이야기와 달라 큰 관심을 모았어요.
  pg: [37, 39]
  mp: [33]
  at: [127.031, 36.012]
  ev: [mireuksa]
  note: y 는 석탑에서 나온 금제 사리 봉안기의 639년(무왕 40, 비상 39쪽). 사리 봉안기에는 미륵사를 세운 왕비가 좌평 사택적덕의 딸이라고 적혀 있어요.
- n: 경주 첨성대
  a: [첨성대]
  k: 문화유산
  era: 삼국
  y: 640
  d: 7세기 신라가 돌을 쌓아 만든 건축물로, 하늘을 관측하던 시설로 추정해요. 천체 관측을 중요하게 여긴 삼국 시대 천문학의 발달을 보여 줘요.
  x: 『삼국유사』에 선덕 여왕 때 돌을 다듬어 쌓았다는 기록이 있으며, 높이는 약 9.5m예요. 술병 모양으로 27단의 돌을 쌓아 올리고 중간에 네모난 창을 냈으며, 꼭대기에는 우물 정(井) 자 모양의 돌을 얹었어요. 삼국 시대에는 천체 현상이 왕의 권위와 연결된다고 여겼고 농사에도 천체 관측이 중요했는데, 첨성대를 제단으로 보는 등 쓰임새에 대해서는 여러 견해가 있어요.
  pg: [38]
  mp: [34]
  at: [129.219, 35.835]
  ev: [cheomseongdae]
  note: 비상은 '7세기에 건립'이라고만 적었어요. 선덕 여왕 때(632~647) 세웠다고 전하며 정확한 해는 기록마다 달라 사건 cheomseongdae 와 같은 대략값 640 을 썼어요.
- n: 계백
  k: 인물
  era: 삼국
  y: 660
  d: 백제의 귀족이자 장군이에요. 660년 5천여 명의 결사대를 이끌고 황산벌에서 김유신의 신라군과 맞서 여러 번 이겼지만 끝내 패했어요.
  x: 2품 관등인 달솔이었던 계백은 나당 연합군이 쳐들어오자, 가족이 적에게 욕을 당하지 않도록 먼저 목숨을 거두고 싸움터로 나갔다고 전해요. 5만여 명의 신라군을 상대로 네 번 싸워 모두 이겼지만, 반굴·관창 같은 젊은 화랑들의 희생으로 사기가 오른 신라군의 총공격을 막지 못하고 전사했어요. 그 뒤 나당 연합군이 사비성을 함락하고 웅진성으로 피했던 의자왕이 항복하면서 백제는 멸망했어요.
  pg: [51]
  mp: [48]
  note: 전투는 wars/korea.yaml baekje-660 '황산벌 전투'.
- n: 김유신
  k: 인물
  era: 삼국
  y: 660
  d: 금관가야 왕족 출신의 신라 장군이에요. 김춘추가 왕(무열왕)이 되도록 도왔고, 660년 신라군을 이끌고 황산벌에서 계백의 결사대를 물리쳐 백제 멸망에 앞장섰어요.
  x: 증조할아버지는 532년 신라에 항복한 금관가야의 왕 구해왕이고, 누이가 김춘추와 혼인해 문무왕을 낳으면서 두 집안이 굳게 손을 잡았어요. 668년 고구려를 칠 때는 나이가 많아 직접 나서지 못했지만 신라군의 최고 지휘관으로 임명되어 나라 안을 맡았고, 나당 전쟁 때에도 원로로서 문무왕에게 조언했어요. 673년 세상을 떠났고, 뒤에 '흥무대왕'으로 높여졌어요.
  pg: [51, 57]
  mp: [48]
  ev: [muyeol, unification]
  note: 황산벌 전투는 wars/korea.yaml baekje-660.
- n: 나당 연합군
  k: 개념
  era: 삼국
  y: 660
  d: 나당 동맹을 맺은 신라와 당이 함께 꾸린 군대예요. 660년 백제를, 668년 고구려를 무너뜨렸지만 그 뒤 당이 한반도 전체를 차지하려 하자 두 나라는 전쟁을 벌였어요.
  x: 642년 백제에게 대야성 등 40여 개 성을 빼앗긴 신라는 고구려와 왜에 도움을 청했다가 실패하자, 김춘추가 당으로 건너가 648년 나당 동맹을 맺었어요. 660년 소정방이 이끈 당군은 금강 하구로 상륙하고 김유신의 신라군은 황산벌을 거쳐 사비성으로 향했어요. 고구려는 수·당과의 오랜 전쟁으로 힘이 약해진 데다 연개소문이 죽은 뒤 아들들이 권력을 다투면서 668년 평양성이 함락되었어요.
  pg: [51, 52]
  mp: [48]
  ev: [najang-alliance, unification]
- n: 도침
  k: 인물
  era: 삼국
  y: 660
  d: 백제가 멸망한 뒤 복신과 함께 부흥 운동을 이끈 인물이에요. 왜에 있던 왕자 부여풍을 왕으로 맞아 주류성을 근거지로 나당 연합군에 맞섰어요.
  x: 도침은 승려였으며 스스로 영군장군이라 일컬었고, 의자왕의 사촌 형제인 복신과 함께 한때 사비성을 포위할 만큼 세력을 떨쳤어요. 그러나 부흥군 지도자들 사이에 다툼이 생겨 도침은 복신에게 죽임을 당했고, 이어 부여풍이 복신을 죽이면서 부흥군은 크게 흔들렸어요. 663년 백제를 도우러 온 왜군마저 백강 전투에서 패하면서 백제 부흥 운동은 실패로 끝났어요.
  pg: [52, 73]
  note: 부흥 운동은 wars/korea.yaml baekje-revival. 미래엔에는 이름이 나오지 않아요.
- n: 웅진도독부
  a: [웅진 도독부]
  k: 제도
  era: 삼국
  y: 660
  d: 당이 백제를 멸망시킨 뒤 백제의 옛 땅을 다스리려고 둔 기구예요. 당은 고구려 땅에 안동도호부, 신라에 계림도독부까지 두어 한반도 전체를 지배하려 했고, 신라는 이에 맞서 싸웠어요.
  x: 당은 처음에 백제 땅에 다섯 개의 도독부를 두려 했지만, 부흥 운동 때문에 실제로는 웅진도독부만 제 구실을 했어요. 665년에는 의자왕의 태자였던 부여융을 웅진도독으로 삼고, 신라 문무왕과 맹약을 맺게 해 웅진을 두 나라의 경계로 삼으려 했어요. 신라가 671년 사비 지역을 차지해 소부리주를 두자 웅진도독부는 힘을 잃었고, 676년 요동으로 옮겨 가면서 백제 땅에서 물러났어요.
  pg: [52]
  mp: [49]
  ev: [unification]
  note: 비상 찾아보기에는 29쪽도 적혀 있지만 29쪽에는 '웅진'만 나와요. y 는 백제 멸망 해(660).
- n: 흑치상지
  k: 인물
  era: 삼국
  y: 660
  d: 백제가 멸망한 뒤 임존성에서 군사를 일으켜 부흥 운동을 벌인 백제의 장수예요. 부흥군은 한때 200여 개의 성을 되찾을 만큼 세력을 떨쳤어요.
  x: 2품 관등인 달솔이었던 흑치상지는 사비성이 함락된 뒤 당군이 의자왕을 사로잡고 약탈을 일삼자 임존성(지금의 충남 예산)을 근거지로 일어섰어요. 하지만 663년 부흥 운동의 본거지인 주류성이 함락되자 당에 항복했고, 이후 당의 장수가 되어 토번·돌궐과 싸우며 공을 세웠어요. 백제가 망한 뒤 많은 유민이 일본으로 건너갔는데, 흑치상지처럼 당에서 활동한 사람도 있었어요.
  pg: [52]
  note: 부흥 운동은 wars/korea.yaml baekje-revival '임존성 항전'. 미래엔에는 이름이 나오지 않아요.
- n: 계림도독부
  a: [계림 대도독부]
  k: 제도
  era: 삼국
  y: 663
  d: 당이 신라 금성(경주)에 둔 기구예요. 옛 백제 땅의 웅진도독부, 옛 고구려 땅의 안동도호부와 함께 한반도 전체를 지배하려던 당의 속셈을 보여 주고, 신라는 이에 맞서 나당 전쟁을 벌였어요.
  x: 당은 663년 신라를 계림대도독부로 삼고 문무왕을 계림주대도독으로 임명했어요. 함께 싸운 동맹국인 신라마저 당의 지배 아래 두려는 뜻이 담겨 있었어요. 신라는 고구려·백제 유민과 힘을 합쳐 당과 싸웠고, 676년 기벌포 싸움에서 이겨 당 세력을 몰아냈어요.
  pg: [52]
  mp: [49, 53]
  ev: [unification]
  note: 설치 연도 663년(문무왕 3)은 한국민족문화대백과사전 '계림대도독부'. 교과서에는 연도가 없어요.
- n: 검모잠
  k: 인물
  era: 삼국
  y: 670
  d: 고구려가 멸망한 뒤 부흥 운동을 이끈 인물이에요. 보장왕의 아들 안승을 왕으로 받들고 한성(지금의 황해도 재령 부근)을 근거지로 당에 맞섰지만, 지도층이 갈라지면서 안승에게 죽임을 당했어요.
  x: 고구려는 668년 평양성이 함락되며 멸망했지만, 유민들은 곳곳에서 당의 지배에 맞서 나라를 되살리려 했어요. 신라는 당을 견제하려고 고구려 부흥 운동을 도왔고, 검모잠이 죽은 뒤 신라로 망명한 안승을 보덕국의 왕으로 삼아 고구려 유민을 끌어안았어요. 미래엔 교과서는 나당 전쟁으로 당의 지배력이 흔들린 것이 뒤에 고구려 유민이 발해를 세우는 데에도 영향을 주었다고 설명해요.
  pg: [52]
  note: 한성은 지금의 황해도 재령 부근이고 670년에 안승을 왕으로 세웠어요(한국민족문화대백과사전 '안승'). 미래엔에는 이름이 나오지 않아요. 싸움 위치는 wars/korea.yaml silla-tang '고구려 부흥 운동'.
- n: 고연무
  k: 인물
  era: 삼국
  y: 670
  d: 고구려가 멸망한 뒤 부흥 운동에 나선 장수예요. 요동 지방에서 당군과 싸우며 나라를 되살리려 했어요.
  x: 670년 고연무는 신라 장수 설오유와 함께 압록강을 건너 요동으로 나아가 당군과 싸웠어요. 신라는 당과의 전쟁을 앞두고 당을 견제하려고 고구려 부흥 운동을 지원했는데, 고연무와 설오유의 공동 작전이 그 대표적인 예예요.
  pg: [52]
  note: 670년 신라 설오유와 함께 압록강을 건너 오골성 쪽으로 나아가 싸웠어요(한국민족문화대백과사전 '고연무'). 미래엔에는 이름이 나오지 않아요.
- n: 안승
  k: 인물
  era: 삼국
  y: 670
  d: 고구려 보장왕의 아들(외손자라는 기록도 있어요)로, 고구려가 멸망한 뒤 검모잠이 왕으로 받들었어요. 검모잠을 죽이고 신라로 망명했고, 신라는 그를 보덕국의 왕으로 삼아 고구려 유민을 끌어안았어요.
  x: 신라는 670년 망명해 온 안승을 고구려왕으로 삼았고, 674년에는 금마저(지금의 전북 익산)에서 보덕국 왕으로 봉했어요. 이는 고구려 유민을 신라 편으로 끌어들여, 나당 전쟁에서 고구려·백제 유민과 힘을 합쳐 당을 물리치는 데 도움이 되었어요.
  pg: [52]
  note: 670년 검모잠이 왕으로 세웠고, 674년(문무왕 14) 금마저(익산)에서 보덕국 왕으로 봉해졌어요(한국민족문화대백과사전 '안승'). 미래엔에는 이름이 나오지 않아요.
- n: 매소성 싸움
  a: [매소성 전투]
  k: 사건
  era: 삼국
  y: 675
  d: 675년 신라군이 매소성에 머물던 당의 대군을 물리친 싸움이에요. 이 승리로 나당 전쟁의 흐름이 신라 쪽으로 기울었고, 이듬해 기벌포 싸움으로 이어졌어요.
  x: 『삼국사기』에는 이근행이 이끄는 당군 20만 명이 매소성에 머물렀다고 적혀 있지만, 중국 기록을 참고해 실제로는 그보다 훨씬 적었다고 보기도 해요. 신라군의 공격을 받은 당군은 말 3만여 필과 많은 무기를 버리고 북쪽으로 물러났어요. 당시 당은 서쪽에서 세력을 키운 토번과도 맞서고 있어 한반도에 힘을 모으기 어려웠어요.
  pg: [52, 53, 73]
  mp: [49, 50]
  ev: [unification]
  note: 미래엔 표기는 '매소성 전투'. 매소성 위치는 학설이 갈려 at 은 넣지 않았어요(wars/korea.yaml silla-tang 에 대략 위치).
- n: 기벌포 싸움
  a: [기벌포 전투]
  k: 사건
  era: 삼국
  y: 676
  d: 676년 신라 수군이 금강 하구의 기벌포에서 당의 수군을 크게 무찌른 싸움이에요. 이 승리로 신라는 대동강 이남에서 당 세력을 몰아내고 삼국 통일을 이루었어요.
  x: 이때 신라 수군이 물리친 당군은 설인귀가 이끈 군대였어요. 기벌포 승리로 서해의 바닷길을 장악한 신라는 당군의 상륙을 막았고, 당은 안동도호부를 요동으로 옮기며 한반도에서 물러났어요. 신라의 삼국 통일은 당의 힘을 빌렸고 고구려 옛 땅 대부분을 잃었다는 한계가 있지만, 당의 침략을 물리친 우리 민족 최초의 통일이라는 의의가 있어요.
  pg: [52, 53, 73]
  mp: [49, 50]
  ev: [unification]
  note: 미래엔 표기는 '기벌포 전투'. 싸움 위치는 wars/korea.yaml silla-tang '기벌포 전투'에 있어 at 은 넣지 않았어요.
- n: 고분
  k: 유적·유물
  era: 삼국
  d: 흙이나 돌을 쌓아 크게 만든 옛 무덤이에요. 삼국은 나라마다 독특한 모양의 고분을 만들었고, 그 구조와 껴묻거리·벽화를 통해 당시 사람들의 신앙과 생활을 알 수 있어요.
  x: 고구려는 돌무지무덤에서 점차 굴식 돌방무덤으로, 백제는 한성 시기의 계단식 돌무지무덤에서 웅진 시기 이후 굴식 돌방무덤과 벽돌무덤으로 바뀌었어요. 신라는 돌무지덧널무덤을 쓰다가 6세기 말 무렵부터 굴식 돌방무덤으로 옮겨 갔고, 가야는 땅을 파고 그 둘레를 돌로 쌓아 만든 돌덧널무덤을 주로 썼어요. 주인을 모르면 특징을 따서 '총'(무용총, 천마총), 왕과 왕비의 무덤은 '능', 그 밖의 무덤은 '묘'라고 불러요.
  pg: [40]
  mp: [20, 21, 36, 37, 65]
  note: 주인을 모르면 특징을 따 '총'(무용총, 천마총), 왕과 왕비의 무덤은 '능', 그 밖의 무덤은 '묘'라고 해요(미래엔 36쪽). 미래엔 65쪽은 발해의 고분.
- n: 고분 벽화
  k: 예술
  era: 삼국
  d: 무덤 안 돌방의 벽과 천장에 그린 그림이에요. 고구려 벽화는 처음엔 생활 모습을 주로 그리다 불교 요소가 더해졌고, 뒤로 갈수록 도교의 사신도를 많이 그렸어요.
  x: 안악 3호분의 행렬도와 부엌, 무용총의 사냥 장면, 각저총의 씨름하는 서역인 등에서 고구려 사람들의 생활과 대외 교류를 생생하게 볼 수 있어요. 강서대묘의 현무 같은 사신도는 도교의 영향을 받은 것이고, 덕흥리 고분에는 북두칠성 같은 별자리도 그려져 있어요. 백제 부여 능산리 1호분 천장에는 불교를 상징하는 연꽃무늬가 있고, 고구려 수산리 고분 벽화는 일본 다카마쓰 고분 벽화에 영향을 준 것으로 보여요.
  pg: [38, 40, 41]
  mp: [34, 36]
- n: 관등제
  a: [관등]
  k: 제도
  era: 삼국
  d: 관리의 등급(관등)을 정해 서열을 나눈 제도예요. 백제는 16관등, 고구려는 10여 관등, 신라는 17관등을 두었고, 백제와 신라는 관등에 따라 관복의 색을 달리했어요.
  x: 삼국은 왕권을 강화하면서 각 지역의 군장들을 중앙 귀족으로 편입하고 관등으로 서열을 매겨, 중앙 집권 국가의 틀을 갖추었어요. 신라에서는 관등이 골품제와 맞물려 6두품은 6등급 아찬, 5두품은 10등급 대나마까지만 오를 수 있었고, 관등에 따라 자색·비색·청색·황색 관복을 입었어요. 고구려에서는 수상인 대대로가 정치를 이끌었어요.
  pg: [25, 28, 31, 40]
  mp: [21, 27]
  ev: [goi-baekje, silla-yullyeong]
  inst: baekje-politics
  note: 비상은 '관리의 등급'(고구려 10여 등급, 신라 17등급)으로 설명하고, 백제 16관등은 미래엔 21·27쪽에만 나와요.
- n: 굴식 돌방무덤
  k: 유적·유물
  era: 삼국
  d: 돌로 시신을 두는 방(널방)을 만들고 바깥으로 통하는 길을 낸 뒤 흙을 덮은 무덤이에요. 껴묻거리는 대부분 도굴됐지만 벽과 천장에 벽화를 그릴 수 있었어요.
  x: 비상 교과서 그림의 고구려 무용총처럼 바깥에서 널길을 따라 들어가면 앞방과 이음길을 지나 시신을 둔 널방에 이르는 구조예요. 고구려는 초기 돌무지무덤에서 점차 이런 무덤으로 바꾸었고, 백제는 웅진 시기부터, 신라는 6세기 말 이후에 주로 만들었어요. 발해의 정혜 공주 묘도 모줄임천장을 갖춘 굴식 돌방무덤이어서 고구려 문화를 이었음을 보여 줘요.
  pg: [40]
  mp: [36, 37]
  note: 고구려는 돌무지무덤에서 점차 굴식 돌방무덤으로, 백제는 웅진 시기부터, 신라는 6세기 말 이후 주로 만들었어요(비상 40쪽). 예 무용총(비상 40쪽 그림).
- n: 껴묻거리
  k: 유적·유물
  era: 삼국
  d: 무덤에 시신과 함께 묻은 물건이에요. 죽은 뒤에도 영혼이 다른 세상에서 산다고 믿어 넣었고, 이를 통해 당시 사람들의 생활과 생각을 알 수 있어요.
  x: 신라의 돌무지덧널무덤은 도굴이 어려워 금관·금귀걸이·금제 허리띠 같은 화려한 껴묻거리가 많이 남았는데, 5세기에서 6세기 전반은 이런 황금 문화가 가장 꽃핀 때였어요. 천마총의 천마도와 가야의 오리 모양 토기에는 죽은 사람의 영혼을 하늘로 이끈다는 믿음이 담겨 있어요. 미래엔 교과서에 실린 토우 장식 항아리처럼 흙으로 빚은 작은 사람·동물 장식에서도 당시 신앙을 엿볼 수 있어요.
  pg: [40]
  mp: [36, 37]
- n: 도교
  k: 사상·종교
  era: 삼국
  d: 산천을 숭배하고 늙지 않고 오래 사는 것을 바라는 신선 사상과 어우러진 종교예요. 삼국 시대 중국에서 들어와 귀족에게 환영받았고, 고구려 사신도와 백제 금동 대향로에 그 영향이 보여요.
  x: 미래엔 교과서는 도교를 중국의 신선 사상과 노장사상 등이 결합해 이루어진 종교로 설명해요. 고구려 고분의 사신도는 동·서·남·북을 지키는 네 상상의 동물을 그린 것으로, 그중 현무는 북쪽을 지켜요. 고려 때에는 왕실과 지배층에서 유행해 하늘에 제사 지내는 도교 행사가 자주 열렸고, 조선 중종 때 조광조는 도교 행사를 맡던 소격서를 없애자고 주장했어요.
  pg: [38, 104]
  mp: [32, 94, 120, 160]
  note: 비상 104쪽·미래엔 94쪽은 고려의 도교, 미래엔 120쪽은 조선 중종 때 소격서 폐지, 160쪽은 동학에 나와요.
- n: 돌무지덧널무덤
  k: 유적·유물
  era: 삼국
  d: 나무 덧널 안에 시신과 껴묻거리를 넣고 그 위에 돌을 쌓은 뒤 흙으로 크게 덮은 신라의 무덤이에요. 벽화는 없지만 도굴이 어려워 금관 같은 껴묻거리가 많이 남았어요.
  x: 경주 대릉원 일대의 천마총과 황남 대총이 대표적인데, 남쪽 무덤에 북쪽 무덤을 덧붙여 만든 황남 대총은 높이 23m, 지름 80m에 이르고 북쪽 무덤에서 금관과 금제 허리띠가 나왔어요. 주로 신라가 마립간이라는 왕호를 쓰던 무렵 왕과 왕족의 무덤으로 보며, 6세기 말 이후에는 굴식 돌방무덤으로 바뀌었어요.
  pg: [40]
  mp: [37]
  note: 천마총, 황남 대총이 대표적이에요(비상 40쪽, 미래엔 37쪽).
- n: 돌무지무덤
  k: 유적·유물
  era: 삼국
  d: 돌을 쌓아 만든 무덤으로, 고구려가 초기에 많이 만들었어요. 백제 초기의 서울 석촌동 고분도 계단식 돌무지무덤이어서 백제를 세운 세력이 고구려 계통임을 보여 줘요.
  x: 고구려의 돌무지무덤은 처음에는 다듬지 않은 돌을 쌓았지만 4~5세기에는 계단식으로 발전했고, 잘 다듬은 돌을 7층으로 쌓은 장군총이 대표적이에요. 중국 지린성의 산성하 고분군에는 고구려 초기의 돌무지무덤 500여 기가 모여 있어요. 백제 석촌동 고분군에는 안팎을 모두 돌로 쌓은 고구려식 무덤과, 안을 흙으로 채우고 겉에 돌을 쌓은 무덤이 함께 남아 있어요.
  pg: [28, 40]
  mp: [36, 37]
  note: 장군총이 대표적이에요(비상 40쪽 그림).
- n: 목간
  k: 책·기록
  era: 삼국
  d: 나무 조각에 글을 적은 문서예요. 삼국 시대부터 행정 문서 등에 쓰여 한자를 널리 썼음을 알려 주고, 부여에서 나온 구구단 목간으로 당시 수학 지식도 엿볼 수 있어요.
  x: 부여에서 나온 구구단 목간에는 '9×9=81'처럼 곱셈을 뜻하는 숫자 조합이 적혀 있어요. 일본에서 나온 '발해사'·'교역' 글자가 쓰인 목간과, 발해에 보낸 사신을 '견고려사'라고 적은 목간은 발해와 일본의 교류, 그리고 일본이 발해를 고구려를 이은 나라로 여겼음을 보여 줘요. 고려 때 신안 앞바다에 가라앉은 무역선(신안선)에서도 항해 시기와 목적지를 적은 화물표 목간이 나왔어요.
  pg: [71]
  mp: [34, 52, 67, 99]
  note: 미래엔 52·67쪽과 비상 71쪽은 발해와 일본의 교류를 보여 주는 목간, 미래엔 99쪽은 고려 때 신안선 목간이에요.
- n: 미륵 신앙
  k: 사상·종교
  era: 삼국
  d: 미래에 미륵불이 나타나 백성을 구하고 이상 세계를 만든다고 믿는 신앙이에요. 삼국 시대에 크게 유행해 미륵보살 반가 사유상을 많이 만들었고, 백제 미륵사 창건과 신라 화랑도에도 영향을 주었어요.
  x: 고려 때에는 지방에서 논산 관촉사 석조 미륵보살 입상 같은 미륵 불상이 만들어졌어요. 조선 후기에는 사회 불안이 이어지자 『정감록』 같은 예언 사상과 함께, 미륵이 나타나 민중을 구제한다는 미륵 신앙이 백성 사이에 널리 퍼졌어요.
  pg: [37]
  mp: [33, 160]
  ev: [mireuksa]
  note: 미래엔 160쪽은 조선 후기 백성 사이에 퍼진 미륵 신앙(예언 사상)이에요.
- n: 벽돌무덤
  k: 유적·유물
  era: 삼국
  d: 벽돌을 쌓아 시신을 두는 방을 만든 무덤으로, 중국의 영향을 받았어요. 백제 무령왕릉이 대표적이고, 낙랑에도 중국식 벽돌무덤이 있었어요.
  x: 무령왕릉은 중국 남조의 무덤 양식을 받아들여 벽돌로 방을 쌓고, 그 안에 왕과 왕비의 목관과 많은 껴묻거리를 두었어요. 낙랑의 벽돌무덤인 평양 남사리 154호분에서 보듯 중국의 문화는 낙랑을 거쳐 한반도에 들어오기도 했어요. 발해의 정효 공주 묘도 당의 영향을 받아 벽돌로 쌓았지만, 천장은 고구려 방식을 이어 발해 문화의 특징을 보여 줘요.
  pg: [29, 40]
  mp: [14, 37]
  ev: [muryeong]
- n: 서기
  k: 책·기록
  era: 삼국
  d: 백제 근초고왕 때 편찬한 역사서예요. 삼국은 중앙 집권 체제를 강화하면서 역사서를 펴냈지만, 『서기』는 지금 전하지 않아요.
  x: 『삼국사기』에는 근초고왕 때 박사 고흥이 『서기』를 지었다는 기록이 있어요. 근초고왕은 마한의 남은 세력을 복속하고 고구려 평양성을 공격해 고국원왕을 전사시키는 등 백제의 전성기를 이끈 왕이에요. 고구려는 영양왕 때 『신집』을, 신라는 진흥왕 때 『국사』를 펴냈어요.
  pg: [38]
  ev: [geunchogo]
  note: 『삼국사기』 근초고왕 30년(375) 기사에 박사 고흥이 『서기』를 지었다는 기록이 있지만 편찬한 해가 확실하지 않아 y 는 넣지 않았어요.
- n: 스에키
  k: 유적·유물
  era: 삼국
  d: 가야 토기의 영향을 받아 만든 일본의 토기예요. 가야가 일본과 교류하며 토기 만드는 기술을 전해 주었음을 보여 줘요.
  x: 비상 교과서는 가야 토기와 일본 교토 국립 박물관의 스에키를 나란히 보여 주는데, 굽다리에 구멍을 뚫은 모양이 서로 많이 닮았어요. 가야는 질 좋은 철과 철로 만든 갑옷도 일본에 전했고, 이렇게 전해진 삼국과 가야의 문화는 일본 아스카 문화가 성립하는 데 이바지했어요. 반대로 김해 대성동 고분군에서는 일본에서 건너온 물건도 나와 교류가 서로 오갔음을 알 수 있어요.
  pg: [43]
  note: 미래엔 39쪽은 이름 없이 가야가 토기 제작 기술을 일본에 전했다고 설명해요.
- n: 아직기
  k: 인물
  era: 삼국
  d: 일본에 건너가 활약한 백제 사람이에요. 왕인과 함께 일본에 한문과 『논어』, 『천자문』 같은 유학 지식을 전해 일본 고대 문화 발전에 영향을 주었어요.
  x: 백제는 삼국 가운데 일본과 가장 활발히 교류해 불교를 전하고, 오경박사·의박사·역박사와 화가·공예 기술자들을 보냈어요. 이렇게 전해진 백제의 학문과 기술은 일본 아스카 문화가 꽃피는 데 큰 영향을 주었어요.
  pg: [43]
  mp: [39]
  note: 일본에 건너간 해는 교과서에 없고 기록마다 달라 y 를 넣지 않았어요(확인 필요).
- n: 오경박사
  k: 제도
  era: 삼국
  d: 다섯 가지 유교 경전에 능통해 유교 교육을 맡은 백제의 관리예요. 일본에도 건너가 유학을 전하며 일본 고대 문화 발전에 영향을 주었어요.
  x: 백제에는 오경박사 말고도 의학을 가르친 의박사, 천문과 역법을 맡은 역박사 등이 있어 분야별로 학문과 기술을 가르쳤어요. 고구려는 수도에 태학, 지방에 경당을 세워 유학을 가르쳤고, 신라는 임신서기석에서 보듯 젊은이들이 유교 경전을 공부했어요. 미래엔 교과서에는 신라에 오경박사가 있었다는 틀린 문장을 고치는 문제가 나오니, 오경박사는 백제라는 점을 기억해 둬요.
  pg: [38, 43]
  mp: [34]
- n: 유학
  a: [유교]
  k: 사상·종교
  era: 삼국
  d: 공자의 가르침을 바탕으로 한 학문으로, 삼국 시대에 한자와 함께 들어왔어요. 고구려의 태학과 경당, 백제의 오경박사, 신라의 임신서기석에서 보듯 지배층의 기본 교양이자 나라를 다스리는 사상이 되었어요.
  x: 통일 신라는 신문왕 때 국학을 세워 유학을 가르치고, 원성왕 때 유교 경전을 얼마나 이해했는지 시험해 관리 선발에 참고하는 독서삼품과를 실시했어요. 이 시기에 강수·설총·최치원 같은 6두품 출신 유학자가 활약했고, 발해도 주자감을 두어 유학을 가르쳤어요. 고려는 과거제를 실시해 유교적 소양을 갖춘 인재를 관리로 뽑았어요.
  pg: [38]
  mp: [34, 62, 91, 95, 116]
  ev: [goguryeo-buddhism]
  note: 미래엔 62쪽은 통일 신라, 91·95쪽은 고려, 116쪽은 조선의 유학이에요. '공자의 가르침'은 교과서 밖 일반 설명이에요.
- n: 정사암
  a: [정사암 회의]
  k: 제도
  era: 삼국
  d: 백제의 귀족 회의예요. 왕족인 부여씨와 여러 귀족 세력이 함께 정치를 이끌던 백제에서, 왕과 귀족들이 모여 재상을 뽑고 나라의 중요한 일을 의논했어요.
  x: 『삼국유사』에는 백제가 재상을 뽑을 때 후보 3~4명의 이름을 봉해 호암사의 바위 위에 올려 두었다가, 얼마 뒤 열어 이름 위에 도장 자국 같은 표시가 있는 사람을 재상으로 삼았다는 이야기가 전해요. '정사암'이라는 이름도 나랏일을 의논하던 바위라는 데서 비롯되었다고 봐요. 고구려의 제가 회의, 신라의 화백 회의와 함께 삼국 정치에서 귀족들의 힘이 컸음을 보여 줘요.
  pg: [28]
  inst: baekje-politics
  note: 비상 28쪽 본문은 이름 없이 '회의체'로만 설명하고, 찾아보기에 '정사암'으로 올라 있어요. 미래엔에는 없어요. 귀족들이 '정사암'이라는 바위에 모여 재상을 뽑았다는 『삼국유사』 이야기는 교과서에 없어 d 에 넣지 않았어요.
- n: 태왕
  k: 제도
  era: 삼국
  d: '''크고 위대한 왕''이라는 뜻의 칭호예요. 광개토 대왕이 스스로 태왕이라 일컬을 만큼 고구려의 국력이 강해졌고, 충주 고구려비에도 고구려를 태왕의 나라로 적었어요.'
  x: 경주 호우총에서 나온 청동 그릇 바닥에는 '국강상광개토지호태왕'이라는 글자가 새겨져 있어, 고구려 왕을 태왕으로 높여 부르던 모습과 고구려·신라의 가까운 관계를 함께 보여 줘요. 충주 고구려비에는 신라를 고구려에 복속된 '동이'로 적고 신라 왕과 신하들에게 고구려 관리의 옷을 내려 주었다고 기록되어 있어, 고구려가 스스로를 천하의 중심으로 여겼음을 엿볼 수 있어요.
  pg: [26, 27]
  ev: [gwanggaeto, chungju-stele]
- n: 화백 회의
  k: 제도
  era: 삼국
  d: 신라의 귀족 회의로, 상대등이 이끌었어요. 나라의 중요한 일을 만장일치로 정해 귀족들이 왕을 견제하기도 했고, 통일 뒤 집사부와 시중의 힘이 커지면서 기능이 줄었어요.
  x: 고구려의 제가 회의, 백제의 정사암 회의와 함께 삼국 시대 귀족 회의를 대표해요. 삼국 모두 왕권이 강해지는 가운데에도 귀족들이 회의를 통해 나라의 중요한 일에 참여했다는 점이 공통점이에요. 법흥왕은 상대등에게 화백 회의를 맡기는 한편 병부를 설치해 군사권은 왕이 직접 장악했어요.
  pg: [31, 58]
  mp: [28]
  ev: [silla-yullyeong]
  inst: silla-politics
  note: 만장일치는 미래엔 28쪽, 통일 뒤 기능 축소는 비상 58쪽.
- n: 집사부
  k: 제도
  era: 남북국
  y: 651
  d: 왕명을 받들어 행정을 이끈 신라의 기구로, 통일 뒤 중앙 정치의 중심이 되었어요. 장관인 시중(중시)의 힘이 커지고 귀족 회의인 화백 회의의 힘은 줄어 왕권이 강해졌어요.
  x: 진덕 여왕 때인 651년에 설치되었고, 통일 뒤에는 집사부를 중심으로 10여 개의 관청을 두어 행정 업무를 나누어 맡게 했어요. 장관의 이름은 처음에 중시였다가 경덕왕 때 시중으로 바뀌었어요. 통일 전에는 귀족 회의를 이끄는 상대등이 최고 관직이었다면, 통일 뒤에는 왕의 명령을 수행하는 기구가 정치의 중심이 되었다는 점이 달라요.
  pg: [58, 62, 72]
  mp: [55]
  inst: silla-unified-gov
  note: y 651 은 진덕 여왕 5년 품주를 고쳐 세운 해(한국민족문화대백과사전 '집사부'). 장관 이름은 경덕왕 때 중시에서 시중으로 바뀌었어요(같은 항목).
- n: 경주 감은사지
  a: [감은사 터]
  k: 유적·유물
  era: 남북국
  y: 682
  d: 문무왕이 부처의 힘으로 왜의 침입을 막으려고 동해 가까이에 짓기 시작해, 아들 신문왕이 682년에 완성한 절의 터예요. 지금은 절터와 3층 석탑 두 기가 남아 있어요.
  x: '''감은사''라는 이름은 문무왕의 은혜에 감사한다는 뜻을 담아 신문왕이 붙였다고 전해요. 가까운 동해 바닷가에는 죽어서도 용이 되어 나라를 지키겠다는 문무왕의 유언에 따라 장사 지냈다고 전하는 바위섬(문무대왕릉)이 있어요. 감은사는 이처럼 나라를 지키려는 바람을 담은 호국 사찰이었어요.'
  pg: [57]
  mp: [54]
  at: [129.48, 35.742]
  ev: [gameunsa]
  note: 가까운 동해 바닷가에 문무왕의 수중릉(대왕암)이 있어요(비상 56쪽).
- n: 경주 감은사지 동서 3층 석탑
  a: [경주 감은사지 동·서 삼층 석탑, 감은사지 3층 석탑]
  k: 문화유산
  era: 남북국
  y: 682
  d: 감은사 터에 동쪽과 서쪽으로 마주 선 두 석탑으로, 구조와 크기가 똑같아요. 이중 기단 위에 3층으로 쌓는 통일 신라 석탑의 모습을 보여 주고, 탑 안에서 솜씨 좋은 사리 장엄구가 나왔어요.
  x: 높이 13.4m로, 경주에 있는 3층 석탑 가운데 가장 큰 탑이에요. 비상 교과서에는 동탑에서 나온 사리 장엄구의 바깥 상자(외함)와 안쪽 그릇(내함) 사진이 실려 있어, 통일 신라 금속 공예의 섬세한 솜씨를 직접 볼 수 있어요. 두 교과서 모두 경주 불국사 3층 석탑과 함께 이 시기에 유행한 석탑 양식의 대표 예로 꼽아요.
  pg: [57, 66]
  mp: [63]
  at: [129.48, 35.742]
  ev: [gameunsa]
  note: y 는 감은사가 완성된 해(682, 비상 57쪽)로 잡았어요. 비상은 '3층', 미래엔은 '삼층'으로 써요.
- n: 9서당
  a: [구서당]
  k: 제도
  era: 남북국
  y: 693
  d: 통일 신라의 중앙군이에요. 신라인뿐 아니라 고구려 유민, 백제 유민, 말갈인까지 부대로 편성해 여러 민족을 하나로 아우르려 했어요.
  x: 지방군인 10정과 함께 통일 신라 군사 조직의 뼈대를 이루었어요. 비상 교과서의 그림처럼 신라계·고구려계·백제계·말갈계 부대가 나뉘어 있었는데, 옛 적국의 유민까지 중앙군에 넣은 것은 통일 뒤 새로 편입된 사람들을 신라 백성으로 끌어안으려는 민족 융합 정책이었어요. 발해의 중앙군인 10위와 짝지어 기억해 두면 좋아요.
  pg: [58, 72]
  mp: [55]
  ev: [nine-ju]
  inst: silla-unified-gov
  note: y 693 은 9서당이 모두 갖추어진 해(효소왕 2, 한국민족문화대백과사전 '구서당'). 교과서는 신문왕 때의 제도 정비로 함께 다뤄요.
- n: 남북국
  a: [남북국 시대]
  k: 개념
  era: 남북국
  y: 698
  f: 698
  t: 926
  d: 남쪽의 통일 신라와 북쪽의 발해가 함께 있던 시기를 이르는 말이에요. 조선 후기 유득공이 『발해고』에서 처음 쓴 말로, 발해도 우리 역사라는 뜻을 담고 있어요.
  x: 유득공은 『발해고』에서 김씨(신라)가 남쪽을, 대씨(발해)가 북쪽을 차지했으니 이것이 남북국이며, 고려가 남북국의 역사를 함께 쓰지 않은 것은 잘못이라고 했어요. 신라의 삼국 통일을 강조할 때는 이 시기를 '통일 신라 시대'라고도 부르는데, 두 이름은 무엇을 강조하느냐의 차이예요. 두 나라는 한때 대립하기도 했지만 신라도를 통해 사신과 문물을 주고받았어요.
  pg: [54, 55]
  mp: [51]
  ev: [balhae-founding, balhaego]
  note: y·f 는 발해 건국(698), t 는 발해 멸망(926). 신라의 통일을 강조해 '통일 신라 시대'라고도 불러요(비상 55쪽).
- n: 이불병좌상
  k: 문화유산
  era: 남북국
  y: 790
  d: 두 부처가 나란히 앉아 있는 발해의 불상이에요. 발해 동경 터에서 나왔고, 위가 뾰족한 광배와 연꽃 표현에서 고구려 불상의 전통을 엿볼 수 있어요.
  x: 발해에서는 왕실과 귀족을 중심으로 불교가 크게 유행해, 문왕은 스스로를 불교의 이상적인 왕으로 일컫고 각지에 절을 지었어요. 상경성 절터에 남은 높이 약 6.3m의 거대한 석등과 함께, 이불병좌상은 융성했던 발해 불교를 보여 주는 대표 유물이에요.
  mp: [64, 65]
  at: [130.283, 42.859]
  ap: 1
  note: y 790 은 대략값이에요. 동경 용원부(785~794년 도읍) 옛터인 팔련성 부근에서 나왔어요(한국민족문화대백과사전 '이불병좌상').
- n: 김대문
  k: 인물
  era: 남북국
  y: 704
  d: 통일 신라의 진골 출신 학자예요. 화랑들의 전기를 모은 『화랑세기』와 『고승전』 등을 지어 신라의 역사와 전통을 정리했어요.
  x: 통일 신라의 이름난 학자들은 대개 6두품 출신이었지만, 김대문은 진골 귀족 출신이라는 점이 달라요. 704년에는 한산주 도독을 지냈어요. 그가 쓴 『화랑세기』 등은 지금 전하지 않고, 일부 내용만 다른 책에 인용되어 남아 있어요.
  pg: [65]
  mp: [62]
  note: y 704 는 한산주 도독이 된 해(성덕왕 3, 한국민족문화대백과사전 '김대문'). 『고승전』은 미래엔 본문.
- n: 상원사 동종
  k: 문화유산
  era: 남북국
  y: 725
  d: 강원 평창 오대산 상원사에 있는 통일 신라의 범종으로, 지금 남아 있는 우리나라 범종 가운데 가장 오래되었어요. 꼭대기에 소리의 울림을 돕는 음통이 있는 등 우리나라 종의 특징을 잘 보여 줘요.
  x: 종에 새긴 글로 성덕왕 때인 725년에 만든 것이 확인돼요. 이보다 40여 년 뒤인 771년에 완성된 성덕 대왕 신종은 우리나라에서 가장 큰 종이며, 두 종 모두 통일 신라의 섬세하고 뛰어난 금속 주조 기술을 보여 줘요. 이 무렵 신라에서는 불교가 크게 일어나 곳곳에 절이 서고 불상·탑·종도 많이 만들어졌어요.
  pg: [66]
  mp: [63]
  at: [128.564, 37.786]
  note: y 725(성덕왕 24)는 종에 새긴 글로 확인된 해(한국민족문화대백과사전 '상원사 동종'). 좌표는 상원사(위키백과).
- n: 당항성
  a: [당은포]
  k: 유적·유물
  era: 남북국
  y: 750
  d: 지금의 경기 화성 서해안에 있던 성으로, 통일 신라 때 당을 오가는 배가 드나든 무역항 구실을 했어요. 수도 가까운 울산항과 함께 대표적인 무역항으로 꼽혀요.
  x: 미래엔 교과서에 따르면 백제가 처음 쌓은 뒤 고구려와 신라가 차지하려고 다툰 곳이었어요. 6세기 진흥왕이 한강 유역을 차지한 뒤 신라는 이곳을 발판으로 서해를 건너 중국과 직접 교류할 수 있게 되었어요. 미래엔 교과서는 같은 곳의 포구를 '당은포'라고 적었어요.
  pg: [70]
  mp: [29, 66]
  at: [126.713, 37.196]
  note: 좌표는 화성 당성(사적) 터. 미래엔은 같은 곳의 포구를 '당은포'라고 적었어요(66쪽 본문·지도). y 는 통일 신라 무역항으로 번성한 8세기 무렵의 대략 연도이고, 쌓은 해는 알 수 없어요.
- n: 울산항
  k: 장소
  era: 남북국
  y: 750
  d: 신라의 수도 금성(경주) 가까이 있던 국제 무역항이에요. 아라비아 상인까지 드나들었고, 이들을 통해 신라라는 이름이 이슬람 세계에 알려졌어요.
  x: 통일 신라는 당에 금·은 세공품 등을 수출하고 귀족들이 쓰는 사치품을 들여왔으며, 당과 일본 사이의 중계 무역으로도 이익을 얻었어요. 미래엔 교과서는 서역인의 얼굴을 한 원성왕릉 무인석과, 사산 왕조 페르시아에서 유행한 무늬를 새긴 사자·공작무늬 돌을 통해 신라가 먼 서역과도 교류했음을 보여 줘요.
  pg: [70, 73]
  mp: [66, 67]
  at: [129.37, 35.51]
  ap: 1
  note: 옛 항구 자리는 정확하지 않아 울산 태화강 하구 일대에 대략 찍었어요. y 는 무역항으로 번성한 8세기 무렵의 대략 연도예요.
- n: 경주 불국사 3층 석탑
  a: [경주 불국사 삼층 석탑, 석가탑, 무영탑]
  k: 문화유산
  era: 남북국
  y: 751
  d: 불국사 대웅전 앞에 선 석탑으로 석가탑·무영탑이라고도 불러요. 통일 신라 3층 석탑의 전형으로 꼽히고, 탑 안에서 『무구정광대다라니경』이 발견되었어요.
  x: 이중 기단 위에 3층의 몸돌과 지붕돌을 쌓은 단정하고 균형 잡힌 모습으로, 화려한 다보탑과 마주 서서 좋은 대조를 이뤄요. 경주 감은사지 동서 3층 석탑과 함께 통일 신라에서 유행한 석탑 양식을 대표해요. 불국사와 석굴암은 1995년 유네스코 세계 유산에 함께 등재되었어요.
  pg: [66]
  mp: [63]
  at: [129.332, 35.79]
  ev: [bulguksa]
  note: 목록의 '경주 불국사 삼층 석탑'(미래엔)과 합쳤어요. y 는 불국사를 크게 짓기 시작한 751년 무렵의 대략 연도예요. 좌표는 불국사.
- n: 경주 불국사 다보탑
  a: [다보탑]
  k: 문화유산
  era: 남북국
  y: 751
  d: 불국사 대웅전 앞마당에서 석가탑과 마주 선 탑이에요. 몇 층인지 세기 어려울 만큼 짜임이 복잡하고 화려하지만 균형이 잘 잡힌 독특한 모습이에요.
  x: 비상 교과서는 다보탑이 목조 건축의 복잡한 구조를 돌로 조화롭게 표현했다고 설명해요. 이중 기단 위에 3층으로 쌓은 단정한 석탑이 유행하던 통일 신라에서 이처럼 독특한 탑도 만들어져, 신라 석조 예술의 높은 수준을 보여 줘요. 불국사는 건물과 탑을 균형 있게 배치해 불교에서 바라는 이상 세계를 나타낸 절이에요.
  pg: [66]
  at: [129.332, 35.79]
  ev: [bulguksa]
  note: y 는 불국사를 크게 짓기 시작한 751년 무렵의 대략 연도예요. 미래엔 본문에는 이름이 나오지 않아요.
- n: 경주 석굴암 본존불
  a: [석굴암 본존상, 경주 석굴암 본존상]
  k: 문화유산
  era: 남북국
  y: 751
  d: 토함산 석굴암 한가운데 앉아 있는 부처상이에요. 얼굴·가슴·어깨·무릎 너비가 일정한 비율을 이루도록 정밀하게 계산해 만들어 안정감과 균형미가 뛰어나요.
  x: 비상 교과서에 따르면 얼굴·가슴·어깨·무릎 너비의 비례가 1:2:3:4이고, 얼굴의 세로 길이는 몸체의 3분의 1이에요. 석굴암은 화강암을 쌓아 만든 인공 석굴로, 돌 360여 개를 맞물려 둥근 천장을 만들고 맨 위를 20톤짜리 덮개돌로 덮었어요. 본존불을 중심으로 둘레 벽에 새긴 보살 등의 조각이 조화를 이루며, 불국사와 함께 1995년 유네스코 세계 유산이 되었어요.
  pg: [66, 67]
  mp: [63]
  at: [129.349, 35.795]
  ev: [bulguksa]
  note: 비상 표기는 '석굴암 본존상'. y 는 석굴암을 짓기 시작한 751년 무렵의 대략 연도. 좌표는 석굴암(위키백과).
- n: 무구정광대다라니경
  k: 책·기록
  era: 남북국
  y: 751
  d: 불국사 3층 석탑(석가탑) 안에서 발견된 두루마리 불경이에요. 8세기 중반에 목판으로 찍은 것으로, 지금 남아 있는 것 가운데 세계에서 가장 오래된 목판 인쇄물로 꼽혀요.
  x: 나무판에 글자를 새겨 종이에 찍어 낸 두루마리 불경으로, 미래엔 교과서에는 불국사 박물관에 있는 모습이 실려 있어요. 8세기 중반 신라에서 이미 불경을 목판으로 찍어 냈음을 알려 주어, 통일 신라의 인쇄 기술 수준을 보여 주는 자료예요.
  pg: [66]
  mp: [63]
  at: [129.332, 35.79]
  ev: [bulguksa]
  note: '좌표는 발견된 불국사. y 는 석가탑을 세운 751년 무렵(비상: 8세기 중반에 만든 것).'
- n: 상경성
  a: [상경, 상경 용천부]
  k: 유적·유물
  era: 남북국
  y: 756
  d: 가장 오래 발해의 도읍이었던 성으로, 당의 장안성을 본떠 바둑판 모양으로 만든 계획도시예요. 외성·내성과 주작대로를 갖추었고, 성터에서 고구려 전통을 이은 온돌과 불상·기와가 나왔어요.
  x: 외성의 둘레가 16km에 이르는 큰 도시로, 북쪽에 왕궁(궁성)과 관청 구역(황성)을 두고 그 남쪽으로 곧게 뻗은 큰길인 주작대로를 따라 백성의 집과 시장·절이 들어섰어요. 문왕 때 중경에서 이곳으로 도읍을 옮겼으며, 성터에는 궁성 남문(오봉루) 터와 높이 약 6.3m의 석등, 용머리상 등이 남아 있어요. 지금의 중국 헤이룽장성 닝안시에 있어요.
  pg: [56, 59, 60, 68, 69]
  mp: [56, 64, 65, 67]
  at: [129.16, 44.13]
  ev: [sanggyeong, seonwang]
  note: 오늘날 중국 헤이룽장성 닝안시 발해진. 좌표는 위키백과 'List of Major National Historical and Cultural Sites in Heilongjiang'(44.128, 129.158). y 는 문왕의 상경 천도(8세기 중반, 756년 무렵)로 events 의 sanggyeong 과 같아요. events 의 좌표 [129.19, 44.05]와는 조금 달라요.
- n: 정혜 공주 묘
  k: 문화유산
  era: 남북국
  y: 780
  d: 발해 문왕의 딸 정혜 공주의 무덤이에요. 고구려 무덤처럼 모줄임천장 구조를 갖춘 굴식 돌방무덤이라 발해가 고구려 문화를 이었음을 보여 줘요. 묘지석에는 유교 경전 구절이 인용되어 있어요.
  x: 묘지석에는 문왕이 쓴 연호 '보력'이 적혀 있어, 발해가 독자적인 연호를 썼음을 보여 주는 자료이기도 해요. 두 교과서 모두 이 무덤의 모줄임천장 구조를 발해가 고구려를 이었다는 근거로 들어요. 정혜 공주 묘보다 늦게 만든 정효 공주 묘가 당의 영향을 받아 벽돌로 쌓은 무덤인 것과 비교해 두면 좋아요.
  pg: [59, 68, 69, 73]
  mp: [64, 65]
  at: [128.25, 43.367]
  ev: [munwang]
