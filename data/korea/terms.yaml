  x: 1555년(명종 10)에 만든 청동 천자총통은 길이 약 1.3m, 포구 지름 약 12.8cm로, 크기와 구경에 따라 '천·지·현·황'으로 불린 총통 가운데 가장 커요. 판옥선은 몸체가 단단해 큰 화포를 쏠 때의 반동을 버텨 냈지만, 일본의 안택선은 날렵한 대신 선체가 약해 포탄을 맞으면 쉽게 부서졌어요. 이렇게 화포와 튼튼한 배를 앞세운 전술이 조선 수군의 승리 바탕이었어요.
