# 교과서 용어 사전
# 두 교과서(비상·미래엔) 찾아보기에 있는 용어 가운데, 사건·나라·왕·전쟁 이름으로는 검색되지 않던 것을 모았어요.
# 형식: data/korea/themes/README.md 3절. note 는 확인 메모라 화면에 나오지 않아요.
# 만든 방법: 찾아보기 용어(비상 684개, 미래엔 419개)를 앱 데이터와 대조 → 빠진 용어를 시대별로 나눠 두 교과서 본문·그림과 한국민족문화대백과사전으로 확인.

- n: 단군왕검
  a: [단군]
  k: 인물
  era: 선사·고조선
  y: -2333
  d: 『삼국유사』의 건국 이야기에 나오는, 고조선을 세운 지배자예요. '단군'은 제사장, '왕검'은 정치 지도자를 뜻해 제정일치 사회의 지배자였음을 알 수 있어요.
  x: 고려 시대 일연이 쓴 『삼국유사』에 따르면, 바람·비·구름을 다스리는 신들과 함께 하늘에서 내려온 환웅이 곰에서 사람이 된 웅녀와 혼인해 단군왕검을 낳았어요. 이 이야기에서 건국 집단이 하늘과 연결해 권위를 내세웠음을, 곡식과 형벌을 다스렸다는 대목에서 농경 사회·계급 사회였음을, 혼인에서 집단 사이의 연맹을 짐작할 수 있어요. 기원전 2333년이라는 건국 연도는 조선 시대 『동국통감』에 적힌 것이에요.
  pg: [16, 17]
  mp: [12]
  ev: [gojoseon-founding]
  inst: gojoseon-society
  note: 건국 연도 기원전 2333년은 조선 시대 『동국통감』의 기록이에요(두 교과서).
- n: 가락바퀴
  k: 유적·유물
  era: 선사·고조선
  d: 신석기 시대에 실을 뽑을 때 쓴 둥근 도구예요. 가운데 구멍에 막대를 끼워 돌려 실을 꼬았고, 이렇게 얻은 실과 뼈바늘로 옷이나 그물을 만들었어요.
  x: 신석기 사람들은 이렇게 실을 뽑아 옷을 지어 입었고, 조개껍데기나 동물 이빨로 몸을 꾸미기도 했어요. 실로 엮은 그물에는 그물추를 달아 물고기를 잡았는데, 신석기 유적이 주로 강가나 바닷가에 자리 잡은 것도 이런 고기잡이 생활과 관련이 깊어요.
  pg: [12]
  ev: [neolithic]
- n: 간석기
  k: 유적·유물
  era: 선사·고조선
  d: 돌을 정교하게 갈아서 만든 석기로, 신석기 시대부터 썼어요. 돌보습·돌낫으로 농사를 짓고 갈돌과 갈판으로 곡식을 갈았어요.
  x: 돌을 깨뜨리거나 떼어 내 만든 구석기 시대의 뗀석기보다 훨씬 정교하게 다듬을 수 있어서, 쓰임에 맞는 여러 도구를 만들 수 있었어요. 청동기 시대에도 청동은 귀하고 다루기 어려워 농기구와 일상 도구는 여전히 반달 돌칼·돌괭이 같은 석기로 만들었고, 철제 농기구가 널리 퍼진 철기 시대에 와서야 농기구가 크게 달라졌어요.
  pg: [12]
  ev: [neolithic]
- n: 거푸집
  k: 유적·유물
  era: 선사·고조선
  d: 녹인 청동을 부어 도구의 모양을 뜨던 틀이에요. 세형 동검과 거푸집이 함께 나와 한반도에서 청동 검을 직접 만들었음을 알 수 있어요.
  x: 미래엔 교과서에 실린 전남 영암의 거푸집은 도끼와 낚싯바늘을 만들던 틀이고, 비상 교과서에는 경기 용인에서 나온 세형 동검 거푸집이 실려 있어요. 청동은 구리와 주석 등을 섞어 만든 금속인데, 거푸집은 당시 사람들이 이를 녹여 원하는 모양으로 만드는 기술을 갖고 있었음을 보여 줘요.
  pg: [16]
  mp: [10]
  ev: [bronze-age]
- n: 고인돌
  k: 유적·유물
  era: 선사·고조선
  d: 청동기 시대 지배층의 무덤으로, 받침돌 위에 큰 덮개돌을 얹어 만들었어요. 많은 사람을 동원해야 해서 강한 권력을 가진 지배자가 있었음을 보여 줘요.
  x: 한반도에는 전 세계 고인돌의 약 40%가 있고, 그중 전북 고창·전남 화순·인천 강화의 고인돌은 보존 상태가 좋고 형태가 다양해 유네스코 세계 유산이 되었어요. 바위에 나무쐐기를 박고 물을 부어 불려 돌을 떼어 낸 뒤, 지렛대로 받침돌을 세우고 흙 비탈과 굴림대를 이용해 덮개돌을 끌어 올렸다고 봐요. 생김새에 따라 탁자식과 바둑판식으로 나누며, 제단이나 영역 표시였다고 보는 견해도 있어요.
  pg: [14, 15, 16]
  mp: [11, 12]
  ev: [bronze-age]
  note: 전북 고창, 전남 화순, 인천 강화의 고인돌 유적은 유네스코 세계 유산이에요(비상 15쪽). 여러 곳에 있어 좌표는 넣지 않았어요.
- n: 농경
  k: 경제
  era: 선사·고조선
  d: 곡식을 심어 기르는 농사예요. 신석기 시대에 목축과 함께 시작되어 사람들이 한곳에 머물러 사는 정착 생활을 하게 됐고, 청동기 시대에는 일부 지역에서 벼농사도 지었어요.
  x: 신석기 사람들은 돌보습·돌낫으로 농사짓고 갈돌과 갈판으로 곡식을 갈았지만, 사냥·채집·고기잡이도 함께 했어요. 청동기 시대에는 조·피·보리 같은 잡곡을 기르고 반달 돌칼로 이삭을 거두었으며, 남는 생산물이 생기면서 사유 재산과 빈부 격차, 계급이 나타났어요. 철기 시대에는 단단한 철제 농기구로 땅을 깊게 갈 수 있게 되어 생산량이 크게 늘었어요.
  pg: [12, 14]
  mp: [11]
  ev: [neolithic, bronze-age]
- n: 덧무늬 토기
  k: 유적·유물
  era: 선사·고조선
  d: 띠 모양의 흙을 그릇 겉에 덧붙여 무늬를 낸 신석기 시대 토기예요. 빗살무늬 토기와 함께 이 시기를 대표하는 토기예요.
  x: 비상 교과서에 실린 덧무늬 토기는 부산 영도에서 나온 것이에요. 구석기 시대에는 토기가 없었고, 신석기 시대에 들어 토기를 만들면서 음식을 조리하고 식량을 저장할 수 있게 되었어요.
  pg: [12]
  ev: [neolithic]
- n: 뗀석기
  k: 유적·유물
  era: 선사·고조선
  d: 돌을 깨뜨리거나 떼어 내어 만든 구석기 시대의 도구예요. 처음에는 주먹도끼·찍개 하나로 여러 일을 했지만, 점차 긁개·밀개처럼 쓰임새에 맞는 석기를 만들었어요.
  x: 후기 구석기에는 이전보다 작고 날카로운 슴베찌르개와 돌날 등을 만들었고, 긁개는 짐승의 가죽을 벗기거나 고기를 다듬을 때 썼어요. 구석기 사람들은 이런 석기와 짐승 뼈로 만든 도구로 사냥과 채집을 하며 먹을 것을 따라 옮겨 다녔고, 동굴이나 바위 그늘, 강가의 막집에서 살았어요.
  pg: [11]
  ev: [paleolithic]
  note: 미래엔(역사②)은 청동기 시대부터 다뤄 쪽수가 없어요. 갈래 이름이라 at 은 넣지 않았어요.
- n: 명도전
  k: 유적·유물
  era: 선사·고조선
  d: 중국 전국 시대 연에서 쓰던 칼 모양의 화폐예요. 만주와 한반도 북부의 철기 시대 유적에서 많이 나와 당시 중국과 활발하게 교역했음을 보여 줘요.
  x: 비상 교과서의 명도전 사진은 평북 위원에서 나온 것이에요. 미래엔 교과서는 명도전이 고조선 지역에서 많이 발견되어, 고조선이 중국의 요서·산둥 지역과 활발히 교역했음을 짐작하게 한다고 설명해요. 경남 창원 다호리 유적에서 나온 붓도 철기 시대에 중국과 교류하며 한자가 전해졌음을 보여 줘요.
  pg: [19]
  mp: [13]
  ev: [iron-age]
  note: 비상 19쪽 사진은 평북 위원 출토. 미래엔 13쪽은 고조선의 교역을 보여 주는 화폐로 소개해요.
- n: 목축
  k: 경제
  era: 선사·고조선
  d: 가축을 길러 먹을거리 등을 얻는 일이에요. 신석기 시대에 농경과 함께 시작되었고, 넓은 평야와 초원이 있던 부여에서는 밭농사와 함께 목축이 활발했어요.
  x: 청동기 시대에는 농경과 함께 목축도 더 발달해 돼지·개 등을 길렀고, 남는 생산물이 생기면서 사유 재산과 계급이 나타났어요. 부여에 말·소·돼지·개 같은 가축 이름을 딴 마가·우가·저가·구가라는 지배층이 있었던 것도 목축이 중요했음을 보여 줘요.
  pg: [12, 20]
  mp: [11, 16]
  ev: [neolithic]
- n: 미송리식 토기
  k: 유적·유물
  era: 선사·고조선
  d: 평북 의주 미송리에서 처음 발견되어 이런 이름이 붙은 청동기 시대 토기예요. 주로 요동 지역에서 많이 나오며, 곡식을 저장하거나 조리하는 데 썼어요.
  x: 비상 교과서 사진을 보면 몸통 양쪽에 작은 손잡이가 달려 있어요. 미래엔 교과서는 이 토기를 고조선 관련 문화 범위 지도 옆에 실어, 비파형 동검·탁자식 고인돌과 함께 고조선의 문화를 살피는 자료로 다뤄요. 고조선은 처음에 요동 지역을 중심으로 성장하다가 뒤에 한반도 서북부로 중심지를 옮겼어요.
  pg: [14]
  mp: [12]
  ev: [bronze-age]
  note: 미래엔 12쪽은 고조선 관련 문화 범위 지도 옆에 실었어요.
- n: 민무늬 토기
  k: 유적·유물
  era: 선사·고조선
  d: 겉에 무늬가 없는 청동기 시대의 대표 토기예요. 곡식을 저장하거나 음식을 조리하는 데 썼고, 지역에 따라 여러 모양으로 만들었어요.
  x: 신석기 시대의 빗살무늬 토기와 달리 겉에 무늬를 넣지 않은 것이 가장 큰 특징이에요. 비상 교과서에는 충남 부여에서 나온 민무늬 토기와 탄화된 쌀·반달 돌칼이 함께 실려 있어, 청동기 사람들이 거둔 곡식을 이런 토기에 저장하고 조리했음을 짐작할 수 있어요. 미래엔 교과서는 비파형 동검·거친무늬 거울과 함께 이 시기의 대표 유물로 꼽아요.
  pg: [14]
  mp: [10]
  ev: [bronze-age]
- n: 반달 돌칼
  k: 유적·유물
  era: 선사·고조선
  d: 반달 모양으로 만든 돌칼로, 청동기 시대에 곡식의 이삭을 자르는 데 썼어요. 청동은 귀해서 농기구는 여전히 돌이나 나무로 만들었어요.
  x: 비상 교과서는 충남 부여에서 나온 탄화된 쌀과 반달 돌칼·돌낫을 함께 보여 주는데, 청동기 시대 일부 지역에서 벼농사를 지었음을 알 수 있어요. 미래엔 교과서는 반달 돌칼을 돌보습·돌괭이와 함께 이 시기의 농기구로 소개하고, 대단원 문제에서도 '곡식의 이삭을 자르는 데 쓴 석기'로 물어요.
  pg: [14]
  mp: [10, 42]
  ev: [bronze-age]
- n: 비파형 동검
  k: 유적·유물
  era: 선사·고조선
  d: 악기 비파를 닮은 모양의 청동 검이에요. 몸체에 손잡이를 따로 끼워 썼고, 탁자식 고인돌과 함께 분포 지역을 통해 고조선의 문화 범위를 짐작할 수 있어요.
  x: 만주의 랴오닝 지방부터 한반도 남부까지 넓게 나오며, 미래엔 교과서 사진은 충남 부여에서 출토된 것이에요. 고조선은 랴오닝 지역에서 농사를 기반으로 자기만의 청동기 문화를 꽃피웠는데, 비파형 동검은 중국 황허강 유역 등과 구별되는 이 지역 청동기 문화를 대표해요. 청동기 시대 말부터는 날이 가늘고 곧은 세형 동검이 만들어졌어요.
  pg: [16]
  mp: [10, 12]
  ev: [bronze-age, gojoseon-founding]
- n: 빗살무늬 토기
  k: 유적·유물
  era: 선사·고조선
  d: 그릇 겉면에 빗살처럼 줄을 그어 무늬를 낸 신석기 시대의 대표 토기예요. 음식을 조리하고 식량을 저장하는 데 썼어요.
  x: 강가나 바닷가에 자리 잡은 신석기 유적에서 주로 나오며, 서울 암사동 선사 유적이 대표적인 신석기 유적이에요. 비상 교과서는 에스파냐 등 다른 나라의 신석기 토기와 비교해, 비슷한 시기 세계 여러 곳에서 토기를 만들어 쓴 모습을 보여 줘요. 구석기 시대에는 토기가 없었으므로, 빗살무늬 토기는 신석기 시대를 알려 주는 대표 유물로 기억해 둬요.
  pg: [12]
  ev: [neolithic]
- n: 세형 동검
  a: [한국식 동검]
  k: 유적·유물
  era: 선사·고조선
  d: 날이 가늘고 곧은 청동 검으로, 주로 한반도에서 나와 '한국식 동검'이라고도 불러요. 거푸집도 함께 발견되어 한반도에서 직접 만들었음을 알 수 있어요.
  x: 비상 교과서는 청동기 시대 말부터 만들었다고 하고, 미래엔 교과서는 초기 철기 시대에 평양을 중심으로 한반도 전역에서 나왔다고 설명해요. 창원 다호리 유적처럼 철기 시대 유적에서 청동 검이 철기와 함께 나오기도 해, 청동기에서 철기로 바뀌는 과정을 보여 줘요. 철기가 퍼진 뒤로 청동은 무기나 연장보다는 의식에 쓰는 도구와 몸을 꾸미는 물건에 주로 쓰였어요.
  pg: [16]
  mp: [14]
  note: 비상은 청동기 시대 말부터 만들었다고 하고, 미래엔은 초기 철기 시대에 평양을 중심으로 한반도 전역에서 나왔다고 설명해요.
- n: 슴베찌르개
  k: 유적·유물
  era: 선사·고조선
  d: 구석기 시대 후기에 만든 작고 날카로운 석기예요. 아랫부분(슴베)을 나무 자루에 꽂아 창처럼 사냥에 썼어요.
  x: 하나의 석기를 여러 용도로 쓰던 초기와 달리, 후기 구석기 사람들은 돌날·슴베찌르개처럼 쓰임새가 분명하고 정교한 석기를 만들었어요. 큰 짐승을 사냥하려고 무리 지어 다니던 구석기 사람들에게 자루를 단 이런 사냥 도구는 쓸모가 컸어요.
  pg: [11]
  ev: [paleolithic]
  note: 갈래 이름이라 at 은 넣지 않았어요. 미래엔(역사②)에는 나오지 않아요.
- n: 움집
  k: 사회
  era: 선사·고조선
  d: 땅을 파고 기둥을 세운 뒤 지붕을 덮어 만든 집이에요. 신석기 시대에 농경과 목축을 시작해 한곳에 머물러 살면서 지었고, 삼국 시대 평민들도 움집에 살았어요.
  x: 구석기 사람들은 이동 생활을 해서 동굴·바위 그늘이나 강가의 막집에 살았지만, 신석기 사람들은 한곳에 머물며 움집을 짓고 마을을 이루었어요. 청동기 시대에는 농사와 전쟁에 유리한 낮은 언덕에 마을을 만들고 울타리·도랑 같은 방어 시설을 둘렀으며, 창고처럼 쓰임이 다른 건물도 지었어요. 삼국 시대에 귀족은 기와집에 살았지만 평민은 여전히 움집이나 귀틀집에서 살았어요.
  pg: [12, 40]
  ev: [neolithic]
- n: 잔무늬 거울
  k: 유적·유물
  era: 선사·고조선
  d: 뒷면에 아주 가는 선으로 촘촘한 무늬를 새긴 청동 거울이에요. 군장이 제사를 지낼 때 쓰면서 자신의 권위를 높였어요.
  x: 비상 교과서에 실린 잔무늬 거울은 강원 양양에서 나온 것이에요. 미래엔 교과서가 이 시기 대표 유물로 꼽는 거친무늬 거울과 비교하면 무늬가 훨씬 가늘고 촘촘해요. 군장은 청동 거울을 몸에 지니고 청동 검·청동 방울 등과 함께 제사를 주관했어요.
  pg: [14]
  ev: [bronze-age]
- n: 제정일치 사회
  a: [제정일치]
  k: 개념
  era: 선사·고조선
  d: 제사를 이끄는 사람이 정치도 함께 맡던 사회예요. 청동기 시대 군장이 제사를 주관하며 부족을 다스렸고, 제사장(단군)과 정치 지도자(왕검)를 합친 '단군왕검'이라는 이름도 이를 보여 줘요.
  x: 청동기 시대에 농경이 발달하고 계급이 나뉘면서, 권력과 재산을 가진 군장이 하늘에 풍요를 비는 제사까지 이끌어 종교적 권위도 함께 차지했어요. 이와 달리 철기 시대의 삼한에는 정치 지배자인 신지·읍차와 따로 제사장인 천군이 있어 제사와 정치가 나뉘었고, 천군이 다스리는 소도에는 죄인이 숨어도 잡아갈 수 없었어요.
  pg: [14, 17]
  mp: [12]
  ev: [bronze-age, gojoseon-founding]
  inst: gojoseon-society
- n: 주먹도끼
  k: 유적·유물
  era: 선사·고조선
  d: 돌의 양쪽 면을 다듬어 만든 구석기 시대의 뗀석기로, 사냥과 나무 손질, 고기 자르기 등에 두루 썼어요. 경기 연천 전곡리에서 발견되어 동아시아에도 발달한 구석기 문화가 있었음을 보여 줬어요.
  x: 미국 고고학자 모비우스 등은 주먹도끼는 서양에서, 찍개는 동아시아에서 주로 나온다는 점을 들어 동아시아의 구석기 문화가 뒤처졌다고 보았어요. 주먹도끼가 찍개보다 훨씬 공들여 다듬은 석기여서 문화 수준을 가늠하는 잣대로 삼은 거예요. 그런데 1978년 연천 전곡리에서 프랑스 생 아슐 지역의 것과 같은 아슐리안 계통 주먹도끼가 동아시아에서 처음 나오면서 이 주장은 힘을 잃었어요.
  pg: [11]
  ev: [paleolithic]
  note: 전곡리 위치는 사건 paleolithic 에 있어 at 은 넣지 않았어요.
- n: 중계 무역
  k: 경제
  era: 선사·고조선
  d: 다른 나라들 사이에서 물건을 이어 주며 이익을 얻는 무역이에요. 위만 조선은 중국 한과 한반도 남쪽 나라들 사이에서 중계 무역으로 큰 이익을 얻었어요.
  x: 고조선은 한반도 남부의 나라들이 한과 직접 교역하지 못하게 막고 그 사이에서 큰 이익을 얻었는데, 한은 흉노와 고조선이 손잡을 것을 경계했고 사신이 죽는 일까지 겹쳐 결국 한 무제가 고조선을 공격했어요. 이후에도 김해의 금관가야는 낙랑·왜 사이에서, 통일 신라는 당·일본 사이에서 중계 무역으로 이익을 얻었고, 9세기에는 장보고가 당·신라·일본을 잇는 해상 무역을 장악했어요.
  pg: [16]
  mp: [14, 22, 58]
  ev: [wiman]
  note: 미래엔 22쪽은 금관가야, 58쪽은 장보고의 중계 무역이에요.
- n: 청동 거울
  k: 유적·유물
  era: 선사·고조선
  d: 청동으로 만든 거울로, 군장이 제사를 지낼 때 쓴 도구예요. 태양 숭배 신앙과 관련 있다고 보며, 지배층이 죽으면 무덤에 함께 묻기도 했어요.
  x: 미래엔 교과서는 거친무늬 거울을 비파형 동검·민무늬 토기와 함께 만주와 한반도 청동기 시대의 대표 유물로 꼽고, 충남 아산에서 나온 청동 거울을 보여 줘요. 비상 교과서는 가는 선을 촘촘히 새긴 잔무늬 거울(강원 양양)을 실었어요. 철기가 널리 쓰인 뒤에도 청동기는 이런 의식용 도구나 장신구로 계속 쓰였어요.
  pg: [14]
  mp: [10]
  ev: [bronze-age]
- n: 청동 검
  k: 유적·유물
  era: 선사·고조선
  d: 청동으로 만든 검으로, 청동기 시대 지배층이 무기이자 권위를 드러내는 제사 도구로 썼어요. 만주와 한반도에서는 비파형 동검에 이어 세형 동검이 만들어졌어요.
  x: 청동은 구리에 주석 등을 섞어 만든 금속인데, 재료가 귀하고 다루기 어려워 주로 무기나 제사 도구처럼 지배층이 쓰는 물건을 만들었어요. 지배층이 죽으면 고인돌이나 돌널무덤에 청동 검·청동 거울 등을 함께 묻었어요. 철기가 들어온 뒤에도 한동안 철기와 함께 쓰여, 창원 다호리 유적에서는 쇠도끼 등과 함께 청동 검이 나왔어요.
  pg: [14]
  mp: [10]
  ev: [bronze-age]
- n: 청동 방울
  k: 유적·유물
  era: 선사·고조선
  d: 청동으로 만든 방울로, 청동기 시대 군장이 제사를 지낼 때 몸에 지니거나 흔들어 썼어요. 귀한 청동 도구를 제사에 써서 군장의 권위를 높였어요.
  x: 비상 교과서에는 고리 양 끝에 방울이 달린 청동 방울(삼성 미술관 리움)과 가지 끝마다 방울이 달린 팔주령(전남 화순)이 실려 있고, 미래엔 교과서에는 종 모양의 청동 종방울(대전 서구)도 나와요. 비상 교과서의 군장 그림에서도 청동 거울을 몸에 단 군장이 방울을 높이 들고 제사를 이끄는 모습을 볼 수 있어요.
  pg: [14]
  mp: [10]
  ev: [bronze-age]
  note: 가지 끝마다 방울이 달린 팔주령도 청동 방울의 하나예요(미래엔 10쪽 '제사 때 사용된 청동 방울').
- n: 탁자식 고인돌
  k: 유적·유물
  era: 선사·고조선
  d: 받침돌을 세우고 그 위에 넓은 덮개돌을 얹어 탁자처럼 만든 고인돌이에요. 비파형 동검과 함께 분포 지역을 살펴 고조선의 문화 범위를 짐작할 수 있어요.
  x: 고인돌은 생김새에 따라 높은 받침돌 위에 덮개돌을 얹은 탁자식과, 받침돌이 낮아 덮개돌이 땅에 가깝게 놓인 바둑판식 등으로 나눠요. 미래엔 교과서에는 인천 강화의 탁자식 고인돌이 실려 있어요. 고조선의 문화 범위를 이야기할 때는 바둑판식이 아니라 탁자식 고인돌의 분포를 기준으로 삼는다는 점을 헷갈리지 마요.
  pg: [16]
  mp: [11, 12]
  ev: [bronze-age, gojoseon-founding]
  note: 미래엔 11쪽 사진은 인천 강화의 탁자식 고인돌이에요. 여러 곳에 있는 무덤 형식이라 좌표는 넣지 않았어요.
- n: 토기
  k: 유적·유물
  era: 선사·고조선
  d: 흙으로 빚어 불에 구운 그릇이에요. 신석기 시대부터 만들어 음식을 조리하고 식량을 저장했으며, 빗살무늬 토기와 덧무늬 토기가 대표적이에요.
  x: 청동기 시대에는 무늬 없는 민무늬 토기와 미송리식 토기가 널리 쓰였고, 삼국 시대 가야의 토기는 일본에 전해져 스에키라는 일본 토기의 바탕이 되었어요. 신라와 가야에서는 사람·동물·배·집 등의 모양을 본뜬 상형 토기를 무덤에 넣기도 했는데, 이를 통해 당시 생활 모습을 짐작할 수 있어요.
  pg: [12]
  ev: [neolithic]
- n: 팔주령
  k: 유적·유물
  era: 선사·고조선
  d: 여덟 갈래로 뻗은 가지 끝마다 방울이 달린 청동 방울이에요. 청동기 시대 군장이 제사 때 썼으며, 전남 화순에서 나온 것이 잘 알려져 있어요.
  x: 이름의 '팔(八)'은 여덟, '령(鈴)'은 방울을 뜻해요. 미래엔 교과서는 팔주령을 청동 거울·청동 종방울 등과 함께 여러 청동기 유물로 묶어, 만주와 한반도의 청동기가 종류와 형태에서 중국 황허강 유역이나 내몽골 지역과 다른 독자적 특징을 지녔다고 설명해요.
  pg: [14]
  mp: [10]
  ev: [bronze-age]
- n: 계루부
  k: 사회
  era: 여러 나라
  d: 고구려 초기에 정치를 이끈 5부 가운데 하나로, 왕을 배출한 집단이에요. 정복 전쟁으로 왕권이 강해지면서 계루부 고씨가 왕위를 독점해 대대로 물려주었어요.
  x: 고구려 초기의 5부는 계루부·소노부·절노부·순노부·관노부였고, 미래엔 교과서는 계루부가 중심이 되어 정치를 이끌며 왕 아래 상가·패자·고추가 같은 관직을 두었다고 설명해요. 2세기 고국천왕 무렵부터 이런 부족 단위의 5부는 점차 해체되어 동·서·남·북·중의 행정 구역 5부로 바뀌었고, 왕권이 안정되면서 각 부의 군장들은 중앙 귀족이 되었어요.
  pg: [25]
  mp: [16, 20]
  ev: [taejo-goguryeo]
  inst: goguryeo-politics
  note: 5부는 계루부·소노부·절노부·순노부·관노부로, 뒤에 동·서·남·북·중의 행정 구역 5부로 바뀌었어요(비상 25쪽).
- n: 단궁
  k: 경제
  era: 여러 나라
  d: 박달나무로 만든 활로, 동예의 이름난 특산물이에요. 과일나무 아래를 지나갈 만큼 작은 말인 과하마, 바다표범 가죽인 반어피도 함께 유명했어요.
  x: 동예는 한반도 동해안에 자리 잡아 농사가 잘되고 소금과 해산물이 풍부했으며, 이런 특산물은 중국 역사서 『삼국지』 위서 동이전에 기록되어 전해져요. 하지만 동예는 왕 없이 읍군·삼로라는 군장이 지역을 나누어 다스렸고, 고구려의 간섭을 받아 강한 나라로 크지 못했어요.
  pg: [21]
  mp: [17]
  ev: [okjeo-dongye]
- n: 덩이쇠
  k: 유적·유물
  era: 여러 나라
  d: 철기를 만드는 재료로 쓰려고 납작하게 만든 쇳덩이예요. 철이 풍부한 변한에서는 덩이쇠를 화폐처럼 쓰고 낙랑과 왜 등에 철을 수출했어요.
