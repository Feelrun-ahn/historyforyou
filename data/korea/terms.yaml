  d: 관음보살이 괴로움에 빠진 중생의 목소리를 듣고 구해 준다고 믿는 불교 신앙이에요. 의상이 널리 퍼뜨려 신라 불교의 폭을 넓혔어요.
  x: 의상은 당에서 화엄 사상을 배우고 돌아와 부석사를 비롯한 여러 절을 세우고 제자를 길렀어요. 원효의 아미타 신앙과 함께, 관음 신앙은 통일 전후 신라 불교가 왕실과 귀족을 넘어 일반 백성에게 퍼져 나간 흐름을 보여 줘요.
