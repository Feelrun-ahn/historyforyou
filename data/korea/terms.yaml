  era: 근대
  y: 1884
  d: 1884년 우편 업무를 맡기려고 세운 우리나라 첫 근대식 우편 관청이에요. 그해 김옥균 등 급진 개화파가 이곳의 개국 축하연을 틈타 갑신정변을 일으켰어요.
  x: 1884년 세워졌고 개화파 관료 홍영식이 책임자(총판)를 맡았어요. 그해 음력 10월 17일 열린 개국 축하연에서 정변이 일어났는데, 정변이 3일 만에 실패하자 우정총국도 며칠 만에 폐지되었어요. 다시 세우자는 논의가 있었지만 근대 우편 업무는 1893년 전우총국이 생길 때까지 제대로 이어지지 못했어요. 건물은 지금도 서울 종로에 남아 있어요.
  mp: [171]
  at: [126.983, 37.574]
  ev: [gapsin]
  note: 비상에는 나오지 않음. '최초의 근대 우편 기관'과 조계사 바로 옆 위치는 서울시 미디어허브(mediahub.seoul.go.kr/archives/2008359) 확인. 좌표는 사건 gapsin 과 같게 맞춤.
- n: 집강소
  k: 제도
  era: 근대
  y: 1894
  d: 동학 농민군이 정부와 전주 화약을 맺은 뒤 전라도 각지에 둔 자치 기구예요. 농민군은 이곳을 중심으로 폐정 개혁안을 실천해 나갔어요.
  x: 동학 농민군이 전주성을 차지하자 정부는 청에 군대를 요청했고, 일본도 톈진 조약을 내세워 군대를 보냈어요. 외국 군대가 들어오자 농민군은 폐정 개혁을 약속받고 서둘러 정부와 화약을 맺은 뒤 전주성에서 물러났어요. 그러나 일본군이 경복궁을 점령하고 청일 전쟁을 일으키자 농민군은 일본을 몰아내려고 다시 봉기했어요.
  pg: [176]
  mp: [172]
  note: 관련 사건은 events 에 없고 data/wars/korea_modern.yaml donghak-1(전주 화약 전투 항목)에 있음.
- n: 폐정 개혁안
  k: 책·기록
  era: 근대
  y: 1894
  d: 동학 농민군이 내건 개혁 요구예요. 탐관오리를 벌주고 세금을 고르게 걷으며 관직을 사고파는 일을 막으라는 내용 등을 담았고, 농민군은 집강소를 통해 이를 실천했어요.
  x: 개항 뒤 무거운 세금과 탐관오리의 수탈, 외국 상인의 경제 침탈로 농민의 삶이 어려워진 것이 개혁 요구의 바탕이 되었어요. 비상 교과서는 정교의 『대한계년사』에 실린 요구를 소개하는데, 아전에게 일을 맡길 때 뇌물을 받지 말고 쓸 만한 사람을 고르라는 내용도 들어 있어요. 갑신정변의 개혁 정강이 능력에 따라 인재를 쓰는 사회를 내세웠다면, 농민군은 관리의 부정부패가 없는 사회를 바랐다고 비교해 볼 수 있어요. 이런 요구의 일부는 갑오개혁에 반영되었어요.
  pg: [176, 177]
  ev: [gabo-reform]
  note: 미래엔에는 '폐정 개혁'이라는 말이 없음(172쪽은 '집강소를 설치하여 개혁을 추진'). 갑오개혁에 일부 반영됐다는 점은 비상 177 활동·미래엔 172 와 맞음.
- n: 명성 황후
  k: 인물
  era: 근대
  y: 1895
  d: 고종의 왕비예요. 고종이 러시아의 힘을 빌려 일본의 간섭에서 벗어나려 하자, 영향력이 줄어든 일본이 1895년 경복궁에 쳐들어와 왕비를 시해했어요(을미사변).
  x: 을미사변 뒤 일본은 내각을 다시 꾸려 단발령 시행, 태양력 사용 같은 을미개혁을 추진했어요. 왕비 시해와 단발령에 분노한 유생들이 전국에서 의병을 일으켰고, 위협을 느낀 고종은 1896년 일본의 감시가 느슨해진 틈을 타 러시아 공사관으로 몸을 피했어요(아관 파천). 왕비는 1897년 '명성'이라는 시호를 받았고, 고종이 황제로 즉위하고 대한 제국을 선포한 직후 황후로 높여졌어요.
  pg: [176]
  mp: [172]
  ev: [eulmi-sabyeon]
- n: 서재필
  k: 인물
  era: 근대
  y: 1896
  d: 갑신정변을 일으킨 급진 개화파 가운데 한 사람이에요. 1896년 정부의 지원을 받아 『독립신문』을 창간하고, 개화파 관료들과 함께 독립 협회를 만들었어요.
  x: 갑신정변이 실패하자 일본을 거쳐 1885년 미국으로 건너갔고, 그곳에서 의학을 공부해 의사가 되었어요. 1895년 말 귀국해 이듬해 4월 『독립신문』을 순 한글로 펴냈고, 독립 협회는 독립문을 세우고 토론회와 만민 공동회를 열었어요. 그러나 수구파 정부와 열강의 압력으로 다시 미국으로 떠나야 했고, 3·1 운동 뒤에는 미국에서 한국의 독립을 국제 여론에 호소했어요.
  pg: [176, 178]
  mp: [171, 172]
  ev: [gapsin, independent-news, dongnip-club]
- n: 황성신문
  k: 책·기록
  era: 근대
  y: 1898
  d: 1898년 창간된 신문으로, 애국 계몽 운동 시기에 대중을 일깨우는 데 힘썼어요. 1905년에는 을사늑약의 부당함을 꾸짖는 논설 「시일야방성대곡」을 실었어요.
  x: 남궁억 등이 서울에서 창간했고, 한문에 익숙한 지식인층이 주로 읽었어요. 국한문을 섞어 썼다고 하지만 실제로는 한문에 한글 토를 단 정도의 문장이 많았어요. 「시일야방성대곡」을 실은 뒤 정간되고 사장 장지연 등 직원 10여 명이 체포되었어요. 국권 피탈 뒤 제호가 강제로 「한성신문」으로 바뀌었다가 1910년 9월 폐간되었어요.
  pg: [179, 194]
  ev: [siil]
  note: 창간 1898.9.5, 폐간 1910.9.14 — 한국민족문화대백과 '황성신문'(E0065214). 비상 194 는 잡화 광고 사진.
- n: 안창호
  k: 인물
  era: 근대
  y: 1907
  d: 독립 협회에서 활동했고, 1907년 비밀 결사 신민회를 만들어 평양에 대성 학교를 세우는 등 민족의 실력을 기르는 데 힘쓴 독립운동가예요. 뒤에 미국에서 대한인 국민회를 이끌었고 대한민국 임시 정부에서도 활동했어요.
  x: 신민회는 대성 학교·오산 학교에서 민족 교육을 하고, 자기 회사와 태극 서관을 꾸려 민족 자본을 키웠어요. 만주에는 한인 마을과 학교를 세워 오랫동안 독립군을 길러 낼 터전도 마련했지만, 105인 사건으로 조직이 드러나 1911년 해체되었어요. 평양의 대성 학교는 1912년에 첫 졸업생을 냈어요.
  pg: [179]
  mp: [173]
  ev: [sinminhoe, kna, provisional-gov]
- n: 위정척사 운동
  a: [위정척사]
  k: 사상·종교
  era: 근대
  d: '''바른 것(성리학적 질서)을 지키고 그릇된 것(서양의 문물과 사상)을 물리친다''는 생각으로 유생들이 개항과 개화 정책에 반대한 운동이에요. 상소를 올려 정부를 비판했고, 이 흐름은 뒤에 항일 의병 투쟁으로 이어졌어요.'
  x: 시기마다 반대한 대상이 바뀌었어요. 1860년대에는 이항로·기정진 등이 서양과 싸워야 한다며 통상에 반대했고, 1870년대에는 최익현이 강화도 조약에 반대하는 상소를 올렸어요. 1880년대에는 김홍집이 들여온 『조선책략』에 반발해 이만손 등 영남 유생들이 만인소를 올렸고, 1895년 을미사변과 단발령 뒤에는 유생들이 의병을 일으켜 일본에 맞섰어요.
  pg: [175]
  mp: [171]
  ev: [manin-so]
- n: 민족 자결주의
  k: 개념
  era: 일제 강점기
  y: 1918
  d: 각 민족이 다른 민족의 간섭 없이 자기 운명을 스스로 정할 권리가 있다는 주장이에요. 제1차 세계 대전이 끝날 무렵 미국 윌슨 대통령이 내세워 식민지 민족의 독립운동을 북돋웠고, 3·1 운동에도 영향을 주었어요.
  x: 미래엔 교과서는 이 원칙이 실제로는 제1차 세계 대전에서 진 나라들의 식민지에만 적용되었다고 덧붙여요. 그래도 아시아와 아프리카의 반제국주의 운동을 북돋웠고, 도쿄 유학생들의 2·8 독립 선언에도 영향을 주었어요. 이 원칙에 기대를 걸고 김규식이 파리 강화 회의에 독립 청원서를 냈는데, 그는 임시 정부가 세워지기 전 신한청년당 대표로 먼저 파리에 갔고 임시 정부가 수립된 뒤에는 그 대표로 활동했어요.
  pg: [181]
  mp: [176]
  ev: [march1, feb8]
  note: y 1918 은 두 교과서의 '제1차 세계 대전이 끝나갈 무렵'에 맞춘 해(윌슨의 14개조는 1918년 1월, 통설). 미래엔 176 은 '실제로는 패전국의 식민지에만 적용됐다'고 덧붙임.
- n: 교통국
  k: 제도
  era: 일제 강점기
  y: 1919
  d: 대한민국 임시 정부가 국내와 비밀리에 연락하려고 만든 통신 기관이에요. 연통제와 함께 독립운동 자금을 모으고 국내 소식을 임시 정부에 전했어요.
  x: 1919년 5월 만주 안둥(지금의 단둥)의 이륭양행 2층에 처음 자리 잡았어요. 연락만 한 것이 아니라 정부의 지령과 문서를 국내에 전하고, 국내 정보를 모아 보고하며, 독립운동 자금을 모으는 일도 맡았어요. 그러나 1920년 안둥 교통국장 등이 붙잡히면서 조직이 드러났고 1922년 무렵 활동이 거의 멈추었어요. 연통제와 교통국이 무너지자 임시 정부는 심한 자금난을 겪었어요.
  pg: [182]
  mp: [177, 180]
  ev: [provisional-gov, unified-gov]
  inst: kpg-1919
  note: 1919년 5월 교통부 관할로 만주 안둥현 이륭양행 2층에 처음 둠, 자금 모금·국내 정보 수집도 맡음 — 한국민족문화대백과 '교통부'(E0005597).
- n: 김원봉
  k: 인물
  era: 일제 강점기
  y: 1919
  d: 의열단을 만들어 일제의 주요 기관을 폭파하고 고위 관리와 친일파를 처단하는 의열 투쟁을 이끈 독립운동가예요. 중일 전쟁 뒤에는 조선 의용대를 조직했고, 그 일부를 이끌고 한국 광복군에 합류했어요.
  x: 의열단은 1919년 11월 만주 지린(길림)에서 만들어졌고, 창단 단원 13명 가운데 김원봉이 단장을 맡았어요. 단원들은 조선 총독부, 종로 경찰서, 동양 척식 주식회사 등을 공격했고, 1923년부터는 신채호가 쓴 「조선 혁명 선언」을 활동 지침으로 삼았어요. 중일 전쟁 뒤 만든 조선 의용대(1938)는 중국군과 손잡고 일본군에 맞섰고, 이 부대원들이 들어오면서 한국광복군은 한층 힘을 키웠어요.
  pg: [183]
  mp: [179]
  ev: [uiyeoldan, uiyongdae]
  note: y 는 의열단 조직 해(사건 uiyeoldan 1919-11-10). 광복군 합류는 비상 183 사진 설명·미래엔 179.
- n: 독립 공채
  k: 경제
  era: 일제 강점기
  y: 1919
  d: 대한민국 임시 정부가 모자란 독립운동 자금을 마련하려고 발행한 채권이에요. 국내외 동포가 낸 의연금과 함께 임시 정부의 활동을 뒷받침했어요.
  x: 임시 정부는 공채 판매와 함께 국내외 동포가 낸 의연금, 인구세 등으로 독립운동 자금을 마련했어요. 국내에서는 비밀 행정 조직인 연통제가 공채를 파는 일을 맡아 1920년 5월부터 공채 모집에 나섰어요. 그러나 1920년대 초 연통제와 교통국이 일제에 발각되어 무너지면서 자금을 모으기 어려워졌고, 임시 정부는 자금난을 겪었어요.
  pg: [182]
  mp: [177]
  ev: [provisional-gov]
- n: 민족 대표 33인
  a: [민족 대표]
  k: 인물
  era: 일제 강점기
  y: 1919
  d: 1919년 3월 1일 서울 종로에서 독립 선언서를 발표한 민족 지도자 33명이에요. 같은 날 학생과 시민들은 탑골 공원에서 만세 시위를 시작했어요.
  x: 천도교 15명, 기독교 16명, 불교 2명(한용운·백용성)의 종교계 인사로 이루어졌고, 독립 선언서 초안은 최남선이 썼어요. 3월 1일 이 가운데 29명이 종로의 태화관에 모여 독립 선언식을 연 뒤, 스스로 조선 총독부에 이 사실을 알려 출동한 일본 경찰에게 붙잡혀 갔어요. 미래엔 교과서는 '민족 대표들'이라고만 쓰고 33인이라는 수는 적지 않아요.
  pg: [181]
  mp: [176]
  ev: [march1]
  note: 미래엔은 '민족 대표들이 독립 선언문을 발표'로만 씀(33인이라는 수는 없음).
- n: 연통제
  k: 제도
  era: 일제 강점기
