  x: "4월 3일은 1948년 남조선 노동당 제주도당이 주도한 무장봉기가 시작된 날로, 이들은 단독 선거·단독 정부 반대와 통일 정부 수립 등을 내걸었어요. 봉기를 진압하려는 군인·경찰과 반공 단체가 무장대와 맞서는 동안 많은 주민이 휘말려, 제주 주민의 10%가 넘는 3만여 명이 목숨을 잃었어요. 추념일 지정은 2000년 특별법 제정, 2003년 정부의 공식 사과에 이어진 것으로, 희생자를 함께 기억하고 추모하는 날이에요."

