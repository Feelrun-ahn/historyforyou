  t: 대통령 선거에서 집권 여당 후보 박근혜가 당선돼 첫 여성 대통령이 됐어요. 뒤에 국정 농단 사태로 임기 중 파면됐어요.
  x: "2013년 출범한 박근혜 정부는 남북 사이의 신뢰를 쌓는 것을 핵심으로 하는 '한반도 신뢰 프로세스'를 대북 정책으로 내세웠어요. 그러나 북한의 핵 실험과 장거리 미사일 발사로 2016년 개성 공단 가동이 중단되었고, 비상 교과서는 이를 계기로 남북 관계가 더욱 나빠졌다고 써요. 2016년 국정 농단 사태가 드러나 촛불 집회가 이어졌고, 2017년 3월 헌법 재판소의 파면 결정으로 임기를 마치지 못했어요."

