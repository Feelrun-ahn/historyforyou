  x: "6월 10일, 여당이 노태우를 대통령 후보로 지명하는 날에 맞춰 '고문 살인 은폐 규탄 및 호헌 철폐 국민 대회'가 열리면서 시위가 전국으로 퍼졌어요. 6월 26일 국민 평화 대행진에는 전국 곳곳에서 100만 명이 넘게 참여할 만큼 학생뿐 아니라 많은 시민이 함께했어요. 6월 민주 항쟁 뒤 민주주의의 기본 질서가 자리 잡았고, 이후 선거를 통한 평화적 정권 교체도 여러 차례 이루어졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0068343"]
  note: '6·10 국민 대회는 경찰이 성공회 대성당을 봉쇄해 소수 인원으로 진행. 6월 26일 국민 평화 대행진에는 100만 명 이상 참여. 박종철 사건 날짜(1987.1.14)는 원문 미확인.'

