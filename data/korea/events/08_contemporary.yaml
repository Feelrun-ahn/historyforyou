# 현대 (1945~, 교과서 VI-3·VI-4). 양력. 6·25 전쟁의 전투는 data/wars/korea.yaml
# 처음 초안은 조사 파일(R5)에서 옮기고 교과서와 맞춰 고쳤어요. src 는 확인한 출처.

- id: liberation-0815
  n: '8·15 광복'
  d: '1945-08-15'
  c: 정치
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '일본이 연합국에 항복하면서 우리 민족은 일제의 식민 지배에서 벗어나 광복을 맞이했어요. 광복은 연합국의 승리와 함께 우리 민족이 끈질기게 벌인 독립운동의 결과였어요.'
  x: "광복 전부터 독립운동 세력은 새 나라를 준비했어요. 대한민국 임시 정부는 1941년 민주 공화정 수립과 보통 선거 실시 등을 담은 건국 강령을 발표했고, 연합국도 카이로 선언(1943)과 포츠담 선언(1945)에서 우리의 독립을 약속했어요. 한국광복군은 미군과 손잡고 국내로 쳐들어갈 작전까지 준비했지만, 일본이 먼저 항복해 버려 작전을 펼치지 못했어요. 광복 직후에는 38도선 남쪽에 미군이, 북쪽에 소련군이 들어오면서 우리 힘으로 정부를 세우기가 어려워졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0051909"]

- id: geonjun
  n: '조선 건국 준비 위원회 결성'
  d: '1945-08-15'
  e: '1945-09-07'
  c: 정치
  i: 2
  at: [126.986, 37.577]
  ap: 1
  p: '서울'
  t: '여운형이 안재홍 등과 함께 조선 건국 준비 위원회(건준)를 만들고 전국에 지부를 두어 치안과 행정을 맡았어요. 건준은 9월 6일 조선 인민 공화국 수립을 선포하고 이튿날 해체됐지만, 미군정은 조선 인민 공화국을 인정하지 않았어요.'
  x: "건준의 바탕은 여운형이 광복에 대비해 1944년 국내에서 비밀리에 만든 조선 건국 동맹이었어요. 광복 당일 아침 여운형은 조선 총독부의 엔도 정무총감과 만나 치안 유지와 일본인의 안전한 귀국을 돕는 조건으로 협상했고, 8월 17일 위원장 여운형, 부위원장 안재홍으로 중앙 조직을 발표했어요. 치안대를 두어 질서 유지에 나섰지만, 좌익 세력의 영향력이 커지면서 안재홍 등과 갈등이 생겼어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0051909", "https://encykorea.aks.ac.kr/Article/E0052184"]
  note: '결성일은 여운형·엔도 회담이 있던 8월 15일로 보는 것이 통설이고, 중앙 조직 발표는 8월 17일이야. 해산(조선 인민 공화국으로 전환)은 9월 7일.'

- id: soviet-army-north
  n: "소련군의 평양 진주"
  d: '1945-08-26'
  c: 정치
  i: 2
  at: [125.7535, 39.0194]
  ap: 1
  p: '평양'
  t: "8월 9일 일본에 선전 포고한 소련군은 함경북도(웅기·청진 등)로 먼저 들어왔고, 8월 26일 평양에 들어와 사령부를 두고 38도선 이북에서 군정을 실시했어요. 소련군은 직접 통치하기보다 공산주의자 중심의 인민 위원회를 내세웠어요."
  x: "38도선은 원래 미국이 제안해, 이남은 미군이 이북은 소련군이 일본군의 항복을 받고 무장을 해제하기로 나눈 군사 분할선이었어요. 하지만 두 나라가 각자 자신에게 협조하는 정권을 세우려 하면서 이 선이 남북을 가르는 경계로 굳어졌어요. 북쪽에서는 1946년 2월 김일성을 위원장으로 하는 북조선 임시 인민 위원회가 세워져 사실상 정부 역할을 했어요."
  src: ["https://www.newsis.com/view/NISX20200116_0000891358"]
  conf: mid
  note: '소련군은 8월 9일 한반도 북단에 진입, 8월 24일 사령관 치스차코프 함흥 도착, 8월 26일 평양 입성. 어느 날짜를 대표로 쓸지는 교과서마다 달라(대부분 ''8월 하순 평양 진주'').'

- id: us-military-government
  n: '미군의 남한 진주와 미군정 실시'
  d: '1945-09-09'
  e: '1948-08-15'
  c: 정치
  i: 2
  at: [126.9769, 37.5765]
  p: '조선 총독부 청사(뒤의 중앙청)'
  t: '미군이 9월 8일 인천에 상륙하고 9일 서울에 들어와 조선 총독부의 항복을 받았어요. 이후 38도선 이남에서는 미군정이 실시되어 대한민국 정부가 세워질 때까지 이어졌어요.'
  x: "미군정은 남한을 직접 다스리면서 조선 인민 공화국은 물론 대한민국 임시 정부도 정부로 인정하지 않았어요. 그래서 김구·김규식 등 임시 정부 요인들은 1945년 11~12월에 개인 자격으로 귀국해야 했어요. 또 조선 총독부의 행정 조직을 바탕으로 통치 기구를 만들고, 경찰도 일제 강점기에 일하던 한국인 경찰을 중심으로 다시 꾸렸어요. 1947년에는 한국인 기관을 남조선 과도 정부라고 불렀지만 최고 권한은 계속 미군이 가졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0019891"]

- id: moscow-conference
  n: "모스크바 3국 외무 장관 회의"
  d: '1945-12-16'
  e: '1945-12-25'
  c: 외교
  i: 2
  at: [37.6175, 55.752]
  ap: 1
  p: '소련 모스크바'
  t: '미국·영국·소련의 외무 장관이 모스크바에 모여 한반도에 임시 민주 정부를 세우고, 미·소 공동 위원회를 열며, 최고 5년간 신탁 통치를 협의하기로 결정했어요.'
  x: "신탁 통치란 유엔의 위임을 받은 나라가 스스로 다스릴 능력이 부족하다고 본 지역을 일정 기간 대신 다스리는 것을 말해요. 회의 결정은 먼저 임시 민주 정부를 세우고, 미·소 공동 위원회가 그 정부와 협의해 신탁 통치 방안을 마련한다는 순서였어요. 그런데 결정 소식이 국내에 전해질 때 동아일보는 소련이 신탁 통치를 주장했다고 사실과 다르게 보도했고, 이후 이 결정을 둘러싸고 좌우가 크게 갈라섰어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0066402"]
  note: '결정문(코뮤니케) 발표는 모스크바 시간 12월 28일. 국내에는 12월 27일 동아일보가 ''소련은 신탁 통치 주장''이라고 사실과 다르게 처음 보도했다는 것이 통설(이 보도일은 원문 미확인).'

- id: anti-trusteeship
  n: '신탁 통치 반대 운동'
  d: '1945-12'
  c: 정치
  i: 2
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: "신탁 통치 결정이 알려지자 김구 등 우익을 중심으로 신탁 통치 반대 운동이 거세게 일어났어요. 좌익은 처음에 반대했다가 모스크바 3국 외무 장관 회의 결정을 지지하는 쪽으로 바뀌면서 좌우 대립이 심해졌어요."
  x: "신탁 통치 소식이 국내에 알려진 직후인 1945년 12월 28일 김구와 임시 정부 세력이 각계 대표를 모았고, 이튿날 신탁 통치 반대 국민 총동원 위원회를 만들었어요. 좌익은 회의 결정의 정확한 내용이 알려진 뒤 임시 민주 정부를 세우는 것이 먼저라며 결정 전체를 지지했어요. 이후 우익은 비상 국민 회의, 좌익은 민주주의 민족 전선을 중심으로 뭉치면서 '반탁' 대 '모스크바 결정 지지'의 대립이 굳어졌고, 통일 정부를 세우기는 더 어려워졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0033478"]

- id: north-land-reform
  n: '북한의 토지 개혁'
  d: '1946-03-05'
  c: 경제
  i: 2
  at: [125.7535, 39.0194]
  ap: 1
  p: '평양'
  t: '북조선 임시 인민 위원회(1946년 2월 수립, 위원장 김일성)가 지주의 땅을 무상으로 몰수해 농민에게 무상으로 나누어 주는 토지 개혁을 실시했어요. 이어 주요 산업도 국유화했어요.'
  x: "토지 개혁 법령은 1946년 3월 5일 공포되었고, 몰수한 땅은 농사일에 고용되어 일하던 사람과 땅이 없거나 적은 농민에게 나누어 주었어요. 같은 해 북조선 임시 인민 위원회는 남녀평등권 법령(7월)과 중요 산업 국유화 법령(8월)도 발표했어요. 남한의 농지 개혁이 땅값을 치르고 사고판 '유상 매수·유상 분배'였던 것과 비교해 두면 헷갈리지 않아요."
  conf: mid
  note: '날짜(1946.3.5)와 ''무상 몰수·무상 분배''는 교과서 통설이지만 이번 조사에서 공신력 있는 원문은 열어 보지 못했어. 분배한 토지는 소유권이 아니라 경작권 중심이었다는 지적도 있어.'

- id: joint-commission-1
  n: '제1차 미·소 공동 위원회'
  d: '1946-03-20'
  e: '1946-05-06'
  c: 외교
  i: 2
  at: [126.9743, 37.5659]
  ap: 1
  p: '덕수궁 석조전'
  t: '모스크바 3국 외상 회의 결정에 따라 임시 정부 수립을 논의하려고 서울에서 미·소 공동 위원회가 열렸어요. 하지만 협의 대상 단체를 두고 미국과 소련이 맞서다 결렬되었어요.'
  x: "가장 큰 쟁점은 임시 정부를 세우려고 어떤 정당·사회단체와 협의할지였어요. 소련은 모스크바 3국 외무 장관 회의 결정을 지지하는 단체만 협의 대상으로 삼자고 했고, 미국은 신탁 통치에 반대한다는 이유만으로 빼는 것은 의사 표현의 자유를 해친다고 맞섰어요. 결국 5월 6일 무기한 휴회에 들어갔고, 이후 남한만의 정부를 먼저 세우자는 주장과 좌우 합작 운동이 나타났어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0019961"]
  note: '백과사전 본문은 장소를 ''서울''로만 적고 있어. 덕수궁 석조전은 통설상 회담 장소이지만 원문으로 직접 확인하지 못해서 approx 로 둠.'

- id: jeongeup-speech
  n: '이승만의 정읍 발언'
  d: '1946-06-03'
  c: 정치
  i: 2
  at: [126.8559, 35.5699]
  ap: 1
  p: '정읍'
  t: "미·소 공동 위원회가 멈춘 뒤 이승만은 정읍에서 '남방만이라도 임시 정부 혹은 위원회 같은 것을 조직하여'야 한다며 남한 단독 정부 수립을 주장했어요."
  x: "제1차 미·소 공동 위원회가 무기한 휴회한 뒤 다시 열릴 기미가 보이지 않자, 지방을 돌던 이승만이 정읍에서 한 말이에요. 그는 남쪽에 먼저 정부나 위원회를 만들고 38도선 이북에서 소련이 물러나도록 세계 여론에 호소하자고 했어요. 이후 이승만은 1946년 12월부터 이듬해 4월까지 미국에 머물며 남한 단독 정부 수립을 촉구하는 외교 활동을 벌였어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0073452"]
  note: '원문 표현은 ''남방만이라도''야. 교과서는 보통 ''남쪽만이라도''로 옮겨 써.'

- id: left-right-coalition
  n: '좌우 합작 운동'
  d: '1946-07-25'
  e: '1947'
  c: 통일
  i: 2
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '여운형과 김규식 등 중도 세력이 좌우 합작 위원회를 만들어 통일 정부를 세우려 했어요. 1946년 10월 좌우 합작 7원칙을 발표했지만 좌우 양쪽의 반대와 여운형 암살(1947) 등으로 성과를 거두지 못했어요.'
  x: "제1차 미·소 공동 위원회가 멈춘 뒤 미군정도 이 운동을 지원했어요. 좌익은 무상 몰수·무상 분배의 토지 개혁 등 5원칙을, 우익은 신탁 문제를 임시 정부 수립 뒤에 해결하자는 등 8원칙을 내세워 맞서자, 둘을 절충한 7원칙이 나왔어요. 7원칙에는 남북 좌우 합작에 의한 임시 정부 수립, 토지 개혁과 중요 산업 국유화, 친일파 처리 조례 추진 등이 담겼어요. 그러나 김구·이승만 세력과 박헌영 등 좌익이 적극적으로 호응하지 않아 힘을 얻지 못했어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0053123"]
  note: '7원칙 결정일은 백과사전 기준 1946년 10월 4일, 발표는 10월 7일로 쓰는 자료가 많아.'

- id: joint-commission-2
  n: '제2차 미·소 공동 위원회'
  d: '1947-05-21'
  e: '1947-10-21'
  c: 외교
  i: 2
  at: [126.9743, 37.5659]
  ap: 1
  p: '덕수궁 석조전'
  t: '미·소 공동 위원회가 다시 열렸지만 또 의견이 맞지 않아 결렬되었어요. 그러자 미국은 한국 문제를 유엔에 넘겼어요.'
  x: "1947년 5월 21일 다시 열린 회의는 서울과 평양을 오가며 남북의 정당·사회단체와 합동 회의를 갖기도 했어요. 하지만 협의 대상 단체를 둘러싼 미국과 소련의 대립은 이번에도 풀리지 않아 여름에는 사실상 결렬 상태가 되었어요. 그해 9월 미국이 한국 문제를 유엔 총회에 올렸고, 10월 21일 소련 대표단이 평양으로 떠나며 위원회는 끝났어요. 이로써 모스크바 결정에 따른 임시 정부 수립 방안은 무산되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0019961"]
  note: '6월에는 서울과 평양에서 번갈아 회의가 열렸어. 10월 21일 소련 대표단이 평양으로 떠나며 끝남.'

- id: un-korea-question
  n: '유엔 총회의 남북한 총선거 결의'
  d: '1947-11-14'
  e: '1948-02-26'
  c: 외교
  i: 2
  at: [-73.8467, 40.7459]
  ap: 1
  p: '미국 뉴욕 유엔 총회장(플러싱 메도)'
  t: '유엔 총회는 인구 비례에 따른 남북한 총선거를 결의하고 유엔 한국 임시 위원단을 보냈어요. 소련이 위원단의 북한 입국을 거부하자, 1948년 2월 26일 유엔 소총회는 ''선거가 가능한 지역''인 남한에서만 총선거를 하기로 결정했어요.'
  x: "유엔 총회 결의는 소련이 표결에 참여하지 않은 가운데 반대표 없이 통과됐어요. 오스트레일리아·캐나다·중국·프랑스·인도 등 8개국 대표로 꾸려진 유엔 한국 임시 위원단이 1948년 1월 서울에 왔지만, 소련과 북한은 유엔의 결정을 받아들이지 않았어요. 결국 남한에서만 선거를 치르게 되자, 통일 정부를 바라던 김구와 김규식은 북측 지도자를 만나는 남북 협상에 나섰어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0068340", "https://theme.archives.go.kr/next/unKorea/establishment.do"]
  note: '총회 장소(플러싱 메도)는 당시 유엔 총회장 위치를 따른 추정 좌표야. 위원단 서울 도착은 1948년 1월 7~9일로 자료마다 달라.'

- id: jeju-43
  n: '제주 4·3 사건'
  d: '1948-04-03'
  e: '1954-09-21'
  c: 정치
  i: 3
  at: [126.5222, 33.5133]
  ap: 1
  p: '제주(관덕정 일대)'
  t: '1948년 4월 3일 제주도에서 남조선 노동당 제주도당 무장대가 단독 선거 반대 등을 내걸고 봉기했어요. 이를 진압하는 과정에서 많은 주민이 희생되었고, 2000년 특별법이 만들어져 진상 규명과 명예 회복이 이루어지고 있어요.'
  x: "1947년 3·1절 기념 대회에서 경찰의 발포로 주민 6명이 숨진 뒤 총파업과 경찰·서북 청년회의 탄압이 이어지면서 갈등이 쌓여 있었어요. 5·10 총선거 때 제주도 3개 선거구 중 2곳은 투표자가 과반수에 못 미쳐 선거가 무효가 되었어요. 1948년 11월 계엄령이 내려진 뒤 한라산 중산간 마을이 불타는 강경 진압이 벌어졌고, 제주 주민의 10%가 넘는 3만여 명이 희생되었어요. 정부는 2003년 국가 권력의 잘못을 인정하고 공식 사과했고, 2014년 4월 3일을 희생자 추념일로 정했어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0051439"]
  note: '법적 정의상 기간은 1947년 3월 1일(3·1절 기념 대회 경찰 발포)부터 1954년 9월 21일(한라산 금족 지역 전면 개방)까지야. 지도 표시는 봉기일인 4월 3일 기준.'

- id: north-south-negotiation
  n: '남북 협상'
  d: '1948-04-19'
  e: '1948-04-30'
  c: 통일
  i: 2
  at: [125.756, 39.036]
  ap: 1
  p: '평양 모란봉 극장'
  t: '김구와 김규식은 남한만의 단독 선거에 반대하며 평양으로 가서 남북 지도자 회의(남북 협상)에 참석했어요. 외국 군대 철수와 단독 정부 반대를 담은 공동 성명을 냈지만 실제 효과는 없었어요.'
  x: "1948년 2월 김구와 김규식은 남북 요인 회담을 열어 통일 정부 수립을 논의하자는 편지를 북쪽의 김일성·김두봉에게 보냈어요. 북측은 이를 남북 정당·사회단체 대표자 연석회의로 바꾸어 제안했고, 4월 19일부터 평양 모란봉 극장에서 회의가 열린 뒤 4김 회담과 남북 지도자 협의회가 이어졌어요. 분단 직전 남북 정치 지도자들이 이념 차이를 넘어 통일 정부에 뜻을 모았다는 점에서 의미가 있다고 평가받아요."
  src: ["https://encykorea.aks.ac.kr/Article/E0070067"]
  note: '남북 연석회의(4.19~23, 모란봉 극장)와 남북 지도자 협의회·4김 회담(4.26~30)을 묶어 ''남북 협상''이라고 불러.'

- id: election-510
  n: '5·10 총선거'
  d: '1948-05-10'
  c: 정치
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '서울(남한 전역)'
  t: '우리나라 최초의 민주적 보통 선거로, 만 21세 이상 모든 국민이 투표해 임기 2년의 제헌 국회의원 198명을 뽑았어요. 김구·김규식 등 남북 협상파와 좌익 세력은 참여하지 않았어요.'
  x: "피선거권은 만 25세 이상에게 주어졌고, 투표율은 선거인 명부에 등록한 사람의 95.5%에 이를 만큼 높았어요. 원래 북한 몫 100석을 남겨 두고 남한 몫 200석을 뽑을 계획이었는데, 제주도 2개 선거구는 4·3 사건으로 선거가 무효가 되었어요. 당선자는 무소속이 85명으로 가장 많았고, 대한 독립 촉성 국민회 55명, 한국 민주당 29명 순이었어요. 이렇게 구성된 제헌 국회는 5월 31일 문을 열고 이승만을 국회 의장으로 뽑았어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0038395", "https://theme.archives.go.kr/next/unKorea/establishment.do"]
  note: '의석 200석 중 제주도 2개 선거구는 4·3 사건으로 선거가 무효가 되어 198명이 선출됐어(198명은 국가기록원 자료로 확인).'

- id: constitution-1948
  n: '제헌 헌법 공포'
  d: '1948-07-17'
  c: 정치
  i: 3
  at: [126.9769, 37.5765]
  p: '중앙청(제헌 국회 의사당)'
  t: "5월 31일 문을 연 제헌 국회가 3·1 운동의 독립 정신과 대한민국 임시 정부를 계승하고 민주 공화국 체제를 담은 헌법을 만들어 7월 17일 공포했어요. 이어 국회에서 이승만을 대통령으로 뽑았어요(7월 20일)."
  x: "제헌 헌법은 대한민국 임시 정부 헌법의 민주 공화정을 이어받았고, 정치·경제·사회·문화 모든 면에서 누구에게나 같은 기회를 주고 정치에 자유롭게 참여할 권리를 보장하려 했어요. 정부는 대통령 중심제에 의원 내각제 요소를 조금 더한 형태였고, 대통령은 국민이 아니라 국회가 4년마다 간접 선거로 뽑았어요. 헌법을 실은 관보 제1호의 날짜를 '대한민국 30년'으로 적은 것도 1919년 세운 임시 정부를 잇는다는 뜻이었어요."
  src: ["https://theme.archives.go.kr//next/koreaOfRecord/constitution.do", "https://theme.archives.go.kr/next/unKorea/establishment.do"]

- id: rok-government
  n: '대한민국 정부 수립'
  d: '1948-08-15'
  c: 정치
  i: 3
  at: [126.9769, 37.5765]
  p: '중앙청 광장'
  t: "1948년 8월 15일 대한민국 정부 수립이 선포되었어요. 같은 해 12월 유엔 총회는 대한민국 정부를 선거가 가능했던 한반도 내에서 유일한 합법 정부로 승인했어요."
  x: "정부 수립 선포로 3년 가까이 이어진 미군정이 끝나고, 대한민국은 대한민국 임시 정부의 독립 정신을 이은 민주 공화국으로 출발했어요. 국호 '대한민국'은 제헌 국회가 정했어요. 하지만 한 달도 안 되어 38도선 이북에도 따로 정권이 세워지면서 한반도에 체제가 다른 두 정부가 들어섰어요."
  src: ["https://theme.archives.go.kr/next/unKorea/establishment.do"]
  note: '유엔 총회 승인(1948년 12월 12일, 파리)은 날짜만 통설로 적었고 원문은 미확인. ''선거가 가능했던 지역에서 유일한 합법 정부''라는 결의 문구 해석에 대한 논쟁이 있어.'

- id: dprk-founding
  n: '조선 민주주의 인민 공화국 수립'
  d: '1948-09-09'
  c: 정치
  i: 2
  at: [125.7535, 39.0194]
  ap: 1
  p: '평양'
  t: '북한에서는 1948년 8월 최고 인민 회의 선거를 치르고 9월 9일 김일성을 수상으로 하는 조선 민주주의 인민 공화국 정권을 세웠어요. 이로써 남북에 서로 다른 정부가 들어서 분단이 굳어졌어요.'
  x: "북한은 1946년 2월 북조선 임시 인민 위원회를 세운 뒤, 1947년 2월 북조선 인민 회의를 만들고 김일성을 위원장으로 하는 북조선 인민 위원회로 개편했어요. 북조선 인민 회의는 1947년 11월부터 헌법 초안을 준비했고, 1948년 7월에는 이 헌법을 먼저 북쪽에서 실시하기로 결정했어요. 이처럼 북한도 남한과 비슷한 시기에 따로 정권 수립을 준비했어요."
  conf: mid
  note: '날짜는 통설이지만 이번 조사에서 공신력 있는 원문은 열어 보지 못했어.'

- id: banmin-teukwi
  n: '반민족 행위 처벌법 제정과 반민 특위 활동'
  d: '1948-09-22'
  e: '1949-10'
  c: 정치
  i: 3
  at: [126.9769, 37.5765]
  ap: 1
  p: '중앙청(제헌 국회의 반민족 행위 처벌법 제정)'
  t: '제헌 국회는 친일파를 처벌하려고 반민족 행위 처벌법을 만들고 반민족 행위 특별 조사 위원회(반민 특위)를 설치했어요. 그러나 이승만 정부의 비협조와 경찰의 반민 특위 습격(1949년 6월 6일) 등으로 활동이 위축되어 친일파 청산은 제대로 이루어지지 못했어요.'
  x: "반민 특위는 1949년 1월 기업가 박흥식을 시작으로 친일 혐의자들을 체포해 조사했어요. 비상 교과서에 따르면 총 682건을 조사해 221건을 기소했고 14명이 사형·징역 등을 선고받았지만, 특위 활동이 멈추면서 모두 풀려났어요. 특위에서 활동하던 일부 국회의원이 국회 프락치 사건으로 체포되었고, 공소 시효도 1949년 8월 말로 줄어들면서 그해 10월 특위는 해체되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0021478"]
  note: '위원회 설치 1948.10.22, 본격 활동 1949년 1월, 해체 1949년 10월.'

- id: yeosu-suncheon
  n: '여수·순천 10·19 사건'
  d: '1948-10-19'
  e: '1948-10-27'
  c: 정치
  i: 2
  at: [127.737, 34.744]
  ap: 1
  p: '여수(제14연대 주둔지)'
  t: '여수에 주둔하던 국군 제14연대 일부 군인들이 제주 4·3 사건 진압 명령을 거부하고 일으킨 사건이에요. 진압 과정에서 여수·순천 일대의 많은 민간인이 희생되었고, 이후 이승만 정부는 국가 보안법을 만들었어요(1948년 12월).'
  x: "제14연대 안의 좌익 세력이 제주도 출동을 앞두고 동족끼리 싸우게 되는 제주 출동에 반대하자며 부대원들을 움직였어요. 반란군은 10월 19일 여수, 20일 순천을 점령하고 전남 동부로 세력을 넓혔지만, 정부는 계엄령을 내리고 진압군을 보내 27일 여수까지 되찾았어요. 남은 세력은 지리산 등으로 들어가 활동을 이어 갔고, 정부는 군대 안의 좌익 세력을 가려내는 숙군을 벌였어요. 2021년에는 진상 규명과 희생자 명예 회복을 위한 특별법이 만들어졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0036410"]
  note: '명칭은 2021년 특별법에 따라 ''여수·순천 10·19 사건''(옛 ''여순 사건''). 국가 보안법 제정일(1948.12.1)은 원문 미확인.'

- id: land-reform
  n: '농지 개혁'
  d: '1949-06-21'
  e: '1950'
  c: 경제
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '이승만 정부는 ''경자유전''의 원칙에 따라 한 집에 3정보를 넘는 농지를 국가가 사들여 농민에게 나누어 주는 유상 매수·유상 분배 방식의 농지 개혁을 실시했어요. 1950년 3월 법을 고쳐 본격적으로 시행했고, 6·25 전쟁으로 잠시 멈췄다가 다시 이어졌어요.'
  x: "지주에게는 그 농지에서 평년에 거두는 수확량의 1.5배를 5년에 걸쳐 나누어 보상했고, 기업에 투자할 수 있도록 지가 증권을 주었어요. 땅을 받은 농민도 같은 값을 5년 동안 곡식으로 나누어 갚아야 했고, 다 갚기 전에는 땅을 팔거나 저당 잡힐 수 없었어요. 이 개혁으로 많은 농민이 자기 땅을 가진 자작농이 되었지만, 정부를 거치지 않고 지주가 소작인에게 직접 판 땅도 많았어요. 북한의 '무상 몰수·무상 분배' 토지 개혁과 구별해 두세요."
  src: ["https://encykorea.aks.ac.kr/Article/E0013191", "https://theme.archives.go.kr/next/koreaOfRecord/farmlandReform.do"]
  note: '보상은 평년작의 1.5배를 5년간 나누어 갚는 방식이었어.'

- id: kim-gu-assassination
  n: '김구 피살'
  d: '1949-06-26'
  c: 정치
  i: 1
  at: [126.967, 37.5684]
  p: '경교장'
  t: '통일 정부 수립을 주장하던 김구가 머물던 경교장에서 육군 장교 안두희의 총격으로 세상을 떠났어요.'
  x: "김구는 광복 뒤 신탁 통치 반대 운동을 이끌었고, 남한만의 단독 선거에 반대하며 남북 협상에 나섰던 인물이에요. 범인 안두희는 현역 육군 포병 소위이자 김구가 이끌던 한국 독립당의 당원이었는데, 재판 중에도 진급했고 1년여 만에 형 면제 처분을 받아 군에 돌아갔어요. 1995년 국회 진상 조사 보고서는 군 지휘부 일부가 암살에 관여했다고 보았어요. 7월 5일 열린 장례식에는 40만~50만 명이 모여 그를 추모했어요."
  conf: mid
  note: '날짜·장소는 통설이지만 이번 조사에서 공신력 있는 원문은 열어 보지 못했어.'

- id: nogeun-ri
  n: '노근리 사건'
  d: '1950-07-26'
  e: '1950-07-29'
  c: 전쟁
  i: 1
  at: [127.9008, 36.239]
  ap: 1
  p: '노근리 쌍굴다리'
  t: '6·25 전쟁 초기 충북 영동 노근리 철교 아래에서 피란민들이 미군의 공격으로 희생된 사건이에요. 전쟁 중에는 이처럼 많은 민간인이 희생되었어요.'
  x: "피란민들은 영문도 모른 채 총격을 받았고, 이 사건은 오랫동안 한국과 미국 모두에서 제대로 드러나지 않았어요. 비상 교과서 그래프에 따르면 6·25 전쟁 동안 남한의 민간인 인명 피해는 약 99만 명으로, 군인 피해(약 62만 명)보다 많았어요."
  conf: mid
  note: '날짜는 통설(7월 25일~29일로 쓰는 자료도 있음). 원문 미확인. 전쟁 담당 파일과 겹칠 수 있음.'

- id: geochang
  n: '거창 사건'
  d: '1951-02-09'
  e: '1951-02-11'
  c: 전쟁
  i: 1
  at: [127.857, 35.608]
  ap: 1
  p: '거창 신원면'
  t: "공비 토벌 작전 중이던 국군이 경남 거창 신원면 일대의 주민들을 학살한 사건이에요. 6·25 전쟁 중 국군에 의한 민간인 희생의 대표적인 사례예요."
  x: "1951년 2월 9일부터 11일까지 국군 제11사단 제9연대 3대대가 신원면 일대 주민 719명을 총살했는데, 그중 359명이 15세 이하 어린이였어요. 진상을 조사하러 가던 국회 조사단은 공비로 위장한 군인들의 총격을 받고 되돌아가야 했어요. 군사 재판에서 관련자들이 유죄를 받았지만 이듬해 모두 특별 사면되었고, 1996년에야 희생자의 명예를 회복하는 특별법이 만들어졌어요."
  conf: mid
  note: '날짜는 통설, 원문 미확인. 좌표는 면 단위 추정.'


- id: peace-line
  n: '평화선 선포'
  d: '1952-01-18'
  c: 외교
  i: 1
  at: [131.8647, 37.2411]
  p: '독도(평화선 안)'
  t: '이승만 정부가 ''인접 해양의 주권에 대한 대통령 선언''으로 평화선을 선포했어요. 우리 영토인 독도는 평화선 안쪽에 포함되었어요.'
  x: "평화선은 해안에서 평균 60마일까지의 바다에 우리 주권이 미친다고 밝혀, 수산 자원을 보호하고 일본 어선과의 분쟁을 막으려 한 것이었어요. 일본은 공해 자유의 원칙에 어긋난다고 반발하며 독도가 선 안에 들어간 것까지 문제 삼았지만, 독도는 명백한 우리 고유의 영토예요. 정부는 선 안에서 조업하는 외국 어선을 붙잡게 했고, 평화선은 1965년 한일 협정이 맺어지면서 사실상 없어졌어요."
  conf: mid
  note: '선포 자체는 부산 임시 수도에서 이루어졌어. 지도에는 의미를 살려 독도에 표시함. 날짜는 통설, 원문 미확인. 중학교 교과서에 따라 다루지 않을 수도 있어.'

- id: balchwe-amendment
  n: '발췌 개헌'
  d: '1952-07-04'
  c: 정치
  i: 2
  at: [129.0178, 35.1027]
  ap: 1
  p: '부산 임시 수도(피란 국회)'
  t: '국회에서 다시 대통령으로 뽑히기 어려워지자 이승만 정부는 6·25 전쟁 중 임시 수도 부산에 계엄령을 내리고 국회의원들을 위협해, 대통령 직선제를 담은 개헌안을 기립 표결로 통과시켰어요.'
  x: "1950년 5월 제2대 국회의원 선거에서 이승만 지지 세력이 많이 떨어지자, 국회에서 대통령을 뽑는 방식으로는 다시 당선되기 어려워졌어요. 정부가 낸 직선제 개헌안은 1952년 1월 국회에서 크게 부결되었고, 국회는 오히려 내각 책임제 개헌안을 냈어요. 그러자 정부는 5월 계엄을 선포하고 국회의원이 탄 통근 버스를 헌병대로 끌고 가는 등 국회를 압박했어요(부산 정치 파동). 결국 정부안과 국회안을 뽑아 섞은 '발췌' 개헌안이 통과되었고, 8월 직선제 선거에서 이승만이 다시 대통령이 되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0021623", "https://theme.archives.go.kr//next/koreaOfRecord/constitution.do"]
  note: '부산 정치 파동: 1952.5.25 계엄, 5.26 국회의원 버스 연행. 공포일(7월 7일)은 원문 미확인. 피란 국회 정확한 건물 위치는 확인하지 못해 approx.'

- id: dokdo-volunteers
  n: '독도 의용 수비대 활동'
  d: '1953-04-20'
  e: '1956-12-30'
  c: 외교
  i: 1
  at: [131.8647, 37.2411]
  p: '독도'
  t: '홍순칠 등 울릉도 주민들이 독도 의용 수비대를 만들어 일본의 침범을 막으며 우리 땅 독도를 지켰어요. 1956년 말 경찰에 경비 임무를 넘겼어요.'
  x: "6·25 전쟁에 참전했던 홍순칠을 중심으로 33명(홍순칠 외 32명)이 모였어요. 당시 일본은 순시선을 보내 독도에 일본 영토라는 표지를 세우는 등 침범을 되풀이했고, 울릉도 주민들의 고기잡이도 위협받았어요. 수비대는 서도에 머물며 경비를 서다가 1954년 8월 다가온 일본 순시선을 물리치기도 했어요. 2005년에는 독도 의용 수비대 지원법이 만들어져 이들의 공을 기리고 있어요."
  conf: mid
  note: '결성·상륙일(1953.4.20)과 인계일(1956.12.30)은 통설, 원문 미확인. 중학교 역사② 수록 여부는 출판사마다 달라.'

- id: pow-release
  n: '반공 포로 석방'
  d: '1953-06-18'
  c: 전쟁
  i: 2
  at: [129.0756, 35.1796]
  ap: 1
  p: '부산 등 포로수용소'
  t: '휴전에 반대하던 이승만 대통령은 북한으로 돌아가기를 거부한 반공 포로 약 2만 7천 명을 일방적으로 석방했어요.'
  x: "포로를 어떻게 돌려보낼지는 정전 협상이 2년 넘게 길어진 큰 이유였어요. 유엔군은 포로가 원하는 곳으로 가게 하자는 자유 송환을, 공산군은 모두 본국으로 돌려보내자는 강제 송환을 주장했어요. 이승만 대통령은 미국에 미리 알리지 않고 한국인 포로 감시원들에게 명령해 포로를 풀어 주며 정전 회담을 막으려 했어요. 결국 정전을 묵인하는 대가로 한미 상호 방위 조약 체결과 군사·경제 원조 약속을 받아 냈지만, 한국 정부는 정전 협정에 서명하지 않았어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0065859", "https://theme.archives.go.kr/next/625/process/armistice.do"]
  note: '석방 인원은 백과사전 2만 7천여 명, 국가기록원 2만 6천 명. 여러 수용소에서 동시에 이루어져 좌표는 부산 대표 지점.'

- id: mutual-defense-treaty
  n: '한미 상호 방위 조약 체결'
  d: '1953-10-01'
  c: 외교
  i: 2
  at: [-77.0364, 38.8951]
  ap: 1
  p: '미국 워싱턴 D.C.'
  t: '정전 직후 한국과 미국은 한쪽이 공격받으면 함께 대응한다는 한미 상호 방위 조약을 맺었어요. 이 조약으로 미군이 한국에 계속 머물게 되었어요.'
  x: "1953년 8월 서울에서 가조인하고 10월 1일 워싱턴에서 정식으로 서명했으며, 1954년 11월부터 효력이 생겼어요. 어느 한쪽이 외부의 무력 공격을 받으면 두 나라가 각자의 헌법 절차에 따라 함께 대처하기로 했고, 미국은 한국 영토와 그 부근에 육·해·공군을 둘 권리를 얻었어요. 휴전 뒤 북한의 재침에 대비하려는 한국의 요구로 맺어졌고, 지금까지 한미 동맹의 바탕이 되고 있어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0061616", "https://encykorea.aks.ac.kr/Article/E0066894", "https://theme.archives.go.kr/next/koreaOfRecord/mutualDefense.do"]
  note: '가조인 1953.8.8 서울, 정식 조인 10.1 워싱턴, 발효 1954.11.18.'

- id: sasaoip-amendment
  n: '사사오입 개헌'
  d: '1954-11-29'
  c: 정치
  i: 2
  at: [126.977, 37.5677]
  ap: 1
  p: '태평로 국회 의사당'
  t: '자유당은 초대 대통령에 한해 중임 제한을 없애는 개헌안이 1표 차로 부결되자, 사사오입(반올림) 논리를 내세워 이틀 뒤 가결로 뒤집었어요. 이를 계기로 이승만의 장기 집권이 가능해졌어요.'
  x: "1954년 11월 27일 표결에서 재적 의원 203명 중 135명이 찬성해, 3분의 2인 135.333…명을 채우려면 필요한 136명에 1표가 모자라 부결이 선포되었어요. 그러자 자유당은 사사오입(반올림)하면 135명이면 충분하다고 주장했고, 야당 의원들이 퇴장한 가운데 부결을 가결로 뒤집었어요. 이 일에 반발한 야당 세력이 뭉쳐 1955년 민주당을 만들었고, 이승만은 1956년 선거에서 다시 대통령에 당선되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0025681", "https://theme.archives.go.kr//next/koreaOfRecord/constitution.do"]
  note: '11월 27일 표결(찬성 135, 재적 203의 3분의 2는 135.33…), 11월 29일 번복 가결 및 공포. 당시 국회가 태평로 의사당을 쓰고 있었다는 점은 기억에 의존해 approx.'

- id: jinbodang-incident
  n: '진보당 사건'
  d: "1958-01"
  e: '1959-07-31'
  c: 정치
  i: 1
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '평화 통일을 주장하며 1956년 대통령 선거에서 많은 표를 얻은 조봉암과 진보당 간부들이 간첩 혐의로 체포되었어요. 조봉암은 1959년 사형되었고, 2011년 재심에서 무죄 판결을 받았어요.'
  x: "조봉암은 1956년 대통령 선거에서 216만여 표를 얻었고, 그해 11월 진보당을 만들었어요. 검찰은 진보당이 내세운 평화 통일론이 대한민국의 존립을 부정한다며 기소했어요. 1심에서는 징역 5년이 선고되었지만 2심과 대법원에서 사형이 선고되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0054703"]
  note: '간부 연행 1958.1.12, 조봉암 체포 1.14.'

- id: daegu-228
  n: '대구 2·28 민주 운동'
  d: '1960-02-28'
  c: 민주화
  i: 2
  at: [128.5934, 35.8656]
  ap: 1
  p: '대구 도심'
  t: '정부가 야당의 선거 유세에 학생들이 가지 못하게 일요일 등교를 지시하자, 대구의 고등학생들이 이에 항의하며 거리로 나섰어요. 4·19 혁명으로 이어지는 학생 시위의 시작이 되었어요.'
  x: "이후 3·15 부정 선거 규탄 시위와 4·19 혁명에도 중고등학생들이 많이 참여했어요. 비상 교과서에는 4·19 혁명 때 서울 수송 초등학교 학생들의 시위 사진과, 끝까지 부정 선거에 맞서겠다는 중학생의 글이 실려 있어요."
  src: ["https://www.imaeil.com/page/view/2023022214583102097"]
  conf: mid
  note: '출처가 지역 신문이라 mid. 2018년 국가 기념일로 지정됨.'

- id: election-315
  n: '3·15 부정 선거와 마산 의거'
  d: '1960-03-15'
  e: '1960-04-13'
  c: 민주화
  i: 3
  at: [128.573, 35.205]
  ap: 1
  p: '마산'
  t: '자유당 정부는 이기붕을 부통령에 당선시키려고 사전 투표, 3인조·5인조 공개 투표 등 대규모 부정 선거를 저질렀어요. 마산에서 이에 항의하는 시위가 일어났고, 4월 11일 김주열 학생의 시신이 마산 앞바다에서 발견되자 시위가 다시 크게 일어났어요.'
  x: "1950년대 후반에는 미국의 무상 원조가 줄어 살림이 어려워졌고, 오래 이어진 독재와 부정부패에 국민들이 지쳐 있었어요. 교과서에는 사전 투표·공개 투표 말고도 야당 참관인 쫓아내기, 투표함 바꿔치기, 완장 찬 사람들로 공포 분위기 만들기 같은 부정 수법이 나와요. 3월 15일 마산 시위는 경찰이 강경하게 진압했고, 시위 도중 사라졌던 김주열 학생의 죽음이 알려지자 시위가 전국으로 번졌어요."
  src: ["https://weekly.khan.co.kr/article/201503241342211", "https://theme.archives.go.kr/next/pages/new_newsletter/2017/html/vol_100/sub01.html"]
  note: '2차 마산 의거(4.11~13)까지를 end 로 둠.'

- id: april-revolution
  n: '4·19 혁명'
  d: '1960-04-19'
  e: '1960-04-26'
  c: 민주화
  i: 3
  at: [126.977, 37.574]
  ap: 1
  p: '서울 세종로·경무대 앞'
  t: '부정 선거에 항의하는 학생과 시민의 시위가 전국으로 퍼져 4월 19일 절정에 이르렀어요. 경찰의 발포로 많은 사람이 희생되었지만, 대학 교수단의 시국 선언(4월 25일)에 이어 4월 26일 이승만 대통령이 물러났어요.'
  x: "4월 19일 서울의 대규모 시위에 경찰이 총을 쏘자 정부는 계엄령을 선포했지만 시위는 멈추지 않았어요. 대학생뿐 아니라 중고등학생, 초등학생과 시민까지 거리로 나섰어요. 이승만은 5월 하와이로 망명했고, 허정 과도 정부를 거쳐 내각 책임제 헌법이 만들어졌어요. 4·19 혁명은 학생과 시민의 힘으로 독재 정권을 무너뜨린 민주 혁명으로, 지금의 헌법 전문에도 4·19 민주 이념을 계승한다고 적혀 있어요."
  src: ["https://theme.archives.go.kr/next/pages/new_newsletter/2017/html/vol_100/sub01.html"]

- id: jang-myon-cabinet
  n: '장면 내각 출범'
  d: '1960-08'
  e: '1961-05-16'
  c: 정치
  i: 2
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '4·19 혁명 뒤 헌법을 고쳐(1960년 6월 15일) 내각 책임제와 양원제를 도입했고, 총선거를 거쳐 윤보선 대통령과 장면 국무총리가 이끄는 정부가 들어섰어요. 장면 내각은 5·16 군사 정변으로 무너졌어요.'
  x: "새 헌법에 따라 1960년 7월 29일 치러진 총선거에서 민주당이 크게 이겼어요. 장면 내각은 3·15 부정 선거 책임자를 벌하는 법을 따로 마련하고 경제 개발 5개년 계획안도 짜는 등 개혁에 나섰어요. 하지만 민주당이 윤보선 중심의 구파와 장면 중심의 신파로 갈라져 다투었고, 9개월 동안 세 번이나 개각할 만큼 불안정해 큰 성과를 거두지 못했어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0043345"]
  conf: mid
  note: '개헌일 1960.6.15 과 5·16 붕괴는 원문 확인, 총리 인준(8.19)·내각 구성(8.23) 날짜는 미확인이라 일(d)은 비워 둠.'

- id: may16-coup
  n: '5·16 군사 정변'
  d: '1961-05-16'
  c: 정치
  i: 3
  at: [126.959, 37.517]
  ap: 1
  p: '한강 인도교·서울 도심'
  t: '박정희를 중심으로 한 일부 군인들이 군사 정변을 일으켜 정권을 잡고 반공과 경제 재건 등을 내건 ''혁명 공약''을 발표했어요. 이후 국가 재건 최고 회의가 통치했고, 1963년 박정희가 대통령에 당선되었어요.'
  x: "정변은 5월 16일 새벽 3시쯤 시작되어 곧 서울을 장악했고, 군인들은 방송국을 점령해 군사 혁명 위원회 이름으로 성명을 발표했어요. 혁명 공약 6개 항에는 반공을 국시로 삼고 민생고를 해결하며, 과업을 이루면 정권을 정치인에게 넘기고 군 본연의 임무로 돌아가겠다는 약속이 담겼어요. 군사 혁명 위원회는 국가 재건 최고 회의로 이름을 바꿔 2년여 동안 군정을 실시했고, 1962년 12월 국민 투표로 대통령 중심제와 단원제 국회로 헌법을 고쳤어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0073479"]
  note: '한강 인도교 통과는 통설로 좌표 대표 지점으로 씀(원문은 ''수도 서울 장악''까지만 확인).'

- id: five-year-plan
  n: '제1차 경제 개발 5개년 계획'
  d: '1962'
  e: '1966'
  c: 경제
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '정부가 주도해 경제 개발 5개년 계획을 세우고, 값싼 노동력을 바탕으로 한 경공업 제품 수출에 힘써 빠른 경제 성장을 이루었어요. 1970년대 제3·4차 계획에서는 중화학 공업을 키웠어요.'
  x: "제1차 계획(1962~1966)은 자립 경제의 기반을 만드는 것을 목표로 했고, 연평균 7.8% 성장으로 목표를 넘어섰어요. 1960년대에는 풍부한 노동력을 바탕으로 의류·신발·합판 같은 경공업 제품을 수출했고, 울산 등에 산업 단지를 만들었어요. 수출액은 1961년 4천만 달러에서 1977년 100억 달러로 크게 늘었어요. 하지만 외국에서 빌린 돈(외채)이 크게 늘고 노동자들이 낮은 임금과 긴 노동 시간에 시달리는 문제도 생겼어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0002782"]

- id: june3-protest
  n: '6·3 시위'
  d: '1964-06-03'
  c: 민주화
  i: 2
  at: [126.977, 37.574]
  ap: 1
  p: '서울 세종로 일대'
  t: '식민 지배에 대한 사과와 정당한 배상 없이 한일 국교 정상화를 서두르는 데 반대하는 학생 시위가 6월 3일 절정에 이르렀어요. 정부는 비상계엄을 선포해 시위를 진압했어요.'
  x: "한일 회담은 1951년에 시작됐지만 오랫동안 타결되지 못하다가, 1962년 김종필 특사가 일본 외상과 청구권 문제를 정치적으로 절충하면서 급히 진전되었어요. 학생과 시민들은 이를 굴욕적인 외교라고 비판하며 1964년 3월 24일부터 시위를 벌였어요. 6월 3일 서울에서만 대학생 1만 2천여 명이 시위에 나서자 정부는 그날 밤 서울 전역에 비상계엄을 선포했고, 7월 말 계엄이 풀릴 때까지 348명이 구속되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0042107"]
  note: '시위는 1964년 3월 24일부터 시작되었어.'

- id: vietnam-dispatch
  n: '베트남 파병'
  d: '1964-09-11'
  e: '1973-03-23'
  c: 외교
  i: 2
  at: [106.7009, 10.7769]
  ap: 1
  p: '베트남 남부(사이공)'
  t: '미국의 요청으로 정부는 베트남 전쟁에 의료 부대를 시작으로 전투 부대까지 파병했어요. 미국으로부터 경제·군사 원조를 받아 경제 성장에 도움이 되었지만, 많은 군인이 죽거나 다쳤고 고엽제 피해와 민간인 피해 문제도 남았어요.'
  x: "1964년 9월 이동 외과 병원 요원과 태권도 교관단 140명이 처음 파견되었고, 1965년 3월 비전투 부대인 비둘기 부대에 이어 그해 가을부터 해병 여단과 수도 사단(맹호 부대) 같은 전투 부대가 베트남에 도착했어요. 파병 기간에는 우리 기업들이 베트남에 나가 사업을 벌이고 상품 수출도 늘어 경제적으로 이득을 보았어요. 한국군은 1973년 3월 모두 철수했어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0040962"]
  note: '1964.9.11 부산항 출항, 1965.10 전투 부대 파병, 1973.3.23 철수 완료. 브라운 각서(1966.3.7)는 원문 미확인.'

- id: korea-japan-treaty
  n: '한일 협정 체결'
  d: '1965-06-22'
  c: 외교
  i: 2
  at: [139.7425, 35.6735]
  ap: 1
  p: '일본 도쿄'
  t: '한국과 일본이 한일 기본 조약 등을 맺어 국교를 정상화했어요. 일본으로부터 받은 자금은 경제 개발에 쓰였지만, 식민 지배에 대한 사과와 배상 문제가 해결되지 않아 지금까지 논란이 이어지고 있어요.'
  x: "한일 협정은 기본 조약과 함께 어업 협정, 재일 교포의 법적 지위 협정, 문화재 협정, 재산·청구권 및 경제 협력 협정 등으로 이루어졌어요. 1951년 예비 회담부터 따지면 타결까지 14년이 걸렸어요. 반대하는 쪽은 평화선을 양보해서는 안 되며 일본의 경제적 식민지가 될 수 있다고 주장했고, 실제로 이 협정으로 평화선은 사실상 없어졌어요. 반대 운동은 1965년 12월 비준서를 주고받을 때까지 이어졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0042107"]
  note: '조인 장소(도쿄)는 통설, 원문에서는 날짜만 확인. 독도 문제는 협정에서 다루지 않았어.'

- id: three-term-amendment
  n: '3선 개헌'
  d: '1969-09-14'
  e: '1969-10-17'
  c: 정치
  i: 2
  at: [126.977, 37.568]
  ap: 1
  p: '국회 제3별관(태평로)'
  t: '박정희 정부는 대통령이 세 번까지 연이어 할 수 있도록 헌법을 고쳤어요. 개헌안은 야당 의원들이 없는 사이 국회 별관에서 변칙적으로 통과되었고 국민 투표로 확정되었어요.'
  x: "3선 개헌에는 대통령이 세 번까지 연이어 할 수 있게 하는 것과 함께, 국회의원이 국무총리나 국무 위원을 겸할 수 있게 하는 내용도 들어 있었어요. 개헌 뒤 치러진 1971년 대통령 선거에서 박정희는 김대중 후보와 치열한 접전 끝에 세 번째로 당선되었어요. 이 박빙의 선거 결과는 이듬해 10월 유신의 배경 가운데 하나로 꼽혀요."
  src: ["https://theme.archives.go.kr//next/koreaOfRecord/constitution.do"]
  conf: mid
  note: '국가기록원은 ''1969년 10월''만 확인. 9월 14일 국회 제3별관 변칙 통과는 통설, 원문 미확인.'

- id: saemaul-movement
  n: '새마을 운동'
  d: '1970-04-22'
  c: 경제
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '전국 농촌(제창 장소는 수도로 둠)'
  t: '근면·자조·협동을 내세운 새마을 운동이 시작되어 농촌의 길을 넓히고 지붕을 개량하는 등 생활 환경이 바뀌었어요. 나중에는 도시와 공장으로도 퍼졌어요.'
  x: "정부는 1970년 전국 3만 3천여 개 마을에 시멘트를 똑같은 양씩 나누어 주고, 이듬해에는 성과가 좋은 1만 6천여 마을을 골라 시멘트와 철근을 더 주는 방식으로 마을끼리 경쟁하게 했어요. 초가집 없애기와 마을 길·농로 넓히기에서 시작해 농가 소득을 늘리는 사업으로 이어졌어요. 농촌을 살기 좋게 만들고 도시와의 소득 차이를 줄이려 했지만, 정부가 체제를 유지하는 데 활용했다는 비판도 있어요."
  src: ["https://theme.archives.go.kr/next/koreaOfRecord/saemaeul.do"]
  note: '4월 22일 전국 지방 장관 회의에서 ''새마을 가꾸기''가 제창됨. 회의 장소는 확인하지 못해 수도 좌표로 둠. 정부 주도로 유신 체제를 뒷받침하는 데 이용되었다는 평가도 있어.'

- id: gyeongbu-expressway
  n: '경부 고속 국도 개통'
  d: '1970-07-07'
  c: 경제
  i: 2
  at: [127.039, 37.4685]
  ap: 1
  p: '서울 기점(양재)'
  t: '1968년에 공사를 시작한 서울과 부산을 잇는 428km의 경부 고속 국도가 개통되어 전국이 1일 생활권에 가까워졌어요.'
  x: "공사는 약 2년 5개월 만에 끝났는데, 연인원 900만 명이 동원되었고 공사 중 77명이 목숨을 잃었어요. 먹고살기도 힘든데 고속 도로가 필요하냐는 반대 목소리도 적지 않았지만, 개통 뒤 서울과 부산을 4시간대에 오갈 수 있게 되었어요. 고속 도로를 따라 공업 단지와 산업 단지가 들어서면서 경제 개발 계획을 뒷받침하는 핵심 교통로가 되었어요."
  src: ["https://theme.archives.go.kr/next/koreaOfRecord/exway.do"]
  note: '선(line) 형태 사건이라 기점 좌표만 둠.'

- id: jeon-tae-il
  n: '전태일 분신'
  d: '1970-11-13'
  c: 사회
  i: 2
  at: [127.008, 37.5693]
  ap: 1
  p: '평화시장'
  t: '평화시장의 재단사 전태일이 ''근로 기준법을 지켜라''라고 외치며 스스로 몸을 불살랐어요. 이 사건은 노동자의 열악한 현실을 알리고 노동 운동이 성장하는 계기가 되었어요.'
  x: "전태일은 1969년 대통령에게 보내려고 쓴 글에서 하루 14시간인 작업 시간을 10~12시간으로 줄이고, 한 달에 이틀뿐인 휴일을 일요일마다 쉬게 해 달라며 이것이 인간으로서 최소한의 요구라고 호소했어요. 그의 죽음을 계기로 노동 문제에 대한 사회의 관심이 높아졌어요. 그 뒤 노동 운동이 차츰 커져, 1980년대 후반에는 노동자들이 스스로 노동조합을 세우고 더 나은 일터와 임금을 요구하며 대규모로 나섰어요."
  conf: mid
  note: '날짜·장소는 통설, 이번 조사에서 공신력 있는 원문은 열어 보지 못했어.'

- id: july4-joint-statement
  n: '7·4 남북 공동 성명'
  d: '1972-07-04'
  c: 통일
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '서울·평양 동시 발표'
  t: "남북한이 자주·평화·민족 대단결이라는 통일 3대 원칙에 합의해 분단 이후 처음으로 공동 성명을 발표했어요. 앞서 1971년에는 남북 적십자 회담이 시작되었어요."
  x: "1970년대 들어 냉전이 누그러지고 평화 공존을 바라는 국제 분위기가 생기자, 남북은 비밀리에 특사를 주고받은 끝에 서울과 평양에서 같은 날 성명을 발표했어요. 남쪽에서는 이후락 중앙정보부장이 발표했어요. 이때 합의한 자주·평화·민족 대단결은 그 뒤 남북이 대화하고 교류할 때마다 기준이 되었어요. 다만 같은 해 연말 남한에서는 유신 헌법이, 북한에서는 사회주의 헌법이 만들어져 남북 모두 권력이 한 사람에게 더 집중되었어요."
  conf: mid
  note: '날짜는 통설, 원문 미확인. 이후 남과 북이 각각 유신 체제와 사회주의 헌법으로 독재를 강화하는 데 이용했다는 평가가 교과서에 함께 나와.'

- id: yushin
  n: '10월 유신과 유신 헌법'
  d: '1972-10-17'
  e: '1972-12-27'
  c: 정치
  i: 3
  at: [126.9769, 37.5765]
  ap: 1
  p: '중앙청'
  t: '박정희 정부는 비상계엄을 선포하고 국회를 해산한 뒤 유신 헌법을 만들었어요. 통일 주체 국민 회의가 대통령을 뽑고 임기를 6년으로 늘렸으며, 대통령에게 긴급 조치권과 국회의원 3분의 1 추천권 등 강력한 권한을 주었어요.'
  x: "1971년 대통령 선거에서 김대중 후보와 접전을 벌인 박정희는 안보 위기와 남북 대화 등을 내세워 1972년 10월 17일 헌법 일부의 효력을 멈추는 비상조치를 했어요. 유신 헌법은 11월 국민 투표로 확정되었고, 12월 통일 주체 국민 회의에서 박정희가 다시 대통령으로 뽑혔어요. 대통령은 중임 제한이 없어졌고 대법원장과 법관을 임명하는 권한까지 가졌지만, 국회는 국정 감사권을 잃고 회의 기간도 줄어 힘이 크게 약해졌어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0032425", "https://theme.archives.go.kr//next/koreaOfRecord/constitution.do"]
  note: '12월 23일 통일 주체 국민 회의에서 대통령 선출, 12월 27일 취임과 함께 유신 체제 출범.'

- id: north-socialist-constitution
  n: '북한의 사회주의 헌법 제정'
  d: '1972-12-27'
  c: 정치
  i: 2
  at: [125.7535, 39.0194]
  ap: 1
  p: '평양'
  t: '북한은 사회주의 헌법을 만들어 국가 주석 자리를 새로 두고 김일성에게 권력을 집중시켰어요. 이로써 김일성 유일 지배 체제가 굳어졌어요.'
  x: "북한은 1960년대부터 김일성을 우상화하는 작업을 본격적으로 벌였어요. 사회주의 헌법으로 새로 생긴 주석은 최고 인민 회의에서 뽑는 국가 수반으로, 국가 주권의 최고 지도 기관인 중앙 인민 위원회를 이끌고 국방 위원회 위원장이자 군대 전체의 최고 사령관을 겸했어요. 남한에서 유신 헌법이 만들어진 것과 같은 해의 일이에요."
  conf: mid
  note: '날짜는 통설, 원문 미확인.'

- id: posco-heavy-industry
  n: '중화학 공업화와 포항 제철 준공'
  d: '1973-07-03'
  c: 경제
  i: 2
  at: [129.38, 36.005]
  ap: 1
  p: '포항 제철소'
  t: '1970년대 정부는 철강·조선·자동차·석유 화학 같은 중화학 공업을 집중적으로 키웠어요. 그 대표로 포항 종합 제철 공장이 완공되었어요.'
  x: "1970년대 정부는 철강·기계·전자·조선·석유 화학 같은 중화학 공업을 집중 육성하면서 수출 주도형 정책을 이어 갔어요. 제3차 경제 개발 계획 기간(1972~1976)에도 연평균 9.7%의 높은 성장을 이루었고, 1976년 수출액은 5년 전의 약 7배인 78억 달러에 이르렀어요. 다만 개발에 필요한 돈을 외국에서 많이 빌리면서 외채가 크게 늘어나는 문제도 있었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0002782"]
  conf: mid
  note: '중화학 공업화 선언(1973.1.12)과 포항 제철 1기 준공일(1973.7.3)은 통설, 원문 미확인.'

- id: march1-democracy-declaration
  n: '3·1 민주 구국 선언'
  d: '1976-03-01'
  c: 민주화
  i: 2
  at: [126.9873, 37.5633]
  p: '명동 성당'
  t: '명동 성당에서 열린 3·1절 기념 미사에서 재야인사들이 유신 체제를 비판하고 민주주의 회복을 요구하는 선언을 발표했어요. 1973년의 개헌 청원 100만인 서명 운동 등과 함께 대표적인 유신 반대 운동이에요.'
  x: "유신 체제에 맞서 재야인사와 종교인, 학생들이 민주주의 회복과 헌법 개정을 외쳤지만, 정부는 긴급 조치를 거듭 내려 이런 목소리를 눌렀어요. 특히 1975년의 긴급 조치 9호는 앞선 조치들을 하나로 모아 통제를 더 강하게 했어요. 3·1 민주 구국 선언은 이런 분위기 속에서 3·1절에 맞춰 유신 체제를 공개적으로 비판한 사건이에요."
  conf: mid
  note: '날짜·장소는 통설, 원문 미확인. 개헌 청원 100만인 서명 운동은 1973년 12월 24일 시작(원문 미확인).'

- id: export-10b
  n: '수출 100억 달러 달성'
  d: '1977-12'
  c: 경제
  i: 3
  at: [126.9769, 37.576]
  ap: 1
  p: '서울'
  t: '수출 중심의 경제 성장으로 1977년 한 해 수출액이 100억 달러를 넘어섰어요.'
  x: "1961년 4천만 달러였던 수출액은 1971년 10억 달러를 넘었고, 그로부터 6년 만에 100억 달러를 돌파했어요. 1960년대에는 의류·신발·합판 같은 경공업 제품이, 1970년대에는 철강·조선 같은 중화학 공업 제품의 수출도 늘었어요. 정부는 이를 기념해 서울에 수출 100억 달러 기념 아치를 세웠어요."
  conf: mid
  note: '연도는 통설, 정확한 기념일(12월 22일로 알려짐)은 원문 미확인이라 d 는 비워 둠.'

- id: yh-incident
  n: 'YH 무역 사건'
  d: '1979-08-09'
  e: '1979-08-11'
  c: 민주화
  i: 2
  at: [126.948, 37.54]
  ap: 1
  p: '신민당 당사'
  t: '회사의 일방적인 폐업에 항의하던 YH 무역 여성 노동자들이 야당인 신민당 당사에서 농성하다 경찰에 강제 해산되었고, 이 과정에서 노동자 한 명이 숨졌어요. 이 사건 뒤 신민당 총재 김영삼이 국회에서 제명되었어요.'
  x: "YH 무역은 1966년에 세워진 가발 수출 회사로, 1970년대 초에는 종업원이 4천여 명에 이를 만큼 컸어요. 회사가 1979년 8월 6일 폐업을 공고하자 노동자 187명이 8월 9일 새벽 신민당 당사에 모여 농성했어요. 8월 11일 새벽 경찰 1천여 명이 당사에 들어가 강제 해산하는 과정에서 노동자 김경숙이 숨졌어요. 이 사건은 김영삼 제명과 부마 민주 항쟁으로 이어지며 유신 체제가 무너지는 도화선이 되었다고 평가돼요."
  src: ["https://encykorea.aks.ac.kr/Article/E0038945"]
  note: '당사 위치(마포)는 원문에 없어 approx. 김영삼 제명은 1979.10.4.'

- id: buma-uprising
  n: '부마 민주 항쟁'
  d: '1979-10-16'
  e: '1979-10-20'
  c: 민주화
  i: 3
  at: [129.079, 35.2335]
  ap: 1
  p: '부산대학교·부산 도심과 마산'
  t: '김영삼 제명 등에 반발해 부산대 학생들의 시위로 시작된 반유신 항쟁이 시민들의 참여로 부산과 마산으로 퍼졌어요. 정부는 부산에 비상계엄, 마산·창원에 위수령을 내려 진압했어요.'
  x: "1979년 부산은 정부의 긴축 정책으로 부도율이 전국의 2.4배에 이를 만큼 경제가 어려웠고, 시위대는 '부가가치세를 철폐하라'는 구호도 외쳤어요. 10월 16일 부산대 학생 약 500명으로 시작된 시위는 곧 5천여 명으로 불어났고, 17일부터는 시민들이 합세해 밤 시위가 크게 번졌어요. 18일에는 마산의 경남대 학생들이 나섰고, 19일 밤에는 고등학생까지 약 8천 명이 참여했어요. 항쟁이 일어난 지 열흘 만에 10·26 사태가 일어났고, 2019년부터 10월 16일은 국가 기념일이 되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0024157"]
  note: '마산 시위는 경남대 학생 중심(10.18~19). 지도에 두 지점을 쓰려면 마산 약 35.21,128.57 추가.'

- id: oct26-incident
  n: '10·26 사태'
  d: '1979-10-26'
  c: 정치
  i: 3
  at: [126.9708, 37.5856]
  ap: 1
  p: '궁정동 중앙정보부 안가'
  t: '부마 민주 항쟁의 처리를 두고 권력 내부의 갈등이 커진 가운데, 중앙정보부장 김재규가 박정희 대통령을 살해했어요. 이로써 유신 체제가 무너졌어요.'
  x: "10월 26일 밤 서울 궁정동의 중앙정보부 안가에서 열린 만찬 자리에서 일어난 일로, 경호실장 차지철도 함께 숨졌어요. 부마 민주 항쟁을 두고 차지철은 강경 진압을, 김재규는 상대적으로 온건한 대응을 주장했는데, 박정희가 차지철의 손을 들어 주자 갈등이 폭발했어요. 사건 뒤 최규하 과도 정부는 제주도를 뺀 전국에 비상계엄을 선포했고, 이후 사건 수사를 이끈 전두환 등 신군부가 권력을 잡는 계기가 되었어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0034013", "https://mediahub.seoul.go.kr/archives/2012636"]
  note: '안가 터는 1993년 철거되어 무궁화동산이 됨. 좌표는 기억에 의존해 approx.'

- id: dec12-incident
  n: '12·12 사태'
  d: '1979-12-12'
  c: 정치
  i: 2
  at: [127.004, 37.537]
  ap: 1
  p: '한남동 육군 참모 총장 공관 등'
  t: '전두환·노태우 등 신군부 세력이 대통령의 재가 없이 계엄 사령관인 육군 참모 총장을 강제로 연행하고 군권을 장악했어요. 이후 법원은 이 사건을 군사 반란으로 판결했어요(1997).'
  x: "10·26 사태로 박정희 대통령이 피살되고 유신 체제가 무너지면서 민주화에 대한 기대가 높아지던 때에 일어났어요. 당시 전두환은 보안 사령관이자 10·26 사태 수사를 맡은 합동 수사 본부장이었고, 그를 중심으로 한 군인들이 불법으로 군대를 움직였어요. 이렇게 군을 장악한 신군부는 이듬해 5월 비상계엄을 전국으로 확대하며 정치권력까지 손에 넣어 갔어요."
  src: ["https://encykorea.aks.ac.kr/Article/E0034018"]
  note: '명칭: 교과서는 주로 ''12·12 사태'', 백과사전 표제어는 ''12·12 군사반란''.'

- id: may18-gwangju
  n: '5·18 민주화 운동'
  d: '1980-05-18'
  e: '1980-05-27'
  c: 민주화
  i: 3
  at: [126.92, 35.1466]
  p: '광주 옛 전남도청·금남로'
  t: '신군부가 5월 17일 비상계엄을 전국으로 확대하자, 광주에서 학생과 시민들이 민주주의를 요구하며 일어났어요. 계엄군의 무력 진압에 맞서 시민군을 조직해 저항했으나 5월 27일 전남도청에서 진압되었고, 관련 기록물은 2011년 유네스코 세계 기록 유산이 되었어요.'
  x: "5월 18일 휴교령에 항의해 전남대 앞에 모인 학생들의 시위로 시작되었어요. 신군부가 보낸 공수 부대가 학생과 시민을 마구 때리며 진압하자 시민들까지 거리로 나와 맞섰고, 계엄군은 광주를 둘러싸 바깥과 오가지 못하게 막았어요. 이 과정에서 많은 시민이 희생되었고, 진상 규명과 책임자 처벌 요구는 1990년대 '역사 바로 세우기' 재판으로 이어졌어요."
