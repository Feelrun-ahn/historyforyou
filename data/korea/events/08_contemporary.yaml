  p: '서울'
  t: "신군부는 국가 보위 비상 대책 위원회를 만들어 권력을 장악했고, 전두환은 1980년 8월 통일 주체 국민 회의에서 대통령으로 뽑혔어요. 10월 27일 대통령 선거인단이 7년 단임의 대통령을 뽑는 헌법을 공포했고, 이 헌법에 따라 1981년 다시 대통령이 되었어요. 언론 통제와 강압 정치를 하면서 야간 통행금지 해제, 교복 자율화 같은 유화 정책도 폈어요."
  x: "새 헌법은 국민이 아니라 대통령 선거인단이 대통령을 뽑는 간선제였기 때문에, 이후 '대통령 직선제 개헌'이 민주화 운동의 가장 큰 요구가 되었어요. 전두환 정부는 비판적인 교수와 기자들을 일터에서 쫓아내고 신문사·방송사를 강제로 합치는 등 사회를 강하게 통제했어요. 헷갈리기 쉬운데, 1980년 8월에는 유신 헌법의 통일 주체 국민 회의에서, 1981년에는 새 헌법의 대통령 선거인단에서 대통령으로 뽑혔어요."
