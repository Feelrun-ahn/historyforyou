# 선사 ~ 삼국·가야 (교과서 I 단원, II-1 의 전쟁 밖 사건)
# 전투는 data/wars/korea.yaml 에 있어요 (살수 대첩, 안시성 싸움, 황산벌 전투 등)

- id: paleolithic
  n: 구석기 시대 시작
  d: -3400
  dt: 약 70만 년 전
  c: 문화
  i: 3
  at: [127.06, 38.01]
  p: 연천 전곡리 유적
  pg: 11
  nomap: 1
  t: 한반도와 만주에서 사람이 살기 시작했어요. 연천 전곡리에서는 주먹도끼가 발견됐어요.
  x: "이 시기에는 추운 빙하기와 따뜻한 간빙기가 번갈아 찾아왔어요. 사람들은 사냥과 채집으로 먹을거리를 구하며 무리 지어 옮겨 다녔고, 동굴이나 바위 그늘, 강가의 막집에서 살았어요. 돌을 깨뜨려 만든 뗀석기를 썼는데, 처음엔 찍개·주먹도끼 하나로 여러 일을 하다가 점차 긁개·밀개, 후기에는 슴베찌르개처럼 작고 날카로운 석기를 만들었어요. 1978년 전곡리에서 동아시아 최초로 아슐리안 계통 주먹도끼가 나와, 동아시아의 구석기 문화가 뒤떨어졌다는 서양 학자들의 주장이 뒤집혔어요."

- id: neolithic
  n: 신석기 시대 시작
  d: -3400
  dt: 약 1만 년 전
  c: 문화
  i: 3
  at: [127.13, 37.56]
  p: 서울 암사동 유적
  pg: 12
  nomap: 1
  t: 간석기와 빗살무늬 토기를 쓰고 농경과 목축을 시작했어요. 강가나 바닷가에 움집을 짓고 정착해 살았어요.
  x: "약 1만 년 전 기후가 오늘날과 비슷해지면서 사슴·멧돼지처럼 작고 날쌘 동물과 물고기·조개가 많아졌고, 사람들의 생활도 이에 맞춰 바뀌었어요. 돌보습으로 땅을 일구고 갈돌과 갈판으로 곡식을 갈았으며, 그물과 이음낚시로 물고기를 잡았어요. 토기에 음식을 조리하고 저장했는데 덧무늬 토기도 이 시기 토기예요. 가락바퀴로 실을 뽑고 뼈바늘로 옷을 지었으며 그물도 만들었어요. 해나 특정 동물, 영혼을 섬기는 믿음도 생겼어요."

- id: bronze-age
  n: 청동기 문화의 보급
  d: -2000
  e: -1500
  dt: 기원전 2000년경~1500년경
  c: 문화
  i: 3
  at: [126.88, 36.25]
  ap: 1
  p: 부여 송국리 유적 등
  pg: 14
  t: 만주와 한반도에 청동기 문화가 퍼졌어요. 군장이 나타났고 지배자의 무덤인 고인돌을 만들었어요.
  x: "청동은 구하기 힘들고 다루기도 까다로워 지배층의 무기·장신구나 제사 도구(청동 검·청동 거울·청동 방울)에 주로 쓰였고, 농사에는 여전히 반달 돌칼 같은 석기를 썼어요. 조·보리 등을 기르고 일부에서는 벼농사도 시작해 남는 생산물이 생기자 사유 재산과 빈부 격차, 계급이 나타났어요. 군장은 제사도 이끌었는데(제정일치), 부족 간 전쟁에 대비해 마을에 울타리와 도랑을 둘렀어요. 한반도에는 세계 고인돌의 약 40%가 있어요."

- id: gojoseon-founding
  n: 고조선 건국
  d: -2333
  c: 정치
  i: 3
  at: [125.75, 39.02]
  ap: 1
  p: 아사달 (위치는 학설이 갈려요)
  pg: 16
  t: 『동국통감』에 따르면 단군왕검이 기원전 2333년에 고조선을 세웠어요. 고조선은 랴오닝 지방의 독자적인 청동기 문화를 바탕으로 성장했어요.
  x: "건국 이야기는 고려 때 일연이 쓴 『삼국유사』에 실려 있어요. 환웅이 바람·비·구름을 다스리는 신하와 함께 곡식·형벌 등을 맡았다는 내용에서 농경 사회와 계급 사회의 모습을, 곰이 여자가 된 웅녀 이야기에서 특정 동물을 숭배하던 집단과의 결합을 읽어 내기도 해요. '단군'은 제사장, '왕검'은 정치 지도자를 뜻해 제정일치 사회였음을 보여 줘요. 비파형 동검과 탁자식 고인돌이 나오는 지역으로 고조선의 문화 범위를 짐작해요."

- id: iron-age
  n: 철기 문화의 보급
  d: -500
  dt: 기원전 5세기경
  c: 문화
  i: 3
  at: [126.08, 40.88]
  ap: 1
  p: 평북 위원 (명도전 출토지)
  pg: 19
  t: 중국에서 철기가 들어와 농기구와 무기를 철로 만들었어요. 기원전 1세기 무렵에는 널리 쓰였어요.
  x: "철은 청동보다 구하기 쉽고 단단해서, 철제 농기구로 땅을 깊게 갈아 생산량이 늘고 날카로운 철제 무기로 전쟁도 잦아졌어요. 이때부터 청동기는 주로 의식용 도구나 장신구로 쓰였어요. 철기를 잘 다룬 부족이 이웃을 정복하거나 연합하면서 부여·고구려·옥저·동예·삼한 같은 나라가 생겨났어요. 명도전 같은 중국 화폐와 경남 창원 다호리 유적의 붓은 중국과의 교역과 한자 사용을 보여 줘요. 미래엔 교과서는 철기가 기원전 4~3세기경 전해졌다고 써요."

- id: gojoseon-king
  n: 고조선, 왕 칭호 사용
  d: -400
  dt: 기원전 4세기경
  c: 정치
  i: 1
  at: [125.75, 39.02]
  ap: 1
  p: 고조선
  pg: 16
  t: 고조선이 '왕'이라는 칭호를 쓰고 중국의 연과 맞설 만큼 강해졌어요.
  x: "이 무렵 고조선은 왕위를 세습하고 상·대부·장군 같은 관직을 두며 국가의 틀을 갖춰 갔어요. 중국이 혼란하던 시기에 많은 사람이 고조선으로 옮겨 오면서 철기 문화도 함께 들어왔어요. 하지만 연과 맞서다 침입을 받기도 했는데, 미래엔 교과서는 기원전 3세기 초 연의 침입으로 서쪽 영토를 잃었다고 써요."

- id: wiman
  n: 위만, 고조선의 왕이 됨
  d: -194
  c: 정치
  i: 3
  at: [125.75, 39.02]
  ap: 1
  p: 왕검성
  pg: 16
  t: 중국에서 망명해 온 위만이 준왕을 몰아내고 왕이 됐어요. 위만 집권 이후 고조선은 철기 문화를 바탕으로 중계 무역을 하며 번성했어요.
  x: "위만은 한이 들어선 뒤 연 지역에서 무리를 거느리고 고조선으로 넘어온 인물인데, 본래 고조선 계통 사람이었다고 보는 견해도 있어요. 위만이 왕위에 오른 뒤 고조선은 철기 문화 등 한의 앞선 문물을 적극 받아들여 농업이 발달하고 군사력도 커졌어요. 특히 한반도 남쪽 나라들이 한과 직접 교역하지 못하게 막고 그 사이에서 이익을 얻었는데, 이것이 한과 부딪히는 원인이 됐어요."

- id: gojoseon-fall
  n: 고조선 멸망, 한 군현 설치
  d: -108
  c: 전쟁
  i: 3
  at: [125.75, 39.02]
  ap: 1
  p: 왕검성
  pg: 16
  t: 한 무제가 쳐들어와 1년 가까운 싸움 끝에 수도 왕검성이 함락됐어요. 한은 고조선의 일부 지역에 군현을 두었어요.
  x: "한은 북방의 흉노가 고조선과 손잡는 것을 경계했고, 고조선이 남쪽 나라들과 한의 직접 교역을 막자 갈등이 커졌어요. 고조선에 다녀간 한의 사신이 피살된 일을 계기로 기원전 109년 한 무제가 육지와 바다로 쳐들어왔어요. 싸움이 길어지자 지배층이 분열해 일부가 한에 항복했고 우거왕도 살해됐어요. 한은 낙랑·진번·임둔·현도의 4군(한사군)을 두었지만 유민의 저항으로 점차 사라졌고, 그중 낙랑군은 313년까지 오래 남았어요."

- id: silla-founding
  n: 신라 건국
  d: -57
  c: 정치
  i: 3
  at: [129.22, 35.83]
  ap: 1
  p: 경주 (사로국)
  pg: 31
  t: 경주 지역 6촌이 모여 세운 사로국에서 신라가 시작됐어요. 박·석·김의 세 성씨가 번갈아 왕(이사금)이 됐어요.
  x: "미래엔 교과서는 박혁거세를 중심으로 한 이주민 세력이 경주·울산 지역의 토착 세력과 합쳐 나라를 세웠다고 설명해요. 이사금은 나이 많은 사람(연장자)을 뜻하는 말로, 초기에는 왕의 힘이 강하지 않았음을 보여 줘요. 왕의 칭호는 거서간·차차웅·이사금을 거쳐 내물왕 때 마립간, 지증왕 때 중국식 '왕'으로 바뀌었는데, 칭호가 바뀔수록 왕권이 강해졌어요."

- id: goguryeo-founding
  n: 고구려 건국
  d: -37
  c: 정치
  i: 3
  at: [125.40, 41.32]
  ap: 1
  p: 졸본 (오녀산성 추정)
  pg: 21
  t: 부여에서 내려온 주몽 세력과 압록강 중류의 토착민이 힘을 합쳐 졸본에서 고구려를 세웠어요.
  x: "초기 고구려는 다섯 부족이 연합한 연맹 왕국이어서, 왕 아래 상가·고추가 같은 대가들이 있었고 나라의 중요한 일은 제가 회의에서 함께 정했어요. 졸본은 산과 계곡이 많아 농사지을 땅이 부족했기 때문에 고구려는 일찍부터 정복 전쟁으로 세력을 넓혔고, 말타기·활쏘기 같은 무예를 중시했어요. 10월에는 동맹이라는 제천 행사를 열었고, 신랑이 신부 집 뒤의 서옥에서 지내는 서옥제라는 혼인 풍습이 있었어요."

- id: baekje-founding
  n: 백제 건국
  d: -18
  c: 정치
  i: 3
  at: [127.12, 37.53]
  ap: 1
  p: 위례성 (서울 풍납동 토성 추정)
  pg: 28
  t: 고구려와 부여에서 내려온 이주민이 한강 유역의 토착민과 함께 위례성에서 백제를 세웠어요.
  x: "미래엔 교과서는 온조와 비류 등 남쪽으로 내려온 고구려계 이주민이 세웠다고 설명해요. 백제는 마한의 작은 나라에서 출발했는데, 한강 유역은 농사가 잘되고 바닷길로 중국 문물을 받아들이기 좋아 빠르게 성장했어요. 서울 석촌동의 계단식 돌무지무덤이 고구려 초기 무덤과 닮아, 건국 세력이 고구려와 같은 계통이라는 고고학적 증거로 여겨져요. 서울 풍납동 토성과 몽촌토성이 한성 시기 도성으로 추정돼요."

- id: gungnae
  n: 고구려, 국내성 천도
  d: 3
  dt: 1세기 초 (『삼국사기』 3년)
  c: 정치
  i: 2
  at: [126.18, 41.13]
  p: 국내성 (중국 지린성 지안)
  pg: 25
  t: 고구려가 압록강 가의 국내성으로 도읍을 옮겼어요. 427년 평양으로 옮길 때까지 400여 년 동안 도읍이었어요.
  x: "국내성이 자리한 압록강 중류(지금의 중국 지린성 지안)는 물자가 풍부하고 교통이 편리했어요. 가까운 산에는 환도산성을 쌓아 평지에 있는 국내성을 지키며 비상시 군사 거점으로 삼았어요. 이 일대에는 돌을 계단식으로 쌓은 장군총, 벽화로 유명한 무용총 같은 고분과 광개토 대왕릉비가 남아 있어요. 고구려는 이곳을 중심으로 주변을 정복하며 평야 지대로 나아가려 애썼어요."

- id: geumgwan-founding
  n: 금관가야 건국
  d: 42
  c: 정치
  i: 3
  at: [128.87, 35.24]
  ap: 1
  p: 김해
  pg: 33
  t: 김수로가 김해 지역에 금관가야를 세웠다고 전해져요. 변한 지역의 소국들은 가야 연맹을 이루었고 초기에는 금관가야가 이끌었어요.
  x: "가야 연맹은 소국들이 저마다 독자성을 지닌 채 가장 강한 나라가 이끄는 구조였어요. 낙동강 하구의 금관가야는 가까운 철 산지 덕분에 질 좋은 철기를 만들었고, 기름진 들판에 철제 농기구를 써서 곡식도 넉넉히 거뒀어요. 바다로 나가기 좋은 자리라 낙랑과 왜에 철을 팔고 그 사이를 잇는 중계 무역으로 힘을 키웠어요. 김해 대성동 고분군은 건국 이야기가 깃든 구지봉·김수로왕릉 가까이 있고, 여기서 나온 다양한 껴묻거리가 활발한 교역을 보여 줘요."

- id: taejo-goguryeo
  n: 고구려, 태조왕 즉위
  d: 53
  c: 정치
  i: 3
  at: [126.18, 41.13]
  p: 국내성
  pg: 25
  t: "태조왕 때 고구려는 동해안의 옥저를 정복하고 요동 진출을 꾀하며 크게 성장했어요. 계루부 고씨가 왕위를 이어 가게 됐어요."
  x: "정복 전쟁을 거치며 왕의 권력이 강해지자, 5부 가운데 계루부의 고씨가 왕위를 독점해 대대로 이어 갔어요. 여러 부족이 힘을 나누던 연맹에서 왕을 중심으로 뭉친 나라로 한 걸음 나아간 거예요. 비상 교과서는 이후 왕위의 부자 상속까지 확립되며 왕권이 안정됐다고 정리해요. 소금과 해산물이 풍부했던 옥저는 이후 고구려에 공물을 바쳤어요."

- id: jindaebeop
  n: 고구려, 진대법 실시
  d: 194
  c: 사회
  i: 3
  at: [126.18, 41.13]
  ap: 1
  p: 국내성
  pg: 25
  t: "고국천왕 때(국상 을파소) 봄부터 가을까지 나라의 곡식을 빌려주고 겨울 10월에 갚게 하는 진대법을 실시했어요."
  x: "귀족에게 곡식을 빌렸다가 갚지 못한 농민은 노비가 되기 쉬웠는데, 나라가 곡식을 빌려주는 진대법으로 농민이 노비로 떨어지는 것을 막을 수 있었어요. 홀아비·과부·고아·홀로 사는 노인처럼 스스로 살기 어려운 사람을 찾아 돕게 한 것이 시작이었어요. 고국천왕은 계루부·소노부 등 부족 단위의 5부를 행정 구역인 5부로 바꾸고 지방에 관리를 보내는 등 왕권 강화에도 힘썼어요."

- id: goi-baekje
  n: 백제, 고이왕의 체제 정비
  d: 260
  dt: 3세기 중반
  c: 정치
  i: 2
  at: [127.12, 37.53]
  ap: 1
  p: 위례성
  pg: 28
  t: 고이왕이 6좌평과 관리의 등급을 마련하고 등급에 따라 관복 색을 달리했어요. 주변 마한 소국도 복속했어요.
  x: "좌평은 나랏일을 나누어 맡은 최고 관직이에요. 백제의 관등은 16등급이었다고 전하는데, 등급에 따라 관복 색을 달리해 서열을 한눈에 구분하게 한 것은 왕 아래 관리 조직이 체계적으로 갖춰졌다는 뜻이에요. 고이왕은 마한 소국들을 아울러 한반도 중부 지역을 확보했어요. 이렇게 3세기 중반에 국가 운영의 기본 틀이 마련됐어요."

- id: nangnang-fall
  n: 고구려, 낙랑군을 멸망시킴
  d: 313
  c: 전쟁
  i: 3
  at: [125.73, 38.99]
  ap: 1
  p: 낙랑군 (평양 남쪽 토성)
  pg: 25
  t: 미천왕이 한 군현의 하나인 낙랑군을 몰아내고 대동강 유역을 차지했어요.
  x: "미천왕은 중국이 혼란한 틈을 타 압록강 하구 지역을 차지하고 낙랑군과 대방군을 차례로 점령했어요(미래엔 교과서). 낙랑군은 고조선 멸망 뒤 한이 세운 군현 가운데 가장 오래 남은 곳으로, 중국 문화가 한반도로 들어오는 창구 역할을 했어요. 이로써 400년 넘게 이어진 중국 군현 세력이 한반도에서 사라졌고, 고구려는 평야 지대로 나아가는 발판을 얻었어요."

- id: geunchogo
  n: 백제 근초고왕의 영토 확장
  d: 369
  dt: 4세기 중반
  c: 정치
  i: 2
  at: [127.12, 37.53]
  ap: 1
  p: 한성
  pg: 29
  t: 근초고왕이 마한의 남은 세력을 복속해 남해안까지 나아가고 가야에 영향력을 미쳤어요. 중국 동진, 왜와도 교류했어요.
  x: "북쪽으로는 고구려 평양성을 공격해 고국원왕을 전사시키고 황해도 일부까지 차지해(371) 백제의 전성기를 이끌었어요. 동진·가야·왜를 잇는 해상 교역로를 확보하고 이런 외교 관계로 고구려를 견제했어요. 일본에 전하는 칠지도는 백제 왕세자가 왜왕에게 준 칼로, 이 시기에 만들어진 것으로 추정해요. 역사서 『서기』도 근초고왕 때 편찬됐어요."

- id: pyongyang-371
  n: 백제의 평양성 공격, 고국원왕 전사
  d: 371
  c: 전쟁
  i: 2
  at: [125.75, 39.02]
  ap: 1
  p: 평양성
  pg: 25
  t: 근초고왕이 고구려 평양성을 공격해 고국원왕이 전사했어요. 백제는 황해도 지역 일부를 차지했어요.
  x: "고국원왕은 이보다 앞서 342년 전연의 침입으로 수도를 함락당한 데다, 남쪽에서는 백제와 황해도 일대를 두고 다투고 있었어요. 평양성 싸움에서 왕이 화살에 맞아 전사하자 고구려는 나라 전체가 흔들리는 위기를 맞았어요. 뒤를 이은 소수림왕은 불교 수용, 태학 설립, 율령 반포로 나라의 체제를 다시 다져 위기를 이겨 냈어요."

- id: goguryeo-buddhism
  n: 고구려, 불교 수용·태학 설치
  d: 372
  c: 문화
  i: 3
  at: [126.18, 41.13]
  p: 국내성
  pg: 25
  t: 소수림왕이 중국 전진에서 불교를 받아들이고 인재를 기르는 태학을 세웠어요.
  x: "전진은 4세기 후반 북중국을 통일한 유목 민족 왕조예요. 소수림왕은 불교로 나라의 사상을 하나로 묶고 왕실의 권위를 높이려 했어요. 태학은 수도에 세운 교육 기관으로 유교 경전과 역사를 가르쳐 나라를 이끌 인재를 길렀고, 지방에는 경당이라는 교육 기관도 있었어요(미래엔 교과서). 이런 체제 정비는 고국원왕 전사 뒤의 위기를 이겨 내는 바탕이 됐어요."

- id: goguryeo-yullyeong
  n: 고구려, 율령 반포
  d: 373
  c: 정치
  i: 3
  at: [126.18, 41.13]
  p: 국내성
  pg: 26
  t: 소수림왕이 율령을 반포해 나라를 다스리는 법과 제도를 정비했어요.
  x: "율은 여러 범죄에 대한 처벌 규정이고, 영은 제도와 행정에 관한 규정이에요. 나라 전체에 같은 법과 제도를 적용하게 되면서 왕을 중심으로 한 중앙 집권 체제가 더 단단해졌어요. 앞서 372년의 불교 수용·태학 설립과 함께 소수림왕의 체제 정비로 묶어 기억하면 좋아요. 신라는 이보다 약 150년 늦은 법흥왕 때(520) 율령을 반포했어요."

- id: baekje-buddhism
  n: 백제, 불교 수용
  d: 384
  c: 문화
  i: 3
  at: [127.12, 37.53]
  ap: 1
  p: 한성
  pg: 28
  t: 침류왕 때 동진에서 온 승려 마라난타를 통해 불교를 받아들였어요.
  x: "백제는 왕권을 강화하는 과정에서 불교를 받아들여 백성의 사상을 하나로 묶으려 했어요. 고구려(372)보다 12년 늦고, 신라의 불교 공인(527)보다는 140년 넘게 이른 시기예요. 이후 백제 불교는 크게 발전해 익산 미륵사지 석탑, 부여 정림사지 5층 석탑 같은 문화유산을 남겼고, 성왕 때는 일본에 불교를 전해 일본 아스카 문화가 꽃피는 데 영향을 줬어요."

- id: gwanggaeto
  n: 광개토 대왕 즉위
  d: 391
  c: 정치
  i: 2
  at: [126.18, 41.13]
  p: 국내성
  pg: 26
  t: 광개토 대왕은 백제를 쳐 한강 이북을 차지하고 거란·후연을 물리쳐 만주와 요동으로 영토를 넓혔어요. '영락'이라는 연호를 썼어요.
  x: "중국이 여러 나라로 갈라져 어지러웠고 소수림왕이 다져 놓은 체제 덕분에 왕권도 안정돼 있었기에, 광개토 대왕은 사방으로 큰 정복 전쟁을 벌일 수 있었어요. '영락'은 '영원한 즐거움'이라는 뜻으로, 지금까지 확인된 고구려 연호 가운데 가장 오래됐어요. 스스로 '크고 위대한 왕'이라는 뜻의 '태왕'이라 일컬을 만큼 국력이 강해져, 고구려는 동아시아의 강대국으로 떠올랐어요. 미래엔 교과서는 요서 지역까지 공략했다고 써요."

- id: rescue-silla-400
  n: 광개토 대왕, 신라에 군대 보내 왜 격퇴
  d: 400
  c: 전쟁
  i: 2
  at: [128.87, 35.24]
  ap: 1
  p: 낙동강 하류
  pg: 26
  t: 신라 내물왕의 요청으로 군대를 보내 신라에 쳐들어온 왜를 낙동강 하류까지 쫓아냈어요. 이때 금관가야가 큰 타격을 입었고, 신라는 한동안 고구려의 간섭을 받았어요.
  x: "미래엔 교과서는 이때 고구려가 왜와 함께 가야의 군대도 물리쳤다고 써요. 왜를 물리친 뒤에도 고구려 군대는 신라에 머물렀어요. 경주 호우총에서 나온 청동 그릇 바닥에 광개토 대왕의 이름이 새겨져 있어, 두 나라의 긴밀한 관계를 보여 줘요. 큰 타격을 입은 금관가야는 해상 교역이 위축되며 가야 연맹을 이끄는 자리를 잃었고, 이후 고령의 대가야가 연맹을 주도하게 됐어요."

- id: buyeo-end
  n: 부여, 고구려에 통합
  d: 494
  dt: 5세기 말 (494년)
  c: 정치
  i: 1
  at: [125.3, 43.9]
  ap: 1
  p: 부여 (쑹화강 유역)
  pg: 20
  t: 쑹화강 유역에서 일어난 부여는 연맹 왕국 단계에 머물다 고구려에 흡수됐어요.
  x: "부여는 가장 힘센 부족의 군장이 왕이 되고, 마가·우가·저가·구가 등 가축 이름을 딴 '가'들이 사출도를 따로 다스렸어요. 왕의 힘이 약해서, 흉년이 들면 그 탓을 왕에게 돌려 자리에서 물러나게 하거나 죽이기도 했어요. 12월에 영고라는 제천 행사를 열었고, 순장 풍습과 엄격한 법(살인자는 사형, 도둑은 12배 배상)이 있었어요. 3세기 이후 선비족의 침입으로 약해졌다가 고구려에 통합됐어요(미래엔 교과서)."

- id: gwanggaeto-stele
  n: 광개토 대왕릉비 건립
  d: 414
  c: 문화
  i: 2
  at: [126.19, 41.15]
  p: 중국 지린성 지안
  pg: 26
  t: 장수왕이 아버지 광개토 대왕의 업적을 기리려고 세웠어요. 높이가 6m가 넘는 비석이에요.
  x: "비석은 고구려의 옛 도읍 국내성 근처(중국 지린성 지안)에 있고, 높이는 약 6.4m예요. 비문에는 시조 추모왕(주몽)이 북부여에서 나온 천제의 아들이라는 건국 이야기와 함께, 광개토 대왕이 백제 아신왕의 항복을 받고 신라를 도와 왜를 물리치며 거란·숙신을 치고 동부여를 복속한 업적이 새겨져 있어요. 백제와 신라를 옛날부터 조공을 바쳐 온 백성으로 표현해, 고구려가 스스로를 천하의 중심으로 여겼음을 엿볼 수 있어요."

- id: pyongyang-427
  n: 고구려, 평양 천도
  d: 427
  c: 정치
  i: 3
  at: [125.82, 39.06]
  ap: 1
  p: 평양 (안학궁 추정)
  pg: 27
  t: 장수왕이 도읍을 국내성에서 평양으로 옮기고 남쪽으로 영토를 넓히는 남진 정책을 폈어요.
  x: "도읍을 옮긴 데에는 오랫동안 국내성을 근거지로 삼아 온 귀족들의 힘을 누르고 왕의 힘을 키우려는 뜻이 있었어요. 대동강 가의 넓은 들을 낀 평양은 물자가 넉넉했고 바닷길로 나가기에도 편했어요. 장수왕은 북쪽의 강국 북위와 남쪽의 남조 양쪽에 사신을 보내 바깥 관계를 안정시켰어요. 이때 지은 궁궐 안학궁은 지금 터만 남아 있어요. 고구려가 남쪽으로 밀고 내려오자 위협을 느낀 신라와 백제는 나제 동맹을 맺었어요."

- id: naje-alliance
  n: 나제 동맹 성립
  d: 433
  c: 외교
  i: 3
  at: [128.5, 36.4]
  ap: 1
  p: 신라·백제
  pg: 27
  t: 고구려의 남진에 맞서 신라 눌지왕과 백제 비유왕이 동맹을 맺었어요. 493년에는 혼인 동맹으로 이어졌어요.
  x: "신라는 광개토 대왕 때부터 받아 온 고구려의 간섭에서 벗어나려 했고, 백제는 평양으로 도읍을 옮긴 고구려의 압박을 막아야 했어요. 그래도 475년 한성이 함락되는 것은 막지 못했어요. 이후 백제 동성왕이 신라 왕실과 혼인 관계를 맺어 동맹을 다졌고, 두 나라는 551년 함께 고구려를 공격해 한강 유역에서 몰아냈어요. 그러나 553년 신라가 백제의 한강 하류를 빼앗고 이듬해 관산성 전투가 벌어지면서 동맹은 무너졌어요."

- id: woongjin
  n: 백제, 웅진 천도
  d: 475
  c: 정치
  i: 3
  at: [127.13, 36.46]
  p: 웅진 (공주 공산성)
  pg: 29
  t: 장수왕의 공격으로 한성이 함락되고 개로왕이 죽자, 문주왕이 도읍을 웅진으로 옮겼어요.
  x: "웅진(공주)은 금강을 끼고 있어 적을 막기에 유리했고, 공산성이 도성을 지켰어요. 538년 사비로 옮길 때까지 60여 년 동안 도읍이었어요. 하지만 한강 유역을 잃으면서 바다를 통한 무역이 침체되고, 귀족들이 권력을 다투어 왕권이 약해졌어요. 이후 동성왕이 신라와 혼인 관계를 맺고 신진 세력을 등용하며 안정을 되찾기 시작했고, 무령왕이 중흥의 발판을 마련했어요."

- id: hanseong-fall
  n: 고구려, 백제 한성 함락
  d: 475
  c: 전쟁
  i: 3
  at: [127.12, 37.53]
  p: 한성
  pg: 27
  t: 장수왕이 백제의 도읍 한성을 함락하고 개로왕을 죽였어요. 고구려는 한강 유역을 차지했어요.
  x: "이로써 고구려는 남한강 유역까지 내려와 한반도 중부 지역을 차지했고, 영토가 한강 중상류와 소백산맥 일대에 이르렀어요(미래엔 교과서). 한강 북쪽 아차산에는 고구려 보루들이 남아 있는데, 강 건너 백제 도성인 풍납동 토성과 몽촌토성을 공격하기 좋은 자리였어요. 이렇게 만주부터 한반도 중부까지 차지한 고구려는 동북아시아의 강국으로 우뚝 섰고, 그 기세는 6세기 초까지 계속됐어요."

- id: chungju-stele
  n: 충주 고구려비 건립
  d: 480
  dt: 5세기
  c: 문화
  i: 1
  at: [127.89, 37.03]
  ap: 1
  p: 충주 (남한강 유역)
  pg: 27
  t: 고구려가 남한강 유역까지 내려왔음을 보여 주는 비석이에요. 세운 해는 정확히 알 수 없어요.
  x: "높이 약 2.3m로, 한반도 안에 남아 있는 유일한 고구려 비석이에요. 비문은 고구려 왕을 '태왕'이라 높이고 신라를 고구려에 딸린 '동이'라 낮춰 불렀으며, 고구려가 신라 왕과 신하들에게 고구려 관리의 옷을 내려 주었다는 내용도 담고 있어요. 고구려가 스스로를 천하의 중심으로 여겼고, 신라보다 우위에 있었음을 보여 주는 자료예요."

- id: silla-name
  n: 신라, 국호와 왕호 사용
  d: 503
  c: 정치
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 31
  t: 지증왕이 나라 이름을 '신라'로 정하고 '왕'이라는 칭호를 썼어요. 우경을 장려하고 지방에 관리를 보냈어요.
  x: "그전까지 쓰던 '마립간' 대신 중국식 칭호인 '왕'을 쓴 것은 왕권이 그만큼 강해졌다는 뜻이에요. 지증왕은 순장을 금지해 사회 안정을 꾀했어요(미래엔 교과서). 대외적으로는 경상도 북부로 나아가고, 이사부를 보내 우산국(울릉도)을 복속해 영토를 넓혔어요. 이렇게 다진 기반 위에서 법흥왕이 율령을 반포하며 중앙 집권 체제를 갖춰 갔어요."

- id: muryeong
  n: 백제, 무령왕의 22담로 설치
  d: 501
  dt: 6세기 초 (무령왕 501~523)
  c: 정치
  i: 2
  at: [127.13, 36.46]
  ap: 1
  p: 웅진
  pg: 29
  t: 무령왕이 지방에 22담로를 두고 왕족을 보내 다스렸어요. 중국 남조의 양과 교류했고, 공주 무령왕릉에 묻혔어요.
  x: "담로는 백제가 방·군·성 같은 지방 제도를 갖추기 전에 둔 행정 구역으로, 왕족을 요지에 보내 지방을 직접 통제하려 한 거예요. 무령왕은 고구려를 공격해 영토 일부를 되찾고, 굶주린 백성을 구제했어요. 공주 무령왕릉은 중국 남조의 영향을 받은 벽돌무덤으로, 일본산 금송으로 만든 목관, 중국 화폐 오수전, 무덤을 지키는 진묘수 등 4,600여 점의 유물이 나와 활발한 대외 교류를 보여 줘요."

- id: usanguk
  n: 신라, 우산국 복속
  d: 512
  dt: 512년 (지증왕 13) 6월
  c: 정치
  i: 2
  at: [130.87, 37.50]
  p: 우산국 (울릉도)
  pg: 31
  t: 지증왕 때 이사부가 우산국을 복속했어요. 『삼국사기』의 이 기록은 울릉도와 독도가 우리 땅이 된 가장 이른 기록이에요.
  x: "이사부는 나무로 만든 사자를 배에 가득 싣고 우산국 해안을 오가며, 항복하지 않으면 이 맹수를 풀겠다고 위협해 항복을 받아 냈다고 전해져요. 이후 우산국은 신라에 공물을 바쳤어요(미래엔 교과서). 우산국은 울릉도와 그 부속 섬인 독도를 아우른 나라로, 이 기록은 독도가 예부터 우리 영토였다는 역사적 근거 가운데 하나예요."

- id: silla-yullyeong
  n: 신라, 율령 반포·관리의 공복 제정
  d: 520
  c: 정치
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 31
  t: 법흥왕이 율령을 반포하고 17관등과 관리의 공복(관복)을 정했어요. 531년에는 귀족 회의를 이끄는 상대등을 두고, 536년에는 '건원'이라는 연호도 썼어요.
  x: "법흥왕은 골품제에 대한 규정도 마련했고(미래엔 교과서), 병부를 설치해 군사권을 왕이 직접 장악했어요. 상대등은 귀족 회의인 화백 회의를 이끄는 귀족 대표로, 수상 역할을 했어요. 밖으로는 532년 금관가야를 병합하고 그 지배층을 받아들였어요. '건원'처럼 독자적인 연호를 쓴 것은 신라의 자주성을 드러낸 것으로, 이 무렵 신라는 중앙 집권 국가의 틀을 갖췄어요."

- id: silla-buddhism
  n: 신라, 불교 공인
  d: 527
  c: 문화
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 31
  t: 이차돈의 순교를 계기로 법흥왕이 불교를 공인했어요. 불교는 왕권을 뒷받침하는 사상이 됐어요.
  x: "6세기 초까지 신라에서는 귀족들의 반발로 불교가 널리 퍼지지 못했어요. 불교를 믿던 관리 이차돈이 목숨을 바쳤는데, 목을 베자 흰 젖 같은 피가 솟고 꽃비가 내렸다는 이야기가 전해져요. 818년에 세운 이차돈 순교비(백률사 석당)에 이 장면이 새겨져 있어요. 고구려·백제보다 140년 넘게 늦었지만, 공인 뒤 신라는 황룡사 같은 큰 절을 지으며 불교로 백성의 사상을 하나로 모았어요."

- id: geumgwan-fall
  n: 금관가야 멸망
  d: 532
  c: 정치
  i: 3
  at: [128.87, 35.24]
  p: 김해
  pg: 33
  t: "법흥왕 때 김해의 금관가야가 신라에 항복했어요. 가야 연맹은 이미 5세기부터 금관가야 대신 고령의 대가야가 이끌고 있었어요."
  x: "금관가야는 4세기 이후 신라와 경쟁하며 약해졌고, 400년 고구려군의 공격으로 큰 타격을 입어 연맹의 맹주 자리를 잃었어요. 6세기에는 백제와 신라 사이에서 압박을 받다가 결국 신라에 병합됐어요. 신라는 금관가야의 지배층을 받아들였는데, 뒷날 삼국 통일에 큰 공을 세운 김유신도 금관가야 왕족 출신이에요."

- id: sabi
  n: 백제, 사비 천도
  d: 538
  c: 정치
  i: 3
  at: [126.91, 36.28]
  p: 사비 (부여 부소산성)
  pg: 30
  t: 성왕이 도읍을 사비로 옮기고 나라 이름을 남부여로 바꿨어요. 중앙 22부와 지방 5방을 정비하고 왜에 불교를 전했어요.
  x: "사비(부여)는 넓은 평야가 있고 금강을 끼고 있어 물길 교통이 편리했어요. 나라 이름을 남부여로 바꾼 것은 백제가 부여를 계승했다는 뜻을 내세운 거예요. 수도는 5부로 나누어 다스렸고, 중국 남조와도 활발히 교류했어요. 체제를 정비한 성왕은 신라와 손잡고 고구려를 공격해 한강 하류를 되찾았지만, 곧 신라에 빼앗기고 관산성에서 전사했어요."

- id: hangang-553
  n: 신라, 한강 유역 차지
  d: 553
  c: 전쟁
  i: 2
  at: [127.0, 37.55]
  ap: 1
  p: 한강 하류
  pg: 32
  t: "진흥왕은 백제 성왕과 함께 고구려를 공격해 한강 상류를 차지한 뒤(551), 백제가 되찾은 한강 하류까지 빼앗았어요. 신라는 황해를 건너 중국과 직접 교류할 수 있게 됐어요."
  x: "당시 고구려는 왕위 계승을 둘러싼 귀족들의 다툼으로 혼란에 빠져 있었어요. 한강 유역은 물자와 인구가 넉넉하고 물길 교통이 편리한 군사 요충지라 삼국 모두 물러설 수 없는 곳이었어요. 신라는 이곳을 차지해 고구려와 백제의 연결을 끊었고, 당항성(경기 화성)이 중국과 교역하는 교두보가 됐어요. 진흥왕은 북한산에 순수비를 세워 이를 기념했어요."

- id: gwansan
  n: 관산성 전투, 백제 성왕 전사
  d: 554
  c: 전쟁
  i: 2
  at: [127.57, 36.30]
  ap: 1
  p: 관산성 (충북 옥천)
  pg: 30
  t: 한강 하류를 빼앗긴 성왕이 신라를 공격하다 관산성에서 전사했어요. 120년 넘게 이어진 나제 동맹이 완전히 깨졌어요.
  x: "관산성은 지금의 충북 옥천 지역이에요. 성왕은 함께 싸워 되찾은 한강 하류를 동맹국 신라에 빼앗기자 직접 군대를 이끌고 나섰지만 패배했어요. 이 전투 뒤 백제는 고구려와 손잡고 신라에 맞서며 공세를 강화했어요. 이후 삼국의 다툼은 신라와 고구려·백제가 맞서는 구도로 바뀌었고, 7세기 들어 의자왕이 신라의 대야성을 빼앗기에 이르렀어요."

- id: daegaya-fall
  n: 신라, 대가야 정복
  d: 562
  c: 전쟁
  i: 3
  at: [128.26, 35.73]
  p: 고령
  pg: 33
  t: 진흥왕이 대가야를 정복해 가야 연맹이 완전히 무너졌어요. 신라는 낙동강 서쪽까지 영토를 넓혔어요.
  x: "대가야는 5세기 후반 소백산맥 서쪽으로 세력을 넓히고 중국 남조에 사신을 보낼 만큼 성장했어요. 하지만 가야 연맹은 소국들이 저마다 독자적인 힘을 유지해 하나로 뭉치지 못했고, 6세기 들어 백제와 신라의 압박에 시달렸어요. 신라와 혼인 동맹을 맺기도 했지만(미래엔 교과서) 결국 무너져, 가야는 중앙 집권 국가로 발전하지 못하고 연맹 왕국 단계에서 멸망했어요. 고령 지산동 고분군에 대가야의 무덤 수백 기가 남아 있어요."

- id: sunsubi
  n: 진흥왕 순수비 건립
  d: 568
  dt: 6세기 중반 (황초령비·마운령비는 568년)
  c: 문화
  i: 1
  at: [127.53, 39.92]
  ap: 1
  p: 함흥평야 일대
  pg: 32
  t: "진흥왕이 넓힌 영토를 돌아보고 북한산·황초령·마운령 등에 순수비를 세웠어요. 함흥평야까지 나아갔음을 보여 줘요. 한강 상류로 나아간 뒤에는 단양 신라 적성비도 세웠어요."
  x: "'순수'는 왕이 나라 안을 돌아다니며 민심을 살핀다는 뜻이에요. 서울 북한산비는 한강 하류를 차지한 뒤 업적을 과시하려고 세웠고, 지금은 국립 중앙 박물관에 있어요. 단양 적성비는 고구려 땅이던 적성 지역을 점령한 뒤 신라를 도운 주민을 표창하는 내용이고, 창녕 척경비(561)는 가야 일부 지역을 신라 영토로 편입한 뒤 세웠어요. 비석들의 위치를 이으면 진흥왕 때 신라의 최대 영역을 알 수 있어요."

- id: hwangnyongsa
  n: 신라, 황룡사 건립
  d: 569
  c: 문화
  i: 2
  at: [129.23, 35.83]
  p: 경주 황룡사 터
  pg: 32
  t: "진흥왕이 553년에 짓기 시작해 569년에 완성한 절로, 신라의 국력을 보여 줬어요. 9층 목탑은 선덕 여왕 때 세웠고 몽골 침입 때 불에 탔어요."
  x: "황룡사는 백제의 미륵사와 함께 삼국 시대를 대표하는 큰 절이지만, 지금은 터만 남아 있어요. 9층 목탑에는 주변 나라의 침입을 불교의 힘으로 막으려는 바람이 담겨 있었다고 전해요(미래엔 교과서). 삼국의 왕실이 이런 큰 절을 앞장서 지은 것은 불교가 왕권을 강화하고 중앙 집권 체제를 세우는 데 큰 역할을 했기 때문이에요. 국립 경주 박물관에서 황룡사 복원 모형을 볼 수 있어요."

- id: mireuksa
  n: 백제, 익산 미륵사 건립
  d: 639
  dt: 7세기 전반 (무왕, 사리봉안기 639년)
  c: 문화
  i: 2
  at: [127.03, 36.01]
  p: 익산 미륵사 터
  pg: 37
  t: 무왕이 익산에 크게 지은 절이에요. 지금은 터와 석탑만 남았는데, 석탑에서 나온 사리봉안기에 639년이 적혀 있어요.
  x: "미륵사지 석탑은 우리나라 석탑 가운데 가장 크고 오래됐으며, 돌로 쌓았지만 목탑 양식을 따랐어요. 무너진 부분을 콘크리트로 보수해 두었다가 2001년부터 약 19년 동안 3D 스캐닝 같은 과학 기술로 6층까지 복원했어요. 사리봉안기에는 백제 좌평 사택적덕의 딸인 왕비가 절을 세웠다고 적혀 있어, 신라 선화 공주가 지었다는 『삼국유사』의 이야기와 달라 큰 관심을 모았어요. 미륵 신앙이 유행했음을 보여 주는 절이에요."

- id: cheomseongdae
  n: 신라, 첨성대 건립
  d: 640
  dt: 7세기 (선덕 여왕 때)
  c: 문화
  i: 2
  at: [129.22, 35.83]
  p: 경주 첨성대
  pg: 38
  t: 별을 관측하던 시설로 추정해요. 농사에 필요한 천체 관측이 중요했기 때문에 만들었어요.
  x: "높이 약 9.5m의 돌 구조물로, 7세기에 세워졌어요. 삼국 시대 사람들은 하늘의 현상이 왕의 권위와 연결된다고 여겨 일식·혜성 같은 천문 현상을 관측하고 기록했어요. 고구려도 고분 벽화에 북두칠성 같은 별자리를 그렸어요. 삼국은 토지를 측량하고 고분과 탑을 쌓는 데 수학 지식도 활용했어요."

- id: cheolli-goguryeo
  n: 고구려, 천리장성 축조
  d: 631
  e: 647
  c: 전쟁
  i: 2
  at: [123.3, 41.6]
  ap: 1
  p: 요동 지역 (부여성~비사성)
  pg: 50
  t: 당의 침입에 대비해 북쪽 부여성에서 남쪽 비사성까지 국경을 따라 성을 쌓았어요. 16년 동안 공사를 했어요.
  x: "당 태종이 즉위한 뒤 돌궐 등 주변 세력을 압박하며 세력을 넓히자, 고구려는 국경을 따라 천여 리에 이르는 성을 쌓아 대비했어요. 이 공사를 감독하던 연개소문은 642년 정변을 일으켜 권력을 잡았어요(미래엔 교과서). 고구려는 험한 산에 성을 쌓고, 전쟁이 나면 들판의 곡식과 건물을 태워 적이 쓰지 못하게 한 뒤 산성에 들어가 오래 버티는 전술로 당의 침입을 막았어요."

- id: yeongaesomun
  n: 연개소문의 정변
  d: 642
  c: 정치
  i: 2
  at: [125.75, 39.02]
  p: 평양
  pg: 50
  t: 연개소문이 영류왕을 죽이고 보장왕을 세운 뒤 대막리지가 되어 권력을 잡았어요. 당에 강경하게 맞섰어요.
  x: "대막리지는 행정권과 군사권을 함께 쥔 최고 관직으로, 연개소문이 스스로 첫 대막리지가 됐어요. 그는 신라를 공격하고 당을 견제했는데, 당 태종은 이 정변을 구실로 645년 고구려를 침략했다가 안시성에서 물러났어요. 연개소문이 살아 있는 동안 고구려는 나당 연합군의 공격을 막아 냈지만, 그가 죽은 뒤 아들들이 권력 다툼을 벌이면서 정치가 혼란해졌고 668년 평양성이 함락됐어요."

- id: daeya-fall
  n: 백제, 대야성 함락
  d: 642
  c: 전쟁
  i: 2
  at: [128.17, 35.57]
  ap: 1
  p: 대야성 (경남 합천)
  pg: 51
  t: 의자왕이 신라의 대야성 등 40여 성을 빼앗았어요. 위기에 빠진 신라의 김춘추는 고구려와 왜, 당에 도움을 청했어요.
  x: "대야성(경남 합천)은 신라 서쪽의 군사 요충지였어요. 의자왕은 즉위 초 왕권을 강화하며 신라를 거세게 몰아붙였는데, 백제 장군 윤충이 대야성을 함락할 때 성주였던 김춘추의 사위 김품석 부부가 목숨을 잃었어요. 고구려는 김춘추의 요청을 거절했고 왜와의 교섭도 실패했지만, 고구려 원정에 거듭 실패하던 당과는 648년 동맹을 맺는 데 성공했어요."

- id: najang-alliance
  n: 나당 동맹 체결
  d: 648
  c: 외교
  i: 3
  at: [108.94, 34.26]
  ap: 1
  p: 당의 수도 장안
  pg: 51
  t: 김춘추가 당 태종을 만나 동맹을 맺었어요. 백제와 고구려를 멸망시킨 뒤 대동강 이남 땅은 신라가 갖기로 약속했어요.
  x: "당은 여러 차례 고구려 원정에 실패한 상태라 신라의 제안을 받아들였어요. 신라는 당군의 도움을 받는 대신, 당이 고구려를 칠 때 힘을 보태기로 했어요. 이 동맹으로 나당 연합군이 660년 백제를, 668년 고구려를 무너뜨렸어요. 하지만 당은 약속과 달리 한반도 전체를 지배하려 했고, 이는 신라와 당의 전쟁(나당 전쟁)으로 이어졌어요."

- id: unification
  n: 신라, 삼국 통일
  d: 676
  c: 정치
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 53
  t: 기벌포 전투로 당군을 몰아내고 대동강에서 원산만에 이르는 이남 지역을 차지했어요. 처음으로 이룬 민족 통일이지만 외세를 끌어들였고 고구려 옛 땅 대부분을 잃은 한계도 있어요.
  x: "백제·고구려가 멸망한 뒤 당은 옛 백제 땅에 웅진도독부, 옛 고구려 땅에 안동도호부를 두고 신라에까지 계림도독부를 두어 한반도 전체를 지배하려 했어요. 신라는 고구려 유민 안승을 보덕국 왕으로 삼아 유민을 끌어안고, 백제 옛 땅에서 당군을 몰아냈어요. 675년 매소성 싸움에서 당군을, 676년 기벌포 싸움에서 당 수군을 물리치자 당은 안동도호부를 요동으로 옮겼어요. 당이 서쪽의 토번과도 싸우느라 힘이 나뉜 것도 신라에 유리했어요(미래엔 교과서)."

# ───── R1 검수에서 더한 사건 (두 교과서 대조) ─────

- id: okjeo-dongye
  n: "옥저와 동예의 성장"
  d: -150
  dt: "기원전 2세기 전후"
  c: "정치"
  i: 2
  at: [128.0, 39.2]
  ap: 1
  p: "한반도 동해안 (함흥~강릉 일대)"
  pg: 21
  t: "한반도 동북쪽 해안에서 옥저와 동예가 성장했어요. 왕 없이 읍군·삼로가 다스렸고, 옥저에는 민며느리제와 가족 공동 무덤, 동예에는 무천과 책화가 있었어요."
  x: "두 나라는 땅이 기름져 농사가 잘되고 소금과 해산물이 풍부했지만, 치우친 위치 탓에 앞선 문화를 늦게 받아들였고 고구려의 간섭을 받아 강한 나라로 자라지 못했어요. 동예는 박달나무 활인 단궁, 과일나무 아래를 지날 만큼 작은 말인 과하마, 바다표범 가죽인 반어피가 특산물로 유명했어요. 동예에는 같은 씨족끼리 혼인하지 않는 족외혼 풍습도 있었어요. 미래엔 교과서는 두 나라의 언어와 풍습이 고구려와 대체로 비슷했다고 써요."

- id: samhan
  n: "삼한(마한·진한·변한)의 성장"
  d: -150
  dt: "기원전 2세기 전후"
  c: "정치"
  i: 2
  at: [127.15, 36.81]
  ap: 1
  p: "한반도 남부 (목지국은 천안 일대)"
  pg: 22
  t: "한반도 남부에서 마한·진한·변한이 성장했어요. 마한의 목지국 군장이 삼한을 대표했고, 제사장인 천군이 소도를 다스렸어요. 변한은 철을 많이 생산해 낙랑과 왜에 수출했어요."
  x: "고조선이 멸망한 뒤 남쪽으로 내려온 유민들이 철기 문화를 전하면서 삼한이 성장했어요. 마한은 50개 이상, 진한과 변한은 각각 12개의 소국으로 이루어졌고, 소국의 군장은 신지·읍차라고 불렸어요. 소도는 죄인이 도망쳐 와도 잡아가지 못하는 곳이라, 제사와 정치가 분리돼 있었음을 보여 줘요. 벼농사를 위해 저수지를 만들었고 5월과 10월에 제천 행사를 열었어요. 뒤에 마한은 백제, 진한은 신라, 변한은 가야로 이어졌어요."

- id: jeonyeon-342
  n: "고구려, 전연의 침입으로 수도 함락"
  d: 342
  dt: "342년 (교과서: 4세기 중반)"
  c: "전쟁"
  i: 2
  at: [126.18, 41.13]
  ap: 1
  p: "국내성·환도성"
  pg: 25
  t: "고국원왕 때 선비족이 세운 전연이 쳐들어와 수도가 함락되는 피해를 입었어요. 371년에는 백제의 공격으로 고국원왕이 전사해 고구려가 위기에 빠졌어요."
  x: "전연은 선비족이 세운 나라로, 고구려와 요동 지역을 두고 치열하게 다퉜어요. 342년 전연의 군대는 수도 환도성을 함락하고 미천왕의 시신과 왕의 어머니·왕비, 5만여 명의 백성을 끌고 갔어요. 고국원왕은 전연에 신하를 자처하는 사신을 보내 시신을 돌려받았고, 어머니는 355년에야 돌아왔어요. 미래엔 교과서에 따르면 고구려는 3세기에도 위의 침입으로 수도가 함락되는 위기를 겪었어요."

- id: naemul
  n: "신라, 내물왕 즉위"
  d: 356
  c: "정치"
  i: 3
  at: [129.22, 35.84]
  p: "경주 (금성)"
  pg: 31
  t: "내물왕 때부터 김씨가 왕위를 이어 가고, 왕의 칭호로 마립간을 썼어요. 신라는 이 무렵 낙동강 동쪽의 진한 소국을 대부분 아울렀어요."
  x: "마립간은 '대군장(큰 우두머리)'을 뜻해, 박·석·김 세 성씨가 돌아가며 이사금이 되던 때보다 왕권이 강해졌음을 보여 줘요. 이 무렵 왜가 쳐들어오자 내물왕은 고구려 광개토 대왕에게 도움을 청해 물리쳤어요(400). 그 뒤 신라는 한동안 고구려의 정치적 간섭을 받았지만, 고구려를 통해 중국의 앞선 문물을 받아들이기도 했어요."

- id: hwarang
  n: "진흥왕, 화랑도를 국가 조직으로 개편"
  d: 576
  dt: "진흥왕 때 (6세기)"
  c: "사회"
  i: 2
  at: [129.22, 35.84]
  p: "경주"
  pg: 32
  t: "진흥왕은 청소년 수련 단체였던 화랑도를 국가 조직으로 바꾸어 인재를 기르고 군사력을 키웠어요."
  x: "화랑도는 진골 귀족 출신의 화랑과 그를 따르는 낭도로 이루어졌는데, 낭도는 진골 이하의 여러 신분이어서 귀족부터 평민까지 함께 어울려 활동했어요. 원광이 지은 세속 5계를 지키며 무예를 익히고 몸과 마음을 단련했어요. 화랑도에서 자란 인재들은 삼국 통일 전쟁에서 크게 활약했는데, 황산벌 전투에서 반굴·관창 같은 젊은 화랑의 희생이 신라군의 사기를 높인 일이 유명해요."
