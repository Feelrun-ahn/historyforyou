# 일제 강점기 (1910~1945, 교과서 VI-1·VI-2). 양력.
# 봉오동 전투·청산리 대첩 등 무장 투쟁은 data/wars/korea.yaml

- id: gov-general
  n: 조선 총독부 설치, 무단 통치
  ds: '1910-10-01'
  c: 정치
  i: 2
  at: [126.985, 37.558]
  ap: 1
  p: 서울 남산 (1926년 경복궁 안으로 옮김)
  pg: 181
  t: 일제가 조선 총독부를 두고 헌병 경찰제를 실시했어요. 한국인의 언론·출판·집회·결사의 자유를 빼앗고 정치 활동을 모두 막았어요.
  x: "총독은 일본 육해군 대장 가운데에서 임명했고, 입법·행정·사법과 군대 지휘권까지 쥐어 사실상 왕과 같은 힘을 가졌어요. 헌병 경찰은 재판 없이 바로 벌금을 매기거나 태형(매질)을 하는 즉결 처분권을 가졌고, 학교 교원에게까지 제복을 입히고 칼을 차게 했어요. 이처럼 군대와 경찰의 힘으로 억누른 1910년대 통치를 '무단 통치'라고 하며, 이에 대한 분노가 3·1 운동으로 터져 나왔어요."

- id: land-survey
  n: 토지 조사 사업
  ds: '1910-03'
  es: '1918-11'
  c: 경제
  i: 3
  at: [126.985, 37.558]
  ap: 1
  p: 전국
  pg: 188
  t: 정해진 기간 안에 직접 신고한 토지만 소유지로 인정해 총독부의 땅과 지세 수입을 크게 늘렸어요. 많은 농민이 경작권을 잃고 소작농이 됐어요.
  x: "일제는 근대적인 토지 소유 제도를 만든다는 명분을 내세웠지만, 실제로는 식민 통치에 필요한 세금과 땅을 확보하려는 것이었어요. 신고하지 않은 땅과 관청에 딸린 땅(역둔토) 등이 총독부 차지가 됐고, 총독부는 이 땅을 동양 척식 주식회사와 일본인 이민자에게 싼값에 넘겼어요. 동양 척식 주식회사는 이렇게 받은 땅으로 한국 최대의 지주가 됐어요. 농민이 대대로 누려 온 경작권은 인정받지 못해 지주 마음대로 쫓겨날 수 있는 처지가 됐어요."

- id: company-law
  n: 회사령 공포
  ds: '1910-12'
  c: 경제
  i: 2
  at: [126.985, 37.558]
  ap: 1
  p: 서울
  pg: 188
  t: 회사를 세우려면 총독의 허가를 받게 해 한국인의 기업 설립을 막았어요. 1920년에 신고제로 바뀌었어요.
  x: "1910년 12월에 공포돼 이듬해 1월부터 시행됐어요. 허가를 받은 뒤에도 조건을 어기면 총독이 사업을 멈추게 하거나 회사를 해산시킬 수 있어서 민족 자본이 자라기 어려웠어요. 1920년 신고제로 바꾼 뒤 일제는 일본 상품에 대한 관세도 없앴는데, 일본 기업과 상품이 한국에 쉽게 들어오게 하려는 것이었어요. 그 결과 한국인 기업은 더 큰 위기를 맞았고, 이것이 물산 장려 운동이 일어난 배경이 됐어요."

- id: gyeonghaksa
  n: 경학사·신흥 강습소 설립
  ds: '1911-04'
  c: 민족운동
  i: 2
  at: [125.75, 42.35]
  ap: 1
  p: 서간도 삼원보 (중국 지린성 류허현)
  pg: 179
  t: 신민회 회원 이회영·이상룡 등이 서간도 삼원보에 한인 자치 단체 경학사와 독립군 양성 학교인 신흥 강습소(뒤의 신흥 무관 학교)를 세웠어요.
  x: "국권을 빼앗길 무렵 신민회는 나라 밖에 독립운동 기지를 만들어 오래 싸울 준비를 하기로 했어요. 경학사는 '경학(耕學)'이라는 이름처럼 황무지를 일궈 이주 한인의 생활 터전을 만들면서 인재를 길렀는데, 흉년과 자금난으로 어려움을 겪다가 부민단·한족회로 이어졌어요. 신흥 강습소는 1919년 신흥 무관 학교로 커져 1920년 문을 닫을 때까지 2,100여 명의 독립군을 길러 냈고, 졸업생들은 서로 군정서·북로 군정서 등에서 활약하며 청산리 대첩에도 참여했어요."

- id: case-105
  n: 105인 사건
  ds: '1911'
  c: 민족운동
  i: 1
  at: [126.985, 37.558]
  ap: 1
  p: 서울
  pg: 179
  t: "일제가 총독 암살을 꾸몄다는 구실로 신민회 회원 등 600여 명을 체포하고 122명을 재판에 넘겨, 1심에서 105명에게 유죄를 선고했어요. 이 일로 신민회가 해체됐어요."
  x: "1910년 말 안중근의 사촌 동생 안명근이 독립운동 자금을 모으다 붙잡히자, 일제는 이를 기회로 데라우치 총독 암살 모의 사건을 꾸며 냈어요. 붙잡힌 사람들은 심한 고문 속에 거짓 자백을 강요받았고, 고문으로 숨진 사람도 있었어요. 2심에서는 99명이 무죄로 풀려나고 윤치호·양기탁·안태국·이승훈 등 6명만 징역형을 받았어요. 일제는 이 사건으로 비밀 결사였던 신민회의 조직을 알아내 무너뜨렸어요."

- id: kna
  n: 대한인 국민회 결성
  ds: '1910-02'
  c: 민족운동
  i: 1
  at: [-122.42, 37.77]
  ap: 1
  p: 미국 샌프란시스코
  pg: 179
  t: 미주 지역 한인 단체들이 모여 만든 단체예요. 안창호 등이 이끌며 동포의 단결과 독립운동 자금 모금에 힘썼어요.
  x: "미주의 여러 한인 단체가 1909년 국민회로 뭉쳤고, 이듬해 대동 보국회까지 합쳐지면서 대한인 국민회가 출범했어요. 북미·하와이·멕시코는 물론 시베리아와 만주에도 지방 총회를 두어 해외 한인을 대표하는 단체로 커졌어요. 기관지 『신한민보』를 펴내 국내외에 항일 의식을 퍼뜨렸고, 광복 때까지 해외 독립운동을 이끄는 중심 단체 가운데 하나였어요."

- id: gwangbokhoe
  n: 대한 광복회 조직
  ds: '1915-07'
  c: 민족운동
  i: 1
  at: [128.60, 35.87]
  ap: 1
  p: 대구
  pg: 181
  t: 박상진 등이 공화 정체의 국가 수립을 목표로 만든 비밀 결사예요. 독립운동 자금을 모으고 친일 부호를 처단했어요.
  x: "1915년 대구 달성 공원에서 풍기의 광복단과 대구의 조선 국권 회복단 사람들이 중심이 되어 만들었어요. 총사령 박상진 아래 군대식 조직을 갖추고, 만주에 무관 학교를 세워 독립군을 길러 무력으로 독립을 이루려 했어요. 경주에서 세금을 실은 우편 마차를 습격해 자금을 마련하기도 했어요. 1918년 조직이 드러나 많은 회원이 붙잡혔고, 박상진 등은 사형을 선고받아 순국했어요."

- id: feb8
  n: 2·8 독립 선언
  ds: '1919-02-08'
  c: 민족운동
  i: 3
  at: [139.76, 35.70]
  ap: 1
  p: 일본 도쿄 (조선 기독교 청년회관)
  pg: 181
  t: 도쿄의 한국인 유학생들이 독립 선언서를 발표했어요. 국내의 3·1 운동에 큰 영향을 주었어요.
  x: "제1차 세계 대전이 끝나고 미국 윌슨 대통령의 평화 원칙(민족 자결주의)과 파리 강화 회의 소식이 전해지자, 유학생들은 조선 청년 독립단을 만들고 선언서를 준비했어요. 선언서 문장은 이광수가 쓴 것으로 알려져 있어요. 2월 8일 600여 명이 모인 자리에서 선언서를 읽었지만, 일본 경찰이 모임을 해산하고 대표들을 붙잡았어요. 그 전에 송계백 등이 선언서 초안을 몰래 국내로 가져가 국내 지도자들을 자극했어요."

- id: march1
  n: 3·1 운동
  ds: '1919-03-01'
  c: 민족운동
  i: 3
  at: [126.988, 37.571]
  p: 서울 탑골 공원
  pg: 181
  t: 민족 대표 33인이 서울에서 독립 선언서를 낭독하고, 학생과 시민들이 탑골 공원에서 만세 시위를 시작했어요. 시위는 전국과 만주·연해주·일본·미주까지 퍼졌어요.
  x: "무단 통치에 대한 불만이 쌓인 데다 민족 자결주의와 2·8 독립 선언, 고종의 갑작스러운 죽음(독살설)이 겹치며 일어났어요. 천도교·기독교·불교 대표로 이루어진 민족 대표는 종로의 태화관에서 선언식을 연 뒤 스스로 일본 경찰에 붙잡혀 갔어요. 일제가 폭력으로 진압하자 시위는 점차 무력으로 맞서는 모습도 띠었어요. 농민·노동자·학생 등 다양한 계층이 참여해 민족 운동의 주체가 넓어졌고, 일제가 통치 방식을 바꾸게 했으며 대한민국 임시 정부 수립과 중국 5·4 운동 등에 영향을 주었어요."

- id: yu-gwansun
  n: 아우내 장터 만세 시위
  ds: '1919-04-01'
  c: 민족운동
  i: 2
  at: [127.30, 36.76]
  ap: 1
  p: 천안 병천 (아우내)
  t: 유관순 등이 아우내 장터에서 만세 시위를 이끌었어요. 유관순은 서대문 형무소에서 고문을 받다 1920년 순국했어요.
  x: "유관순은 서울 이화 학당 학생이었는데, 3·1 운동 뒤 휴교령으로 학교가 문을 닫자 고향 천안으로 내려와 만세 시위를 준비했어요. 4월 1일 병천 아우내 장터에 수천 명이 모였고, 일본 헌병이 총을 쏘아 유관순의 부모를 포함해 19명이 그 자리에서 목숨을 잃었어요. 유관순은 1심에서 5년형, 2심(경성 복심 법원)에서 3년형을 받았고, 감옥 안에서도 만세 운동을 이어 갔어요. 2019년에는 가장 높은 등급의 건국 훈장인 대한민국장이 더해졌어요."

- id: provisional-gov
  n: 대한민국 임시 정부 수립
  ds: '1919-04-11'
  c: 민족운동
  i: 3
  at: [121.47, 31.22]
  ap: 1
  p: 중국 상하이
  pg: 182
  t: 3·1 운동을 계기로 상하이에서 대한민국 임시 정부가 수립됐어요. 우리 역사 최초의 민주 공화제 정부예요.
  x: "4월 10일 각 지역 대표들이 임시 의정원을 구성해 나라 이름을 '대한민국'으로 정했고, 이튿날 '대한민국은 민주 공화제로 한다'는 조항이 담긴 대한민국 임시 헌장을 발표했어요. '대한'은 대한 제국을 잇는다는 뜻이고, '민국'은 황제가 아닌 국민이 주권을 가진 나라라는 뜻이에요. 상하이에 자리 잡은 것은 일제의 힘이 미치지 않는 프랑스 조계가 있고 외교 활동을 펴기에 좋았기 때문이에요."

- id: jeamri
  n: 제암리 학살
  ds: '1919-04-15'
  c: 민족운동
  i: 2
  at: [126.91, 37.13]
  ap: 1
  p: 경기 화성 제암리
  pg: 181
  t: 일본 군경이 제암리 주민들을 교회에 몰아넣고 총을 쏘고 불을 질러 학살했어요.
  x: "제암리 사람 몇몇이 근처 발안 장터 만세 시위에 참여하자, 일본군은 보복하려고 마을에 들이닥쳤어요. 일본군은 강연이 있다고 속여 마을 남자들을 교회에 모았고, 교회 안팎에서 28명이 숨지고 민가 30여 채가 불탔어요. 선교사 스코필드가 현장을 찾아 사진을 찍고 보고서를 써 외국에 보내면서 일제의 만행이 세계에 알려졌어요. 두 교과서 모두 3·1 운동 때 일제의 잔혹한 탄압을 보여 주는 사례로 이 사건을 들어요."

- id: unified-gov
  n: 임시 정부 통합 (대통령제 헌법)
  ds: '1919-09-11'
  c: 민족운동
  i: 3
  at: [121.47, 31.22]
  ap: 1
  p: 상하이
  pg: 182
  t: 연해주의 대한 국민 의회, 서울의 한성 정부와 합쳐 하나의 임시 정부가 됐어요. 대통령에 이승만, 국무총리에 이동휘를 뽑았어요. 연통제와 교통국으로 국내와 연락했어요.
  x: "통합하면서 대통령제를 바탕으로 한 대한민국 임시 헌법을 만들고, 법을 만드는 임시 의정원·나랏일을 집행하는 국무원·재판을 맡는 법원으로 권력을 나눴어요. 『독립신문』을 내서 동포들에게 독립운동 소식을 전했고, 독립 공채를 팔거나 성금을 걷어 활동 자금을 마련했으며, 미국에 구미 위원부를 두어 외교에도 힘썼어요. 하지만 국내로 보낸 요원들이 잇달아 붙잡혀 1922년 말쯤에는 국내 활동이 거의 막혔고, 독립운동 방법을 둘러싼 갈등 속에 1923년 국민 대표 회의마저 결렬되면서 임시 정부는 한동안 어려움을 겪었어요."

- id: cultural-rule
  n: 이른바 '문화 통치' 시작
  ds: '1919-09'
  c: 정치
  i: 2
  at: [126.985, 37.558]
  ap: 1
  p: 서울
  pg: 182
  t: 3·1 운동 뒤 일제는 헌병 경찰제를 보통 경찰제로 바꾸고 문화 통치를 내세웠지만, 경찰 수는 오히려 늘었고 친일파를 키워 민족을 분열시키려 했어요.
  x: "3·1 운동을 겪은 일제는 힘으로만 누르기는 어렵다고 보고 통치 방식을 바꿨어요. 문관도 총독이 될 수 있게 제도를 고쳤지만 실제로 문관 총독은 한 명도 나오지 않았어요. 한글 신문을 허가하면서도 검열을 계속했고, 1925년에는 치안 유지법을 만들어 사회주의자와 독립운동가를 처벌했어요. 이런 가운데 일부 민족주의자가 식민 지배를 인정하는 범위에서 실력을 키우자고 주장하면서 민족 운동 세력이 갈라졌어요."

- id: uiyeoldan
  n: 의열단 조직
  ds: '1919-11-10'
  c: 민족운동
  i: 2
  at: [126.55, 43.84]
  ap: 1
  p: 중국 지린
  pg: 183
  t: 김원봉 등이 만든 무장 독립운동 단체예요. 조선 총독부와 동양 척식 주식회사 등 식민 지배 기관을 공격했어요.
  x: "의열단은 '정의로운 일을 맹렬히 실행한다'는 뜻의 이름처럼 총독부 고관·친일파·밀정 같은 처단 대상과 총독부·동양 척식 주식회사·경찰서 같은 파괴 대상을 정해 두고 활동했어요. 1923년 신채호가 쓴 「조선 혁명 선언」을 활동 지침으로 삼아 민중의 직접 혁명을 내세웠어요. 김익상(조선 총독부, 1921), 김상옥(종로 경찰서, 1923), 나석주(동양 척식 주식회사·조선 식산 은행, 1926) 등의 의거가 이어졌어요."

- id: newspapers
  n: 조선일보·동아일보 창간
  ds: '1920-03-05'
  c: 문화
  i: 3
  at: [126.977, 37.570]
  ap: 1
  p: 서울
  pg: 216
  t: 문화 통치 아래에서 한글 신문 발행이 허가돼 『조선일보』(3월)와 『동아일보』(4월)가 창간됐어요. 기사 검열과 정간이 잦았어요.
  x: "두 신문은 방학 때 학생들을 농촌에 보내 한글을 가르치는 문자 보급 운동(조선일보)과 브나로드 운동(동아일보)을 이끌었어요. 1936년에는 베를린 올림픽 마라톤에서 우승한 손기정 선수의 사진에서 가슴의 일장기를 지워 실은 일로 『동아일보』가 약 9개월 동안 무기 정간을 당했어요. 결국 두 신문은 1940년 일제에 의해 강제로 폐간됐어요."

- id: rice-plan
  n: 산미 증식 계획
  ds: '1920'
  es: '1934'
  c: 경제
  i: 3
  at: [126.85, 35.15]
  ap: 1
  p: 전국 (호남 평야 등)
  pg: 188
  t: 일본의 식량 부족을 해결하려고 쌀 생산을 늘리게 했지만, 늘어난 양보다 더 많은 쌀을 일본으로 가져가 한국의 식량 사정이 나빠졌어요.
  x: "일본은 쌀이 모자라 1918년 쌀값 폭등에 항의하는 큰 쌀 소동까지 겪었어요. 일제는 수리 시설을 늘리고 땅을 개간하며 품종과 비료를 바꾸게 했는데, 수리 조합비와 비료 값 같은 비용은 농민이 떠안았어요. 한국인이 먹을 쌀이 줄어들자 만주에서 잡곡을 많이 들여와 부족한 식량을 메워야 했어요. 한국 쌀이 대량으로 들어가 일본 쌀값이 떨어지자 일제는 1934년 이 계획을 중단했어요."

- id: mulsan
  n: 물산 장려 운동
  ds: '1920-08'
  c: 민족운동
  i: 2
  at: [125.75, 39.02]
  p: 평양
  pg: 189
  t: 조만식 등이 평양에서 시작해 1923년 전국으로 퍼졌어요. '조선 사람 조선 것'을 구호로 국산품을 쓰자고 했어요.
  x: "회사령이 폐지되고 한국과 일본 사이의 관세까지 없어지면서 일본 자본과 상품이 밀려 들어오자, 민족 기업을 살려 경제적으로 자립하자며 일어났어요. 무명옷을 입고 우리 땅에서 난 물건을 쓰자는 생활 운동으로, '내 살림 내 것으로' 같은 구호도 내세웠어요. 그러나 사회주의 계열은 이 운동이 결국 자본가의 이익만 돕는다고 비판했고, 운동을 이끈 조선 물산 장려회는 1937년 총독부의 명령으로 해산됐어요."

- id: minrip
  n: 민립 대학 설립 운동
  ds: '1922-11'
  c: 민족운동
  i: 2
  at: [126.977, 37.570]
  ap: 1
  p: 서울
  pg: 182
  t: 우리 힘으로 대학을 세우자며 모금 운동을 벌였지만, 일제는 경성 제국 대학을 세워 이 운동을 막았어요.
  x: "3·1 운동 뒤 일제의 식민지 차별 교육에 맞서 한국인 손으로 고등 교육 기관을 세우려는 실력 양성 운동이었어요. 이상재 등이 앞장선 조선 민립 대학 기성회가 만들어졌고, '한민족 1천만이 한 사람 1원씩'이라는 구호로 1천만 원을 모으려 했어요. 그러나 일제의 방해에 1923~1924년의 홍수와 가뭄 같은 재해까지 겹쳐 모금이 잘되지 않았어요. 일제는 1924년 경성 제국 대학 예과를 열어 한국인의 대학 설립 요구를 누그러뜨리려 했어요."

- id: hyeongpyeong
  n: 조선 형평사 창립
  ds: '1923-04-25'
  c: 사회
  i: 2
  at: [128.08, 35.19]
  p: 진주
  pg: 189
  t: 오랫동안 차별받던 백정들이 진주에서 형평사를 만들어 평등한 대우를 요구했어요.
  x: "백정은 1894년 갑오개혁으로 법적으로는 신분 차별에서 벗어났지만, 일제 강점기에도 호적에 '도한(屠漢)'이라고 적히거나 붉은 점으로 표시되는 등 차별이 이어졌어요. 백정 출신 이학찬이 자녀 교육 차별에 분노해 강상호·장지필 등과 함께 형평사를 세웠어요. 창립 1년 만에 전국에 지사 12개, 분사 64개가 생길 만큼 빠르게 퍼졌지만, 백정이 파는 고기를 사지 말자는 반형평 운동도 일어났어요. 1930년대에는 세력이 약해져 일제에 순응하는 대동사로 바뀌었어요."

- id: amtaedo
  n: 암태도 소작 쟁의
  ds: '1923-08'
  es: '1924-08'
  c: 사회
  i: 2
  at: [126.11, 34.83]
  p: 전남 신안 암태도
  pg: 189
  t: 암태도 농민들이 1년 가까이 지주와 일제 경찰에 맞서 싸워 소작료를 낮추는 성과를 거두었어요.
  x: "일제 강점기 지주들은 수확의 절반 이상을 소작료로 받고 수리 조합비 같은 부담까지 소작인에게 떠넘겼어요. 소작 기간도 짧아 소작인은 언제든 땅을 빼앗길 수 있었기 때문에, 1920년대 전반에는 소작료를 낮추라는 소작 쟁의가 곳곳에서 일어났어요. 암태도 소작 쟁의는 그 대표적인 사례예요. 이런 농민 운동은 먹고살 권리를 지키려는 싸움이면서, 일제의 수탈에 맞선 민족 운동이기도 했어요."

- id: kanto
  n: 관동 대지진과 한국인 학살
  ds: '1923-09-01'
  c: 민족운동
  i: 1
  at: [139.69, 35.69]
  ap: 1
  p: 일본 도쿄·요코하마 일대
  t: 대지진 뒤 '한국인이 우물에 독을 탔다'는 헛소문이 퍼지며 일본 군경과 자경단이 수많은 한국인을 학살했어요.
  x: "1923년 9월 1일 큰 지진으로 도쿄·요코하마 일대가 무너지고 불타 혼란에 빠지자, 일본 정부는 이튿날 계엄령을 내렸어요. '조선인이 폭동을 일으키고 불을 지른다'는 헛소문 속에 자경단은 죽창과 일본도를 들고 한국인을 찾아 죽였고, 군대와 경찰도 학살에 가담했어요. 대한민국 임시 정부 『독립신문』의 조사로는 희생자가 6,661명에 이르렀지만, 일본 정부는 군경의 학살을 감추고 책임을 자경단에 돌렸어요."

- id: three-bu
  n: 3부 성립 (참의부·정의부·신민부)
  ds: 1924
  es: '1925'
  c: 민족운동
  i: 2
  at: [126.5, 42.8]
  ap: 1
  p: 만주
  pg: 183
  t: 자유시 참변 뒤 만주로 돌아온 독립군이 참의부·정의부·신민부로 조직을 정비했어요. 각각 민정 기관과 군정 기관을 갖춘 자치 정부 역할을 했어요.
  x: "참의부(1924)는 압록강 가까운 남만주를 근거지로 한 임시 정부 직할 부대였고, 정의부(1924)는 남만주, 신민부(1925)는 북만주에서 김좌진 등이 중심이 되어 만들었어요. 3부는 동포 사회의 행정을 맡아 학교를 세우고 독립군을 길러 일본 군경을 공격했어요. 1920년대 후반 독립운동 세력을 하나로 묶자는 운동 속에 3부는 1929년 무렵 남만주의 국민부와 북만주의 혁신 의회 계열로 재편됐고, 이것이 조선 혁명군과 한국 독립군으로 이어졌어요."

- id: mitsuya
  n: 미쓰야 협정
  ds: '1925-06'
  c: 민족운동
  i: 1
  at: [123.43, 41.80]
  ap: 1
  p: 중국 선양 (펑톈)
  t: 조선 총독부가 만주 군벌과 맺은 협정으로, 독립군을 잡아 일본에 넘기게 했어요. 독립군 활동이 크게 위축됐어요.
  x: "1925년 조선 총독부 경무국장 미쓰야와 만주 군벌 장쭤린 사이에 맺은 협정이에요. 이 협정을 근거로 중국 관리들이 독립군은 물론 만주의 한인 동포까지 압박했고, 1928년에는 일본 경찰과 중국군이 함께 신민부 본부를 습격하기도 했어요. 이런 압박 속에 한인과 중국인 사이의 감정도 나빠져, 1931년 만보산 사건의 간접적인 원인이 되기도 했어요."

- id: june10
  n: 6·10 만세 운동
  ds: '1926-06-10'
  c: 민족운동
  i: 3
  at: [126.99, 37.570]
  p: 서울 종로 (순종 장례 행렬)
  pg: 182
  t: 순종의 장례일에 학생들이 만세 시위를 벌였어요. 민족주의 계열과 사회주의 계열이 함께 준비했던 운동이에요.
  x: "1926년 4월 순종이 세상을 떠나자, 장례 날 많은 사람이 모이는 때를 이용해 3·1 운동 같은 만세 시위를 일으키려는 계획이 세워졌어요. 사회주의 계열과 민족주의 계열이 함께 준비했지만 일제에 미리 들켜 조선 공산당원만 100여 명이 붙잡혔고, 결국 학생들이 중심이 되어 장례 행렬이 지나는 길에서 만세를 불렀어요. 두 세력이 함께 운동을 준비한 경험은 이듬해 신간회가 만들어지는 데 영향을 주었어요."

- id: singanhoe
  n: 신간회 창립
  ds: '1927-02-15'
  c: 민족운동
  i: 3
  at: [126.986, 37.570]
  p: 서울 종로 (기독교 청년회관)
  pg: 182
  t: "비타협적 민족주의 계열과 사회주의 계열이 힘을 합쳐 만든 민족 협동 단체예요. 전국에 140여 개 지회를 두었고 1931년 일제의 탄압과 내부 갈등 속에 해소(해산)됐어요."
  x: "신간회는 일부 민족주의자가 식민 지배를 인정하며 실력을 키우자고 하자, 이를 '기회주의'로 경계한 세력들이 손잡아 만든 단체예요. 초대 회장은 이상재였고 '정치적·경제적 각성을 촉진한다, 단결을 굳게 한다, 기회주의를 모두 거부한다'는 강령을 내걸었어요. 1928년 말에는 회원이 3만 명에 이르렀고, 광주 학생 항일 운동 때는 진상 조사단을 보내고 민중 대회를 열려다 간부 40여 명이 붙잡히기도 했어요."

- id: wonsan-strike
  n: 원산 총파업
  ds: '1929-01-14'
  es: '1929-04-06'
  c: 사회
  i: 3
  at: [127.44, 39.15]
  p: 원산
  pg: 189
  t: 일본인 감독이 한국인 노동자를 때린 일에 항의해 원산 지역 노동자들이 약 4개월 동안 총파업을 벌였어요.
  x: "파업이 시작된 곳은 원산 근처의 한 석유 회사였어요. 당시 한국인 노동자는 나쁜 환경에서 오래 일하고도 일본인 노동자가 받는 임금의 반도 안 되는 돈을 받았어요. 1929년 1월부터 4월 초까지 이어진 이 총파업은 그때까지의 어느 파업보다 규모가 커서 전국의 지지와 성원을 받았지만, 일제는 이 파업 뒤 노동 운동을 더욱 혹독하게 탄압했어요. 이런 노동자들의 싸움은 먹고살 권리를 지키려는 것이면서 일제에 맞선 민족 운동이기도 했어요."

- id: gwangju-student
  n: 광주 학생 항일 운동
  ds: '1929-11-03'
  c: 민족운동
  i: 3
  at: [126.91, 35.15]
  p: 광주
  pg: 182
  t: 한일 학생 사이의 충돌을 계기로 일어난 민족 차별 반대 시위가 전국으로 퍼졌어요. 3·1 운동 이후 가장 큰 민족 운동이었고 신간회가 지원했어요.
  x: "학생들은 일본 제국주의 타도, 민족 차별 중지, 식민지 교육 제도 폐지 등을 외쳤어요. 시위는 광주에서 시작해 전국 곳곳의 학교로 번졌어요. 신간회는 진상 조사단을 보내고 일제의 탄압을 알리는 민중 대회를 열려 했지만, 그 계획이 드러나 간부들이 많이 붙잡혔어요. 시위가 시작된 11월 3일은 오늘날 '학생 독립운동 기념일'로 기리고 있어요."

- id: manchurian-incident
  n: 만주 사변
  ds: '1931-09-18'
  c: 전쟁
  i: 2
  at: [123.43, 41.80]
  ap: 1
  p: 중국 선양 (류탸오후)
  t: 일본군이 만주를 침략해 이듬해 만주국을 세웠어요. 이를 계기로 한중 연합 항일 투쟁이 벌어졌어요.
  x: "1931년 9월 일본 관동군은 선양 근처 류탸오후에서 일어난 철도 폭파 사건을 구실로 만주 전체를 차지했고, 1932년 3월 일본이 뒤에서 조종하는 '만주국'을 세웠어요. 일본의 침략으로 중국인의 반일 감정이 커지자 한국 독립군과 조선 혁명군은 중국군과 손잡고 여러 전투에서 일본군을 물리쳤어요. 이 무렵부터 일제는 한국을 대륙 침략을 위한 병참 기지로 만들려고 금속·화학 공장을 세우고 지하자원을 마구 캐 갔어요."

- id: aegukdan
  n: 김구, 한인 애국단 조직
  ds: '1931'
  c: 민족운동
  i: 3
  at: [121.47, 31.22]
  ap: 1
  p: 상하이
  pg: 184
  t: 침체된 임시 정부에 활기를 불어넣으려 김구가 비밀 결사 한인 애국단을 만들었어요.
  x: "1920년대에 임시 정부는 국민 대표 회의 결렬과 대통령 이승만 탄핵 등으로 혼란을 겪었고, 1931년 만보산 사건과 만주 사변이 일어나면서 처지가 더 어려워졌어요. 한인 애국단은 평소 정해진 단원이 있는 조직이 아니라, 거사를 앞둔 사람이 가입 선서를 하고 곧바로 활동에 나서는 방식으로 움직였어요. 1932년 이봉창·윤봉길의 의거로 이름을 떨쳤고, 그 뒤 중국 국민당 정부의 도움으로 중국 군관 학교 안에 한인 특별반이 설치되어 독립군 간부를 길렀어요."

- id: lee-bongchang
  n: 이봉창 의거
  ds: '1932-01-08'
  c: 민족운동
  i: 3
  at: [139.752, 35.677]
  p: 일본 도쿄 (사쿠라다몬 밖)
  pg: 184
  t: 한인 애국단 이봉창이 도쿄에서 일본 국왕이 탄 마차 행렬에 폭탄을 던졌어요.
  x: "이봉창은 1931년 12월 김구 앞에서 한인 애국단 가입 선서를 하고 일본으로 건너갔어요. 1932년 1월 8일 육군 관병식을 마치고 돌아가던 일본 국왕의 행렬을 노렸지만, 다른 대신이 탄 마차를 국왕의 마차로 잘못 알고 폭탄을 던져 뜻을 이루지 못하고 현장에서 붙잡혔어요. 그해 10월 사형을 당해 순국했어요. 중국 신문이 '불행히도 맞지 않았다'고 보도하자 일본이 크게 반발했고, 이것이 중국과 일본의 대립을 키워 상하이 사변이 일어나는 한 원인이 됐어요."

- id: yun-bonggil
  n: 윤봉길 의거
  ds: '1932-04-29'
  c: 민족운동
  i: 3
  at: [121.48, 31.27]
  p: 상하이 훙커우 공원
  pg: 184
  t: 윤봉길이 일본군의 상하이 사변 승전 기념식장에 폭탄을 던져 일본군 고위 장교들을 처단했어요. 이후 중국 정부가 임시 정부를 지원했어요.
  x: "충남 예산 출신인 윤봉길은 고향에서 야학을 열어 농민을 깨우치는 활동을 하다가 1930년 망명했고, 의거 사흘 전 한인 애국단에 가입했어요. 기념식은 일본 국왕의 생일(천장절)과 상하이 사변 승리를 함께 기념하는 자리였고, 이 폭탄으로 일본군 사령관 시라카와 대장 등이 목숨을 잃었어요. 윤봉길은 현장에서 붙잡혀 일본으로 끌려간 뒤 그해 12월 가나자와에서 순국했어요. 의거 뒤 일제의 추격을 피해 임시 정부는 1932년 5월 상하이를 떠났어요."

- id: hangeul-rules
  n: 한글 맞춤법 통일안 발표
  ds: '1933-10-29'
  c: 문화
  i: 2
  at: [126.977, 37.570]
  ap: 1
  p: 서울 (조선어 학회)
  pg: 184
  t: 조선어 학회가 한글 맞춤법 통일안을 만들고 표준어를 정해 한글을 보급했어요.
  x: "조선어 학회는 1921년 만들어진 조선어 연구회를 이은 단체예요. 1930년 맞춤법 통일안을 만들기로 결의하고 3년 가까이 다듬어, 1933년 당시 한글날이던 10월 29일에 발표했어요. '표준말은 소리대로 적되 어법에 맞도록 한다'는 원칙은 광복 뒤 정부가 받아들여 오늘날 한글 맞춤법의 바탕이 됐어요. 1936년에는 표준말 모음을 펴냈고, 우리말 사전을 만드는 일도 이어 갔어요."

- id: sino-japanese-war
  n: 중일 전쟁 발발
  ds: '1937-07-07'
  c: 전쟁
  i: 2
  at: [116.21, 39.85]
  ap: 1
  p: 중국 베이징 루거우차오
  pg: 183
  t: 일본이 중국 본토를 침략했어요. 일제는 한국을 전쟁 물자를 대는 병참 기지로 삼고 사람과 물자를 수탈했어요.
  x: "1937년 7월 베이징 근처 루거우차오에서 일어난 충돌을 구실로 일본은 중국과 전면 전쟁을 시작했고, 그해 말 중국의 수도 난징까지 점령했어요. 전쟁이 길어지자 일제는 한국인을 전쟁에 동원하려고 황국 신민 서사 암송, 신사 참배, 창씨개명 같은 민족 말살 정책을 강화했어요. 옷차림까지 간섭해 남자에게는 국민복을, 여자에게는 '몸뻬'라는 헐렁한 일바지를 입게 했어요. 중국 관내에서는 이 전쟁을 계기로 조선 의용대가 만들어져 중국군과 함께 싸웠어요."

- id: deportation-1937
  n: 연해주 한인 강제 이주
  ds: '1937-09'
  c: 민족운동
  i: 2
  at: [131.89, 43.12]
  ap: 1
  p: 연해주 → 중앙아시아
  t: 소련이 연해주에 살던 한인 17만여 명을 화물 열차에 태워 카자흐스탄·우즈베키스탄 등 중앙아시아로 강제로 옮겼어요.
  x: "일본과 소련 사이의 긴장이 높아지자 소련의 스탈린 정권은 한인이 일본 첩자 노릇을 할 수 있다는 의심을 구실로 강제 이주를 결정했어요. 연해주는 대한 국민 의회가 세워졌을 만큼 한인 독립운동의 중요한 근거지였는데, 이 일로 그 기반이 무너졌어요. 봉오동 전투를 이끈 홍범도도 이때 카자흐스탄의 크질오르다로 옮겨졌어요. 중앙아시아로 옮겨진 한인과 그 후손을 오늘날 '고려인'이라고 불러요."

- id: hwangguk
  n: 황국 신민 서사 암송 강요
  ds: '1937-10'
  c: 정치
  i: 2
  at: [126.977, 37.580]
  ap: 1
  p: 전국
  pg: 183
  t: 일제가 일본 국왕에게 충성을 맹세하는 황국 신민 서사를 외우게 하고 신사 참배를 강요했어요(민족 말살 정책).
  x: "일제는 '일본과 조선은 하나'라는 내선일체를 내세워 한국인을 일본 국왕에게 충성하는 '황국 신민'으로 만들려 했어요. 학교와 관공서, 각종 모임에서 서사를 외우게 했고, 1938년에는 국민정신 총동원 조선 연맹을 만들어 동네의 애국반까지 이런 정책을 밀어붙였어요. 신사 참배를 끝까지 거부한 일부 기독교 학교는 문을 닫았고, 주기철 목사처럼 감옥에 갇혀 순교한 사람도 나왔어요."

- id: mobilization-law
  n: 국가 총동원법 제정
  ds: '1938-04-01'
  c: 정치
  i: 3
  at: [126.977, 37.580]
  ap: 1
  p: 전국 (한국에는 5월부터 적용)
  pg: 188
  t: 전쟁에 필요한 사람과 물자를 마음대로 동원할 수 있게 한 법이에요. 이 법을 바탕으로 물자 공출과 징용이 이루어졌어요.
  x: "1938년 4월 일본에서 공포된 이 법은 5월부터 한국에도 적용됐어요. 일제는 전쟁터에 보낼 식량을 채우려고 농가마다 쌀을 정해진 만큼 강제로 내놓게 했고(공출), 무기 재료로 쓰려고 농사 도구나 제사 그릇 같은 쇠붙이까지 거둬 갔어요. 이 법을 근거로 국민 징용령(1939)과 여자 정신 근로령(1944)이 나와 남녀를 가리지 않고 노동력을 끌어갔고, 따로 마련한 지원병제·징병제로는 청년들을 전쟁터에 보냈어요."

- id: uiyongdae
  n: 조선 의용대 창설
  ds: '1938-10-10'
  c: 민족운동
  i: 2
  at: [114.27, 30.59]
  p: 중국 한커우 (우한)
  pg: 183
  t: 김원봉을 중심으로 중국 관내에서 처음 만들어진 한국인 무장 부대예요. 중국군과 함께 정보 수집과 선전 활동을 했어요.
  x: "중일 전쟁이 일어난 이듬해 중국 국민당 정부의 동의를 얻어 한커우에서 만들어졌고, 김원봉이 대장을 맡았어요. 일본군 포로를 심문하고, 일본군과 중국 민중을 상대로 선전하며 적의 문서를 번역하는 일도 했어요. 1941년 무렵 많은 대원이 화베이로 옮겨 가 조선 의용대 화북 지대를 이루었고, 이는 1942년 조선 의용군으로 커졌어요. 남은 대원들은 1942년 한국 광복군 제1지대로 편입됐어요."

- id: conscription-labor
  n: 국민 징용령
  ds: '1939-10'
  c: 정치
  i: 2
  at: [126.977, 37.580]
  ap: 1
  p: 전국
  pg: 188
  t: 수많은 한국인을 일본·중국·동남아시아의 탄광과 군수 공장 등으로 끌고 가 강제로 노동을 시켰어요.
  x: "국가 총동원법을 바탕으로 1939년 10월부터 시행됐어요. 일제는 '모집'과 '관 알선'(1942년부터)이라는 이름으로도 사람들을 데려갔고, 1944년부터는 징용을 대대적으로 발동해 그해에만 한반도 안에 30만여 명, 일본에 22만여 명을 징용으로 동원했어요. 강제 동원된 사람들은 위험한 일터에서 혹사당했고, 많은 사람이 목숨을 잃거나 평생 후유증에 시달렸지만, 피해자들은 아직도 일본에게서 공식적인 사과와 법에 따른 배상을 받지 못했어요."

- id: soshi
  n: 창씨개명 강요
  ds: '1940-02-11'
  c: 정치
  i: 2
  at: [126.977, 37.580]
  ap: 1
  p: 전국
  pg: 183
  t: 한국인에게 성과 이름을 일본식으로 바꾸도록 강요했어요. 따르지 않으면 학교 입학과 취직에 불이익을 주었어요.
  x: "창씨개명은 일본식 성인 '씨(氏)'를 새로 만들고(창씨) 이름을 바꾼다(개명)는 뜻이에요. 일제는 '일본과 조선은 하나'라는 내선일체를 내세워 한국인의 성씨 전통까지 없애려 했어요. 국민정신 총동원 조선 연맹 같은 단체가 나서서 창씨개명을 부추겼고, 따르지 않은 사람에게는 여러 불이익이 돌아갔어요. 비상 교과서는 한국어 사용 금지, 황국 신민 서사 암송과 함께 이를 민족 말살 정책의 대표적인 예로 들어요."

- id: papers-closed
  n: 조선일보·동아일보 강제 폐간
  ds: '1940-08-10'
  c: 문화
  i: 1
  at: [126.977, 37.570]
  ap: 1
  p: 서울
  t: 일제가 한글 신문을 강제로 폐간했어요.
  x: "중일 전쟁 뒤 일제는 전쟁에 협력하도록 언론 통제를 강화했고, 한국어 사용을 막는 정책과 함께 한글 신문과 잡지도 없앴어요. 1940년 8월 10일 『조선일보』와 『동아일보』가 같은 날 강제로 폐간됐어요. 두 신문은 광복 뒤인 1945년 11월(조선일보)과 12월(동아일보)에 다시 발행되기 시작했어요."

- id: chongqing
  n: 임시 정부, 충칭에 정착
  ds: '1940-09'
  c: 민족운동
  i: 2
  at: [106.55, 29.56]
  p: 중국 충칭
  pg: 183
  t: 윤봉길 의거 뒤 일제의 추격을 피해 항저우·전장·창사·광저우·류저우·치장으로 옮겨 다니던 임시 정부가 충칭에 자리 잡았어요.
  x: "임시 정부는 1932년 5월 상하이를 떠난 뒤 1940년 9월 충칭에 자리 잡기까지 8년 넘게 옮겨 다녔어요. 충칭은 일본과 싸우던 중국 국민당 정부의 임시 수도였어요. 충칭에 정착한 임시 정부는 1940년 세 정당을 합쳐 한국 독립당을 만들고, 그해 10월 헌법을 고쳐 주석이 정부를 이끄는 주석제를 도입했으며, 김구가 주석으로 임시 정부를 이끌었어요. 같은 해 9월 한국 광복군을 창설했고, 1944년 무렵에는 김규식 등 조선 민족 혁명당 인사들도 참여해 여러 세력이 함께하는 정부가 됐어요."

- id: gwangbokgun
  n: 한국 광복군 창설
  ds: '1940-09-17'
  c: 민족운동
  i: 3
  at: [106.55, 29.56]
  p: 중국 충칭
  pg: 183
  t: 임시 정부의 정규 군대로 한국 광복군을 만들었어요. 1942년 김원봉의 조선 의용대 일부가 합류했어요.
  x: "1940년 9월 17일 충칭에서 총사령부를 세웠고, 총사령관은 지청천, 참모장은 이범석이었어요. 처음에는 중국의 지원을 받는 대신 중국군 참모 총장의 지휘를 받아야 하는 제약이 있었는데, 임시 정부가 이를 고치려 노력해 1945년 4월 새 군사 협정을 맺었어요. 1942년에 들어온 조선 의용대 대원들은 제1지대로 편성됐고, 김원봉이 지대장을 맡았어요. 이후 광복군은 인도·미얀마 전선에서 연합군과 함께 활동하고 국내 진공 작전을 준비했어요."

- id: founding-platform
  n: 대한민국 건국 강령 발표
  ds: '1941-11-28'
  c: 민족운동
  i: 3
  at: [106.55, 29.56]
  p: 충칭
  pg: 185
  t: 임시 정부가 광복 뒤 세울 나라의 모습으로 민주 공화정, 보통 선거, 토지·주요 산업의 국유화 등을 담은 건국 강령을 발표했어요.
  x: "건국 강령은 조소앙이 내세운 삼균주의를 바탕으로 했어요. 삼균주의는 정치·경제·교육의 균등을 이루고, 나아가 개인과 개인, 민족과 민족, 국가와 국가 사이의 균등까지 실현하자는 생각이에요. 그래서 보통 선거와 토지 국유화에 더해, 나라의 돈으로 의무 교육을 실시해 누구나 배울 수 있게 하자는 내용도 담았어요. 이는 광복 뒤 세울 나라를 미리 설계한 것으로, 미래엔 교과서도 정치·경제·교육의 균등을 실현하려 한 강령으로 소개해요."

- id: war-declaration
  n: 임시 정부, 일본에 선전 포고
  ds: '1941-12-10'
  c: 민족운동
  i: 2
  at: [106.55, 29.56]
  p: 충칭
  pg: 183
  t: 태평양 전쟁이 일어나자 임시 정부는 일본에 선전 포고를 하고 한국 광복군을 연합군의 일원으로 참전시켰어요.
  x: "1941년 12월 일본이 미국·영국과 전쟁을 시작하자(태평양 전쟁), 임시 정부는 곧바로 '대일 선전 성명서'를 발표해 일본과 싸우는 연합국 편에 섰음을 분명히 했어요. 1945년 2월에는 독일에도 선전 포고를 했어요. 그러나 광복 뒤 미군정이 임시 정부를 정부로 인정하지 않아, 임시 정부 지도자들은 개인 자격으로 귀국해야 했어요."

- id: dongnip-dongmaeng
  n: 조선 독립 동맹·조선 의용군 결성
  ds: '1942-07'
  c: 민족운동
  i: 2
  at: [113.6, 36.8]
  ap: 1
  p: 중국 화베이 (타이항산 일대)
  pg: 183
  t: 화베이로 간 조선 의용대 대원들이 김두봉 등과 조선 독립 동맹을 만들고 그 군대로 조선 의용군을 두었어요.
  x: "1941년 타이항산 일대에서 만들어진 화북 조선 청년 연합회가 1942년 7월 조선 독립 동맹으로 바뀌었고, 화베이로 간 조선 의용대도 이때 조선 의용군으로 커졌어요. 위원장은 김두봉, 조선 의용군 총사령은 무정이었고, 중국 공산당의 지원을 받으며 옌안을 중심으로 일본군과 싸웠어요. 광복 뒤 이들은 북한으로 들어갔고, 조직은 1946년 조선 신민당으로 바뀌었어요. 임시 정부·조선 건국 동맹과 함께 광복 뒤 세울 나라를 준비한 국외 단체 가운데 하나였어요."

- id: language-society
  n: 조선어 학회 사건
  ds: '1942-10'
  c: 문화
  i: 2
  at: [126.977, 37.570]
  ap: 1
  p: 서울
  pg: 184
  t: 일제가 우리말 사전을 만들던 조선어 학회 회원들을 독립운동 단체라며 체포해 학회를 해산시켰어요.
  x: "1942년 함흥의 한 여학생이 기차 안에서 친구들과 한국말로 이야기하다 경찰에 걸린 일을 실마리로, 일제는 사전 편찬에 참여하던 정태진을 잡아간 뒤 학회를 독립운동 단체로 몰았어요. 이듬해 4월까지 33명이 붙잡혀 치안 유지법의 내란죄로 재판을 받았고, 이윤재와 한징은 감옥에서 숨졌어요. 이극로·최현배·이희승 등은 징역형을 받고 갇혀 있다가 광복 이틀 뒤인 1945년 8월 17일에야 풀려났어요."

- id: cairo
  n: 카이로 선언
  ds: '1943-12-01'
  c: 외교
  i: 2
  at: [31.24, 30.04]
  p: 이집트 카이로
  pg: 185
  t: 미국·영국·중국 정상이 '적당한 시기에' 한국을 자유롭게 독립시키기로 결의했어요. 국제 사회가 한국의 독립을 처음 약속한 선언이에요.
  x: "1943년 11월 미국의 루스벨트, 영국의 처칠, 중국의 장제스가 카이로에서 회담을 열었고, 그 결과를 담은 이 선언이 12월 1일 발표됐어요. 한국에 대해서는 '조선 인민의 노예 상태에 유의하여 적당한 시기에 자유 독립하게 할 것'을 결의했어요. 다만 '적당한 시기에'라는 표현 때문에 독립 시기가 분명하지 않았고, 1945년 2월 얄타 회담에서는 한국에 대한 신탁 통치가 거론되기도 했어요."

- id: imphal
  n: 한국 광복군, 인도·미얀마 전선 참여
  ds: '1943-08'
  c: 민족운동
  i: 2
  at: [93.94, 24.81]
  ap: 1
  p: 인도·미얀마 전선 (임팔 등)
  pg: 183
  t: 광복군 공작대가 영국군을 도와 일본군 문서 번역, 포로 심문, 선전 활동을 맡았어요.
  x: "인도·미얀마 전선은 영국군이 일본군과 맞서 싸우던 곳이에요. 미래엔 교과서는 광복군이 이곳에서 연합군과 함께 포로 심문뿐 아니라 암호 해독 같은 작전도 맡았다고 써요. 한국 광복군이 중국 밖의 실제 전선에서 연합군의 일원으로 활동한 대표적인 사례로, 임시 정부가 연합국과 함께 일본에 맞서 싸웠음을 보여 줘요."

- id: conscription
  n: 징병제 실시
  ds: 1943
  dt: "1943년 (1944년 4월 첫 징병 검사)"
  c: 정치
  i: 2
  at: [126.977, 37.580]
  ap: 1
  p: 전국
  pg: 188
  t: "지원병제에 이어 1943년 징병제를 도입하고, 1944년 4월부터 징병 검사를 해 9월부터 한국 청년들을 전쟁터로 끌고 갔어요."
  x: "태평양 전쟁에서 병력이 모자라자 일제는 지원병만으로는 부족하다고 보고 한국 청년을 직접 군대로 끌어가는 징병제를 시행했어요. 1944년 4~8월 첫 징병 검사에 20만 6천여 명이 불려 나왔고, 실제로 입대한 사람은 적어도 18만 4천 명이 넘는 것으로 추산돼요. 일본군에 끌려간 청년 가운데에는 학도병으로 끌려갔다가 탈출해 한국 광복군에 들어간 장준하 같은 사람도 있었어요."

- id: women-labor
  n: 여자 정신 근로령
  ds: '1944-08'
  c: 정치
  i: 2
  at: [126.977, 37.580]
  ap: 1
  p: 전국
  pg: 188
  t: 여성들까지 군수 공장 등에 동원했어요. 많은 여성이 일본군 '위안부'로 끌려가 큰 고통을 겪었어요. 피해자들은 지금도 일본 정부에 진정한 사과와 법적 배상을 요구하고 있어요.
  x: "여자 정신 근로령은 여성들을 '정신대'라는 이름으로 묶어 군수 공장 등에서 일하게 한 법령이에요. 일본군 '위안부'는 이와 다른 것으로, 일본군이 위안소를 두고 여성들을 끌고 가 성적 고통을 겪게 한 일이에요. 두 말이 오랫동안 섞여 쓰였지만 서로 구별해야 해요. 피해 규모는 정확히 알 수 없을 만큼 컸고, 1991년 김학순 할머니가 처음으로 피해 사실을 공개 증언하면서 국제 사회에 널리 알려졌어요."

- id: geonguk-dongmaeng
  n: 조선 건국 동맹 결성
  ds: '1944-08-10'
  c: 민족운동
  i: 2
  at: [126.977, 37.570]
  ap: 1
  p: 서울
  pg: 185
  t: 여운형이 광복에 대비해 국내에서 비밀리에 만든 단체예요. 광복 직후 조선 건국 준비 위원회로 이어졌어요.
  x: "일제의 패망을 내다본 여운형은 1944년 8월 서울에서 뜻을 같이하는 사람들과 비밀리에 이 단체를 만들고 위원장을 맡았어요. 조직을 전국으로 넓히고 농민 동맹·부인 동맹 같은 조직도 만들며 광복 뒤 나라를 세울 준비를 했어요. 비상 교과서는 임시 정부의 건국 강령과 함께, 국내외 독립운동 단체들이 광복에 대비해 새 나라를 준비한 사례로 이 단체를 들어요."

- id: domestic-advance
  n: 한국 광복군, 국내 진공 작전 준비
  ds: '1945-05'
  es: '1945-08'
  c: 민족운동
  i: 2
  at: [108.94, 34.34]
  ap: 1
  p: 중국 시안 (광복군 제2지대)
  pg: 183
  t: 미국 전략 정보국(OSS)과 함께 대원들을 특수 훈련시켜 국내로 들여보내려 했지만, 일본이 먼저 항복해 실행하지 못했어요.
  x: "훈련은 시안의 제2지대와 푸양의 제3지대를 중심으로 이루어졌고, 1945년 8월 4일 3개월 과정을 마친 첫 대원들이 배출됐어요. 그러나 작전을 실행하기 직전 일본이 항복해 계획은 무산됐어요. 8월 18일 이범석·장준하 등이 정진대로 서울 여의도 비행장에 내렸지만, 일본군이 입국을 막아 다음 날 중국으로 돌아가야 했어요."

- id: potsdam
  n: 포츠담 선언
  ds: '1945-07-26'
  c: 외교
  i: 2
  at: [13.06, 52.39]
  p: 독일 포츠담
  pg: 185
  t: 연합국이 일본에 무조건 항복을 요구하며 카이로 선언의 약속(한국 독립)을 다시 확인했어요.
  x: "독일이 항복한 뒤 연합국 지도자들이 독일의 포츠담에서 회담을 열고 일본에 항복을 요구한 선언이에요. 선언에 카이로 선언의 내용을 지킨다는 조항이 들어가, 한국 독립 약속이 다시 확인됐어요. 일본이 곧바로 받아들이지 않자 미국이 원자 폭탄을 떨어뜨리고 소련도 일본에 선전 포고했으며, 결국 일본은 8월 15일 항복을 발표했어요."

# ───── R3 검수에서 더한 사건 (두 교과서 대조) ─────

- id: paris-petition
  n: "김규식, 파리 강화 회의에 독립 청원"
  d: 1919
  c: "민족운동"
  i: 1
  at: [2.35, 48.86]
  p: "프랑스 파리"
  pg: 182
  t: "김규식이 파리 강화 회의에 대표로 가서 한국의 독립을 청원하는 글을 냈어요. 임시 정부의 외교 활동으로 이어졌어요."
  x: "제1차 세계 대전 뒤 파리 강화 회의가 열리자 상하이의 독립운동가들은 신한 청년당을 만들고 김규식을 대표로 보냈어요. 김규식은 1919년 3월 파리에 도착했고, 임시 정부가 세워진 뒤에는 외무총장 겸 파리 주재 위원으로 임명돼 파리 위원부를 이끌었어요. 하지만 열강이 약소국의 목소리를 외면해 성과를 거두지 못했어요. 민족 자결주의는 패전국의 식민지에만 적용됐기 때문이에요."

- id: hanguk-tongsa
  n: "박은식, 『한국통사』"
  d: 1915
  c: "민족운동"
  i: 1
  at: [121.47, 31.23]
  p: "중국 상하이"
  pg: 184
  t: "박은식이 일제의 침략 과정을 정리한 『한국통사』를 써서 민족의식을 일깨웠어요. 나라는 형체이고 역사는 정신이라며 역사를 지키자고 했어요."
  x: "1864년 고종 즉위부터 1911년 105인 사건까지 47년 동안의 역사를 3편 114장에 담았어요. 박은식은 일제가 빼앗은 것은 나라의 형체(국백)일 뿐이고 나라의 혼(국혼)은 남아 있으니, 이를 지키면 다시 독립할 수 있다고 보았어요. 1920년에는 3·1 운동을 중심으로 독립 투쟁의 역사를 정리한 『한국독립운동지혈사』도 펴냈고, 1925년에는 임시 정부의 제2대 대통령이 되었어요."

- id: gagyanal
  n: "가갸날(한글날) 제정"
  d: 1926
  c: "민족운동"
  i: 1
  at: [126.978, 37.566]
  ap: 1
  p: "서울 (조선어 연구회)"
  pg: 184
  t: "조선어 연구회가 훈민정음 반포를 기념하는 가갸날을 정했어요. 지금의 한글날이 됐어요."
  x: "처음 가갸날은 『세종실록』에 훈민정음이 완성됐다고 적힌 음력 9월의 마지막 날(29일)을 기준으로 정했어요. 뒤에 이름이 '한글날'로 바뀌고 날짜도 양력으로 고쳐 계산하면서 몇 차례 달라져, 1933년 한글 맞춤법 통일안을 발표한 10월 29일도 당시의 한글날이었어요. 1940년 무렵 경북 안동에서 『훈민정음』 해례본이 발견되자 책에 적힌 반포 날짜(음력 9월 상순)를 양력으로 바꿔, 지금처럼 10월 9일을 한글날로 기념하게 됐어요."

- id: literacy-movement
  n: "문자 보급 운동·브나로드 운동"
  d: 1929
  e: 1934
  c: "민족운동"
  i: 1
  at: [126.978, 37.566]
  ap: 1
  p: "전국 농촌"
  pg: 182
  t: "조선일보의 문자 보급 운동과 동아일보의 브나로드 운동으로 학생들이 방학 때 농촌에 가서 한글을 가르쳤어요."
  x: "조선일보는 1929년 여름 방학부터 학생들이 고향에 내려가 한글을 가르치게 했고, '아는 것이 힘, 배워야 산다'는 구호와 함께 『한글원본』이라는 교재를 펴냈어요. 동아일보는 1931년부터 1934년까지 네 차례 브나로드 운동을 벌였는데, '브나로드'는 '민중 속으로'라는 뜻의 러시아어예요. 학생들은 한글과 셈하기에 위생 지식 등도 가르쳤지만, 두 운동 모두 조선 총독부의 금지로 중단됐어요."

- id: volunteer-soldier
  n: "지원병제 실시"
  d: 1938
  c: "정치"
  i: 1
  at: [126.978, 37.566]
  ap: 1
  p: "전국"
  pg: 188
  t: "중일 전쟁 뒤 일제는 육군 특별 지원병령을 만들어 한국 청년을 군대로 끌어들이기 시작했어요. 1943년에는 징병제를 도입했어요."
  x: "육군 특별 지원병령은 1938년 2월에 공포됐어요. 이름은 '지원'이었지만 국민정신 총동원 조선 연맹 같은 단체까지 나서서 지원을 부추겼어요. 육군 특별 지원병으로 일본군이 된 한국인은 1만 6천여 명으로 집계돼요. 1943년에는 전문학교·대학 학생을 전쟁터로 보내는 학도 지원병제도 실시됐어요."

- id: korean-ban
  n: "조선어 교육 폐지와 한국어 사용 금지"
  d: 1938
  dt: "1938년 이후"
  c: "정치"
  i: 2
  at: [126.978, 37.566]
  ap: 1
  p: "전국"
  pg: 183
  t: "민족 말살 정책으로 학교에서 조선어를 선택 과목으로 돌려 사실상 가르치지 않았고, 학교와 관공서에서 한국어를 쓰지 못하게 했어요."
  x: "일제는 우리말을 배우지도 쓰지도 못하게 해 민족의식을 뿌리째 없애려 했어요. 1942년에는 함흥의 한 여학생이 기차 안에서 친구들과 한국말로 이야기하다 경찰에 걸린 일이 조선어 학회 사건으로 번지기도 했어요. 1940년에는 한글 신문인 『조선일보』와 『동아일보』도 강제로 폐간됐어요. 이에 맞서 국어학자들은 맞춤법을 통일하고 사전을 만들며 우리말을 지키려 애썼어요."

# ---- 11단계 추가 (비상 182~194쪽)
- id: daeseong-graduates
  n: 대성 학교 첫 졸업생 배출
  d: 1912
  c: 민족운동
  i: 1
  at: [125.75, 39.02]
  p: 평양
  pg: 179
  t: 안창호가 평양에 세운 대성 학교가 첫 졸업생을 냈어요. 신민회는 이런 학교를 세워 민족 교육으로 실력을 기르려 했어요.
  x: "대성 학교는 윤치호가 교장, 안창호가 대리 교장을 맡은 중등 학교로, 건전한 인격과 애국심을 갖춘 인재를 기르려 했어요. 체육 시간에는 군대식 훈련을 할 만큼 몸을 단련하는 일도 중요하게 여겼어요. 1912년 봄 첫 졸업생 19명을 냈지만, 일제의 탄압으로 곧 문을 닫았어요. 신민회는 대성 학교와 함께 오산 학교도 세워 민족 교육에 힘썼어요."

- id: korean-national-council
  n: 대한 국민 의회 수립
  d: '1919-03'
  c: 민족운동
  i: 2
  at: [131.89, 43.12]
  p: 연해주 블라디보스토크
  pg: 182
  t: 3·1 운동 직후 연해주에서 세워진 임시 정부예요. 그해 9월 상하이의 대한민국 임시 정부로 합쳐졌어요.
  x: "연해주 한인 단체인 전로 한족회 중앙 총회를 바탕으로 블라디보스토크에서 세워졌고, 의원들로 이루어진 의회 형태의 정부였어요. 대통령에 손병희, 부통령에 박영효, 국무총리에 이승만을 추대했지만 실제로 행정부를 꾸리지는 못했어요. 1919년 8월 해산을 결의하고 통합에 참여했지만, 통합 과정이 약속과 다르게 진행되자 일부는 반발해 1920년 대한 국민 의회를 다시 세웠어요."

- id: hanseong-gov
  n: 한성 정부 수립
  d: '1919-04'
  c: 민족운동
  i: 2
  at: [126.98, 37.57]
  p: 서울
  pg: 182
  t: 서울에서 13도 대표 이름으로 선포된 임시 정부예요. 그해 9월 대한민국 임시 정부로 합쳐질 때 이 정부의 정통성을 이어받았어요.
  x: "1919년 4월 23일 서울에서 '국민 대회'라는 이름을 내걸고 임시 정부 수립을 선포했어요. 약법(헌법)에서 민주제와 대의제를 택했고, 집정관 총재에 이승만, 국무총리 총재에 이동휘를 뽑았어요. 9월 통합 정부의 대통령 이승만, 국무총리 이동휘라는 인선은 한성 정부의 인선과 같아요. 비상 교과서는 국내외 여러 임시 정부가 모두 민주 공화정을 지향했다고 설명해요."

- id: joseon-sports-council
  n: 조선 체육회 설립
  d: 1920
  c: 사회
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: 경성
  pg: 194
  t: 조선 체육회가 세워지면서 근대 스포츠가 본격적으로 퍼졌어요. 경성과 평양이 맞붙는 경평 축구는 큰 볼거리였어요.
  x: "1920년 7월 서울에서 70여 명이 모여 창립했고, 그해 11월 첫 사업으로 배재 고등 보통학교 교정에서 제1회 전조선 야구 대회를 열었어요. 이 대회는 오늘날 전국 체육 대회의 출발점으로 여겨져요. 조선 체육회는 1938년 조선 총독부에 의해 강제로 해산됐고, 그 전통은 오늘날의 대한 체육회로 이어지고 있어요."

- id: korean-independence-corps
  n: 대한 독립 군단 결성
  d: '1920-12'
  c: 민족운동
  i: 2
  at: [131.87, 45.53]
  ap: 1
  p: 밀산
  pg: 183
  t: 간도 참변을 피해 옮겨 간 독립군 부대들이 밀산에서 대한 독립 군단으로 뭉친 뒤 러시아 자유시로 옮겨 갔어요.
  x: "봉오동·청산리에서 진 일본군은 독립군의 터전을 없애려고 간도의 한인 마을을 습격해 많은 사람을 죽였어요(간도 참변). 밀산에 모인 독립군은 서일을 총재, 홍범도를 부총재로 해 3,500여 명의 대한 독립 군단을 꾸렸어요. 그러나 러시아 자유시로 옮겨 간 뒤 1921년 6월, 독립군 내부의 갈등과 러시아 적군의 무장 해제 요구 속에 공격을 받아 600명이 넘는 희생자가 나왔어요(자유시 참변)."

- id: sauichanmi
  n: 윤심덕, 「사의 찬미」 레코드 발매
  d: 1926
  c: 문화
  i: 1
  nomap: 1
  at: [126.978, 37.566]
  p: 서울
  pg: 194
  t: 우리나라 첫 소프라노 가수 윤심덕이 부른 「사의 찬미」가 레코드로 나왔어요. 축음기로 노래를 듣는 대중문화가 퍼졌어요.
  x: "영화·라디오·대중가요는 1920년대에 처음 퍼지기 시작해 1930년대에 들어 많은 사람이 즐기는 문화로 자리 잡았어요. 나운규가 직접 만들고 주인공까지 맡은 영화 「아리랑」은 나라 잃은 사람들의 아픔과 서러움을 담아 많은 관객을 모았어요. 이런 대중문화는 백화점과 영화관이 들어선 경성 같은 도시를 중심으로 퍼져 나갔어요."
