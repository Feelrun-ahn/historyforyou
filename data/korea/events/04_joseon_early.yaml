# 조선 전기 (교과서 IV 단원 1~3). 임진왜란·정유재란·호란은 data/wars/korea.yaml

- id: joseon-founding
  n: 조선 건국
  d: '1392-07-17'
  c: 정치
  i: 3
  at: [126.56, 37.97]
  ap: 1
  p: 개경 수창궁
  pg: 115
  t: 이성계가 급진파 사대부의 추대를 받아 왕위에 오르면서 고려가 멸망하고 새 왕조가 열렸어요. 이듬해 나라 이름을 고조선을 잇는다는 뜻의 '조선'으로 정했어요.
  x: "1388년 위화도에서 군대를 돌려 실권을 쥔 이성계는 정도전 등 급진파 사대부와 함께 1391년 과전법으로 토지 제도를 뜯어고쳐, 나라 살림과 자기 세력의 경제적 바탕을 마련했어요. 고려를 지키려던 정몽주 등 온건파가 제거되자 새 왕조로 가는 길이 열렸어요. 새 왕조에서는 집안 배경보다 개인이 갖춘 유교 학식이 더 중요해졌고, 불교 대신 유교 윤리가 나라와 사회의 기준이 됐어요."

- id: hanyang
  n: 한양 천도
  d: '1394-10'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 115
  t: 태조가 나라의 중앙에 있고 한강이 흘러 교통이 편리한 한양으로 도읍을 옮겼어요. 경복궁, 종묘와 사직, 도성을 차례로 지었어요.
  x: "한양은 풍수지리로 보아도 좋은 땅이었고, 둘레의 산이 자연 성벽 노릇을 해 지키기에도 좋았어요. 궁궐을 가운데 두고 왼쪽(동쪽)에는 조상 왕들의 신주를 모시는 종묘를, 오른쪽(서쪽)에는 땅과 곡식의 신을 섬기는 사직단을 두는 유교식 배치를 따랐어요. 흥인지문(인)·돈의문(의)·숭례문(예)처럼 성문 이름에도 유교 덕목을 담았고, 경복궁과 그 안 건물들의 이름은 정도전이 지었어요."

- id: prince-strife-1
  n: 1차 왕자의 난
  d: '1398-08'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 116
  t: 이방원이 재상 중심의 정치를 주장하던 정도전과 세자 이방석을 제거했어요. 1400년 2차 왕자의 난을 거쳐 이방원이 왕(태종)이 됐어요.
  x: "태조가 둘째 부인 강씨가 낳은 여덟째 아들 방석을 세자로 세우고 정도전에게 세자 교육을 맡기자, 첫째 부인 한씨가 낳은 방원 등 왕자들의 불만이 커졌어요. 게다가 군사권을 나라로 모으는 정책으로 왕자들의 사병이 해체될 위기에 놓이자, 이방원은 먼저 사병을 움직여 정도전·남은과 방석·방번 형제를 죽였어요. 그 뒤 둘째 형 방과가 왕(정종)이 됐지만 실권은 이방원이 쥐었어요."

- id: taejong
  n: "태종 즉위"
  d: '1400-11'
  c: 정치
  i: 2
  at: [126.55, 37.97]
  ap: 1
  p: 개경 (1405년 한양으로 다시 옮김)
  pg: 116
  t: "세자 시절인 1400년 음력 4월 공신과 왕족의 사병을 없앤 이방원이 왕(태종)이 됐어요. 6조가 왕에게 직접 보고하게 해 왕권을 강화했어요."
  x: "6조가 왕에게 바로 보고하는 이 방식을 6조 직계제라고 하며, 그만큼 3정승이 있는 의정부의 권한은 줄었어요. 이방원은 1400년 넷째 형 방간과 박포가 일으킨 군사를 개경 시가전에서 꺾고(2차 왕자의 난) 왕위를 이을 세제가 된 뒤 정종에게 왕위를 물려받았어요. 왕이 된 뒤에는 호적을 새로 만들고 호패를 차게 해 백성 수를 정확히 헤아렸는데, 이것이 세금과 군역을 매기는 근거가 됐어요. 1405년에는 도읍을 다시 한양으로 옮겼어요."

- id: honil
  n: 「혼일강리역대국도지도」 제작
  d: 1402
  c: 문화
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 130
  t: 아시아·유럽·아프리카까지 그린 세계 지도예요. 현재 남아 있는 동양에서 가장 오래된 세계 지도로 꼽혀요.
  x: "태종 때 김사형·이무가 제작을 이끌고 이회가 실무를 맡아, 중국에서 들여온 지도 두 가지를 바탕으로 우리나라와 일본 부분을 더해 만들었어요. 조선이 다른 지역에 비해 몇 배나 크게 그려진 것이 특징이에요. 원본은 전하지 않고, 일본 류코쿠 대학 도서관에 있는 모사본 등으로 내용을 알 수 있어요. 나라를 다스리고 국방을 튼튼히 하려고 지도와 지리서를 활발히 만든 조선 초의 분위기를 보여 줘요."

- id: hopae
  n: 호패법 실시
  d: 1413
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 116
  t: 16세 이상 남자에게 신분증인 호패를 차게 해 인구를 파악하고 세금과 군역을 거두는 데 활용했어요. 같은 해 전국을 8도로 나누었어요.
  x: "왕족·관리부터 양인·노비까지 16세 이상 모든 남자가 대상이었고, 신분에 따라 호패의 재료와 적는 내용이 달랐어요. 하지만 백성들은 호패를 받으면 무거운 국역을 지게 된다고 여겨 피하는 일이 많았고, 그래서 여러 차례 폐지됐다가 다시 실시되기를 되풀이했어요. 1675년(숙종 1)에 다시 실시된 뒤에야 고종 때까지 이어졌어요."

- id: sejong
  n: 세종 즉위
  d: '1418-08'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양 경복궁
  pg: 116
  t: 세종은 집현전을 중심으로 학문을 장려하고 의정부의 권한을 강화했어요. 훈민정음 창제, 과학 기술 발달, 4군 6진 개척 등 많은 업적을 남겼어요.
  x: "아버지 태종이 왕권을 튼튼히 다져 둔 덕분에, 세종은 신하들과 함께 유교의 이상을 펼치는 정치에 힘을 쏟을 수 있었어요. 6조가 올린 일을 3정승이 있는 의정부가 먼저 살핀 뒤 왕에게 보고하게 했는데(의정부 서사제), 이는 태종 때의 6조 직계제와 반대되는 방식이에요. 경연에서 신하들과 자주 토론했고, 땅에 매기는 세금 제도를 고쳐 백성의 짐을 덜었으며, 나라의 여러 의례도 유교식으로 다듬었어요."


- id: jiphyeonjeon
  n: "집현전 설치"
  d: 1420
  c: 문화
  i: 2
  at: [126.977, 37.579]
  p: 한양 경복궁
  pg: 116
  t: "세종이 집현전을 학문 연구와 정책 자문 기관으로 키웠어요(이름만 있던 기관을 키운 것이라 확대·개편이라고도 해요). 젊은 학자들이 이곳에서 훈민정음 창제와 여러 책 편찬을 도왔어요."
  x: "집현전은 궁궐 안에 두고 능력 있는 학자를 길러 내던 곳이에요. 그런데 세조 때 하위지 등 집현전 출신 학자들이 단종 복위 운동에 가담했다가 처형되자, 세조는 집현전을 없애고 경연도 열지 않았어요. 성종 때 집현전을 이은 홍문관이 세워져 학문 연구와 경연을 다시 맡았고, 홍문관은 사헌부·사간원과 함께 3사가 됐어요."

- id: sampo-open
  n: 3포 개항
  d: 1426
  c: 외교
  i: 2
  at: [129.04, 35.10]
  ap: 1
  p: 제포·부산포·염포
  pg: 120
  t: 대마도주의 요청으로 제포(창원 진해), 부산포(부산), 염포(울산)를 열어 일본인의 거류와 제한된 무역을 허락했어요.
  x: "왜구가 계속 서남 해안을 침략하자 세종은 1419년 이종무를 보내 왜구의 근거지인 대마도를 토벌했고, 교류가 끊겨 물자가 부족해진 대마도주가 왜구를 막겠다며 교역을 간청했어요. 부산포와 제포(내이포)는 1407년에 이미 열린 적이 있고, 1426년 염포를 더해 3포가 됐어요. 교역은 3포와 한양에 둔 왜관을 중심으로 이루어졌어요."

- id: nongsa
  n: 『농사직설』 편찬
  d: 1429
  c: 문화
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 130
  t: 각 지방 농부들의 경험을 모아 우리 풍토에 맞는 농사법을 정리한 농서예요.
  x: "세종 때 정초·변효문 등이 왕명으로 펴낸 책이에요. 풍토가 다르면 농사법도 달라야 하는데 그때까지는 중국 농서에 기대고 있었기 때문에, 각 도 관찰사에게 경험 많은 농부들의 이야기를 모으게 했어요. 벼·보리·콩 등 곡식 기르는 법과 거름 주기, 밭갈이 등을 담아 이듬해 각 도와 고을에 나눠 주었고, 국산 약재를 다룬 『향약집성방』과 함께 백성의 삶을 돕는 편찬 사업으로 꼽혀요."

- id: four-gun
  n: 최윤덕, 4군 설치
  d: 1433
  e: 1443
  c: 전쟁
  i: 3
  at: [126.60, 41.40]
  ap: 1
  p: 압록강 상류
  pg: 120
  t: 여진의 약탈이 계속되자 세종이 최윤덕을 보내 여진을 몰아내고 압록강 상류에 4군을 설치했어요.
  x: "4군은 압록강 상류의 여연·자성·무창·우예로, 1416년 여연을 시작으로 1443년 우예까지 차례로 설치됐어요. 1433년 최윤덕이 1만 5천여 명의 군사로 여진 추장 이만주 세력을 쳤고, 1437년에는 이천이 다시 정벌했어요. 그러나 지키기가 어려워 단종·세조 때 모두 없애고 주민을 옮겼는데, 영토를 포기했다기보다 방어선을 잠시 물린 것이었고 이 땅은 '폐사군'이라 불렸어요."

- id: six-jin
  n: 김종서, 6진 설치
  d: 1434
  e: 1449
  c: 전쟁
  i: 3
  at: [129.75, 42.44]
  ap: 1
  p: 두만강 하류 (회령 등)
  pg: 120
  t: 김종서가 두만강 하류의 여진을 몰아내고 6진을 설치했어요. 4군 6진으로 오늘날과 같은 압록강~두만강 국경선이 정해졌어요.
  x: "1433년 여진 부족끼리 싸움이 나 오도리족 추장이 죽자, 세종은 이 기회에 김종서를 함길도 도절제사로 보내 북방 개척을 맡겼어요. 6진은 종성·온성·회령·경원·경흥·부령으로, 1449년 부령부를 두면서 완성됐어요. 조선은 남쪽 지방 백성을 이곳으로 옮겨 살게 하고(사민 정책), 그 지방 유력자에게 토관이라는 벼슬을 주어 민심을 달래며 땅을 다졌어요."

- id: angbu
  n: 앙부일구·자격루 제작
  d: 1434
  c: 문화
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 130
  t: 해시계 앙부일구와 장영실이 만든 자동 물시계 자격루로 정확한 시각을 알렸어요. 같은 해 금속 활자 갑인자도 만들었어요.
  x: "앙부일구는 ‘솥이 하늘을 향해 열려 있는 모양의 해시계’라는 뜻으로, 오목한 면에 비친 바늘 그림자로 시각과 절기를 함께 알 수 있었어요. 세종은 이를 사람이 많이 다니는 혜정교 옆과 종묘 남쪽 길가에 두고, 글을 모르는 백성도 읽을 수 있게 시각을 12지신 동물 그림으로 나타냈어요. 갑인자는 글자가 네모반듯해 활자를 빨리 짜 맞출 수 있었고 잘 닳지도 않았어요."

- id: chugugi
  n: 측우기 제작
  d: 1441
  c: 문화
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 129
  t: 비가 내린 양을 재는 측우기를 만들어 서울과 전국 각 고을에 두고 강우량을 기록했어요.
  x: "농사가 나라 살림의 바탕이었던 조선에서 비의 양은 그해 농사가 잘될지 가늠하는 중요한 정보였어요. 그래서 각 고을에서 잰 비의 양을 모아 풍흉을 살폈는데, 날씨를 숫자로 기록해 다루려 한 조선 정부의 과학적인 태도를 보여 줘요. 혼천의·간의 같은 천문 관측 기구, 앙부일구·자격루 같은 시계와 함께 세종 때 과학 기술 발달을 대표해요."

- id: gyehae
  n: 계해약조
  d: 1443
  c: 외교
  i: 1
  at: [129.30, 34.40]
  ap: 1
  p: 대마도
  t: 대마도주와 약속을 맺어 일 년에 오갈 수 있는 무역선(세견선)을 50척으로 제한했어요.
  x: "3포를 연 뒤 일본 배와 사람이 너무 많이 드나들어 접대와 무역 부담이 커지자, 왕래 규모를 정해 둔 약속이에요. 세견선 50척과 함께 조선이 해마다 대마도주에게 주는 쌀과 콩(세사미두)을 200석으로 정하고, 3포에 머무는 기간도 20일로 제한했어요. 하지만 규정이 잘 지켜지지 않아 조선은 점점 통제를 강화했고, 이것이 뒷날 삼포 왜란의 배경이 됐어요."

- id: hunmin-create
  n: 훈민정음 창제
  d: '1443-12'
  c: 문화
  i: 3
  at: [126.977, 37.579]
  p: 한양 경복궁
  pg: 129
  t: 세종이 백성이 쉽게 익혀 쓸 수 있도록 우리말을 적는 새 글자 28자를 만들었어요.
  x: "그전에는 한자나, 한자의 음과 뜻을 빌려 우리말을 적는 이두를 썼는데, 배우기 어렵고 우리말을 제대로 나타내기도 힘들어 백성 대부분이 글을 쓰지 못했어요. ‘훈민정음’은 ‘백성을 가르치는 바른 소리’라는 뜻이에요. 자음은 소리를 낼 때의 혀·입술·목구멍 같은 발음 기관 모양을, 모음은 하늘·땅·사람을 본떠 만들었어요. 원리가 새롭고 체계적이어서 누구든 금방 익혀 우리말을 들리는 그대로 적을 수 있었어요."

- id: chiljeong
  n: 『칠정산』 편찬
  d: 1444
  c: 문화
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 130
  t: 한성을 기준으로 해와 달, 행성의 움직임을 계산한 역법서예요. 우리 실정에 맞는 달력을 만들 수 있게 됐어요.
  x: "세종 때 혼천의와 간의로 쌓은 관측 기록이 바탕이 됐는데, 경복궁에는 간의를 올려놓고 쓰는 9m 넘는 관측대(간의대)까지 있었어요. 원의 역법(수시력)을 연구해 정리한 내편과, 아라비아 계통의 회회력을 연구한 외편으로 이루어져 있어요. 해 뜨고 지는 때와 일식·월식을 정확히 계산할 수 있게 됐는데, 하늘의 변화를 살피는 일은 왕의 권위와 농사 모두에 중요했어요."

- id: hunmin-publish
  n: 훈민정음 반포
  d: '1446-09'
  c: 문화
  i: 3
  at: [126.977, 37.579]
  p: 한양 경복궁
  pg: 129
  t: 세종이 훈민정음을 반포했어요. 『용비어천가』와 불경 언해를 펴내고 하급 관리 시험에 넣어 널리 보급했어요.
  x: "『용비어천가』는 태조의 조상부터 태종까지 여섯 임금의 업적을 노래해, 조선 건국이 하늘의 뜻이었음을 내세운 작품이에요. 그 뒤 유교 윤리, 군사, 농사 등을 다룬 책도 훈민정음으로 옮겨 펴냈어요. 덕분에 백성은 제 생각을 글로 적을 수 있게 되었고, 나라는 다스리는 원칙을 백성에게 더 쉽게 알릴 수 있었어요. 창제 원리를 밝힌 『훈민정음』 해례본은 1997년 유네스코 세계 기록 유산이 됐고, ‘한글’이라는 이름은 일제 강점기 국어학자들이 붙였어요."

- id: gyeyu
  n: 계유정난
  d: '1453-10'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 116
  t: 수양 대군이 한명회 등과 함께 김종서·황보인을 죽이고 권력을 잡았어요. 1455년 단종을 몰아내고 왕(세조)이 됐어요.
  x: "세종의 뒤를 이은 문종이 일찍 죽고 어린 단종이 즉위하자 김종서·황보인 등 대신들이 정치를 이끌었어요. 단종의 숙부인 수양 대군은 이들이 동생 안평 대군과 손잡고 반역을 꾀했다는 구실로 정변을 일으켜 안평 대군까지 제거했어요. 정변에 공을 세운 43명은 정난공신이 됐고, 한명회처럼 높은 관직과 많은 토지·노비를 받은 이들 공신은 뒷날 훈구 세력을 이루었어요."

- id: sayuksin
  n: 사육신의 단종 복위 운동
  d: '1456-06'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 123
  t: 성삼문·박팽년 등이 단종을 다시 왕으로 세우려다 발각돼 처형됐어요. 세조는 집현전을 없애고 경연을 중지했어요.
  x: "계획에 함께했던 김질이 고발하면서 일이 드러났고, 한명회는 이 운동을 막는 데 공을 세웠어요. 이때 목숨을 잃은 성삼문·박팽년·하위지·이개·유성원·유응부를 '사육신'이라 하는데, 남효온이 「육신전」에 이들의 행적을 남기면서 절개를 지킨 신하로 널리 기억됐어요. 세조는 즉위 뒤 6조 직계제를 다시 실시하고 의정부의 권한을 약화하는 등 왕권 강화에 힘썼어요."

- id: jikjeon
  n: 직전법 실시
  d: 1466
  c: 경제
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 115
  t: 세조가 지급할 토지가 부족해지자 현직 관리에게만 수조권을 주는 직전법을 실시했어요.
  x: "조선 초 과전법은 전·현직 관리에게 경기 지역 토지의 수조권을 주었는데, 관리 수가 늘고 관리가 죽은 뒤에도 가족이 이어받는 토지(수신전·휼양전)가 많아지면서 새로 줄 땅이 모자랐어요. 직전법은 이런 토지를 없애고 지급량도 줄였지만, 재직 중인 관리들이 정해진 것보다 많이 거두는 폐단이 생겼어요. 그래서 성종 때(1470) 나라가 직접 조세를 거두어 관리에게 나눠 주는 관수관급제를 실시했고, 16세기 중엽 명종 때에는 직전 지급이 사실상 끊겼어요."

- id: hongmungwan
  n: 성종, 홍문관 설치
  d: 1478
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 116
  t: 성종이 학문 연구와 왕의 자문을 맡는 홍문관을 두고 경연을 활발히 열었어요. 김종직 등 사림을 등용했어요.
  x: "홍문관은 1478년 옛 집현전의 직제를 넘겨받아 생긴 기관으로, 궁궐의 책을 관리하고 왕의 물음에 대비하며 경연을 맡았어요. 관리를 감시하는 사헌부, 왕의 잘못을 지적하는 사간원과 묶어 ‘3사’라 했는데, 3사의 비판은 왕이나 높은 관리도 함부로 누를 수 없어 권력이 한쪽에 쏠리는 것을 막았어요. 성종 때 등용된 사림은 주로 3사의 언관이 되어 훈구를 비판했어요. 고려의 삼사(三司)는 나라 재정의 출납과 회계를 맡은 기관이라 조선의 3사와 이름만 같아요."

- id: gyeongguk
  n: 『경국대전』 완성·시행
  d: '1485-01'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 116
  t: 세조 때부터 만들기 시작한 법전을 성종 때 완성해 시행했어요. 이·호·예·병·형·공전의 6전으로 이루어졌어요.
  x: "『경국대전』이 반포되면서 나라를 다스리는 기본 원칙이 하나의 법전으로 묶여, 유교 이념에 따라 법으로 다스리는 나라의 바탕이 갖춰졌어요. 6전은 이전(관리 제도와 인사), 호전(재정·토지·조세), 예전(교육·과거·혼인·제사·외교), 병전(군사), 형전(형벌·재판·노비·상속), 공전(도로·건축·도량형)으로 나뉘어요. 남자는 15세, 여자는 14세가 되어야 혼인할 수 있다거나, 70세 이상인 부모를 모시는 아들 1명은 군역을 면제한다는 규정에서 당시 생활 모습도 엿볼 수 있어요."

- id: dongguk-tonggam
  n: 『동국통감』 편찬
  d: 1485
  c: 문화
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 130
  t: 고조선부터 고려 말까지의 역사를 정리한 책이에요. 고조선이 기원전 2333년에 세워졌다는 기록이 이 책에 나와요.
  x: "세조 때 편찬을 시작해 성종 때 서거정 등이 완성한 역사책이에요. 사건을 일어난 차례대로 적는 편년체로, 단군 조선부터 삼한까지, 삼국, 통일 신라, 고려의 순서로 엮었어요. 편찬자들이 붙인 역사 평가(사론)가 많은데, 유교의 명분과 절의를 중시하는 생각이 강하게 담겨 있어요. 『고려사』, 『조선왕조실록』 등과 함께 나라가 주도한 대표적인 역사서 편찬 사업이에요."

- id: muo
  n: 무오사화
  d: '1498-07'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 124
  t: 김일손이 사초에 실은 스승 김종직의 「조의제문」을 훈구 세력이 문제 삼아, 연산군 때 많은 사림이 화를 입었어요.
  x: "성종 때 3사에 자리 잡은 사림은 왕에게도 거침없이 바른말을 했는데, 연산군은 이들을 눌러 왕권을 키우려 했어요. 『성종실록』을 만들던 이극돈이 「조의제문」이 실린 사초를 문제 삼고, 유자광 등이 이 글이 단종을 몰아낸 세조를 비난한 것이라고 연산군에게 알리면서 사건이 커졌어요. 이미 세상을 떠난 김종직은 무덤을 파헤쳐 시신을 베는 형벌(부관참시)을 받았고 김일손 등은 처형됐어요. 사림이 큰 화를 입은 이런 사건을 ‘사화’라고 하며, 무오사화는 네 차례 사화 가운데 첫 번째예요."

- id: gapja
  n: 갑자사화
  d: '1504-03'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 124
  t: 연산군이 어머니 폐비 윤씨가 쫓겨나 죽은 일에 관련된 사람들을 처벌했어요. 훈구와 사림 모두 피해를 입었어요.
  x: "성종의 왕비였던 연산군의 어머니 윤씨는 1479년 폐위되고 뒤에 사약을 받았는데, 연산군이 왕이 된 뒤 임사홍 등이 이 일을 알리면서 큰 옥사로 번졌어요. 그 무렵 연산군은 사치와 향락으로 나라 살림이 어려워지자 공신의 토지와 노비까지 거두려 해 신하들과 부딪치고 있었어요. 폐비에 찬성했던 대신들이 처형되고 이미 죽은 한명회 등은 부관참시를 당했으며, 이후 연산군의 폭정이 더 심해져 중종반정으로 이어졌어요."

- id: jungjong-banjeong
  n: 중종반정
  d: '1506-09'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 124
  t: 훈구 세력이 폭정을 일삼던 연산군을 몰아내고 중종을 왕으로 세웠어요.
  x: "갑자사화 뒤 연산군의 폭정이 더 심해지자 성희안·박원종이 거사를 꾀하고 이조 판서 유순정 등이 호응했어요. 이들은 성종의 왕비였던 윤대비의 허락을 얻어 연산군을 폐위해 강화 교동으로 보내고, 윤대비의 아들 진성 대군을 왕(중종)으로 세웠어요. 그러나 반정을 이끈 훈구가 다시 권력을 쥐고 공신도 100명 넘게 책봉되자, 중종은 이들을 견제하려고 조광조 등 사림을 등용했어요."

- id: sampo-waeran
  n: 삼포 왜란
  d: '1510-04'
  c: 전쟁
  i: 3
  at: [128.70, 35.15]
  ap: 1
  p: 제포 (창원 진해) 등 3포
  pg: 120
  t: 조선이 3포에 사는 일본인과 무역을 엄격히 통제하자 일본인들이 반발해 난을 일으켰어요. 이를 계기로 비변사가 임시 기구로 처음 설치됐어요.
  x: "3포에는 허락된 기간이 지나도 눌러사는 일본인이 늘어 문제가 됐고, 중종이 통제를 엄하게 하자 1510년 4월 대마도주의 아들을 대장으로 삼은 일본인들이 부산포와 제포를 공격했어요. 조정이 군대를 보내 난을 진압한 뒤 3포를 닫아 일본과의 교류가 끊겼어요. 1512년 임신약조로 교류를 다시 열었지만 제포 한 곳만 열고, 세견선은 25척, 세사미두는 100석으로 계해약조의 절반으로 줄였어요."

- id: hyeollyang
  n: 조광조, 현량과 실시
  d: '1519-04'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 124
  t: 중종 때 등용된 조광조가 추천으로 사림을 관리로 뽑는 현량과를 실시하고 소격서를 없애는 등 개혁을 추진했어요.
  x: "조광조는 도덕과 의리를 바탕으로 하는 왕도 정치를 내세웠고, 왕실의 도교 행사를 맡던 소격서가 유교 나라에 맞지 않는다며 폐지하게 했어요(1518). 현량과는 중앙과 지방에서 학문과 덕행이 뛰어난 사람을 추천받아, 정규 과거의 여러 단계를 거치지 않고 왕 앞에서 한 번 시험해 뽑는 제도였어요. 1519년 문과 28명이 뽑혀 3사 등 요직에 들어갔고, 조광조는 중국의 향약을 번역해 퍼뜨리는 등 향촌에도 유교 질서를 넓히려 했어요."

- id: gimyo
  n: 기묘사화
  d: '1519-11'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 124
  t: 조광조가 반정 공신들의 공훈을 깎자(위훈 삭제) 훈구 세력이 반발해 조광조와 사림을 몰아냈어요.
  x: "중종반정 뒤 공신으로 책봉된 104명 가운데에는 공이 없거나 연산군 편에 섰던 사람도 있었고, 조광조 등은 그 가운데 76명의 공신 자격을 박탈하게 했어요. 공신 자격을 잃으면 받은 토지와 노비도 빼앗기기 때문에 남곤·심정·홍경주 등 훈구가 크게 반발했고, 급진적인 개혁에 부담을 느낀 중종도 이들 편에 섰어요. 조광조는 능주(전남 화순)로 귀양 가 사약을 받았고, 현량과도 폐지돼 합격자들은 자격을 잃었어요."

- id: baegundong
  n: 주세붕, 백운동 서원 건립
  d: 1542
  c: 문화
  i: 3
  at: [128.58, 36.93]
  p: 경북 영주 순흥 (소수 서원)
  pg: 125
  t: 풍기 군수 주세붕이 1542년 안향을 모신 사당을 세우고 이듬해 백운동 서원을 열었어요. 명종 때(1550) '소수 서원'이라는 현판을 받아 최초의 사액 서원이 됐어요.
  x: "백운동 서원은 고려 말 성리학을 들여온 안향을 기리는 곳으로, 서원은 이처럼 이름난 유학자의 제사를 지내며 지방 양반 자제를 가르치고 성리학을 연구한 사립 학교였어요. ‘소수 서원’ 현판은 명종이 직접 썼고, 사액 서원이 되면 나라에서 토지·노비·책을 받고 세금도 면제받았어요. 사화로 중앙에서 밀려난 사림은 늘어난 서원을 거점 삼아 성리학을 퍼뜨리고 여론을 이끌었고, 서원마다 특정 학자의 학통을 잇는 학파가 생긴 것은 붕당 형성의 한 요인이 됐어요."

- id: eulsa-sahwa
  n: 을사사화
  d: '1545-08'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 124
  t: 명종이 즉위한 뒤 왕실의 외척끼리 권력을 다투는 과정에서 많은 사림이 피해를 입었어요.
  x: "중종의 뒤를 이은 인종이 8개월 만에 세상을 떠나고 어린 명종이 즉위하자, 어머니 문정 왕후가 대신 정치를 맡았어요. 그전부터 인종의 외삼촌 윤임(대윤)과 명종의 외삼촌 윤원형(소윤)이 맞서 왔는데, 이때 소윤이 정권을 잡고 윤임·유관·유인숙 등을 역모로 몰아 죽였어요. 2년 뒤에는 양재역 벽서 사건(1547)으로 이언적 등이 귀양을 가는 등 사림은 한동안 크게 위축됐어요."

- id: bibyeonsa
  n: 비변사, 상설 기구가 됨
  d: 1555
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 145
  t: 을묘왜변을 계기로 국방 문제를 의논하던 임시 기구 비변사가 상설 기구가 됐어요. 임진왜란 뒤에는 최고 통치 기구가 됐어요.
  x: "비변사는 중종 때(1510) 왜구와 여진의 침입에 대비하려고 임시로 둔 회의 기구였어요. 임진왜란을 치르는 동안 3정승과 군영 대장들까지 모이는 회의가 되어 전쟁뿐 아니라 외교·재정·인사도 결정하게 되면서, 의정부와 6조는 껍데기만 남고 왕권도 약해졌어요. 조선 후기에는 집권 붕당과 세도 가문이 비변사의 높은 자리를 차지해 정치를 이끌었고, 흥선 대원군 때 기능이 줄어 1865년 의정부에 합쳐졌어요."

- id: yean-hyangyak
  n: 이황, 예안 향약 시행
  d: 1556
  c: 사회
  i: 3
  at: [128.84, 36.72]
  ap: 1
  p: 경북 안동 예안
  pg: 125
  t: 이황이 고향 예안에서 향약을 만들어 시행했어요. 사림은 향약과 서원을 바탕으로 향촌에서 세력을 키웠어요.
  x: "향약은 어려울 때 서로 돕던 마을의 오랜 풍습에 유교 윤리를 얹어 만든 자치 규약으로, 중종 때 송나라의 『여씨 향약』이 번역·소개되면서 퍼지기 시작했어요. 이황은 이를 우리 실정에 맞게 고쳐, 형제끼리 싸우거나 집안 질서를 어지럽힌 사람은 무겁게, 회의에 늦거나 먼저 자리를 뜬 사람은 가볍게 벌하는 식으로 잘못에 따라 벌의 등급을 나누었어요. 사림은 향약으로 농민들의 생활을 성리학 윤리에 맞춰 이끌면서 마을에서의 발언권을 키웠어요."

- id: bungdang
  n: 붕당 형성 (동인과 서인)
  d: 1575
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 126
  t: "선조 때 정권을 잡은 사림이 훈구·외척 세력을 어떻게 처리할지와 이조 전랑 자리를 두고 김효원 편(동인)과 심의겸 편(서인)으로 나뉘었어요. 동인은 이황·조식의 제자가, 서인은 이이·성혼의 제자가 많았어요."
  x: "이조 전랑은 품계는 높지 않았지만 3사 같은 요직에 앉힐 사람을 고르고 자기 후임까지 지명할 수 있어, 인사를 좌우하는 자리였어요. 명종 왕비의 동생인 심의겸이 김효원의 전랑 임명을 반대했고, 뒤에 김효원은 심의겸의 동생이 전랑이 되는 것을 막아 갈등이 커졌어요. 김효원의 집이 도성 동쪽, 심의겸의 집이 서쪽에 있어 동인·서인이라 불렀고, 동인은 영남, 서인은 경기·충청 지역의 사림이 중심이었어요. 붕당 초기에는 서로의 학문을 인정하는 가운데 공론을 내세워 상대를 견제하는 분위기였어요."

- id: gichuk
  n: 정여립 모반 사건 (기축옥사)
  d: '1589-10'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  t: 동인 정여립이 반란을 꾀했다는 고발로 3년 가까이 수사가 이어지며 동인이 큰 피해를 입었어요.
  x: "정여립은 전주 일대에서 무사와 노비까지 모아 대동계를 만들고 매달 활쏘기 모임을 열었는데, 1589년 황해도 관찰사 등이 그가 반역을 꾀한다고 고발했어요. 정여립은 달아나다 스스로 목숨을 끊었고, 서인의 대표 정철이 수사를 맡으면서 1,000여 명에 이르는 동인 관리와 학자가 피해를 입었어요. 학계에서는 서인 세력이 이 모반 사건을 꾸며 냈다고 보기도 해요. 처리 과정을 둘러싼 동인 내부의 입장 차이는 뒷날 남인·북인이 갈라지는 배경이 됐어요."

- id: tongsinsa-1590
  n: 황윤길·김성일, 일본에 통신사로 감
  d: 1590
  c: 외교
  i: 2
  at: [135.76, 35.01]
  ap: 1
  p: 일본 교토
  t: 일본의 사정을 살피러 갔다가 이듬해 돌아와, 서인 황윤길은 침략할 것이라 했고 동인 김성일은 그렇지 않다고 보고했어요.
  x: "사절단은 정사 황윤길, 부사 김성일, 서장관 허성으로 꾸려졌고, 전국 시대를 통일한 도요토미 히데요시의 사정을 살폈어요. 김성일은 히데요시의 사람됨이 보잘것없고 군사를 일으킬 기색이 없다고 했는데, 민심이 흉흉해질 것을 걱정했기 때문이라고 해요. 전쟁이 일어나자 선조는 황윤길의 말을 따르지 않은 것을 크게 후회했다고 전하며, 김성일은 파직됐다가 경상우도에서 의병을 모으고 진주성을 지키는 데 힘을 보탰어요."

- id: namin-bugin
  n: 동인, 남인과 북인으로 나뉨
  d: 1591
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 126
  t: 서인 정철이 세자 책봉 문제(건저의)로 쫓겨난 뒤 그 처벌을 두고 동인이 온건한 남인(이황의 제자 중심)과 강경한 북인(조식의 제자 중심)으로 나뉘었어요.
  x: "정여립 모반 사건 때 정철이 수사를 맡아 동인이 큰 피해를 입었기 때문에, 동인 안에서는 정철을 엄하게 처벌하자는 강경파와 너그럽게 처리하자는 온건파가 맞섰어요. 남인에는 유성룡·우성전·김성일, 북인에는 이산해·정인홍 등이 있었고, 남인은 서인도 고르게 등용하자는 쪽, 북인은 서인을 몰아내자는 쪽이었어요. 조식의 제자들이 임진왜란 때 의병으로 활약하며 힘을 키운 북인은 광해군 때 정권을 잡았지만, 1623년 인조반정으로 몰락했어요."

# ───── 교과서 단원 연표에서 더한 사건 ─────

- id: seonggyungwan-1398
  n: "한양에 성균관 설치"
  d: 1398
  c: "문화"
  i: 3
  at: [126.997, 37.588]
  p: "한양 성균관 (서울 명륜동)"
  pg: 118
  t: "한양에 최고 교육 기관인 성균관을 세웠어요. 과거의 예비 시험에 붙은 생원·진사가 들어가 유학을 공부했어요."
  x: "조선의 학교는 유교를 잘 아는 관리를 길러 내는 곳이었어요. 아이들은 마을 서당에서 글을 깨친 뒤 한양의 4부 학당이나 지방 향교로 올라가 『소학』과 경전을 공부했고, 그 꼭대기에 성균관이 있었어요. 신분상 양인이면 배울 자격이 있었지만 실제 학생은 주로 양반 집 자제였고, 의학·법률·통역 같은 기술은 그 일을 맡은 관청에서 가르쳤어요."

- id: uijeongbu-1400
  n: "의정부 설치"
  d: 1400
  c: "정치"
  i: 3
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 118
  t: "나라의 중요한 정책을 의논하는 최고 기구로 의정부를 두었어요. 의정부의 3정승(영의정·좌의정·우의정)이 나랏일을 이끌었어요."
  x: "2차 왕자의 난 뒤 이방원이 제도를 고치면서, 고려 말 최고 기구였던 도평의사사를 없애고 의정부를 세웠어요. 실제 행정은 이·호·예·병·형·공조의 6조가 나눠 맡았고, 나라의 큰일은 왕 앞에서 3정승과 6조의 판서들이 머리를 맞대 결정했어요. 왕에 따라 6조가 왕에게 바로 보고하기도(태종·세조의 6조 직계제), 의정부를 거쳐 보고하기도(세종의 의정부 서사제) 해 의정부의 힘이 달라졌고, 조선 후기에는 비변사에 밀려 이름만 남았어요."

- id: paldo-1413
  n: "전국을 8도로 나눔"
  d: 1413
  c: "정치"
  i: 3
  at: [126.98, 37.57]
  ap: 1
  p: "전국 8도"
  pg: 119
  t: "태종 때 전국을 8도로 나누고 관찰사를 보냈어요. 모든 군현에 수령을 파견했어요. 황해도(처음엔 풍해도), 함경도(처음엔 영길도)처럼 처음 이름이 뒤에 바뀐 도도 있어요."
  x: "각 도는 다시 부·목·군·현으로 나뉘었고, 고려 때 차별받던 향·부곡·소는 보통 고을에 합쳐져 사라졌어요. 관찰사는 도 전체의 행정과 재판, 군사를 책임지며 수령들을 감독했고, 수령은 자기 고을에서 행정·재판·군사를 모두 맡았어요. 고려 때 지방의 실세였던 향리는 수령 밑에서 실무를 보는 처지로 내려갔고, 지방 양반들은 유향소를 꾸려 수령을 거들면서 향리를 견제했어요."

# ───── R2 검수에서 더한 사건 (두 교과서 대조) ─────

- id: cheonsang
  n: "「천상열차분야지도」 제작"
  d: 1395
  c: "문화"
  i: 2
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 131
  t: "태조 때 고구려의 천문도를 바탕으로 별자리를 돌에 새긴 「천상열차분야지도」를 만들었어요."
  x: "‘열차’는 하늘을 열두 구역으로 나눠 펼쳐 놓았다는 뜻이고, ‘분야’는 하늘의 각 구역을 땅의 지역과 짝지었다는 뜻이에요. 한성에서 올려다본 북극성·북두칠성 같은 별자리가 담겼고, 24절기마다 해 질 무렵 떠오르는 별자리도 적혀 있어 농사철을 가늠할 수 있었어요. 하늘의 명을 받은 왕이 다스린다고 믿은 조선에서 이 천문도는 새 왕조가 정당하다는 것을 보여 주는 상징이기도 했어요."

- id: samgang
  n: "『삼강행실도』 편찬"
  d: 1434
  c: "문화"
  i: 2
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 132
  t: "세종 때 충신·효자·열녀의 이야기를 그림과 글로 엮은 『삼강행실도』를 펴내 유교 윤리를 널리 알렸어요. 성종 때 한글 풀이를 붙였어요."
  x: "세종은 백성들이 임금과 신하, 부모와 자식, 남편과 아내 사이의 도리를 잘 모른다고 여겨, 중국과 우리나라에서 본받을 만한 사례를 골라 이 책을 펴냈어요. 그림을 곁들여 글을 잘 모르는 백성도 보고 느낄 수 있게 했어요. 병든 아버지를 위해 손가락을 베어 먹인 효자 유석진, 두 임금을 섬길 수 없다며 태종이 내리려던 벼슬을 사양한 길재 같은 이야기가 실려 있어요."

- id: mongyu
  n: "안견, 「몽유도원도」"
  d: 1447
  c: "문화"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 133
  t: "안평 대군이 꿈에서 본 복숭아꽃 마을을 안견이 그린 그림이에요. 조선 전기 양반 문화를 대표하는 그림이에요."
  x: "'몽유도원도'는 '꿈속에서 복숭아밭(무릉도원)을 거닐다'라는 뜻이고, 안평 대군은 세종의 셋째 아들이에요. 안견은 나라에 필요한 그림을 그리던 관청인 도화서의 화원이었어요. 그림 왼쪽에는 현실 세계의 산과 강을, 오른쪽에는 이상 세계인 무릉도원을 그려 두 세계를 조화롭게 표현했어요. 이 그림은 지금 일본 덴리 대학에 있어요."

- id: orye
  n: "『국조오례의』 완성"
  d: 1474
  c: "문화"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 132
  t: "성종 때 나라의 여러 행사 절차를 유교 예법에 맞게 정리한 『국조오례의』를 완성했어요."
  x: "‘오례’는 제사(길례), 왕실의 혼인 같은 경사(가례), 사신 맞이(빈례), 군사 의식(군례), 장례(흉례)의 다섯 가지 의례를 말해요. 왕실부터 이 책에 적힌 절차대로 의식을 치르며 유교 예법의 본보기를 보이려 했어요. 백성에게 유교 윤리를 알린 『삼강행실도』와 함께, 나라의 행사부터 백성의 생활까지 유교 질서를 세우려 한 조선의 노력을 보여 줘요."

- id: haeju-hyangyak
  n: "이이, 해주 향약"
  d: 1577
  c: "사회"
  i: 1
  at: [125.72, 38.04]
  p: "황해도 해주"
  pg: 125
  t: "이이가 해주에서 향약을 만들어 시행했어요. 이황의 예안 향약과 함께 향촌에 유교 질서를 퍼뜨린 대표 사례예요."
  x: "해주 향약에는 이웃에 초상이 나면 쌀과 거적을 내고, 불이 나 집이 타면 지붕 이을 풀과 재목, 일꾼을 보내 집 짓기를 돕게 하는 상부상조 규정이 있었어요. 또 바르지 않은 사람과 어울리거나 재물을 낭비하는 것 등을 몸을 닦지 않는 잘못으로 정해 바로잡았어요. 향약의 네 덕목은 좋은 일은 서로 권하고(덕업상권), 잘못은 서로 바로잡고(과실상규), 예의 바른 풍속으로 사귀고(예속상교), 어려운 일은 서로 돕는(환난상휼) 것이에요."

- id: sejong-jiriji
  n: "『세종실록』 「지리지」 완성"
  d: 1454
  c: "문화"
  i: 1
  at: [130.87, 37.24]
  p: "울릉도·독도 (기록 대상)"
  t: "「지리지」에 우산(독도)과 무릉(울릉도) 두 섬이 강원도 울진현에 속하고, 날씨가 맑으면 서로 바라볼 수 있다고 적혀 있어요. 독도가 우리 땅이라는 조선 전기의 기록이에요."
  x: "이 기록은 조선 사람들이 울릉도 동쪽에 독도라는 또 하나의 섬이 있다는 것을 정확히 알고 있었음을 보여 줘요. 독도는 512년 신라 지증왕 때 우산국이 신라에 복속된 뒤로 우리 영토였고, 『신증동국여지승람』과 대한 제국 칙령 제41호(1900)도 이를 이어 기록했어요. 일본 메이지 정부의 최고 행정 기관이 내린 태정관 지령(1877)조차 울릉도와 그 밖의 한 섬(독도)이 일본 땅이 아니라고 결정했어요."

- id: paldo-chongdo
  n: "『신증동국여지승람』 「팔도총도」"
  d: 1530
  c: "문화"
  i: 1
  at: [130.87, 37.24]
  p: "울릉도·독도 (지도에 그려진 곳)"
  pg: 180
  t: "『신증동국여지승람』에 실린 「팔도총도」에 우산도(독도)와 울릉도가 강원도 울진 앞바다에 그려져 있어요."
  x: "『신증동국여지승람』은 성종 때 지방의 연혁·인물·풍속 등을 정리한 『동국여지승람』을 중종 때 고쳐 보완한 지리책이에요. 본문에도 우산도와 울릉도 두 섬이 울진현 정동쪽 바다 가운데 있다고 적혀 있어, 조선이 두 섬을 모두 강원도에 속한 우리 땅으로 여겼음을 알 수 있어요. 일본 쪽 기록인 『은주시청합기』(1667)도 일본의 북쪽 경계를 오키섬으로 삼아 울릉도와 독도를 자기 영토에서 빼놓았어요."
