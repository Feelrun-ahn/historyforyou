# 남북국 시대 (교과서 II 단원). 전투는 data/wars/korea.yaml

- id: kim-heumdol
  n: 김흠돌의 난 진압
  d: 681
  c: 정치
  i: 2
  at: [129.22, 35.83]
  p: 경주
  pg: 57
  t: 신문왕이 장인 김흠돌의 반란을 진압하고 이를 계기로 진골 귀족 세력을 숙청해 왕권을 강화했어요.
  x: "신문왕의 장인 김흠돌은 고구려 정벌에서 공을 세운 진골 귀족이었는데(미래엔 교과서), 사위가 왕위에 오른 681년에 반란을 꾸미다 들켜 처형됐어요. 이후 신문왕은 국학 설립, 관료전 지급과 녹읍 폐지, 9주 5소경 정비를 잇달아 추진해 강력한 왕권을 세웠어요. 진골 귀족이 약해진 대신 학식을 갖춘 6두품이 왕의 정치적 조언자로 성장했어요."

- id: gukhak
  n: 신라, 국학 설립
  d: 682
  c: 문화
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 57
  t: 신문왕이 유학을 가르치는 국학을 세워 인재를 길렀어요.
  x: "삼국 통일 뒤 신라는 왕의 힘을 키우고 나라를 안정시키는 바탕으로 유학을 중시했어요. 국학은 귀족 자제에게 유교 경전을 가르쳐, 왕권을 뒷받침할 유학적 소양을 갖춘 관리를 길러 내는 곳이었어요. 뒤에 원성왕은 국학 학생의 실력을 시험해 관리 등용에 참고하는 독서삼품과를 실시했어요. 고구려의 태학, 발해의 주자감과 비교해 기억해 두면 좋아요."

- id: gameunsa
  n: 감은사 완성
  d: 682
  c: 문화
  i: 1
  at: [129.48, 35.74]
  p: 경주 감은사 터
  pg: 57
  t: 문무왕이 짓기 시작한 절을 신문왕이 완성했어요. 동해에 있는 문무왕의 수중릉(대왕암)과 가까워요.
  x: "감은사는 바다를 건너오는 왜의 침입을 불교의 힘으로 막겠다는 문무왕의 바람에서 시작된 절이에요. '감은'이라는 이름에는 아버지 문무왕의 은혜를 기리는 신문왕의 마음이 담겼다고 전해요. 문무왕은 죽은 뒤 용이 되어 나라를 지키겠다며 자신을 동해에 묻어 달라고 했다고 해요. 지금은 절터와 높이 13.4m의 동서 3층 석탑 두 기가 남아 있는데, 경주의 3층 석탑 가운데 가장 크고 탑 속에서 화려한 사리 장엄구가 나왔어요."

- id: nine-ju
  n: 신라, 9주 5소경 정비
  d: 685
  c: 정치
  i: 3
  at: [129.22, 35.83]
  ap: 1
  p: 경주
  pg: 58
  t: 넓어진 영토를 9주로 나누고 지방의 중심지에 5소경을 두었어요. 군사 조직으로 9서당 10정을 두었어요.
  x: "9주 아래 군과 현에는 나라에서 지방관을 보냈지만, 맨 아래 단위인 촌은 그 지역 유력자인 촌주가 맡아 다스렸어요. 북원경·중원경·서원경·남원경·금관경의 5소경은 동남쪽 끝에 자리한 수도 금성(경주)의 약점을 메우고 지방 문화의 중심 구실도 했어요. 중앙군 9서당에는 신라인과 함께 고구려·백제 유민, 말갈인까지 넣어 여러 집단을 하나로 묶으려 했고, 지방군 10정은 각 주에 하나씩 두되 국경을 맞댄 한주에만 둘을 두었어요."

- id: gwallyojeon
  n: 관료전 지급
  d: 687
  c: 경제
  i: 1
  at: [129.22, 35.83]
  p: 경주
  pg: 57
  t: 신문왕이 관리에게 조세만 거둘 수 있는 관료전을 주었어요. 2년 뒤(689)에는 노동력까지 부릴 수 있던 녹읍을 폐지해 귀족의 경제 기반을 약하게 했어요.
  x: "관료전과 녹읍은 헷갈리기 쉬워요. 관료전은 땅에서 조세를 거둘 권리(수조권)만 준 반면, 녹읍은 수조권에 더해 그 지역 농민의 노동력까지 동원할 수 있게 했어요. 신문왕은 문무 관리에게 관료전을 지급해, 관리가 나라에서 받은 땅의 농민을 직접 부리지 못하게 했어요. 이는 귀족의 경제 기반을 약하게 하고 왕권을 강화하는 토지 제도 개편의 첫걸음이었어요."

- id: balhae-founding
  n: 발해 건국
  d: 698
  c: 정치
  i: 3
  at: [128.23, 43.37]
  ap: 1
  p: 동모산 (지린성 둔화 성산자산성 추정)
  pg: 54
  t: 대조영이 고구려 유민과 말갈인을 이끌고 천문령에서 당군을 물리친 뒤 동모산에서 나라를 세웠어요. 처음 이름은 진이었어요.
  x: "고구려가 멸망한 뒤 당은 고구려 유민을 중국 여러 곳으로 옮겼는데, 요서의 영주에는 고구려 유민과 말갈인, 거란인 등이 끌려와 당의 통제를 받고 있었어요. 7세기 말 거란인이 영주에서 반란을 일으켜 당의 감시가 느슨해지자, 고구려 장수 출신 대조영이 무리를 이끌고 탈출했어요. 건국 직후 대조영은 돌궐과 신라에 사신을 보내 대외 안정을 꾀했어요(미래엔 교과서). 이로써 남쪽의 신라와 북쪽의 발해가 함께하는 남북국 시대가 열렸어요."

- id: balhae-title
  n: 당, 대조영을 발해 군왕으로 책봉
  d: 713
  c: 외교
  i: 1
  at: [128.23, 43.37]
  ap: 1
  p: 동모산
  pg: 54
  t: 당이 대조영을 '발해 군왕'으로 책봉하면서 나라 이름을 발해로 부르게 됐어요.
  x: "미래엔 교과서에 따르면, 발해를 나라로 인정하지 않던 당은 거란에게 빼앗긴 영주 지역을 되찾는 데 발해가 필요해지자 태도를 바꿔 손을 잡았어요. 그러나 무왕 때 당이 흑수 말갈을 이용해 발해를 견제하면서 두 나라는 다시 맞서게 됐고, 문왕 때에 이르러서야 친선 관계가 자리 잡았어요."

- id: jeongjeon
  n: 신라, 정전 지급
  d: 722
  c: 경제
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 58
  t: 성덕왕이 백성에게 정전을 나누어 주었어요. 국가가 농민을 직접 파악해 세금을 거두려는 정책이었어요.
  x: "정전은 백성이 직접 농사짓는 땅으로, 나라는 여기서 세금을 거둬 살림을 넉넉히 하려 했어요. 신문왕의 관료전 지급(687)과 녹읍 폐지(689)에 이어, 국가가 토지와 농민을 직접 관리하려는 흐름의 하나였어요. 하지만 귀족들이 다시 힘을 얻으면서 757년 경덕왕 때 녹읍이 되살아났어요."

- id: dengzhou
  n: 발해 무왕, 당의 산둥반도 공격
  d: 732
  c: 전쟁
  i: 3
  at: [120.75, 37.80]
  ap: 1
  p: 등주 (중국 산둥반도)
  pg: 59
  t: 당이 흑수 말갈과 신라를 이용해 발해를 견제하자, 무왕이 장문휴를 보내 산둥반도의 등주를 공격했어요.
  x: "무왕은 '인안'이라는 독자 연호를 쓰며 땅을 넓혀 만주 북부까지 손에 넣었고, 돌궐·일본과 가까이 지내며 당과 신라를 함께 견제했어요. 발해의 세력 확장을 경계한 신라는 국경에 장성을 쌓았고(미래엔 교과서), 등주 공격 뒤에는 당의 요청을 받아 발해 남쪽 경계로 군대를 보내기도 했어요. 이 일은 나당 전쟁 이후 나빠졌던 신라와 당의 관계가 회복되는 실마리가 됐어요."

- id: munwang
  n: 발해 문왕 즉위
  d: 737
  c: 정치
  i: 2
  at: [128.23, 43.37]
  ap: 1
  p: "동모산 일대 (발해의 첫 도읍)"
  pg: 59
  t: 문왕은 당과 친선 관계를 맺고 문물을 받아들여 체제를 정비했어요. 일본에 보낸 국서에서 스스로 '고려 국왕'이라 했고, 신라와 통하는 교통로를 열었어요.
  x: "문왕은 '대흥'·'보력' 같은 독자적 연호를 썼고, 딸 정효 공주의 묘지석에서는 문왕을 황제라는 뜻의 '황상'이라 불러 발해가 안으로는 황제국을 지향했음을 보여 줘요. 도읍을 중경에서 상경으로 옮겼고, 일본에도 자주 사신을 보냈어요. 미래엔 교과서는 문왕이 스스로를 불교의 이상적인 왕으로 일컫고 각지에 많은 절을 지었다고 써요."

- id: bulguksa
  n: 불국사·석굴암 건립 시작
  d: 751
  c: 문화
  i: 2
  at: [129.33, 35.79]
  p: 경주 토함산
  pg: 66
  t: 경덕왕 때 김대성이 짓기 시작했어요. 불국사 3층 석탑에서 나온 무구정광대다라니경은 세계에서 가장 오래된 목판 인쇄물로 알려져 있어요.
  x: "불국사는 여러 건물과 탑을 짜임새 있게 배치해, 부처가 사는 이상 세계를 땅 위에 나타내려 했어요. 대웅전으로 오르는 청운교·백운교는 다리 아래의 사람 세계와 위의 부처 세계를 잇는다는 의미가 있고, 마당에는 3층 석탑의 전형인 석가탑과 화려한 다보탑이 서 있어요. 석굴암은 화강암으로 만든 인공 석굴로, 본존불의 얼굴·가슴·어깨·무릎 너비가 1:2:3:4 비례를 이루는 등 정밀한 수학이 쓰였어요. 두 곳은 1995년 유네스코 세계 유산이 됐어요."

- id: sanggyeong
  n: 발해, 상경 천도
  d: 756
  dt: 8세기 중반 (756년경)
  c: 정치
  i: 1
  at: [129.19, 44.05]
  ap: 1
  p: 상경 용천부 (헤이룽장성 닝안)
  pg: 59
  t: 문왕이 도읍을 상경으로 옮겼어요. 상경성은 당의 장안성을 본떠 바둑판 모양으로 만든 계획도시예요.
  x: "상경은 발해의 도읍 가운데 가장 오랜 기간 수도였어요. 외성 둘레가 약 16km에 이르고, 북쪽에 궁성과 황성을 두고 남쪽으로 주작대로를 냈으며, 길 양옆에 백성의 집·시장·절이 들어섰어요. 당을 본뜬 도시였지만 고구려 전통을 이은 온돌 시설과 불상, 기와도 발견됐어요. 절터에 남은 높이 약 6.3m의 거대한 석등은 발해 불교가 융성했음을 짐작하게 해요."

- id: nogeup-revival
  n: 녹읍 부활
  d: 757
  c: 경제
  i: 1
  at: [129.22, 35.83]
  p: 경주
  pg: 58
  t: 경덕왕 때 귀족들의 반발로 녹읍이 다시 생겼어요. 왕권이 약해지고 있다는 뜻이었어요.
  x: "녹읍은 조세뿐 아니라 그 지역 농민의 노동력까지 동원할 수 있는 땅이어서, 녹읍이 되살아났다는 건 귀족의 경제 기반이 다시 튼튼해졌다는 뜻이에요. 신문왕이 689년에 없앤 지 약 70년 만의 일이에요. 이후 소수의 진골 귀족에게 권력이 몰리면서 왕권은 더욱 약해졌고, 780년 혜공왕이 피살되며 신라 하대의 혼란이 시작됐어요."

- id: seongdeok-bell
  n: 성덕 대왕 신종 완성
  d: 771
  c: 문화
  i: 1
  at: [129.22, 35.83]
  p: 경주 (국립 경주 박물관 소장)
  pg: 66
  t: 경덕왕이 아버지 성덕왕을 기리려 만들기 시작해 혜공왕 때 완성한 종이에요. 에밀레종이라고도 불러요.
  x: "현재 남아 있는 우리나라 범종 가운데 가장 큰 종이에요. 꼭대기에는 대롱 모양의 음통이 달려 있는데, 소리를 더 좋게 울리도록 돕는다고 알려진 우리나라 종만의 특징이에요. 종 몸통에는 하늘을 나는 비천상이 아름답게 새겨져 있어 통일 신라의 뛰어난 금속 주조 기술을 보여 줘요. 현재 남아 있는 가장 오래된 범종인 상원사 동종과 함께 기억해 두세요."

- id: hyegong
  n: 혜공왕 피살 (신라 하대 시작)
  d: 780
  c: 정치
  i: 2
  at: [129.22, 35.83]
  p: 경주
  pg: 61
  t: 귀족들의 반란 속에 혜공왕이 죽으면서 무열왕 직계의 왕위 계승이 끊겼어요. 이후 150여 년 동안 왕이 20명이나 바뀌었어요.
  x: "8세기 후반이 되자 몇몇 진골 귀족 집안이 권력을 쥐고 흔들면서 왕의 힘은 약해지고, 귀족들끼리도 패가 갈려 다퉜어요. 어린 나이에 왕위에 오른 혜공왕은 진골 귀족들의 반란 속에 피살됐어요. 이때부터 신라 멸망까지를 신라 하대라고 하는데, 왕위 다툼이 이어지면서 김헌창의 난 같은 지방의 반란과 농민 봉기가 잇따랐어요."

- id: dokseo
  n: 독서삼품과 실시
  d: 788
  c: 문화
  i: 1
  at: [129.22, 35.83]
  p: 경주
  pg: 65
  t: 원성왕이 유교 경전을 얼마나 이해하는지에 따라 관리를 뽑는 독서삼품과를 실시했지만 진골 귀족의 반대로 큰 효과는 없었어요.
  x: "독서삼품과는 국학 학생들이 유교 경전을 얼마나 잘 읽고 이해하는지 시험해 상·중·하로 나누고, 그 결과를 관리를 뽑을 때 참고한 제도예요. 혈통보다 학문 실력으로 인재를 뽑으려 한 시도였지만, 골품제의 벽을 넘지는 못했어요. 통일 이후 신라에서는 7세기의 강수(당에 보내는 외교 문서 작성)와 설총(이두로 유교 경전 풀이), 9세기의 최치원처럼 주로 6두품 출신의 뛰어난 유학자들이 나왔어요."

- id: seonwang
  n: 발해 선왕, 해동성국으로 불림
  d: 818
  dt: 9세기 전반 (선왕 818~830)
  c: 정치
  i: 2
  at: [129.19, 44.05]
  ap: 1
  p: 상경
  pg: 59
  t: 선왕이 연해주에서 요동에 이르는 넓은 영토를 차지하고 지방 제도를 정비했어요. 당은 발해를 '바다 동쪽의 번성한 나라(해동성국)'라 불렀어요.
  x: "선왕은 말갈 부족 대부분을 굴복시키고 요동까지 손을 뻗어, 옛 고구려 땅 대부분을 아우르는 발해 최대의 영토를 이뤘어요. 발해는 이 넓은 땅을 5경 15부 62주로 나누었는데, 정치·군사적으로 중요한 다섯 곳을 5경으로 삼고 교통로도 손봤어요. 맨 아래 촌락은 대부분 말갈인이 사는 곳이어서 말갈 출신 수령에게 맡겨, 고구려인과 말갈인이 어울려 살게 했어요. 선왕은 '건흥'이라는 연호를 썼어요."

- id: kim-heonchang
  n: 김헌창의 난
  d: 822
  c: 정치
  i: 3
  at: [127.12, 36.46]
  p: 웅주 (공주)
  pg: 61
  t: 아버지 김주원이 왕이 되지 못한 데 불만을 품은 웅주 도독 김헌창이 반란을 일으켰다가 진압됐어요.
  x: "김헌창은 나라 이름을 '장안', 연호를 '경운'이라 정하고 웅천주(공주)에서 일어나, 한때 9주 가운데 4개 주와 소경 3곳을 손에 넣을 만큼 세력을 떨쳤어요. 중앙 토벌군이 웅진성을 함락하자 김헌창은 스스로 목숨을 끊었고, 825년에는 아들 김범문도 반란을 일으켰다가 진압됐어요. 중앙 진골 귀족의 왕위 다툼이 지방의 반란으로까지 번졌음을 보여 줘요."

- id: cheonghaejin
  n: 장보고, 청해진 설치
  d: 828
  c: 경제
  i: 3
  at: [126.76, 34.35]
  ap: 1
  p: 청해진 (전남 완도 장도)
  pg: 71
  t: 장보고가 완도에 청해진을 세워 해적을 소탕하고 당·신라·일본을 잇는 해상 무역을 장악했어요.
  x: "9세기 들어 황해와 남해안 일대에서 해적의 약탈이 심해지자, 장보고는 지방민을 모아 1만여 명의 군대를 갖추고 청해진을 세웠어요. 그는 당·신라·일본을 잇는 중계 무역으로 큰 부를 쌓아 동아시아의 '해상왕'으로 불렸고, 당의 산둥반도에 법화원이라는 절도 세웠어요. 당시 산둥반도 일대에는 신라방·신라소·신라원 같은 신라인 마을과 시설이 생길 만큼 교류가 활발했어요."

- id: jangbogo-death
  n: 장보고의 난과 피살
  d: 846
  c: 정치
  i: 1
  at: [126.76, 34.35]
  ap: 1
  p: 청해진
  pg: 61
  t: 왕위 다툼에 끼어들었던 장보고가 딸을 왕비로 들이려다 반대에 부딪혀 반란을 일으켰다가 살해됐어요.
  x: "장보고는 청해진의 군대를 경주로 보내 김우징(신무왕)이 왕위에 오르도록 도왔어요. 이후 문성왕의 왕비로 장보고의 딸을 들이려 했지만, 그의 세력을 경계한 중앙 귀족들이 반대했어요. 846년 중앙 정부는 한때 그의 부하였던 염장을 보내 장보고를 암살했고, 851년에는 청해진도 없앴어요. 지방 세력이 중앙의 왕위 다툼에 끼어들 만큼 신라 하대의 질서가 흔들렸음을 보여 줘요."

- id: wonjong-aeno
  n: 원종·애노의 난
  d: 889
  c: 사회
  i: 3
  at: [128.16, 36.41]
  ap: 1
  p: 사벌주 (경북 상주)
  pg: 61
  t: 진성 여왕 때 조세를 독촉하자 상주에서 원종과 애노가 봉기했어요. 이를 시작으로 전국에서 농민 봉기가 일어났어요.
  x: "신라 말에는 귀족의 수탈이 심해진 데다 전염병과 자연재해가 겹쳐, 땅을 잃고 떠돌거나 도적이 되는 농민이 늘었어요. 여러 주와 군에서 공물과 세금이 걷히지 않아 나라 창고가 비자 정부가 관리를 보내 독촉했고, 이것이 봉기의 불씨가 됐어요. 봉기한 농민들은 세금을 거부하고 관아를 습격했으며, 중앙 정부는 이를 진압하지 못해 지방에 대한 통제력을 거의 잃었어요. 해인사 길상탑의 기록에는 굶어 죽고 싸우다 죽은 시체가 들판에 즐비했다고 적혀 있어요."

- id: choe-chiwon
  n: 최치원, 개혁안 건의
  d: 894
  c: 정치
  i: 1
  at: [129.22, 35.83]
  p: 경주
  pg: 61
  t: 당에서 빈공과에 합격하고 돌아온 6두품 최치원이 진성 여왕에게 개혁안(시무 10여 조)을 올렸지만 받아들여지지 않았어요.
  x: "최치원은 열두 살에 당으로 유학을 떠나 외국인을 대상으로 한 과거 시험인 빈공과에 합격했고, 당에서 관리로 일하며 뛰어난 문장으로 이름을 떨친 뒤 885년에 돌아왔어요. 하지만 혈통을 중시하는 골품제 때문에 6두품은 능력이 뛰어나도 높은 관직에 오를 수 없었고, 그의 개혁안도 진골 귀족의 견제로 실현되지 못했어요. 결국 관직을 버리고 전국을 다니며 많은 글을 남겼고, 말년에는 해인사에 들어가 은거했어요."

- id: hubaekje
  n: 견훤, 후백제 건국
  d: 900
  c: 정치
  i: 3
  at: [127.15, 35.82]
  p: 완산주 (전주)
  pg: 62
  t: 서남해안의 군진 장교였던 견훤이 완산주(전주)를 도읍으로 후백제를 세웠어요.
  x: "상주 출신인 견훤은 진성 여왕 때 농민 봉기가 번지는 틈을 타 서남부 지역에서 독자적인 세력을 키웠어요. 일부 6두품 세력을 등용해 통치 체제를 정비했고(미래엔 교과서), 막강한 군사력으로 지금의 전라도와 충청도, 경상도 일부까지 지배했어요. 후백제와 후고구려가 세워지면서 신라의 영토는 경상도 일대로 줄어들고, 한반도는 다시 세 나라가 다투는 후삼국 시대를 맞았어요."

- id: hugoguryeo
  n: 궁예, 후고구려 건국
  d: 901
  c: 정치
  i: 3
  at: [126.55, 37.97]
  p: 송악 (개성)
  pg: 62
  t: 양길의 부하였던 궁예가 고구려를 다시 일으킨다며 송악에서 후고구려를 세웠어요. 뒤에 나라 이름을 마진·태봉으로 바꾸고 철원으로 도읍을 옮겼어요.
  x: "궁예는 신라 왕족 출신으로 알려져 있으며, 북원(원주)의 호족 양길 밑에 있다가 세력을 키워 자립했어요. 송악의 왕건 가문을 비롯한 여러 호족의 도움을 받아 나라를 세웠어요(미래엔 교과서). 나라를 세운 뒤에는 광평성을 최고 관청으로 두는 등 다스리는 제도를 하나씩 갖춰 나갔어요."

- id: cheorwon
  n: 궁예, 철원 천도
  d: 905
  c: 정치
  i: 1
  at: [127.25, 38.32]
  ap: 1
  p: 철원 (풍천원 도성 터, 비무장 지대 안)
  pg: 62
  t: 궁예가 나라 이름을 마진으로 바꾼 뒤 도읍을 철원으로 옮겼어요. 911년에는 다시 태봉으로 이름을 바꿨어요.
  x: "궁예는 904년 나라 이름을 마진으로 바꾸고, 이듬해인 905년 도읍을 송악에서 철원으로 옮겼어요. 914년 무렵부터는 스스로 미륵불이라 일컬으며 반대 세력을 없애는 등 전제 정치를 폈어요. 결국 918년 홍유·신숭겸 등 장수들이 왕건을 왕으로 추대하자 궁예는 쫓겨났고, 태봉도 무너졌어요."

# ───── R1 검수에서 더한 사건 (두 교과서 대조) ─────

- id: muyeol
  n: "김춘추, 무열왕으로 즉위"
  d: 654
  c: "정치"
  i: 2
  at: [129.22, 35.84]
  p: "경주"
  pg: 57
  t: "진골 출신으로는 처음으로 김춘추가 왕위에 올랐어요. 이후 무열왕의 직계 자손이 왕위를 이어 갔어요(신라 중대)."
  x: "신라에서는 원래 가장 높은 신분인 성골이 왕위를 이었는데, 진덕 여왕을 끝으로 성골이 사라지자 김춘추가 김유신의 도움을 받아 왕이 됐어요. 김춘추는 즉위 전 당으로 건너가 나당 동맹을 이끌어 낸 외교가였고, 왕이 된 뒤 660년 백제를 멸망시켰어요. 그의 아들 문무왕이 고구려를 무너뜨리고 나당 전쟁에서 이겨 삼국 통일을 완성했어요. 묘호가 '태종'이어서 태종 무열왕이라고도 불러요."

- id: uisang-buseoksa
  n: "의상, 부석사 창건"
  d: 676
  c: "문화"
  i: 2
  at: [128.69, 36.99]
  p: "영주 부석사"
  pg: 65
  t: "당에서 화엄 사상을 배우고 돌아온 의상이 부석사를 세웠어요. 같은 시기 원효는 화쟁 사상을 내세우고 아미타 신앙을 퍼뜨려 불교를 백성에게 널리 알렸어요."
  x: "화엄 사상은 '하나가 곧 전체요, 전체가 곧 하나'라는 가르침으로, 모든 존재가 서로 의존하며 조화를 이룬다는 생각이에요. 통일 직후 신분 간 대립을 누그러뜨리고 고구려·백제 유민까지 아우르는 데 도움이 됐어요. 의상은 관음보살이 중생의 괴로움을 듣고 구해 준다는 관음 신앙도 퍼뜨렸어요. 원효는 '모든 것은 한마음에서 나온다'는 일심 사상을 바탕으로 했고, 불교의 가르침을 쉬운 노래로 만들어 마을마다 다니며 퍼뜨렸어요."

- id: jeokgojeok
  n: "붉은 바지 도적(적고적)의 봉기"
  d: 896
  c: "사회"
  i: 1
  at: [129.1, 35.78]
  ap: 1
  p: "경주 서남쪽"
  pg: 61
  t: "진성 여왕 10년, 나라 서남쪽에서 붉은 바지를 입은 무리가 일어나 수도 경주 가까이(모량리)까지 쳐들어왔어요. 신라 말 전국에서 농민 봉기가 이어졌어요."
  x: "붉은 바지를 입었다고 해서 '적고적(赤袴賊)'이라 불렸어요. 『삼국사기』에는 이들이 주와 현을 공격하고 수도 가까운 모량리까지 와서 민가를 약탈했다고 적혀 있어요. 889년 원종·애노의 난 이후 봉기가 수도 코앞까지 번질 만큼, 신라 정부는 지방은 물론 수도 주변도 지키지 못하는 처지가 됐어요. 이런 혼란 속에서 견훤과 궁예 같은 세력이 나라를 세웠어요."

# ───── 교과서 단원 연표에서 더한 사건 ─────

- id: nogeup-abolish
  n: "신라, 녹읍 폐지"
  d: 689
  c: "경제"
  i: 3
  at: [129.22, 35.84]
  p: "경주"
  pg: 57
  t: "신문왕이 귀족이 세금과 노동력을 함께 거둘 수 있던 녹읍을 없앴어요. 2년 전(687)에는 세금만 거둘 수 있는 관료전을 지급해 귀족의 힘을 약하게 했어요."
  x: "녹읍 폐지는 귀족의 경제 기반을 약하게 해 왕권을 강화하려는 조치였어요. 미래엔 교과서는 농민의 부담을 줄이고 국가 재정을 넉넉하게 하려는 뜻도 있었다고 설명해요. 신문왕은 이 무렵 김흠돌의 난을 진압하고 국학을 세우는 등 왕권 강화 정책을 잇달아 폈어요. 그러나 귀족들의 반발로 경덕왕 때인 757년 녹읍이 다시 생겨났어요."
