# 조선 후기 (교과서 IV-4 일부, V 단원). 전쟁은 data/wars/korea.yaml

- id: hullyeon
  n: 훈련도감 설치
  d: 1593
  c: 전쟁
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 145
  t: 임진왜란 중에 포수·사수·살수의 삼수병으로 이루어진 훈련도감을 만들었어요. 급료를 받는 직업 군인이었어요.
  x: "임진왜란 중 중앙군이 제구실을 못 하자 1593년에 세웠고, 류성룡의 건의에 따라 군사를 모집했어요. 정예군을 기르는 동시에 굶주린 백성을 구제하려는 목적도 있었고, 명나라 척계광의 『기효신서』를 참고해 훈련했어요. 비용을 대려고 삼수미라는 세금을 따로 걷기도 했어요. 이후 5군영의 중심 군영이 됐고, 1881년 신식 군대인 별기군이 생긴 이듬해 폐지됐어요."

- id: samyeong
  n: 사명 대사, 일본에서 포로 송환
  d: 1605
  c: 외교
  i: 2
  at: [135.76, 35.01]
  ap: 1
  p: 일본 교토 (후시미)
  pg: 137
  t: 유정(사명 대사)이 일본에 건너가 도쿠가와 이에야스를 만나 강화하고 전쟁 때 끌려간 조선인 3천여 명을 데리고 돌아왔어요.
  x: "유정은 임진왜란 때 승병을 이끌고 싸운 승려예요. 일본에서 도요토미 히데요시가 죽은 뒤 도쿠가와 이에야스가 에도 막부를 열고 관계 회복을 요청하자, 선조의 명을 받아 일본으로 건너갔어요. 이 일을 발판으로 조선은 일본과 국교를 회복해 1607년부터 사절단(뒤의 통신사)을 보냈고, 1609년에는 기유약조를 맺었어요. 정유재란 때 불탄 보은 법주사 팔상전을 다시 세운 사람도 유정이에요."

- id: gwanghae
  n: 광해군 즉위
  d: '1608-02'
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 138
  t: 광해군은 북인과 함께 토지 대장과 호적을 새로 만들고 성곽과 무기를 손보는 등 전쟁 피해를 복구했어요.
  x: "광해군은 동인에서 갈라져 나온 북인의 지지를 받으며 정치를 이끌었어요. 전쟁 중 토지 대장과 호적이 대부분 불타 세금을 제대로 걷기 어려웠기 때문에 이를 새로 정비해 나라 살림을 늘리고, 황폐해진 땅의 개간도 장려했어요. 즉위한 해에 경기도에서 대동법을 처음 실시했고, 허준의 『동의보감』도 이때 완성됐어요. 하지만 중립 외교와 영창 대군 살해·인목 대비 폐위가 서인의 반발을 사서 1623년 인조반정으로 쫓겨났어요."

- id: daedong-1608
  n: 대동법 실시 (경기도)
  d: '1608-05'
  c: 경제
  i: 3
  at: [126.977, 37.570]
  p: 경기도
  pg: 145
  t: 집집마다 특산물로 내던 공납을 토지 결수에 따라 쌀·베·동전으로 내게 했어요. 경기도에서 처음 실시해 100년 뒤 전국으로 넓혔어요.
  x: "특산물을 집집마다 거두던 때에는 하급 관리나 상인이 공물을 대신 내 주고 지나친 대가를 받아 내는 방납이 심해 농민의 부담이 컸어요. 대동법은 이 폐단을 바로잡으려는 제도로(미래엔 교과서는 1결당 쌀 12두), 이 일을 맡을 관청으로 선혜청을 두었어요. 땅을 많이 가진 사람일수록 세금을 많이 내게 되자 지주들은 불만이 컸지만, 땅이 적은 농민의 짐은 훨씬 가벼워졌어요."

- id: giyu
  n: 기유약조 (일본과 국교 회복)
  d: 1609
  c: 외교
  i: 2
  at: [129.03, 35.10]
  ap: 1
  p: 부산 (왜관)
  pg: 157
  t: 대마도주와 약조를 맺고 부산에 왜관을 두어 일본과 제한된 무역을 다시 열었어요. 1607년부터는 일본에 사절을 보냈어요.
  x: "조선은 일본이 먼저 국서를 보내고, 왜란 때 왕릉을 파헤친 범인을 넘기고, 끌려간 포로를 돌려보내라는 조건을 내걸었고, 일본이 이를 따르자 약조를 맺었어요. 대마도에서 오는 무역선(세견선)은 1년에 20척, 대마도주에게 주는 쌀·콩은 100석으로 정했고, 배는 부산포에만 대게 했어요. 전쟁 전의 약조보다 제한이 더 엄격했어요. 일본 사신은 대개 동래에 머무르며 맡은 일을 봤어요."

- id: donguibogam
  n: 허준, 『동의보감』 완성
  d: 1610
  c: 문화
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 159
  t: 허준이 우리나라와 중국의 의학을 정리한 의학서를 완성했어요. 2009년 유네스코 세계 기록 유산이 됐어요.
  x: "1596년 선조의 명으로 허준이 여러 의관과 함께 편찬을 시작했는데, 정유재란으로 중단된 뒤 허준이 작업을 이어 가 1610년 25권으로 완성했어요. 내경·외형·잡병·탕액·침구의 다섯 편으로 나누어 우리나라와 중국 의학의 핵심을 체계적으로 정리했고, 1613년 내의원에서 책으로 펴냈어요. 사람의 체질을 네 가지로 나눈 사상 의학은 조선 말 이제마의 업적이니 헷갈리지 마세요."

- id: sarhu
  n: 강홍립 파병과 중립 외교
  d: '1619-03'
  c: 전쟁
  i: 2
  at: [124.10, 41.85]
  ap: 1
  p: 사르후 (중국 랴오닝성 푸순 부근)
  pg: 138
  t: 명의 요청으로 강홍립이 군대를 이끌고 후금을 치러 갔다가, 조명 연합군이 사르후에서 패하자 후금에 항복했어요. 광해군은 명과 후금 사이에서 중립 외교를 펼쳤어요.
  x: "명이 누르하치의 후금과 맞서며 조선에 군사를 보내 달라고 하자, 광해군은 군대를 보내면서도 강홍립에게 형세를 살펴 알아서 움직이라고 일러 두었어요. 떠오르는 후금과 정면으로 부딪치지 않으려는 계산이었고, 이후 명이 거듭 요구할 때도 광해군은 실리를 좇아 후금과의 전쟁을 피했어요. 하지만 명에 대한 의리를 앞세운 서인은 이를 거세게 비판했고, 이것이 인조반정의 구실 중 하나가 됐어요."

- id: injo-banjeong
  n: 인조반정
  d: '1623-03'
  c: 정치
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 138
  t: 서인이 광해군의 중립 외교와 영창 대군 살해, 인목 대비 폐위를 문제 삼아 광해군을 몰아내고 인조를 세웠어요. 북인은 몰락했어요.
  x: "반정에 성공한 서인은 북인을 몰아내고 남인과 함께 정치를 이끌었고, 두 붕당은 서로 견제하면서도 상대를 인정하는 붕당 정치를 펼쳤어요. 새 정권은 후금을 멀리하고 명과 가까이하는 정책을 펴서, 후금(청)의 침략인 정묘호란(1627)과 병자호란(1636)을 부르는 배경이 됐어요. 서울 세검정은 반정 세력이 광해군 폐위를 의논하고 칼을 씻었다고 전하는 곳이에요."

- id: yi-gwal
  n: 이괄의 난
  d: '1624-01'
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  t: 반정 공신 이괄이 논공행상에 불만을 품고 반란을 일으켜 한양을 점령하자 인조가 공주로 피란했어요. 반란은 곧 진압됐어요.
  x: "이괄은 반정에 큰 공을 세워 2등 공신이 된 뒤 평안 병사 겸 부원수로 북쪽 국경을 지키고 있었어요. 흔히 공신 책봉에 대한 불만을 원인으로 들지만, 그가 역모를 꾀한다는 고발이 들어와 조정이 아들을 잡아 올리려 한 것이 직접 계기였다고 보기도 해요. 1만여 명의 군대로 한양에 들어가 흥안군을 왕으로 세웠지만, 길마재(안현) 싸움에서 지고 달아나다 부하에게 죽었어요. 함께 난을 일으킨 한명련의 아들 등이 후금으로 달아나 침략을 부추겨 정묘호란의 한 원인이 됐어요."

- id: yeongjeong
  n: 영정법 실시
  d: 1635
  c: 경제
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 145
  t: "풍년이든 흉년이든 토지 1결당 쌀 4두(미래엔 교과서는 4~6두)를 걷도록 전세를 고정했어요."
  x: "왜란과 호란으로 땅이 황폐해지고 나라 살림이 어려워지자, 정부는 세금을 안정적으로 걷고 농민 부담도 덜려고 전세 제도를 고쳤어요. 그런데 전세는 땅을 가진 사람에게 매기는 세금이라 혜택은 주로 땅을 많이 가진 지주에게 돌아갔고, 남의 땅을 빌려 짓는 소작농은 여전히 수확의 절반쯤을 땅 주인에게 내야 해서 살림이 별로 나아지지 않았어요. 전세는 영정법, 공납은 대동법, 군역은 균역법으로 짝지어 기억해 두세요."

- id: sohyeon
  n: 소현 세자 귀국
  d: 1645
  c: 외교
  i: 1
  at: [126.977, 37.570]
  p: 한양
  pg: 159
  t: 병자호란 뒤 청에 볼모로 갔던 소현 세자가 베이징에서 아담 샬과 사귀고 서양 문물을 가지고 돌아왔지만 곧 세상을 떠났어요.
  x: "소현 세자는 베이징에서 독일 출신 선교사 아담 샬과 가깝게 지내며 서양 학문과 천주교 교리를 접했고, 망원경·자명종·천구의·서양 서적 등을 받았어요. 귀국하면서 아담 샬에게 서양 학문을 조선에 널리 알리겠다는 편지를 보냈지만 그 뜻을 이루지 못했어요. 세자가 죽자 인조는 소현 세자의 아들 대신 자신의 둘째 아들 봉림 대군을 새 세자로 세웠고, 그가 뒤에 효종이 됐어요. 둘째 아들이 왕위를 이은 이 일이 예송의 불씨가 됐어요."

- id: bukbeol
  n: 효종의 북벌 추진
  d: 1649
  dt: 1649년 (효종 즉위) 이후
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 139
  t: 청에서 볼모 생활을 한 효종이 청을 치자는 북벌을 내세우고 성곽을 고치고 군대를 길렀어요. 효종이 죽으면서 중단됐어요.
  x: "효종은 송시열 등 서인의 지지를 받아 무기를 개량하고, 중앙군인 어영청을 개편해 군사 수를 늘렸어요. 하지만 청은 이미 중국 대륙을 차지할 만큼 강해 실제로 치기는 어려웠고, 흉년이 이어지는데 군비 부담까지 커지자 반대 목소리도 높아졌어요. 이때 길러 낸 조총 부대는 청의 요청으로 러시아군과 싸운 나선 정벌에서 실력을 보여 주었어요. 북벌은 이루지 못했지만, 청을 오가는 사람이 늘면서 오히려 청의 앞선 문물을 배우자는 목소리가 생겨나 뒷날 북학으로 이어졌어요."

- id: hamel
  n: 하멜 일행, 제주도에 표착
  ds: '1653-08-16'
  c: 외교
  i: 2
  at: [126.27, 33.23]
  ap: 1
  p: 제주 대정 (산방산 부근)
  pg: 163
  t: 네덜란드 상인 하멜 일행이 탄 배가 제주도에 닿았어요. 벨테브레이(박연)가 이들을 한성으로 데려갔고, 하멜은 뒤에 탈출해 『하멜 표류기』를 썼어요.
  x: "하멜 일행은 대만에서 일본 나가사키로 가던 네덜란드 배 스페르베르호를 타고 있었는데, 배가 난파해 64명 가운데 36명만 제주도에 올랐어요. 한양으로 보내져 약 2년간 지내다가(미래엔 교과서는 훈련도감에서 활동했다고 써요) 전라도로 옮겨져, 모두 13년 넘게 조선에 붙잡혀 있었어요. 1666년 8명이 탈출해 나가사키를 거쳐 네덜란드로 돌아갔어요. 『하멜 표류기』는 조선을 다룬 서양인 최초의 책으로 유럽에 조선을 알렸어요."

- id: sihyeon
  n: 시헌력 도입
  d: 1653
  c: 문화
  i: 1
  at: [126.977, 37.570]
  p: 한양
  pg: 159
  t: 김육 등의 건의로 청에서 쓰던 서양식 역법인 시헌력을 받아들였어요.
  x: "시헌력은 독일 출신 선교사 아담 샬(탕약망) 등이 서양 천문학을 바탕으로 만든 역법으로, 청에서는 1645년부터 썼어요. 조선은 관상감 관원 김상범 등이 여러 차례 베이징을 오가며 애쓴 끝에 1653년(효종 4)부터 시행했어요. 이후 조선 말까지 쓰였고, 1895년 태양력을 채택한 뒤에도 한동안 함께 쓰였어요."

- id: naseon-1
  n: 1차 나선 정벌
  d: 1654
  c: 전쟁
  i: 2
  at: [129.56, 46.32]
  ap: 1
  p: 헤이룽강(흑룡강) 유역
  t: 청의 요청으로 변급이 조총 부대를 이끌고 가서 남하하던 러시아군을 물리쳤어요. 조선에서는 러시아를 나선이라 불렀어요.
  x: "1650년대 러시아인들이 헤이룽강 일대로 내려와 성을 쌓고 모피를 모으면서 청군과 부딪쳤는데, 총포를 쓰는 러시아군에게 청군이 번번이 졌어요. 그러자 청은 조선의 조총 부대를 보내 달라고 요청했어요. 함경도 병마우후 변급이 조총군 100명과 초관·기고수 등 50여 명을 이끌고 영고탑에서 청군과 합류해 러시아군을 물리치고 그해 6월 돌아왔어요."

- id: naseon-2
  n: 2차 나선 정벌
  d: 1658
  c: 전쟁
  i: 2
  at: [132.5, 47.7]
  ap: 1
  p: 헤이룽강과 쑹화강이 만나는 곳
  t: 신류가 조총 부대를 이끌고 다시 출병해 러시아군을 크게 물리쳤어요.
  x: "4년 뒤 청이 다시 요청하자 혜산진 첨사 신류가 조총군 200명과 초관·기고수 등 60여 명을 이끌고 나섰어요. 송화강과 흑룡강이 만나는 곳에서 러시아 배 10여 척과 맞서 불화살로 적선을 불태웠고, 흑룡강 방면 러시아군의 주력을 거의 없앴어요. 조선군 피해는 전사 8명, 부상 25명이었어요. 두 차례 나선 정벌은 효종이 준비해 온 북벌의 군사력이 간접적으로 쓰인 일이자, 조선 조총병의 뛰어난 사격술을 보여 준 일로 평가받아요."

- id: yesong-1
  n: 기해예송 (1차 예송)
  d: '1659-05'
  c: 정치
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 146
  t: 효종이 죽은 뒤 자의 대비가 상복을 몇 년 입을지를 두고 서인(1년)과 남인(3년)이 다퉜어요. 서인의 주장이 받아들여졌어요.
  x: "자의 대비는 인조의 두 번째 왕비로, 효종에게는 계모였어요. 송시열·송준길 등 서인은 효종이 둘째 아들이니 일반 사대부의 예법처럼 1년이면 된다고 했고, 허목·윤휴 등 남인은 왕위를 이었으니 맏아들로 대우해 3년을 입어야 한다고 맞섰어요. 겉으로는 예법 다툼이었지만, 효종의 정통성과 왕에게도 사대부와 같은 예법을 적용할지가 걸린 정치 싸움이었어요. 『경국대전』 규정을 근거로 1년설이 채택돼 서인이 계속 정국을 이끌었어요."

- id: yesong-2
  n: 갑인예송 (2차 예송)
  d: 1674
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 146
  t: 효종비가 죽자 다시 상복 기간을 두고 다퉜는데 이번에는 남인의 주장이 받아들여져 남인이 정국을 주도했어요.
  x: "이번 쟁점은 자의 대비가 며느리인 효종비 인선 왕후를 위해 상복을 얼마나 입느냐였어요. 서인은 효종비를 둘째 며느리로 보아 9개월(대공복)을, 남인은 맏며느리로 보아 1년(기년복)을 주장했고, 결국 남인의 주장대로 1년으로 정해졌어요. 곧 현종이 죽고 숙종이 즉위하자 송시열 등 서인이 밀려나고 허목·윤휴 등 남인이 정권을 잡았어요. 이후 서인과 남인의 대립은 숙종 때 환국으로 이어지며 더 격렬해졌어요."

- id: sangpyeong
  n: 상평통보 주조·유통
  d: 1678
  c: 경제
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 151
  t: 숙종 때 상평통보를 만들어 널리 쓰게 했어요. 18세기 후반에는 전국에서 세금과 물건값을 동전으로 낼 수 있었어요.
  x: "상평통보는 1678년(숙종 4) 영의정 허적의 건의로 만들어 유통했고, 이후 조선 말까지 쓰인 유일한 법정 화폐가 됐어요. 그보다 앞서 1640년대에 상업이 발달한 개성에서 동전이 먼저 쓰이고 있었어요. 뒤에 흥선 대원군 때 상평통보 100닢 몫으로 쳐 주는 당백전이 나왔지만 실제 값어치는 그에 훨씬 못 미쳐 물가가 치솟는 등 화폐 질서가 흔들렸고, 상평통보는 1894년 주조가 멈췄어요."

- id: gyeongsin
  n: 경신환국
  d: '1680-03'
  c: 정치
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 146
  t: 숙종이 남인을 대거 몰아내고 서인에게 정권을 맡겼어요. 이후 집권 붕당이 갑자기 바뀌는 환국이 되풀이됐어요.
  x: "숙종은 자신이 즉위할 무렵부터 권력을 쥔 남인의 힘이 지나치게 커지는 것을 경계했어요. 그러던 중 숙종이 보내 주려던 왕실의 기름 먹인 천막(유악)을 영의정 허적이 미리 가져다 쓴 일로 숙종이 크게 노해 군대 지휘권을 서인에게 넘겼고, 곧이어 허적의 서자 허견이 종친과 역모를 꾀했다는 고발이 나왔어요. 이 일로 허적·윤휴 등 남인 중진이 죽거나 귀양을 갔어요. 이후 정권을 잡은 붕당이 상대 붕당을 아예 없애려 들면서, 서로 견제하며 함께하던 붕당 정치가 변질됐어요."

- id: noron-soron
  n: 서인, 노론과 소론으로 나뉨
  d: 1683
  dt: 1680년대 초 (경신환국 이후)
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 146
  t: 권력을 잡은 서인이 남인을 어떻게 처리할지를 두고 강경한 노론(송시열 중심)과 온건한 소론(윤증 중심)으로 나뉘었어요.
  x: "1683년 무렵 서인은 노론과 소론으로 갈라졌는데, 남인 처리 문제에 더해 스승 송시열과 제자 윤증이 윤증 아버지의 묘비 글 등을 두고 맞선 회니시비가 겹치며 골이 깊어졌어요. 숙종 말에는 노론이 연잉군(뒤의 영조)을, 소론이 세자(뒤의 경종)를 지지하면서 왕위 계승 문제로까지 맞붙었어요. 이렇게 대립이 극심해지자 왕이 앞장서 붕당 사이의 균형을 잡아야 한다는 탕평론이 제기됐어요."

- id: gisa
  n: 기사환국
  d: '1689-02'
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 146
  t: 희빈 장씨가 낳은 아들을 원자로 정하는 문제로 서인이 쫓겨나고 남인이 다시 정권을 잡았어요. 송시열이 사약을 받았어요.
  x: "숙종의 왕비 인현 왕후에게 아들이 없던 가운데, 1688년 숙종이 총애하던 장씨가 아들(뒤의 경종)을 낳았어요. 이듬해 숙종이 이 아이를 서둘러 원자로 정하자, 왕비가 아직 젊은데 후궁의 아들을 원자로 삼는 것은 옳지 않다며 서인(노론)이 반대했어요. 숙종은 반대한 서인을 대거 내쫓고 민암 등 남인을 등용했으며, 송시열은 제주도로 귀양 갔다가 사약을 받았어요. 인현 왕후도 폐위되고 장씨가 왕비가 됐어요."

- id: gapsul
  n: 갑술환국
  d: '1694-04'
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 146
  t: 남인이 몰락하고 서인(노론·소론)이 다시 정권을 잡았어요. 이후 남인은 정치에서 크게 밀려났어요.
  x: "1694년 노론 김춘택과 소론 한중혁 등이 폐위된 인현 왕후를 다시 왕비로 세우려는 운동을 벌이자, 집권 남인이 이들을 처벌하려 했어요. 그러나 왕비를 내쫓은 일을 후회하던 숙종은 오히려 남인 민암 등을 사사하거나 귀양 보내고, 남구만 등 소론과 노론을 다시 불러들였어요. 인현 왕후는 왕비 자리에 돌아오고 왕비 장씨는 희빈으로 낮아졌어요. 이후 정국은 노론과 소론이 함께 이끌었고, 두 세력의 대립이 새로운 갈등의 중심이 됐어요."

- id: an-yongbok
  n: 안용복, 울릉도·독도가 조선 땅임을 주장
  d: 1693
  e: 1696
  c: 외교
  i: 2
  at: [130.87, 37.50]
  p: 울릉도
  t: 동래 사람 안용복이 1693년 울릉도에서 고기를 잡다 일본 어민에게 끌려갔고, 1696년 다시 일본에 건너가 울릉도와 독도가 조선 땅이라고 주장했어요. 1696년 일본 막부는 자국민이 울릉도에 건너가는 것을 금지했어요.
  x: "안용복은 동래(부산)의 어부로, 수군에서 노 젓는 군사로 일하며 왜관을 자주 드나들어 일본어에 능했어요. 1693년 박어둔과 함께 끌려갔을 때 호키주와 에도 막부를 상대로 울릉도가 조선 땅이라고 따졌어요. 1696년에는 울릉도에서 일본 어민을 독도까지 쫓아가 꾸짖고, 울릉도와 우산도(독도)를 맡은 관리라고 스스로 칭하며 일본에 건너가 항의했어요. 허락 없이 국경을 넘은 죄로 사형까지 논의됐지만 공을 인정받아 유배로 줄었고, 울릉도와 독도가 우리 땅임을 지켜 낸 인물로 기억돼요."

- id: daedong-1708
  n: 대동법 전국 확대
  d: 1708
  c: 경제
  i: 3
  at: [126.977, 37.570]
  p: 전국 (황해도까지)
  pg: 145
  t: 황해도까지 대동법을 실시하면서 평안도·함경도 등 일부를 빼고 전국에서 시행됐어요. 공인이 나타나 상업이 발달하는 계기가 됐어요.
  x: "경기도(1608)에서 시작한 대동법은 강원도(1623), 충청도(1651), 전라도(1658), 경상도(1678)를 거쳐 황해도(1708)까지 넓혀졌어요(비상 교과서 지도 기준). 땅이 많을수록 세금을 많이 내야 해서 지주와 양반의 반대가 컸기 때문에 전국에 시행되기까지 100년이나 걸렸어요. 공인은 관청에서 받은 대금으로 시장에서 물건을 사거나 수공업자에게 주문해 바쳤고, 이 과정에서 상품 수요가 늘어 상품 화폐 경제가 발달했어요."

- id: baekdusan-stele
  n: 백두산정계비 건립
  d: '1712-05-15'
  c: 외교
  i: 3
  at: [128.10, 42.00]
  ap: 1
  p: 백두산 남동쪽 분수령
  pg: 215
  t: 조선과 청이 백두산 부근의 국경을 정하고 '서쪽은 압록, 동쪽은 토문'이라는 비석을 세웠어요. 뒤에 토문강의 해석을 두고 간도 귀속 문제가 생겼어요.
  x: "청의 오라총관 목극등이 조선 관원들과 현지를 답사한 뒤, 백두산 천지에서 동남쪽으로 약 4km 떨어진 분수령에 비석을 세웠어요. 조선의 접반사 박권과 함경 감사 이선부는 늙고 몸이 약하다는 이유로 정상까지 오르지 않아, 경계는 거의 목극등의 뜻대로 정해졌어요. 조선은 비문의 토문을 쑹화강 상류의 토문강으로 보아 간도가 우리 땅이라고 주장했고, 청은 두만강이라고 맞섰어요. 1909년 일제가 우리 정부를 빼고 청과 간도 협약을 맺어 간도를 넘겨주었고, 비석은 1931년 만주 사변 직후 사라졌어요."

- id: yi-injwa
  n: 이인좌의 난
  d: '1728-03'
  c: 정치
  i: 2
  at: [127.49, 36.64]
  ap: 1
  p: 청주
  t: 영조 즉위에 불만을 품은 소론 강경파와 남인 일부가 청주성을 점령하며 반란을 일으켰다가 진압됐어요. 영조는 탕평책을 더 강하게 추진했어요.
  x: "1728년(영조 4)에 일어나 무신란이라고도 해요. 정권에서 밀려난 소론 강경파와 남인이 경종의 죽음에 의혹을 제기하고 영조가 숙종의 친아들이 아니라고 주장하며, 소현 세자의 증손 밀풍군 탄을 왕으로 세우려 했어요. 3월 15일 청주성을 함락했지만 북쪽으로 올라가다 안성·죽산에서 병조 판서 오명항이 이끈 관군에게 크게 졌고, 영남·호남에서 호응한 세력도 진압됐어요. 주모자 대부분이 소론이어서 소론의 입지는 약해진 반면, 영조가 내세운 탕평의 명분은 더 굳어졌어요."

- id: tangpyeong-stele
  n: 영조, 탕평비 건립
  d: 1742
  c: 정치
  i: 2
  at: [126.997, 37.588]
  p: 성균관
  pg: 148
  t: "영조가 붕당에 치우치지 않는 정치를 다짐하며 성균관 앞에 탕평비를 세웠어요. 탕평에 찬성하는 노론과 소론의 온건파(탕평파)를 고루 등용하고 서원을 정리했어요."
  x: "탕평이라는 말은 『서경』에서 따온 것으로, 왕이 어느 편에도 기울지 않고 고르게 다스린다는 뜻이에요. 비석에는 『논어』 구절을 바탕으로, 두루 어울리며 패거리를 짓지 않는 것은 군자의 바른 마음이고 패거리만 짓고 두루 어울리지 못하는 것은 소인의 좁은 마음이라는 글이 새겨져 있어요. 영조는 이 비를 앞으로 관리가 될 유생들이 공부하는 성균관에 세웠고, 붕당 다툼의 중심이던 이조 전랑의 인사 권한도 약하게 만들었어요."

- id: sokdaejeon
  n: 『속대전』 편찬
  d: 1746
  c: 정치
  i: 1
  at: [126.977, 37.570]
  p: 한양
  pg: 147
  t: 『경국대전』 이후 바뀐 법을 모아 정리한 법전이에요. 가혹한 형벌을 줄이는 내용도 담았어요.
  x: "『경국대전』이 완성된 지 260년쯤 지나면서 그사이 새로 나온 왕명과 규정이 쌓이고 현실에 맞지 않는 조항도 늘어, 이를 정리해 펴낸 법전이에요. 탕평으로 왕권이 안정되자 영조는 신문고를 다시 설치하는 등 백성의 억울함을 살피는 정책도 함께 펼쳤어요. 조선의 법전은 『경국대전』(성종) → 『속대전』(영조) → 『대전통편』(정조) → 『대전회통』(흥선 대원군 집권기) 순서로 이어지니 왕과 짝지어 기억해 두세요."

- id: gyunyeok
  n: 균역법 실시
  d: '1750-07'
  c: 경제
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 145
  t: 농민이 1년에 내던 군포를 2필에서 1필로 줄였어요. 줄어든 재정은 결작(토지세)과 어장세·염세 등으로 메웠어요.
  x: "16세 이상 60세 미만의 양인 남자는 군대에 가는 대신 군포를 냈는데, 양반은 군포를 면제받은 데다 수령과 아전이 정해진 것보다 더 걷는 일까지 겹쳐 농민의 짐은 점점 무거워졌어요. 집집마다 내게 하는 호포론이나 토지를 기준으로 걷는 결포론 같은 개혁안도 나왔지만 양반의 반대로 미뤄지다가, 영조가 군포를 1필로 줄이는 쪽을 택했어요. 결작은 땅 1결당 쌀 2두(또는 돈 5전)였고, 군역에서 빠져 있던 일부 양인에게 선무군관이라는 칭호를 주고 1필씩 걷기도 했어요. 하지만 군포 폐단이 뿌리 뽑히지 않아 19세기 군정의 문란으로 이어졌어요."

- id: inwang
  n: 정선, 「인왕제색도」
  d: 1751
  c: 문화
  i: 1
  at: [126.96, 37.58]
  p: 서울 인왕산
  pg: 161
  t: 정선이 비 갠 뒤의 인왕산을 그린 진경산수화예요. 우리 산천을 직접 보고 사실적으로 그렸어요.
  x: "제목에 쓰인 제색은 비가 갠 뒤의 경치라는 뜻으로, 정선이 일흔다섯 살 무렵 비가 그친 인왕산을 그린 작품이에요. 비에 젖은 커다란 바위를 짙은 먹으로 대담하게 칠하고, 그 아래로 하얀 안개가 감도는 모습을 담아 눈앞에서 보는 듯한 느낌을 줘요. 정선은 금강산 전체를 하늘에서 내려다보듯 한 화면에 담은 「금강전도」로도 유명해요."

- id: imo-hwabyeon
  n: 사도 세자의 죽음 (임오화변)
  d: '1762-05'
  dt: 1762년 음력 윤5월
  c: 정치
  i: 2
  at: [126.995, 37.582]
  p: 창경궁
  pg: 147
  t: 영조가 아들 사도 세자를 뒤주에 가둬 죽게 했어요. 이 일을 두고 시파와 벽파가 갈라섰어요.
  x: "사도 세자는 영조를 대신해 나랏일을 맡아 보던(대리청정) 왕세자였어요. 1762년 나경언이 세자의 잘못을 고발하고 생모 영빈 이씨도 세자의 병이 깊다고 알리자, 영조는 세자를 폐하고 뒤주에 가뒀어요. 세자가 죽은 뒤 영조는 사도라는 이름을 내렸고, 세자의 아들 세손이 뒤에 정조로 즉위해 아버지의 묘를 수원으로 옮기고 화성을 쌓았어요. 영조의 처분을 철저히 지켜야 한다는 쪽은 벽파, 정조의 뜻에 호응한 쪽은 시파로 불렸어요."

- id: kyujanggak
  n: "규장각 설치"
  d: '1776-09'
  c: 정치
  i: 3
  at: [126.991, 37.582]
  p: 창덕궁 규장각
  pg: 147
  t: "1776년 음력 3월 즉위한 정조가 그해 9월 규장각을 두어 정책 연구와 자문 기구로 삼았어요. 박제가·유득공·이덕무 같은 서얼 출신도 검서관으로 뽑았어요."
  x: "규장각은 처음엔 역대 임금이 남긴 글과 책을 모셔 두던 곳이었는데, 정조가 이곳을 학문을 연구하고 나랏일의 방향을 짜는 중심으로 바꿨어요. 37세 이하의 젊고 뛰어난 문신을 골라 한동안 규장각에서 공부에만 힘쓰게 한 초계문신제를 두고, 정조가 직접 가르치고 시험도 보며 개혁을 함께할 인재로 키웠어요. 정약용도 초계문신 출신으로 정조의 총애를 받았어요. 이곳 학자들이 여러 책을 펴내면서 정조 때 학문과 문화가 크게 꽃피었어요."

- id: bukhagui
  n: 박제가, 『북학의』 저술
  d: 1778
  c: 문화
  i: 2
  at: [116.40, 39.90]
  ap: 1
  p: 청의 수도 연경 (베이징)을 다녀옴
  pg: 160
  t: 연행에서 보고 들은 것을 바탕으로 수레와 선박을 이용하고 청의 문물을 받아들여 상공업을 키우자고 주장했어요.
  x: "박제가는 서얼 출신으로 정조 때 규장각 검서관으로 뽑힌 학자예요. 그는 재물을 우물에 비유해, 물을 퍼내면 다시 차고 내버려 두면 말라 버리듯 소비가 있어야 생산도 늘어난다고 보았어요. 그래서 무조건 아끼기만 하면 수공업이 쇠퇴한다며 청과의 교역을 늘리자고 주장했어요. 홍대용·박지원 등과 함께 청의 앞선 문물을 배우자고 한 북학파로 불리며, 이들의 주장은 뒤에 개화사상에 영향을 주었어요."

- id: yeolha
  n: 박지원, 연행 (『열하일기』)
  d: 1780
  c: 외교
  i: 2
  at: [117.94, 40.98]
  ap: 1
  p: 열하 (중국 허베이성 청더)
  pg: 158
  t: 박지원이 청 황제의 생일 축하 사절을 따라 연경과 열하에 다녀온 경험을 『열하일기』로 남겼어요.
  x: "박지원은 정조 때 사절단을 따라 청에 갔는데, 건륭제가 베이징이 아닌 열하의 피서 산장에 머물러 그곳까지 다녀오느라 약 5개월이 걸렸어요. 그는 거창한 유적보다 깨진 기와 조각이나 똥거름에서도 배울 점을 찾을 만큼 청의 실용적인 도구와 생활을 꼼꼼히 살폈어요. 『열하일기』는 보고 들은 것을 적는 데 그치지 않고, 익살과 날카로운 비꼼으로 조선 사회의 문제를 꼬집어 높이 평가받아요. 박지원은 수레와 배, 화폐를 적극 쓰자고 주장한 북학파 학자이기도 해요."

- id: balhaego
  n: 유득공, 『발해고』 저술
  d: 1784
  c: 문화
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 160
  t: 발해의 역사를 정리하고 통일 신라와 발해가 함께 있던 시기를 처음으로 '남북국'이라 불렀어요.
  x: "유득공은 서얼 출신으로 박제가·이덕무와 함께 규장각 검서관으로 일한 학자예요. 『발해고』는 발해가 고구려를 이은 나라임을 밝히고, 발해의 역사를 우리 역사의 일부로 보았어요. 명이 멸망하고 청이 강해지면서 중국 중심의 세계관에서 벗어나 우리 역사·지리·언어를 연구하는 국학이 발달했는데, 『발해고』는 그 대표적인 성과예요."

- id: daejeon-tongpyeon
  n: 『대전통편』 완성
  d: 1785
  c: 정치
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 147
  t: 정조가 『경국대전』과 『속대전』 등을 하나로 합쳐 법전을 다시 정리했어요.
  x: "『경국대전』을 바탕으로 『속대전』과 그 뒤에 나온 법령까지 하나로 모아, 흩어져 있던 법을 찾아보기 쉽게 정리했어요. 문물제도를 정비하려는 정조의 노력 가운데 하나로, 정조는 이 밖에도 『탁지지』 등 많은 책을 펴냈어요. 뒤에 흥선 대원군 집권기에 이를 다시 보완해 펴낸 법전이 『대전회통』이에요."

- id: sinhae-tonggong
  n: 신해통공
  d: '1791-01'
  c: 경제
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 147
  t: 정조가 육의전을 뺀 시전 상인의 특권(금난전권)을 없애 사상들도 자유롭게 장사할 수 있게 했어요.
  x: "금난전권은 시전 상인이 허가 없이 장사하는 난전을 단속할 수 있는 특권이에요. 시전 상인이 이 권리로 물건을 독점하자 물가가 오르고 영세 상인·수공업자·도시 빈민의 생활이 어려워졌어요. 1791년 남인 채제공의 건의로 이 특권을 없앴는데, 규모가 가장 큰 여섯 시전인 육의전만은 예외로 남겨 두었어요. 특권 상인과 손잡은 노론 세력의 경제 기반을 약하게 하려는 정치적 뜻도 담겨 있었다고 봐요."

- id: jangyong
  n: 장용영 설치
  d: 1793
  c: 정치
  i: 2
  at: [127.01, 37.29]
  ap: 1
  p: 한양 (외영은 수원 화성)
  pg: 147
  t: 정조가 왕을 직접 호위하는 친위 부대 장용영을 만들어 군사 기반을 다졌어요.
  x: "정조는 1785년 왕을 호위하는 장용위를 만들고, 1793년 이를 크게 늘려 하나의 군영인 장용영으로 키웠어요. 한양 도성을 중심으로 한 내영과 수원 화성을 중심으로 한 외영으로 나뉘었고, 정조는 화성의 서장대에서 야간 군사 훈련을 직접 지휘하기도 했어요. 왕이 직접 거느리는 군대를 가져 강력한 왕권을 뒷받침하려 한 거예요. 정조가 죽은 뒤 벽파가 정권을 잡으면서 1802년(순조 2) 장용영은 폐지됐어요."

- id: hwaseong
  n: 수원 화성 축조
  d: '1794-01'
  e: '1796-09'
  c: 문화
  i: 3
  at: [127.01, 37.29]
  p: 수원 화성
  pg: 147
  t: 정조가 아버지 사도 세자의 묘를 옮긴 수원에 정약용이 설계한 화성을 쌓았어요. 거중기를 써서 공사 기간을 줄였고, 1997년 세계 유산이 됐어요.
  x: "정약용이 만든 거중기는 서양 기술 책 『기기도설』을 참고해 도르래의 원리로 무거운 돌을 적은 힘으로 들어 올리는 기계였어요. 정조는 화성을 정치·군사·경제 기능을 갖춘 새 도시로 키우려고 상설 시장을 두고 농업·상업을 지원했으며, 장용영 외영을 두었어요. 일제 강점기와 6·25 전쟁 때 일부가 부서졌지만, 공사 과정을 자세히 기록한 『화성성역의궤』 덕분에 대부분 복원할 수 있었어요."

- id: sedo
  n: 순조 즉위, 세도 정치 시작
  d: '1800-07'
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 149
  t: 정조가 갑자기 죽고 어린 순조가 왕이 되자 왕비의 아버지 김조순 등 안동 김씨가 권력을 잡았어요. 순조·헌종·철종 3대 60여 년 동안 몇몇 가문이 권력을 독차지했어요.
  x: "영조와 정조의 탕평은 강한 왕이 있을 때는 잘 돌아갔지만, 권력이 왕과 그 측근에게 쏠리는 방식이었어요. 그래서 정조가 갑자기 죽고 어린 왕이 오르자 그 힘을 왕실의 외척 가문이 차지했고, 안동 김씨와 풍양 조씨 등은 비변사의 높은 자리와 군영 지휘권을 쥐고 나라를 좌지우지했어요. 돈으로 벼슬을 사는 일이 흔해지고 과거 시험도 공정하지 않게 되자, 벼슬을 산 관리들은 들인 돈을 백성에게서 짜냈어요. 암행어사를 보내도 소용이 없었고, 이는 삼정의 문란과 농민 봉기로 이어졌어요."

- id: gongnobi
  n: 공노비 해방
  d: '1801-01'
  c: 사회
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 152
  t: "순조 때 왕실과 중앙 관청에 속한 공노비 6만여 명을 양인으로 풀어 주었어요."
  x: "조선 후기에는 곡식을 바치거나(납속) 전쟁에서 공을 세워 양인이 되는 노비가 늘었고, 아예 도망쳐 노비 처지를 벗어나는 사람도 많았어요. 상민이 줄어 군포를 낼 사람이 모자라자, 나라에서도 노비를 양인으로 바꿔 세금을 낼 사람을 늘리려 했어요. 다만 개인이 소유한 사노비는 이때 풀려나지 못했고, 신분제 자체는 1894년 갑오개혁 때 폐지됐어요."

- id: sinyu
  n: 신유박해
  d: '1801-01'
  c: 사회
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 153
  t: 천주교를 크게 탄압해 이승훈 등이 처형되고 정약용·정약전 형제가 유배됐어요. 남인 세력도 큰 타격을 입었어요.
  x: "정조가 죽고 어린 순조가 즉위하자, 수렴청정을 한 정순 왕후와 벽파 세력이 천주교를 금지하는 명령을 내리고 전국에서 신자를 찾아냈어요. 중국인 신부 주문모와 이승훈·정약종 등이 처형되는 등 300여 명이 목숨을 잃은, 우리 천주교회가 겪은 첫 대규모 박해였어요. 천주교를 믿거나 눈감아 주던 남인 시파 세력을 꺾으려는 정치적 목적도 컸어요. 정약용은 처음에 경상도 장기로, 이어 황사영 백서 사건의 여파로 전라도 강진으로 유배됐어요."

- id: last-tongsinsa
  n: 마지막 통신사 (대마도)
  d: 1811
  c: 외교
  i: 1
  at: [129.29, 34.20]
  ap: 1
  p: 대마도 (쓰시마)
  pg: 157
  t: 12번째이자 마지막 통신사가 에도까지 가지 않고 대마도에서 국서를 주고받았어요.
  x: "조선 후기 통신사는 1607년부터 1811년까지 12번 파견됐는데, 처음 세 번은 회답겸쇄환사라고 불렀어요. 보통은 300~500명이 대마도를 거쳐 에도(도쿄)까지 가서 쇼군에게 국서를 전했지만, 마지막인 1811년(정사 김이교)에는 대마도에서 국서를 주고받는 것으로 의식을 대신했어요. 그 뒤로는 논의만 있었을 뿐 실제로 보내지 않았고, 19세기 중엽 서양 세력이 다가오는 가운데 통신사는 끊겼어요."

- id: mokmin
  n: 정약용, 『목민심서』 저술
  d: 1818
  c: 문화
  i: 1
  at: [126.75, 34.58]
  ap: 1
  p: 전남 강진 (유배지)
  t: 강진에서 유배 생활을 하던 정약용이 지방관(수령)이 지켜야 할 도리를 정리했어요.
  x: "정약용은 1801년 신유박해 때 유배된 뒤 1818년에야 풀려났는데, 『목민심서』는 바로 그해 완성됐어요. 모두 48권으로, 수령이 부임할 때부터 물러날 때까지 지켜야 할 마음가짐과 일 처리 방법을 12편 72조로 나누어 정리했어요. 백성을 아끼는 정치를 강조하며 군포를 거두는 과정의 폐단 같은 현실 문제도 지적했어요. 정약용은 유배 중에도 다양한 분야를 연구해 실학을 집대성했다는 평가를 받아요."

- id: gihae
  n: 기해박해
  d: 1839
  c: 사회
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 153
  t: 헌종 때 천주교를 다시 크게 탄압해 프랑스 선교사와 많은 신자가 처형됐어요.
  x: "신유박해 뒤에도 천주교는 몰래 퍼졌고, 프랑스 선교사들이 조선에 숨어 들어와 활동했어요. 1839년 헌종 때는 안동 김씨에 이어 권력을 잡아 가던 풍양 조씨 세력이 박해를 이끌었어요. 앵베르 주교와 모방·샤스탕 신부가 새남터에서 처형되고 정하상·유진길 등 조선인 지도자도 목숨을 잃었어요. 정부는 오가작통법으로 신자들이 달아나지 못하게 하고, 천주교를 배척하는 척사윤음을 전국에 내렸어요."

- id: sehando
  n: 김정희, 「세한도」
  d: 1844
  c: 문화
  i: 1
  at: [126.27, 33.25]
  ap: 1
  p: 제주 대정 (유배지)
  pg: 162
  t: 제주도에 유배된 김정희가 변함없이 책을 보내 준 제자 이상적에게 그려 준 그림이에요. 김정희는 독창적인 추사체로도 유명해요.
  x: "김정희는 1840년 윤상도의 옥사에 연루돼 제주도 대정에 갇혀 9년 동안 유배 생활을 했어요. 이때 제자이자 역관인 이상적이 베이징에서 귀한 책을 두 번이나 구해 보내 주자, 그 변치 않는 마음에 고마워하며 이 그림을 그려 주었어요. 집 한 채 좌우에 소나무와 잣나무만 그리고 나머지는 여백으로 남겼는데, 날이 추워진 뒤에야 소나무와 잣나무가 늦게 시든다는 것을 안다는 공자의 말에서 제목을 땄어요. 추사체도 이 유배 시기를 거치며 무르익었다고 평가받아요."

- id: donghak
  n: 최제우, 동학 창시
  d: '1860-04-05'
  c: 사회
  i: 3
  at: [129.27, 35.90]
  ap: 1
  p: 경주 용담정
  pg: 153
  t: 경주의 몰락 양반 최제우가 유교·불교·도교와 민간 신앙을 합쳐 동학을 만들었어요. '사람이 곧 하늘'이라는 평등사상을 담았어요.
  x: "최제우는 서학(천주교)이 퍼지는 데 맞서, 동쪽 땅에서 나온 가르침이라는 뜻으로 동학이라 이름 붙였어요. 세도 정치와 삼정의 문란, 잦은 자연재해와 이양선 출몰로 불안해하던 백성에게 모든 사람이 평등한 세상을 만들자는 가르침이 큰 공감을 얻어 짧은 기간에 빠르게 퍼졌어요. 비슷한 시기에 정씨 성을 가진 사람이 새 왕조를 연다는 『정감록』 같은 예언 사상과 미륵 신앙도 널리 유행했어요."

- id: daedong-map
  n: 김정호, 「대동여지도」 제작
  d: 1861
  c: 문화
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 160
  t: 산맥·하천·도로망을 자세히 담고 도로에 10리마다 점을 찍어 거리를 알 수 있게 한 지도예요. 22첩으로 나누어 접어서 들고 다닐 수 있었어요.
  x: "「대동여지도」는 나무판에 새겨 찍어 낸 지도라서, 일일이 손으로 베끼지 않고도 여러 벌을 만들어 널리 퍼뜨릴 수 있었어요. 역참·마을·도로 같은 것은 지도 첫머리의 지도표에 정해 둔 기호로 간단히 나타냈고, 22첩을 모두 펼쳐 이어 붙이면 우리나라 전체 지도가 됐어요. 이보다 앞서 정상기는 처음으로 백리척을 써서 「동국지도」를 만들었어요."

- id: imsul
  n: 임술 농민 봉기 (진주 농민 봉기)
  d: '1862-02'
  c: 사회
  i: 3
  at: [128.08, 35.19]
  p: 진주
  pg: 154
  t: 경상 우병사 백낙신의 수탈에 맞서 진주 농민들이 몰락 양반 유계춘을 중심으로 봉기했어요. 봉기는 북쪽 함흥에서 남쪽 제주까지 전국으로 퍼졌어요.
  x: "진주 농민들은 머리에 흰 수건을 두르고 나무 몽둥이를 든 채 읍내로 몰려가, 관아를 덮쳐 세금 장부를 태우고 원성을 사던 아전과 양반 지주의 집을 부수거나 불태웠어요. 해산시키러 장터에 나온 백낙신을 둘러싸고 재물을 빼돌린 죄와 아전들이 세금을 억지로 거둔 일을 따지기도 했어요. 미래엔 교과서는 봉기가 70여 고을로 번졌다고 써요. 제도를 뿌리부터 바꾸지는 못했지만, 농민들이 사회 문제에 눈뜨고 함께 맞서는 경험을 쌓는 계기가 됐어요."

- id: samjeong
  n: 삼정이정청 설치
  d: '1862-05'
  c: 경제
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 154
  t: 정부가 전정·군정·환곡의 문란을 바로잡으려 삼정이정청을 두었지만 큰 성과를 거두지 못했어요.
  x: "삼정이정청은 농민 봉기를 수습하러 파견된 안핵사 박규수의 건의로 1862년 5월 설치됐고, 정원용·김좌근·조두순 같은 원로 대신이 책임을 맡았어요. 전정과 군정은 현실에 맞게 바로잡고, 문제가 가장 컸던 환곡은 없애고 토지에 세금을 매기는 방식(파환귀결)으로 바꾸는 개혁안을 마련했어요. 그러나 같은 해 윤8월 「삼정이정절목」을 발표하며 이정청은 문을 닫고 일은 비변사로 넘어갔어요. 삼정의 문란은 계속됐고, 흥선 대원군이 다시 삼정 개혁에 나서게 됐어요."

- id: choe-jeu-death
  n: 최제우 처형
  d: '1864-03'
  c: 사회
  i: 1
  at: [128.60, 35.87]
  ap: 1
  p: 대구
  pg: 153
  t: 정부가 세상을 어지럽히고 백성을 속인다는 죄로 최제우를 처형했어요. 2대 교주 최시형이 『동경대전』과 『용담유사』를 펴내 교리를 정리했어요.
  x: "정부는 모든 사람이 평등하다는 동학의 가르침이 양반 중심의 질서를 흔들고 세상을 바꾸자고 부추긴다고 보아 금지했어요. 하지만 교조가 처형된 뒤에도 동학은 꺾이지 않았어요. 최시형이 펴낸 『동경대전』은 한문 경전이고 『용담유사』는 한글 가사를 모은 책이에요. 교단 조직까지 정비되면서 동학은 오히려 더 널리 퍼졌고, 이 조직은 뒤에 동학 농민 운동(1894)의 바탕이 됐어요."

# ───── R2 검수에서 더한 사건 (두 교과서 대조) ─────

- id: five-camps
  n: "금위영 설치, 5군영 완성"
  d: 1682
  c: "정치"
  i: 2
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 145
  t: "임진왜란 때 만든 훈련도감에 이어 어영청·총융청·수어청·금위영을 차례로 두어 5군영 체제를 갖추었어요. 지방에는 양반부터 노비까지 포함된 속오군을 두었어요."
  x: "5군영은 처음부터 한꺼번에 계획해 만든 것이 아니라, 왜란 무렵부터 약 90년에 걸쳐 그때그때 필요에 따라 한성과 그 주변을 지킬 군영을 하나씩 더해 완성됐어요. 효종은 북벌을 준비하며 어영청을 개편해 군사를 늘렸고, 남한산성의 수어장대는 수어청 장수가 군사를 지휘하던 장소예요. 19세기 세도 가문은 5군영 지휘권까지 손에 넣어 권력을 독점했어요. 지방 속오군은 양반들이 노비와 같이 훈련받기를 싫어해 빠져나가면서 점차 상민과 노비 위주가 됐어요."

- id: gonyeo
  n: "「곤여만국전도」 전래"
  d: 1603
  c: "문화"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양 (베이징에서 들여옴)"
  pg: 159
  t: "중국을 오가던 사신들이 마테오 리치가 만든 세계 지도 「곤여만국전도」를 들여왔어요. 중국이 세계의 중심이라는 생각이 흔들리기 시작했어요."
  x: "1603년은 아직 명나라 때로, 베이징에 사신으로 갔던 이광정·권희가 서양식 세계 지도를 가지고 돌아왔다는 기록이 있어요. 이탈리아 출신 선교사 마테오 리치가 1602년 베이징에서 만든 「곤여만국전도」는 중국 밖의 넓은 세계를 보여 주어 조선 사람들의 세계관을 넓혔고, 조선에서 정밀한 지도를 만드는 데도 영향을 주었어요. 1708년(숙종 34)에는 관상감에서 이 지도를 베껴 그려 병풍으로 만들기도 했어요."

- id: taengniji
  n: "이중환, 『택리지』"
  d: 1751
  c: "문화"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "전국 답사"
  pg: 160
  t: "이중환이 전국을 돌아다니며 각 지역의 자연환경, 인물, 풍속, 살기 좋은 곳을 정리한 지리서를 썼어요."
  x: "조선 후기에는 실학자들이 우리 국토와 현실에 관심을 가지면서 지리서와 정밀한 지도가 활발히 만들어졌고, 『택리지』는 그 대표적인 지리서예요. 이 책에는 노론·소론·남인이 서로를 역적이라 모함하고 혼인조차 하지 않을 만큼 붕당 다툼이 시골까지 번졌다는 기록도 있어, 당시 사회 모습을 생생히 보여 줘요."

- id: dongsa-gangmok
  n: "안정복, 『동사강목』"
  d: 1778
  c: "문화"
  i: 1
  at: [127.26, 37.41]
  ap: 1
  p: "경기 광주"
  pg: 160
  t: "안정복이 고조선부터 고려 말까지의 우리 역사를 체계적으로 정리했어요."
  x: "명이 멸망하고 오랑캐로 여기던 청이 강해지자, 중국 중심의 세계관에서 벗어나 우리 역사·지리·언어를 연구하려는 국학이 발달했는데 『동사강목』은 그 대표적인 역사책이에요. 같은 흐름에서 유득공의 『발해고』, 이중환의 『택리지』, 신경준의 『훈민정음운해』, 유희의 『언문지』 등이 나왔어요. 안정복은 여러 역사 기록을 꼼꼼히 비교해 잘못 전해진 내용을 바로잡으려 애썼어요."

- id: cheonggyecheon
  n: "영조, 청계천 준천"
  d: 1760
  c: "사회"
  i: 1
  at: [126.99, 37.569]
  p: "한양 청계천"
  pg: 147
  t: "영조가 홍수 피해를 막으려고 한양 도성 안을 흐르는 청계천의 바닥을 파내고 물길을 정비했어요."
  x: "도성 한가운데를 흐르는 청계천은 바닥에 흙과 모래가 쌓여 비만 오면 넘치기 일쑤였고, 그때마다 주변에 사는 백성이 피해를 입었어요. 영조는 물길 바닥을 깊이 파내는 준천 공사를 크게 벌이고 직접 다리에 나가 공사를 살폈는데, 그 장면이 「수문상친림관역도」라는 그림에 남아 있어요. 균역법 실시, 신문고 부활과 함께 백성의 생활을 안정시키려 한 영조의 개혁으로 꼽혀요."

- id: jinsan
  n: "진산 사건"
  d: 1791
  c: "사회"
  i: 1
  at: [127.35, 36.15]
  p: "전라도 진산 (지금의 충남 금산)"
  t: "천주교 신자 윤지충이 어머니의 제사를 유교 예법대로 지내지 않아 처형됐어요. 이 일로 천주교 탄압이 시작됐어요."
  x: "윤지충은 천주교에서 금한다며 돌아가신 어머니의 신주(죽은 사람의 이름을 적어 모시는 나무패)를 불태웠어요. 성리학을 받드는 유학자들은 부모와 조상을 저버린 짓이라며 크게 반발했고, 윤지충과 외사촌 권상연이 처형되고 관련된 사람들도 벌을 받았어요. 이 일을 계기로 정부는 제사를 거부하는 천주교를 그릇된 가르침(사교)으로 보고 금지했어요. 두 사람이 처형된 전주 자리에는 지금 전동 성당이 서 있어요."

- id: genre-painting
  n: "김홍도·신윤복의 풍속화"
  d: 1780
  dt: "18세기 후반"
  c: "문화"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 168
  t: "김홍도는 서민의 일하는 모습과 놀이를, 신윤복은 양반과 여인의 생활을 생생하게 그렸어요. 서민 문화가 발달한 모습을 보여 줘요."
  x: "김홍도는 「서당」, 「씨름」, 「벼타작」처럼 농민과 서민의 일상을 소박하고 익살스럽게 그렸어요. 신윤복은 「단오풍정」처럼 멋을 즐기는 양반과 여인들, 남녀의 은근한 사랑을 섬세한 선과 고운 색으로 그려 냈어요. 같은 시기 이름이 알려지지 않은 화가들이 복을 비는 마음을 담아 그린 까치호랑이 같은 민화도 유행해, 왕실부터 민간까지 생활 공간을 꾸미는 데 쓰였어요. 상품 화폐 경제가 발달해 서민의 경제력이 커지고 서당 교육이 퍼진 것이 서민 문화가 발달한 바탕이에요."

- id: late-commerce
  n: "조선 후기 상업의 발달"
  d: 1700
  dt: "17~18세기"
  c: "경제"
  i: 2
  at: [126.55, 37.97]
  ap: 1
  p: "개성·한양·의주·동래 등"
  pg: 151
  t: "대동법으로 공인이 생기고 장시와 포구가 늘었어요. 개성의 송상, 한양의 경강상인, 의주의 만상, 동래의 내상 같은 큰 상인이 나타났고 상평통보가 널리 쓰였어요."
  x: "모내기법이 널리 퍼져 수확이 늘고, 인삼·담배·목화처럼 내다 팔 작물을 길러 부자가 된 농민도 생기면서 시장에 나오는 물건이 크게 많아졌어요. 관청에 매여 일하던 장인들도 세금만 내면 직접 물건을 만들어 장시에 팔 수 있게 됐고, 나라는 민간이 광산을 캐는 것도 허락했어요. 청·일본과의 무역도 활발해져 국경의 의주와 동래 왜관 등에서 공식 무역(개시)과 사사로운 무역(후시)이 이루어졌어요. 그러나 남의 땅조차 빌리지 못한 농민은 머슴이 되거나 도시와 광산으로 일거리를 찾아 떠났어요."
