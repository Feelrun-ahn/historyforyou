# 고려 (교과서 III 단원). 전투는 data/wars/korea.yaml

- id: goryeo-founding
  n: 왕건, 고려 건국
  d: '0918-06'
  c: 정치
  i: 3
  at: [127.25, 38.32]
  ap: 1
  p: 철원 (태봉의 도읍)
  pg: 77
  t: "신하들이 궁예를 몰아내고 왕건을 왕으로 세웠어요. 왕건은 태봉의 도읍 철원에서 왕위에 올라 나라 이름을 고려라 했어요. 고구려를 잇는다는 뜻이에요."
  x: "송악(개성) 호족 집안 출신인 왕건은 궁예 밑에서 후백제 땅이던 나주(금성)를 차지하는 등 큰 공을 세워, 태봉에서 가장 높은 벼슬인 시중에 올랐어요. 궁예가 왕권을 강화한다며 호족을 탄압하고 독단적으로 정치를 하자 민심이 떠났고, 결국 호족 세력이 왕건을 받들었어요. 건국 뒤 고려는 신라를 감싸고 후백제와 겨뤘는데, 927년 공산(대구)에서 크게 졌다가 930년 고창(안동)에서 이겨 전세를 뒤집었어요."

- id: songak-919
  n: 고려, 송악 천도
  d: 919
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 송악 (개경, 지금의 개성)
  pg: 77
  t: 왕건이 자신의 근거지인 송악으로 도읍을 옮겼어요. 송악은 이후 개경이라 불리며 고려의 도읍이 됐어요.
  x: "송악은 왕건이 호족으로 세력을 키운 근거지여서, 새 나라의 중심을 자기 기반 위에 둔 셈이에요. 개경은 몽골 침입 때 강화도로 도읍을 옮긴 시기(1232~1270)를 빼면 고려 시대 내내 도읍이었어요. 고려는 개경을 서경(평양)·동경(경주)과 함께 3경으로 삼았는데, 남경(서울)을 둔 뒤로는 남경을 3경에 넣어 부르기도 했어요. 개경과 그 둘레 지역은 ‘경기’라고 불렀어요."

- id: balhae-fall
  n: 발해 멸망
  d: '0926-01'
  c: 전쟁
  i: 3
  at: [129.19, 44.05]
  ap: 1
  p: 상경 용천부
  pg: 59
  t: 9세기 말부터 내분으로 약해진 발해가 거란의 침략으로 멸망했어요.
  x: "9세기 전반 선왕 때의 발해는 영토를 크게 넓혀 ‘바다 동쪽의 번성한 나라’라는 뜻의 ‘해동성국’으로 불렸어요. 926년 거란의 야율아보기가 쳐들어와 도읍 상경을 에워싸자 마지막 왕 대인선이 항복했고, 세자 대광현처럼 고려로 넘어온 유민도 많았어요. 고려 태조는 발해를 멸망시킨 거란을 배척하고 후대 왕들에게도 경계하라고 했는데, 이런 태도는 뒤에 거란이 고려를 침략하는 배경이 됐어요."

- id: dae-gwanghyeon
  n: 발해 세자 대광현, 고려로 망명
  d: 934
  c: 외교
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 77
  t: 발해 세자 대광현이 유민 수만 명을 이끌고 고려로 왔어요. 왕건은 이들을 받아들여 민족 통합을 이루었어요.
  x: "미래엔 교과서에는 왕건이 고구려를 이은 발해를 고려의 형제와 다름없는 나라로 여겨 그 유민을 기꺼이 받아들이는 장면이 실려 있어요. 태조는 대광현에게 왕씨 성과 ‘왕계’라는 이름을 주어 왕실 족보에 올리고, 조상의 제사를 받들게 했어요. 발해 유민은 주로 서북 지방에 살게 했는데, 신라와 후백제에 더해 발해 유민까지 받아들인 이 일을 교과서는 민족의 재통합이라고 불러요."

- id: silla-fall
  n: 신라 멸망
  d: '0935-11'
  c: 정치
  i: 3
  at: [129.22, 35.83]
  p: 경주
  pg: 77
  t: 경순왕이 나라를 고려에 넘기면서 신라가 멸망했어요. 왕건은 경순왕을 경주의 사심관으로 삼았어요.
  x: "신라는 9세기 말부터 왕위 다툼과 농민 봉기로 지방을 다스리지 못했고, 927년에는 후백제 견훤이 수도 금성(경주)을 습격하는 일까지 겪었어요. 이때 왕건이 신라를 도우려 군대를 보내는 등 고려가 신라에 우호적으로 대했기 때문에, 신라는 싸움 없이 고려에 들어왔어요. 사심관은 호족이나 공신에게 자기 출신 지역을 맡아 다스리게 한 제도로, 경순왕이 첫 사심관이었어요. 이듬해(936) 고려는 후백제를 무너뜨려 후삼국을 통일했어요."

- id: hunyo
  n: 태조, 훈요 10조 남김
  d: 943
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 78
  t: 태조 왕건이 후대 왕들에게 불교 장려, 서경 중시, 연등회·팔관회 개최, 거란 풍속 배척 등을 당부한 훈요 10조를 남겼어요.
  x: "훈요 10조에는 도선의 풍수 사상에 따라 정한 곳 외에는 함부로 절을 짓지 말 것, 중국 풍습을 억지로 따르지 말 것, 관리의 녹봉을 함부로 바꾸지 말고 농민의 부담을 가볍게 할 것 같은 당부도 담겼어요. 불교를 앞세우되 유교·도교·풍수지리설도 함께 아울렀고, 중국 문화는 무조건 따르기보다 고려에 맞게 가려 받아들이라고 했어요. 그래서 태조의 북진 정책과 민생 안정 정책을 함께 보여 주는 자료로 쓰여요."

- id: gwangjong-title
  n: 광종, 독자 연호 사용
  d: 950
  c: 정치
  i: 1
  at: [126.55, 37.97]
  p: 개경
  pg: 79
  t: 광종이 '광덕', '준풍' 같은 독자적인 연호를 쓰고 개경을 황도라 부르며 왕의 위상을 높였어요.
  x: "태조가 세상을 떠난 뒤 혜종과 정종 때는 왕비를 낸 호족 집안들이 저마다 자기 쪽 왕자를 왕으로 세우려 다퉈 왕의 자리가 몹시 흔들렸어요. 이런 가운데 즉위한 광종은 스스로 황제라 칭했고, 960년부터는 ‘준풍’이라는 연호를 쓰며 서경을 ‘서도’라 불렀어요. 독자 연호는 중국과 대등하다는 뜻을 담은 것이에요. 충북 청주의 용두사지 철당간에 이 ‘준풍’ 연호가 새겨져 있어요."

- id: nobi-angeom
  n: 노비안검법 실시
  d: 956
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 79
  t: 광종이 억울하게 노비가 된 사람을 다시 양인으로 풀어 주었어요. 호족의 힘을 약하게 하고 나라의 세금과 군역을 늘렸어요.
  x: "후삼국이 싸우는 동안 포로로 잡히거나 지방 세력에게 강제로 노비가 된 사람이 많았는데, 광종은 이들을 조사해 원래 신분을 되찾게 했어요. 노비는 호족과 공신의 중요한 재산이었기 때문에 반발이 컸고, 『고려사』에는 이 무렵 주인을 등지는 노비가 많아지고 윗사람을 업신여기는 풍조가 퍼졌다는 기록도 있어요. 광종은 이어 과거제를 도입했고, 개혁에 맞서는 공신과 호족은 가차 없이 숙청해 왕이 중심이 되는 정치를 굳혔어요."

- id: gwageo
  n: 과거제 실시
  d: 958
  c: 정치
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 79
  t: 광종이 후주에서 온 쌍기의 건의로 과거 시험을 실시해 실력 있는 관리를 뽑았어요.
  x: "쌍기는 956년 후주의 사신을 따라왔다가 병이 나서 고려에 머물렀는데, 광종의 눈에 들어 벼슬을 받고 과거제를 건의했어요. 958년 첫 과거에서는 쌍기가 시험관을 맡아 시·부·송·책을 시험해 진사를 뽑고, 유교 경전·의학·점복에 밝은 사람도 뽑았어요. 이후 고려의 과거는 글짓기 실력을 보는 제술과와 경전 이해를 보는 명경과, 기술관을 뽑는 잡과, 승려를 위한 승과로 운영됐지만, 무과는 거의 치르지 않았어요."

- id: jeonsigwa
  n: 전시과 실시
  d: 976
  c: 경제
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 81
  t: "관리에게 등급에 따라 곡물을 거두는 땅(전지)과 땔감을 얻는 땅(시지)에서 세금을 거둘 권리(수조권)를 주는 전시과를 처음 실시했어요."
  x: "전시과로 받은 것은 땅 자체가 아니라 세금을 거둘 권리였기 때문에, 관리가 죽으면 나라에 돌려줘야 했어요. 다만 5품 이상 관리는 자손에게 물려줄 수 있는 공음전을 따로 받았고, 일한 대가로 쌀·베 같은 녹봉도 받았어요. 976년(경종 1) 처음 만들 때는 관직의 높낮이와 함께 인품도 따졌고, 교과서가 말하는 18등급(18과)은 목종 때(998) 관직만을 기준으로 정리된 것이에요. 문종 때(1076) 한 번 더 고쳐졌어요."

- id: choe-seungno
  n: 최승로, 시무 28조 건의
  d: 982
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 79
  t: 최승로가 성종에게 유교 이념으로 나라를 다스리자는 시무 28조를 올렸어요. 성종은 이를 받아들여 통치 체제를 정비했어요.
  x: "최승로는 경주 출신으로, 신라 6두품이었던 아버지와 함께 935년 경순왕이 고려에 항복할 때 고려로 왔어요. 시무 28조에는 지방에 수령을 보낼 것(제7조), 연등회·팔관회를 줄여 백성의 부담을 덜 것(제13조), 불교는 자신을 닦는 근본이고 유교는 나라를 다스리는 근원이라는 것(제20조) 등이 담겼어요. 성종은 이 건의에 따라 12목에 지방관을 보냈고, 당과 송의 제도를 본떠 중앙 관청을 짜는 한편, 비용이 많이 드는 불교·토속 신앙 행사는 줄였어요."

- id: twelve-mok
  n: 성종, 12목에 지방관 파견
  d: 983
  c: 정치
  i: 3
  at: [126.55, 37.97]
  ap: 1
  p: 개경
  pg: 80
  t: 지방의 주요 지역 12곳에 목을 두고 처음으로 지방관을 보냈어요. 현종 때 8목으로 바뀌었어요.
  x: "건국 뒤에도 한동안 지방은 그 지역 호족이 사실상 다스렸어요. 성종은 최승로가 시무 28조에서 수령을 보내자고 한 건의를 받아들여, 인구가 많고 산물이 넉넉한 거점부터 목을 두었어요. 이것이 고려 지방 제도의 출발점이 되어 뒤에 5도·양계·경기 체제로 이어졌는데, 지방관이 없는 속현이 주현보다 많아 실제 행정은 각 고을의 향리가 맡았어요."

- id: gangjo-coup
  n: 강조의 정변
  d: 1009
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 87
  t: 강조가 목종을 몰아내고 현종을 왕으로 세웠어요. 거란은 이를 구실로 2차 침입을 했어요.
  x: "목종 때 왕의 어머니 천추태후가 김치양에게 권력을 맡기고, 둘 사이에서 난 아들을 왕위에 올리려 했어요. 목종은 대량원군(뒤의 현종)을 불러오면서 서북면을 지키던 강조에게 개경으로 와 호위하라고 했는데, 군사를 이끌고 온 강조는 김치양 일당을 처형하고 목종까지 몰아낸 뒤 살해했어요. 거란은 임금을 죽인 죄를 묻는다며 1010년 쳐들어왔고, 강조는 통주에서 싸우다 포로가 되어 끝내 항복하지 않고 죽었어요."

- id: chojo-daejanggyeong
  n: 초조대장경 조판 시작
  d: 1011
  c: 문화
  i: 1
  at: [126.55, 37.97]
  ap: 1
  p: 개경
  pg: 89
  t: 거란의 침입을 부처의 힘으로 물리치려는 바람을 담아 대장경을 새기기 시작했어요. 대구 부인사에 보관하던 판목은 몽골 침입 때 불탔어요.
  x: "대장경은 불교 경전을 모두 모아 엮은 것이고, 초조대장경은 우리나라에서 처음 만든 대장경이에요. 거란의 2차 침입으로 개경이 함락된 어려운 때에 새기기 시작해 오랜 기간 만들었는데, 송의 영향과 거란에서 들여온 대장경의 도움을 받았어요. 판목은 1232년 몽골의 침입 때 불탔지만 찍어 낸 책 일부는 지금도 남아 있고, 그 뒤 최우가 다시 새기게 한 것이 팔만대장경이에요."

- id: naseong
  n: 개경 나성 완성
  d: 1029
  c: 전쟁
  i: 1
  at: [126.55, 37.97]
  p: 개경
  pg: 87
  t: 거란의 침입을 겪은 뒤 개경 둘레에 나성(바깥 성)을 쌓았어요.
  x: "거란의 2차 침입(1010) 때 개경이 함락되어 궁궐이 불타고 이전 왕들의 기록까지 사라지는 큰 피해를 입었어요. 3차 침입을 귀주 대첩(1019)으로 막아 낸 고려는 도읍의 방어를 튼튼히 하려고 개경 둘레에 성을 한 겹 더 쌓았는데, 이것이 나성이에요. 나성을 다 쌓은 뒤에는 북쪽 국경을 따라 천리장성 공사도 시작했어요(1033)."

- id: cheolli-goryeo
  n: 고려, 천리장성 축조
  d: 1033
  e: 1044
  c: 전쟁
  i: 2
  at: [126.4, 40.0]
  ap: 1
  p: 압록강 하구~동해안 도련포
  pg: 87
  t: 거란과 여진의 침입에 대비해 압록강 하구에서 동해안 도련포까지 국경을 따라 천리장성을 쌓았어요.
  note: '완성 해는 1044년(정종 10)으로 흔히 쓰지만, 한국민족문화대백과사전(E0055848)은 1033~1041년 세 차례 축성으로 적어요. 두 교과서에는 연도가 없어요.'
  x: "고려의 천리장성은 덕종 때인 1033년 유소가 명을 받아 쌓기 시작해 정종 때 완성됐어요. 동북쪽의 여진과 서북쪽의 거란을 함께 막으려는 것이었고, 뒤에 윤관이 여진을 몰아내고 쌓은 동북 9성은 이 천리장성 너머에 있었어요. 고구려가 당의 침략에 대비해 요동에 쌓은 천리장성과는 다른 성이니 헷갈리지 마세요."

- id: arab-merchants
  n: 아라비아 상인, 고려에 옴
  d: 1040
  dt: 11세기 (1040년 등)
  c: 외교
  i: 1
  at: [126.48, 37.90]
  ap: 1
  p: 벽란도 (예성강 하구)
  pg: 89
  t: 대식국(아라비아) 상인들이 벽란도에 와서 수은·향료를 팔고 금·비단을 사 갔어요. 이들을 통해 고려(코리아)가 서방 세계에 알려졌어요.
  x: "『고려사』에는 정종 6년(1040) 11월 대식국 상인 보나합 등이 와서 수은·점성향(베트남에서 나는 향신료)·몰약(방부제)을 바치자, 왕이 객관에서 후하게 대접하고 돌아갈 때 금과 비단을 내렸다는 기록이 있어요. 이들은 개경 가까운 예성강 입구의 국제 무역항 벽란도로 들어왔어요. 서양 기록에 우리나라가 처음 나온 것은 13세기 중반 몽골을 찾은 프랑스인 뤼브룩이 ‘Caule’라는 나라를 적은 것으로, 이 이름이 Corea, Korea 등으로 바뀌었어요."

- id: cheontae
  n: 의천, 천태종 개창
  d: 1097
  c: 문화
  i: 1
  at: [126.55, 37.97]
  ap: 1
  p: 개경 국청사
  pg: 103
  t: 문종의 아들인 의천이 송에서 돌아와 교종과 선종의 통합을 내세우며 천태종을 열었어요.
  x: "의천은 열한 살에 승려가 되었고, 송에 건너가 여러 종파의 고승을 만나며 불교 이론을 폭넓게 익혔어요. 그는 경전을 읽는 공부와 마음을 닦는 수행을 함께 해야 한다며, 먼저 화엄종을 중심으로 교종을 묶고 천태종을 통해 선종까지 끌어안으려 했어요. 하지만 의천이 죽은 뒤 교단은 다시 갈라졌고, 무신 집권기에는 지눌이 반대로 선종의 입장에서 교종을 포용하는 운동을 펼쳤어요."

- id: byeolmuban
  n: 윤관, 별무반 편성
  d: 1104
  c: 전쟁
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 88
  t: 여진 기병에게 패한 뒤 윤관의 건의로 기병(신기군), 보병(신보군), 승병(항마군)으로 이루어진 별무반을 만들었어요.
  x: "고려는 오랫동안 동북쪽 여진 추장들에게 벼슬을 내려 달래 왔어요. 그런데 12세기 초 완옌부가 여진 부족들을 하나로 묶으며 국경을 넘보았고, 말을 잘 타는 여진군에게 고려군은 번번이 밀렸어요. 별무반을 키운 윤관은 예종 때(1107) 여진을 쳐서 동북 지방에 9성을 쌓았지만, 여진이 땅을 돌려 달라며 끈질기게 공격하고 지키기도 벅차 고려는 1년여 만에 9성을 돌려주었어요."

- id: jin-sadae
  n: 금의 사대 요구 수용
  d: 1126
  c: 외교
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 88
  t: 여진이 세운 금이 요를 멸망시키고 고려에 신하의 예를 요구하자, 이자겸 등 집권 세력이 전쟁을 피하려 이를 받아들였어요.
  x: "9성을 되찾은 뒤 더 강해진 여진은 1115년 금을 세웠고, 1117년에는 고려에 형제 관계를 맺자는 글을 보냈어요. 1126년 금이 신하의 나라가 되라고 하자 많은 신하가 반대했지만, 권력을 쥔 이자겸과 척준경이 섬기지 않을 수 없다며 받아들였어요. 전쟁은 피했지만, 한때 고려에 토산물을 바치던 여진을 거꾸로 섬기게 된 데 대한 반발은 뒤에 묘청이 금 정벌을 내세우는 배경이 됐어요."

- id: lee-jagyeom
  n: 이자겸의 난
  d: '1126-02'
  c: 정치
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 82
  t: 왕의 외척으로 권력을 휘두르던 이자겸이 자신을 제거하려던 인종에 맞서 난을 일으켰어요. 궁궐이 불탔고, 인종은 척준경을 움직여 이자겸을 몰아냈어요.
  x: "경원 이씨 가문은 문종 때부터 여러 대에 걸쳐 딸을 왕비로 들이며 대표적인 문벌로 자랐고, 이자겸은 딸을 예종에게, 또 다른 두 딸을 인종에게 시집보냈어요. 이런 문벌 가문은 과거나 음서로 대대로 높은 벼슬을 차지하고, 왕실이나 다른 명문가와 겹겹이 혼인하며 힘을 키웠어요. 난은 진압됐지만 왕실의 위신은 크게 깎였고, 그 무렵 이자겸 세력이 금을 섬기기로 한 일까지 겹쳐 민심이 흔들렸어요."

- id: myocheong
  n: 묘청의 서경 천도 운동
  d: '1135-01'
  e: '1136-02'
  c: 정치
  i: 3
  at: [125.75, 39.02]
  p: 서경 (평양)
  pg: 83
  t: 묘청 등 서경 세력이 서경으로 도읍을 옮기고 금을 정벌하자고 주장하다 받아들여지지 않자 서경에서 난을 일으켰어요. 김부식이 이끈 관군에게 진압됐어요.
  x: "이자겸의 난으로 왕의 권위가 크게 흔들리자, 인종은 정지상·묘청 등 서경 출신 인물을 등용해 분위기를 바꾸려 했어요. 이들은 풍수지리설을 내세워 개경의 기운이 약해졌으니 명당인 서경으로 도읍을 옮기고, 왕을 황제라 부르며 독자 연호를 쓰자고 했어요. 김부식 등 개경 세력은 유교 원칙에 따른 질서와, 강해진 금을 섬겨 얻는 안정을 내세우며 이에 반대했어요. 묘청 등은 나라 이름을 ‘대위’, 연호를 ‘천개’라 하며 일어났고, 이 일 뒤 무신에 대한 차별은 더 심해졌어요."

- id: samguksagi
  n: 김부식, 『삼국사기』 편찬
  d: 1145
  c: 문화
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 105
  t: 김부식이 왕명을 받아 유교적 합리주의 입장에서 기전체로 삼국의 역사를 정리했어요. 현재 남아 있는 가장 오래된 우리 역사서예요.
  x: "인종은 이자겸의 난과 묘청의 난으로 흔들린 왕실의 권위를 다시 세우려고 김부식에게 삼국의 역사를 정리하게 했어요. 김부식은 믿기 어려운 신화·설화는 크게 덜어 냈고, 고려가 신라를 이었다는 시각으로 썼어요. 이보다 앞서 나온 『삼국사』나 『7대 실록』 같은 역사서는 지금 남아 있지 않아요. 뒤에 일연은 『삼국사기』에서 빠진 전설·야사·신화까지 모아 『삼국유사』를 지었어요."

- id: musin-coup
  n: 무신 정변
  d: '1170-08'
  c: 정치
  i: 3
  at: [126.55, 37.97]
  ap: 1
  p: 개경 근처 보현원
  pg: 83
  t: 문신에게 차별받던 정중부·이의방 등 무신들이 의종의 보현원 행차 때 문신을 죽이고 정권을 잡았어요. 의종을 쫓아내고 명종을 세웠어요.
  x: "고려의 무신은 아무리 공을 세워도 정3품 상장군보다 높이 오를 수 없었고 군대의 최고 지휘권도 문신 차지였으며, 아래 군인들은 받아야 할 땅도 제대로 못 받은 채 공사판에 동원됐어요. 김부식의 아들 김돈중이 정중부의 수염을 촛불로 태우고, 문신 한뢰가 대장군 이소응의 뺨을 때린 일은 무신들의 분노를 키웠어요. 정권을 잡은 무신들은 고위 무신 회의인 중방에서 나랏일을 결정했지만, 자기들끼리 다투느라 집권자가 자주 바뀌었어요."

- id: mangi
  n: 망이·망소이의 난
  d: 1176
  c: 사회
  i: 2
  at: [127.38, 36.35]
  ap: 1
  p: 공주 명학소 (대전 일대)
  pg: 84
  t: 특수 행정 구역인 명학소 주민들이 차별과 수탈에 맞서 봉기해 충청도 일대를 차지했어요.
  x: "향·부곡·소는 일반 군현보다 세금을 더 많이 내는 등 차별받던 특수 행정 구역이었고, 소의 주민은 광물이나 수공업 제품처럼 나라에 필요한 물품을 만들어 바쳐야 했어요. 망이·망소이는 공주를 함락했고, 정부가 명학소를 충순현으로 올려 주며 달랬지만 봉기는 계속됐어요. 이듬해(1177) 초 잠시 화해했다가 한 달 만에 다시 들고일어나자, 정부는 충순현을 명학소로 되돌리고 군대를 보내 그해 여름 진압했어요. 이 봉기는 뒤에 특수 행정 구역이 사라지는 데 영향을 준 것으로 평가받아요."

- id: kim-sami
  n: 김사미·효심의 난
  d: 1193
  c: 사회
  i: 2
  at: [128.94, 35.65]
  ap: 1
  p: 운문 (경북 청도)·초전 (울산)
  pg: 84
  t: 운문의 김사미와 초전의 효심이 일으킨 농민 봉기예요. 경상도 일대로 퍼졌다가 진압됐어요.
  x: "무신 정권 아래에서 권력자와 지방관들이 농민의 땅을 빼앗아 제 농장을 불리고 세금까지 마구 거두자 농민들의 살림은 갈수록 어려워졌어요. 한편 천민 출신인 이의민이 최고 권력자가 된 것을 보며, 백성들 사이에는 신분도 바뀔 수 있다는 생각이 퍼졌어요. 이 봉기는 경주 세력과 손잡고 중앙 정부에 맞섰다는 점이 특징이에요."

- id: choe-chungheon
  n: 최충헌 집권 (최씨 무신 정권 시작)
  d: 1196
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 83
  t: 최충헌이 이의민을 제거하고 권력을 잡았어요. 교정도감을 중심으로 정치를 하며 최씨 정권이 4대 60여 년 동안 이어졌어요.
  x: "최충헌은 사병 집단인 도방을 키워 자신을 지키게 했고, 농장을 늘려 경제력도 쌓았어요. 교정도감은 1209년에 설치되어 나라의 중요한 정책을 정하고 집행했으며, 그 우두머리 자리는 뒤 집권자들이 대를 이어 차지했어요. 권력은 최우·최항·최의로 대물림됐고, 정권이 비교적 안정되어 군사력도 갖추었지만 사회 문제를 바로잡는 데는 소홀했고 백성에게서 많은 것을 빼앗았어요."

- id: manjeok
  n: 만적의 난
  d: 1198
  c: 사회
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 84
  t: 최충헌의 사노비 만적이 노비 신분에서 벗어나려고 봉기를 꾀했지만 미리 발각돼 실패했어요.
  x: "만적은 개경 북산에서 나무를 하다 노비들을 모아, 무신 정변 이후 천한 신분에서 높은 자리에 오른 사람이 많으니 장군과 재상의 씨가 따로 있겠느냐며 들고일어나자고 했어요. 노비 문서를 불태우고 최충헌과 각자의 주인을 없애 정권을 잡으려 했지만, 약속한 날 모인 사람이 적어 미루던 사이 한 노비(순정)가 계획을 알려 만적 등 100여 명이 죽임을 당했어요. 신분에서 벗어나는 데 그치지 않고 권력까지 차지하려 했다는 점에서, 이 무렵 천민들의 생각이 크게 자랐음을 알 수 있어요."

- id: jinul
  n: 지눌, 수선사 결사 운동
  d: 1200
  dt: 12세기 말~13세기 초
  c: 문화
  i: 1
  at: [127.28, 35.00]
  ap: 1
  p: 순천 송광사 (수선사)
  pg: 103
  t: 지눌이 불교계의 타락을 비판하며 수선사를 중심으로 개혁 운동을 벌였어요. 선종을 중심으로 교종을 아우르는 선교 일치를 주장했어요.
  x: "무신 집권기 불교계가 세속화되자, 지눌은 승려가 본래 자세로 돌아가 불경 공부와 수행, 노동에 힘써야 한다며 뜻을 같이하는 승려들과 결사를 맺었어요. 팔공산 거조사에서 시작한 결사는 1200년 순천 송광산 길상사로 근거지를 옮겼고, 1205년 왕명으로 수선사라는 이름을 받았는데 지금의 송광사가 이곳이에요. 지눌은 선정과 지혜를 함께 닦는 정혜쌍수, 깨달은 뒤에도 꾸준히 닦아야 한다는 돈오점수를 내세웠어요."

- id: gangdong-1219
  n: 고려·몽골 연합군, 강동성 함락
  d: 1219
  c: 외교
  i: 2
  at: [126.10, 39.15]
  ap: 1
  p: 강동성 (평남 강동)
  pg: 93
  t: 몽골에 쫓겨 고려로 들어온 거란인을 고려와 몽골이 함께 강동성에서 물리쳤어요. 이를 계기로 두 나라가 처음 국교를 맺었어요.
  x: "몽골에 쫓긴 거란 무리는 1216년 압록강을 건너 고려에 들어와, 한때 개경 가까이까지 내려오고 철원·원주·제천 등지까지 휩쓸었어요. 이들이 강동성에서 버티자 조충·김취려가 이끄는 고려군이 몽골 장수 합진의 군대와 힘을 합쳐 1219년 강동성을 함락했어요. 이때 몽골과 ‘형제 맹약’을 맺었는데, 몽골은 이후 고려를 복속국처럼 대하며 많은 공물을 요구해 두 나라의 갈등이 커졌어요."

- id: jeogoyeo
  n: 몽골 사신 저고여 피살
  d: 1225
  c: 외교
  i: 2
  at: [124.53, 40.20]
  ap: 1
  p: 압록강 부근
  pg: 93
  t: 공물을 받아 돌아가던 몽골 사신 저고여가 국경 근처에서 죽었어요. 몽골은 이를 구실로 1231년 고려에 쳐들어왔어요.
  x: "강동성 전투 뒤 몽골은 고려를 아랫나라처럼 여기며 해마다 무거운 공물을 요구해, 두 나라 사이는 이미 나빠져 있었어요. 1231년 몽골군이 쳐들어오자 박서가 지킨 귀주성처럼 끝까지 버틴 성도 있었지만, 여러 성이 무너지자 고려는 일단 강화를 맺었어요. 몽골이 개경과 북쪽 점령지에 감독관 다루가치를 남기고 물러가자, 최우는 이듬해(1232) 도읍을 강화도로 옮겨 오랜 싸움에 대비했어요."

- id: sangjeong
  n: 『상정고금예문』 금속 활자로 인쇄
  d: 1234
  c: 문화
  i: 3
  at: [126.49, 37.75]
  ap: 1
  p: 강화도
  pg: 108
  t: "이규보의 글에 『상정고금예문』을 금속 활자로 찍었다는 기록이 있어요. 글에 연도는 없지만 교과서는 1234년으로 적어요. 책은 전하지 않아요."
  x: "금속 활자가 고려에서 먼저 나올 수 있었던 것은 대장경을 새기며 다진 목판 인쇄 경험, 신라 때부터 내려온 청동 주조 솜씨, 금속 활자에 맞는 먹과 종이를 만드는 기술이 함께 갖춰졌기 때문이에요. 1234년을 기준으로 보면 독일의 구텐베르크가 금속 활자 인쇄에 성공한 1445년경보다 약 200년 앞서요. 다만 책이 남아 있지 않아서, 지금 전하는 가장 오래된 금속 활자본은 1377년에 찍은 『직지』예요."

- id: palman
  n: 팔만대장경 조판
  d: 1236
  e: 1251
  c: 문화
  i: 3
  at: [126.49, 37.75]
  ap: 1
  p: 강화도 (대장도감)
  pg: 92
  t: 몽골의 침입을 부처의 힘으로 물리치려는 바람으로 16년 동안 8만여 장의 목판에 불경을 새겼어요. 지금은 합천 해인사에 보관돼 있어요.
  x: "거란 때 새긴 초조대장경 판목이 몽골군에 불타 버리자, 실권자 최우가 강화도에 대장도감을 두고 다시 새기게 했어요. 경판은 모두 81,258판, 무게 약 280톤에 이르고, 5천만 자가 넘는 글자가 한 사람이 쓴 듯 고르게 새겨져 있어요. 강화도에 두었던 경판은 조선 건국 뒤 해인사로 옮겨졌는데, 판끼리 닿지 않게 쌓아 두어 지금까지 잘 보존돼 있어요. 팔만대장경판은 유네스코 세계 기록 유산, 이를 보관한 해인사 장경판전은 세계 유산이에요."

- id: choe-fall
  n: 최씨 무신 정권 붕괴
  d: 1258
  c: 정치
  i: 2
  at: [126.49, 37.75]
  p: 강화도
  pg: 94
  t: 최의가 김준 등에게 살해되며 최씨 정권이 무너졌어요. 이후 몽골과 강화하자는 움직임이 커졌어요.
  x: "30년 가까이 이어진 전쟁으로 땅은 황폐해지고 수많은 백성이 목숨을 잃거나 포로로 끌려가자, 몽골과 화해하자는 목소리가 커졌어요. 그런데도 최씨 정권은 권력을 지키려고 끝까지 싸우자고 고집했고, 전쟁 중에도 호화롭게 지내며 무거운 세금을 거둬 백성의 원망을 샀어요. 최씨 정권이 무너진 이듬해(1259) 태자(뒤의 원종)가 쿠빌라이를 만나 강화를 맺었어요. 다만 무신 정권 자체는 김준·임연·임유무로 1270년까지 이어졌으니, 최씨 정권의 끝과 무신 정권의 끝을 헷갈리지 마세요."

- id: ssangseong
  n: 몽골, 쌍성총관부 설치
  d: 1258
  c: 정치
  i: 2
  at: [127.25, 39.55]
  ap: 1
  p: 화주 (함남 영흥)
  pg: 95
  t: 몽골이 철령 이북 땅을 빼앗아 화주에 쌍성총관부를 두고 직접 다스렸어요. 1356년 공민왕이 되찾았어요.
  x: "몽골과 전쟁 중이던 1258년, 동북 지방의 조휘와 탁청이 고려 지방관을 죽이고 몽골에 항복하자 몽골이 이곳에 쌍성총관부를 두었어요. 조휘가 총관, 탁청이 천호가 되었고 이 자리는 그 집안 사람들이 대대로 이어받았어요. 원은 서경에 동녕부, 제주에 탐라총관부도 두었는데, 이 둘은 충렬왕 때 돌려받았지만 쌍성총관부는 공민왕이 군대를 보낼 때까지 남아 있었어요."

- id: gaegyeong-return
  n: 개경 환도
  d: '1270-05'
  c: 정치
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 94
  t: 무신 정권이 무너지자 원종이 강화도에서 개경으로 돌아왔어요. 이에 반대한 삼별초가 항쟁을 시작했어요.
  x: "강화 뒤 몽골은 고려 조정이 강화도에서 나와 개경으로 돌아올 것과 일본 정벌에 쓸 사람·물자를 대라고 압박했어요. 마지막 무신 집권자 임유무가 개경 환도를 거부하며 버텼지만 내부에서 제거되면서, 1170년부터 100년 가까이 이어진 무신 정권도 막을 내렸어요. 삼별초는 최우가 만든 야별초(좌별초·우별초)와 몽골에 잡혀갔다 탈출한 군사로 만든 신의군을 합친 부대로, 진도 용장성과 제주 항파두리를 근거지로 싸우다 1273년 고려·몽골 연합군에 진압됐어요."

- id: dongnyeong
  n: 원, 동녕부 설치
  d: 1270
  c: 정치
  i: 1
  at: [125.75, 39.02]
  p: 서경 (평양)
  pg: 95
  t: 원이 서경에 동녕부를 두고 자비령 이북을 직접 다스렸어요. 충렬왕 때(1290) 돌려받았어요.
  x: "1269년 서북면의 최탄 등이 무신 집권자 임연을 치겠다는 구실로 반란을 일으켜, 서경을 비롯한 북계의 여러 성을 들고 몽골에 항복했어요. 원은 이듬해 서경에 동녕부를 두고 최탄을 총관으로 삼았어요. 동녕부가 있는 동안에는 개경과 평양 사이의 고개인 자비령이 고려와 원의 경계 노릇을 했어요."

- id: tamna
  n: 원, 탐라총관부 설치
  d: 1273
  dt: "1273년 무렵"
  c: 정치
  i: 1
  at: [126.52, 33.51]
  p: 제주
  pg: 95
  t: "삼별초를 진압한 원이 제주에 탐라국초토사를 두었다가 곧 탐라총관부로 바꿔 직접 다스리며 목장을 만들어 말을 길렀어요. 충렬왕 때 돌려받았어요."
  x: "제주는 삼별초가 마지막까지 싸운 곳으로, 1273년 삼별초가 진압된 뒤 원이 직접 다스리는 땅이 되었어요. 원은 일본 원정을 준비하며 이곳에 목마장을 두고 말을 길렀는데, 1294년 쿠빌라이가 죽은 뒤 일본 원정 계획이 사라지자 충렬왕의 요청을 받아들여 제주를 돌려주었어요. 그 뒤에도 원은 목마장 관리를 구실로 다시 관청을 두는 등, 공민왕의 반원 개혁 때까지 제주에 손을 뻗쳤어요."

- id: jeongdong
  n: 정동행성 설치
  d: 1280
  c: 정치
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 95
  t: 원이 일본 원정을 위해 둔 기구예요. 원정이 끝난 뒤에도 남아 고려의 내정을 간섭하는 통로가 됐어요.
  x: "‘행성’은 원이 직접 다스리는 지역이나 큰 군사 작전을 위해 둔 기구예요. 고려는 일본 원정에 함선과 물자, 병사를 대야 했고, 고려 국왕이 정동행성의 승상을 겸했어요. 원정을 포기한 뒤에는 일상 행정을 맡는 기구로 남았는데, 그 안의 사법 기구인 이문소가 친원 세력의 불법을 감싸고 반대파를 누르는 권력 기관이 되었어요. 그래서 공민왕은 반원 개혁 때 친원 세력을 없애면서 이문소를 폐지했어요."

- id: samgukyusa
  n: 일연, 『삼국유사』 편찬
  d: 1281
  dt: 1281년경 (충렬왕 때)
  c: 문화
  i: 2
  at: [128.60, 36.20]
  ap: 1
  p: 군위 인각사
  pg: 105
  t: 승려 일연이 불교사를 중심으로 민간 설화와 향가를 모아 정리했어요. 단군의 건국 이야기를 처음으로 실었어요.
  x: "몽골과의 긴 전쟁 동안 수많은 절과 옛 기록이 잿더미가 되는 것을 본 일연은, 사라져 가는 우리 문화와 불교 이야기를 기록으로 남기고자 했어요. 나라에서 펴낸 『삼국사기』가 신비한 내용을 줄였다면, 일연은 개인의 힘으로 『삼국사기』에서 빠진 전설·야사·신화까지 모았어요. 그는 나라를 세우는 왕은 하늘의 명을 받으므로 삼국 시조가 신비롭게 태어난 것은 괴이하지 않다고 보았어요. 몽골 침입과 원 간섭기를 거치며 커진 자주 의식을 담은 책이에요."

- id: jewang-ungi
  n: 이승휴, 『제왕운기』 편찬
  d: 1287
  c: 문화
  i: 2
  at: [129.10, 37.43]
  ap: 1
  p: 삼척 두타산
  pg: 105
  t: 우리 역사를 중국 역사와 나란히 시로 정리하며 단군 조선을 우리 역사의 시작으로 보았어요.
  x: "『제왕운기』는 두 권으로, 상권에는 중국의 역사를, 하권에는 단군 조선부터 삼국과 후삼국, 발해를 거쳐 고려까지 우리 역사를 읊었어요. 특히 발해를 고구려를 이은 나라로 보아 우리 역사에 처음으로 넣었다는 점이 중요해요. 미래엔 교과서는 요동에 중국과 구분되는 또 하나의 천하가 있다는 구절을 실어, 우리 역사를 중국과 대등하게 본 자주 의식을 보여 줘요."

- id: anhyang
  n: 안향, 성리학 소개
  d: 1290
  dt: 13세기 말 (충렬왕 때)
  c: 문화
  i: 1
  at: [126.55, 37.97]
  ap: 1
  p: 개경
  pg: 104
  t: 원에 다녀온 안향이 성리학을 소개했어요. 성리학은 이후 신진 사대부의 정치 이념이 됐어요.
  x: "성리학은 남송의 주희가 정리한 새로운 유학으로, 사람의 마음과 본성을 우주의 이치와 이어서 설명해요. 무신 집권기에 침체했던 고려의 유학은 원을 통해 성리학이 들어오면서 활기를 되찾았어요. 성리학을 익힌 신진 사대부는 이를 사회를 바꿀 개혁 사상으로 삼아 불교계의 폐단을 비판했고, 그중에는 불교 교리 자체를 부정하는 사람도 있었어요."

- id: sinan-ship
  n: 신안선 침몰
  d: 1323
  c: 경제
  i: 1
  at: [126.08, 35.03]
  ap: 1
  p: 전남 신안 앞바다
  pg: 91
  t: 원의 경원(닝보)에서 일본으로 가던 무역선이 신안 앞바다에 가라앉았어요. 1975년 발견되어 도자기 2만여 점이 건져졌어요.
  x: "고기잡이 그물에 도자기 몇 점이 걸려 나온 일이 바닷속 발굴의 시작이었어요. 배에서 나온 목간(나무 꼬리표)에는 원의 연호 ‘지치 3년(1323)’과 일본 하카타의 신사, 교토의 사찰 이름이 적혀 있어 원에서 일본으로 가던 무역선으로 추정해요. 길이 34m의 큰 배에서 약 28톤(약 800만 개)의 동전, 고려청자, 향신료, 일본 나막신 등도 나왔어요. 미래엔 교과서는 고려를 거쳐 가려 했다는 설과 일본으로 곧장 가려 했다는 설이 있다고 소개해요."

- id: gyeongcheonsa
  n: 경천사지 10층 석탑 건립
  d: 1348
  c: 문화
  i: 3
  at: [126.60, 37.90]
  ap: 1
  p: 개풍 경천사 터 (지금은 국립 중앙 박물관)
  pg: 106
  t: "원의 영향을 받은 대리석 석탑이에요. 국권 피탈 전에 일본으로 몰래 실려 갔다가 돌려받았고, 지금은 국립 중앙 박물관에 있어요."
  x: "경천사지 10층 석탑은 1348년(충목왕 4) 회색 대리석으로 세운 높이 약 13.5m의 탑이에요. 평면이 사방으로 튀어나온 모양이고 꼭대기 부분에 원의 라마탑 수법이 보여, 원의 영향을 받은 특수한 석탑으로 분류돼요. 고려 전기에 유행한 평창 월정사 8각 9층 석탑 같은 다각 다층탑과 비교해 보면 차이가 잘 보여요. 이 탑은 뒤에 조선 원각사지 10층 석탑의 본보기가 됐다고 평가받아요."

- id: gongmin-reform
  n: 공민왕의 반원 개혁
  d: '1356-05'
  c: 정치
  i: 2
  at: [126.55, 37.97]
  p: 개경
  pg: 97
  t: 원이 약해지자 공민왕이 기철 등 친원 세력을 없애고 정동행성 이문소를 폐지했어요. 몽골식 변발과 원의 연호도 쓰지 않게 했어요.
  x: "14세기 중엽 중국 곳곳에서 농민 반란이 일어나 원의 힘이 크게 꺾이자, 공민왕은 이 기회에 원의 간섭을 떨쳐 내려 했어요. 기철은 원 황실과 혼인 관계를 맺은 집안 덕분에 왕을 누를 만큼 권세를 누린 대표적인 친원 세력이었어요. 공민왕은 낮춰졌던 왕실 호칭과 관청 제도를 되살리고 쌍성총관부를 공격해 동북쪽 땅을 되찾았으며, 미래엔 교과서에 따르면 정방을 없애 인사권도 되찾았어요."

- id: ssangseong-recover
  n: 쌍성총관부 수복
  d: '1356-07'
  c: 전쟁
  i: 3
  at: [127.25, 39.55]
  ap: 1
  p: 화주 (함남 영흥)
  pg: 97
  t: "공민왕이 군대를 보내 쌍성총관부를 무너뜨리고 철령 이북 땅을 되찾았어요. 이때 이 지역의 토착 세력인 이자춘(이성계의 아버지)이 고려군에 내응했어요."
  x: "공민왕은 유인우를 동북면병마사로 삼아 쌍성총관부를 치게 했는데, 총관 조소생은 맞섰지만 조휘의 손자 조돈 등이 고려군에 호응하자 달아났어요. 이로써 1258년부터 원이 다스리던 땅을 되찾고 북쪽으로 영토를 더 넓혔어요. 뒷날 명이 이 땅을 원의 옛 영토라며 자기가 차지하겠다고 나서자, 우왕과 최영은 요동 정벌로 맞섰고 이것이 위화도 회군으로 이어졌어요."

- id: jeonmin
  n: 전민변정도감 설치
  d: 1366
  c: 경제
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 97
  t: 공민왕이 신돈을 등용해 권문세족이 불법으로 빼앗은 토지를 원래 주인에게 돌려주고 억울하게 노비가 된 사람을 풀어 주었어요.
  x: "원 간섭기의 권문세족은 남의 땅과 노비를 가로채 거대한 농장을 꾸렸고, 일손이 모자라면 가난한 백성을 데려다 숨기거나 노비로 삼았어요. 세금 낼 사람이 줄어드니 나라 곳간은 비어 갔고, 충선왕·충목왕이 이를 고치려 했지만 권문세족의 방해로 뜻을 이루지 못했어요. 전민변정도감은 스스로 잘못을 고치면 죄를 묻지 않지만 기한을 넘기면 조사해 처벌하겠다고 알렸어요. 공민왕은 성균관도 다시 손봐 개혁에 힘을 보탤 젊은 유학자를 키웠어요."

- id: gongmin-death
  n: 공민왕 시해
  d: 1374
  c: 정치
  i: 1
  at: [126.55, 37.97]
  p: 개경
  pg: 97
  t: 권문세족의 반발로 개혁이 멈추고 신돈이 제거된 뒤, 공민왕도 시해됐어요.
  x: "비상 교과서에 따르면 신돈을 제거한 것은 공민왕 자신이었어요. 개혁은 끝까지 이어지지 못했지만, 고려가 자주성을 되찾고 신진 사대부 같은 새 정치 세력이 자랄 바탕을 남겼어요. 공민왕이 죽은 뒤 신진 사대부의 활동은 위축됐고, 우왕 즉위 초(1374) 권문세족이 명을 멀리하고 원과의 관계를 되살리려 하자 정몽주는 정도전 등과 함께 반대하다 유배를 당했어요."

- id: hwatong
  n: 화통도감 설치
  d: 1377
  c: 전쟁
  i: 1
  at: [126.55, 37.97]
  p: 개경
  pg: 98
  t: 최무선의 건의로 화약과 화포를 만드는 화통도감을 두었어요. 1380년 진포에서 화포로 왜선을 불태웠어요.
  x: "고려 말 왜구가 해안을 휩쓸자 최무선은 화약이 왜구를 막는 데 효과적이라고 보고, 원의 염초(화약 원료) 기술자에게서 만드는 법을 배운 뒤 조정에 건의했어요. 화통도감에서는 20가지에 가까운 화기를 만들고, 이를 다루는 군사도 따로 길렀어요. 진포 대첩 때는 나세와 최무선이 함께 왜구를 물리쳤어요. 화통도감은 1388년 폐지되고, 하던 일은 무기를 맡은 관청인 군기시로 넘어갔어요."

- id: jikji
  n: 『직지심체요절』 인쇄
  d: 1377
  c: 문화
  i: 2
  at: [127.47, 36.64]
  p: 청주 흥덕사
  pg: 108
  t: 청주 흥덕사에서 금속 활자로 찍은 책이에요. 현재 남아 있는 가장 오래된 금속 활자본으로, 프랑스 국립 도서관에 있어요.
  x: "원래 이름은 『백운화상초록불조직지심체요절』로, 백운화상이라는 승려가 1372년 여러 불교 경전의 가르침과 고승들의 말을 가려 모은 것을 그의 제자들이 금속 활자로 찍었어요. 책마다 판을 새로 새겨야 하는 목판과 달리, 금속 활자는 한 번 부어 만든 글자를 다시 짜 맞춰 여러 책을 찍을 수 있어 편리했어요. 『직지』는 유네스코 세계 기록 유산으로도 등재됐어요."

- id: gwajeon
  n: 과전법 실시
  d: '1391-05'
  c: 경제
  i: 3
  at: [126.55, 37.97]
  p: 개경
  pg: 115
  t: 이성계와 급진파 사대부가 권문세족의 토지를 몰수하고 관리에게 경기 지역 땅의 조세를 걷는 권리를 나눠 주는 과전법을 실시했어요.
  x: "위화도 회군 뒤 개혁의 첫 과녁은 권문세족이 차지한 땅이었어요. 과전법이 시행되자 권문세족은 경제적 기반을 잃은 반면, 나라는 세금 거둘 땅을 되찾고 개혁파 관리들은 생활 기반을 얻었어요. 고려의 전시과처럼 땅 자체가 아니라 세금 걷을 권리를 준 것이지만, 그 땅을 경기 안으로 묶어 둔 점이 달라요. 이듬해 조선이 세워졌고, 과전이 부족해지자 세조 때(1466) 현직 관리에게만 수조권을 주는 직전법으로 바뀌었어요."

- id: jeong-mongju
  n: 정몽주 피살
  d: '1392-04-04'
  c: 정치
  i: 2
  at: [126.56, 37.97]
  ap: 1
  p: 개경 (선죽교로 전해짐)
  pg: 99
  t: 고려를 지키려던 온건파 사대부 정몽주가 이방원 세력에게 살해됐어요. 『고려사』에는 길에서 살해됐다고만 나와요.
  x: "위화도 회군 뒤 신진 사대부는 개혁 방법을 두고 갈라졌어요. 이색·정몽주 등 온건파는 고려 왕조를 지키면서 옛 제도를 되살리는 길을, 정도전·조준 등 급진파는 아예 새 왕조를 여는 길을 택했어요. 정몽주는 장원 급제 뒤 성균관에서 성리학을 가르쳤고, 일본에 가서 왜구를 막는 데 협조하겠다는 약속을 받아 내고 명에 가서 공물을 줄이는 등 외교에서도 활약했어요. 그가 제거된 뒤 같은 해 공양왕이 이성계에게 왕위를 넘기며 고려가 멸망했어요."

# ───── R1 검수에서 더한 사건 (두 교과서 대조) ─────

- id: gukjagam
  n: "국자감 설치"
  d: 992
  dt: "992년 (교과서: 성종 때)"
  c: "문화"
  i: 2
  at: [126.55, 37.97]
  p: "개경"
  pg: 81
  t: "성종이 개경에 최고 교육 기관인 국자감을 세우고, 지방의 주요 지역에는 향교를 두어 유학을 가르쳤어요."
  x: "태조 때 이미 개경과 서경에 학교가 있었지만, 나라의 교육 제도가 제대로 짜인 것은 유교를 다스림의 바탕으로 삼은 성종 때예요. 국자감의 이름은 뒤에 국학으로, 고려 후기에는 성균관으로 바뀌었어요. 최충의 9재 학당 같은 사학에 학생이 몰리자 정부는 국자감에 전문 강좌(7재)를 열고 장학 재단(양현고)을 세워 관학을 되살리려 했고, 공민왕 때는 성균관을 새로 다듬어 개혁을 이끌 유학자를 길러 냈어요."

- id: choechung-9jae
  n: "최충, 9재 학당 설립"
  d: 1055
  dt: "11세기 중반"
  c: "문화"
  i: 1
  at: [126.55, 37.97]
  ap: 1
  p: "개경"
  pg: 104
  t: "벼슬에서 물러난 최충이 9재 학당을 세워 인재를 길렀어요. 이후 개경에 사학 12도가 생겨 사학이 크게 번성했어요."
  x: "최충의 학당은 그의 시호를 따 ‘문헌공도’라고도 불렸어요. 9개의 전문 과정으로 나누어 학생의 수준에 맞게 가르쳤고, 여름에는 절을 빌려 공부하며 초에 금을 그어 놓고 그 금까지 타기 전에 시를 짓는 경쟁도 했어요. 이곳 출신 과거 급제자가 많아 인기가 높았어요. 나라가 안정되면서 관리에게 경전 지식보다 글 짓는 솜씨가 더 요구되자, 과거 대비에 강한 사학으로 학생이 몰리고 국자감 같은 관학은 기울었어요."

- id: seogeung
  n: "송 사신 서긍의 고려 방문"
  d: 1123
  dt: "1123년 (교과서: 12세기 초)"
  c: "외교"
  i: 1
  at: [126.55, 37.97]
  p: "개경"
  pg: 89
  t: "송의 사절단으로 고려에 온 서긍이 고려의 모습을 기록해 『선화봉사고려도경』을 남겼어요. 고려 왕실, 개경의 모습, 고려청자 등이 담겨 있어요."
  x: "서긍은 송을 떠나 다시 돌아가기까지 석 달 동안 보고 들은 고려의 모습을 꼼꼼히 정리해 황제에게 올렸어요. 고려 사람들이 깨끗한 것을 좋아해 여름에는 하루에 두 번씩 목욕한다는 이야기, 선비를 귀하게 여겨 글을 모르는 것을 부끄러워한다는 이야기, 중국의 차를 즐겨 마신다는 이야기 등이 실려 있어요. 고려 사람들이 청자의 푸른 빛깔을 ‘비색’이라 부른다는 기록도 있어요. 책 이름의 ‘도경’은 그림을 곁들인 책이라는 뜻이지만, 그림은 사라지고 지금은 글만 남아 있어요."

- id: jeonju-gwanno
  n: "전주 관노의 난"
  d: 1182
  c: "사회"
  i: 1
  at: [127.15, 35.82]
  p: "전주"
  pg: 84
  t: "무신 집권기에 전주의 관노비들이 지방관의 수탈에 맞서 봉기해 전주를 한때 차지했어요."
  x: "관노는 관청에 딸린 공노비로, 개인 집에 딸린 사노비였던 만적과는 처지가 달랐어요. 무신 집권기에는 신분 질서가 크게 흔들리고 천민 출신 집권자까지 나오면서, 농민뿐 아니라 천민도 각지에서 봉기했어요. 전주 관노의 봉기는 그 가운데 천민이 일으킨 대표적인 봉기로 꼽혀요."

- id: dongmyeongwang
  n: "이규보, 「동명왕편」 저술"
  d: 1193
  c: "문화"
  i: 1
  at: [126.55, 37.97]
  ap: 1
  p: "개경"
  pg: 105
  t: "무신 집권기에 이규보가 고구려를 세운 동명왕의 이야기를 시로 지어 고구려를 잇는다는 의식을 드러냈어요."
  x: "「동명왕편」은 고구려를 세운 동명왕의 업적을 기린 영웅 서사시예요. 『삼국사기』가 옛 기록의 신비한 내용을 줄였던 것과 달리, 이규보는 고대의 신비로운 기록을 존중했어요. 이규보는 과거의 예비 시험인 국자감시에 세 번 떨어진 끝에 급제했고, 뒤에 최우가 서방을 두어 문인을 쓸 때 등용된 대표적인 문신이에요. 『상정고금예문』을 금속 활자로 찍었다는 기록도 그의 글에 남아 있어요."

- id: gyeongju-revival
  n: "경주의 신라 부흥 봉기 (이비·패좌)"
  d: 1202
  c: "사회"
  i: 1
  at: [129.22, 35.84]
  p: "경주"
  pg: 84
  t: "무신 집권기에 경주에서 신라를 다시 일으키겠다며 봉기가 일어났어요. 서경(고구려 부흥)과 담양(백제 부흥)에서도 비슷한 봉기가 일어났어요."
  x: "경주는 신라의 옛 도읍으로, 앞서 1193년 운문·초전의 김사미·효심이 봉기했을 때도 경주 세력이 합세해 중앙에 맞섰어요. 1202년의 경주 봉기는 이비와 패좌가 이끌었어요. 무신 집권기의 삼국 부흥 봉기는 고려 왕조 자체를 부정하고 옛 나라를 다시 세우겠다고 내세웠다는 점이 특징이에요. 이 봉기는 최충헌이 권력을 잡고 있던 때 일어났어요."

- id: choe-gwangsu
  n: "서경의 고구려 부흥 봉기 (최광수)"
  d: 1217
  c: "사회"
  i: 1
  at: [125.75, 39.02]
  p: "서경 (평양)"
  pg: 84
  t: "최광수가 서경에서 고구려를 다시 일으키겠다며 봉기했어요."
  x: "서경(평양)은 고구려의 옛 수도로, 태조 때부터 북진 정책의 전진 기지로 중시된 곳이에요. 이 봉기는 경주(신라 부흥, 1202), 담양(백제 부흥, 1237)의 봉기와 함께 무신 집권기에 고려 왕조를 부정하며 일어난 삼국 부흥 봉기의 하나예요. 이 무렵(1216~1219) 고려 북쪽에는 몽골에 쫓긴 거란 무리가 쳐들어와 있었어요."

- id: jeongbang
  n: "최우, 정방 설치"
  d: 1225
  c: "정치"
  i: 2
  at: [126.55, 37.97]
  p: "개경 (최우의 집)"
  pg: 83
  t: "최충헌의 뒤를 이은 최우가 자기 집에 정방을 두어 관리 인사를 마음대로 했어요. 정방은 공민왕 때 없어졌어요."
  x: "최우는 아버지 최충헌에게서 교정도감을 이어받아 나랏일을 쥐었고, 정방까지 두어 관리의 임명과 승진도 손에 넣었어요. 문인들을 모은 서방도 두어 정책에 대한 조언을 들었는데, 이규보 같은 문신이 이런 길로 발탁됐어요. 도적을 막으려고 만든 야별초는 뒤에 신의군과 합쳐 삼별초가 되어 최씨 정권의 군사적 기반이 됐어요. 그래서 교과서 그림은 최우 때부터의 지배 기구를 ‘교정도감·정방’으로 함께 적어요."

- id: i-yeonnyeon
  n: "담양의 백제 부흥 봉기 (이연년)"
  d: 1237
  c: "사회"
  i: 1
  at: [126.99, 35.32]
  p: "담양"
  pg: 84
  t: "이연년 형제가 담양에서 백제를 다시 일으키겠다며 봉기했어요."
  x: "이 봉기는 몽골의 침입이 이어지던 때에 일어났어요. 최씨 정권은 강화도로 도읍을 옮겨 항전했지만, 전쟁 중에도 사치하며 세금을 지나치게 거두어 백성의 원성을 샀어요. 담양은 옛 백제 땅으로, 이 봉기는 경주(신라)·서경(고구려)의 봉기와 함께 무신 집권기 삼국 부흥 봉기의 하나로 꼽혀요."

- id: mangwondang
  n: "이제현, 원의 만권당에서 활동"
  d: 1314
  c: "문화"
  i: 1
  at: [116.4, 39.9]
  p: "원의 수도 대도 (베이징)"
  t: "충선왕이 원의 수도에 세운 만권당에서 이제현이 원의 학자들과 사귀며 성리학을 깊이 공부했어요. 성리학은 신진 사대부의 사상이 됐어요."
  x: "고려로 돌아온 이제현은 충목왕 때 나라 기강을 바로 세울 개혁안을 올렸고, 공민왕 때는 최고 재상 자리에 올라 원의 간섭에서 벗어나려는 개혁을 도왔어요. 과거 시험관으로서 이색을 뽑았는데, 이색 아래에서 정몽주·정도전·권근 같은 신진 사대부가 길러졌어요. 정통과 대의명분을 앞세운 역사서 『사략』도 그가 썼어요."

- id: gongmin-accession
  n: "공민왕 즉위"
  d: 1351
  c: "정치"
  i: 3
  at: [126.55, 37.97]
  p: "개경"
  pg: 95
  t: "원에서 지내던 공민왕이 왕위에 올랐어요. 원이 약해진 틈을 타 반원 개혁을 펼쳤어요."
  x: "원 간섭기에 고려의 왕자는 어린 시절을 원의 수도에서 보내며 교육받았고, 왕은 대개 원 황실의 공주를 왕비로 맞아 황제의 사위가 됐어요. 공민왕도 원에 머물던 때 노국 대장 공주와 혼인했어요. 원이 고려 왕을 갈아 치우는 일은 여러 번 있었는데, 공민왕도 원이 조카 충정왕을 물러나게 한 뒤에야 왕위에 올랐어요. 바로 그해 중국에서 홍건적의 난이 터져 원은 큰 혼란에 빠졌어요."

- id: mun-ikjeom
  n: "문익점, 목화씨를 들여옴"
  d: 1364
  dt: "1360년대 (공민왕 때)"
  c: "경제"
  i: 1
  at: [127.87, 35.41]
  ap: 1
  p: "산청 (처음 재배한 곳)"
  t: "원에 사신으로 갔던 문익점이 목화씨를 들여와 산청에서 재배에 성공했어요. 이후 무명옷이 널리 퍼졌어요."
  x: "왕실 혼인으로 고려 왕세자와 원 공주 일행이 두 나라를 수시로 오가면서, 물건과 생활 풍습도 자연스럽게 넘나들었어요. 미래엔 교과서는 문익점이 가져온 목화와 최무선이 몽골인에게 배운 화약 기술을 원과의 교류가 고려에 준 대표적인 영향으로 들어요. 조선 후기 통신사 조엄은 일본에서 고구마를 보고 문익점이 목화를 퍼뜨렸듯이 널리 퍼뜨리면 백성에게 큰 도움이 되겠다고 적었어요."
