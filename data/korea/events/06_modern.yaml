  p: 서울~인천
  pg: 194
  t: 서울과 인천 사이에 처음으로 전화가 놓였어요. 개항 이후 전기·통신·교통 시설이 들어오며 생활 모습이 바뀌었어요.
  x: "초기 전화는 교환수가 전화를 건 사람과 받는 사람의 선을 손으로 이어 주어야 통화할 수 있었어요."

- id: myeongdong-cathedral
  n: 명동 성당 완공
  d: 1898
  c: 문화
  i: 1
  at: [126.987, 37.563]
  p: 서울 명동
  pg: 194
  t: 서울 명동에 서양식 벽돌 성당이 완공됐어요. 높은 첨탑 때문에 사람들은 '뾰족집'이라고 불렀어요.
  x: "1892년 공사를 시작해 1898년 5월 축성식을 올렸고, 프랑스인 코스트 신부가 설계와 공사 감독을 맡았어요. 돌이 아니라 벽돌로 지은 고딕 양식 건물이에요. 근처 왕실 사당의 풍수를 해칠 수 있다는 이유로 조정이 땅의 소유권을 문제 삼아 공사가 늦어지기도 했어요. 병인박해처럼 천주교를 엄하게 탄압하던 때를 지나 도성 한복판에 대성당이 들어선 것은 개항 뒤 달라진 사회 모습을 보여 줘요."

- id: telephone-exchange
  n: 한성 전화소, 서울 시내 전화 교환 시작
  d: 1902
  c: 사회
  i: 1
  at: [126.977, 37.570]
  ap: 1
  p: 한성
  pg: 194
  t: 대한 제국의 통신원이 한성 전화소를 열어 서울 시내 전화를 이어 주는 교환 업무를 시작했어요.
  x: "대한 제국이 상공업 진흥과 근대 시설 도입을 추진하던 광무개혁 시기의 변화로, 같은 무렵 전차·전등도 서울에 들어와 도시의 모습이 빠르게 바뀌었어요."
