# 근대 (1863~1910, 교과서 VI-1·VI-2). 1895년까지는 음력, 1896년부터 양력.
# 병인양요·신미양요·동학 농민 운동·청일 전쟁·러일 전쟁·의병 전투는 data/wars/korea.yaml

- id: gojong
  n: 고종 즉위, 흥선 대원군 집권
  d: '1863-12'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 175
  t: 12살의 고종이 왕위에 오르자 아버지 흥선 대원군이 실권을 잡고 세도 정치로 무너진 통치 체제를 바로잡으려 했어요.
  x: "철종이 뒤를 이을 아들 없이 세상을 떠나자 왕족인 흥선군의 아들이 왕위를 이었어요. '대원군'은 이처럼 왕이 대를 이을 아들 없이 죽어 왕족 가운데서 새 왕을 세웠을 때, 새 왕의 친아버지에게 주던 칭호예요. 흥선 대원군은 안동 김씨 등 세도 가문의 힘을 누르고 그동안 밀려나 있던 세력을 등용해 왕권을 강화했어요. 안으로는 경복궁 중건·서원 정리·호포제 같은 개혁을 펴고, 밖으로는 서양의 통상 요구를 거부하며 해안 방어를 강화했어요."

- id: gyeongbok-rebuild
  n: 경복궁 중건
  d: '1865-04'
  e: '1868-07'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 경복궁
  pg: 162
  t: 흥선 대원군이 임진왜란 때 불탄 경복궁을 다시 지어 왕실의 권위를 세우려 했어요. 원납전을 걷고 당백전을 찍어 백성의 불만을 샀어요.
  x: "흥선 대원군은 조선의 정궁인 경복궁을 다시 세워 왕실의 위엄을 되살리려 했지만, 공사가 워낙 커서 비용과 일손이 많이 들었어요. 원납전은 '원해서 내는 돈'이라는 이름과 달리 사실상 강제로 걷은 기부금이었어요. 당백전은 상평통보의 100배 가치로 찍은 화폐인데 실제 가치는 그에 한참 못 미쳐 물가가 치솟았어요. 원납전(기부금)과 당백전(화폐)을 헷갈리지 않게 조심해요."

- id: byeongin-bakhae
  n: 병인박해
  d: '1866-01'
  c: 사회
  i: 2
  at: [126.977, 37.570]
  p: 한양 (새남터 등)
  t: 흥선 대원군이 프랑스 선교사 9명과 수많은 천주교 신자를 처형했어요. 이 일을 구실로 프랑스가 강화도를 침략했어요(병인양요).
  x: "러시아가 통상을 요구해 오자 흥선 대원군은 처음에 프랑스 선교사를 통해 프랑스의 힘을 빌려 러시아를 막아 보려 했어요. 하지만 교섭이 이루어지지 않고 조정 안에서 천주교를 막으라는 압력이 커지자 1866년(병인년) 대대적인 탄압을 시작했어요. 이때 조선을 빠져나간 리델 신부가 청 톈진에 있던 프랑스 함대에 알리면서 병인양요가 일어났고, 양요 뒤에는 박해가 더 심해졌어요."

- id: general-sherman
  n: 제너럴셔먼호 사건
  d: '1866-07'
  c: 외교
  i: 2
  at: [125.75, 39.02]
  p: 평양 대동강
  t: 미국 상선 제너럴셔먼호가 대동강을 거슬러 올라와 통상을 요구하며 행패를 부리자, 평양 관민이 배를 불태웠어요. 신미양요의 원인이 됐어요.
  x: "제너럴셔먼호는 조선 관리들이 말리는데도 대동강을 따라 평양까지 올라와 통상을 요구했어요. 강물이 줄어 배가 움직이기 어려워지자 조선 관리를 붙잡아 가고 대포를 쏘아 사상자를 냈어요. 그러자 평안 감사 박규수가 불로 공격하는 화공을 지휘해 배를 불태웠어요. 박규수는 뒤에 김옥균·박영효 같은 젊은 양반들에게 새로운 사상을 전해 개화파가 자라는 데 영향을 준 인물이기도 해요."

- id: oppert
  n: 오페르트 도굴 사건
  d: '1868-04'
  c: 외교
  i: 2
  at: [126.62, 36.70]
  ap: 1
  p: 충남 예산 덕산 (남연군 묘)
  t: 독일 상인 오페르트가 통상을 요구하려고 흥선 대원군의 아버지 남연군의 묘를 파헤치려다 실패했어요. 서양에 대한 반감이 커졌어요.
  x: "오페르트는 1866년 두 차례 조선에 와서 통상을 요구했다가 모두 거절당했어요. 1868년에는 프랑스 신부 페롱 등과 함께 무장한 무리를 이끌고 충청도 덕산에 상륙해 밤새 남연군 묘를 파헤쳤지만, 묘가 워낙 단단해 실패하고 날이 밝자 달아났어요. 조상의 무덤을 소중히 여기던 조선 사람들은 크게 분노했고, 흥선 대원군은 통상 거부 정책과 천주교 탄압을 더 강화했어요."

- id: seowon-closure
  n: 서원 정리
  d: '1871-03'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  t: 흥선 대원군이 붕당의 근거지가 되고 백성을 수탈하던 서원을 47곳만 남기고 모두 없앴어요. 양반에게도 군포를 걷는 호포제도 실시했어요.
  x: "당시 많은 서원은 세금을 내지 않는 혜택을 받으면서, 제사 비용 등을 핑계로 농민에게서 재물을 거두어 원망을 샀어요. 흥선 대원군은 600여 곳의 서원을 없애고 거기에 딸린 토지와 노비를 거두어 나라 살림을 늘렸어요. 호포제는 군포를 집(호) 단위로 걷어 그동안 빠져 있던 양반도 내게 한 제도로, 군정의 문란을 바로잡으려는 개혁이었어요. 특권을 잃은 양반 유생들은 거세게 반발했어요."

- id: cheokhwabi
  n: 척화비 건립
  d: '1871-04'
  c: 외교
  i: 2
  at: [126.977, 37.570]
  ap: 1
  p: 종로 등 전국 각지
  pg: 175
  t: 신미양요 뒤 흥선 대원군이 '서양 오랑캐가 침범하는데 싸우지 않으면 화친하는 것이고, 화친을 주장하는 것은 나라를 파는 것'이라는 비를 전국에 세워 통상 수교 거부 정책을 굳혔어요.
  x: "비석 옆에는 작은 글씨로 '우리 자손 만대에 경계한다. 병인년(1866)에 짓고 신미년(1871)에 세운다.'라고 새겨, 두 차례 양요를 겪은 뒤의 결심을 담았어요. 서울 종로 네거리와 전국 곳곳에 세웠어요. 그러나 조선이 서양 나라와 수교한 뒤인 1882년 고종이 척화비를 모두 뽑으라고 명령했고, 서울의 비는 땅에 묻혔다가 1915년에 발굴됐어요."

- id: gojong-rule
  n: 고종의 친정 (흥선 대원군 물러남)
  d: '1873-11'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 175
  t: 최익현의 상소를 계기로 흥선 대원군이 물러나고 고종이 직접 나라를 다스렸어요. 통상 수교 거부 정책이 누그러졌어요.
  x: "최익현은 흥선 대원군이 만동묘와 서원을 대거 없앤 것 등을 바로잡으라는 상소를 올렸고, 이를 계기로 약 10년에 걸친 대원군의 집권이 끝났어요. 고종이 직접 나라를 다스리게 되자 문호를 열고 다른 나라와 교역하자는 통상 개화론의 목소리가 커졌고, 이런 분위기 속에서 1876년 강화도 조약이 맺어졌어요. 최익현은 뒤에 개항에 반대하는 상소를 올리고 을사늑약 뒤에는 의병을 일으킨 위정척사파의 대표 인물이에요."

- id: unyo
  n: 운요호 사건
  ds: '1875-09-20'
  c: 외교
  i: 3
  at: [126.52, 37.67]
  ap: 1
  p: 강화도 초지진·영종도
  pg: 216
  t: 일본 군함 운요호가 허락 없이 강화도 앞바다에 들어와 조선 수비대와 충돌하고 영종도를 공격했어요. 일본은 이를 구실로 개항을 강요했어요.
  x: "일본은 해안을 측량하고 물을 보급받는다는 핑계로 군함을 보냈지만, 실제로는 무력시위로 조선의 문을 강제로 열려는 계획이었어요. 일본군이 보트를 타고 초지진에 다가오자 조선 수비대가 포를 쏘았고, 운요호는 초지진에 보복 포격을 한 뒤 영종진에 상륙해 사람을 죽이고 불을 지르고 대포 등 무기를 빼앗아 갔어요. 일본은 오히려 조선에 책임을 묻겠다며 이듬해 군함을 이끌고 와서 조약을 요구했어요."

- id: ganghwa-treaty
  n: 강화도 조약 (조일 수호 조규)
  d: '1876-02-03'
  c: 외교
  i: 3
  at: [126.49, 37.75]
  p: 강화부 연무당
  pg: 187
  t: "조선이 일본과 맺은 첫 근대적 조약이에요. 부산 외 두 항구를 열고 해안 측량권과 치외 법권(영사 재판권)을 인정한 불평등 조약이었어요."
  x: "제1관에 '조선은 자주국'이라고 적었는데, 이는 조선과 청의 관계를 약하게 만들어 일본이 쉽게 간섭하려는 의도였어요. 부산 말고 새로 연 두 항구는 원산과 인천이에요. 같은 해 맺은 부록과 무역 규칙에서는 개항장에서 일본 화폐를 쓸 수 있게 하고, 상품에 관세를 매기지 않으며, 쌀 같은 곡식을 제한 없이 수출할 수 있게 해 조선 경제에 큰 피해를 주었어요. 조선 대표는 신헌, 일본 대표는 구로다 기요타카였어요."

- id: susinsa-1
  n: 1차 수신사 파견 (김기수)
  d: '1876-04'
  c: 외교
  i: 1
  at: [139.69, 35.69]
  ap: 1
  p: 일본 도쿄
  t: 강화도 조약 뒤 김기수를 수신사로 일본에 보내 근대 문물을 살펴보게 했어요.
  x: "수신사는 '옛 우호를 닦고 신의를 두텁게 한다'는 뜻의 사절이에요. 1차 수신사는 악대 등 의례 인원이 많아 조선 후기의 통신사와 비슷한 모습이었고, 76명이 일본에 다녀왔어요. 일정이 짧고 일본에 대한 거부감도 있어 일본이 보여 주려던 시설 가운데 일부만 살펴보았어요. 김기수는 이때 보고 들은 것을 『일동기유』라는 기록으로 남겼어요."

- id: joseon-strategy
  n: 2차 수신사 김홍집, 『조선책략』 들여옴
  d: '1880-08'
  c: 외교
  i: 2
  at: [126.977, 37.579]
  p: 한양
  t: 김홍집이 일본에서 청 외교관 황쭌셴이 쓴 『조선책략』을 가져왔어요. 러시아를 막으려면 청과 친하고 일본·미국과 손잡아야 한다는 내용이에요.
  x: "김홍집은 원래 관세 문제 등을 협상하러 일본에 갔다가, 청 공사관의 관리였던 황쭌셴(황준헌)에게 이 책을 받아 와 고종에게 바쳤어요. 책은 특히 미국을 힘이 세면서도 공정한 나라로 소개하며 미국과 조약을 맺으라고 권했어요. 이 책은 미국과의 수교와 통리기무아문 설치 같은 개화 정책에 영향을 주었지만, 유생들은 크게 반발해 이듬해 영남 만인소를 올렸어요."

- id: tongni
  n: 통리기무아문 설치
  d: '1880-12'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 175
  t: 개화 정책을 총괄하는 기구로 통리기무아문을 두고 그 아래 12사를 두었어요.
  x: "1880년 12월에 설치되어 영의정이 총리대신을 맡을 만큼 높은 기구였어요. 12사는 외교(사대·교린), 군사(군무·군물·선함), 통상, 외국어 등 새로운 업무를 나누어 맡았고, 이듬해 7사로 정리됐어요. 1882년 임오군란으로 흥선 대원군이 다시 권력을 잡으면서 폐지됐어요."

- id: manin-so
  n: 영남 만인소
  d: '1881-02'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양 (경상도 유생들의 상소)
  pg: 175
  t: 이만손 등 경상도 유생 만여 명이 『조선책략』과 개화 정책을 비판하는 상소를 올렸어요. 위정척사 운동이 거세졌어요.
  x: "만인소는 만 명에 이르는 많은 유생이 함께 이름을 올린 상소를 말해요. 영남 유생들은 병인·신미양요 때 물리친 서양 세력을 이제 맞아들이려 한다고 개탄했어요. 또 일본은 믿을 수 없고, 미국을 끌어들이면 감당하기 어려우며, 러시아를 자극해 오히려 침략을 부를 수 있다며 『조선책략』의 외교 방안을 비판했어요. 같은 해 강원도 유생 홍재학 등도 상소를 올리는 등 위정척사 운동이 크게 일어났고, 이 움직임은 뒤에 항일 의병 투쟁으로 이어졌어요."

- id: byeolgigun
  n: 별기군 창설
  d: '1881-04'
  c: 정치
  i: 2
  at: [126.977, 37.570]
  p: 한양
  pg: 175
  t: 신식 무기를 갖추고 일본인 교관에게 훈련받는 신식 군대를 만들었어요. 구식 군대보다 대우가 좋아 불만을 샀어요.
  x: "구식 군대에서 몸이 튼튼한 지원자 80여 명을 뽑아 만들었고, 일본 육군 장교 호리모토가 교관을 맡아 서양식으로 훈련했어요. 급료와 옷 등 대우가 구식 군대보다 훨씬 좋아 구식 군인들의 시기와 불만을 샀어요. 결국 1882년 임오군란 때 구식 군인들의 공격을 받아 교관 호리모토 등 일본인이 목숨을 잃었고, 군란 뒤 별기군은 해체됐어요."

- id: josa-sichaldan
  n: 조사 시찰단 파견
  d: '1881-04'
  c: 외교
  i: 3
  at: [139.69, 35.69]
  ap: 1
  p: 일본
  pg: 175
  t: 박정양 등 60여 명이 약 4개월 동안 일본의 정부 기관과 산업 시설을 둘러보고 돌아왔어요.
  x: "개화 정책에 반대하는 여론이 거셌기 때문에 단원들은 '동래부 암행어사'라는 직함을 받고 비밀리에 떠났어요. 전문 위원인 조사 12명이 각자 수행원을 거느리고 내무성·외무성·대장성 같은 정부 부서와 세관·군대 등을 나누어 살폈어요. 박정양 말고도 어윤중, 홍영식 등이 참여했고, 돌아와서 보고서와 견문 기록을 고종에게 올려 개화 정책에 참고하게 했어요."

- id: yeongseonsa
  n: 영선사 파견
  d: '1881-09'
  c: 외교
  i: 3
  at: [117.20, 39.13]
  ap: 1
  p: 청 톈진
  pg: 175
  t: 김윤식이 학생과 기술자들을 이끌고 청의 톈진에 가서 무기 만드는 법을 배웠어요. 돌아와 근대식 무기 공장인 기기창을 세웠어요.
  x: "학도와 기술자 38명이 톈진 기기국에서 화약·탄약 만드는 법과 전기·화학 같은 기초 과학을 배웠어요. 하지만 경비가 늘 모자랐고, 병 같은 여러 사정으로 절반가량이 중간에 돌아왔으며, 1882년 임오군란 소식이 전해지자 남은 사람들도 1년도 채우지 못하고 공부를 멈춘 채 돌아왔어요. 그래도 이 경험이 바탕이 되어 1883년 서울 삼청동에 기기창이 세워졌어요. 미국에 간 보빙사와 달리 영선사는 청에 보낸 사절이라는 점을 구별해요."

- id: joseon-us-treaty
  n: 조미 수호 통상 조약
  d: '1882-04-06'
  c: 외교
  i: 3
  at: [126.62, 37.47]
  p: 제물포 (인천)
  pg: 187
  t: "청의 알선으로 서양 나라와 처음 맺은 조약이에요. 치외 법권(영사 재판권)과 최혜국 대우를 인정한 불평등 조약이었어요."
  x: "청은 미국을 끌어들여 러시아와 일본을 견제하고 조선에 대한 영향력도 지키려고 이 조약을 주선했어요. 『조선책략』이 미국과 손잡으라고 권한 것도 배경이 됐어요. 조약에는 다른 나라가 조선을 부당하게 대하면 미국이 나서서 돕는다는 거중 조정 조항이 들어갔어요. 최혜국 대우는 앞으로 다른 나라에 더 좋은 조건을 주면 미국에도 자동으로 주는 규정이라 조선에 불리했어요. 이 조약 뒤 영국·독일·러시아·프랑스 등과도 차례로 수교했어요."

- id: imo
  n: 임오군란
  d: '1882-06-09'
  c: 정치
  i: 3
  at: [126.977, 37.570]
  p: 한양
  pg: 175
  t: 13개월이나 밀린 급료로 겨와 모래가 섞인 쌀을 받은 구식 군인들이 하층민과 함께 봉기했어요. 청군이 진압하고 흥선 대원군을 끌고 간 뒤 군대를 주둔시켜 내정에 간섭했어요.
  x: "군인들은 민씨 세력의 고관 민겸호의 집을 습격한 데 이어 일본 공사관과 궁궐까지 공격했고, 명성 황후는 궁 밖으로 피신했어요. 고종이 수습을 맡기자 흥선 대원군이 다시 권력을 잡아 통리기무아문을 없애고 옛 군영을 되살렸지만, 청군에게 붙잡혀 톈진으로 끌려가면서 33일 만에 물러났어요. 일본과는 제물포 조약을 맺어 배상금을 물고 일본 공사관에 경비병을 두게 했어요. 청은 마젠창과 독일인 묄렌도르프를 고문으로 보내 간섭을 강화했어요."

- id: qing-trade-rules
  n: 조청 상민 수륙 무역 장정
  d: '1882-08'
  c: 경제
  i: 2
  at: [117.20, 39.13]
  ap: 1
  p: "청 톈진 (맺은 곳)"
  pg: 187
  t: 임오군란 뒤 청과 맺은 무역 규정이에요. 청 상인이 한양과 내륙에서도 장사할 수 있게 되어 국내 상인이 큰 타격을 입었어요.
  x: "장정 첫머리에 조선을 청의 속방(속국)이라고 적어 두 나라가 대등하지 않다는 점을 드러냈어요. 청 상인은 서울 양화진에 가게를 열 수 있었고, 지방관의 허가증을 받으면 내륙에 들어가 물건을 사들일 수도 있었어요. 조선에 있는 청 상무위원의 치외 법권도 인정했어요. 이후 일본과 서양 나라들도 비슷한 권리를 얻으면서 청과 일본 상인의 경쟁이 치열해졌고, 서울의 시전 상인 등 국내 상인은 큰 타격을 입었어요."

- id: taegukgi
  n: 태극기를 국기로 공포
  d: '1883-01'
  c: 정치
  i: 1
  at: [126.977, 37.579]
  p: 한양
  t: 1882년 박영효가 일본에 갈 때 쓴 태극기를 이듬해 정식 국기로 공포했어요.
  x: "박영효는 임오군란 뒤 사과 사절(수신사)로 일본에 가는 배 안에서 영국인 선장과 의논해 크기가 다른 태극기 3개를 만들어 썼다고 해요. 그보다 앞서 1882년 조미 수호 통상 조약을 맺을 때 이미 4괘가 그려진 태극기가 쓰였다는 기록도 있어요. 흰 바탕 가운데의 태극과 네 모서리의 건·곤·감·이 4괘로 이루어져 있어요. 오늘날의 태극기는 1949년에 대한민국 국기로 정식 공포됐어요."

- id: bobingsa
  n: 보빙사 파견
  d: '1883-06'
  c: 외교
  i: 2
  at: [-77.04, 38.90]
  ap: 1
  p: 미국 (워싱턴 등)
  pg: 174
  t: 미국 공사가 온 데 대한 답례로 민영익·홍영식·서광범 등을 미국에 보냈어요. 서양에 보낸 첫 사절단이에요.
  x: "보빙사는 '답례로 찾아가는 사절'이라는 뜻이에요. 일행은 뉴욕에서 미국 대통령 아서를 만나 국서를 전하고, 보스턴 박람회와 공장·학교, 병원·우체국·신문사, 정부 부처 등을 두루 둘러보았어요. 민영익·서광범 등은 미국 군함을 타고 유럽을 거쳐 세계를 한 바퀴 돌아 귀국했어요. 이들이 보고 들은 것은 우정총국·육영 공원·농무 목축 시험장 설립 같은 개화 정책에 영향을 주었어요."

- id: hanseong-sunbo
  n: 『한성순보』 발행
  d: '1883-10-01'
  c: 문화
  i: 1
  at: [126.977, 37.570]
  p: 한양 (박문국)
  t: 박문국에서 우리나라 최초의 근대 신문인 『한성순보』를 열흘에 한 번 펴냈어요.
  x: "정부 기관인 박문국이 펴낸 관영 신문이라 주로 관리들이 읽었고, 한문으로 썼어요. 나라 안 소식과 함께 세계 여러 나라의 전쟁·외교 소식, 서양의 새로운 문물을 소개해 개화 정책을 알리는 역할을 했어요. 1884년 갑신정변 때 박문국이 불타면서 1년여 만에 멈췄고, 1886년에 일주일마다 펴내는 『한성주보』로 다시 나왔어요. '순보'의 '순'은 열흘을 뜻해요."

- id: gapsin
  n: 갑신정변
  d: '1884-10-17'
  e: '1884-10-19'
  c: 정치
  i: 3
  at: [126.983, 37.574]
  p: 우정총국 (서울 종로)
  pg: 176
  t: 김옥균 등 급진 개화파가 우정총국 개국 축하연에서 정변을 일으켜 새 정부를 세웠지만, 청군의 공격으로 3일 만에 무너졌어요.
  x: "임오군란 뒤 청이 군대를 머물게 하고 내정에 깊이 간섭하자, 급진 개화파는 청에서 벗어나 일본의 메이지 유신처럼 빠르게 근대화하려 했어요. 이들은 민씨 정권의 핵심 인물들을 없애고 청에 대한 사대 관계 폐지, 문벌 폐지와 인민 평등, 호조로 재정 일원화 등을 담은 개혁 정강을 발표했어요. 그러나 일본군에 기댄 데다 백성의 지지를 얻지 못해 실패했고, 김옥균·박영효 등은 일본으로 망명했어요. 정변 뒤 청의 간섭은 더 심해졌어요."

- id: tianjin-treaty
  n: 톈진 조약
  ds: '1885-04-18'
  c: 외교
  i: 2
  at: [117.20, 39.13]
  ap: 1
  p: 청 톈진
  pg: 176
  t: 청과 일본이 조선에서 함께 군대를 물리고, 앞으로 군대를 보낼 때는 서로 미리 알리기로 약속했어요. 1894년 청일 전쟁의 불씨가 됐어요.
  x: "갑신정변을 수습하면서 청과 일본이 조선 문제를 두고 맺은 약속이에요. 이 조약으로 일본은 조선에 군대를 보낼 수 있는 권리를 청과 똑같이 갖게 됐어요. 1894년 동학 농민 운동 때 청군이 아산만에 상륙하자 일본도 이 조약을 내세워 바로 군대를 보냈고 결국 청일 전쟁으로 이어졌어요. 같은 무렵 조선은 일본과 한성 조약을 맺어 불탄 일본 공사관에 대한 배상금과 새 공사관 건축비를 물었어요."

- id: geomundo
  n: 거문도 사건
  ds: '1885-04-15'
  es: '1887-02-27'
  c: 외교
  i: 3
  at: [127.31, 34.03]
  p: 거문도 (전남 여수)
  pg: 216
  t: 러시아를 견제하려던 영국이 거문도를 불법으로 점령했어요. 약 2년 동안 머물다 물러났어요.
  x: "갑신정변 뒤 조선 정부가 청의 간섭을 견제하려고 러시아에 다가가려 하자, 세계 곳곳에서 러시아와 맞서던 영국이 러시아의 남하를 막는 기지로 삼으려고 거문도를 점령했어요. 거문도는 서양에서 '포트 해밀턴'이라고 불렸어요. 조선 정부가 항의하고 영국과 러시아의 관계가 안정되면서 1887년 영국군이 물러났어요. 이 사건은 조선이 열강의 다툼에 휘말릴 수 있다는 위기감을 키웠어요."

- id: gwanghyewon
  n: 광혜원 설립
  ds: '1885-04-10'
  c: 사회
  i: 1
  at: [126.985, 37.578]
  ap: 1
  p: 한양 재동
  t: 미국인 선교사 알렌의 건의로 세운 최초의 근대식 병원이에요. 곧 제중원으로 이름을 바꿨어요.
  x: "알렌은 갑신정변 때 칼에 크게 다친 민영익을 서양 의술로 치료해 왕실의 신임을 얻었고, 이를 계기로 정부가 세운 서양식 병원에서 진료를 맡게 됐어요. 광혜원은 '널리 은혜를 베푸는 집', 제중원은 '많은 사람을 구하는 집'이라는 뜻이에요."

- id: banggokryeong
  n: 함경도 방곡령
  d: '1889-09'
  c: 경제
  i: 3
  at: [127.44, 39.15]
  ap: 1
  p: 함경도 (원산)
  pg: 187
  t: 일본 상인들이 곡물을 대량으로 사 가자 함경도 관찰사 조병식이 곡물 수출을 막는 방곡령을 내렸어요. 일본의 항의로 거두고 배상금을 물었어요.
  x: "개항 뒤 일본 상인들이 곡물을 대량으로 사 가면서 곡물 값이 크게 오르고 백성의 생활이 어려워졌어요. 1883년 조일 통상 장정에는 천재지변 등으로 식량이 부족해질 때 방곡령을 선포할 수 있다는 조항까지 있었지만, 조선은 일본의 거센 항의에 밀려 물러설 수밖에 없었어요. 방곡령은 시전 상인의 철시, 독립 협회의 이권 수호 운동 등과 함께 외세의 경제 침탈에 맞선 경제적 구국 운동으로 교과서에 나와요."

- id: boeun
  n: 동학 교도의 보은 집회
  d: '1893-03'
  c: 사회
  i: 1
  at: [127.73, 36.49]
  ap: 1
  p: 충북 보은
  t: 동학 교도들이 교조 최제우의 억울함을 풀어 달라는 교조 신원 운동을 벌이다 보은 집회에서 탐관오리 처벌과 외세 배척을 내세웠어요.
  x: "동학을 세운 최제우는 그릇된 가르침으로 백성을 홀렸다는 죄를 쓰고 1864년 처형되었고, 정부는 그 뒤에도 동학을 탄압했어요. 2대 교주 최시형 아래에서 교세가 커지자 교도들은 교조의 누명을 벗겨 달라는 교조 신원 운동을 벌였어요. 처음에는 종교적 요구였지만 점차 탐관오리를 몰아내고 외세를 물리치자는 정치적 요구가 더해져 대규모 민중 집회로 바뀌었고, 이 흐름은 이듬해 동학 농민 운동으로 이어졌어요."

- id: gabo-reform
  n: 1차 갑오개혁 (군국기무처 설치)
  d: '1894-06-25'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 176
  t: 경복궁을 점령한 일본의 압력 속에 김홍집 정부가 군국기무처를 두고 과거제 폐지, 신분제와 노비 제도 폐지, 재정 일원화 같은 개혁을 했어요.
  x: "군국기무처는 회의를 40차례 열어 약 210건의 개혁안을 통과시킨 최고 정책 기구였어요. 청의 연호 대신 '개국' 기년을 써서 청과의 사대 관계를 끊으려 했고, 왕실 사무는 궁내부가, 나랏일은 의정부가 맡게 했어요. 또 조혼을 금지하고 과부의 재혼을 허용했으며, 죄인의 가족까지 벌하는 연좌제를 없애고 도량형을 통일했어요. 갑오개혁은 동학 농민군과 개화파가 바라던 개혁을 여럿 받아들여, 근대 국가로 나아가는 발판을 놓았다고 평가받아요."

- id: hongbeom
  n: 홍범 14조 반포
  d: '1894-12-12'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 176
  t: 청일 전쟁에서 우세해진 일본이 군국기무처를 없애고 새 내각을 세우자, 고종이 개혁의 방향을 담은 홍범 14조를 반포했어요(2차 갑오개혁).
  x: "고종은 왕세자와 신하들을 이끌고 종묘에 나아가 조상에게 고하는 글과 함께 홍범 14조를 발표했어요. 첫 조항은 청에 의존하려는 생각을 끊고 자주독립의 기초를 세운다는 것이었고, 왕실과 나랏일의 분리, 법에 정한 대로만 세금 걷기, 민법·형법 제정, 문벌에 얽매이지 않는 인재 등용 등을 담았어요. 이때 의정부는 내각으로, 8아문은 7부로 바뀌었고, 교육 입국 조서에 따라 한성 사범 학교 같은 근대 학교도 세워지기 시작했어요."

- id: triple-intervention
  n: 삼국 간섭
  ds: '1895-04-23'
  c: 외교
  i: 2
  at: [122.0, 40.5]
  ap: 1
  p: 랴오둥반도
  t: 러시아·프랑스·독일이 일본에게 청일 전쟁으로 얻은 랴오둥반도를 청에 돌려주라고 압박했어요. 일본의 영향력이 줄고 러시아의 힘이 커졌어요.
  x: "청일 전쟁에서 이긴 일본은 시모노세키 조약으로 청에게서 랴오둥반도·타이완 등을 넘겨받고, 청이 조선을 완전한 자주독립국으로 인정하게 했어요. 그러자 러시아가 앞장서고 프랑스·독일이 함께 랴오둥반도를 돌려주라고 요구했고, 일본은 세 나라의 군사력에 밀려 이를 받아들였어요. 이를 본 조선 정부는 러시아와 가까이하여 일본을 밀어내려 했고, 위기를 느낀 일본은 을미사변을 일으켰어요."

- id: eulmi-sabyeon
  n: 을미사변
  d: '1895-08-20'
  c: 정치
  i: 3
  at: [126.977, 37.584]
  p: 경복궁 건청궁
  pg: 176
  t: 고종과 명성 황후가 러시아와 가까워지자 일본 공사 미우라가 보낸 자객들이 경복궁에 들어가 명성 황후를 시해했어요.
  x: "미우라는 일본 공사관에서 계획을 세우고, 서울에 있던 일본군 수비대와 낭인 등을 동원해 새벽에 경복궁 건청궁으로 쳐들어갔어요. 이들은 명성 황후를 시해한 뒤 시신을 불태웠고, 고종을 압박해 친일 내각을 세우게 했어요. 국제적 비난이 일자 일본은 관련자들을 재판에 넘겼지만 증거가 부족하다며 모두 풀어 주었어요. 명성 황후는 당시 왕비였고, '황후' 칭호는 1897년 대한 제국 수립 뒤에 올려졌어요."

- id: danbal
  n: 단발령 (을미개혁)
  d: '1895-11-15'
  c: 정치
  i: 3
  at: [126.977, 37.579]
  p: 한양
  pg: 176
  t: 친일 내각이 상투를 자르게 하는 단발령을 내리고 태양력을 쓰기로 했어요(을미개혁). 을미사변과 단발령에 분노한 유생들이 의병을 일으켰어요.
  x: "고종은 백성에게 본보기를 보이려고 단발령을 내린 날 왕태자와 함께 먼저 머리를 잘랐어요. 하지만 당시 사람들은 몸과 머리카락은 부모에게 물려받은 것이라 함부로 상하게 하지 않는 것이 효도의 시작이라고 여겨 크게 반발했어요. 최익현은 '내 머리는 자를 수 있어도 머리카락은 자를 수 없다'며 거부했어요. 이때 일어난 을미의병은 유인석 등 유생들이 이끌었고, 아관 파천 뒤 단발령은 철회되어 개인의 뜻에 맡겨졌어요."

- id: solar-calendar
  n: 태양력 사용
  ds: '1896-01-01'
  c: 정치
  i: 2
  at: [126.977, 37.579]
  p: 한양
  pg: 176
  t: 음력 1895년 11월 17일을 양력 1896년 1월 1일로 삼아 태양력을 쓰기 시작했어요. '건양'이라는 연호도 썼어요.
  x: "태양력 사용은 을미개혁 때 단발령과 함께 발표되었어요. '건양'은 양력을 세운다는 뜻으로 풀이되는 연호로, 1897년 대한 제국 수립을 앞두고 '광무'로 바뀌었어요. 이렇게 1896년 1월 1일부터 양력을 쓰기 시작했기 때문에, 이 지도에서도 1895년까지 한국 사건은 음력 날짜, 1896년부터는 양력 날짜로 적었어요."

- id: agwan
  n: 아관 파천
  ds: '1896-02-11'
  c: 정치
  i: 3
  at: [126.972, 37.567]
  p: 러시아 공사관 (서울 정동)
  pg: 176
  t: 고종이 일본의 감시를 피해 러시아 공사관으로 거처를 옮겼어요. 김홍집 내각이 무너지고 열강의 이권 침탈이 심해졌어요.
  x: "을미사변 뒤 신변의 위협을 느낀 고종은 이범진 등 친러 세력과 러시아 측의 도움을 받아, 새벽에 궁녀의 가마를 타고 경복궁을 빠져나갔어요. 총리대신 김홍집 등은 성난 백성에게 목숨을 잃었고, 박정양을 중심으로 새 내각이 섰어요. 새 정부는 단발령을 거두고 의병을 달랬지만, 러시아의 영향력이 커지고 열강의 이권 침탈이 심해졌어요. 고종은 약 1년 뒤인 1897년 2월 경운궁(덕수궁)으로 돌아왔어요."

- id: independent-news
  n: 『독립신문』 창간
  ds: '1896-04-07'
  c: 문화
  i: 2
  at: [126.97, 37.566]
  ap: 1
  p: 서울 정동
  pg: 178
  t: 서재필이 정부의 지원을 받아 한글판과 영문판으로 된 『독립신문』을 만들었어요.
  x: "갑신정변 뒤 미국으로 망명해 의사가 된 서재필은 1895년 말 귀국했고, 정부가 창간 자금을 대 주었어요. 처음에는 4면 가운데 3면은 한글, 마지막 1면은 영문으로 펴냈고, 영문판은 1897년부터 따로 나왔어요. 한글만 쓰고 띄어쓰기를 해 누구나 쉽게 읽을 수 있게 했어요. 이틀에 한 번 나오다가 1898년부터 날마다 펴냈고, 1899년 말에 폐간됐어요."

- id: dongnip-club
  n: 독립 협회 창립
  ds: '1896-07-02'
  c: 정치
  i: 3
  at: [126.96, 37.572]
  ap: 1
  p: 서울
  pg: 178
  t: 서재필과 개화파 관료들이 독립 협회를 만들었어요. 독립문을 세우고 토론회와 연설회로 민중의 정치의식을 높였어요.
  x: "처음에는 독립문과 독립공원을 세우자는 목적으로 출발해 고문 서재필, 회장 안경수, 위원장 이완용 등 정부 관료가 중심이었어요. 점차 학생·시민 등 민중이 많이 참여하면서 자주독립과 민권을 강조하는 정치 단체로 바뀌었어요. 의회를 만들려고 중추원을 고치는 운동까지 벌였지만, 보수 세력이 '공화정을 세우려 한다'고 모함하자 고종은 군대와 보부상을 동원해 1898년 말 해산시켰어요."

- id: dongnipmun
  n: 독립문 완공
  ds: '1897-11-20'
  c: 문화
  i: 1
  at: [126.959, 37.572]
  p: 서울 서대문 (영은문 터)
  pg: 178
  t: 청의 사신을 맞던 영은문을 헐고 그 근처에 자주독립의 뜻을 담아 세운 문이에요.
  x: "독립 협회가 고종의 동의와 국민의 호응을 얻어 1896년 11월 기초를 놓고 1년 만에 완공했어요. 서재필의 구상에 따라 프랑스 파리의 개선문을 본떴고, 앞뒤에 한글과 한자로 '독립문'이라 새기고 그 옆에 태극기를 새겼어요. 여기서 '독립'은 일본이 아니라 청에 대한 사대 관계를 끊고 자주독립 국가가 되겠다는 뜻이라는 점에 주의해요. 1979년 도로 공사 때문에 원래 자리에서 70m쯤 옮겨졌어요."

- id: daehan-empire
  n: 대한 제국 수립
  ds: '1897-10-12'
  c: 정치
  i: 3
  at: [126.980, 37.565]
  p: 환구단 (서울 소공동)
  pg: 178
  t: 경운궁으로 돌아온 고종이 환구단에서 황제로 즉위하고 나라 이름을 대한 제국, 연호를 광무로 정했어요.
  x: "고종이 환궁하자 관리와 유생, 시전 상인 등이 황제로 즉위하라는 상소를 잇달아 올렸어요. 하늘에 제사를 지내는 일은 황제만 할 수 있다고 여겼기 때문에, 고종은 환구단을 쌓고 그곳에서 즉위식을 올렸어요. 청과 대등한 황제의 나라임을 밝혀 자주독립 국가의 위상을 높이려 한 것이에요. 지금 서울 소공동에는 환구단 터에 3층 팔각 건물인 황궁우가 남아 있어요."

- id: manmin
  n: 만민 공동회 개최
  ds: '1898-03-10'
  c: 정치
  i: 3
  at: [126.982, 37.570]
  p: 서울 종로
  pg: 178
  t: 독립 협회가 서울 종로에서 민중 대회인 만민 공동회를 열어 러시아의 이권 침탈과 내정 간섭에 반대했어요.
  x: "첫 만민 공동회에서는 쌀장수 현덕호가 회장으로 뽑힐 만큼 신분과 관계없이 많은 시민이 모였어요. 이들은 러시아 군사 교관과 재정 고문을 돌려보내라고 요구했고, 결국 러시아 고문과 교관이 해고되고 한러 은행도 문을 닫았어요. 민중이 거리에 모여 나랏일을 토론하고 정부에 요구를 전했다는 점에서 의미가 커요. 1898년 말에는 독립 협회 해산에 맞서 40일 넘게 밤샘 시위를 벌이기도 했어요."

- id: heonui
  n: 관민 공동회, 헌의 6조 결의
  ds: '1898-10-29'
  c: 정치
  i: 2
  at: [126.982, 37.570]
  p: 서울 종로
  pg: 178
  t: 정부 대신까지 참여한 관민 공동회에서 외국에 이권을 넘기지 말 것 등 6개 항목을 결의해 고종에게 올렸어요. 그해 12월 독립 협회는 강제로 해산됐어요.
  x: "관민 공동회에서는 백정 출신 박성춘이 개막 연설을 해 관리와 백성이 마음을 합치자고 호소했어요. 헌의 6조에는 외국과 이권 계약을 맺을 때 대신과 중추원 의장이 함께 서명할 것, 재정은 탁지부가 맡고 예산과 결산을 공개할 것, 중죄인은 공개 재판할 것 등이 담겼어요. 고종은 이를 받아들이고 중추원 의관의 절반을 민간에서 뽑는 새 관제를 발표해 의회가 생길 뻔했지만, 보수 세력의 모함으로 무산됐어요."

- id: tram
  n: 전차 개통 (서대문~청량리)
  ds: '1899-05'
  c: 경제
  i: 1
  at: [126.985, 37.571]
  ap: 1
  p: 서울 종로
  pg: 194
  t: 한성 전기 회사가 서대문과 청량리를 잇는 전차를 운행하기 시작했어요.
  x: "한성 전기 회사는 고종 등 황실이 주도해 세웠지만 자본과 기술이 부족해 미국인 콜브란·보스트윅과 계약을 맺고 사업을 진행했어요. 동대문에 발전소를 세워 전차를 움직이고 서울 거리에 전등도 밝혔어요. 같은 해 말에는 종로~용산 노선도 열렸어요. 전차는 새로운 교통수단으로 서울 사람들의 생활 모습을 바꿔 놓았어요."

- id: gyeongin-line
  n: 경인선 개통
  ds: '1899-09-18'
  c: 경제
  i: 1
  at: [126.94, 37.51]
  ap: 1
  p: 노량진~제물포
  pg: 187
  t: 우리나라 최초의 철도로 노량진과 제물포 사이를 달렸어요. 부설권은 미국에서 일본으로 넘어갔어요.
  x: "경인선 부설권은 아관 파천 뒤인 1896년 미국인이 얻었지만 1898년 일본에 넘어가 일본이 완공했어요. 경부선(1898)과 경의선(1904) 부설권도 결국 일본이 차지했어요. 철도는 사람과 물자를 빠르게 실어 날라 생활 모습을 바꾸었지만, 동시에 일본이 경제 침탈과 군사 이동에 이용하는 통로가 되었어요."

- id: daehanguk-gukje
  n: 대한국 국제 반포
  ds: '1899-08-17'
  c: 정치
  i: 2
  at: [126.975, 37.566]
  p: 경운궁 (덕수궁)
  pg: 178
  t: 대한 제국이 황제가 군대·입법·사법·행정의 모든 권한을 가진다고 밝힌 국가 기본법이에요.
  x: "모두 9개 조로 된 이 법은 첫 조에서 대한국이 자주독립한 제국임을 밝혔어요. 군대 통솔, 법률 제정, 관리 임명, 조약 체결과 전쟁 선포 등 모든 권한이 황제에게 있다고 정했어요. 반면 백성의 권리나 의회에 관한 조항은 없어서 독립 협회가 바랐던 입헌 정치와는 거리가 멀었어요. 대한 제국이 황제권 강화를 개혁의 중심에 두었음을 잘 보여 줘요."

- id: decree-41
  n: 대한 제국 칙령 제41호 반포
  ds: '1900-10-25'
  c: 정치
  i: 2
  at: [130.87, 37.50]
  p: 울릉도 (울도군)
  pg: 180
  t: 울릉도를 울도로 이름을 바꾸고 군으로 승격했어요. 울도군이 울릉 전도와 죽도, 석도(독도)를 관할한다고 밝혀 독도가 우리 땅임을 분명히 했어요.
  x: "칙령에는 울릉도를 울도로 이름을 바꾸고 섬을 다스리던 도감을 군수로 고친다는 내용이 들어 있어요. 대한 제국이 근대적인 법령으로 독도를 우리 영토로 다스리고 있음을 밝힌 것이라, 일본이 1905년 독도를 '주인 없는 섬'이라며 편입한 주장이 틀렸음을 보여 주는 중요한 근거예요. 칙령을 반포한 10월 25일을 기념해 오늘날 '독도의 날'로 정했어요."

- id: jigye
  n: "지계아문 설치 (광무개혁)"
  ds: '1901-10'
  c: 경제
  i: 2
  at: [126.975, 37.566]
  p: 한양
  pg: 178
  t: "대한 제국이 토지를 측량하는 양전 사업을 하고 지계아문을 두어, 1902년부터 근대적 토지 소유 증명서인 지계를 발급했어요."
  x: "대한 제국은 1898년 양지아문을 두어 토지 측량을 시작했고, 1901년 세운 지계아문이 이 일을 이어받아 1902년 양지아문을 합쳤어요. 전국 군의 약 3분의 2에서 측량을 마쳤고, 개항장 밖에서는 외국인이 땅을 가질 수 없게 했어요. 나라 재정을 늘리고 근대적 토지 소유권을 확립하려 했지만, 러일 전쟁 위기 속에 1904년 지계아문이 폐지되면서 사업이 멈췄어요."

- id: protocol-1904
  n: 한일 의정서
  ds: '1904-02-23'
  c: 외교
  i: 2
  at: [126.975, 37.566]
  p: 한양
  pg: 179
  t: 러일 전쟁 중 일본이 군사적으로 필요한 대한 제국의 땅을 마음대로 쓸 수 있게 하는 의정서를 강요했어요.
  x: "러일 전쟁의 기운이 짙어지자 대한 제국은 1904년 1월 어느 편도 들지 않겠다는 국외 중립을 선언했어요. 그러나 일본은 전쟁을 시작하자 서울에 군대를 들여보내고 의정서 체결을 강요했어요. 의정서에는 대한 제국이 시정 개선에 관해 일본의 '충고'를 들어야 한다는 조항도 있어 내정 간섭의 발판이 되었어요. 일본은 이를 근거로 넓은 땅을 군용지로 차지하고 경의선 철도 부설권도 가져갔어요."

- id: first-agreement
  n: 제1차 한일 협약
  ds: '1904-08-22'
  c: 외교
  i: 2
  at: [126.975, 37.566]
  p: 한양
  t: 일본이 추천한 재정 고문과 외교 고문을 두게 해 대한 제국의 재정과 외교에 간섭했어요.
  x: "재정 고문으로는 일본 대장성 관리 출신 메가타가, 외교 고문으로는 일본이 추천한 미국인 스티븐스가 왔어요. 메가타는 정부 회의에 참여하고 황제에게 직접 보고할 수 있었으며, 일본이 동의하지 않으면 해고할 수도 없어 사실상 재정을 감독했어요. 일본은 협약에 없던 궁내부·경무·군부 등에도 일본인 고문을 두어, 통감부가 생기기 전에 이미 내정의 상당 부분을 손에 넣었어요. 이를 '고문 정치'라고 해요."

- id: dokdo-annex
  n: 일본, 독도 불법 편입
  ds: '1905-02-22'
  c: 외교
  i: 2
  at: [131.87, 37.24]
  p: 독도
  pg: 180
  t: 러일 전쟁 중 일본이 독도를 '주인 없는 땅'이라며 시마네현 고시로 자기 영토에 몰래 넣었어요. 대한 제국은 이 사실을 1906년에야 알고 강하게 반발했어요.
  x: "일본은 독도를 주인 없는 섬이라고 주장했지만, 대한 제국은 이미 1900년 칙령 제41호로 울도군이 석도(독도)를 관할한다고 밝혔어요. 일본의 최고 행정 기관인 태정관도 1877년에 울릉도와 독도가 일본 땅이 아니라고 결정한 적이 있어요. 독도는 신라 지증왕 때 우산국이 신라에 편입된 뒤로 우리 고유의 영토이고, 광복 뒤 우리 영토로 돌아왔지만 일본은 지금도 이 편입을 내세워 억지 주장을 펴고 있어요."

- id: gyeongbu-line
  n: 경부선 개통
  ds: '1905-01-01'
  c: 경제
  i: 1
  at: [127.0, 36.6]
  ap: 1
  p: 서울~부산
  pg: 187
  t: 일본이 러일 전쟁을 위해 서둘러 놓은 서울~부산 철도가 영업을 시작했어요.
  x: "경부선 부설권은 1898년 일본이 얻었어요. 러일 전쟁이 시작되고 한일 의정서가 체결되자 일본은 경부선과 경의선 철도를 군사용으로 서둘러 놓았어요. 이렇게 놓인 철도는 뒤에 일제가 식량과 자원을 실어 가는 수탈의 기반이 되기도 했어요."

- id: katsura-taft
  n: 가쓰라·태프트 밀약
  ds: '1905-07-29'
  c: 외교
  i: 2
  at: [139.69, 35.69]
  ap: 1
  p: 일본 도쿄
  t: 미국은 일본의 대한 제국 지배를, 일본은 미국의 필리핀 지배를 서로 인정했어요. 이어 영국(2차 영일 동맹)과 러시아(포츠머스 조약)도 일본의 지배권을 인정했어요.
  x: "일본의 가쓰라 다로 수상과 미국의 태프트 육군 장관이 1905년 7월 도쿄에서 만나 나눈 비밀 합의로, 태프트는 7월 29일 그 내용을 본국에 보고했어요. 정식 조약이라기보다 비밀 각서에 가까웠고, 약 20년 뒤인 1924년에야 세상에 알려졌어요. 일본은 이렇게 강대국들의 지지를 미리 얻어 둔 뒤 그해 11월 을사늑약을 강요했어요."

- id: eulsa
  n: 을사늑약 체결
  ds: '1905-11-17'
  c: 외교
  i: 3
  at: [126.973, 37.566]
  p: 경운궁 중명전
  pg: 179
  t: 일본이 군대로 궁궐을 둘러싸고 대한 제국의 외교권을 빼앗는 조약을 강제로 맺었어요. 고종은 끝까지 승인하지 않았어요.
  x: "일본은 미국·영국·러시아의 묵인을 얻은 뒤 이토 히로부미를 보내 조약을 강요했어요. 고종이 빠진 회의에서 이토가 대신들에게 찬반을 물었고, 참정대신 한규설 등은 반대했지만 박제순·이지용·이근택·이완용·권중현 다섯 대신이 찬성했어요(을사오적). 조약에 따라 서울에 통감을 두게 되었어요. 고종은 미국인 헐버트를 통해 자신은 이 조약에 동의한 적이 없다며 무효임을 알리려 했어요. '늑약'은 억지로 맺은 조약이라는 뜻이에요."

- id: siil
  n: 「시일야방성대곡」 게재
  ds: '1905-11-20'
  c: 민족운동
  i: 2
  at: [126.977, 37.570]
  p: 서울 (황성신문)
  pg: 179
  t: 장지연이 『황성신문』에 을사늑약의 부당함을 규탄하는 논설 「시일야방성대곡」을 실었어요. 민영환 등은 자결로 항거했어요.
  x: "'시일야방성대곡'은 '이날을 목 놓아 크게 운다'는 뜻이에요. 장지연은 이 글에서 일본의 국권 침탈과 조약에 찬성한 을사오적을 규탄하고 국민이 일어나기를 호소했어요. 이 일로 장지연은 일본 헌병대에 체포되어 65일 동안 갇혔고, 『황성신문』은 이듬해 2월까지 발행이 정지됐어요. 을사늑약에 맞서 조병세 등도 목숨을 끊었고, 민종식·최익현·신돌석 등은 의병을 일으켰어요."

- id: tonggambu
  n: 통감부 설치
  ds: '1906-02-01'
  c: 정치
  i: 3
  at: [126.985, 37.558]
  ap: 1
  p: 서울 남산
  pg: 179
  t: 이토 히로부미가 초대 통감으로 와서 대한 제국의 외교뿐 아니라 내정 전반에 간섭했어요.
  x: "통감은 일본 천황에 직속해 천황의 권한을 대신 행사할 만큼 지위가 높았어요. 외교 사무를 대신 맡았을 뿐 아니라 한국 정부에 행정을 요구하고, 관청의 명령을 정지·취소하거나 고위 관리 임명에 동의권을 행사했으며, 필요하면 일본군에 병력 사용도 명할 수 있었어요. 지방에는 개항장을 중심으로 이사청을 두었어요. 1910년 국권 피탈 뒤 통감부는 조선 총독부로 바뀌었어요."

- id: gukchae
  n: 국채 보상 운동
  ds: '1907-02'
  c: 민족운동
  i: 3
  at: [128.60, 35.87]
  p: 대구
  pg: 187
  t: 일본에 진 나랏빚 1,300만 원을 국민의 힘으로 갚자는 운동이 대구에서 시작돼 전국으로 퍼졌어요. 사람들은 담배를 끊고 패물을 냈지만 통감부의 방해로 실패했어요.
  x: "일본은 재정 고문 메가타를 통해 여러 차례 차관을 들여오게 해 대한 제국 재정을 일본에 묶어 두려 했어요. 대구 광문사의 김광제·서상돈이 운동을 제안했고, 서울의 국채 보상 기성회 등 '국채 보상'을 이름에 단 단체가 20여 개나 생겼어요. 지식인·상인은 물론 여성, 노동자, 인력거꾼, 기생, 백정까지 참여한 범국민 운동이었어요. 통감부가 양기탁을 보상금을 빼돌렸다는 혐의로 구속하면서(뒤에 무죄) 운동은 흔들리다 끝나고 말았어요."

- id: sinminhoe
  n: 신민회 조직
  ds: '1907-04'
  c: 민족운동
  i: 3
  at: [126.977, 37.570]
  ap: 1
  p: 서울
  pg: 179
  t: 안창호·양기탁 등이 비밀 결사로 신민회를 만들었어요. 대성 학교·오산 학교를 세우고 만주에 독립운동 기지를 만들었어요. 1911년 해체됐어요.
  x: "신민회는 나라를 되찾은 뒤 공화정 국가를 세우겠다는 목표를 내걸어, 입헌 군주제를 바랐던 독립 협회보다 한 걸음 나아갔어요. 일본의 탄압을 피하려고 회원을 엄선한 비밀 결사로 만들었어요. 교육·출판·산업 활동과 함께 청년학우회를 조직했고, 1911년 만주 삼원보에 독립군을 기르는 신흥 강습소를 열었어요. 일제가 총독 암살 음모를 꾸몄다며 사건을 조작해 105명에게 실형을 내린 105인 사건으로 해체됐어요."

- id: hague
  n: 헤이그 특사 파견
  ds: '1907-06-25'
  dt: "1907년 (6월 25일 헤이그 도착)"
  c: 외교
  i: 3
  at: [4.30, 52.08]
  p: 네덜란드 헤이그
  pg: 179
  t: "고종이 이준·이상설·이위종을 네덜란드 헤이그의 만국 평화 회의에 보내 을사늑약이 무효임을 알리려 했어요. 6월 25일 헤이그에 닿았지만 회의장에 들어가지 못했어요."
  x: "1907년 네덜란드 헤이그에서 열린 제2회 만국 평화 회의에 보낸 특사로, 이상설이 정사, 이준이 부사였고 외국어에 능통한 이위종이 함께했어요. 각국이 이미 을사늑약을 인정했다는 이유로 회의장에 들어가지 못하자, 이위종은 각국 기자들 앞에서 '한국의 호소'라는 연설로 한국의 사정을 알렸어요. 이준은 그곳에서 숨을 거두었어요. 외교적 성과는 작았지만 을사늑약이 무효임을 국제 사회에 알렸다는 의미가 있어요."

- id: gojong-abdication
  n: 고종 강제 퇴위
  ds: '1907-07-20'
  c: 정치
  i: 3
  at: [126.975, 37.566]
  p: 경운궁 (덕수궁)
  pg: 179
  t: 일본이 헤이그 특사를 구실로 고종을 강제로 물러나게 하고 순종을 세웠어요. 곧이어 한일 신협약(정미 7조약)으로 차관 정치를 시작했어요.
  x: "일본과 이완용 내각은 특사 파견의 책임을 물어 고종에게 물러나라고 강요했어요. 고종이 황태자에게 나랏일을 대신 맡게 한다는 조칙을 내리자, 일본은 서둘러 양위식을 열어 퇴위를 기정사실로 만들었어요. 나흘 뒤 맺은 한일 신협약으로 법령 제정과 고위 관리 임명에 통감의 승인을 받게 하고, 통감이 추천한 일본인을 한국 관리로 임명하게 했어요. 비밀 각서로 군대 해산도 정했고, 신문지법·보안법을 잇달아 만들어 언론과 집회를 억눌렀어요."

- id: army-disband
  n: 대한 제국 군대 해산
  ds: '1907-08-01'
  c: 전쟁
  i: 3
  at: [126.973, 37.560]
  ap: 1
  p: 서울 (시위대 병영, 남대문 일대)
  pg: 179
  t: 일본이 대한 제국 군대를 강제로 해산하자 시위대 대대장 박승환이 자결하고 군인들이 일본군과 싸웠어요. 해산된 군인들은 의병에 합류했어요.
  x: "일본은 한일 신협약의 비밀 각서에 따라 7월 31일 밤 군대 해산 조칙을 내리게 했어요. 8월 1일 군인들을 맨손 훈련을 한다고 속여 서울 훈련원에 모은 뒤 해산식을 열었고, 대대장 박승환이 자결하자 군인들은 무기고를 부수고 일본군과 4시간 넘게 시가전을 벌였어요. 지방 진위대도 차례로 해산되었는데, 원주 진위대의 민긍호 등은 의병장이 되어 싸웠어요. 해산 군인이 합류하면서 의병의 전투력이 크게 높아졌어요."

- id: dongcheok
  n: 동양 척식 주식회사 설립
  ds: '1908-12'
  c: 경제
  i: 1
  at: [126.985, 37.566]
  ap: 1
  p: 서울 을지로
  pg: 188
  t: 일본인의 이민과 토지 수탈을 돕기 위해 세운 회사예요. 토지 조사 사업 뒤 가장 큰 지주가 됐어요.
  x: "'척식'은 개척과 식민을 뜻하는 말로, 이름에서부터 식민지 경영을 위한 회사임이 드러나요. 일제 강점기 농민들은 대부분 비싼 소작료를 물고 언제 땅을 빼앗길지 모르는 불안 속에 살았는데, 동양 척식 주식회사 같은 대지주의 땅을 빌려 농사짓는 소작농도 많았어요."

- id: gando-convention
  n: 간도 협약
  ds: '1909-09-04'
  c: 외교
  i: 3
  at: [129.51, 42.89]
  ap: 1
  p: "간도 (협약의 대상 지역 · 맺은 곳은 청 베이징)"
  pg: 216
  t: 일본이 남만주 철도 부설권 등을 얻는 대가로 간도를 청의 영토로 인정하는 협약을 청과 마음대로 맺었어요.
  x: "간도는 1712년 세운 백두산정계비의 '토문강'을 어떻게 해석하느냐를 두고 조선과 청이 서로 자기 땅이라고 다투던 곳이에요. 대한 제국은 1902년 이범윤을 간도 시찰원으로 보내 그곳에 사는 우리 백성을 직접 관할하려 했고, 통감부도 1907년 간도에 파출소를 두었어요. 그러나 1909년 일본은 만주의 철도·탄광 이권을 얻는 대가로 간도를 청에 넘겼어요. 외교권을 빼앗긴 대한 제국을 빼고 맺은 협약이라 불법이라는 비판이 있어요."

- id: ahn-junggeun
  n: 안중근, 이토 히로부미 사살
  ds: '1909-10-26'
  c: 민족운동
  i: 3
  at: [126.63, 45.76]
  p: 하얼빈역
  pg: 179
  t: 안중근이 하얼빈역에서 초대 통감 이토 히로부미를 사살했어요. 뤼순 감옥에서 「동양 평화론」을 쓰다 1910년 순국했어요.
  x: "안중근은 학교를 세워 교육 운동을 펴고 국채 보상 운동에도 참여했어요. 뒤에 연해주로 건너가 의병 부대의 참모중장으로 싸웠고, 1909년 동지들과 손가락을 끊어 이토 처단을 맹세했어요(단지 동맹). 이토는 하얼빈에서 러시아 재무 장관과 회담한 뒤 열차에서 내렸다가 총에 맞았어요. 안중근은 재판에서 자신은 의병 참모중장으로서 적을 처단한 것이니 전쟁 포로로 대우하라고 주장했어요."

- id: annexation
  n: 국권 피탈
  ds: '1910-08-29'
  c: 정치
  i: 3
  at: [126.987, 37.558]
  ap: 1
  p: 서울 남산 통감 관저
  pg: 179
  t: 일본이 8월 22일 강제로 조약을 맺고 29일 공포해 대한 제국을 식민지로 만들었어요.
  x: "8월 16일 통감 데라우치가 총리대신 이완용에게 몰래 조약안을 내밀었고, 22일 두 사람이 서명했어요. 일본은 반발을 막으려고 체결 사실을 숨기고 원로 대신들을 가둔 채, 29일 순종의 이름으로 나라를 넘긴다는 조칙을 내리게 했어요. 조약 제1조는 한국의 모든 통치권을 완전히, 영구히 일본에 넘긴다고 정했어요. 통감부 대신 조선 총독부가 세워져 데라우치가 초대 총독이 되었고, 이 일을 '경술국치'라고도 불러요."

# ───── R2 검수에서 더한 사건 (두 교과서 대조) ─────

- id: daejeon-hoetong
  n: "흥선 대원군, 비변사 축소·『대전회통』 편찬"
  d: 1865
  c: "정치"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  t: "흥선 대원군은 세도 정치의 바탕이던 비변사의 힘을 줄이고 의정부의 기능을 되살렸어요. 1865년에는 법전인 『대전회통』을 펴내 통치 체제를 정비했어요."
  x: "비변사는 원래 국방 문제를 의논하던 임시 기구였지만, 조선 후기에 나랏일 전체를 맡게 되면서 세도 가문이 권력을 휘두르는 발판이 되었어요. 흥선 대원군은 1864년 비변사에는 군사 업무만 남기고 나머지 나랏일은 의정부가 맡게 했고, 결국 비변사를 사실상 없앴어요. 군사를 전담하는 삼군부는 병인양요 뒤인 1868년에 다시 세웠어요. 왕권을 누르던 기구를 정리하고 법전을 새로 펴내 통치 질서를 다시 세우려 한 개혁이에요."

- id: dajokan
  n: "일본 태정관 지령"
  d: 1877
  c: "외교"
  i: 2
  at: [139.75, 35.68]
  p: "일본 도쿄 (대상: 울릉도·독도)"
  pg: 180
  t: "일본 최고 행정 기관인 태정관이 울릉도와 독도는 일본과 관계없다고 지시했어요. 일본 스스로 독도가 자기 땅이 아님을 인정한 기록이에요."
  x: "지령에서 '죽도'는 울릉도, '그 외의 한 섬'은 독도를 가리켜요. 비상 교과서에는 다른 일본 기록도 실려 있어요. 1667년 『은주시청합기』는 일본의 북쪽 경계를 오키섬으로 삼아 울릉도와 독도를 일본 땅에서 뺐고, 1785년 「삼국접양지도」는 울릉도와 독도를 조선과 같은 색으로 칠하고 '조선의 것'이라고 적었어요. 그런데도 일본은 1905년 독도를 '주인 없는 섬'이라며 몰래 편입했어요."

- id: sijeon-strike
  n: "시전 상인의 철시 투쟁"
  d: 1890
  dt: "1890년 무렵"
  c: "경제"
  i: 1
  at: [126.985, 37.57]
  p: "한양 종로"
  pg: 187
  t: "청·일본 상인이 한양에 들어와 장사하자 시전 상인들이 가게 문을 닫고 외국 상인을 내보내 달라고 요구했어요."
  x: "1882년 조청 상민 수륙 무역 장정으로 청 상인이 서울에 가게를 열 수 있게 되었고, 이후 일본과 서양 상인들도 비슷한 권리를 얻었어요. 1884년부터 청일 전쟁 무렵까지는 청과 일본 상인이 조선 시장을 두고 치열하게 경쟁했어요. 오랫동안 서울의 상업을 쥐고 있던 시전 상인들은 큰 타격을 입자 가게 문을 닫고 항의하는 철시로 맞섰어요. 방곡령, 이권 수호 운동과 함께 경제적 구국 운동의 하나로 꼽혀요."

- id: concessions
  n: "열강의 이권 침탈"
  d: 1896
  dt: "1896년 이후"
  c: "경제"
  i: 2
  at: [125.83, 40.03]
  ap: 1
  p: "운산 금광 등 전국"
  pg: 187
  t: "아관 파천 뒤 러시아·미국·일본 등이 최혜국 대우를 내세워 광산 채굴권, 철도 부설권, 삼림 채벌권 등을 빼앗아 갔어요."
  x: "최혜국 대우는 한 나라에 준 가장 유리한 조건을 조약을 맺은 다른 나라에도 주는 규정이라, 한 나라가 이권을 얻으면 다른 나라들도 줄줄이 요구할 수 있었어요. 비상 교과서 지도를 보면 러시아는 압록강·두만강 유역과 울릉도의 삼림 채벌권을, 미국은 운산 금광과 서울의 전등·전화·전차 부설권을 얻었고, 영국·독일·일본도 광산 채굴권을 가져갔어요. 철도 부설권은 경인선·경의선처럼 처음엔 미국·프랑스가 얻었다가 결국 일본으로 넘어갔어요."

- id: jeolyeongdo
  n: "독립 협회, 절영도 조차 요구 저지"
  d: 1898
  c: "경제"
  i: 1
  at: [129.07, 35.08]
  p: "부산 절영도 (영도)"
  pg: 187
  t: "러시아가 부산 절영도를 석탄 기지로 빌려 달라고 하자 독립 협회가 반대 운동을 벌여 막아 냈어요."
  x: "1898년 2월 독립 협회 회원 135명은 연명 상소를 올려 재정·군사·인사권까지 외국에 휘둘리는 현실을 비판하고 자주독립을 지키자고 촉구했어요. 이어 3월에는 만민 공동회를 열어 러시아의 군사 교관과 재정 고문을 철수시켰어요. 절영도는 지금의 부산 영도로, 이곳에서 기른 명마가 너무 빨리 달려 그림자도 볼 수 없다는 데서 붙은 이름이에요. 조차는 다른 나라의 땅을 일정 기간 빌려 쓰는 것을 말해요."

- id: boanhoe
  n: "보안회, 황무지 개간권 요구 저지"
  d: 1904
  c: "경제"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 187
  t: "일본이 황무지를 개간할 권리를 요구하자 보안회가 반대 운동을 벌여 철회시켰어요."
  x: "일본은 러일 전쟁 중에 대한 제국의 넓은 황무지를 개간할 권리를 요구했는데, 이는 개간을 핑계로 우리 국토를 차지하려는 것이라는 반발을 샀어요. 보안회의 반대 운동은 독립 협회의 절영도 조차 저지와 함께 열강의 이권 침탈에 맞서 경제적 자주권을 지키려 한 대표적인 활동으로 교과서에 나와요."

- id: daehan-maeil
  n: "『대한매일신보』 창간"
  d: 1904
  c: "민족운동"
  i: 1
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 179
  t: "양기탁과 영국인 베델이 『대한매일신보』를 세웠어요. 일본의 침략을 비판하고 국채 보상 운동을 널리 알렸어요."
  x: "발행인이 영국인 베델이었기 때문에 일본군의 사전 검열을 받지 않을 수 있었고, 그래서 일본이 '폭도'라고 쓰도록 강요하던 의병의 활동도 사실대로 보도했어요. 국한문판과 영문판, 순한글판을 함께 펴냈고, 신민회도 이 신문을 기관지처럼 활용했어요. 통감부는 영국 측에 요구해 베델이 재판을 받게 하고, 양기탁을 국채 보상금을 빼돌렸다는 혐의로 구속했지만 양기탁은 무죄로 풀려났어요. 국권 피탈 뒤에는 '대한'을 뗀 『매일신보』가 되어 조선 총독부의 기관지로 바뀌었어요."

- id: judicial-police
  n: "사법권·경찰권 박탈"
  d: 1909
  e: 1910
  dt: "1909년 사법권 · 1910년 경찰권"
  c: "정치"
  i: 2
  at: [126.98, 37.57]
  ap: 1
  p: "한양"
  pg: 179
  t: "군대를 해산시킨 일본은 1909년 기유각서로 사법권을, 1910년에는 경찰권까지 빼앗았어요. 그리고 곧 국권을 빼앗았어요."
  x: "1907년 한일 신협약 뒤 일본은 한국 경찰을 일본 경찰에 통합해 나갔어요. 기유각서로 재판하는 권한을 넘겨받았고, 1910년 6월에는 각서를 주고받아 일반 경찰권까지 장악했어요. 외교권·군대·사법권·경찰권을 차례로 잃은 대한 제국은 스스로를 지킬 수단이 없어졌고, 두 달 뒤 국권을 빼앗겼어요."

