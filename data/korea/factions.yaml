- era: colonial
  name: 민족 운동의 여러 갈래
  from: 1919
  to: 1945
  pg: [182, 183]
  intro: 3·1 운동 이후 민족 운동은 민족주의 계열과 사회주의 계열로 나뉘었어요. 일부 민족주의자가 자치론을 펴자 비타협적 민족주의 계열과 사회주의 계열이 힘을 합쳐 신간회를 만들었어요.
  groups:
    - {id: imsi, n: 대한민국 임시 정부, from: 1919, to: 1945,
       desc: '3·1 운동을 계기로 상하이에 세운 민주 공화제 정부예요. 1930년대 김구의 한인 애국단, 1940년 한국 광복군으로 이어졌어요.'}
    - {id: minjok, n: 민족주의 계열, from: 1919, to: 1924,
       desc: '민족의 실력을 키워 독립을 이루자며 물산 장려 운동, 민립 대학 설립 운동, 문맹 퇴치 운동 등을 벌였어요.'}
    - {id: tahyeop, n: 타협적 민족주의 (자치론), parent: minjok, from: 1924, to: 1945,
       desc: '일제의 지배를 인정하는 범위 안에서 자치를 얻자고 주장했어요. 많은 사람이 뒤에 친일로 돌아섰어요.'}
    - {id: bitahyeop, n: 비타협적 민족주의, parent: minjok, from: 1924, to: 1945,
       desc: '자치론에 반대하고 완전한 독립을 주장했어요.'}
    - {id: sahoe, n: 사회주의 계열, from: 1920, to: 1945,
       desc: '3·1 운동을 전후해 청년·지식인 사이에 퍼졌어요. 농민·노동자·학생 운동을 이끌었어요.'}
    - {id: mujang, n: 무장 독립 투쟁 (독립군·의열단·조선 의용대), from: 1919, to: 1945,
       desc: '만주의 독립군(봉오동·청산리, 3부, 한국 독립군·조선 혁명군), 의열단(1919, 김원봉), 중국 관내의 조선 의용대(1938)가 일본군과 일제 기관에 맞서 싸웠어요. 일부는 한국 광복군에 합류했어요.'}
    - {id: singan, n: 신간회, parents: [bitahyeop, sahoe], from: 1927, to: 1931,
       desc: '비타협적 민족주의 계열과 사회주의 계열이 힘을 합친 최대의 민족 협동 단체예요. 광주 학생 항일 운동을 지원했고 1931년 해소됐어요.'}
  marks:
    - {y: 1919, n: 3·1 운동, kind: 기타}
    - {y: 1924, n: 자치론 대두, kind: 분열}
    - {y: 1926, n: 6·10 만세 운동 (함께 준비), kind: 기타}
    - {y: 1927, n: 신간회 창립, kind: 기타}
    - {y: 1931, n: 신간회 해소, kind: 분열}

- era: liberation
  name: 광복 이후 정치 세력
  from: 1945
  to: 1950
  pg: [185, 205]
  intro: 광복 뒤 새 나라를 세우는 방법을 두고 좌익과 우익이 맞섰고, 중도 세력은 좌우 합작으로 통일 정부를 세우려 했어요. 결국 남한에서는 단독 정부가 세워졌어요.
  groups:
    - {id: jwaik, n: 좌익 (조선 공산당 등), from: 1945, to: 1948,
       desc: '처음에는 신탁 통치에 반대했지만 모스크바 3국 외무 장관 회의 결정을 지지하는 쪽으로 바꿨어요. 미군정의 탄압을 받았어요.'}
    - {id: uik, n: 우익, from: 1945, to: 1948,
       desc: '신탁 통치 반대 운동을 이끌었어요(이승만, 김구, 한국 민주당 등).'}
    - {id: jungdo, n: 중도 (여운형·김규식), from: 1945, to: 1947,
       desc: '조선 건국 준비 위원회를 이끈 여운형과, 여운형과 함께 좌우 합작 운동에 나선 김규식 등이에요. 좌우 대립을 막으려 했어요.'}
    - {id: jwau, n: 좌우 합작 운동, parents: [jungdo], from: 1946, to: 1947,
       desc: '좌우 합작 위원회를 만들어 통일 정부를 세우려 했지만, 여운형이 암살되고 미·소 대립이 심해지며 실패했어요.'}
    - {id: danjeong, n: 단독 정부 수립 세력 (이승만·한국 민주당), parent: uik, from: 1948, to: 1950, rule: [[1948, 1950]],
       desc: '선거가 가능한 남한만이라도 먼저 정부를 세우자고 했어요. 5·10 총선거로 대한민국 정부를 세웠어요.'}
    - {id: bukhan, n: 북한 정권 (김일성 중심), from: 1946, to: 1950,
       desc: '소련군의 지원 아래 김일성이 북조선 임시 인민 위원회(1946)를 이끌며 토지 개혁 등을 실시했고, 1948년 9월 조선 민주주의 인민 공화국을 세웠어요.'}
    - {id: hyeopsang, n: 남북 협상파 (김구·김규식), parent: uik, from: 1948, to: 1949,
       desc: '분단을 막으려고 1948년 4월 평양에 가서 북측 지도자와 협상했지만 성과를 거두지 못했어요. 김구는 1949년 암살됐어요.'}
  marks:
    - {y: 1945, n: 모스크바 3국 외무 장관 회의, kind: 분열}
    - {y: 1946, n: 좌우 합작 위원회, kind: 기타}
    - {y: 1947, n: 여운형 암살, kind: 정변}
    - {y: 1948, n: 남북 협상·5·10 총선거, kind: 분열}
