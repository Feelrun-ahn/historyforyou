# 세력 흐름 (한반도 안의 정치 세력이 갈라지고 이어진 모습)
# 기준: 중학교 역사② (비상교육 2020) — 고려 III-1·III-3, 조선 IV-2·V-1, 근대 VI-1, 일제 강점기 VI-1, 광복 이후 VI-4
# era 마다 그림 하나. groups 는 위에서 아래로 그릴 순서.
#   parent/parents: 어디서 갈라져 나왔는지 (갈라진 해 = from)
#   rule: 그 세력이 정권을 잡았던 기간 [[시작, 끝], ...]
#   marks: 세력 관계를 바꾼 사건 (y, n, kind: 사화·환국·예송·정변·분열·개혁·기타)

- era: goryeo
  name: 고려의 지배 세력
  from: 918
  to: 1392
  pg: [79, 82, 96, 98]
  intro: 고려는 호족 연합으로 시작해 문벌 귀족, 무신, 권문세족 순으로 지배 세력이 바뀌었고, 마지막에는 신진 사대부와 신흥 무인 세력이 조선을 세웠어요.
  groups:
    - {id: hojok, n: 호족, from: 900, to: 981, rule: [[918, 975]],
       desc: '지방에서 성주·장군을 자처하던 세력이에요. 왕건은 호족과 혼인하고 관직·토지를 주어 포용했어요. 광종은 노비안검법과 과거제로 호족의 힘을 눌렀어요.'}
    - {id: munbeol, n: 문벌, from: 981, to: 1170, rule: [[981, 1170]],
       desc: '여러 대에 걸쳐 높은 관리를 낸 가문(문벌)들이에요. 과거와 음서로 관직을 독점하고 공음전을 받았으며, 왕실과 혼인해 권력을 키웠어요(경원 이씨 등).'}
    - {id: gaegyeong, n: 개경 세력 (김부식), parent: munbeol, from: 1126, to: 1170,
       desc: '개경의 문벌 세력이에요(미래엔 교과서: 개경파). 금에 사대하자고 했고 김부식이 묘청의 난을 진압했어요.'}
    - {id: seogyeong, n: 서경 세력 (묘청·정지상), parent: munbeol, from: 1126, to: 1136,
       desc: '서경 출신 세력이에요(미래엔 교과서: 서경파). 풍수지리설을 내세워 서경으로 도읍을 옮기고 황제를 칭하며 금을 정벌하자고 주장했어요. 1135년 서경에서 난을 일으켰다가 진압됐어요.'}
    - {id: musin, n: 무신, from: 1170, to: 1270, rule: [[1170, 1270]],
       desc: '무신 정변으로 정권을 잡았어요. 처음에는 중방을 중심으로 권력자가 자주 바뀌다가, 최충헌 이후 교정도감을 둔 최씨 정권이 4대 60여 년 동안 이어졌어요.'}
    - {id: gwonmun, n: 권문세족, from: 1270, to: 1391, rule: [[1270, 1388]],
       desc: '원 간섭기에 원과 가까워 권력을 잡은 세력이에요. 높은 관직을 독점하고 음서로 지위를 이으며 넓은 농장을 차지했어요.'}
    - {id: sinjin, n: 신진 사대부, from: 1340, to: 1388,
       desc: '하급 관리나 향리 집안 출신으로 과거로 관직에 나온 성리학자들이에요. 공민왕의 개혁에 참여하고 권문세족과 불교의 폐단을 비판했어요. 친명 외교를 주장했어요.'}
    - {id: onkeon, n: 온건파 사대부 (이색·정몽주), parent: sinjin, from: 1388, to: 1392,
       desc: '고려 왕조를 유지하면서 점진적으로 개혁하자고 했어요. 정몽주가 제거되며 힘을 잃었어요.'}
    - {id: geupjin, n: 급진파 사대부 (정도전·조준), parent: sinjin, from: 1388, to: 1392, rule: [[1388, 1392]],
       desc: '고려 왕조를 바꿔 새 나라를 세우자고 했어요. 이성계와 손잡고 과전법을 실시한 뒤 조선을 세웠어요.'}
    - {id: sinheung, n: 신흥 무인 세력 (최영·이성계), from: 1359, to: 1392,
       desc: '홍건적과 왜구를 물리치며 백성의 신망을 얻은 무장들이에요. 위화도 회군으로 이성계가 실권을 잡았고, 최영은 제거됐어요.'}
  marks:
    - {y: 1126, n: 이자겸의 난, kind: 정변}
    - {y: 1135, n: 묘청의 난 (서경 천도 운동), kind: 정변}
    - {y: 1170, n: 무신 정변, kind: 정변}
    - {y: 1196, n: 최충헌 집권, kind: 정변}
    - {y: 1258, n: 최씨 정권 붕괴, kind: 정변}
    - {y: 1270, n: 개경 환도 (무신 정권 끝), kind: 기타}
    - {y: 1356, n: 공민왕의 반원 개혁, kind: 개혁}
    - {y: 1388, n: 위화도 회군, kind: 정변}
    - {y: 1391, n: 과전법, kind: 개혁}

- era: joseon
  name: 조선의 사림과 붕당
  from: 1450
  to: 1864
  pg: [123, 124, 126, 146, 147, 149]
  intro: 훈구와 사림의 대립(사화)을 거쳐 사림이 정권을 잡은 뒤, 사림은 동인·서인으로 나뉘어 붕당을 이루었어요. 붕당은 다시 남인·북인, 노론·소론으로 갈라졌고, 영조·정조의 탕평 정치 뒤에는 몇몇 가문이 권력을 독차지하는 세도 정치가 펼쳐졌어요.
  groups:
    - {id: hungu, n: 훈구, from: 1453, to: 1575, rule: [[1453, 1567]],
       desc: '세조의 즉위를 도운 공신(한명회 등)과 왕실의 외척이에요. 많은 토지와 노비를 가지고 고위 관직을 차지했어요.'}
    - {id: sarim, n: 사림, from: 1470, to: 1575, rule: [[1567, 1575]],
       desc: '지방에서 성리학을 연구하던 학자들이에요. 성종 때 김종직 등이 3사에 들어와 훈구를 비판했고, 네 차례 사화를 겪은 뒤 선조 때 정권을 잡았어요.'}
    - {id: dongin, n: 동인, parent: sarim, from: 1575, to: 1591, rule: [[1575, 1589]],
       desc: '훈구 세력 처리 문제(미래엔 교과서: 외척의 정치 참여 문제)와 이조 전랑 자리를 두고 김효원을 지지한 세력이에요. 훈구를 철저히 배척하자고 했고, 이황·조식의 제자가 많았어요.'}
    - {id: seoin, n: 서인, parent: sarim, from: 1575, to: 1683, rule: [[1589, 1591], [1623, 1674], [1680, 1683]],
       desc: '심의겸을 지지한 세력으로 이이·성혼의 제자가 많았어요. 인조반정으로 정권을 잡았어요.'}
    - {id: namin, n: 남인, parent: dongin, from: 1591, to: 1863, rule: [[1591, 1598], [1674, 1680], [1689, 1694]],
       desc: '정철 처벌 문제로 동인이 나뉠 때 온건한 쪽이에요(이황의 제자 중심). 예송과 환국 때 서인과 번갈아 집권했고, 정조 때 채제공 등이 다시 등용됐어요. 천주교를 믿은 학자가 많아 신유박해 때 큰 타격을 입었어요.'}
    - {id: bugin, n: 북인, parent: dongin, from: 1591, to: 1623, rule: [[1598, 1623]],
       desc: '강경한 쪽으로 조식의 제자가 많았어요. 광해군과 함께 전쟁 복구와 중립 외교를 했지만 인조반정으로 몰락했어요.'}
    - {id: noron, n: 노론, parent: seoin, from: 1683, to: 1863, rule: [[1683, 1689], [1694, 1721]],
       desc: '남인을 강하게 처벌하자는 송시열 중심의 서인이에요. 숙종 때 소론과 정권을 다퉜고, 영조 이후 가장 큰 세력이었어요.'}
    - {id: soron, n: 소론, parent: seoin, from: 1683, to: 1863, rule: [[1683, 1689], [1694, 1724]],
       desc: '남인 처벌에 온건했던 윤증 중심의 서인이에요. 숙종 때는 노론과 함께 또는 번갈아 정권에 참여했고, 경종 때(1721~1724) 노론을 몰아내고 정권을 잡았어요.'}
    - {id: tangpyeong, n: 탕평파 (왕 중심), from: 1724, to: 1800, rule: [[1724, 1800]],
       desc: '영조는 노론·소론의 온건파를 고루 쓰고, 정조는 노론·소론에 남인까지 등용해 붕당의 다툼을 누르고 왕권을 강화했어요.'}
    - {id: byeokpa, n: 벽파, parent: noron, from: 1780, to: 1805, rule: [[1800, 1805]],
       desc: '임오화변(1762)에 대한 입장 차이에서 비롯되어 정조 때 갈라졌어요. 사도 세자의 죽음이 옳았다고 본 쪽이에요(노론 강경파 중심). 순조 즉위 뒤 정순 왕후와 함께 정권을 잡고 신유박해를 일으켰어요.'}
    - {id: sipa, n: 시파, parent: noron, from: 1780, to: 1805,
       desc: '사도 세자를 동정한 쪽으로 정조를 지지했어요. 노론 일부와 남인·소론이 섞여 있었어요.'}
    - {id: sedo, n: 세도 가문 (안동 김씨·풍양 조씨), parent: sipa, from: 1800, to: 1863, rule: [[1805, 1863]],
       desc: '순조의 장인 김조순 이후 안동 김씨와 풍양 조씨 같은 왕실 외척 가문이 비변사와 요직을 차지하고 60여 년 동안 권력을 독점했어요.'}
  marks:
    - {y: 1453, n: 계유정난, kind: 정변}
    - {y: 1498, n: 무오사화, kind: 사화}
    - {y: 1504, n: 갑자사화, kind: 사화}
    - {y: 1506, n: 중종반정, kind: 정변}
    - {y: 1519, n: 기묘사화, kind: 사화}
    - {y: 1545, n: 을사사화, kind: 사화}
    - {y: 1575, n: 동인·서인 분당, kind: 분열}
    - {y: 1589, n: 기축옥사, kind: 사화}
    - {y: 1591, n: 남인·북인 분열, kind: 분열}
    - {y: 1623, n: 인조반정, kind: 정변}
    - {y: 1659, n: 1차 예송 (기해예송), kind: 예송}
    - {y: 1674, n: 2차 예송 (갑인예송), kind: 예송}
    - {y: 1680, n: 경신환국, kind: 환국}
    - {y: 1683, n: 노론·소론 분열, kind: 분열}
    - {y: 1689, n: 기사환국, kind: 환국}
    - {y: 1694, n: 갑술환국, kind: 환국}
    - {y: 1721, n: 신임옥사 (1721~1722), kind: 사화}
    - {y: 1742, n: 탕평비 건립, kind: 개혁}
    - {y: 1762, n: 임오화변 (사도 세자의 죽음), kind: 기타}
    - {y: 1780, n: 시파·벽파 분립, kind: 분열}
    - {y: 1801, n: 신유박해, kind: 사화}

- era: modern
  name: 개항기의 정치 세력
  from: 1860
  to: 1910
  pg: [175, 176, 178]
  intro: 흥선 대원군의 통상 수교 거부 정책 이후 개화 정책을 둘러싸고 개화파와 위정척사파가 맞섰어요. 개화파는 개혁의 속도와 방법에 따라 온건 개화파와 급진 개화파로 나뉘었어요.
  groups:
    - {id: daewongun, n: 흥선 대원군 세력, from: 1863, to: 1898, rule: [[1863, 1873]],
       desc: '고종의 아버지 흥선 대원군이 왕권 강화와 통상 수교 거부 정책을 폈어요. 임오군란 때 잠시 다시 권력을 잡았다가 청으로 끌려갔어요.'}
    - {id: minssi, n: 민씨 정권, from: 1873, to: 1895, rule: [[1873, 1894]],
       desc: '고종의 친정 이후 명성 황후의 친척들이 요직을 차지했어요. 개항과 개화 정책을 추진했고, 임오군란 뒤에는 청에 기댔어요.'}
    - {id: wijeong, n: 위정척사파, from: 1860, to: 1910,
       desc: '성리학 질서를 지키고 서양·일본의 문물을 배척하자는 유생들이에요(이항로·최익현 등). 통상 반대, 개항 반대, 개화 반대 운동을 거쳐 항일 의병으로 이어졌어요.'}
    - {id: gaehwa, n: 개화파, from: 1870, to: 1882,
       desc: '박규수 등의 영향을 받아 외국 문물을 받아들여 나라를 부강하게 하자는 세력이에요(김옥균·박영효·김홍집 등).'}
    - {id: onkeon-gaehwa, n: 온건 개화파 (김홍집·김윤식·어윤중), parent: gaehwa, from: 1882, to: 1896, rule: [[1894, 1896]],
       desc: '청과의 관계를 유지하면서 동양의 도덕은 지키고 서양의 기술만 받아들이자는 쪽이에요(동도서기). 갑오개혁을 이끌었어요.'}
    - {id: geupjin-gaehwa, n: 급진 개화파 (김옥균·박영효·서광범), parent: gaehwa, from: 1882, to: 1895, rule: [[1884, 1884], [1894, 1895]],
       desc: '청의 간섭을 끊고 일본 메이지 유신처럼 제도까지 빠르게 바꾸자는 쪽이에요. 1884년 갑신정변을 일으켰다가 3일 만에 실패했어요. 2차 갑오개혁 때(1894년 말~1895년)는 일본에서 돌아온 박영효가 김홍집과 함께 내각을 이끌었어요.'}
    - {id: donghak-army, n: 동학 농민군, from: 1894, to: 1895,
       desc: '탐관오리 처벌과 신분 차별 폐지, 외세 배척을 내세웠어요. 일부 요구는 갑오개혁에 반영됐어요.'}
    - {id: dongnip-hyeop, n: 독립 협회, parent: geupjin-gaehwa, from: 1896, to: 1898,
       desc: '서재필과 개화파 관료들이 만들었어요. 자주 국권·자유 민권·자강 개혁을 내세웠고, 보수 세력의 모함으로 해산됐어요.'}
    - {id: gojong-gov, n: 고종과 대한 제국 정부, from: 1896, to: 1907, rule: [[1896, 1905]],
       desc: '아관 파천 이후 고종이 황제권을 강화하며 광무개혁을 추진했어요.'}
    - {id: uibyeong, n: 항일 의병, parent: wijeong, from: 1895, to: 1910,
       desc: '을미사변·단발령(1895), 을사늑약(1905), 고종 퇴위와 군대 해산(1907)을 계기로 일어났어요. 유생 중심에서 신돌석 같은 평민 의병장과 해산 군인이 합류하며 커졌고, 1910년대에는 만주·연해주로 옮겨 독립군이 됐어요.'}
    - {id: aeguk, n: 애국 계몽 운동 (신민회 등), parent: dongnip-hyeop, from: 1905, to: 1910,
       desc: '교육과 산업을 일으켜 실력을 키워 국권을 되찾자는 운동이에요. 신민회(1907, 안창호·양기탁)는 대성 학교·오산 학교를 세우고 국외에 독립운동 기지를 만들었어요.'}
    - {id: chinil, n: 친일 세력, from: 1904, to: 1910, rule: [[1905, 1910]],
       desc: '을사늑약 이후 이완용 등 일본에 협력한 관료들이 통감부 아래에서 정권을 잡았어요.'}
  marks:
    - {y: 1873, n: 고종 친정, kind: 정변}
    - {y: 1881, n: 영남 만인소, kind: 기타}
