  notes: ['비상 119에는 조직도 없이 본문과 지도(❷)만 있어서, 미래엔 110 그림 ''지방 행정 조직과 유향소''의 관찰사 → 수령 → 향리(6방), 유향소 구성을 따랐어요.', '유향소는 임진왜란 이후 흔히 ''향청''이라 불렀어요(한국민족문화대백과사전 ''향청'', 심화).', 경재소는 두 교과서에 없는 심화 내용이에요(한국민족문화대백과사전 '경재소')., 조선 후기에는 향촌 질서가 흔들리면서 오히려 향리와 수령의 권한이 강해지고 양반의 지배력이 약해졌어요(비상 166)., 태종 때(1413) 전국을 8도로 나누었어요.]
- id: joseon-late-politics
