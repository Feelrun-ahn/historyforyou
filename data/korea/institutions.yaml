    kids: [황주목, 광주목, 충주목, 청주목, 상주목, 진주목, 전주목, 나주목]
  - id: jugunhyeon
    n: 주·군·현
    p: odo
    s: 5도와 양계 아래에 둔 고을이에요.
    kids:
