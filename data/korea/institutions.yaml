# 형식: data/korea/themes/README.md 2절. deep: 1 은 교과서에 없는 심화 내용이고 web 에 출처가 있어요.

- id: gojoseon-society
  n: 고조선의 사회와 8조법
  era: 선사·고조선
  f: -2333
  t: -108
  src:
  - {b: 비상, p: 16, fig: 본문}
  - {b: 비상, p: 17, fig: 자료 고조선의 법}
  - {b: 미래엔, p: 12, fig: 본문}
  - {b: 미래엔, p: 13, fig: 고조선의 「8조법」 분석하기}
  d: 고조선은 제사와 정치를 함께 맡은 지배자가 다스린 제정일치 사회에서 출발했어요. 점차 왕위를 이어받고 여러 관직을 두었으며, 지배층은 8개 조항의 법으로 사회 질서를 지켰어요.
  nodes:
  - {id: king, n: 왕 (단군왕검), s: '''단군''은 제사장, ''왕검''은 정치 지도자라는 뜻이에요. 기원전 4세기경에는 ''왕''이라는 칭호를 썼어요.'}
  - id: officials
    n: 관직
    p: king
    s: 지배층이 관직을 맡아 나라를 다스렸어요.
    kids: [상, 대부, 장군]
  - id: law
    n: 8조법
    p: king
    s: 8개 조항 가운데 3개 조항이 중국 역사서 『한서』에 전해요.
    kids:
    - {n: 사람을 죽인 자는 사형, s: 사람의 생명을 중하게 여겼어요.}
    - {n: 남을 다치게 한 자는 곡물로 갚음, s: 농경 사회였음을 알 수 있어요.}
    - {n: 도둑질한 자는 노비로 삼음, s: 사유 재산과 노비 같은 신분이 있었어요. 벌을 면하려면 50만 전을 내야 했어요.}
  notes: [관직 이름(상·대부·장군)은 미래엔 13쪽에만 나와요. 비상 16쪽은 '지배층은 관직을 맡았다'고만 적었어요., 위만 집권(기원전 194) 이후의 변화는 넣지 않았어요.]
- id: yeoreo-nara-politics
  n: 여러 나라의 정치와 사회
  era: 여러 나라
  f: -200
  t: 494
  src:
  - {b: 비상, p: 20, fig: 사료로 살펴보는 부여의 정치 제도와 법}
  - {b: 비상, p: 21, fig: 본문}
  - {b: 비상, p: 22, fig: 본문}
  - {b: 미래엔, p: 16, fig: 부여의 사회 모습}
  - {b: 미래엔, p: 17, fig: 본문}
  - {b: 미래엔, p: 18, fig: 여러 나라의 풍습}
  d: 철기 문화를 바탕으로 만주와 한반도에 여러 나라가 생겼어요. 부여와 초기 고구려는 왕 아래 '가'들이 자기 지역을 다스린 연맹 왕국이었고, 옥저·동예는 왕 없이 군장이, 삼한은 정치 지배자와 제사장이 따로 다스렸어요.
  nodes:
  - {id: buyeo, n: 부여, s: 쑹화강 유역의 연맹 왕국이에요. 왕권이 약해 흉년이 들면 왕이 책임을 지기도 했어요.}
  - {id: buyeo-king, n: 왕, p: buyeo, s: 가장 힘센 부족의 군장이 왕이 되어 중앙을 다스렸어요.}
  - id: buyeo-ga
    n: 가(加)
    p: buyeo-king
    s: 가축 이름을 딴 관직이에요. 왕과 함께 나라의 중요한 일을 의논했어요.
    kids: [마가, 우가, 저가, 구가]
  - {id: sachuldo, n: 사출도, p: buyeo-ga, s: '여러 가가 따로 다스린 지역으로, 수도를 중심으로 동·서·남·북 큰길을 따라 나눈 구역으로 추정해요.'}
  - {id: goguryeo, n: 고구려 (초기), s: 다섯 부족(5부)이 연합한 연맹 왕국이었어요.}
  - {id: goguryeo-king, n: 왕, p: goguryeo, s: 5부 가운데 계루부에서 왕이 나왔어요.}
  - id: goguryeo-ga
    n: 여러 가(加)
    p: goguryeo-king
    s: 왕 아래의 지배층과 관직이에요.
    kids: [상가, 대가, 패자, 고추가]
  - {id: jega, n: 제가 회의, p: goguryeo, s: 왕과 부족 대표들이 모여 나라의 중요한 일을 결정했어요.}
  - {id: okjeo-dongye, n: 옥저·동예, s: 왕이 없었고 고구려의 간섭을 받아 강한 나라로 자라지 못했어요.}
  - {id: eupgun, n: 읍군·삼로, p: okjeo-dongye, s: 각 지역을 다스린 군장이에요.}
  - {id: samhan, n: 삼한 (마한·진한·변한), s: 여러 소국으로 이루어졌어요.}
  - {id: mokji, n: 목지국의 군장, p: samhan, s: 마한 목지국의 군장이 삼한을 대표했어요.}
  - {id: sinji, n: 신지·읍차, p: samhan, s: 소국을 다스린 군장(정치 지배자)이에요.}
  - {id: cheongun, n: 천군, p: samhan, s: '하늘에 제사를 지낸 제사장으로, 정치 지배자와 따로 있었어요.'}
  - {id: sodo, n: 소도, p: cheongun, s: '천군이 제사를 지낸 신성한 곳으로, 죄인이 도망쳐 와도 잡아갈 수 없었어요.'}
  notes: ['고구려 왕 아래 관직은 비상 21쪽에 ''상가, 대가'', 미래엔 16쪽에 ''상가, 패자, 고추가''로 나와 둘을 합쳤어요.', 사출도의 모습(동·서·남·북 구역)은 비상 20쪽 말풍선의 추정이에요., f·t 는 대략값이에요(여러 나라 등장 기원전 2세기 전후 ~ 부여가 고구려에 통합된 494년).]
