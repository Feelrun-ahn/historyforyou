  notes: ['두 교과서 모두 그림 없이 본문으로만 설명해요(비상 80쪽, 미래엔 78쪽).', f·t 는 고려 왕조 전체. 2군 6위가 갖춰진 해는 교과서에 없어요., '별무반(윤관, 여진 정벌)·삼별초(최우) 같은 특수 부대는 이 상비 체제와 따로예요(사건 byeolmuban, wars sambyeolcho).']
- id: goryeo-local
