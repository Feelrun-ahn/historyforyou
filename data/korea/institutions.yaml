- id: silla-politics
  n: 신라의 통치 체제
  era: 삼국
  f: 520
  t: 676
  src:
  - {b: 비상, p: 31, fig: '본문, 날개 설명 상대등'}
  - {b: 미래엔, p: 28, fig: 신라의 독특한 정치·사회 제도}
  d: 법흥왕은 율령을 반포하고 관리를 17등급으로 나누어 관복 색을 정했어요. 상대등을 두어 귀족 회의인 화백 회의를 이끌게 하고, 병부를 두어 왕이 군사권을 쥐었어요. 혈통에 따른 신분인 골품이 오를 수 있는 관등을 제한했어요.
  nodes:
  - {id: king, n: 왕, s: '지증왕 때부터 ''왕'' 칭호를 쓰고, 법흥왕 때 ''건원''이라는 연호를 썼어요.'}
  - {id: hwabaek, n: 화백 회의, p: king, s: 귀족들이 모여 나라의 중대사를 만장일치로 정했어요. 이를 통해 귀족들은 왕을 견제하기도 했어요.}
  - {id: sangdaedeung, n: 상대등, p: hwabaek, s: '화백 회의를 이끈 귀족 대표로, 수상의 역할을 했어요.'}
