- id: goguryeo-politics
  n: 고구려의 통치 체제
  era: 삼국
  f: 180
  t: 668
  src:
  - {b: 비상, p: 25, fig: '본문, 날개 설명 5부'}
  - {b: 비상, p: 21, fig: 날개 설명 제가 회의}
