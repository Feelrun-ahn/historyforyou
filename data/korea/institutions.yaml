  notes: ['비상 145 그림 설명(❶ 훈련도감)과 본문, 미래엔 138 본문으로 만들었어요(조직도는 없어요). 미래엔 138에는 수어청 지휘관이 군대를 지휘하던 남한산성 수어장대 사진이 있어요.', '군영별 설치 해(어영군 조직·총융청 1624, 수어청 1626)와 총융청·수어청이 맡은 곳은 교과서에 자세히 없어 한국민족문화대백과사전 ''오군영''으로 확인했어요.', '장용영은 5군영과 따로 정조가 만든 부대예요(비상 147·148, 미래엔 145).', '세도 정치 때는 세도 가문이 여러 군영의 지휘권을 장악했어요(비상 149, 미래엔 158).', 't 1881은 5군영을 무위영·장어영의 2영으로 합친 해(고종 18, 한국민족문화대백과사전 ''오군영'', 심화).']
