  notes: [중앙 정치 조직(3성·좌우사정·6부·중정대·문적원·주자감)은 두 교과서 그림의 구조를 그대로 따랐어요., '미래엔 그림은 선조성을 ''정책 수립'', 중대성을 ''정책 심의''로 적었지만, 당의 중서성에 해당하는 중대성이 정책을 세우고 문하성에 해당하는 선조성이 이를 심의했다고 보는 것이 일반적이에요(비상 60쪽 설명). 그래서 그림에는 각 성의 일을 넣지 않았어요.', '대내상(정당성 장관)·각 부가 맡은 일(인사·재정·의례·군사·법률·교통·건축)은 미래엔 57쪽 그림·본문, 문적원의 일은 비상(서적과 외교 문서)·미래엔(도서 관리)이 조금 다르게 적었어요.', 중대성이 일본에 외교 문서를 보낸 것은 비상 71쪽 사진('발해 중대성에서 일본에 보낸 외교 문서')., '지방 행정(5경 15부 62주, 현, 촌락)과 군사(10위, 지방군)는 본문(비상 60쪽, 미래엔 57쪽)으로 만들었어요. 미래엔은 ''10위''라는 이름 없이 ''중앙군''이라고만 써요. 5경 이름은 미래엔 57쪽 ''발해의 최대 영역'' 지도를 따랐어요.', 'f 737 은 중앙·지방 통치 제도를 정비한 문왕의 즉위 해(비상 59쪽), t 926 은 발해 멸망.']
- id: goryeo-central
