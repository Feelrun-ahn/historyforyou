    - {n: 속현, s: 지방관이 파견되지 않은 고을로 주현보다 수가 많았어요.}
  - {id: hyangni, n: 향리, p: jugunhyeon, s: 각 고을의 행정 실무를 맡았어요.}
  - {id: hyang-bugok-so, n: 향·부곡·소, p: goryeo, s: '특수 행정 구역이에요. 주민은 일반 군현 사람보다 세금을 더 내는 등 차별받았어요. 향·부곡은 주로 농업, 소는 주로 수공업에 종사했어요.'}
  notes: ['교과서 그림은 지도예요(비상 80쪽 ❸, 미래엔 77쪽). 상자 그림은 두 교과서 본문 설명과 지도의 도·목 이름으로 만들었어요.', '3경: 비상은 ''개경·서경·동경(뒤에 남경)'', 미래엔은 ''개경·서경·동경, 남경 설치 뒤에는 남경·서경·동경을 3경으로 부르기도 함'' → 비상을 따랐어요.', 주·군·현은 5도와 양계 아래에 모두 있었지만(비상) 상자 그림에서는 5도 아래에만 이어 그렸어요., 속현이 주현보다 많았다는 것과 소 주민의 광물 생산은 미래엔 77쪽., 'f 983 은 12목 설치(비상 80쪽 연표: 이때부터 지방 제도가 틀을 갖추기 시작). 5도 양계 체제가 완성된 해는 교과서에 없어요.']
- id: goryeo-musin
  n: 무신 정권의 권력 기구
  era: 고려
  f: 1170
  t: 1270
  src:
  - {b: 비상, p: 83, fig: ❸ 무신 집권자와 지배 기구}
  - {b: 미래엔, p: 80, fig: 무신 집권자와 지배 기구}
  d: 무신 정변 뒤 무신들은 처음에 회의 기구인 중방을 중심으로 권력을 행사했어요. 최충헌이 집권한 뒤에는 교정도감이 최고 권력 기구가 되었고, 최우는 자기 집에 정방을 두어 인사권을 쥐었어요. 최씨 정권은 도방·삼별초 같은 군사 기반을 바탕으로 4대 60여 년 동안 이어졌어요.
  nodes:
  - {id: musin, n: 무신 집권자}
  - id: jungbang
    n: 중방
    p: musin
    s: 고위 무신들의 회의 기구로, 정변 초기(1170~1196) 정치 운영의 중심이었어요. 이 시기에는 집권자가 자주 바뀌었어요.
    kids: [이의방 (1170), 정중부 (1174), 경대승 (1179), 이의민 (1183)]
  - id: gyojeongdogam
    n: 교정도감
    p: musin
    s: 최충헌이 설치해 나라의 중요한 정책을 결정하고 집행한 최고 권력 기구예요.
    kids: [최충헌 (1196)]
  - {id: dobang, n: 도방, p: gyojeongdogam, s: '최충헌이 크게 늘린 사병 집단으로, 집권자의 호위를 맡았어요.'}
  - id: gyojeong-jeongbang
    n: 교정도감·정방
    p: musin
    s: 최우 때부터는 교정도감과 함께 최우가 자기 집에 둔 정방이 인사 행정을 맡았어요.
    kids: [최우 (1219), 최항 (1249), 최의 (1257), 김준 (1258), 임연 (1268), 임유무 (1270)]
  - {id: seobang, n: 서방, p: gyojeong-jeongbang, s: 최우가 능력 있는 문인들을 모아 정책을 자문받은 기구예요. 이규보 같은 문신이 등용되었어요.}
  - id: sambyeolcho
    n: 삼별초
    p: gyojeong-jeongbang
    s: 최우가 도적을 막으려 만든 야별초가 좌별초·우별초로 나뉘고, 몽골에서 탈출한 군사로 만든 신의군과 합쳐진 군대예요. 최씨 정권의 군사 기반이었어요.
    kids: [좌별초, 우별초, 신의군]
  notes: ['교과서 그림은 집권자 순서를 시간 띠로 보여 주는 그림이에요(중방 1170~1196 → 교정도감 1196~1219 → 교정도감·정방 1219~1270). 상자 그림에서는 시기별 지배 기구를 상자로, 집권자(집권한 해)를 상자 안 칸으로 옮겼어요.', 두 교과서 그림의 집권자와 연도는 같아요. 비상 그림은 정권을 이어받은 경우(이의민·최우·최항·최의·임유무)와 빼앗은 경우를 색으로 구별해요., '도방·서방·삼별초 상자는 그림에 없고 본문(비상 83쪽, 미래엔 81쪽)으로 더했어요. 서방은 비상에만 있어요.', 교정도감은 1209년(희종 5)에 설치되었지만(한국민족문화대백과 E0005565) 교과서 그림은 최충헌 집권(1196)부터 교정도감 시기로 그려요., 정방은 공민왕 때 없어졌어요(미래엔 90쪽).]
- id: joseon-central
  n: 조선의 중앙 정치 조직
  era: 조선 전기
  f: 1392
  t: 1894
  src:
  - {b: 비상, p: 118, fig: ❶ 조선의 중앙 정치 기구}
  - {b: 미래엔, p: 109, fig: 조선의 중앙 통치 기구}
  d: 조선의 중앙 정치는 의정부와 6조가 중심이었어요. 의정부의 3정승이 합의해 국정을 총괄하고 6조가 행정 실무를 나누어 맡았으며, 나라의 중요한 일은 왕을 중심으로 3정승과 6조 판서가 의논해 정했어요. 권력의 독점과 부정을 막으려고 언론을 맡은 3사를 두었고, 승정원과 의금부는 왕권을 뒷받침했어요.
  nodes:
  - {id: king, n: 왕, s: 나라의 중요한 일은 왕을 중심으로 의정부의 3정승과 6조의 판서가 의논해 결정했어요.}
  - {id: uijeongbu, n: 의정부, p: king, s: 영의정·좌의정·우의정의 3정승이 합의해 나랏일을 총괄하고 정책을 심의·결정한 최고 기구예요.}
  - id: yukjo
    n: 6조
    p: uijeongbu
    s: 의정부에서 정한 일을 나누어 집행한 행정 실무 기관이에요. 각 조의 책임자를 판서라고 했어요.
    kids:
    - {n: 이조, s: 문관 인사. 이조의 정랑·좌랑(이조 전랑)은 3사 관리를 추천하고 자기 후임자도 추천할 수 있었어요.}
    - {n: 호조, s: 국세 파악·세금 징수}
    - {n: 예조, s: 교육·과거·외교·제사}
    - {n: 병조, s: 무관 인사·국방}
    - {n: 형조, s: 형벌·소송}
    - {n: 공조, s: 산림·건설·수공업}
  - {id: seungjeongwon, n: 승정원, p: king, s: 왕의 비서 기관이에요. 왕의 명령을 전하고 신하들의 보고를 왕에게 올렸어요.}
  - {id: uigeumbu, n: 의금부, p: king, s: 반역처럼 나라의 큰 죄를 지은 사람을 다스려 왕권을 뒷받침했어요.}
  - id: samsa
    n: 3사
    p: king
    t1: 1
    s: 언론 기능을 맡은 사헌부·사간원·홍문관을 합쳐 부르는 말이에요. 왕이나 고위 관리도 3사의 활동을 함부로 막을 수 없어 권력의 독점과 부정을 막았어요. 성종 때부터 사림이 주로 3사의 언관이 되어 훈구를 비판했어요.
    kids:
    - {n: 사헌부, s: 관리의 잘못을 감찰하고 풍속을 바로잡았어요. 정치를 논하고 억울한 일을 밝히는 일도 맡았어요.}
    - {n: 사간원, s: 왕에게 바른말을 올리고 정치의 잘못을 따져 지적했어요.}
    - {n: 홍문관, s: '집현전을 이어 성종 때 둔 기관으로, 궁궐의 책을 관리하고 왕의 정책 자문과 경연을 맡았어요.'}
  - {id: hanseongbu, n: 한성부, p: king, s: 수도 한성의 행정과 치안을 맡았어요.}
  - {id: chunchugwan, n: 춘추관, p: king, s: 역사를 기록하고 역사서를 편찬·보관했어요. 왕이 죽으면 이곳에 실록청을 두어 실록을 만들었어요.}
  - {id: seonggyungwan, n: 성균관, p: king, s: 높은 수준의 유학을 가르친 최고 교육 기관이에요. 주로 소과에 합격한 생원·진사가 들어갔어요.}
  notes: ['상자 순서와 6조의 업무는 비상 118 그림을 따랐어요. 미래엔 109 그림은 의정부·승정원·의금부·사헌부·사간원·홍문관·춘추관·성균관·한성부 순서이고, 6조 업무를 이조(문관 인사)·호조(조세·재정·호구)·예조(교육·외교·의례)·병조(군사·무관 인사)·형조(형벌·소송)·공조(토목)로 적어요.', '의정부와 6조의 관계는 왕에 따라 달랐어요. 태종과 세조는 6조가 왕에게 바로 보고하는 6조 직계제로 왕권을 강화했고, 세종은 의정부가 먼저 검토하는 의정부 서사제를 시행했어요(미래엔 107). 성종도 의정부의 권한을 다시 강화했어요(비상 116).', '3사는 비상 118 그림에서 따로 묶어 강조한 기구예요(t1). 붕당 정치 때 각 붕당은 3사와 서원을 통해 공론을 모았지만, 숙종 때 환국 이후 3사의 언론은 자기 붕당의 이익을 위해 상대를 공격하는 쪽으로 변질됐어요(비상 146, 미래엔 142~143).', 조선 후기에는 비변사가 국정을 총괄하면서 의정부와 6조의 기능이 약해졌어요('조선 후기 정치 구조의 변화' 그림)., '비상 118 연표에 1398년 한양에 성균관 설치, 1400년 의정부 설치가 나와요.']
- id: joseon-military-early
