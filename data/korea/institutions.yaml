  nodes:
  - {id: king, n: 왕, s: '계루부 고씨가 왕위를 이어 갔고, 4세기 소수림왕 때 율령을 반포해 통치 조직을 정비했어요.'}
  - {id: jega, n: 제가 회의, p: king, s: 처음엔 왕과 부족 대표들의 회의였으나 왕권이 강해지면서 귀족들의 회의가 되었어요.}
  - {id: daedaero, n: 대대로, p: king, s: 수상의 역할을 맡은 최고 관직이에요.}
  - {id: gwandeung, n: 10여 관등, p: daedaero, s: 관리를 10여 등급으로 나누었어요.}
  - id: obu
    n: 5부
    p: king
    s: 계루부·소노부·절노부·순노부·관노부의 5부가 점차 해체되어 행정 구역인 동·서·남·북·중의 5부로 바뀌었어요.
    kids: [동부, 서부, 남부, 북부, 중부]
  notes: [대대로는 비상 25쪽에만 나와요., f 는 고국천왕(재위 179~197) 때 5부 정비를 기준으로 한 대략값이에요.]
