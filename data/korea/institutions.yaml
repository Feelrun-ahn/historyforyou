  - {id: king, n: 왕}
  - {id: dobyeongmasa, n: 도병마사, p: king, t1: 1, s: 중서문하성·중추원의 고위 관리가 모여 국방과 군사 문제를 논의한 고려의 독자 기구예요.}
  - {id: sikmokdogam, n: 식목도감, p: king, t1: 1, s: 중서문하성·중추원의 고위 관리가 모여 제도와 시행 규칙을 정한 고려의 독자 기구예요.}
