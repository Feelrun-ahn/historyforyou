  - {id: sangseoseong, n: 상서성, p: king, s: 6부를 거느리고 정해진 정책을 집행했어요(일반 국정).}
  - id: yukbu
    n: 6부
    p: sangseoseong
    s: 상서성 아래에서 나랏일을 나누어 맡은 여섯 관청이에요.
    kids:
    - {n: 이부, s: 관리 임명}
    - {n: 병부, s: 군사}
    - {n: 호부, s: 재정}
    - {n: 형부, s: 법률}
    - {n: 예부, s: 교육(미래엔은 외교·교육)}
    - {n: 공부, s: 토목}
  - {id: jungchuwon, n: 중추원, p: king, s: 왕의 비서 기관으로 왕명을 전달하고 군사 기밀을 다루며 궁궐을 지켰어요.}
  - {id: eosadae, n: 어사대, p: king, s: 관리의 비리를 감찰하고 풍속을 바로잡았어요. 중서문하성의 낭사와 함께 대간으로 불리며 왕과 고위 관리의 권력을 견제했어요.}
  - {id: samsa, n: 삼사, p: king, s: 나라 재정의 출납과 회계를 맡았어요. 조선의 3사(언론 기관)와는 다른 기관이에요.}
  notes: ['그림 구조는 두 교과서 그림이 같아요(왕 아래 도병마사·식목도감, 중서문하성·상서성(2성)→6부, 중추원·어사대·삼사). 도병마사·식목도감은 두 교과서 모두 다른 색으로 구별해 t1 로 표시했어요.', '6부 설명: 비상은 이부 ''관리 임명''·예부 ''교육'', 미래엔은 이부 ''관리 인사''·예부 ''외교, 교육''.', 대간(어사대 + 중서문하성 낭사)은 미래엔 77쪽 본문에만 있고 그림에는 없어 s 에만 적었어요., 'f·t 는 고려 왕조 전체(918~1392). 비상 79쪽: 성종 때 당·송 제도를 참고해 중앙 관제를 정비. 미래엔 88쪽: 원 간섭기에 2성 6부가 첨의부·4사로 격하, 공민왕 때 관제 복구(90쪽).']
