  - id: samgunbu
    n: 삼군부
    p: king
    deep: 1
    web: ['https://encykorea.aks.ac.kr/Article/E0025147']
    s: 1865년 흥선 대원군이 비변사를 없애면서 다시 세워 군사 업무를 맡겼어요. 교과서에는 없는 심화 내용이에요.
  notes: ['비상 145 ''현장 속으로''와 『효종실록』 자료(의정부는 한갓 이름뿐이고 6조는 할 일을 모두 빼앗김), 미래엔 138 본문으로 만들었어요. 교과서에 조직도는 없어요.', 흥선 대원군의 비변사 축소는 미래엔 162('기능도 축소하여 사실상 폐지')에 나와요. 비상은 근대 단원 175에서 '통치 체제를 정비'라고만 써요., '1864년(고종 1) 비변사는 외교·국방·치안만 맡고 나머지 업무를 의정부로 넘겼고, 1865년(고종 2) 폐지되어 업무는 의정부로, 군무는 다시 세운 삼군부로 넘어갔어요(한국민족문화대백과사전 ''비변사'', 심화).', '한국민족문화대백과사전은 비변사를 처음 둔 때를 1510년(중종 5) 삼포 왜란 때로, 상설 관아가 된 때를 1555년(명종 10) 을묘왜변 뒤로 적어요.', 비변사에서 처리한 일을 적어 둔 책이 『비변사등록』이에요(비상 145 사진).]
