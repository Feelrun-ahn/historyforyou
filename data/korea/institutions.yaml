  d: 고려는 당의 3성 6부제를 받아들여 실정에 맞게 2성 6부로 고쳐 운영했어요. 중서문하성이 정책을 정하고 상서성이 6부를 거느려 집행했어요. 중서문하성과 중추원의 고위 관리는 고려만의 기구인 도병마사·식목도감에 모여 나라의 중요한 일을 함께 의논했어요.
