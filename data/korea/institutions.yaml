  - {id: yeontongje, n: 연통제, p: naemubu, s: 국내의 도·군·면에 책임자를 둔 비밀 행정 조직이에요. 임시 정부의 명령을 전하고 독립운동 자금을 모았어요.}
  - {id: gyotongguk, n: 교통국, p: gyotongbu, s: 국내와 비밀리에 연락하는 통신 기관이에요. 자금을 모으고 국내 정보를 모아 임시 정부에 보고했어요.}
  notes: ['교과서에 조직도가 없어 본문을 바탕으로 그렸어요. 삼권 분립(임시 의정원·국무원·법원)은 비상 182쪽 본문과 미래엔 177쪽 임시 헌법 제5조, 연통제·교통국은 두 교과서 본문에 있어요.', '내무부·교통부 상자와 연통제·교통국의 소속은 교과서에 없어요. 한국민족문화대백과 ''연통제''(E0036949, 내무부 소관, 1919년 7월 국무원령 제1호)와 ''교통부''(E0005597, 1919년 5월 교통부 관할로 교통국 설치)를 따랐어요.', 국무원 구성(국무총리·각 부 총장)과 1925년 헌법 개정으로 대통령제가 국무령 중심 체제로 바뀐 것은 한국민족문화대백과 '국무원'(E0006268)을 따랐어요. 그래서 t 를 1925로 했어요., '비상 182쪽은 통합 정부가 대통령 중심제를 택했다고 써요. 그래서 맨 위 상자 아래에 임시 대통령을 두고, 행정을 맡은 국무원을 그 아래에 그렸어요(대통령이 국무원과 함께 행정을 이끈 구조를 단순하게 나타낸 거예요).']
