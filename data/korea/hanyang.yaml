d: 조선은 1394년 한양으로 도읍을 옮기고 종묘와 사직, 경복궁을 차례로 지은 뒤 둘레의 산줄기를 따라 성곽을 쌓았어요. 종묘는 궁궐 왼쪽, 사직은 오른쪽에 두고 네 큰 문에 인·의·예·지 같은 유교 덕목을 넣어 이름 짓는 등 도시 전체를 유교 이념에 맞춰 꾸몄어요. 연도를 옮기면 궁궐이 불타고 다시 지어지는 모습, 개항 뒤 근대 시설과 일제 강점기·현대의 사건 장소가 차례로 나타나요.
