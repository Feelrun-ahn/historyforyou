  d: "9세기 전반 선왕 때 발해는 대부분의 말갈을 복속하고 연해주에서 요동 지방까지 영토를 넓혀 옛 고구려 땅의 대부분을 차지했어요. 중국은 이때의 발해를 '바다 동쪽의 융성한 나라'라는 뜻의 해동성국이라고 불렀어요. 발해는 전국을 5경 15부 62주로 나누고, 전략적 요충지에 5경을 두었어요."
