- id: musin-uprisings
  n: 무신 집권기 농민과 천민의 봉기
  era: 고려
  f: 1176
  t: 1237
  y: 1237
  steps: true
  view: korea
  src:
    - {b: 비상, p: 84, fig: ❺ 무신 집권기 농민과 천민의 봉기}
    - {b: 미래엔, p: 81, fig: 무신 정권기 하층민의 저항 운동}
  d: "무신 정권이 들어선 뒤 권력 다툼으로 정치가 어지러워지고 수탈이 심해지자, 신분 상승에 대한 기대도 커져 전국에서 농민과 천민이 봉기했어요. 공주 명학소의 망이·망소이, 운문·초전의 김사미와 효심이 일어났고, 개경의 사노비 만적은 신분 해방을 꾀했어요. 경주·서경·담양에서는 신라·고구려·백제의 부흥을 내세운 봉기도 일어났어요."
  legend:
    - {k: farmer, n: 농민·소(所) 주민의 봉기}
    - {k: slave, n: 노비의 봉기}
    - {k: revival, n: 삼국 부흥을 내세운 봉기}
    - {k: other, n: 그 밖의 주요 봉기지 (비상)}
  points:
    - {n: 망이·망소이 (1176), at: [127.12, 36.46], k: farmer, y: 1176, s: 공주 부근의 특수 행정 구역인 명학소에서 무거운 세금을 견디지 못한 망이·망소이 형제가 봉기했어요. 한때 관군을 물리치고 충청도 일대를 점령했어요.}
    - {n: 전주 관노 (1182), at: [127.15, 35.82], k: slave, y: 1182, s: 전주에서 관청에 소속된 공노비들이 지방관의 횡포에 맞서 봉기했어요.}
    - {n: 김사미 (1193), at: [128.95, 35.7], k: farmer, y: 1193, ap: 1, s: 경상도 운문(지금의 청도)에서 농민을 이끌고 일어나 경주 세력과 힘을 합쳐 중앙에 맞섰어요.}
    - {n: 효심 (1193), at: [129.25, 35.57], k: farmer, y: 1193, ap: 1, s: 경상도 초전(지금의 울산 부근)에서 농민을 이끌고 일어났어요.}
    - {n: 만적 (1198), at: [126.55, 37.97], k: slave, y: 1198, s: "개경에서 사노비 만적 등이 신분 해방을 목적으로 봉기를 계획했지만, 미리 들켜 실패했어요. \"장군과 재상에 어찌 타고난 씨가 있겠는가?\""}
    - {n: 이비·패좌 (1202), at: [129.22, 35.83], k: revival, y: 1202, s: 경주(동경)에서 신라 부흥을 내세운 봉기예요.}
    - {n: 최광수 (1217), at: [125.75, 39.02], k: revival, y: 1217, s: 서경에서 고구려 부흥을 내세운 봉기예요.}
    - {n: 이연년 형제 (1237), at: [126.99, 35.32], k: revival, y: 1237, s: 담양에서 백제 부흥을 내세운 봉기예요.}
    - {n: 합천, at: [128.17, 35.57], k: other, s: 비상 교과서 지도에 주요 봉기지로 찍혀 있어요(지도에 연도와 이끈 사람은 없어요).}
    - {n: 진주, at: [128.08, 35.19], k: other, s: 비상 교과서 지도에 주요 봉기지로 찍혀 있어요(지도에 연도와 이끈 사람은 없어요).}
  labels:
    - {n: 황해, at: [125.0, 36.3]}
    - {n: 동해, at: [130.3, 37.3]}
  notes:
    - 비상 교과서 지도에 이름 없이 흰 점으로 찍힌 봉기지(15곳쯤)는 넣지 않았어요.
    - "미래엔 교과서 지도에는 망이·망소이, 전주 관노, 김사미, 효심, 만적, 이연년 형제의 봉기만 있어요."
    - 망이·망소이가 일어난 명학소는 두 교과서 지도처럼 공주에 찍었어요.
    - 운문·초전은 옛 지명이라 대략적인 곳에 찍었어요.

