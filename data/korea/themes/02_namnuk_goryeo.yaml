  d: "13세기 몽골이 쳐들어오자 고려 사람들은 몽골군을 물리치려는 염원을 담아 16년에 걸쳐 8만여 장의 목판에 경전을 새겼어요(팔만대장경). 경판은 강화도 선원사에 147년 동안 보관되었다가, 조선이 세워진 뒤 9개월 동안 육로와 해로로 합천 해인사로 옮겨진 것으로 추정해요. 지금도 해인사에 보관되어 있어요."
  legend:
