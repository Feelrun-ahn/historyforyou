- id: silla-late-unrest
  n: 신라 말의 사회 혼란과 호족의 성장
  era: 남북국
  f: 822
  t: 896
  y: 896
  steps: true
  view: korea
  src:
    - {b: 비상, p: 61, fig: 신라 말의 상황 – 지방민의 봉기와 지방 호족의 성장}
    - {b: 미래엔, p: 58, fig: 신라 말의 사회 혼란과 호족의 성장}
  d: "8세기 후반부터 진골 귀족들의 왕위 다툼이 심해졌어요. 웅주 도독 김헌창(822)과 청해진의 장보고(846)도 반란을 일으켰어요. 진성 여왕 때 세금 독촉에 맞선 원종과 애노의 난(889)을 시작으로 농민 봉기가 전국으로 번졌고, 중앙의 힘이 약해지자 지방에서는 스스로 성주나 장군이라 부르는 호족이 성장했어요."
  legend:
    - {k: noble, n: 지배층의 반란}
    - {k: peasant, n: 농민·지방민의 봉기}
    - {k: hojok, n: 대표적인 호족 세력}
    - {k: place, n: 그 밖의 지명}
    - {k: capital, n: 수도}
  points:
    - {n: 김헌창의 난 (822), at: [127.12, 36.46], k: noble, y: 822, s: 웅주(공주) 도독 김헌창이 아버지 김주원이 왕이 되지 못한 것에 불만을 품고 일으킨 반란이에요.}
    - {n: 장보고의 난 (846), at: [126.77, 34.33], k: noble, y: 846, s: 청해진(완도)을 근거지로 해상 무역을 장악한 장보고가 중앙의 왕위 다툼에 끼어들었다가 일으킨 반란이에요. 미래엔 교과서 지도에는 대표적인 호족 세력으로 나와요.}
    - {n: 원종·애노의 난 (889), at: [128.16, 36.41], k: peasant, y: 889, s: 진성 여왕 때 나라에서 세금을 독촉하자 사벌주(상주)에서 원종과 애노가 일으켰어요. 이를 시작으로 농민 봉기가 전국으로 퍼졌어요. 사벌주는 호족 아자개의 근거지이기도 해요.}
    - {n: 기훤의 난, at: [127.43, 37.08], k: peasant, y: 889, ap: 1, s: 죽주(지금의 안성 죽산)에서 일어난 봉기예요(비상 교과서 지도). 지도에 연도가 없어 원종·애노의 난 이후에 나타나게 했어요.}
    - {n: 양길의 난, at: [127.95, 37.34], k: peasant, y: 889, s: 북원(원주)의 양길이 일으킨 봉기예요. 궁예는 양길의 부하로 있다가 자립했어요. 미래엔 교과서 지도는 양길을 대표적인 호족 세력으로 표시했어요.}
    - {n: 적고적의 난 (896), at: [129.1, 35.74], k: peasant, y: 896, ap: 1, s: "붉은 바지를 입은 무리가 경주 서남쪽에서 일어나 주와 현을 공격하고 모량리까지 와서 민가를 약탈했어요(미래엔 교과서 지도, 비상 교과서 사료)."}
    - {n: 왕건, at: [126.55, 37.97], k: hojok, s: 송악(개성)의 호족이에요.}
    - {n: 왕순식, at: [128.9, 37.75], k: hojok, s: 명주(강릉)의 호족이에요. 미래엔 교과서 지도에는 김(왕)순식으로 나와요.}
    - {n: 견훤, at: [127.15, 35.82], k: hojok, s: 완산주(전주)를 근거지로 세력을 키워 후백제를 세웠어요.}
    - {n: 유긍달, at: [127.93, 36.99], k: hojok, s: 중원(충주)의 호족이에요(미래엔 교과서 지도).}
    - {n: 철원, at: [127.25, 38.32], k: place, s: 궁예가 뒤에 도읍으로 삼은 곳이에요. 미래엔 교과서 지도는 궁예의 근거지를 철원으로 표시했어요.}
    - {n: 금성, at: [129.22, 35.83], k: capital, s: 신라의 수도 (지금의 경주)}
  labels:
    - {n: 신라, at: [128.3, 37.2]}
    - {n: 탐라, at: [126.55, 33.25]}
    - {n: 황해, at: [125.0, 36.3]}
    - {n: 동해, at: [130.3, 37.3]}
  notes:
    - "비상 교과서 지도는 궁예를 북원(원주) 가까이에 적었고, 미래엔 교과서 지도는 궁예의 근거지를 철원으로 표시했어요. 여기서는 궁예를 양길의 난(북원) 설명에 넣었어요."
    - "사벌주의 아자개, 청해진의 장보고처럼 사건과 호족이 같은 곳에 있으면 점 하나로 합쳤어요."
    - "기훤·양길의 봉기는 교과서 지도에 연도가 없어서, 본문에 따라 원종·애노의 난(889) 다음에 나타나게 했어요."
    - 적고적의 난은 미래엔 교과서 지도에서 금성(경주)에 이어져 있어요. 사료에 따라 경주 서남쪽에 대략 찍었어요.

