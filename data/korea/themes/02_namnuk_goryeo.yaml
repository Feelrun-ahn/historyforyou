  d: "고구려가 멸망한 뒤 요서 지역의 영주에는 고구려 유민과 말갈인, 거란인 등이 끌려와 당의 지배를 받았어요. 거란인의 반란으로 당의 통제가 약해진 틈에 옛 고구려 장수 출신 대조영이 고구려 유민과 말갈인 일부를 이끌고 영주를 떠났어요(696). 대조영은 뒤쫓아 온 당군을 천문령에서 물리친 뒤 동모산 근처에 도읍을 정하고 발해를 세웠어요(698)."
