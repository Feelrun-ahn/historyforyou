  d: "1975년 전라남도 신안군 앞바다에서 고기를 잡던 어부의 그물에 도자기가 걸려 올라오면서, 송·원·고려·일본의 물건을 실은 채 가라앉은 배가 발견됐어요(신안선). 배에서 나온 목간의 글자를 통해 이 배가 1323년 원의 경원(닝보)에서 일본 하카타·교토로 향하던 무역선이었다고 짐작해요. 신안선에서는 중국 도자기와 고려청자, 동전, 향신료 등이 나와 당시 동아시아 바다 무역의 모습을 보여 줘요."
  legend:
