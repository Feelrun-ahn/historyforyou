  d: 약 1만 년 전 기후가 오늘날과 비슷해지면서 신석기 시대가 시작됐어요. 사람들은 농사를 짓고 가축을 기르며 한곳에 머물러 살게 되었고, 움집을 짓고 간석기와 토기를 썼어요. 유적은 주로 강가나 바닷가에 있어서 농사와 고기잡이를 함께 했다는 걸 알 수 있어요.
  legend:
    - {k: site, n: 주요 유적}
