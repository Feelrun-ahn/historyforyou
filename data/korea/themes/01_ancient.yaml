  d: 5세기 중국은 북쪽의 북위와 남쪽의 남조 나라들로 나뉘어 있었어요. 장수왕은 북쪽의 강대국 유연, 남조의 나라들과 친하게 지내 북위와 백제를 견제하면서도, 북위에 사신을 보내 싸움을 피하는 실리 외교를 폈어요. 남쪽으로는 백제와 신라를 압박했고, 위협을 느낀 백제와 신라는 동맹을 맺어 맞섰어요.
  legend:
    - {k: rival, n: 대립}
    - {k: friend, n: 외교·동맹}
    - {k: country, n: 나라}
  points:
    - {n: 유연, at: [106.0, 46.5], k: country, ap: 1, s: 몽골고원의 유목 국가예요. 북위와 맞섰어요.}
    - {n: 북위, at: [113.3, 40.1], k: country, ap: 1, s: 5호 16국의 분열을 통일하고 화북을 차지한 나라예요. 점은 도읍 평성(지금의 다퉁)에 찍었어요.}
    - {n: 남조, at: [118.78, 32.05], k: country, ap: 1, s: 강남에서 차례로 일어난 송·제·양·진 등의 나라예요. 점은 도읍 건강(지금의 난징)에 찍었어요.}
    - {n: 고구려, at: [125.75, 39.02], k: country, s: 점은 427년부터의 도읍 평양에 찍었어요.}
    - {n: 백제, at: [127.0, 36.6], k: country, ap: 1}
    - {n: 신라, at: [128.9, 36.0], k: country, ap: 1}
  lines:
    - {n: 유연 ↔ 북위 (대립), k: rival, arrow: false, ap: 1, path: [[106.0, 46.5], [113.3, 40.1]]}
    - {n: 북위 ↔ 남조 (대립), k: rival, arrow: false, ap: 1, path: [[113.3, 40.1], [118.78, 32.05]]}
    - {n: 고구려 → 백제 (남진 정책으로 압박), k: rival, ap: 1, path: [[125.75, 39.02], [126.5, 37.8], [127.0, 36.6]]}
    - {n: 고구려 → 신라 (남진 정책으로 압박), k: rival, ap: 1, path: [[125.75, 39.02], [127.6, 37.6], [128.9, 36.0]]}
    - {n: 유연 — 고구려 (친선 관계를 통해 북위를 압박), k: friend, arrow: false, ap: 1, path: [[106.0, 46.5], [116.0, 45.0], [125.75, 39.02]]}
    - {n: 북위 — 고구려 (현실적이고 유연한 외교), k: friend, arrow: false, ap: 1, s: 장수왕은 북위에 사신을 보내 군사 충돌을 피했어요., path: [[113.3, 40.1], [119.5, 40.3], [125.75, 39.02]]}
    - {n: 남조 — 고구려 (국교를 맺어 북위와 백제를 견제), k: friend, arrow: false, ap: 1, path: [[118.78, 32.05], [122.5, 35.5], [125.75, 39.02]]}
    - {n: 백제 — 신라 (동맹), k: friend, arrow: false, ap: 1, s: 고구려의 남진에 맞서 백제와 신라가 동맹을 맺었어요(433, 나제 동맹)., path: [[127.0, 36.6], [128.9, 36.0]]}
  labels:
    - {n: 황해, at: [123.5, 35.8]}
    - {n: 동해, at: [131.0, 38.6]}
  notes:
    - 미래엔 교과서의 관계 그림은 지도 바탕 없이 나라 이름을 동그라미로 놓고 선으로 이은 그림이에요. 여기서는 나라마다 대표가 되는 곳(도읍 등)에 점을 찍어 옮겼어요.
    - 나제 동맹이 맺어진 해(433)는 교과서 본문의 내용이에요.

- id: east-asia-late6c
  n: 6세기 후반~7세기 초의 동아시아
  era: 삼국
  f: 589
  t: 642
  y: 600
  view: [98.0, 28.0, 140.0, 50.0]
  src:
    - {b: 비상, p: 49, fig: "❶ 6세기 후반~7세기 초의 동아시아"}
  d: 589년 수가 중국을 통일하자 동아시아의 국제 관계가 크게 바뀌었어요. 위협을 느낀 고구려는 북쪽의 돌궐과 손잡고 남쪽의 백제·왜와 이어지려 했고, 고구려와 백제의 잦은 공격에 시달리던 신라는 수(뒤에는 당)에 도움을 청했어요. 이렇게 남북으로 이어진 세력과 동서로 이어진 세력이 맞서게 되었어요.
  legend:
    - {k: ns, n: 남북 세력 (돌궐·고구려·백제·왜)}
    - {k: ew, n: 동서 세력 (수·당·신라)}
    - {k: country, n: 나라}
  points:
    - {n: 돌궐, at: [106.0, 46.5], k: country, ap: 1, s: 몽골고원의 유목 국가예요.}
    - {n: 수·당, at: [108.94, 34.27], k: country, ap: 1, s: 589년 중국을 통일한 수와, 뒤를 이은 당(618)이에요. 점은 도읍 장안에 찍었어요.}
    - {n: 고구려, at: [125.75, 39.02], k: country, s: 점은 도읍 평양에 찍었어요.}
    - {n: 백제, at: [126.91, 36.28], k: country, s: 점은 도읍 사비에 찍었어요.}
    - {n: 신라, at: [129.22, 35.83], k: country, s: 점은 도읍 금성(경주)에 찍었어요.}
    - {n: 왜, at: [135.8, 34.5], k: country, ap: 1, s: 점은 야마토 정권의 중심지 근처에 찍었어요.}
  lines:
    - {n: 돌궐 — 고구려, k: ns, arrow: false, ap: 1, path: [[106.0, 46.5], [116.0, 44.5], [125.75, 39.02]]}
    - {n: 고구려 — 백제, k: ns, arrow: false, ap: 1, path: [[125.75, 39.02], [126.0, 37.6], [126.91, 36.28]]}
    - {n: 백제 — 왜, k: ns, arrow: false, ap: 1, path: [[126.91, 36.28], [127.5, 34.3], [130.5, 33.7], [135.8, 34.5]]}
    - {n: 수·당 — 신라, k: ew, arrow: false, ap: 1, s: 신라는 황해를 건너 수와 당에 도움을 청했어요., path: [[108.94, 34.27], [118.0, 35.5], [124.0, 36.3], [129.22, 35.83]]}
  labels:
    - {n: 황해, at: [123.5, 35.6]}
    - {n: 동해, at: [131.5, 38.6]}
  notes:
    - 비상 교과서 그림은 나라 사이를 손을 맞잡은 사람 그림의 줄로 이었어요. 여기서는 나라마다 대표가 되는 곳에 점을 찍고 선으로 이었어요.

- id: east-asia-unification
  n: 신라의 삼국 통일 당시 동아시아의 국제 정세
  era: 삼국
  f: 663
  t: 687
  y: 676
  steps: true
  view: [85.0, 25.0, 140.0, 50.0]
  src:
    - {b: 미래엔, p: 50, fig: "신라의 삼국 통일 당시 동아시아의 국제 정세 (같이 보는 세계사·한국사)"}
  d: 백제와 고구려가 무너진 뒤 신라와 당은 한반도를 두고 맞섰어요. 이때 티베트고원의 토번이 비단길을 차지하며 당을 위협하자, 당은 한반도에 있던 군대를 불러들여 토번과 싸웠어요. 신라는 당의 힘이 나뉜 틈을 타 백제·고구려 유민과 함께 매소성과 기벌포에서 당군을 물리치고 삼국 통일을 이루었어요(676). 그 뒤 당의 지배력이 흔들리자 돌궐이 독립하고 거란이 성장했으며, 고구려 유민이 발해를 세우는 데에도 영향을 주었어요.
  legend:
    - {k: country, n: 나라}
    - {k: event, n: 사건}
    - {k: move, n: 당군을 불러들임}
  points:
    - {n: 당, at: [108.94, 34.27], k: country, s: 점은 도읍 장안에 찍었어요.}
    - {n: 토번, at: [91.1, 29.65], k: event, y: 670, ap: 1, s: 티베트고원에서 크게 일어난 나라예요. 비단길을 차지하고 670년 당을 크게 이겼어요.}
    - {n: 돌궐, at: [106.0, 46.5], k: event, y: 687, ap: 1, s: 토번과 손잡은 유목 국가예요. 당의 지배력이 약해지자 당에서 독립했어요(미래엔 교과서 연표는 687년, 일반적으로는 682년으로 봐요).}
    - {n: 거란, at: [120.5, 43.5], k: country, ap: 1, s: 당의 지배력이 흔들린 틈에 성장했어요.}
    - {n: 말갈, at: [128.5, 44.8], k: country, ap: 1}
    - {n: 신라, at: [129.22, 35.83], k: event, y: 676, s: 매소성 전투(675)와 기벌포 전투(676)에서 당군을 물리치고 삼국 통일을 이루었어요(676). 점은 도읍 금성에 찍었어요.}
    - {n: 왜, at: [135.8, 34.5], k: event, y: 663, ap: 1, s: 백제 부흥군을 도우러 왔다가 663년 백강 전투에서 졌어요. 그 뒤 곳곳에 성을 쌓아 당과 신라의 침입에 대비하고, 국왕 중심의 중앙 집권 체제를 갖춰 나갔어요.}
  lines:
    - n: 한반도의 당군을 불러들임
      k: move
      y: 670
      ap: 1
      s: 토번의 위협이 커지자 당은 한반도에 머물던 군대를 불러들여 토번에 맞섰어요.
      path: [[125.75, 39.02], [118.0, 37.5], [108.94, 34.27], [100.0, 33.0], [92.5, 30.5]]
  labels:
    - {n: 황해, at: [123.5, 35.6]}
    - {n: 동해, at: [131.5, 38.6]}
  notes:
    - 미래엔 교과서의 만화 지도를 옮겼어요. 나라 이름의 자리와 당군을 불러들이는 장면만 있어서, 나라마다 대표가 되는 곳에 점을 찍고 화살표는 대략 그렸어요.
    - 매소성·기벌포 전투의 자리와 신라군·당군의 진격로는 전쟁 '나당 전쟁'에서 볼 수 있어요.
