  d: 기원전 6세기 무렵 인도에서 생긴 불교는 서역을 거쳐 1세기 무렵 중국에 전해졌고, 중국을 통해 삼국으로 들어왔어요. 고구려는 소수림왕 때(372), 백제는 침류왕 때(384) 불교를 받아들였고, 신라는 법흥왕 때(527) 공인했어요. 백제는 552년 일본에 불교를 전했어요. 인도에서 남쪽과 동남쪽으로도 퍼져 스리랑카·미얀마·베트남에 전해졌어요.
