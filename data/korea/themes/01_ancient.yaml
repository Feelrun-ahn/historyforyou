    - {b: 미래엔, p: 21, fig: 서울 속의 백제 유적}
    - {b: 미래엔, p: 25, fig: "삼국의 군사적 요충지 한강과 고구려의 아차산 보루 (나도 역사가)"}
  d: 한강 하류는 땅이 기름지고 물길로 오가기 편해 사람과 물자가 넉넉했어요. 그래서 삼국은 이곳을 차지하려고 치열하게 다퉜고, 지금의 서울 곳곳에 백제의 도성과 무덤, 고구려의 보루, 신라의 산성이 남아 있어요.
  legend:
    - {k: baekje, n: 백제의 유적}
    - {k: goguryeo, n: 고구려의 유적}
    - {k: silla, n: 신라의 유적}
  points:
    - {n: 풍납동 토성, at: [127.118, 37.532], k: baekje, ap: 1, s: 한강 가에 흙을 쌓아 만든 큰 토성이에요. 몽촌토성과 함께 5세기 후반까지 백제의 도성이었던 위례성으로 봐요.}
    - {n: 몽촌토성, at: [127.12, 37.52], k: baekje, ap: 1, s: 자연 언덕에 흙을 쌓아 만든 백제의 성이에요. 바깥에서 쳐들어오는 것을 막으려고 둘레에 물길(해자)을 팠어요.}
    - {n: 석촌동 고분군, at: [127.104, 37.503], k: baekje, ap: 1, s: 돌을 계단 모양으로 쌓은 백제 초기의 무덤들이에요. 고구려 무덤과 닮아서, 백제를 세운 사람들이 고구려 쪽에서 내려왔다는 건국 이야기를 뒷받침해요.}
    - {n: 아차산 보루, at: [127.104, 37.566], k: goguryeo, y: 475, ap: 1, s: 한강 북쪽 아차산 일대에서 고구려 보루가 10곳 넘게 나왔어요. 5세기 고구려가 남쪽으로 내려올 때는 전진 기지로, 6세기 백제·신라 연합군이 쳐들어올 때는 방어 기지로 썼어요. 여기서 강만 건너면 백제 도성을 칠 수 있었어요.}
    - {n: 이성산성, at: [127.185, 37.522], k: silla, y: 553, ap: 1, s: 경기 하남에 있는 신라의 산성이에요. 한강 유역을 지키기 좋은 자리에 쌓았어요.}
  labels:
    - {n: 한강, at: [127.05, 37.525]}
  notes:
    - 비상 교과서는 한강 유역 위성 지도에 아차산 보루·몽촌토성·이성산성 세 곳을 번호로만 표시했어요. 미래엔 교과서는 서울 지도에 아차산·풍납동 토성·몽촌토성(25쪽)과 풍납동 토성·몽촌토성·석촌동 고분군(21쪽)을 그렸어요.
    - 아차산 보루는 여러 개가 모여 있어서 아차산 가운데쯤에 점 하나로 찍었어요.

- id: gungnae-hwando
  n: 고구려의 환도산성과 국내성
  era: 삼국
  f: 3
  t: 427
  view: [126.12, 41.11, 126.26, 41.17]
  src:
    - {b: 미래엔, p: 20, fig: 고구려의 환도산성과 국내성}
  d: 고구려는 졸본에서 압록강 가의 국내성(지금의 중국 지린성 지안)으로 도읍을 옮겼어요. 평지에 쌓은 국내성 가까이에는 위급할 때 들어가 싸우는 환도산성이 있었고, 둘레에는 장군총·무용총 같은 무덤과 광개토 대왕릉비가 남아 있어요.
  legend:
    - {k: city, n: 도성·산성}
    - {k: tomb, n: 무덤}
    - {k: stele, n: 비석}
  points:
    - {n: 국내성, at: [126.183, 41.126], k: city, ap: 1, s: 압록강 가 평지에 돌로 쌓은 고구려의 도성이에요. 427년 평양으로 옮기기 전까지 도읍이었어요.}
    - {n: 환도산성, at: [126.16, 41.152], k: city, ap: 1, s: 평지의 국내성을 지키려고 산 위에 쌓은 성이에요. 국내성과 2.5km쯤 떨어져 있고, 적이 쳐들어오면 이곳에서 맞섰어요.}
    - {n: 무용총, at: [126.195, 41.137], k: tomb, ap: 1, s: 춤추는 사람들과 사냥하는 모습이 그려진 벽화로 이름난 고구려 무덤이에요.}
    - {n: 장군총, at: [126.236, 41.158], k: tomb, ap: 1, s: 돌을 계단 모양으로 7층 쌓아 올린 고구려의 큰 무덤이에요.}
    - {n: 광개토 대왕릉비, at: [126.215, 41.149], k: stele, ap: 1, s: 장수왕이 아버지 광개토 대왕의 업적을 기려 세운 비석이에요(414).}
  labels:
    - {n: 압록강, at: [126.21, 41.113]}
  notes:
    - 미래엔 교과서의 그림 지도를 옮겼어요. 그림 지도라 거리와 방향이 실제와 조금 달라서, 유적은 실제 자리 근처에 대략 찍었어요.

- id: silla-gyeongju
  n: 신라의 수도 경주
  era: 삼국
  f: -57
  t: 935
  view: [129.200, 35.822, 129.240, 35.845]
  src:
    - {b: 미래엔, p: 22, fig: 신라의 수도 경주}
  d: 신라는 박혁거세를 중심으로 한 이주민 세력이 경주 지역의 토착 세력과 손잡고 세운 나라예요(기원전 57). 도읍 경주에는 왕이 살던 월성, 김알지가 태어났다는 계림, 큰 무덤이 모인 대릉원이 가까이 모여 있어요.
  legend:
    - {k: palace, n: 왕성}
    - {k: tomb, n: 무덤}
    - {k: place, n: 그 밖의 유적}
  points:
    - {n: 월성, at: [129.2245, 35.8308], k: palace, ap: 1, s: 신라의 왕이 살던 왕성이에요. 초승달처럼 생겨 반월성이라고도 불러요.}
    - {n: 계림, at: [129.219, 35.8337], k: place, ap: 1, s: 김씨 왕실의 조상 김알지가 태어났다는 이야기가 전해지는 숲이에요.}
    - {n: 대릉원, at: [129.2112, 35.8383], k: tomb, ap: 1, s: 삼국 통일 이전에 만든 거대한 무덤이 모여 있는 곳이에요.}
  notes:
    - 미래엔 교과서의 그림 지도를 옮겼어요. 그림에 이름 없이 그려진 탑·건물 그림은 넣지 않았어요.

- id: baekje-capitals
  n: 백제의 수도 변천
  era: 삼국
  f: -18
  t: 660
  y: 538
  steps: true
  view: [125.6, 35.4, 128.6, 38.2]
  src:
    - {b: 비상, p: 30, fig: "❺ 백제의 수도 변천"}
    - {b: 미래엔, p: 27, fig: 백제의 수도 이전}
  d: 백제는 한강 하류의 한성에서 나라를 키웠지만, 475년 고구려 장수왕에게 한성을 빼앗기자 금강 가의 웅진(공주)으로 도읍을 옮겼어요. 538년 성왕은 넓은 평야가 있고 금강 물길로 오가기 편한 사비(부여)로 다시 도읍을 옮겨 나라를 새롭게 일으키려 했어요.
  legend:
    - {k: capital, n: 백제의 도읍}
    - {k: move, n: 도읍을 옮긴 길}
  points:
    - {n: 한성, at: [127.12, 37.52], k: capital, t: 475, s: 백제 첫 도읍(지금의 서울 송파 일대)이에요. 한강 하류의 기름진 땅과 물길을 끼고 있었어요. 475년 고구려에 함락되었어요.}
    - {n: 웅진(공주), at: [127.13, 36.46], k: capital, y: 475, t: 538, s: 475년부터 538년까지의 도읍이에요. 금강과 산에 둘러싸여 지키기 좋았어요. 공산성이 남아 있어요.}
    - {n: 사비(부여), at: [126.91, 36.28], k: capital, y: 538, s: 538년 성왕이 옮긴 도읍이에요. 넓은 평야가 있고 금강을 끼고 있어 교통이 편리했어요. 이때 나라 이름을 잠시 남부여로 바꾸기도 했어요.}
  lines:
    - n: 웅진 천도 (475)
      k: move
      y: 475
      s: 한강 유역을 잃은 문주왕이 도읍을 웅진으로 옮겼어요.
      path: [[127.12, 37.5, 한성], [127.16, 37.0], [127.13, 36.48, 웅진]]
    - n: 사비 천도 (538)
