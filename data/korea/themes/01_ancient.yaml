    - {n: 황해, at: [125.9, 36.6]}
  notes:
    - 두 교과서 지도 모두 한성 → 웅진 → 사비로 이어지는 화살표만 그렸어요.

- id: silla-jinheung
  n: 6세기 신라의 영토 확장과 진흥왕의 비석
