    - {n: 격전지 (요동), at: [124.6, 41.45], k: battle, y: -109, ap: 1, s: 랴오허강 쪽에서 온 한의 육군과 맞선 곳이에요. 압록강 북쪽에 그려져 있고, 이름은 적혀 있지 않아요.}
    - {n: 격전지 (청천강 부근), at: [125.4, 39.72], k: battle, y: -109, ap: 1, s: 왕검성 북쪽 청천강 근처의 격전지예요. 이름은 적혀 있지 않아요.}
