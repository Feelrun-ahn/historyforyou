  d: 만주와 한반도에는 약 70만 년 전부터 사람이 살았어요. 구석기 사람들은 사냥과 채집으로 먹을거리를 구하며 옮겨 다녔고, 동굴이나 바위 그늘, 강가의 막집에서 지냈어요. 추운 빙하기에는 바닷물이 줄어 지금의 황해와 남해 대부분이 땅이었어요.
  legend:
    - {k: site, n: 주요 유적}
