- id: gojoseon-culture
  n: 고조선의 문화 범위
  era: 선사·고조선
  f: -2333
  t: -108
  y: -400
  view: [117.5, 33.0, 132.5, 46.0]
  src:
    - {b: 비상, p: 16, fig: 고조선의 문화 범위}
    - {b: 미래엔, p: 12, fig: 고조선의 문화권으로 추정되는 지역}
  d: 고조선은 랴오닝 지방에서 독자적인 청동기 문화를 이루며 우리 역사의 첫 나라로 일어섰어요. 비파형 동검과 탁자식 고인돌이 함께 나오는 곳을 이어 보면 고조선 문화가 퍼진 범위를 짐작할 수 있어요. 고조선의 중심지는 처음 요동 지역에 있다가 뒤에 한반도 서북부(평양 일대)로 옮겨 왔다고 봐요.
  legend:
    - {k: range, n: 고조선 문화 범위 (비상)}
    - {k: range_m, n: 고조선 관련 문화 범위 (미래엔)}
    - {k: dagger, n: 비파형 동검이 나온 곳}
    - {k: dolmen, n: 탁자식 고인돌이 있는 곳}
    - {k: place, n: 지명}
