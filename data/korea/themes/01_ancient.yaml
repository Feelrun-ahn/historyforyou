  d: 고조선은 한반도 남쪽 나라들과 한 사이의 중계 무역으로 이익을 얻으며 한과 맞섰어요. 기원전 109년 한 무제가 육지와 바다 두 길로 쳐들어오자 고조선은 거세게 버텼지만, 싸움이 길어지면서 지배층이 갈라지고 왕까지 살해되었어요. 결국 기원전 108년 수도 왕검성이 함락되어 고조선은 멸망했고, 한은 그 옛 땅에 군현을 두었어요.
  legend:
    - {k: han, n: 한의 공격}
    - {k: gojoseon, n: 고조선의 공격}
