    - {n: 검은모루 동굴, at: [126.08, 38.85], k: site, ap: 1, s: 평양 상원군의 동굴 유적이에요. 전기 구석기 유적으로 알려져 있어요.}
    - {n: 해상 동굴, at: [126.4, 38.33], k: site, ap: 1, s: 황해북도 평산의 동굴 유적이에요.}
