  src:
    - {b: 비상, p: 145, fig: "❷ 대동법의 확대 과정"}
  d: 집집마다 토산물을 바치던 공납을 토지 결수에 따라 쌀·옷감·동전으로 내게 한 대동법은 1608년 경기도에서 시작해 100년 만인 1708년 황해도까지 넓혀졌어요. 평안도와 함경도는 거둔 세금을 그 지역에서 쓰게 한 잉류 지역이었어요.
  legend:
    - {k: done, n: 대동법 실시 지역 (실시한 해)}
    - {k: ingryu, n: 잉류 지역 (실시하지 않음)}
  regions:
    - {id: 경기도, k: done, y: 1608, lab: "1608 광해군"}
    - {id: 강원도, k: done, y: 1623, lab: "1623 인조"}
    - {id: 울릉도, k: done, y: 1623}
    - {id: 충청도, k: done, y: 1651, lab: "1651 효종"}
    - {id: 전라도, k: done, y: 1658, lab: "1658 효종"}
    - {id: 경상도, k: done, y: 1678, lab: "1678 숙종"}
    - {id: 황해도, k: done, y: 1708, lab: "1708 숙종"}
    - {id: 평안도, k: ingryu, lab: 잉류 지역}
    - {id: 함경도, k: ingryu, lab: 잉류 지역}
  notes:
    - 제주는 교과서 지도에서 색이 분명하지 않아 칠하지 않았어요.
    - 도의 경계는 오늘날 시·도 경계를 합친 대략적인 모양이에요.
    - 경상도 실시 해는 교과서 지도를 따라 1678년으로 적었어요. 1677년(숙종 3)으로 적은 자료도 있어요.

