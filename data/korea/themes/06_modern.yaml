    - 이진용 의병장이 있는 황해도 지명은 교과서 글자가 작아 흐려요. 점의 자리와 이진용(이진룡)의 활동지를 보아 평산으로 적었어요.
    - 유성은 오늘날 대전 유성 자리에 찍었어요. 교과서 지도에서는 점이 이보다 남동쪽(경상도 서부 쪽)에 그려져 있어요.
    - 고산은 교과서 지도에 찍힌 자리(원산과 강릉 사이 동해안)를 따랐어요.
    - 교과서 지도는 김복한·민종식을 한 이름표로 홍성에 묶어 적었어요. 여기서는 김복한을 1895~1896년 점에, 민종식을 1905~1906년 점에 나누어 적었어요.
    - 한 고을에 여러 시기의 점이 있으면 교과서처럼 나란히 조금씩 비켜 찍었어요.
    - 의병 봉기 지역(초록 구역)의 테두리는 교과서 지도를 보고 대략 그렸어요.

- id: dokdo-location
  n: 독도의 지리적 위치
  era: 근대
  f: 1900
  t: 1905
  y: 1900
  view: [124.5, 33.5, 135.5, 39.5]
  src:
    - {b: 비상, p: 180, fig: 독도의 지리적 위치}
    - {b: 미래엔, p: 174, fig: "우리 땅 독도를 알리는 카드 뉴스 만들기 (독도 사진: 서도·동도)"}
  d: 독도는 울릉도에서 동남쪽으로 87.4km 떨어진 우리 고유의 영토예요. 지증왕 때(512) 신라의 영토가 된 뒤로 우리 기록과 지도에 꾸준히 나오고, 지금도 대한민국이 영토 주권을 행사하고 있어요. 일본은 러일 전쟁 중 독도를 불법으로 자기 영토에 편입했지만, 광복 뒤 독도는 우리 영토로 돌아왔어요.
  legend:
    - {k: island, n: 독도와 울릉도}
    - {k: place, n: 거리를 잰 곳}
    - {k: dist, n: 거리 (교과서 지도에 적힌 값)}
  labels:
    - {n: 대한민국, at: [128.2, 36.9]}
    - {n: 일본, at: [134.6, 35.2]}
  points:
    - {n: 독도, at: [131.8653, 37.2412], k: island, s: "경상북도 울릉군에 속한 대한민국의 섬이에요. 동도와 서도 두 섬과 그 둘레의 작은 바위섬들로 이루어져 있어요."}
    - {n: 울릉도, at: [130.8656, 37.505], k: island, s: 옛 우산국이 있던 섬이에요. 독도는 울릉도에서 87.4km 떨어져 있어요}
    - {n: 죽변, at: [129.42, 37.06], k: place, s: 경상북도 울진군 죽변이에요}
    - {n: 포항, at: [129.37, 36.03], k: place}
    - {n: 오키섬, at: [133.25, 36.25], k: place, s: 일본의 섬이에요. 독도에서 157.5km 떨어져 있어 울릉도보다 훨씬 멀어요}
  lines:
    - {n: "울릉도 ↔ 독도 87.4km", k: dist, arrow: false, path: [[130.8656, 37.505, 울릉도], [131.8653, 37.2412, 독도]]}
    - {n: "죽변 ↔ 울릉도 130.3km", k: dist, arrow: false, path: [[129.42, 37.06, 죽변], [130.8656, 37.505, 울릉도]]}
    - {n: "죽변 ↔ 독도 216.8km", k: dist, arrow: false, path: [[129.42, 37.06, 죽변], [131.8653, 37.2412, 독도]]}
    - {n: "포항 ↔ 독도 258.3km", k: dist, arrow: false, path: [[129.37, 36.03, 포항], [131.8653, 37.2412, 독도]]}
    - {n: "독도 ↔ 오키섬 157.5km", k: dist, arrow: false, path: [[131.8653, 37.2412, 독도], [133.25, 36.25, 오키섬]]}
  notes:
    - 「팔도총도」(『신증동국여지승람』, 1530년)는 울릉도와 독도(우산도)를 강원도 울진현에 속하는 두 섬으로 그렸어요.
    - 일본의 삼국접양지도(1785)는 죽도(울릉도)와 독도를 조선 영토 색으로 칠하고 '조선의 것'이라고 적었어요.
    - 일본의 은주시청합기(1667)는 일본의 북쪽 경계를 오키섬으로 한다고 적어 울릉도·독도를 일본 영토에서 뺐고, 태정관 지령(1877)은 죽도(울릉도)와 그 밖의 한 섬(독도)이 일본 영토가 아니라고 결정했어요.
    - 대한 제국 칙령 제41호(1900. 10. 25.)는 울도군이 울릉 전도와 죽도, 석도(독도)를 관할한다고 정했어요. 10월 25일은 이를 기념하는 독도의 날이에요(미래엔).
    - 선은 두 곳을 곧게 이은 것이고, 거리는 교과서 지도에 적힌 값이에요.

- id: provisional-governments-1919
  n: 국내외에 수립된 임시 정부
  era: 일제 강점기
