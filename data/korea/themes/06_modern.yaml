    - {b: 비상, p: 182, fig: "❸ 국내외에 수립된 임시 정부"}
  d: 3·1 운동을 전후해 연해주의 대한 국민 의회, 서울의 한성 정부, 상하이 임시 정부 등 여러 임시 정부가 세워졌어요. 독립운동을 하나로 이끌기 위해 이들은 1919년 9월 상하이의 대한민국 임시 정부로 통합되었어요. 각지의 임시 정부는 모두 민주 공화정을 지향했어요.
  legend:
    - {k: gov, n: 국내외에 세워진 임시 정부}
    - {k: kpg, n: "대한민국 임시 정부 (1919. 9.)"}
    - {k: merge, n: 대한민국 임시 정부로 통합}
  points:
    - {n: "대한 국민 의회 (1919. 3.)", at: [131.89, 43.12], k: gov, y: 1919, s: 연해주 블라디보스토크에 세워졌어요}
    - {n: "한성 정부 (1919. 4.)", at: [126.98, 37.57], k: gov, y: 1919, s: 국내 경성(서울)에 세워졌어요}
    - {n: "상하이 임시 정부 (1919. 4.)", at: [121.40, 31.30], k: gov, y: 1919, s: 중국 상하이에 세워졌어요}
