  d: 농업이 발달하고 대동법으로 공인이 등장하면서 조선 후기에는 상업이 크게 발달했어요. 전국 곳곳에 장시가 들어섰고 포구에서도 거래가 활발했어요. 청·일본과의 무역이 활기를 띠면서 송상, 내상 같은 대상인이 성장했고 상평통보가 전국에서 쓰였어요.
