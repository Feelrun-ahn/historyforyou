  d: 조선은 큰 나라인 명을 섬기고(사대) 이웃 나라와 가깝게 지내는(교린) 외교를 펼쳤어요. 세종은 최윤덕을 보내 압록강 쪽에 4군을, 김종서를 보내 두만강 쪽에 6진을 두어 오늘날과 같은 국경선을 확정했어요(1449년 완성). 왜구의 소굴인 대마도를 토벌(1419)한 뒤에는 부산포·제포·염포의 3포를 열어 일본과 제한된 무역을 허락했어요.
