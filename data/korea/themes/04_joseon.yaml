  lines:
    - n: 통신사 행로
      k: route
      s: 한성에서 부산까지는 육로로, 부산에서 오사카까지는 뱃길로, 오사카에서 에도까지는 다시 육로로 갔어요
      path: [[126.98, 37.57, 한성], [127.93, 36.99, 충주], [128.10, 36.75], [128.60, 35.87, 대구], [128.85, 35.50], [129.05, 35.12, 부산], [129.40, 34.85], [129.50, 34.50], [129.29, 34.20, 이즈하라], [129.45, 34.00], [129.69, 33.85, 가쓰모토], [130.10, 33.85], [130.45, 33.85], [130.75, 34.00], [130.94, 33.96, 시모노세키], [131.30, 33.85], [131.80, 33.83], [132.15, 33.82], [132.50, 34.02], [132.85, 34.18], [133.35, 34.33], [133.75, 34.43], [134.15, 34.62, 오카야마], [134.55, 34.70], [134.98, 34.60], [135.25, 34.60], [135.50, 34.69, 오사카], [135.76, 35.01, 교토], [136.25, 35.27], [136.91, 35.18, 나고야], [137.17, 34.95], [137.73, 34.71, 하마마쓰], [138.38, 34.97], [139.05, 35.20], [139.45, 35.40], [139.76, 35.68, 에도]]
