    - {k: port, n: 통신사 기항지}
    - {k: stop, n: 거쳐 간 곳}
    - {k: capital, n: 출발지와 도착지}
  labels:
    - {n: 조선, at: [127.9, 36.4]}
    - {n: 일본, at: [137.6, 36.3]}
    - {n: 황해, at: [125.9, 35.6]}
